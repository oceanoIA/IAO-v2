<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Neural Sphere</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    color: #ffcc00;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* CANVAS PRINCIPALE */
#canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* METADATI HUD SULLE CORNICI */
.hud-meta {
    position: fixed;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255, 170, 0, 0.5);
    z-index: 5;
    pointer-events: none;
    font-family: monospace;
    text-transform: uppercase;
}

.top-left { top: 25px; left: 25px; border-left: 2px solid rgba(255, 170, 0, 0.6); padding-left: 10px; }
.top-right { top: 25px; right: 25px; border-right: 2px solid rgba(255, 170, 0, 0.6); padding-right: 10px; text-align: right; }

/* TITOLO E STATO */
.header-title {
    position: fixed;
    top: 25px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.header-title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(255, 180, 0, 0.8), 0 0 24px rgba(255, 120, 0, 0.4);
}

.header-title .status {
    margin-top: 5px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255, 180, 0, 0.7);
    font-family: monospace;
}

.header-title .status b {
    color: #ffaa00;
    text-shadow: 0 0 8px #ffaa00;
}

/* CHAT TERMINALE */
#chat {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    bottom: 90px;
    max-height: 25vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 20px;
    z-index: 10;
    scrollbar-width: none;
}

#chat::-webkit-scrollbar {
    display: none;
}

.message {
    max-width: 80%;
    padding: 12px 18px;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 4px;
    backdrop-filter: blur(12px);
    word-break: break-word;
}

.user {
    align-self: flex-end;
    background: rgba(255, 170, 0, 0.08);
    border: 1px solid rgba(255, 170, 0, 0.35);
    border-right: 3px solid #ffaa00;
    color: #ffffff;
}

.jarvis {
    align-self: flex-start;
    background: rgba(20, 10, 0, 0.75);
    border: 1px solid rgba(255, 170, 0, 0.2);
    border-left: 3px solid #ffaa00;
    color: #ffe8b3;
}

/* CONTENITORE INPUT */
.input-container {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    bottom: 25px;
    padding: 0 20px;
    z-index: 20;
}

.input-box {
    display: flex;
    gap: 10px;
    background: rgba(12, 6, 0, 0.85);
    border: 1px solid rgba(255, 170, 0, 0.35);
    border-radius: 6px;
    padding: 4px;
    backdrop-filter: blur(16px);
    transition: border-color 0.3s, box-shadow 0.3s;
}

.input-box:focus-within {
    border-color: rgba(255, 170, 0, 0.9);
    box-shadow: 0 0 20px rgba(255, 170, 0, 0.25);
}

input {
    flex: 1;
    height: 44px;
    padding: 0 16px;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 14px;
    font-family: inherit;
}

input::placeholder {
    color: rgba(255, 220, 150, 0.35);
}

button {
    width: 80px;
    height: 44px;
    background: rgba(255, 170, 0, 0.15);
    border: 1px solid rgba(255, 170, 0, 0.5);
    border-radius: 4px;
    color: #ffaa00;
    font-family: monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover:not(:disabled) {
    background: #ffaa00;
    color: #000000;
    box-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
}

button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

@media (max-width: 600px) {
    .hud-meta { display: none; }
    .header-title h1 { font-size: 20px; letter-spacing: 8px; }
    .message { max-width: 90%; }
}
</style>
</head>

<body>

<div class="hud-meta top-left">
    MATRIX: JARVIS_CORE_V2<br>
    STATUS: ACTIVE NEURAL SPHERE
</div>

<div class="hud-meta top-right">
    NODE DENSITY: HIGH<br>
    FREQ: 520 THz
</div>

<div class="header-title">
    <h1>J.A.R.V.I.S.</h1>
    <div class="status">
        <b>●</b> NEURAL MATRIX ONLINE
    </div>
</div>

<canvas id="canvas-container"></canvas>

<div id="chat">
    <div class="message jarvis">
        Inizializzazione matrice completata. In attesa di istruzioni.
    </div>
</div>

<div class="input-container">
    <div class="input-box">
        <input id="input" type="text" placeholder="Comunica con la matrice..." autocomplete="off">
        <button id="send">EXEC</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas-container");
const ctx = canvas.getContext("2d");

let width, height, dpr, centerX, centerY;
let thinking = false;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = width / 2;
    centerY = height / 2 - 30;

    initNeuralSphere();
}

window.addEventListener("resize", resize);

/* =====================================================
   MATRICE SFERICA 3D - EFFETTO JARVIS (ORANGE/GOLD)
===================================================== */

const NODE_COUNT = 180;
const nodes = [];

function initNeuralSphere() {
    nodes.length = 0;
    // Raggio sferico aumentato a 0.34
    const baseRadius = Math.min(width, height) * 0.34;

    for (let i = 0; i < NODE_COUNT; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        
        const r = baseRadius * (0.65 + Math.random() * 0.55);

        nodes.push({
            r: r,
            theta: theta,
            phi: phi,
            speedTheta: (Math.random() * 0.005 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
            speedPhi: (Math.random() * 0.003 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
            size: Math.random() * 2.0 + 1.2,
            pulsePhase: Math.random() * Math.PI * 2
        });
    }
}

let rotY = 0;
let rotX = 0;

function animate() {
    requestAnimationFrame(animate);

    ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
    ctx.fillRect(0, 0, width, height);

    const time = performance.now() * 0.001;
    const speedMult = thinking ? 3.0 : 1.0;

    rotY += 0.004 * speedMult;
    rotX += 0.0012 * speedMult;

    // Raggio sferico aumentato
    const currentRadius = Math.min(width, height) * 0.34;

    // 1. ALONE DORATO CENTRALE ESPANSO
    const glowRadius = thinking ? currentRadius * 1.5 : currentRadius * 1.25;
    const coreGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius);
    coreGlow.addColorStop(0, "rgba(255, 230, 150, 0.95)");
    coreGlow.addColorStop(0.25, "rgba(255, 170, 0, 0.55)");
    coreGlow.addColorStop(0.65, "rgba(200, 80, 0, 0.15)");
    coreGlow.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(centerX, centerY, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // 2. CALCOLO E PROIEZIONE 3D DEI NODI
    const projectedNodes = [];

    nodes.forEach(n => {
        n.theta += n.speedTheta * speedMult;
        n.phi += n.speedPhi * speedMult;

        let x = n.r * Math.sin(n.phi) * Math.cos(n.theta);
        let y = n.r * Math.cos(n.phi);
        let z = n.r * Math.sin(n.phi) * Math.sin(n.theta);

        let rx1 = x * Math.cos(rotY) + z * Math.sin(rotY);
        let rz1 = -x * Math.sin(rotY) + z * Math.cos(rotY);

        let ry2 = y * Math.cos(rotX) - rz1 * Math.sin(rotX);
        let rz2 = y * Math.sin(rotX) + rz1 * Math.cos(rotX);

        // Adattamento della prospettiva per il raggio maggiore
        const perspective = 450 / (450 + rz2);
        const projX = centerX + rx1 * perspective;
        const projY = centerY + ry2 * perspective;
        const alpha = Math.max(0.12, Math.min(1, (rz2 + currentRadius) / (currentRadius * 2)));

        projectedNodes.push({
            projX, projY, rz2, alpha, perspective,
            size: n.size * perspective,
            pulse: (Math.sin(time * 4 + n.pulsePhase) + 1) / 2
        });
    });

    projectedNodes.sort((a, b) => a.rz2 - b.rz2);

    // 3. RETE SINAPTICA DORATA (SOGLIA DISTANZA PIÙ AMPIA)
    for (let i = 0; i < projectedNodes.length; i++) {
        for (let j = i + 1; j < projectedNodes.length; j++) {
            const n1 = projectedNodes[i];
            const n2 = projectedNodes[j];

            const dx = n1.projX - n2.projX;
            const dy = n1.projY - n2.projY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 90) {
                const lineAlpha = (1 - dist / 90) * 0.35 * n1.alpha;
                ctx.beginPath();
                ctx.moveTo(n1.projX, n1.projY);
                ctx.lineTo(n2.projX, n2.projY);
                ctx.strokeStyle = `rgba(255, 180, 20, ${lineAlpha})`;
                ctx.lineWidth = 0.7;
                ctx.stroke();
            }
        }
    }

    // 4. NODI LUMINOSI ED IMPULSI
    projectedNodes.forEach(n => {
        if (Math.random() < 0.015) {
            ctx.beginPath();
            ctx.moveTo(n.projX, n.projY);
            ctx.lineTo(centerX, centerY);
            ctx.strokeStyle = `rgba(255, 220, 100, ${0.25 * n.alpha})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
        }

        ctx.fillStyle = `rgba(255, 245, 200, ${n.alpha})`;
        ctx.beginPath();
        ctx.arc(n.projX, n.projY, n.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255, 160, 0, ${n.alpha * 0.4 * n.pulse})`;
        ctx.beginPath();
        ctx.arc(n.projX, n.projY, n.size * 3.5, 0, Math.PI * 2);
        ctx.fill();
    });
}

resize();
animate();

/* =====================================================
   LOGICA CHAT E API
===================================================== */

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

send.addEventListener("click", sendMessage);
input.addEventListener("keydown", event => {
    if (event.key === "Enter") sendMessage();
});

async function sendMessage() {
    const text = input.value.trim();
    if (!text || input.disabled) return;

    input.disabled = true;
    send.disabled = true;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chat.appendChild(userMsg);

    input.value = "";

    const jarvisMsg = document.createElement("div");
    jarvisMsg.className = "message jarvis";
    jarvisMsg.textContent = "Elaborazione matrice in corso...";
    chat.appendChild(jarvisMsg);

    thinking = true;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://iao-ai-v3.oceano-masoud.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Errore API");

        const data = await response.json();
        jarvisMsg.textContent = data.reply || "Nessun dato di risposta disponibile.";
    } catch (error) {
        jarvisMsg.textContent = "Sistemi offline. Impossibile contattare la matrice JARVIS.";
    } finally {
        setTimeout(() => { thinking = false; }, 500);
        input.disabled = false;
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}
</script>

</body>
</html>
