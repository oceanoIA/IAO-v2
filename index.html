<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — NEURAL CORE</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#168cff;

    transition:opacity 1.4s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    /*
       IMPORTANTE:
       niente blur durante ascolto/parlato.
    */
    filter:none !important;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

body.mapMode #neuralCanvas{
    opacity:0;
    transform:scale(.45);
    pointer-events:none;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    top:20px;
    left:0;
    width:100%;

    text-align:center;

    z-index:20;
    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;
    font-weight:300;
    letter-spacing:12px;

    color:#fff;

    text-shadow:
        0 0 12px rgba(40,150,255,.8),
        0 0 30px rgba(20,120,255,.55),
        0 0 60px rgba(0,90,255,.3);
}

.status{
    margin-top:7px;

    font:10px monospace;
    letter-spacing:3px;

    color:rgba(210,235,255,.75);
}

#dot{
    color:#168cff;

    text-shadow:
        0 0 8px #168cff,
        0 0 18px #168cff;
}

/* =====================================================
   CLOCK
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;
    font-family:monospace;
}

#clock{
    font-size:15px;
    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 10px rgba(40,150,255,.5);
}

#date{
    margin-top:3px;

    font-size:9px;
    letter-spacing:2px;

    color:rgba(120,190,255,.7);
}

/* =====================================================
   MAP HUD
===================================================== */

#mapHud{
    position:fixed;

    z-index:15;

    left:50%;
    top:90px;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;
    pointer-events:none;

    font:11px monospace;
    letter-spacing:3px;

    text-align:center;

    color:#5eb8ff;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

body.mapMode #mapHud{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

#mapTitle{
    font-size:16px;
    letter-spacing:5px;

    margin-bottom:6px;

    text-shadow:
        0 0 15px #168cff,
        0 0 30px rgba(20,120,255,.5);
}

#coordinates{
    font-size:10px;

    color:rgba(180,220,255,.85);
}

/* =====================================================
   EARTH
===================================================== */

#earthContainer{
    position:fixed;
    inset:0;

    z-index:2;

    opacity:0;
    pointer-events:none;

    transform:scale(.55);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

body.mapMode #earthContainer{
    opacity:1;
    transform:scale(1);

    pointer-events:auto;
}

#earthCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

/* =====================================================
   CROSSHAIR
===================================================== */

#mapCrosshair{
    position:fixed;

    z-index:12;

    left:50%;
    top:50%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    opacity:0;

    pointer-events:none;

    transition:opacity .8s ease;
}

body.mapMode #mapCrosshair{
    opacity:.35;
}

#mapCrosshair::before,
#mapCrosshair::after{
    content:"";

    position:absolute;

    background:#168cff;

    box-shadow:
        0 0 8px #168cff,
        0 0 18px rgba(20,130,255,.5);
}

#mapCrosshair::before{
    width:25px;
    height:1px;

    top:12px;
    left:0;
}

#mapCrosshair::after{
    width:1px;
    height:25px;

    left:12px;
    top:0;
}

/* =====================================================
   LOCATION
===================================================== */

#locationInfo{
    position:fixed;

    z-index:18;

    left:50%;
    top:58%;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:10px 18px;

    background:
        rgba(0,12,25,.72);

    border:
        1px solid
        rgba(50,160,255,.45);

    border-radius:12px;

    font:11px monospace;
    letter-spacing:2px;

    text-align:center;

    box-shadow:
        0 0 25px rgba(0,130,255,.15),
        inset 0 0 20px rgba(30,140,255,.04);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

#locationInfo.visible{
    opacity:1;

    transform:
        translate(-50%,0);
}

#locationName{
    font-size:14px;

    color:#fff;

    margin-bottom:4px;
}

#locationCoords{
    color:#4faaff;
}

/* =====================================================
   CHAT VOCALE
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:50%;
    top:70%;

    transform:
        translateX(-50%);

    width:min(
        600px,
        calc(100% - 40px)
    );

    max-height:120px;

    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:7px;

    pointer-events:none;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 20%,
            black 80%,
            transparent
        );
}

.message{
    padding:7px 13px;

    border-radius:14px;

    font-size:12px;
    line-height:1.4;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    animation:
        messageIn .5s ease;

    text-align:center;

    max-width:90%;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.user{
    background:
        rgba(20,130,255,.08);

    border:
        1px solid
        rgba(30,150,255,.25);

    color:#dff2ff;
}

.jarvis{
    background:
        rgba(0,10,20,.55);

    border:
        1px solid
        rgba(40,150,255,.22);

    border-left:
        2px solid #168cff;

    color:#dcecff;

    box-shadow:
        0 0 25px rgba(20,130,255,.06);
}

/* =====================================================
   VOICE CORE
===================================================== */

#voiceCore{
    position:fixed;

    left:50%;
    bottom:35px;

    transform:
        translateX(-50%);

    width:58px;
    height:58px;

    z-index:40;

    border-radius:50%;

    border:
        1px solid
        rgba(30,150,255,.5);

    background:
        radial-gradient(
            circle,
            rgba(30,150,255,.18),
            rgba(0,10,20,.55)
        );

    color:#4da8ff;

    box-shadow:
        0 0 20px rgba(20,130,255,.18),
        inset 0 0 20px rgba(30,150,255,.08);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .7s ease,
        background .7s ease,
        box-shadow .7s ease,
        border-color .7s ease;
}

#voiceCore:hover{
    transform:
        translateX(-50%)
        scale(1.04);
}

#voiceCore.active{
    background:
        radial-gradient(
            circle,
            rgba(40,160,255,.42),
            rgba(0,20,45,.72)
        );

    border-color:#168cff;

    box-shadow:
        0 0 25px rgba(20,140,255,.55),
        0 0 55px rgba(20,100,255,.28),
        inset 0 0 25px rgba(40,160,255,.2);

    animation:
        voicePulse 2.4s ease-in-out infinite;
}

@keyframes voicePulse{

    0%,100%{
        box-shadow:
            0 0 22px rgba(20,140,255,.45),
            0 0 45px rgba(20,100,255,.18);
    }

    50%{
        box-shadow:
            0 0 35px rgba(30,160,255,.8),
            0 0 70px rgba(20,110,255,.32);
    }
}

/* =====================================================
   ICON
===================================================== */

.icon{
    width:23px;
    height:23px;

    display:block;

    stroke:currentColor;
    fill:none;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;

    pointer-events:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{
        font-size:20px;
        letter-spacing:8px;
    }

    #clockPanel{
        top:15px;
        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #mapHud{
        top:65px;
    }

    #mapTitle{
        font-size:13px;
    }

    #voiceCore{
        bottom:25px;

        width:54px;
        height:54px;
    }

    #chat{
        top:68%;

        width:
            calc(100% - 30px);
    }
}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }
}
</style>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =====================================================
   API
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const neuralCanvas =
    document.getElementById("neuralCanvas");

const neuralCtx =
    neuralCanvas.getContext("2d");

const earthCanvas =
    document.getElementById("earthCanvas");

const voiceCore =
    document.getElementById("voiceCore");

const chat =
    document.getElementById("chat");

const dot =
    document.getElementById("dot");

const statusText =
    document.getElementById("statusText");

const clock =
    document.getElementById("clock");

const date =
    document.getElementById("date");

const coordinates =
    document.getElementById("coordinates");

const locationInfo =
    document.getElementById("locationInfo");

const locationName =
    document.getElementById("locationName");

const locationCoords =
    document.getElementById("locationCoords");


/* =====================================================
   STATO
===================================================== */

let state="idle";

let busy=false;

let listening=false;

let wakeMode=true;

let recognition=null;

let wakeRecognition=null;


/*
   Intensità audio simulata/dinamica.
   Questa viene utilizzata dal Neural Core
   per creare le deformazioni.
*/

let voiceEnergy=0;

let targetVoiceEnergy=0;


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    memory=JSON.parse(
        localStorage.getItem("jarvis_memory") || "[]"
    );

}catch{

    memory=[];
}

memory=memory.slice(-40);


function saveMemory(){

    memory=
        memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );
}


function remember(role,content){

    if(!content)return;

    memory.push({

        role,
        content,
        time:Date.now()

    });

    saveMemory();
}


/* =====================================================
   STATO
===================================================== */

function setState(newState){

    state=newState;

    if(
        newState==="listening" ||
        newState==="thinking" ||
        newState==="speaking"
    ){

        dot.style.color="#168cff";

        voiceCore.classList.add(
            "active"
        );

    }else{

        dot.style.color="#168cff";

        voiceCore.classList.remove(
            "active"
        );
    }
}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now=
        new Date();

    clock.textContent=
        now.toLocaleTimeString(
            "it-IT"
        );

    date.textContent=
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(type,text){

    const element=
        document.createElement("div");

    element.className=
        "message "+type;

    element.textContent=
        text;

    chat.appendChild(
        element
    );

    while(
        chat.children.length>4
    ){

        chat.removeChild(
            chat.firstChild
        );
    }

    return element;
}


/* =====================================================
   THREE.JS
===================================================== */

const earthScene=
    new THREE.Scene();

const earthCamera=
    new THREE.PerspectiveCamera(
        45,
        innerWidth/innerHeight,
        .1,
        100
    );

earthCamera.position.set(
    0,
    0,
    3.3
);

const earthRenderer=
    new THREE.WebGLRenderer({

        canvas:earthCanvas,

        antialias:true,

earthRenderer.setPixelRatio(
    Math.min(

earthRenderer.setSize(

/* =====================================================
   LUCI
===================================================== */

const ambientLight=

        0x7890aa,
        1.1
    );

earthScene.add(
    ambientLight
);

const sun=
    new THREE.DirectionalLight(
        0xffffff,

sun.position.set(
    5,
    3,
    5

earthScene.add(

/* =====================================================
   TERRA
===================================================== */

const earthGroup=

earthScene.add(

const earthGeometry=
    new THREE.SphereGeometry(

const textureLoader=

const earthTexture=

        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"

const earthMaterial=

const earth=

earthGroup.add(

/* =====================================================
   ATMOSFERA
===================================================== */

const atmosphere=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.035,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:0x168cff,

            transparent:true,

earthGroup.add(

/* =====================================================
   GLOW
===================================================== */

const earthGlow=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.08,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:0x168cff,

            opacity:.05,

            side:THREE.BackSide

        })

earthGroup.add(
    earthGlow

/* =====================================================
   MARKER
===================================================== */

const marker=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .022,
            24,

        ),

        })

marker.visible=false;

earthGroup.add(

const markerRing=

markerRing.visible=false;

earthGroup.add(
    markerRing

/* =====================================================
   CONTROLLI
===================================================== */

const controls=

        earthCanvas
    );

controls.enableDamping=true;

controls.dampingFactor=.06;

controls.enablePan=false;

controls.minDistance=1.25;

controls.maxDistance=6;


/* =====================================================
   MAPPA
===================================================== */

let mapMode=false;


function openMap(){

    if(mapMode)return;

    mapMode=true;

    document.body.classList.add(
        "mapMode"
    );

    statusText.textContent=
        "EARTH NAVIGATION ONLINE";

function closeMap(){

    mapMode=false;

    locationInfo.classList.remove(

    );

/* =====================================================
   COMANDI MAPPA
===================================================== */

function isMapCommand(text){

    const t=
        text.toLowerCase();

    return(

        t.includes("apri la mappa") ||
        t.includes("apri mappa") ||
        t.includes("mostrami la mappa") ||
        t.includes("mostra la mappa") ||
        t.includes("mappa del mondo") ||
        t==="mappa"

    );
}


function extractLocation(text){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower=
        text.toLowerCase();

    for(
        const prefix of patterns
    ){

        const index=
            lower.indexOf(
                prefix
            );

        if(index!==-1){

            let place=
                text.substring(
                    index+
                    prefix.length
                ).trim();

            place=
                place.replace(
                    /^(la|il|lo|un|una|a|ad)\s+/i,
                    ""
                );

            if(place.length>1){

                return place;
            }
        }
    }

    return null;
}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(place){

    setState(
        "thinking"
    );

    coordinates.textContent=
        "SEARCHING LOCATION...";

    try{

        const url=
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(place);

        const response=
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );
        }

        const results=
            await response.json();

        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );
        }

        const result=
            results[0];

        const lat=
            parseFloat(
                result.lat
            );

        const lon=
            parseFloat(
                result.lon
            );

        const name=
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");

        showLocation(
            name,
            lat,
            lon
        );

        return{
            name,
            lat,
            lon
        };

    }catch(error){

        console.error(
            error
        );

        coordinates.textContent=
            "LOCATION NOT FOUND";

        setState(
            "idle"
        );

        return null;
    }
}


/* =====================================================
   COORDINATE
===================================================== */

function formatCoordinates(
    lat,
    lon
){

    const latDir=
        lat>=0 ? "N" : "S";

    const lonDir=
        lon>=0 ? "E" : "W";

    return(

        Math.abs(lat).toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon).toFixed(4)
        +
        "° "
        +
        lonDir

    );
}


function showLocation(
    name,
    lat,
    lon
){

    locationName.textContent=
        name;

    locationCoords.textContent=
        formatCoordinates(
            lat,
            lon
        );

    coordinates.textContent=
        formatCoordinates(
            lat,
            lon
        );

    locationInfo.classList.add(
        "visible"
    );

    focusEarth(
        lat,
        lon
    );
}


/* =====================================================
   GEOLOCALIZZAZIONE
===================================================== */

function showMyLocation(){

    if(
        !navigator.geolocation
    ){

        return;
    }

    setState(
        "thinking"
    );

    navigator.geolocation.getCurrentPosition(

        position=>{

            const lat=
                position.coords.latitude;

            const lon=
                position.coords.longitude;

            showLocation(
                "La mia posizione",
                lat,
                lon
            );

        },

        error=>{

            console.log(
                error
            );

            setState(
                "idle"
            );
        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }
    );
}


/* =====================================================
   FOCUS TERRA
===================================================== */

let zoomAnimating=false;

let zoomProgress=1;

let zoomStart=3.3;

let zoomEnd=1.55;

let targetQuaternion=
    new THREE.Quaternion();


function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi=
        (90-lat)
        *
        Math.PI/180;

    const theta=
        (lon+180)
        *
        Math.PI/180;

    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );
}


function focusEarth(
    lat,
    lon
){

    openMap();

    const target=
        latLonToVector3(
            lat,
            lon,
            1
        );

    marker.position.copy(
        target
        .clone()
        .multiplyScalar(1.025)
    );

    marker.visible=true;

    markerRing.visible=true;

    const direction=
        target
        .clone()
        .normalize();

    const front=
        new THREE.Vector3(
            0,
            0,
            1
        );

    targetQuaternion=
        new THREE.Quaternion();

    targetQuaternion.setFromUnitVectors(
        direction,
        front
    );

    zoomStart=
        earthCamera.position.length();

    if(
        zoomStart<2
    ){

        zoomStart=3.3;

        earthCamera.position.set(
            0,
            0,
            zoomStart
        );
    }

    zoomProgress=0;

    zoomAnimating=true;

    controls.enabled=false;

    setState(
        "thinking"
    );
}


/* =====================================================
   NEURAL CORE
===================================================== */

let neuralWidth=
    innerWidth;

let neuralHeight=
    innerHeight;

let neuralCx=
    neuralWidth/2;

let neuralCy=
    neuralHeight/2;

let neuralRadius=
    Math.min(
        neuralWidth,
        neuralHeight
    )*.34;

let neuralRotation=0;

let nodes=[];


/* =====================================================
   CREA NEURONI
===================================================== */

function createNeuralNodes(){

    nodes=[];

    /*
       Tantissimi piccoli neuroni.
    */

    const amount=
        innerWidth < 600
        ? 480
        : 680;

    for(
        let i=0;
        i<amount;
        i++
    ){

        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .70+
                    Math.random()*.62
                ),

            size:
                .32+
                Math.random()*.72,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            special:
                Math.random()<.055,

            colorPhase:
                Math.random()
                *
                Math.PI
                *
                2,

            /*
               Frequenza individuale.
            */

            frequency:
                .5+
                Math.random()*2

        });
    }
}


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth=
        innerWidth;

    neuralHeight=
        innerHeight;

    const dpr=
        Math.min(
            devicePixelRatio || 1,
            2
        );

    neuralCanvas.width=
        neuralWidth*dpr;

    neuralCanvas.height=
        neuralHeight*dpr;

    neuralCanvas.style.width=
        neuralWidth+"px";

    neuralCanvas.style.height=
        neuralHeight+"px";

    neuralCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    neuralCx=
        neuralWidth/2;

    neuralCy=
        neuralHeight/2;

    neuralRadius=
        Math.min(
            neuralWidth,
            neuralHeight
        )*.34;

    createNeuralNodes();
}


/* =====================================================
   NEURAL ANIMATION
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );

    const time=
        performance.now()/1000;


    /* =================================================
       ENERGIA
    ================================================= */

    let baseEnergy=.035;

    if(
        state==="listening"
    ){

        baseEnergy=.28;

    }

    if(
        state==="thinking"
    ){

        baseEnergy=.42;

    }

    if(
        state==="speaking"
    ){

        baseEnergy=.34;

    }


    /*
       Movimento naturale anche da fermo.
    */

    const naturalWave=
        (
            Math.sin(time*2.0)+1
        )*.5;

    targetVoiceEnergy=
        Math.max(
            baseEnergy,
            voiceEnergy
        );


    voiceEnergy +=
        (
            targetVoiceEnergy-
            voiceEnergy
        )*.12;


    /*
       Quando il volume aumenta,
       il Neural Core si espande.
    */

    const energy=
        voiceEnergy;


    /* =================================================
       ROTAZIONE
    ================================================= */

    neuralRotation +=
        .0018+
        energy*.009;


    /* =================================================
       PULIZIA CANVAS
    ================================================= */

    /*
       Niente sfocatura.

       Il vecchio effetto "fade"
       viene tenuto molto basso solo
       per creare una scia minima.
    */

    neuralCtx.fillStyle=
        "rgba(0,0,0,.28)";

    neuralCtx.fillRect(
        0,
        0,
        neuralWidth,
        neuralHeight
    );


    /* =================================================
       COLORE BLU FUTURISTICO
    ================================================= */

    const r=35;

    const g=150;

    const b=255;


    /* =================================================
       PULSAZIONE
    ================================================= */

    const pulse=
        (
            Math.sin(
                time*2.5
            )+1
        )/2;


    /* =================================================
       GLOW CENTRALE
    ================================================= */

    const glowRadius=
        neuralRadius*
        (
            .72+
            energy*.55+
            pulse*.08
        );

    const gradient=
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glowRadius

        );

    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},${.18+energy*.12})`
    );

    gradient.addColorStop(
        .35,
        `rgba(${r},${g},${b},.055)`
    );

    gradient.addColorStop(
        .72,
        `rgba(${r},${g},${b},.012)`
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    neuralCtx.fillStyle=
        gradient;

    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        glowRadius,
        0,
        Math.PI*2
    );

    neuralCtx.fill();


    /* =================================================
       PROIEZIONE
    ================================================= */

    const projected=[];

    nodes.forEach(n=>{

        /*
           Onda individuale.

           I neuroni non diventano sfocati:
           cambiano posizione e distanza.
        */

        const wave=

            Math.sin(
                time*n.frequency+
                n.phase
            );

        /*
           Effetto "pompa".

           Il nucleo si espande quando
           aumenta la voce.
        */

        const pump=
            energy*
            (
                7+
                wave*3
            );

        /*
           Onda sferica che attraversa
           il Neural Core.
        */

        const travellingWave=
            Math.sin(
                n.r*.035-
                time*4.2+
                n.phase
            )
            *
            energy
            *
            5;

        const rr=
            n.r+
            pump+
            travellingWave;


        const angle=
            n.theta+
            neuralRotation;


        let x=
            rr*
            Math.sin(n.phi)*
            Math.cos(angle);

        let y=
            rr*
            Math.cos(n.phi);

        let z=
            rr*
            Math.sin(n.phi)*
            Math.sin(angle);


        /*
           Movimento laterale.

           Più energia =
           più movimento.
        */

        x +=
            Math.sin(
                time*1.4+
                n.phase
            )
            *
            energy
            *
            5;

        y +=
            Math.cos(
                time*1.7+
                n.phase
            )
            *
            energy
            *
            5;


        /*
           Prospettiva.
        */

        const perspective=
            430/
            (
                430+
                z
            );


        projected.push({

            x:
                neuralCx+
                x*perspective,

            y:
                neuralCy+
                y*perspective,

            z,

            size:
                n.size*
                perspective,

            alpha:
                Math.max(
                    .22,
                    Math.min(
                        1,
                        (z+neuralRadius)/
                        (neuralRadius*2)
                    )
                ),

            phase:
                n.phase,

            special:
                n.special

        });

    });


    /* =================================================
       CONNESSIONI
    ================================================= */

    /*
       Le connessioni diventano più numerose
       durante la voce.

       Danno l'impressione che i neuroni
       si uniscano temporaneamente.
    */

    const maxDist=
        48+
        energy*48;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        for(
            let j=i+1;
            j<projected.length;
            j++
        ){

            const a=
                projected[i];

            const c=
                projected[j];


            if(
                Math.abs(
                    a.z-c.z
                )
                >
                neuralRadius*.65
            ){

                continue;
            }


            const dx=
                a.x-c.x;

            const dy=
                a.y-c.y;

            const dist=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                dist<maxDist
            ){

                /*
                   Più vicino =
                   linea più luminosa.
                */

                const strength=
                    (
                        1-
                        dist/maxDist
                    );


                const alpha=
                    strength*
                    (
                        .055+
                        energy*.24
                    )
                    *
                    a.alpha;


                neuralCtx.beginPath();

                neuralCtx.moveTo(
                    a.x,
                    a.y
                );

                neuralCtx.lineTo(
                    c.x,
                    c.y
                );


                neuralCtx.strokeStyle=
                    `rgba(${r},${g},${b},${alpha})`;


                neuralCtx.lineWidth=
                    .28+
                    energy*.75;


                neuralCtx.stroke();
            }
        }
    }


    /* =================================================
       ONDE CIRCOLARI
    ================================================= */

    /*
       Quando c'è energia,
       alcune onde partono dal centro.
    */

    if(
        energy>.12
    ){

        for(
            let ring=0;
            ring<3;
            ring++
        ){

            const ringProgress=
                (
                    time*0.65+
                    ring*.32
                )
                %
                1;

            const ringRadius=
                ringProgress*
                neuralRadius*
                1.35;

            const ringAlpha=
                (
                    1-
                    ringProgress
                )
                *
                energy
                *
                .15;


            neuralCtx.beginPath();

            neuralCtx.arc(

                neuralCx,
                neuralCy,

                ringRadius,

                0,
                Math.PI*2

            );

            neuralCtx.strokeStyle=
                `rgba(${r},${g},${b},${ringAlpha})`;

            neuralCtx.lineWidth=
                .5+
                energy*.7;

            neuralCtx.stroke();
        }
    }


    /* =================================================
       NEURONI
    ================================================= */

    projected.forEach(n=>{

        /*
           Piccolo tremolio luminoso.
        */

        const flicker=
            (
                Math.sin(
                    time*4+
                    n.phase
                )+1
            )*.5;


        /*
           Le palline restano piccole.
        */

        const size=
            n.size+
            flicker*.18+
            energy*.5;


        let particleR=r;

        let particleG=g;

        let particleB=b;


        /*
           Alcuni neuroni
           diventano quasi bianchi.
        */

        if(
            n.special
        ){

            particleR=125;

            particleG=215;

            particleB=255;
        }


        /*
           Halo piccolo e nitido.

           NON è un blur del canvas:
           è semplicemente un alone
           disegnato dietro alla particella.
        */

        neuralCtx.fillStyle=
            `rgba(
                ${particleR},
                ${particleG},
                ${particleB},
                ${n.alpha*.12}
            )`;

        neuralCtx.beginPath();

        neuralCtx.arc(
            n.x,
            n.y,
            size*2.8+
            energy*1.5,
            0,
            Math.PI*2
        );

        neuralCtx.fill();


        /*
           Particella principale.
        */

        neuralCtx.fillStyle=
            `rgba(
                ${particleR},
                ${particleG},
                ${particleB},
                ${n.alpha*.96}
            )`;

        neuralCtx.beginPath();

        neuralCtx.arc(
            n.x,
            n.y,
            size,
            0,
            Math.PI*2
        );

        neuralCtx.fill();


        /*
           Punto bianco centrale
           sui neuroni speciali.
        */

        if(
            n.special &&
            size>0.7
        ){

            neuralCtx.fillStyle=
                `rgba(
                    230,
                    250,
                    255,
                    ${n.alpha*.8}
                )`;

            neuralCtx.beginPath();

            neuralCtx.arc(
                n.x,
                n.y,
                size*.32,
                0,
                Math.PI*2
            );

            neuralCtx.fill();
        }

    });


    /* =================================================
       CORE CENTRALE
    ================================================= */

    const core=
        2.2+
        pulse*.8+
        energy*2.8;


    neuralCtx.fillStyle=
        `rgba(
            ${r},
            ${g},
            ${b},
            .13
        )`;

    neuralCtx.beginPath();

    neuralCtx.arc(

        neuralCx,
        neuralCy,

        core*6,

        0,
        Math.PI*2

    );

    neuralCtx.fill();


    neuralCtx.fillStyle=
        `rgba(
            ${r},
            ${g},
            ${b},
            .95
        )`;

    neuralCtx.beginPath();

    neuralCtx.arc(

        neuralCx,
        neuralCy,

        core,

        0,
        Math.PI*2

    );

    neuralCtx.fill();


    neuralCtx.fillStyle=
        "#fff";

    neuralCtx.beginPath();

    neuralCtx.arc(

        neuralCx,
        neuralCy,

        Math.max(
            1.2,
            core*.42
        ),

        0,
        Math.PI*2

    );

    neuralCtx.fill();
}


/* =====================================================
   EARTH ANIMATION
===================================================== */

let markerPulse=0;


function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );


    if(
        mapMode &&
        zoomAnimating
    ){

        zoomProgress += .009;


        if(
            zoomProgress>=1
        ){

            zoomProgress=1;

            zoomAnimating=false;

            controls.enabled=true;

            setState(
                "idle"
            );
        }


        const eased=
            1-
            Math.pow(
                1-zoomProgress,
                3
            );


        const distance=
            zoomStart+
            (
                zoomEnd-
                zoomStart
            )
            *
            eased;


        const cameraDirection=
            earthCamera.position
            .clone()
            .normalize();


        earthCamera.position.copy(

            cameraDirection
            .multiplyScalar(
                distance
            )

        );


        earthGroup.quaternion.slerp(
            targetQuaternion,
            .025
        );
    }


    controls.update();


    if(
        marker.visible
    ){

        markerPulse += .045;


        const scale=
            1+
            Math.sin(
                markerPulse
            )*.3;


        marker.scale.set(
            scale,
            scale,
            scale
        );


        markerRing.position.copy(
            marker.position
        );


        markerRing.lookAt(
            earthCamera.position
        );


        markerRing.scale.set(
            scale,
            scale,
            scale
        );
    }


    earthRenderer.render(
        earthScene,
        earthCamera
    );
}

===================================================== */

function localCommand(text){

    const t=
        text.toLowerCase();


    if(

        t.includes("che ore sono") ||
        t.includes("che ora è") ||
        t.includes("che ora e")

    ){

        return(

            "Sono le "+
            new Date()
            .toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
            +
            "."

        );
    }


    if(

        t.includes("che giorno è") ||
        t.includes("che giorno e")

    ){

        return(

            "Oggi è "+
            new Date()
            .toLocaleDateString(
                "it-IT",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )
            +
            "."

        );
    }


    if(

        t.includes("mia posizione") ||
        t.includes("dove sono")

    ){

        showMyLocation();

        return "__LOCATION__";
    }


    if(
        isMapCommand(t)
    ){

        openMap();

        return(
            "Mappa terrestre attivata."
        );
    }


    return null;
}


/* =====================================================
   INVIO AI
===================================================== */

async function sendMessage(text){

    if(
        !text ||
        busy
    ){

        return;
    }


    busy=true;


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    const place=
        extractLocation(
            text
        );


    if(place){

        openMap();


        const answer=
            addMessage(
                "jarvis",
                "Localizzazione di "+
                place+
                "..."
            );


        const result=
            await searchPlace(
                place
            );


        if(result){

            answer.textContent=
                "Ho individuato "+
                result.name+
                ".";


            remember(
                "assistant",
                answer.textContent
            );


            speak(
                answer.textContent
            );
        }


        finish();

        return;
    }


    const local=
        localCommand(
            text
        );


    if(local){

        if(
            local!=="__LOCATION__"
        ){

            addMessage(
                "jarvis",
                local
            );


            remember(
                "assistant",
                local
            );


            speak(
                local
            );
        }


        finish();

        return;
    }


    setState(
        "thinking"
    );


    const answer=
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory=
        memory.slice(-24);


    const intelligentContext={

        assistantName:
            "JARVIS",

        language:
            "it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        mapMode:
            mapMode,

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Comprendi il significato della domanda.",

            "Rispondi in modo naturale e diretto.",

            "Se hai abbastanza informazioni, rispondi direttamente.",

            "Se una domanda è ambigua, fai una domanda breve.",

            "Usa la memoria della conversazione quando è utile.",

            "Non inventare informazioni.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "Le risposte vocali devono essere naturali e non troppo lunghe.",

            "Non usare emoji nelle risposte."

        ]
    };


    try{

        const response=
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP "+
                response.status
            );
        }


        const data=
            await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );
        }


        answer.textContent=
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(
            error
        );


        answer.textContent=
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        speak(
            "Non riesco a raggiungere il Neural Core."
        );


        setState(
            "idle"
        );
    }


    finish();
}

}


/* =====================================================
   VOICE
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        setState(
            "idle"
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance=
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang=
        "it-IT";


    utterance.rate=
        .82;


    utterance.pitch=
        .58;


    utterance.volume=
        1;


    utterance.onstart=()=>{

        setState(
            "speaking"
        );

        /*
           Energia iniziale quando
           JARVIS comincia a parlare.
        */

        targetVoiceEnergy=.45;
    };


    utterance.onend=()=>{

        targetVoiceEnergy=.03;

        setState(
            "idle"
        );


        if(
            wakeMode &&
            !busy
        ){

            setTimeout(
                startWakeWord,
                900
            );
        }
    };


    utterance.onerror=()=>{

        targetVoiceEnergy=.03;

        setState(
            "idle"
        );
    };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const Recognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(Recognition){

    recognition=
        new Recognition();


    recognition.lang=
        "it-IT";


    recognition.continuous=
        false;


    recognition.interimResults=
        true;


    recognition.onstart=()=>{

        listening=true;

        setState(
            "listening"
        );
    };


    recognition.onresult=
        event=>{

            let transcript="";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                    .transcript;
            }


            /*
               L'energia cambia leggermente
               mentre arrivano parole.

               Il vero microfono continua
               a essere gestito dal browser.
            */

            const estimated=
                Math.min(
                    .85,
                    .18+
                    transcript.length/45
                );


            targetVoiceEnergy=
                estimated;


            const last=
                event.results[
                    event.results.length-1
                ];


            if(
                last.isFinal
            ){

                const text=
                    transcript.trim();


                if(
                    text
                ){

                    sendMessage(
                        text
                    );
                }
            }
        };


    recognition.onerror=
        event=>{

            console.log(
                "Speech recognition:",
                event.error
            );
        };


    recognition.onend=()=>{

        listening=false;

        targetVoiceEnergy=.03;


        if(
            state==="listening"
        ){

            setState(
                "idle"
            );
        }
    };

}else{

    console.log(
        "Speech Recognition non supportato."
    );
}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(

        !Recognition ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition

    ){

        return;
    }


    wakeRecognition=
        new Recognition();


    wakeRecognition.lang=
        "it-IT";


    wakeRecognition.continuous=
        true;


    wakeRecognition.interimResults=
        true;


    wakeRecognition.onresult=
        event=>{

            for(

                let i=event.resultIndex;

                i<event.results.length;

                i++

            ){

                const text=
                    event.results[i][0]
                    .transcript
                    .toLowerCase()
                    .trim();


                if(
                    text.includes(
                        "jarvis"
                    )
                ){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition=null;


                    activateJarvis();


                    return;
                }
            }
        };


    wakeRecognition.onerror=()=>{

        wakeRecognition=null;


        if(
            wakeMode &&
            !busy &&
            !listening
        ){

            setTimeout(
                startWakeWord,
                1000
            );
        }
    };


    wakeRecognition.onend=()=>{

        wakeRecognition=null;


        if(
            wakeMode &&
            !busy &&
            !listening
        ){

            setTimeout(
                startWakeWord,
                700
            );
        }
    };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition=null;
    }
}


/* =====================================================
   ATTIVA JARVIS
===================================================== */

function activateJarvis(){

    if(
        busy ||
        listening
    ){

        return;
    }


    setState(
        "listening"
    );


    /*
       Piccolo impulso iniziale
       del Neural Core.
    */

    targetVoiceEnergy=.5;


    /*
       Pausa per evitare che
       "Jarvis" venga registrato
       come parte della domanda.
    */

    setTimeout(()=>{

        try{

            recognition.start();

        }catch(error){

            console.log(
                error
            );
        }

    },450);
}


/* =====================================================
   PULSANTE VOCALE
===================================================== */

voiceCore.onclick=()=>{

    if(
        busy ||
        !recognition
    ){

        return;
    }


    if(listening){

        recognition.stop();

        return;
    }


    try{

        recognition.start();

    }catch(error){

        console.log(
            error
        );
    }
};
