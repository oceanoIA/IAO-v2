<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>JARVIS — NEURAL CORE</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#49bfff;

    text-shadow:
        0 0 10px #168cff,
        0 0 25px rgba(40,170,255,.5);

    transition:opacity 1.4s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    transition:
        opacity 1.8s ease,
        transform 1.8s ease,
        filter 1.8s ease;
}

body.mapMode #neuralCanvas{
    opacity:0;

    transform:scale(.45);

    filter:blur(15px);

    pointer-events:none;
}


/* =====================================================
   EARTH
===================================================== */

#earthContainer{
    position:fixed;
    inset:0;

    z-index:2;

    opacity:0;
    pointer-events:none;

    transform:scale(.55);

    transition:
        opacity 1.8s ease,
        transform 1.8s ease;
}

body.mapMode #earthContainer{
    opacity:1;

    transform:scale(1);

    pointer-events:auto;
}

#earthCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;

    top:20px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:38px;
    font-weight:300;

    letter-spacing:13px;

    color:#dff7ff;

    text-shadow:
        0 0 12px #168cff,
        0 0 28px #168cff,
        0 0 55px rgba(40,180,255,.65);

    transition:
        text-shadow 1.5s ease,
        color 1.5s ease;
}

.status{
    margin-top:8px;

    font:10px monospace;

    letter-spacing:3px;

    color:rgba(220,245,255,.8);

    text-shadow:
        0 0 8px rgba(40,170,255,.5);
}

#dot{
    color:#39bfff;

    text-shadow:
        0 0 8px #168cff,
        0 0 18px #168cff;

    transition:
        color 1.5s ease,
        text-shadow 1.5s ease;
}

body.mapMode .header h1{
    text-shadow:
        0 0 15px #168cff,
        0 0 35px rgba(30,140,255,.7),
        0 0 65px rgba(30,140,255,.35);
}


/* =====================================================
   OROLOGIO
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;

    letter-spacing:2px;

    color:#e9faff;

    text-shadow:
        0 0 10px rgba(50,180,255,.35);
}

#date{
    margin-top:3px;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(80,190,255,.8);
}

body.mapMode #date{
    color:rgba(100,200,255,.9);
}


/* =====================================================
   CHAT
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:22px;
    top:125px;

    width:330px;

    max-height:calc(100vh - 180px);

    overflow-y:auto;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:9px;

    padding:8px 4px 8px 0;

    scrollbar-width:none;

    mask-image:linear-gradient(
        to bottom,
        transparent 0,
        black 12px,
        black 92%,
        transparent 100%
    );
}

#chat::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   MESSAGGI
===================================================== */

.message{
    width:auto;

    max-width:92%;

    padding:9px 12px;

    border-radius:14px;

    font-size:12px;

    line-height:1.45;

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    animation:
        messageIn .6s ease;

    word-wrap:break-word;

    transition:
        opacity .8s ease,
        transform .8s ease;
}

@keyframes messageIn{

    from{
        opacity:0;

        transform:
            translateX(-15px);
    }

    to{
        opacity:1;

        transform:
            translateX(0);
    }

}


/* =====================================================
   MESSAGGIO UTENTE
===================================================== */

.user{
    align-self:flex-end;

    background:
        rgba(20,130,255,.08);

    border:
        1px solid
        rgba(40,170,255,.25);

    border-right:
        2px solid
        #168cff;

    color:#fff;

    border-radius:
        16px 16px 4px 16px;

    box-shadow:
        0 0 20px
        rgba(20,140,255,.06);
}


/* =====================================================
   MESSAGGIO JARVIS
===================================================== */

.jarvis{
    align-self:flex-start;

    width:auto;

    max-width:92%;

    background:
        rgba(2,10,18,.62);

    border:
        1px solid
        rgba(40,170,255,.2);

    border-left:
        2px solid
        #168cff;

    color:#dff6ff;

    border-radius:
        4px 16px 16px 16px;

    box-shadow:
        0 0 22px
        rgba(20,130,255,.08);
}


/* =====================================================
   PRIMO MESSAGGIO
===================================================== */

#chat .message.jarvis:first-child{

    font-size:16px;

    line-height:1.45;

    padding:10px 13px;

    max-width:290px;
}


/* =====================================================
   MAP HUD
===================================================== */

#mapHud{
    position:fixed;

    z-index:15;

    left:50%;
    top:90px;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;

    pointer-events:none;

    font:11px monospace;

    letter-spacing:3px;

    text-align:center;

    color:#5eb8ff;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

body.mapMode #mapHud{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

#mapTitle{
    font-size:16px;

    letter-spacing:5px;

    margin-bottom:6px;

    text-shadow:
        0 0 15px #168cff,
        0 0 30px rgba(30,150,255,.6);
}

#coordinates{
    font-size:10px;

    color:rgba(180,220,255,.85);
}


/* =====================================================
   LOCATION INFO
===================================================== */

#locationInfo{
    position:fixed;

    z-index:18;

    left:50%;
    top:58%;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:10px 18px;

    background:
        rgba(0,10,20,.78);

    border:
        1px solid
        rgba(40,160,255,.55);

    border-radius:12px;

    font:11px monospace;

    letter-spacing:2px;

    text-align:center;

    box-shadow:
        0 0 25px
        rgba(0,130,255,.18);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#locationInfo.visible{
    opacity:1;

    transform:
        translate(-50%,0);
}

#locationName{
    font-size:14px;

    color:#fff;

    margin-bottom:4px;
}

#locationCoords{
    color:#4faaff;
}


/* =====================================================
   INTERFACCIA VOCALE
   NESSUNA BARRA / NESSUNA TASTIERA
===================================================== */

.inputArea{
    display:none !important;
}


/* =====================================================
   INDICATORE VOCALE
===================================================== */

#voiceIndicator{

    position:fixed;

    left:50%;
    bottom:34px;

    transform:
        translateX(-50%)
        scale(.8);

    z-index:30;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#168cff;

    box-shadow:
        0 0 10px #168cff,
        0 0 25px rgba(40,170,255,.5);

    opacity:.35;

    transition:
        transform 1.2s ease,
        opacity 1.2s ease,
        box-shadow 1.2s ease;
}

body.voiceActive #voiceIndicator{

    transform:
        translateX(-50%)
        scale(1.8);

    opacity:1;

    box-shadow:
        0 0 12px #168cff,
        0 0 30px #168cff,
        0 0 55px rgba(40,170,255,.6);
}


/* =====================================================
   CROSSHAIR
===================================================== */

#mapCrosshair{

    position:fixed;

    z-index:12;

    left:50%;
    top:50%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1s ease;
}

body.mapMode #mapCrosshair{
    opacity:.35;
}

#mapCrosshair::before,
#mapCrosshair::after{

    content:"";

    position:absolute;

    background:#168cff;

    box-shadow:
        0 0 8px #168cff;
}

#mapCrosshair::before{

    width:25px;
    height:1px;

    top:12px;
    left:0;
}

#mapCrosshair::after{

    width:1px;
    height:25px;

    left:12px;
    top:0;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{

        font-size:25px;

        letter-spacing:9px;
    }

    #clockPanel{

        top:15px;

        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #mapHud{
        top:65px;
    }

    #mapTitle{
        font-size:13px;
    }

    #chat{

        left:12px;
        right:12px;

        top:auto;

        bottom:55px;

        width:auto;

        max-height:27vh;

        padding:0;
    }

    .message{

        max-width:88%;

        font-size:12px;

        padding:8px 11px;
    }

    #chat .message.jarvis:first-child{

        font-size:16px;

        max-width:270px;

        padding:9px 11px;
    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:430px){

    .header h1{

        font-size:22px;

        letter-spacing:7px;
    }

    #chat{
        bottom:50px;
    }

}


/* =====================================================
   RIDUZIONE MOVIMENTO
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =====================================================
   API
===================================================== */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const neuralCanvas =
document.getElementById("neuralCanvas");

const neuralCtx =
neuralCanvas.getContext("2d");

const earthCanvas =
document.getElementById("earthCanvas");

const chat =
document.getElementById("chat");

const dot =
document.getElementById("dot");

const statusText =
document.getElementById("statusText");

const clock =
document.getElementById("clock");

const date =
document.getElementById("date");

const coordinates =
document.getElementById("coordinates");

const locationInfo =
document.getElementById("locationInfo");

const locationName =
document.getElementById("locationName");

const locationCoords =
document.getElementById("locationCoords");


/* =====================================================
   STATO
===================================================== */

let state="idle";

let busy=false;

let listening=false;

let conversationMode=true;

let wakeMode=true;

let mapMode=false;

let recognition=null;

let wakeRecognition=null;


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    memory=JSON.parse(
        localStorage.getItem("jarvis_memory") || "[]"
    );

}catch{

    memory=[];

}

memory=memory.slice(-40);


function saveMemory(){

    memory=memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );

}


function remember(role,content){

    if(!content)return;

    memory.push({

        role,

        content,

        time:Date.now()

    });

    saveMemory();

}


saveMemory();


/* =====================================================
   STATO JARVIS
===================================================== */

function setState(newState){

    state=newState;

    if(

        newState==="listening" ||
        newState==="thinking" ||
        newState==="speaking"

    ){

        dot.style.color="#39bfff";

        document.body.classList.add(
            "voiceActive"
        );

    }else{

        dot.style.color="#168cff";

        document.body.classList.remove(
            "voiceActive"
        );

    }

}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now=new Date();

    clock.textContent =
        now.toLocaleTimeString(
            "it-IT"
        );

    date.textContent =
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(type,text){

    const element =
        document.createElement("div");

    element.className =
        "message "+type;

    element.textContent =
        text;

    chat.appendChild(element);

    while(chat.children.length>20){

        chat.removeChild(
            chat.firstChild
        );

    }

    chat.scrollTop =
        chat.scrollHeight;

    return element;

}


/* =====================================================
   THREE.JS
===================================================== */

const earthScene =
    new THREE.Scene();


const earthCamera =
    new THREE.PerspectiveCamera(
        45,
        innerWidth/innerHeight,
        .1,
        100
    );


earthCamera.position.set(
    0,
    0,
    3.3
);


const earthRenderer =
    new THREE.WebGLRenderer({

        canvas:earthCanvas,

        antialias:true,

        alpha:true

    });


earthRenderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


earthRenderer.setSize(
    innerWidth,
    innerHeight
);


/* =====================================================
   LUCI
===================================================== */

const ambientLight =
    new THREE.AmbientLight(
        0x7890aa,
        1.1
    );

earthScene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    5,
    3,
    5
);

earthScene.add(sun);


/* =====================================================
   TERRA
===================================================== */

const earthGroup =
    new THREE.Group();

earthScene.add(
    earthGroup
);


const earthGeometry =
    new THREE.SphereGeometry(
        1,
        128,
        128
    );


const textureLoader =
    new THREE.TextureLoader();


const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:earthTexture,

        shininess:18,

        specular:
            new THREE.Color(
                0x333333
            )

    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );


earthGroup.add(earth);


/* =====================================================
   ATMOSFERA BLU
===================================================== */

const atmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.035,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:0x168cff,

            transparent:true,

            opacity:.12,

            side:THREE.BackSide

        })

    );


earthGroup.add(
    atmosphere
);


/* =====================================================
   GLOW
===================================================== */

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.08,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:0x168cff,

            transparent:true,

            opacity:.055,

            side:THREE.BackSide

        })

    );


earthGroup.add(glow);


/* =====================================================
   MARKER
===================================================== */

const marker =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .022,
            24,
            24
        ),

        new THREE.MeshBasicMaterial({
            color:0x4fc3ff
        })

    );


marker.visible=false;

earthGroup.add(marker);


const markerRing =
    new THREE.Mesh(

        new THREE.RingGeometry(
            .035,
            .052,
            40
        ),

        new THREE.MeshBasicMaterial({

            color:0x4fc3ff,

            transparent:true,

            opacity:.95,

            side:THREE.DoubleSide

        })

    );


markerRing.visible=false;

earthGroup.add(markerRing);


/* =====================================================
   CONTROLLI
===================================================== */

const controls =
    new OrbitControls(
        earthCamera,
        earthCanvas
    );

controls.enableDamping=true;

controls.dampingFactor=.06;

controls.enablePan=false;

controls.minDistance=1.25;

controls.maxDistance=6;


/* =====================================================
   MAPPA
===================================================== */

function openMap(){

    if(mapMode)return;

    mapMode=true;

    document.body.classList.add(
        "mapMode"
    );

    statusText.textContent =
        "EARTH NAVIGATION ONLINE";

    setState("idle");

}


function closeMap(){

    mapMode=false;

    );

}


/* =====================================================
   COMANDO MAPPA
===================================================== */

function isMapCommand(text){

    const t =
        text.toLowerCase();

    return(

        t.includes("apri la mappa") ||

        t.includes("apri mappa") ||

        t.includes("mostrami la mappa") ||

        t.includes("mostra la mappa") ||

        t.includes("mappa del mondo") ||

        t==="mappa"

    );

}


/* =====================================================
   ESTRAZIONE LUOGO
===================================================== */

function extractLocation(text){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower =
        text.toLowerCase();


    for(
        const prefix of patterns
    ){

        const index =
            lower.indexOf(prefix);


        if(index!==-1){

            let place =
                text.substring(
                    index+prefix.length
                ).trim();


            place =
                place.replace(
                    /^(la|il|lo|un|una|a|ad)\s+/i,
                    ""
                );


            if(place.length>1){

                return place;

            }

        }

    }

    return null;

}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(place){

    setState("thinking");

    coordinates.textContent =
        "SEARCHING LOCATION...";


    try{

        const url =
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(place);


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }


        const result =
            results[0];


        const lat =
            parseFloat(result.lat);


        const lon =
            parseFloat(result.lon);


        const name =
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");


        showLocation(
            name,
            lat,
            lon
        );


        return{
            name,
            lat,
            lon
        };


    }catch(error){

        console.error(error);

        coordinates.textContent =
            "LOCATION NOT FOUND";

        setState("idle");

        addMessage(
            "jarvis",
            "Non riesco a trovare questo luogo."
        );

        return null;

    }

}


/* =====================================================
   COORDINATE
===================================================== */

function formatCoordinates(lat,lon){

    const latDir =
        lat>=0 ? "N" : "S";

    const lonDir =
        lon>=0 ? "E" : "W";


    return(

        Math.abs(lat).toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon).toFixed(4)
        +
        "° "
        +
        lonDir

    );

}


/* =====================================================
   POSIZIONE
===================================================== */

function showLocation(
    name,
    lat,
    lon
){

    locationName.textContent =
        name;

    locationCoords.textContent =
        formatCoordinates(
            lat,
            lon
        );

    coordinates.textContent =
        formatCoordinates(
            lat,
            lon
        );

    locationInfo.classList.add(
        "visible"
    );

    focusEarth(
        lat,
        lon
    );

}

   FOCUS TERRA
===================================================== */

let zoomAnimating=false;

let zoomProgress=1;

let zoomStart=3.3;

let zoomEnd=1.55;

let targetQuaternion =
    new THREE.Quaternion();


function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi =
        (90-lat)
        *
        Math.PI/180;


    const theta =
        (lon+180)
        *
        Math.PI/180;


    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );

}


function focusEarth(
    lat,
    lon
){

    openMap();


    const target =
        latLonToVector3(
            lat,
            lon,
            1
        );


    marker.position.copy(
        target
        .clone()
        .multiplyScalar(1.025)
    );


    marker.visible=true;

    markerRing.visible=true;


    const direction =
        target
        .clone()
        .normalize();


    const front =
        new THREE.Vector3(
            0,
            0,
            1
        );


    targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion.setFromUnitVectors(
        direction,
        front
    );


    zoomStart =
        earthCamera.position.length();


    if(zoomStart<2){

        zoomStart=3.3;

        earthCamera.position.set(
            0,
            0,
            zoomStart
        );

    }


    zoomEnd=1.55;

    zoomProgress=0;

    zoomAnimating=true;

    controls.enabled=false;

    setState("thinking");

}


/* =====================================================
   RETE NEURALE
===================================================== */

let neuralWidth =
    innerWidth;

let neuralHeight =
    innerHeight;

let neuralCx =
    neuralWidth/2;

let neuralCy =
    neuralHeight/2;

let neuralRadius =
    Math.min(
        neuralWidth,
        neuralHeight
    )*.30;

let neuralRotation=0;

let nodes=[];


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth =
        innerWidth;

    neuralHeight =
        innerHeight;


    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );


    neuralCanvas.width =
        neuralWidth*dpr;

    neuralCanvas.height =
        neuralHeight*dpr;


    neuralCanvas.style.width =
        neuralWidth+"px";

    neuralCanvas.style.height =
        neuralHeight+"px";


    neuralCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    neuralCx =
        neuralWidth/2;

    neuralCy =
        neuralHeight/2;


    neuralRadius =
        Math.min(
            neuralWidth,
            neuralHeight
        )*.30;


    createNeuralNodes();

}


/* =====================================================
   NODI
===================================================== */

function createNeuralNodes(){

    nodes=[];


    for(
        let i=0;
        i<145;
        i++
    ){

        const special =
            Math.random() < .15;


        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .72+
                    Math.random()*.55
                ),

            size:
                .7+
                Math.random()*1.8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            special,

            colorPhase:
                Math.random()
                *
                Math.PI
                *
                2

        });

    }

}


/* =====================================================
   ANIMAZIONE RETE NEURALE
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );


    const time =
        performance.now()/1000;


    let speed=1;

    let energy=.2;


    if(state==="listening"){

        speed=2.1;

        energy=.85;

    }


    if(state==="thinking"){

        speed=3.2;

        energy=1.35;

    }


    if(state==="speaking"){

        speed=2.5;

        energy=1.05;

    }


    neuralRotation +=
        .004*speed;


    neuralCtx.fillStyle =
        "rgba(0,0,0,.28)";


    neuralCtx.fillRect(
        0,
        0,
        neuralWidth,
        neuralHeight
    );


    let targetColor;


    if(

        state==="listening" ||

        state==="thinking" ||

        state==="speaking"

    ){

        targetColor={
            r:20,
            g:145,
            b:255
        };

    }else{

        targetColor={
            r:20,
            g:125,
            b:225
        };

    }


    window.jarvisColor =
        window.jarvisColor ||
        {
            r:20,
            g:125,
            b:225
        };


    jarvisColor.r +=
        (
            targetColor.r-
            jarvisColor.r
        )*.035;


    jarvisColor.g +=
        (
            targetColor.g-
            jarvisColor.g
        )*.035;


    jarvisColor.b +=
        (
            targetColor.b-
            jarvisColor.b
        )*.035;


    const r =
        Math.round(
            jarvisColor.r
        );

    const g =
        Math.round(
            jarvisColor.g
        );

    const b =
        Math.round(
            jarvisColor.b
        );


    const pulse =
        (
            Math.sin(time*2.5)+1
        )/2;


    const glowRadius =
        neuralRadius*
        (
            1.05+
            energy*.55+
            pulse*.15
        );


    const gradient =
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glowRadius

        );


    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},.45)`
    );


    gradient.addColorStop(
        .35,
        `rgba(${r},${g},${b},.13)`
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    neuralCtx.fillStyle =
        gradient;


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        glowRadius,
        0,
        Math.PI*2
    );


    neuralCtx.fill();


    const projected=[];


    nodes.forEach(n=>{

        const rr =
            n.r+
            Math.sin(
                time*2.2+n.phase
            )
            *
            energy*
            6;


        let x =
            rr*
            Math.sin(n.phi)*
            Math.cos(
                n.theta+
                neuralRotation
            );


        let y =
            rr*
            Math.cos(n.phi);


        let z =
            rr*
            Math.sin(n.phi)*
            Math.sin(
                n.theta+
                neuralRotation
            );


        if(state!=="idle"){

            x +=
                Math.sin(
                    time*1.5+n.phase
                )
                *
                energy*
                6;


            y +=
                Math.cos(
                    time*1.8+n.phase
                )
                *
                energy*
                6;

        }


        const perspective =
            430/
            (
                430+z
            );


        projected.push({

            x:
                neuralCx+
                x*perspective,

            y:
                neuralCy+
                y*perspective,

            z,

            size:
                n.size*
                perspective,

            alpha:
                Math.max(
                    .1,
                    Math.min(
                        1,
                        (z+neuralRadius)/
                        (neuralRadius*2)
                    )
                ),

            phase:
                n.phase,

            special:
                n.special,

            colorPhase:
                n.colorPhase

        });

    });


    const maxDist =
        state==="thinking"
        ? 105
        : 78;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        for(
            let j=i+1;
            j<projected.length;
            j++
        ){

            const a =
                projected[i];

            const c =
                projected[j];


            const dx =
                a.x-c.x;

            const dy =
                a.y-c.y;


            const dist =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(dist<maxDist){

                const alpha =
                    (
                        1-
                        dist/maxDist
                    )
                    *
                    .27*
                    a.alpha;


                neuralCtx.beginPath();


                neuralCtx.moveTo(
                    a.x,
                    a.y
                );


                neuralCtx.lineTo(
                    c.x,
                    c.y
                );


                neuralCtx.strokeStyle =
                    `rgba(${r},${g},${b},${alpha})`;


                neuralCtx.lineWidth=.65;


                neuralCtx.stroke();

            }

        }

    }


    projected.forEach(n=>{

        const flicker =
            (
                Math.sin(
                    time*5+n.phase
                )+1
            )/2;


        const size =
            n.size+
            flicker*
            (
                state==="thinking"
                ? 1.4
                : .6
            );


        let particleR=r;
        let particleG=g;
        let particleB=b;


        if(n.special){

            particleR=95;
            particleG=205;
            particleB=255;

        }


        neuralCtx.fillStyle =
            `rgba(${particleR},${particleG},${particleB},${n.alpha*.25})`;


        neuralCtx.beginPath();


        neuralCtx.arc(
            n.x,
            n.y,
            size*4,
            0,
            Math.PI*2
        );


        neuralCtx.fill();


        neuralCtx.fillStyle =
            `rgba(${particleR},${particleG},${particleB},${n.alpha})`;


        neuralCtx.beginPath();


        neuralCtx.arc(
            n.x,
            n.y,
            size,
            0,
            Math.PI*2
        );


        neuralCtx.fill();

    });


    const core =
        5+
        pulse*2+
        energy*1.6;


    neuralCtx.fillStyle =
        `rgba(${r},${g},${b},.4)`;


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core*5,
        0,
        Math.PI*2
    );


    neuralCtx.fill();


    neuralCtx.fillStyle =
        "#e8faff";


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core,
        0,
        Math.PI*2
    );


    neuralCtx.fill();

}


/* =====================================================
   TERRA ANIMATA
===================================================== */

let markerPulse=0;


function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );


    if(
        mapMode &&
        zoomAnimating
    ){

        zoomProgress += .007;


        if(zoomProgress>=1){

            zoomProgress=1;

            zoomAnimating=false;

            controls.enabled=true;

            setState("idle");

        }


        const eased =
            1-
            Math.pow(
                1-zoomProgress,
                3
            );


        const distance =
            zoomStart+
            (
                zoomEnd-
                zoomStart
            )
            *
            eased;


        const cameraDirection =
            earthCamera.position
            .clone()
            .normalize();


        earthCamera.position.copy(

            cameraDirection
            .multiplyScalar(
                distance
            )

        );


        earthGroup.quaternion.slerp(
            targetQuaternion,
            .025
        );

    }


    controls.update();


    if(marker.visible){

        markerPulse += .045;


        const scale =
            1+
            Math.sin(
                markerPulse
            )*.3;


        marker.scale.set(
            scale,
            scale,
            scale
        );


        markerRing.visible=true;


        markerRing.position.copy(
            marker.position
        );


        markerRing.lookAt(
            earthCamera.position
        );


        markerRing.scale.set(
            scale,
            scale,
            scale
        );

    }


    earthRenderer.render(
        earthScene,
        earthCamera
    );

}

function localCommand(text){

    const t =
        text.toLowerCase();


    if(

        t.includes("che ore sono") ||

        t.includes("che ora è") ||

        t.includes("che ora e")

    ){

        return(

            "Sono le "
            +
            new Date()
            .toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
            +
            "."

        );

    }


    if(

        t.includes("che giorno è") ||

        t.includes("che giorno e")

    ){

        return(

            "Oggi è "
            +
            new Date()
            .toLocaleDateString(
                "it-IT",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )
            +
            "."

        );

    }


    if(

        t.includes("mia posizione") ||

        t.includes("dove sono")

    ){

        showMyLocation();

        return "__LOCATION__";

    }


    if(isMapCommand(t)){

        openMap();

        return "Mappa terrestre attivata.";

    }


    return null;

}

async function processVoiceMessage(text){

    if(!text || busy){

        return;

    }


    busy=true;


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    const place =
        extractLocation(text);


    if(place){

        openMap();


        const answer =
            addMessage(
                "jarvis",
                "Localizzazione di "
                +
                place
                +
                "..."
            );


        const result =
            await searchPlace(
                place
            );


        if(result){

            answer.textContent =
                "Ho individuato "
                +
                result.name
                +
                ".";


            remember(
                "assistant",
                answer.textContent
            );


            speak(
                answer.textContent
            );

        }


        finish();

        return;

    }


    const local =
        localCommand(text);


    if(local){

        if(local!=="__LOCATION__"){

            addMessage(
                "jarvis",
                local
            );


            remember(
                "assistant",
                local
            );


            speak(local);

        }


        finish();

        return;

    }


    setState("thinking");


    const answer =
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory =
        memory.slice(-24);


    const intelligentContext={

        assistantName:"JARVIS",

        language:"it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        mapMode:mapMode,

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Se hai abbastanza informazioni, rispondi direttamente.",

            "Se una domanda è ambigua, fai una domanda breve per capire meglio.",

            "Usa la memoria della conversazione quando è utile.",

            "Non inventare informazioni quando non sei sicuro.",

            "Spiega le cose in modo naturale e intelligente.",

            "Per domande complesse, ragiona per passaggi ma presenta una risposta chiara.",

            "Non dire continuamente che sei un'intelligenza artificiale.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "Le risposte vocali devono essere naturali e non troppo lunghe."

        ]

    };


    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent =
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(error);


        const errorMessage =
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        answer.textContent =
            errorMessage;


        speak(
            errorMessage
        );

    }


    finish();

}

/* =====================================================
   VOCE JARVIS
===================================================== */

let voices=[];

let selectedVoice=null;


function loadVoices(){

    if(!("speechSynthesis" in window)){

        return;

    }


    voices =
        speechSynthesis.getVoices();


    const italianVoices =
        voices.filter(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("it")
        );


    if(!italianVoices.length){

        selectedVoice =
            voices[0] || null;

        return;

    }


    /*
       Cerchiamo prima voci che normalmente
       corrispondono a una voce maschile.
    */

    const maleKeywords=[

        "male",
        "maschile",
        "guy",
        "man",
        "luca",
        "giorgio",
        "diego",
        "marco",
        "matteo",
        "federico",
        "paolo",
        "alessandro"

    ];


    const maleVoice =
        italianVoices.find(
            voice=>{

                const name =
                    voice.name
                    .toLowerCase();

                return maleKeywords.some(
                    keyword =>
                        name.includes(keyword)
                );

            }
        );


    selectedVoice =
        maleVoice ||
        italianVoices.find(
            voice =>
                voice.localService
        ) ||
        italianVoices[0];

}


loadVoices();


if(
    "speechSynthesis" in window &&
    speechSynthesis.onvoiceschanged !== undefined
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

}


function speak(text){

    if(
        !text ||
        !("speechSynthesis" in window)
    ){

        setState("idle");

        return;

    }


    speechSynthesis.cancel();


    loadVoices();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    if(selectedVoice){

        utterance.voice =
            selectedVoice;

    }


    /*
       Voce più naturale:
       leggermente lenta e grave,
       senza effetto robotico.
    */

    utterance.rate =
        .82;

    utterance.pitch =
        .78;

    utterance.volume =
        1;


    utterance.onstart=()=>{

        setState(
            "speaking"
        );

    };


    utterance.onend=()=>{

        setState(
            "idle"
        );


        if(
            conversationMode &&
            wakeMode &&
            !busy
        ){

            setTimeout(
                startWakeWord,
                1100
            );

        }

    };


    utterance.onerror=()=>{

        setState(
            "idle"
        );


        if(
            conversationMode &&
            wakeMode &&
            !busy
        ){

            setTimeout(
                startWakeWord,
                1200
            );

        }

    };


    speechSynthesis.speak(
        utterance
    );

}

===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =====================================================
   RICONOSCIMENTO COMANDO
===================================================== */

if(Recognition){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart=()=>{

        listening=true;

        setState(
            "listening"
        );

        statusText.textContent =
            "LISTENING...";

    };


    recognition.onresult =
        event=>{

            let transcript="";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                    .transcript;

            }


            const last =
                event.results[
                    event.results.length-1
                ];


            if(last.isFinal){

                const text =
                    transcript.trim();


                if(text){

                    processVoiceMessage(
                        text
                    );

                }

            }

        };


    recognition.onerror =
        event=>{

            console.log(
                "Speech recognition:",
                event.error
            );

        };


    recognition.onend=()=>{

        listening=false;


        if(state==="listening"){

            setState(
                "idle"
            );

        }


        statusText.textContent =
            "NEURAL INTERFACE ONLINE";


        if(

            conversationMode &&
            wakeMode &&
            !busy

        ){

            setTimeout(
                startWakeWord,
                900
            );

        }

    };

}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(

        !Recognition ||
        !conversationMode ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition

    ){

        return;

    }


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeRecognition.onresult =
        event=>{

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase()
                    .trim();


                if(

                    text.includes("jarvis") ||
                    text.includes("jarvis.")

                ){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition=null;

                    activateJarvis();

                    return;

                }

            }

        };


    wakeRecognition.onerror=event=>{

        console.log(
            "Wake recognition:",
            event.error
        );


        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(
                startWakeWord,
                1500
            );

        }

    };


    wakeRecognition.onend=()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(
                startWakeWord,
                900
            );

        }

    };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition=null;

    }

}


/* =====================================================
   ATTIVAZIONE JARVIS
===================================================== */

function activateJarvis(){

    if(

        busy ||
        listening ||
        !recognition

    ){

        return;

    }


    stopWakeWord();


    statusText.textContent =
        "JARVIS LISTENING";


    setState(
        "listening"
    );


    /*
       Piccola pausa per rendere
       l'attivazione più cinematografica.
    */

    setTimeout(()=>{

        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    },500);

}


/* =====================================================
   STOP WAKE WORD
===================================================== */

function stopWakeWord(){

    if(wakeRecognition){

        try{

            wakeRecognition.stop();

        }catch{}


        wakeRecognition=null;

    }

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        resizeNeural();


        earthCamera.aspect =
            innerWidth/
            innerHeight;


        earthCamera.updateProjectionMatrix();


        earthRenderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   START
===================================================== */

resizeNeural();

animateNeural();

animateEarth();


setTimeout(()=>{

    document
        .getElementById("loading")
        .classList.add("hidden");

},800);


/* =====================================================
   AVVIO AUTOMATICO MODALITÀ VOCALE
===================================================== */

setTimeout(()=>{

    if(
        Recognition &&
        conversationMode &&
        wakeMode
    ){

        startWakeWord();

    }

},2500);


/* =====================================================
   API PUBBLICA
===================================================== */

window.JARVIS_EARTH={

    openMap,

    closeMap,

    searchPlace,

    showMyLocation,

    focusEarth

};

</script>
