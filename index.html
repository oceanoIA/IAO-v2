<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Structured Neural Core</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020305;
        font-family: monospace;
        color: #ffffff;
    }

    #webgl-container {
        position: absolute;
        inset: 0;
        z-index: 1;
    }

    /* UI HUD */
    .hud-top-left {
        position: absolute;
        top: 25px;
        left: 25px;
        z-index: 10;
    }
    .btn-hud {
        background: rgba(8, 14, 25, 0.7);
        border: 1px solid rgba(0, 160, 255, 0.35);
        color: #70b8ff;
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 2px;
        border-radius: 4px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .btn-hud:hover {
        border-color: #00d2ff;
        box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
    }

    .hud-top-right {
        position: absolute;
        top: 25px;
        right: 25px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 1px;
        color: #00ffcc;
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: #00ffcc;
        border-radius: 50%;
        box-shadow: 0 0 10px #00ffcc;
    }

    .hud-bottom {
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        text-align: center;
    }
    #statusText {
        font-size: 12px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    #chat {
        position: absolute;
        bottom: 130px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: min(520px, 90%);
        text-align: center;
        pointer-events: none;
    }
    .msg {
        background: rgba(4, 10, 20, 0.85);
        border: 1px solid rgba(0, 180, 255, 0.4);
        box-shadow: 0 0 15px rgba(0, 120, 255, 0.2);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 12px;
        color: #e0f2ff;
        backdrop-filter: blur(8px);
    }

    /* BARRA DI DIGITAZIONE */
    .input-container {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: min(500px, 90%);
        display: flex;
        gap: 8px;
    }
    .input-field {
        flex: 1;
        background: rgba(8, 14, 25, 0.8);
        border: 1px solid rgba(0, 160, 255, 0.35);
        border-radius: 20px;
        padding: 10px 18px;
        color: #ffffff;
        font-family: monospace;
        font-size: 13px;
        outline: none;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .input-field:focus {
        border-color: #00d2ff;
        box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }
    .input-field::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }
    .btn-send {
        background: rgba(0, 140, 255, 0.2);
        border: 1px solid rgba(0, 160, 255, 0.5);
        color: #00f0ff;
        padding: 0 18px;
        border-radius: 20px;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .btn-send:hover {
        background: rgba(0, 160, 255, 0.4);
        box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
    }
</style>
</head>
<body>

<div class="hud-top-left">
    <button class="btn-hud" id="micBtn">MUTE</button>
</div>

<div class="hud-top-right">
    <div class="status-dot"></div>
    <span>connected</span>
</div>

<div id="webgl-container"></div>
<div id="chat"></div>

<div class="hud-bottom">
    <div id="statusText">listening...</div>
</div>

<div class="input-container">
    <input type="text" id="textInput" class="input-field" placeholder="Scrivi un comando a JARVIS..." />
    <button id="sendBtn" class="btn-send">INVIA</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

const API = "https://iao-ai-v3.oceano-masoud.workers.dev/";

// SCENA THREE.JS
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5.0;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// TEXTURE NEURONI NITIDI E LUMINOSI
function createParticleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    // Cerchio ben definito con centro brillante
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.3, 'rgba(0, 200, 255, 0.9)');
    gradient.addColorStop(0.7, 'rgba(0, 100, 255, 0.4)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);

    return new THREE.CanvasTexture(canvas);
}

// PARTICELLE ORGANIZZATE (3500 neuroni ben visibili)
const count = 3500;
const geometry = new THREE.BufferGeometry();
const basePositions = new Float32Array(count * 3);
const currentPositions = new Float32Array(count * 3);
const sphereRadius = new Float32Array(count);
const sphereAngles = new Float32Array(count * 2); // theta, phi

for(let i = 0; i < count; i++) {
    const r = 1.8 * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    sphereRadius[i] = r;
    sphereAngles[i*2] = theta;
    sphereAngles[i*2+1] = phi;

    basePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    basePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    basePositions[i*3+2] = r * Math.cos(phi);

    currentPositions[i*3] = basePositions[i*3];
    currentPositions[i*3+1] = basePositions[i*3+1];
    currentPositions[i*3+2] = basePositions[i*3+2];
}

geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

// MATERIALE PIÙ GRANDE E VISIBILE
const pMaterial = new THREE.PointsMaterial({
    color: new THREE.Color(0x0077ff),
    size: 0.038, // Neuroni più grandi e definiti
    map: createParticleTexture(),
    transparent: true,
    alphaTest: 0.001,
    opacity: 0.9,
    blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// CONTROLLO ENERGIA E TRANSIZIONI ARMONICHE
let targetEnergy = 0; 
let currentEnergy = 0;
let baseColor = new THREE.Color(0x0055ff);
let activeColor = new THREE.Color(0x00f0ff);
let currentColor = baseColor.clone();

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.0012;

    // Transizione energia fluida
    currentEnergy += (targetEnergy - currentEnergy) * 0.03;

    // Cambio colore graduale
    currentColor.lerp(targetEnergy > 0.1 ? activeColor : baseColor, 0.04);
    pMaterial.color = currentColor;

    const pos = geometry.attributes.position.array;

    for(let i = 0; i < count; i++) {
        const idx = i * 3;
        const r = sphereRadius[i];
        const theta = sphereAngles[i*2];
        const phi = sphereAngles[i*2+1];

        if(currentEnergy < 0.1) {
            // STATO 1: ASCOLTO (Respiro sferico elegante e sincronizzato)
            const pulse = 1 + Math.sin(time * 2 + r * 3) * 0.06;
            pos[idx] = basePositions[idx] * pulse;
            pos[idx+1] = basePositions[idx+1] * pulse;
            pos[idx+2] = basePositions[idx+2] * pulse;
        } else {
            // STATO 2: PARLA / PENSA (Onde armoniche ordinate e fluide)
            const waveX = Math.sin(time * 2.5 + phi * 4) * 0.25 * currentEnergy;
            const waveY = Math.cos(time * 2.0 + theta * 3) * 0.25 * currentEnergy;
            const waveZ = Math.sin(time * 3.0 + r * 2) * 0.15 * currentEnergy;

            pos[idx] = (r + waveX) * Math.sin(phi) * Math.cos(theta + waveY);
            pos[idx+1] = (r + waveY) * Math.sin(phi) * Math.sin(theta);
            pos[idx+2] = (r + waveZ) * Math.cos(phi + waveX);
        }
    }

    geometry.attributes.position.needsUpdate = true;

    // Rotazione fluida e composta dell'intera struttura
    particleSystem.rotation.y += 0.002 + currentEnergy * 0.004;
    particleSystem.rotation.x = Math.sin(time * 0.5) * 0.12;

    renderer.render(scene, camera);
}

animate();

// LOGICA INTERFACCIA E VOCALE
const statusText = document.getElementById("statusText");
const chat = document.getElementById("chat");
const micBtn = document.getElementById("micBtn");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

function setJarvisState(state) {
    if(state === "listening") {
        targetEnergy = 0;
        statusText.textContent = "listening...";
        statusText.style.color = "rgba(255, 255, 255, 0.4)";
        statusText.style.textShadow = "none";
    } else if(state === "speaking" || state === "thinking") {
        targetEnergy = 1;
        statusText.textContent = state === "thinking" ? "thinking..." : "speaking...";
        statusText.style.color = "#00f0ff";
        statusText.style.textShadow = "0 0 10px rgba(0, 240, 255, 0.8)";
    }
}

function addMsg(text) {
    chat.innerHTML = `<div class="msg">${text}</div>`;
}

function handleUserSend() {
    const text = textInput.value.trim();
    if(!text) return;
    textInput.value = "";
    addMsg(text);
    processAi(text);
}

sendBtn.onclick = handleUserSend;
textInput.onkeydown = (e) => {
    if(e.key === "Enter") handleUserSend();
};

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(Recognition) {
    const rec = new Recognition();
    rec.lang = 'it-IT';

    rec.onstart = () => setJarvisState("listening");
    rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        addMsg(text);
        processAi(text);
    };
    rec.onend = () => {};

    micBtn.onclick = () => {
        try { rec.start(); } catch{}
    };
}

async function processAi(text) {
    setJarvisState("thinking");
    try {
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        const reply = data.reply || "Elaborazione completata.";
        addMsg(reply);
        speak(reply);
    } catch {
        speak("Errore di connessione.");
    }
}

function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.onstart = () => setJarvisState("speaking");
    u.onend = () => setJarvisState("listening");
    speechSynthesis.speak(u);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
