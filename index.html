<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARK-TECH // ULTRA-FLUID DUAL LAB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #080b10;
      font-family: 'Share Tech Mono', monospace;
      color: #00f3ff;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 243, 255, 0.02) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #video-input { display: none; }

    /* HUD Header & Tabs */
    .stark-header {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 50px;
      background: linear-gradient(180deg, rgba(0, 243, 255, 0.15) 0%, rgba(1, 4, 8, 0) 100%);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .stark-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .security-badge {
      font-size: 10px;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
    }

    .mode-tabs { display: flex; gap: 10px; }
    .tab-btn {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: rgba(0, 243, 255, 0.6);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      padding: 6px 16px;
      cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: all 0.15s ease;
    }
    .tab-btn:hover, .tab-btn.active {
      background: rgba(0, 243, 255, 0.25);
      border-color: #00f3ff;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    /* Left Control HUD */
    .ui-overlay {
      position: absolute;
      top: 70px; left: 24px;
      z-index: 10;
      width: 300px;
      padding: 20px;
      background: rgba(10, 16, 26, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 243, 255, 0.35);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(0, 243, 255, 0.9);
      border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 10px; color: rgba(0, 243, 255, 0.7); letter-spacing: 1px; }

    select, input[type="color"], .stark-btn {
      width: 100%; height: 38px;
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #00f3ff;
      padding: 0 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      outline: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    select:hover, .stark-btn:hover {
      background: rgba(0, 243, 255, 0.25);
      border-color: #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }
    select option { background: #0a101a; color: #00f3ff; }

    .telemetry-box {
      font-size: 11px;
      background: rgba(0, 243, 255, 0.03);
      border: 1px solid rgba(0, 243, 255, 0.15);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hand-card {
      border-left: 2px solid #ffffff;
      padding-left: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hand-card.h2 {
      border-left-color: #00f3ff;
    }
    .telemetry-row { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.7); }
    .telemetry-val { color: #00f3ff; font-weight: bold; }

    /* Camera Feed Panel */
    .camera-preview-container {
      position: absolute;
      bottom: 24px; right: 24px;
      z-index: 10;
      width: 220px; height: 165px;
      background: rgba(10, 16, 26, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 243, 255, 0.4);
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
      display: flex; flex-direction: column;
    }
    #hand-preview-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .preview-hud-tag {
      position: absolute; top: 6px; left: 8px;
      font-size: 9px; font-weight: bold; letter-spacing: 1px;
      color: #00f3ff; background: rgba(2, 12, 27, 0.8);
      padding: 2px 6px; border: 1px solid rgba(0, 243, 255, 0.3);
    }

    .hud-corner {
      position: absolute; width: 8px; height: 8px;
      border: 2px solid #00f3ff; pointer-events: none;
    }
    .top-left { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .top-right { top: -1px; right: -1px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: -1px; left: -1px; border-right: none; border-top: none; }
    .bottom-right { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="video-input"></video>
  <div id="canvas-container"></div>

  <div class="stark-header">
    <div class="stark-title">
      <span>STARK KINETIC LAB v7.0</span>
      <span class="security-badge">ULTRA FLUID 60FPS</span>
    </div>
    <div class="mode-tabs">
      <button id="tab-builder" class="tab-btn active" onclick="switchMode('BUILDER')">SYS 01: REALISTIC 3D GRAB</button>
      <button id="tab-particles" class="tab-btn" onclick="switchMode('PARTICLES')">SYS 02: PARTICLE MATRIX</button>
    </div>
  </div>

  <div class="ui-overlay">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="panel-header">
      <span id="panel-title-text">3D REALISTIC BUILDER</span>
      <span style="color: #00f3ff; font-weight: bold;">[ACTIVE]</span>
    </div>
    
    <!-- Modalità 1: Cubi 3D Solidi -->
    <div id="controls-builder">
      <div class="control-group">
        <label>MANIPOLAZIONE DUAL-HAND</label>
        <button class="stark-btn" onclick="spawnBlock()">+ AGGIUNGI CUBO 3D</button>
        <button class="stark-btn" style="background: rgba(255, 51, 102, 0.2); border-color: #ff3366; color: #ff3366;" onclick="clearBlocks()">RESET SCENA</button>
      </div>
    </div>

    <!-- Modalità 2: Particelle Olografiche -->
    <div id="controls-particles" style="display: none;">
      <div class="control-group">
        <label>HOLOGRAM TEMPLATE</label>
        <select id="shape-select">
          <option value="jupiter">JUPITER & RINGS</option>
          <option value="galaxy">GALAXY SPIRAL</option>
          <option value="hypercube">HYPERCUBE MATRIX</option>
          <option value="heart">HEART MATRIX</option>
          <option value="flower">NEURAL FLOWER</option>
          <option value="buddha">BUDDHA HOLOGRAM</option>
          <option value="fireworks">ENERGY EXPLOSION</option>
        </select>
      </div>
      <div class="control-group" style="margin-top: 10px;">
        <label>PLASMA COLOR</label>
        <input type="color" id="color-picker" value="#00f3ff">
      </div>
    </div>

    <!-- Telemetria Mani -->
    <div class="telemetry-box">
      <div class="hand-card">
        <div class="telemetry-row">
          <span style="color: #ffffff; font-weight: bold;">MANO 1 (PUNTINO BIANCO):</span>
          <span id="h1-status" class="telemetry-val">CERCA...</span>
        </div>
        <div class="telemetry-row">
          <span>STATO:</span>
          <span id="h1-grab" class="telemetry-val">LIBERA</span>
        </div>
      </div>

      <div class="hand-card h2">
        <div class="telemetry-row">
          <span style="color: #00f3ff; font-weight: bold;">MANO 2 (PUNTINO BIANCO):</span>
          <span id="h2-status" class="telemetry-val">CERCA...</span>
        </div>
        <div class="telemetry-row">
          <span>STATO:</span>
          <span id="h2-grab" class="telemetry-val">LIBERA</span>
        </div>
      </div>
    </div>
  </div>

  <div class="camera-preview-container">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>
    <span class="preview-hud-tag">OPTICAL FEED // LOW LATENCY</span>
    <canvas id="hand-preview-canvas" width="320" height="240"></canvas>
  </div>

  <script>
    let currentMode = 'BUILDER';
    // Ottimizzato a 12,000 particelle per fluidità a 60FPS garantita senza scatti
    const PARTICLE_COUNT = 12000;
    let scene, camera, renderer;

    // --- VARIABILI MODALITÀ 1: BUILDER 3D ---
    let builderGroup;
    let blocks = [];
    const CUBE_COLORS = [0x00aaff, 0xff0055, 0x00ff88, 0xffaa00, 0x9900ff];

    // Cursori: Piccoli puntini bianchi
    const controllers = [
      {
        id: 0, cursorMesh: null, laserMesh: null,
        grabbedBlock: null, grabOffset: new THREE.Vector3(), pos: new THREE.Vector3(),
        isPinching: false, statusEl: null, grabEl: null
      },
      {
        id: 1, cursorMesh: null, laserMesh: null,
        grabbedBlock: null, grabOffset: new THREE.Vector3(), pos: new THREE.Vector3(),
        isPinching: false, statusEl: null, grabEl: null
      }
    ];

    // --- VARIABILI MODALITÀ 2: PARTICELLE ---
    let particleGroup, particleGeometry, particleMaterial;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let handExpansionScale = 1.0, targetScale = 1.0;
    let targetCamZ = 32, targetRotX = 0, targetRotY = 0, targetRotZ = 0;

    let previewCanvas, previewCtx;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080b10);
      scene.fog = new THREE.FogExp2(0x080b10, 0.015);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 6, 28);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // --- SETUP MODALITÀ 1: BUILDER ---
      builderGroup = new THREE.Group();
      scene.add(builderGroup);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(15, 30, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 80;
      dirLight.shadow.camera.left = -25;
      dirLight.shadow.camera.right = 25;
      dirLight.shadow.camera.top = 25;
      dirLight.shadow.camera.bottom = -25;
      scene.add(dirLight);

      // PIANO GRIGIO FISICO REALISTICO
      const planeGeo = new THREE.PlaneGeometry(80, 80);
      const planeMat = new THREE.MeshStandardMaterial({
        color: 0x303640,
        roughness: 0.55,
        metalness: 0.2
      });
      const floor = new THREE.Mesh(planeGeo, planeMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -6;
      floor.receiveShadow = true;
      builderGroup.add(floor);

      const gridHelper = new THREE.GridHelper(80, 40, 0x00f3ff, 0x444c56);
      gridHelper.position.y = -5.95;
      builderGroup.add(gridHelper);

      // PUNTINI BIANCHI Ultra-Compatti (Radius 0.12)
      controllers.forEach((ctrl, idx) => {
        const cursorGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const cursorMat = new THREE.MeshBasicMaterial({
          color: 0xffffff
        });
        ctrl.cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
        ctrl.cursorMesh.visible = false;
        builderGroup.add(ctrl.cursorMesh);

        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 2, transparent: true, opacity: 0.8 });
        ctrl.laserMesh = new THREE.Line(laserGeo, laserMat);
        ctrl.laserMesh.visible = false;
        builderGroup.add(ctrl.laserMesh);

        ctrl.statusEl = document.getElementById(`h${idx + 1}-status`);
        ctrl.grabEl = document.getElementById(`h${idx + 1}-grab`);
      });

      // Spawn Cubi 3D Solidi Iniziali
      spawnBlock(-6, -1.5, 0, CUBE_COLORS[0]);
      spawnBlock(0, 0, 0, CUBE_COLORS[1]);
      spawnBlock(6, -1.5, 0, CUBE_COLORS[2]);

      // --- SETUP MODALITÀ 2: PARTICELLE ---
      particleGroup = new THREE.Group();
      particleGroup.visible = false;
      scene.add(particleGroup);

      particleGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 40;
        targetPositions[i] = currentPositions[i];
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64; pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#ffffff'; pCtx.beginPath(); pCtx.arc(32, 32, 28, 0, Math.PI * 2); pCtx.fill();

      particleMaterial = new THREE.PointsMaterial({
        size: 0.22, color: new THREE.Color('#00f3ff'),
        map: new THREE.CanvasTexture(pCanvas), transparent: true,
        opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
      });

      const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
      particleGroup.add(particleSystem);
      generateShape('jupiter');

      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    // --- CREAZIONE CUBO SOLIDO (PERFETTAMENTE FERMO) ---
    function createBlockMesh(colorHex) {
      const size = 3.6;
      const boxGeo = new THREE.BoxGeometry(size, size, size);
      
      const boxMat = new THREE.MeshStandardMaterial({
        color: colorHex || CUBE_COLORS[Math.floor(Math.random() * CUBE_COLORS.length)],
        roughness: 0.35,
        metalness: 0.25
      });

      const mesh = new THREE.Mesh(boxGeo, boxMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const edges = new THREE.EdgesGeometry(boxGeo);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
      const wireframe = new THREE.LineSegments(edges, lineMat);
      mesh.add(wireframe);

      mesh.userData = { originalColor: boxMat.color.getHex() };
      return mesh;
    }

    function spawnBlock(x, y, z, color) {
      const mesh = createBlockMesh(color);
      mesh.position.x = x !== undefined ? x : (Math.random() - 0.5) * 14;
      mesh.position.y = y !== undefined ? y : (Math.random() - 0.5) * 4 + 1;
      mesh.position.z = z !== undefined ? z : (Math.random() - 0.5) * 10;

      builderGroup.add(mesh);
      blocks.push(mesh);
    }

    function clearBlocks() {
      for (let b of blocks) builderGroup.remove(b);
      blocks = [];
      controllers.forEach(c => {
        c.grabbedBlock = null;
        c.laserMesh.visible = false;
      });
    }

    function setBlockHighlight(block, mode, colorHex) {
      if (!block) return;
      if (mode === 'grab') {
        block.material.color.setHex(colorHex || 0x00f3ff);
        block.material.emissive.setHex(0x00f3ff);
        block.material.emissiveIntensity = 0.3;
      } else {
        block.material.color.setHex(block.userData.originalColor);
        block.material.emissive.setHex(0x000000);
        block.material.emissiveIntensity = 0;
      }
    }

    // --- CAMBIO MODALITÀ ---
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-builder').classList.toggle('active', mode === 'BUILDER');
      document.getElementById('tab-particles').classList.toggle('active', mode === 'PARTICLES');
      
      document.getElementById('controls-builder').style.display = mode === 'BUILDER' ? 'block' : 'none';
      document.getElementById('controls-particles').style.display = mode === 'PARTICLES' ? 'block' : 'none';
      document.getElementById('panel-title-text').innerText = mode === 'BUILDER' ? '3D REALISTIC BUILDER' : 'PARTICLE MATRIX';

      builderGroup.visible = (mode === 'BUILDER');
      particleGroup.visible = (mode === 'PARTICLES');
    }

    // --- NUOVE FORME PARTICELLE (GIOVE, GALASSIA, IPERCUBO, ECC.) ---
    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'jupiter') {
          // Giove Sferico con Fasce Atmosferiche e Anelli Esterni
          if (i < PARTICLE_COUNT * 0.75) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 7.5;
            x = r * Math.sin(phi) * Math.cos(theta);
            y = (r * Math.cos(phi)) * 0.88; // Schiacciamento ai poli
            z = r * Math.sin(phi) * Math.sin(theta);
          } else {
            // Anello Sottile di Giove
            const angle = Math.random() * Math.PI * 2, dist = 9.5 + Math.random() * 4.5;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.3;
          }
        } else if (type === 'galaxy') {
          // Galassia a 4 Bracci di Spirale
          const arms = 4;
          const arm = i % arms;
          const r = Math.pow(Math.random(), 1.5) * 16;
          const theta = r * 0.4 + (arm * (Math.PI * 2 / arms));
          x = Math.cos(theta) * r + (Math.random() - 0.5) * 0.8;
          z = Math.sin(theta) * r + (Math.random() - 0.5) * 0.8;
          y = (Math.random() - 0.5) * (2.0 - r * 0.1);
        } else if (type === 'hypercube') {
          // Ipercubo 4D Proiettato
          const size = 7;
          const side = i % 12;
          const t = Math.random() * size - size/2;
          const inner = (i % 2 === 0) ? 0.55 : 1.0;

          if (side === 0) { x = size/2; y = t; z = size/2; }
          else if (side === 1) { x = -size/2; y = t; z = size/2; }
          else if (side === 2) { x = t; y = size/2; z = size/2; }
          else if (side === 3) { x = t; y = -size/2; z = size/2; }
          else if (side === 4) { x = size/2; y = t; z = -size/2; }
          else if (side === 5) { x = -size/2; y = t; z = -size/2; }
          else if (side === 6) { x = t; y = size/2; z = -size/2; }
          else if (side === 7) { x = t; y = -size/2; z = -size/2; }
          else if (side === 8) { x = size/2; y = size/2; z = t; }
          else if (side === 9) { x = -size/2; y = size/2; z = t; }
          else if (side === 10) { x = size/2; y = -size/2; z = t; }
          else { x = -size/2; y = -size/2; z = t; }

          x *= inner; y *= inner; z *= inner;
        } else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 4;
          x = 16 * Math.pow(Math.sin(t), 3);
          y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          z = u; x *= 0.65; y *= 0.65; z *= 0.65;
        } else if (type === 'flower') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI;
          const r = 10 * Math.sin(6 * u) * Math.sin(v);
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.cos(v);
        } else if (type === 'buddha') {
          const rand = Math.random();
          if (rand < 0.35) {
            const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 9;
            x = Math.cos(a) * r; z = Math.sin(a) * r; y = -8 + (Math.random() - 0.5) * 1.5;
          } else if (rand < 0.75) {
            const h = Math.random() * 10, width = (1 - h / 10) * 7.5, a = Math.random() * Math.PI * 2;
            x = Math.cos(a) * width * Math.random(); z = Math.sin(a) * width * Math.random(); y = -7 + h;
          } else {
            const a = Math.random() * Math.PI * 2, r = Math.random() * 2.8;
            x = Math.cos(a) * r; y = 5.5 + Math.sin(a) * r; z = (Math.random() - 0.5) * 2;
          }
        } else if (type === 'fireworks') {
          const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
          const speed = 2 + Math.random() * 14;
          x = speed * Math.sin(phi) * Math.cos(theta); y = speed * Math.sin(phi) * Math.sin(theta); z = speed * Math.cos(phi);
        }

        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    // --- TRACCIAMENTO MANI MEDIAPIPE OTTIMIZZATO ---
    function initHandTracking() {
      const videoElement = document.getElementById('video-input');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        const detectedHandsCount = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

        controllers.forEach((ctrl, i) => {
          if (i < detectedHandsCount) {
            const landmarks = results.multiHandLandmarks[i];

            drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, { color: '#00f3ff', lineWidth: 1.5 });
            drawLandmarks(previewCtx, landmarks, { color: '#ffffff', lineWidth: 1, radius: 2 });

            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];

            const pX = (thumbTip.x + indexTip.x) / 2;
            const pY = (thumbTip.y + indexTip.y) / 2;
            const pZ = (thumbTip.z + indexTip.z) / 2;

            const dx = thumbTip.x - indexTip.x;
            const dy = thumbTip.y - indexTip.y;
            const dz = (thumbTip.z || 0) - (indexTip.z || 0);
            const pinchDist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            const ndcX = (1 - pX) * 2 - 1;
            const ndcY = -(pY * 2 - 1);

            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();

            const targetZ = -pZ * 30;
            const distanceToPlane = (targetZ - camera.position.z) / dir.z;
            const targetPos = camera.position.clone().add(dir.multiplyScalar(distanceToPlane));

            // Risposta reattiva ed ultra-fluida con Lerp ad alta velocità
            ctrl.pos.lerp(targetPos, 0.5);

            ctrl.cursorMesh.position.copy(ctrl.pos);
            ctrl.cursorMesh.visible = (currentMode === 'BUILDER');

            ctrl.isPinching = (pinchDist < 0.08);

            ctrl.statusEl.innerText = "RILEVATA";
            ctrl.statusEl.style.color = "#00f3ff";

            // LOGICA MODALITÀ 1: BUILDER 3D
            if (currentMode === 'BUILDER') {
              if (ctrl.isPinching) {
                if (ctrl.grabbedBlock) {
                  const blockTarget = ctrl.pos.clone().sub(ctrl.grabOffset);
                  ctrl.grabbedBlock.position.lerp(blockTarget, 0.45);

                  const positions = ctrl.laserMesh.geometry.attributes.position.array;
                  positions[0] = ctrl.pos.x; positions[1] = ctrl.pos.y; positions[2] = ctrl.pos.z;
                  positions[3] = ctrl.grabbedBlock.position.x; positions[4] = ctrl.grabbedBlock.position.y; positions[5] = ctrl.grabbedBlock.position.z;
                  ctrl.laserMesh.geometry.attributes.position.needsUpdate = true;
                  ctrl.laserMesh.visible = true;

                  ctrl.grabEl.innerText = "PRESO CUBO!";
                  ctrl.grabEl.style.color = "#ff3366";
                } else {
                  let closest = null;
                  let minDist = 5.5;

                  for (let block of blocks) {
                    const isOtherHandGrabbing = controllers.some(other => other.id !== ctrl.id && other.grabbedBlock === block);
                    if (isOtherHandGrabbing) continue;

                    const d = ctrl.pos.distanceTo(block.position);
                    if (d < minDist) {
                      minDist = d;
                      closest = block;
                    }
                  }

                  if (closest) {
                    ctrl.grabbedBlock = closest;
                    ctrl.grabOffset.copy(ctrl.pos).sub(closest.position);
                    setBlockHighlight(closest, 'grab', 0x00f3ff);
                  }
                }
              } else {
                if (ctrl.grabbedBlock) {
                  setBlockHighlight(ctrl.grabbedBlock, 'normal');
                  ctrl.grabbedBlock = null;
                  ctrl.laserMesh.visible = false;
                }
                ctrl.grabEl.innerText = "LIBERA";
                ctrl.grabEl.style.color = "#00f3ff";
              }
            }

          } else {
            ctrl.cursorMesh.visible = false;
            ctrl.laserMesh.visible = false;
            if (ctrl.grabbedBlock) {
              setBlockHighlight(ctrl.grabbedBlock, 'normal');
              ctrl.grabbedBlock = null;
            }
            ctrl.statusEl.innerText = "CERCA...";
            ctrl.statusEl.style.color = "#ff3366";
            ctrl.grabEl.innerText = "N/A";
          }
        });

        // LOGICA MODALITÀ 2: PARTICELLE
        if (currentMode === 'PARTICLES' && detectedHandsCount > 0) {
          const h1 = results.multiHandLandmarks[0];
          const h1Center = h1[9];

          if (detectedHandsCount >= 2) {
            const h2Center = results.multiHandLandmarks[1][9];
            const dxH = h2Center.x - h1Center.x;
            const dyH = h2Center.y - h1Center.y;
            const distH = Math.sqrt(dxH * dxH + dyH * dyH);

            targetRotZ = Math.atan2(dyH, dxH);
            targetRotY = ((h1Center.x + h2Center.x) / 2 - 0.5) * Math.PI * 3.0;
            targetRotX = ((h1Center.y + h2Center.y) / 2 - 0.5) * Math.PI * 2.5;
            targetCamZ = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(distH, 0.18, 0.75, 65, 14), 12, 70);
          } else {
            const wrist = h1[0];
            targetRotZ = -Math.atan2(h1Center.y - wrist.y, h1Center.x - wrist.x) - Math.PI / 2;
            targetRotX = (h1Center.y - 0.5) * Math.PI * 2.0;
            targetRotY = (h1Center.x - 0.5) * Math.PI * 3.0;

            const span = Math.hypot(wrist.x - h1[12].x, wrist.y - h1[12].y);
            targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(span, 0.2, 0.55, 0.4, 2.2), 0.3, 2.5);
          }
        }

        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640,
        height: 480
      });
      cameraUtils.start();
    }

    // --- LOOP DI RENDERING 60FPS ---
    function animate() {
      requestAnimationFrame(animate);

      if (currentMode === 'PARTICLES') {
        particleGroup.rotation.x += (targetRotX - particleGroup.rotation.x) * 0.12;
        particleGroup.rotation.y += (targetRotY + 0.004 - particleGroup.rotation.y) * 0.12;
        particleGroup.rotation.z += (targetRotZ - particleGroup.rotation.z) * 0.12;

        handExpansionScale += (targetScale - handExpansionScale) * 0.12;
        camera.position.z += (targetCamZ - camera.position.z) * 0.12;

        const positions = particleGeometry.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
          const target = targetPositions[i] * handExpansionScale;
          positions[i] += (target - positions[i]) * 0.12;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
    document.getElementById('color-picker').addEventListener('input', (e) => particleMaterial.color.set(e.target.value));

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
</html>
