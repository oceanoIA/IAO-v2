<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #020202;
    color: white;
}

body {
    position: relative;
}

/* SFONDO */

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center, rgba(255, 190, 0, 0.12), transparent 25%),
        radial-gradient(circle at center, #100d02 0%, #030303 48%, #000 100%);
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255, 200, 0, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 200, 0, 0.025) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: radial-gradient(circle, black, transparent 75%);
}

/* HEADER */

.header {
    position: fixed;
    top: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 20;
}

.logo {
    font-size: 38px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #ffd21f;
    text-shadow:
        0 0 8px #ffd21f,
        0 0 25px rgba(255, 180, 0, 0.8),
        0 0 55px rgba(255, 140, 0, 0.4);
}

.status {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #999;
}

.status span {
    color: #ffd21f;
    text-shadow: 0 0 10px #ffd21f;
}

/* CORE */

.core-area {
    position: absolute;
    width: 360px;
    height: 360px;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
}

/* BAGLIORE */

.core-glow {
    position: absolute;
    width: 190px;
    height: 190px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255, 190, 0, 0.3);

    filter: blur(45px);

    animation: glowPulse 3s ease-in-out infinite;
}

/* SFERA */

.core {
    position: absolute;
    width: 125px;
    height: 125px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fffbd0 0%,
            #fff06b 8%,
            #ffd21f 28%,
            #ffae00 55%,
            #c85b00 78%,
            #4a1b00 100%
        );

    box-shadow:
        inset -18px -15px 30px rgba(80, 20, 0, 0.45),
        inset 12px 10px 20px rgba(255, 255, 180, 0.5),
        0 0 15px #fff06b,
        0 0 40px #ffd21f,
        0 0 80px rgba(255, 150, 0, 0.9),
        0 0 140px rgba(255, 120, 0, 0.35);

    animation: spherePulse 2.5s ease-in-out infinite;
}

/* TEXTURE DELLA SFERA */

.core::before {
    content: "";
    position: absolute;
    inset: 8px;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle at center,
            transparent 0px,
            rgba(255,255,180,.08) 2px,
            transparent 4px
        );

    opacity: .5;

    animation: sphereSpin 7s linear infinite;
}

/* ANELLI */

.orbit {
    position: absolute;
    left: 50%;
    top: 50%;

    border-radius: 50%;

    border: 1px solid rgba(255, 215, 70, .75);

    box-shadow:
        0 0 6px rgba(255, 210, 30, .6),
        0 0 18px rgba(255, 160, 0, .25);

    transform-style: preserve-3d;
}

.orbit1 {
    width: 320px;
    height: 105px;
    transform: translate(-50%, -50%) rotateX(65deg) rotateZ(15deg);
    animation: orbit1 6s linear infinite;
}

.orbit2 {
    width: 300px;
    height: 115px;
    transform: translate(-50%, -50%) rotateX(70deg) rotateZ(-55deg);
    animation: orbit2 8s linear infinite reverse;
}

.orbit3 {
    width: 270px;
    height: 160px;
    transform: translate(-50%, -50%) rotateY(65deg) rotateZ(20deg);
    animation: orbit3 10s linear infinite;
}

.orbit4 {
    width: 235px;
    height: 235px;
    border-style: dashed;
    border-color: rgba(255, 210, 30, .3);
    transform: translate(-50%, -50%) rotateX(70deg);
    animation: orbit4 13s linear infinite reverse;
}

/* PUNTI LUMINOSI */

.dot {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;

    background: #fff8a0;

    box-shadow:
        0 0 8px #fff06b,
        0 0 20px #ffd21f;
}

.dot1 {
    top: 35px;
    left: 40px;
    animation: floatingDot 3s infinite ease-in-out;
}

.dot2 {
    bottom: 45px;
    right: 35px;
    animation: floatingDot 4s infinite ease-in-out 1s;
}

.dot3 {
    top: 70px;
    right: 25px;
    animation: floatingDot 5s infinite ease-in-out 2s;
}

/* STATO */

.core-status {
    position: absolute;
    width: 100%;
    text-align: center;
    bottom: -35px;

    font-size: 9px;
    letter-spacing: 4px;

    color: rgba(255, 215, 70, .7);
}

/* CHAT */

#chat {
    position: fixed;

    left: 15px;
    right: 15px;
    bottom: 105px;

    max-height: 27vh;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 8px;

    z-index: 30;
}

.message {
    max-width: 85%;

    padding: 12px 15px;

    border-radius: 14px;

    font-size: 14px;
    line-height: 1.4;

    backdrop-filter: blur(15px);
}

.user {
    align-self: flex-end;

    background: rgba(255, 200, 20, .12);

    border: 1px solid rgba(255, 210, 40, .35);
}

.jarvis {
    align-self: flex-start;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,210,40,.2);

    box-shadow: 0 0 15px rgba(255,180,0,.05);
}

/* INPUT */

.input-area {
    position: fixed;

    left: 15px;
    right: 15px;
    bottom: 20px;

    display: flex;
    gap: 10px;

    z-index: 40;
}

input {
    flex: 1;

    height: 55px;

    padding: 0 20px;

    border-radius: 30px;

    border: 1px solid rgba(255,210,30,.35);

    outline: none;

    background: rgba(5,5,5,.85);

    color: white;

    font-size: 16px;

    box-shadow:
        0 0 20px rgba(255,180,0,.08);

    backdrop-filter: blur(15px);
}

input:focus {
    border-color: #ffd21f;

    box-shadow:
        0 0 20px rgba(255,210,30,.25);
}

button {
    width: 55px;
    height: 55px;

    border: none;
    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%, #fff47a, #ffd21f 45%, #e88900);

    color: #241700;

    font-size: 21px;

    cursor: pointer;

    box-shadow:
        0 0 12px #ffd21f,
        0 0 30px rgba(255,150,0,.4);

    transition: .2s;
}

button:active {
    transform: scale(.92);
}

/* ANIMAZIONI */

@keyframes spherePulse {
    0%,100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.07);
    }
}

@keyframes sphereSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes glowPulse {
    0%,100% {
        opacity: .35;
        transform: translate(-50%, -50%) scale(.9);
    }

    50% {
        opacity: .65;
        transform: translate(-50%, -50%) scale(1.2);
    }
}

@keyframes orbit1 {
    from {
        transform: translate(-50%, -50%) rotateX(65deg) rotateZ(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotateX(65deg) rotateZ(360deg);
    }
}

@keyframes orbit2 {
    from {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
    }
}

@keyframes orbit3 {
    from {
        transform: translate(-50%, -50%) rotateY(65deg) rotateZ(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotateY(65deg) rotateZ(360deg);
    }
}

@keyframes orbit4 {
    from {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
    }
}

@keyframes floatingDot {
    0%,100% {
        transform: translateY(0);
        opacity: .4;
    }

    50% {
        transform: translateY(-18px);
        opacity: 1;
    }
}

/* TELEFONO */

@media (max-width: 500px) {

    .logo {
        font-size: 31px;
        letter-spacing: 9px;
    }

    .core-area {
        width: 320px;
        height: 320px;
        top: 44%;
    }

    .core {
        width: 110px;
        height: 110px;
    }

    .orbit1 {
        width: 290px;
    }

    .orbit2 {
        width: 275px;
    }

    .orbit3 {
        width: 250px;
    }

    .orbit4 {
        width: 210px;
        height: 210px;
    }

    #chat {
        max-height: 25vh;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<header class="header">
    <div class="logo">JARVIS</div>

    <div class="status">
        <span>●</span> SYSTEM ONLINE
    </div>
</header>

<!-- CORE CENTRALE -->

<div class="core-area">

    <div class="core-glow"></div>

    <div class="orbit orbit1"></div>
    <div class="orbit orbit2"></div>
    <div class="orbit orbit3"></div>
    <div class="orbit orbit4"></div>

    <div class="core"></div>

    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>

    <div class="core-status">
        JARVIS READY
    </div>

</div>

<!-- CHAT -->

<div id="chat">

    <div class="message jarvis">
        Ciao. Sono JARVIS. 🧠
    </div>

</div>

<!-- INPUT -->

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">➤</button>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if (!text) return;

    /* MESSAGGIO UTENTE */

    const userMessage = document.createElement("div");

    userMessage.className = "message user";
    userMessage.textContent = text;

    chat.appendChild(userMessage);

    input.value = "";

    /* RISPOSTA JARVIS */

    const jarvisMessage = document.createElement("div");

    jarvisMessage.className = "message jarvis";
    jarvisMessage.textContent = "Elaborazione in corso...";

    chat.appendChild(jarvisMessage);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch(
            "https://iao-ai-v3.oceano-masoud.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        if (data.reply) {

            jarvisMessage.textContent = data.reply;

        } else {

            jarvisMessage.textContent =
                "Non ho ricevuto una risposta.";

        }

    } catch (error) {

        console.error(error);

        jarvisMessage.textContent =
            "Errore di collegamento con JARVIS.";

    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
