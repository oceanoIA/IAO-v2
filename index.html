<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Core System</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03070d;
    color: #e0f7fc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* CANVAS PRINCIPALE */
#canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* CORNICI TATTICHE E METADATI HUD */
.hud-meta {
    position: fixed;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(0, 212, 255, 0.45);
    z-index: 5;
    pointer-events: none;
    font-family: monospace;
    text-transform: uppercase;
}

.top-left { top: 25px; left: 25px; border-left: 2px solid rgba(0, 212, 255, 0.4); padding-left: 10px; }
.top-right { top: 25px; right: 25px; border-right: 2px solid rgba(0, 212, 255, 0.4); padding-right: 10px; text-align: right; }

/* TITOLO PRINCIPALE */
.header-title {
    position: fixed;
    top: 25px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.header-title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
}

.header-title .status {
    margin-top: 5px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0, 212, 255, 0.5);
    font-family: monospace;
}

.header-title .status b {
    color: #00d4ff;
    text-shadow: 0 0 8px #00d4ff;
}

/* CHAT TERMINALE MINIMALISTA */
#chat {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    bottom: 90px;
    max-height: 32vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 20px;
    z-index: 10;
    scrollbar-width: none;
}

#chat::-webkit-scrollbar {
    display: none;
}

.message {
    max-width: 80%;
    padding: 12px 18px;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 4px;
    backdrop-filter: blur(12px);
    word-break: break-word;
}

.user {
    align-self: flex-end;
    background: rgba(0, 212, 255, 0.06);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-right: 3px solid #00d4ff;
    color: #ffffff;
}

.jarvis {
    align-self: flex-start;
    background: rgba(4, 16, 30, 0.7);
    border: 1px solid rgba(0, 212, 255, 0.15);
    border-left: 3px solid #00d4ff;
    color: #d8f4fc;
}

/* AREA INPUT */
.input-container {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    bottom: 25px;
    padding: 0 20px;
    z-index: 20;
}

.input-box {
    display: flex;
    gap: 10px;
    background: rgba(3, 12, 24, 0.85);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 6px;
    padding: 4px;
    backdrop-filter: blur(16px);
    transition: border-color 0.3s, box-shadow 0.3s;
}

.input-box:focus-within {
    border-color: rgba(0, 212, 255, 0.8);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
}

input {
    flex: 1;
    height: 44px;
    padding: 0 16px;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 14px;
    font-family: inherit;
}

input::placeholder {
    color: rgba(220, 245, 255, 0.35);
}

button {
    width: 80px;
    height: 44px;
    background: rgba(0, 212, 255, 0.12);
    border: 1px solid rgba(0, 212, 255, 0.4);
    border-radius: 4px;
    color: #00d4ff;
    font-family: monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover:not(:disabled) {
    background: #00d4ff;
    color: #03070d;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
}

button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

@media (max-width: 600px) {
    .hud-meta { display: none; }
    .header-title h1 { font-size: 20px; letter-spacing: 8px; }
    .message { max-width: 90%; }
}
</style>
</head>

<body>

<div class="hud-meta top-left">
    CORE: NEURAL MATRIX<br>
    STATUS: NOMINAL
</div>

<div class="hud-meta top-right">
    ENCRYPTION: 4096-BIT<br>
    INTERFACE: MARK VIII
</div>

<div class="header-title">
    <h1>J.A.R.V.I.S.</h1>
    <div class="status">
        <b>●</b> NEURAL CORE ACTIVE
    </div>
</div>

<canvas id="canvas-container"></canvas>

<div id="chat">
    <div class="message jarvis">
        Sistemi di calcolo centrali attivi. In attesa di istruzioni.
    </div>
</div>

<div class="input-container">
    <div class="input-box">
        <input id="input" type="text" placeholder="Invia un comando al sistema..." autocomplete="off">
        <button id="send">SEND</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas-container");
const ctx = canvas.getContext("2d");

let width, height, dpr, centerX, centerY;
let thinking = false;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = width / 2;
    centerY = height / 2 - 30;

    initNeurons();
}

window.addEventListener("resize", resize);

/* =====================================================
   STRUTTURA NEURONI ED ORBITE 3D
===================================================== */

const NEURON_COUNT = 80;
const neurons = [];

function initNeurons() {
    neurons.length = 0;
    for (let i = 0; i < NEURON_COUNT; i++) {
        // Distribuizione sferica 3D
        const radius = 110 + Math.random() * 140;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        neurons.push({
            x: 0, y: 0, z: 0,
            baseRadius: radius,
            theta: theta,
            phi: phi,
            speed: (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
            pulsePhase: Math.random() * Math.PI * 2,
            size: Math.random() * 1.8 + 1.2
        });
    }
}

let globeAngleY = 0;
let globeAngleX = 0;

/* =====================================================
   RENDERING CANVAS
===================================================== */

function animate() {
    requestAnimationFrame(animate);

    ctx.fillStyle = "rgba(3, 7, 13, 0.25)";
    ctx.fillRect(0, 0, width, height);

    const time = performance.now() * 0.001;
    const speedMult = thinking ? 2.8 : 1.0;

    globeAngleY += 0.004 * speedMult;
    globeAngleX += 0.001 * speedMult;

    // 1. SFERA CENTRALE (CORE REACTOR)
    const coreRadius = thinking ? 45 : 38;
    
    // Core Glow Esterno
    const outerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius * 2.5);
    outerGlow.addColorStop(0, "rgba(0, 212, 255, 0.4)");
    outerGlow.addColorStop(0.5, "rgba(0, 150, 255, 0.08)");
    outerGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
    
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(centerX, centerY, coreRadius * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Sfera Centrale Brillante
    const coreGradient = ctx.createRadialGradient(centerX - 10, centerY - 10, 0, centerX, centerY, coreRadius);
    coreGradient.addColorStop(0, "#ffffff");
    coreGradient.addColorStop(0.3, "#a6f2ff");
    coreGradient.addColorStop(0.7, "#00a2ff");
    coreGradient.addColorStop(1, "rgba(0, 50, 100, 0.8)");

    ctx.fillStyle = coreGradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
    ctx.fill();

    // 2. CALCOLO POSIZIONE NEURONI 3D E PROIEZIONE 2D
    const projectedNeurons = [];

    neurons.forEach(n => {
        n.theta += n.speed * speedMult;

        // Coordinate sferiche originali
        let x = n.baseRadius * Math.sin(n.phi) * Math.cos(n.theta);
        let y = n.baseRadius * Math.cos(n.phi);
        let z = n.baseRadius * Math.sin(n.phi) * Math.sin(n.theta);

        // Rotazione Y
        let rx1 = x * Math.cos(globeAngleY) + z * Math.sin(globeAngleY);
        let rz1 = -x * Math.sin(globeAngleY) + z * Math.cos(globeAngleY);

        // Rotazione X
        let ry2 = y * Math.cos(globeAngleX) - rz1 * Math.sin(globeAngleX);
        let rz2 = y * Math.sin(globeAngleX) + rz1 * Math.cos(globeAngleX);

        // Proiezione prospettica
        const perspective = 400 / (400 + rz2);
        const projX = centerX + rx1 * perspective;
        const projY = centerY + ry2 * perspective;
        const alpha = Math.max(0.15, Math.min(1, (rz2 + 200) / 400));

        projectedNeurons.push({
            projX, projY, rz2, alpha, perspective,
            size: n.size * perspective,
            pulse: (Math.sin(time * 3 + n.pulsePhase) + 1) / 2
        });
    });

    // Ordinamento per profondità (Z-Index)
    projectedNeurons.sort((a, b) => a.rz2 - b.rz2);

    // 3. SINAPSI / CONNESSIONI NEURALI
    for (let i = 0; i < projectedNeurons.length; i++) {
        for (let j = i + 1; j < projectedNeurons.length; j++) {
            const n1 = projectedNeurons[i];
            const n2 = projectedNeurons[j];

            const dx = n1.projX - n2.projX;
            const dy = n1.projY - n2.projY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 85) {
                const lineAlpha = (1 - dist / 85) * 0.25 * n1.alpha;
                ctx.beginPath();
                ctx.moveTo(n1.projX, n1.projY);
                ctx.lineTo(n2.projX, n2.projY);
                ctx.strokeStyle = `rgba(0, 212, 255, ${lineAlpha})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }
    }

    // 4. DISEGNO NEURONI E ALONI
    projectedNeurons.forEach(n => {
        // Connessione al Core centrale se abbastanza vicino
        const distToCenter = Math.sqrt(Math.pow(n.projX - centerX, 2) + Math.pow(n.projY - centerY, 2));
        if (distToCenter < 160 && Math.random() < 0.03) {
            ctx.beginPath();
            ctx.moveTo(n.projX, n.projY);
            ctx.lineTo(centerX, centerY);
            ctx.strokeStyle = `rgba(0, 212, 255, ${0.15 * n.alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        // Nodo Neuronale
        ctx.fillStyle = `rgba(225, 250, 255, ${n.alpha})`;
        ctx.beginPath();
        ctx.arc(n.projX, n.projY, n.size, 0, Math.PI * 2);
        ctx.fill();

        // Alone luminoso
        ctx.fillStyle = `rgba(0, 212, 255, ${n.alpha * 0.3 * n.pulse})`;
        ctx.beginPath();
        ctx.arc(n.projX, n.projY, n.size * 3, 0, Math.PI * 2);
        ctx.fill();
    });
}

resize();
animate();

/* =====================================================
   LOGICA CHAT E API
===================================================== */

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

send.addEventListener("click", sendMessage);
input.addEventListener("keydown", event => {
    if (event.key === "Enter") sendMessage();
});

async function sendMessage() {
    const text = input.value.trim();
    if (!text || input.disabled) return;

    input.disabled = true;
    send.disabled = true;

    // Messaggio Utente
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chat.appendChild(userMsg);

    input.value = "";

    // Messaggio JARVIS
    const jarvisMsg = document.createElement("div");
    jarvisMsg.className = "message jarvis";
    jarvisMsg.textContent = "Elaborazione in corso...";
    chat.appendChild(jarvisMsg);

    thinking = true;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://iao-ai-v3.oceano-masoud.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Errore API");

        const data = await response.json();
        jarvisMsg.textContent = data.reply || "Nessun dato di risposta disponibile.";
    } catch (error) {
        jarvisMsg.textContent = "Impossibile contattare il nucleo centrale. Rete non disponibile.";
    } finally {
        setTimeout(() => { thinking = false; }, 500);
        input.disabled = false;
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}
</script>

</body>
</html>
