<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Cinematic Matrix</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    color: #ffaa00;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* CANVAS PRINCIPALE */
#canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* METADATI HUD */
.hud-meta {
    position: fixed;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255, 170, 0, 0.5);
    z-index: 5;
    pointer-events: none;
    font-family: monospace;
    text-transform: uppercase;
}

.top-left { top: 25px; left: 25px; border-left: 2px solid rgba(255, 170, 0, 0.6); padding-left: 10px; }
.top-right { top: 25px; right: 25px; border-right: 2px solid rgba(255, 170, 0, 0.6); padding-right: 10px; text-align: right; }

/* TITOLO E STATO */
.header-title {
    position: fixed;
    top: 25px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.header-title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(255, 180, 0, 0.8), 0 0 24px rgba(255, 120, 0, 0.4);
}

.header-title .status {
    margin-top: 5px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255, 180, 0, 0.7);
    font-family: monospace;
}

.header-title .status b {
    color: #ffaa00;
    text-shadow: 0 0 8px #ffaa00;
}

/* CHAT TERMINALE */
#chat {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    bottom: 90px;
    max-height: 25vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 20px;
    z-index: 10;
    scrollbar-width: none;
}

#chat::-webkit-scrollbar {
    display: none;
}

.message {
    max-width: 80%;
    padding: 12px 18px;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 4px;
    backdrop-filter: blur(12px);
    word-break: break-word;
}

.user {
    align-self: flex-end;
    background: rgba(255, 170, 0, 0.08);
    border: 1px solid rgba(255, 170, 0, 0.35);
    border-right: 3px solid #ffaa00;
    color: #ffffff;
}

.jarvis {
    align-self: flex-start;
    background: rgba(20, 10, 0, 0.75);
    border: 1px solid rgba(255, 170, 0, 0.2);
    border-left: 3px solid #ffaa00;
    color: #ffe8b3;
}

/* CONTENITORE INPUT */
.input-container {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    bottom: 25px;
    padding: 0 20px;
    z-index: 20;
}

.input-box {
    display: flex;
    gap: 10px;
    background: rgba(12, 6, 0, 0.85);
    border: 1px solid rgba(255, 170, 0, 0.35);
    border-radius: 6px;
    padding: 4px;
    backdrop-filter: blur(16px);
    transition: border-color 0.3s, box-shadow 0.3s;
}

.input-box:focus-within {
    border-color: rgba(255, 170, 0, 0.9);
    box-shadow: 0 0 20px rgba(255, 170, 0, 0.25);
}

input {
    flex: 1;
    height: 44px;
    padding: 0 16px;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 14px;
    font-family: inherit;
}

input::placeholder {
    color: rgba(255, 220, 150, 0.35);
}

button {
    width: 80px;
    height: 44px;
    background: rgba(255, 170, 0, 0.15);
    border: 1px solid rgba(255, 170, 0, 0.5);
    border-radius: 4px;
    color: #ffaa00;
    font-family: monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover:not(:disabled) {
    background: #ffaa00;
    color: #000000;
    box-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
}

button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

@media (max-width: 600px) {
    .hud-meta { display: none; }
    .header-title h1 { font-size: 20px; letter-spacing: 8px; }
    .message { max-width: 90%; }
}
</style>
</head>

<body>

<div class="hud-meta top-left">
    JARVIS_AI_CORE_V3<br>
    STATUS: FULL DENSITY MATRIX
</div>

<div class="hud-meta top-right">
    ORBITAL RINGS: ACTIVE<br>
    NEURAL SPECTRUM: GOLD
</div>

<div class="header-title">
    <h1>J.A.R.V.I.S.</h1>
    <div class="status">
        <b>●</b> NEURAL SPHERE ONLINE
    </div>
</div>

<canvas id="canvas-container"></canvas>

<div id="chat">
    <div class="message jarvis">
        Inizializzazione matrice completata. In attesa di istruzioni.
    </div>
</div>

<div class="input-container">
    <div class="input-box">
        <input id="input" type="text" placeholder="Comunica con JARVIS..." autocomplete="off">
        <button id="send">send</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas-container");
const ctx = canvas.getContext("2d");

let width, height, dpr, centerX, centerY;
let thinking = false;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = width / 2;
    centerY = height / 2 - 30;

    initJarvisSphere();
}

window.addEventListener("resize", resize);

/* =====================================================
   SFERA CINEMATOGRAFICA JARVIS (AVENGERS STYLE)
===================================================== */

const RINGS_COUNT = 16;
const PARTICLES_COUNT = 320;
const rings = [];
const particles = [];

function initJarvisSphere() {
    rings.length = 0;
    particles.length = 0;

    const baseRadius = Math.min(width, height) * 0.35;

    // 1. ANNELLI E ARCHI ORBITALI
    for (let i = 0; i < RINGS_COUNT; i++) {
        rings.push({
            radius: baseRadius * (0.3 + (i / RINGS_COUNT) * 0.75),
            rotX: Math.random() * Math.PI,
            rotY: Math.random() * Math.PI,
            speedX: (Math.random() - 0.5) * 0.008,
            speedY: (Math.random() - 0.5) * 0.012,
            dashLength: Math.random() * 0.8 + 0.2,
            arcOffset: Math.random() * Math.PI * 2,
            width: Math.random() * 1.5 + 0.8
        });
    }

    // 2. PARTICELLE E FRAMMENTI NEURALI
    for (let i = 0; i < PARTICLES_COUNT; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const r = baseRadius * (0.2 + Math.random() * 0.85);

        particles.push({
            r: r,
            theta: theta,
            phi: phi,
            speed: (Math.random() * 0.006 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
            size: Math.random() * 2.2 + 0.8,
            isSegment: Math.random() > 0.6,
            segmentLength: Math.random() * 12 + 4,
            pulse: Math.random() * Math.PI * 2
        });
    }
}

let globalAngle = 0;

function animate() {
    requestAnimationFrame(animate);

    ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
    ctx.fillRect(0, 0, width, height);

    const time = performance.now() * 0.001;
    const speedMult = thinking ? 2.8 : 1.0;

    globalAngle += 0.003 * speedMult;

    const baseRadius = Math.min(width, height) * 0.35;

    // 1. CORE LUMINOSO E NUCLEO
    const coreGlowRadius = thinking ? baseRadius * 1.4 : baseRadius * 1.1;
    const coreGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreGlowRadius);
    coreGlow.addColorStop(0, "rgba(255, 235, 170, 0.95)");
    coreGlow.addColorStop(0.2, "rgba(255, 170, 0, 0.6)");
    coreGlow.addColorStop(0.55, "rgba(200, 80, 0, 0.18)");
    coreGlow.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(centerX, centerY, coreGlowRadius, 0, Math.PI * 2);
    ctx.fill();

    // Nucleo interno denso
    const innerCore = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, baseRadius * 0.25);
    innerCore.addColorStop(0, "#ffffff");
    innerCore.addColorStop(0.4, "#ffe066");
    innerCore.addColorStop(0.8, "#ff9900");
    innerCore.addColorStop(1, "rgba(255, 153, 0, 0)");

    ctx.fillStyle = innerCore;
    ctx.beginPath();
    ctx.arc(centerX, centerY, baseRadius * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // 2. DISEGNO DEGLI ANNELLI E ARCHI ORBITALI 3D
    rings.forEach(ring => {
        ring.rotX += ring.speedX * speedMult;
        ring.rotY += ring.speedY * speedMult;

        ctx.save();
        ctx.translate(centerX, centerY);

        // Disegno archi di circonferenza ruotati
        ctx.beginPath();
        const startAngle = ring.arcOffset + globalAngle;
        const endAngle = startAngle + ring.dashLength * Math.PI;

        for (let a = startAngle; a <= endAngle; a += 0.05) {
            let x = ring.radius * Math.cos(a);
            let y = ring.radius * Math.sin(a);
            let z = 0;

            // Rotazione 3D
            let rx = x * Math.cos(ring.rotY) + z * Math.sin(ring.rotY);
            let rz = -x * Math.sin(ring.rotY) + z * Math.cos(ring.rotY);
            let ry = y * Math.cos(ring.rotX) - rz * Math.sin(ring.rotX);

            const perspective = 400 / (400 + rz);
            const px = rx * perspective;
            const py = ry * perspective;

            if (a === startAngle) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }

        ctx.strokeStyle = "rgba(255, 185, 30, 0.45)";
        ctx.lineWidth = ring.width;
        ctx.stroke();
        ctx.restore();
    });

    // 3. PROIEZIONE PARTICELLE E FRAMMENTI
    const projectedParticles = [];

    particles.forEach(p => {
        p.theta += p.speed * speedMult;

        let x = p.r * Math.sin(p.phi) * Math.cos(p.theta);
        let y = p.r * Math.cos(p.phi);
        let z = p.r * Math.sin(p.phi) * Math.sin(p.theta);

        // Rotazioni combinate
        let rx1 = x * Math.cos(globalAngle) + z * Math.sin(globalAngle);
        let rz1 = -x * Math.sin(globalAngle) + z * Math.cos(globalAngle);

        let ry2 = y * Math.cos(globalAngle * 0.5) - rz1 * Math.sin(globalAngle * 0.5);
        let rz2 = y * Math.sin(globalAngle * 0.5) + rz1 * Math.cos(globalAngle * 0.5);

        const perspective = 420 / (420 + rz2);
        const projX = centerX + rx1 * perspective;
        const projY = centerY + ry2 * perspective;
        const alpha = Math.max(0.15, Math.min(1, (rz2 + baseRadius) / (baseRadius * 2)));

        projectedParticles.push({
            projX, projY, rz2, alpha, perspective,
            size: p.size * perspective,
            isSegment: p.isSegment,
            segmentLength: p.segmentLength * perspective,
            pulse: (Math.sin(time * 5 + p.pulse) + 1) / 2
        });
    });

    projectedParticles.sort((a, b) => a.rz2 - b.rz2);

    // 4. RENDERIZZAZIONE PARTICELLE E CONNESSIONI SINAPTICHE
    for (let i = 0; i < projectedParticles.length; i++) {
        const p1 = projectedParticles[i];

        // Connessione ad altre particelle vicine per creare la fitta rete dell'immagine
        for (let j = i + 1; j < Math.min(i + 8, projectedParticles.length); j++) {
            const p2 = projectedParticles[j];
            const dx = p1.projX - p2.projX;
            const dy = p1.projY - p2.projY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 45) {
                ctx.beginPath();
                ctx.moveTo(p1.projX, p1.projY);
                ctx.lineTo(p2.projX, p2.projY);
                ctx.strokeStyle = `rgba(255, 175, 20, ${(1 - dist / 45) * 0.35 * p1.alpha})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }

        // Disegno nodo o tratto di linea
        if (p1.isSegment) {
            ctx.beginPath();
            ctx.moveTo(p1.projX, p1.projY);
            ctx.lineTo(p1.projX + p1.segmentLength, p1.projY + (p1.pulse * 2 - 1));
            ctx.strokeStyle = `rgba(255, 210, 80, ${p1.alpha * 0.8})`;
            ctx.lineWidth = p1.size * 0.8;
            ctx.stroke();
        } else {
            ctx.fillStyle = `rgba(255, 245, 210, ${p1.alpha})`;
            ctx.beginPath();
            ctx.arc(p1.projX, p1.projY, p1.size, 0, Math.PI * 2);
            ctx.fill();

            // Glow attorno ai nodi
            ctx.fillStyle = `rgba(255, 150, 0, ${p1.alpha * 0.35 * p1.pulse})`;
            ctx.beginPath();
            ctx.arc(p1.projX, p1.projY, p1.size * 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

resize();
animate();

/* =====================================================
   LOGICA CHAT E API
===================================================== */

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

send.addEventListener("click", sendMessage);
input.addEventListener("keydown", event => {
    if (event.key === "Enter") sendMessage();
});

async function sendMessage() {
    const text = input.value.trim();
    if (!text || input.disabled) return;

    input.disabled = true;
    send.disabled = true;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chat.appendChild(userMsg);

    input.value = "";

    const jarvisMsg = document.createElement("div");
    jarvisMsg.className = "message jarvis";
    jarvisMsg.textContent = "Elaborazione matrice in corso...";
    chat.appendChild(jarvisMsg);

    thinking = true;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://iao-ai-v3.oceano-masoud.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Errore API");

        const data = await response.json();
        jarvisMsg.textContent = data.reply || "Nessun dato di risposta disponibile.";
    } catch (error) {
        jarvisMsg.textContent = "Sistemi offline. Impossibile contattare la matrice JARVIS.";
    } finally {
        setTimeout(() => { thinking = false; }, 500);
        input.disabled = false;
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}
</script>

</body>
</html>
