<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Interface</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121316;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
    }

    /* SFONDO MAPPA HUD (PER MODALITÀ MAPPA) */
    #mapBackground {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 0.8s ease;
        z-index: 1;
        filter: brightness(0.7) contrast(1.2);
    }
    body.map-active #mapBackground {
        opacity: 1;
    }

    /* CONTAINER CENTRALE / HUD */
    #mainUi {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* POSIZIONAMENTO IN BASSO A DESTRA (FOTO 2 E 3) */
    body.map-active #mainUi {
        align-items: flex-end;
        justify-content: flex-end;
        padding: 40px;
    }

    /* CORE WRAPPER */
    .core-wrapper {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.8s ease;
    }

    body.map-active .core-wrapper {
        transform: scale(0.8);
    }

    canvas#coreCanvas {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .jarvis-text {
        position: absolute;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        z-index: 15;
    }

    /* OROLOGIO E DATA */
    .clock-container {
        margin-top: 25px;
        text-align: center;
        transition: opacity 0.5s ease;
    }

    body.map-active .clock-container {
        opacity: 0;
        pointer-events: none;
    }

    .clock-time {
        font-size: 44px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #ffffff;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .clock-date {
        margin-top: 5px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
    }
</style>
</head>
<body>

<div id="mapBackground"></div>

<div id="mainUi">
    <div class="core-wrapper">
        <canvas id="coreCanvas" width="300" height="300"></canvas>
        <div class="jarvis-text">JARVIS</div>
    </div>

    <div class="clock-container">
        <div class="clock-time" id="timeDisplay">22:30</div>
        <div class="clock-date" id="dateDisplay">FRIDAY 28 APRIL</div>
    </div>
</div>

<script>
    // --- OROLOGIO REALTIME ---
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('timeDisplay').textContent = `${hours}:${minutes}`;

        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', options).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- ANIMAZIONE CORE BLU E PARTICELLE ---
    const canvas = document.getElementById('coreCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 65;

    let particles = [];
    for (let i = 0; i < 120; i++) {
        particles.push({
            angle: Math.random() * Math.PI * 2,
            distance: radius + (Math.random() - 0.5) * 30,
            size: Math.random() * 1.5 + 0.5,
            speed: (Math.random() - 0.5) * 0.02,
            alpha: Math.random() * 0.8 + 0.2
        });
    }

    function drawCore() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Anello blu esterno brillante
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#0066ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#0088ff';
        ctx.shadowBlur = 18;
        ctx.stroke();

        // Particelle fluttuanti
        particles.forEach(p => {
            p.angle += p.speed;
            const x = centerX + Math.cos(p.angle) * p.distance;
            const y = centerY + Math.sin(p.angle) * p.distance;

            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 180, 255, ${p.alpha})`;
            ctx.shadowBlur = 6;
            ctx.fill();
        });

        requestAnimationFrame(drawCore);
    }
    drawCore();
</script>
</body>
</html>
