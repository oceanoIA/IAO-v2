<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Dynamic Neural Hologram</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020304;
        font-family: monospace;
        color: #ffffff;
    }

    #webgl-container {
        position: absolute;
        inset: 0;
        z-index: 1;
    }

    /* UI HUD */
    .hud-top-left {
        position: absolute;
        top: 25px;
        left: 25px;
        z-index: 10;
    }
    .btn-hud {
        background: rgba(25, 18, 12, 0.7);
        border: 1px solid rgba(255, 180, 100, 0.35);
        color: #ffca90;
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 2px;
        border-radius: 4px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .btn-hud:hover {
        border-color: #ffaa44;
        box-shadow: 0 0 12px rgba(255, 170, 68, 0.4);
    }

    .hud-top-right {
        position: absolute;
        top: 25px;
        right: 25px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 1px;
        color: #ffaa44;
        text-shadow: 0 0 8px rgba(255, 170, 68, 0.6);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: #ffaa44;
        border-radius: 50%;
        box-shadow: 0 0 10px #ffaa44;
    }

    .hud-bottom {
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        text-align: center;
    }
    #statusText {
        font-size: 12px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    #chat {
        position: absolute;
        bottom: 130px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: min(520px, 90%);
        text-align: center;
        pointer-events: none;
    }
    .msg {
        background: rgba(20, 14, 8, 0.85);
        border: 1px solid rgba(255, 170, 68, 0.4);
        box-shadow: 0 0 15px rgba(255, 150, 50, 0.2);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 12px;
        color: #fff2e0;
        backdrop-filter: blur(8px);
    }

    /* BARRA DI DIGITAZIONE */
    .input-container {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: min(500px, 90%);
        display: flex;
        gap: 8px;
    }
    .input-field {
        flex: 1;
        background: rgba(20, 14, 8, 0.8);
        border: 1px solid rgba(255, 170, 68, 0.35);
        border-radius: 20px;
        padding: 10px 18px;
        color: #ffffff;
        font-family: monospace;
        font-size: 13px;
        outline: none;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .input-field:focus {
        border-color: #ffaa44;
        box-shadow: 0 0 12px rgba(255, 170, 68, 0.3);
    }
    .input-field::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }
    .btn-send {
        background: rgba(255, 140, 0, 0.2);
        border: 1px solid rgba(255, 170, 68, 0.5);
        color: #ffaa44;
        padding: 0 18px;
        border-radius: 20px;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .btn-send:hover {
        background: rgba(255, 170, 68, 0.4);
        box-shadow: 0 0 12px rgba(255, 170, 68, 0.4);
    }
</style>
</head>
<body>

<div class="hud-top-left">
    <button class="btn-hud" id="micBtn">MUTE</button>
</div>

<div class="hud-top-right">
    <div class="status-dot"></div>
    <span>connected</span>
</div>

<div id="webgl-container"></div>
<div id="chat"></div>

<div class="hud-bottom">
    <div id="statusText">listening...</div>
</div>

<div class="input-container">
    <input type="text" id="textInput" class="input-field" placeholder="Scrivi un comando a JARVIS..." />
    <button id="sendBtn" class="btn-send">INVIA</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

const API = "https://iao-ai-v3.oceano-masoud.workers.dev/";

// SCENA THREE.JS
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5.2;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// TEXTURE NEURONE OLOGRAFICO BRILLANTE
function createBioNeuronTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255, 255, 240, 1)');     // Nucleo bianco puro
    gradient.addColorStop(0.2, 'rgba(255, 185, 80, 0.9)');   // Alone oro/ambra
    gradient.addColorStop(0.55, 'rgba(160, 75, 25, 0.35)');  // Tonalità organica
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);

    return new THREE.CanvasTexture(canvas);
}

// STRUTTURA AD ALTA DENSITÀ NEURONALE (3000 NEURONI SENZA FORMA FISSA)
const count = 3000; 
const geometry = new THREE.BufferGeometry();
const basePositions = new Float32Array(count * 3);
const currentPositions = new Float32Array(count * 3);
const seeds = new Float32Array(count * 3);

for(let i = 0; i < count; i++) {
    // Distribuzione casuale asimmetrica in uno spazio organico 3D
    const x = (Math.random() - 0.5) * 3.2;
    const y = (Math.random() - 0.5) * 3.2;
    const z = (Math.random() - 0.5) * 3.2;

    basePositions[i*3] = x;
    basePositions[i*3+1] = y;
    basePositions[i*3+2] = z;

    currentPositions[i*3] = x;
    currentPositions[i*3+1] = y;
    currentPositions[i*3+2] = z;

    // Fasi uniche per consentire mutazioni di forma continue
    seeds[i*3] = Math.random() * Math.PI * 2;
    seeds[i*3+1] = Math.random() * Math.PI * 2;
    seeds[i*3+2] = Math.random() * Math.PI * 2;
}

geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

// MATERIALE OLOGRAFICO AMBRA/ORO
const pMaterial = new THREE.PointsMaterial({
    color: new THREE.Color(0xffb755),
    size: 0.055, 
    map: createBioNeuronTexture(),
    transparent: true,
    alphaTest: 0.001,
    opacity: 0.95,
    blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// CONTROLLO DINAMICO DELL'ENERGIA E MUTAZIONE DELLA FORMA
let targetEnergy = 0; 
let currentEnergy = 0;
let baseColor = new THREE.Color(0xff9d3b);
let activeColor = new THREE.Color(0xffe299);
let currentColor = baseColor.clone();

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.001;

    currentEnergy += (targetEnergy - currentEnergy) * 0.03;

    // Transizione del colore olografico
    currentColor.lerp(targetEnergy > 0.1 ? activeColor : baseColor, 0.04);
    pMaterial.color = currentColor;

    const pos = geometry.attributes.position.array;
    const speed = 0.6 + currentEnergy * 1.8;

    // Mutazione continua della struttura neurale nel tempo (senza rimanere una sfera)
    for(let i = 0; i < count; i++) {
        const idx = i * 3;
        const bx = basePositions[idx];
        const by = basePositions[idx+1];
        const bz = basePositions[idx+2];
        const sx = seeds[idx];
        const sy = seeds[idx+1];
        const sz = seeds[idx+2];

        // Onde di distorsione armonica tridimensionale
        const morphX = Math.sin(time * speed * 0.7 + sy + by * 1.2) * (0.35 + currentEnergy * 0.45);
        const morphY = Math.cos(time * speed * 0.8 + sz + bz * 1.2) * (0.35 + currentEnergy * 0.45);
        const morphZ = Math.sin(time * speed * 0.6 + sx + bx * 1.2) * (0.35 + currentEnergy * 0.45);

        pos[idx] = bx + morphX;
        pos[idx+1] = by + morphY;
        pos[idx+2] = bz + morphZ;
    }
    
    geometry.attributes.position.needsUpdate = true;

    // Rotazione composta e fluida nello spazio 3D
    particleSystem.rotation.y = Math.sin(time * 0.2) * 0.5 + time * 0.05;
    particleSystem.rotation.x = Math.cos(time * 0.15) * 0.3;
    particleSystem.rotation.z = Math.sin(time * 0.1) * 0.2;

    renderer.render(scene, camera);
}

animate();

// LOGICA INTERFACCIA E VOCALE
const statusText = document.getElementById("statusText");
const chat = document.getElementById("chat");
const micBtn = document.getElementById("micBtn");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

function setJarvisState(state) {
    if(state === "listening") {
        targetEnergy = 0;
        statusText.textContent = "listening...";
        statusText.style.color = "rgba(255, 255, 255, 0.4)";
        statusText.style.textShadow = "none";
    } else if(state === "speaking" || state === "thinking") {
        targetEnergy = 1;
        statusText.textContent = state === "thinking" ? "thinking..." : "speaking...";
        statusText.style.color = "#ffaa44";
        statusText.style.textShadow = "0 0 10px rgba(255, 170, 68, 0.8)";
    }
}

function addMsg(text) {
    chat.innerHTML = `<div class="msg">${text}</div>`;
}

function handleUserSend() {
    const text = textInput.value.trim();
    if(!text) return;
    textInput.value = "";
    addMsg(text);
    processAi(text);
}

sendBtn.onclick = handleUserSend;
textInput.onkeydown = (e) => {
    if(e.key === "Enter") handleUserSend();
};

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(Recognition) {
    const rec = new Recognition();
    rec.lang = 'it-IT';

    rec.onstart = () => setJarvisState("listening");
    rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        addMsg(text);
        processAi(text);
    };
    rec.onend = () => {};

    micBtn.onclick = () => {
        try { rec.start(); } catch{}
    };
}

async function processAi(text) {
    setJarvisState("thinking");
    try {
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        const reply = data.reply || "Elaborazione completata.";
        addMsg(reply);
        speak(reply);
    } catch {
        speak("Errore di connessione.");
    }
}

function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.onstart = () => setJarvisState("speaking");
    u.onend = () => setJarvisState("listening");
    speechSynthesis.speak(u);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
