    font-size:13px;
    line-height:1.5;

    backdrop-filter:blur(18px);

    animation:
        messageIn .35s ease,
        hudGlow 3s ease-in-out infinite;

    overflow:hidden;
}

/* LINEA SUPERIORE */

.message::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:1px;
    opacity:.7;
}

/* PICCOLA LINEA LATERALE */

.message::after{
    content:"";
    position:absolute;
    left:0;
    top:9px;
    bottom:9px;
    width:2px;
}

/* ENTRATA */

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateX(-18px);
        filter:blur(5px);
    }

    to{
        opacity:1;
        transform:translateX(0);
        filter:blur(0);
    }

function extractLocation(text){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower=
        text.toLowerCase();

    for(
        const prefix of patterns
    ){

        const index=
            lower.indexOf(prefix);

        if(index!==-1){

            let place=
                text.substring(
                    index+prefix.length
                ).trim();

            place=
                place.replace(
                    /^(la|il|lo|un|una|a|ad)\s+/i,
                    ""
                );

            if(place.length>1){

                return place;

            }

        }

    }

    return null;

}

async function searchPlace(place){

    setState("thinking");

    coordinates.textContent=
        "SEARCHING LOCATION...";

    try{

        const url=
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(place);

        const response=
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }

        const results=
            await response.json();

        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }

        const result=
            results[0];

        const lat=
            parseFloat(result.lat);

        const lon=
            parseFloat(result.lon);

        const name=
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");

        showLocation(
            name,
            lat,
            lon
        );

        return{
            name,
            lat,
            lon
        };

    }catch(error){

        console.error(error);

        coordinates.textContent=
            "LOCATION NOT FOUND";

        setState("idle");

        addMessage(
            "jarvis",
            "Non riesco a trovare questo luogo."
        );

        return null;

    }

}


/* =====================================================
   COORDINATE
===================================================== */

function formatCoordinates(lat,lon){

    const latDir=
        lat>=0 ? "N" : "S";

    const lonDir=
        lon>=0 ? "E" : "W";

    return(

        Math.abs(lat).toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon).toFixed(4)
        +
        "° "
        +
        lonDir

    );

}


/* =====================================================
   POSIZIONE
===================================================== */

function showLocation(
    name,
    lat,
    lon
){

    locationName.textContent=
        name;

    locationCoords.textContent=
        formatCoordinates(
            lat,
            lon
        );

    coordinates.textContent=
        formatCoordinates(
            lat,
            lon
        );

    locationInfo.classList.add(
        "visible"
    );

    focusEarth(
        lat,
        lon
    );

}


/* =====================================================
   POSIZIONE UTENTE
===================================================== */

function showMyLocation(){

    if(!navigator.geolocation){

        addMessage(
            "jarvis",
            "Il browser non supporta la geolocalizzazione."
        );

        return;

    }

    setState("thinking");

    coordinates.textContent=
        "ACQUISIZIONE POSIZIONE...";

    navigator.geolocation.getCurrentPosition(

        position=>{

            const lat=
                position.coords.latitude;

            const lon=
                position.coords.longitude;

            showLocation(
                "La mia posizione",
                lat,
                lon
            );

            addMessage(
                "jarvis",
                "La tua posizione è stata individuata sulla Terra."
            );

        },

        error=>{

            console.log(error);

            coordinates.textContent=
                "POSITION UNAVAILABLE";

            setState("idle");

            addMessage(
                "jarvis",
                "Non ho ricevuto il permesso per accedere alla posizione."
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }

    );

}


/* =====================================================
   FOCUS TERRA
===================================================== */

let zoomAnimating=false;

let zoomProgress=1;

let zoomStart=3.3;

let zoomEnd=1.55;

let targetQuaternion=
    new THREE.Quaternion();

function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi=
        (90-lat)
        *
        Math.PI/180;

    const theta=
        (lon+180)
        *
        Math.PI/180;

    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );

}

function focusEarth(
    lat,
    lon
){

    openMap();

    const target=
        latLonToVector3(
            lat,
            lon,
            1
        );

    marker.position.copy(
        target
        .clone()
        .multiplyScalar(1.025)
    );

    marker.visible=true;

    markerRing.visible=true;

    const direction=
        target
        .clone()
        .normalize();

    const front=
        new THREE.Vector3(
            0,
            0,
            1
        );

    targetQuaternion=
        new THREE.Quaternion();

    targetQuaternion.setFromUnitVectors(
        direction,
        front
    );

    zoomStart=
        earthCamera.position.length();

    if(zoomStart<2){

        zoomStart=3.3;

        earthCamera.position.set(
            0,
            0,
            zoomStart
        );

    }

    zoomEnd=1.55;

    zoomProgress=0;

    zoomAnimating=true;

    controls.enabled=false;

    setState("thinking");

}


/* =====================================================
   RETE NEURALE
===================================================== */

let neuralWidth=
    innerWidth;

let neuralHeight=
    innerHeight;

let neuralCx=
    neuralWidth/2;

let neuralCy=
    neuralHeight/2;


/* CORE PIÙ GRANDE */

let neuralRadius=
    Math.min(
        neuralWidth,
        neuralHeight
    )*.30;


let neuralRotation=0;

let nodes=[];


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth=
        innerWidth;

    neuralHeight=
        innerHeight;

    const dpr=
        Math.min(
            devicePixelRatio || 1,
            2
        );

    neuralCanvas.width=
        neuralWidth*dpr;

    neuralCanvas.height=
        neuralHeight*dpr;

    neuralCanvas.style.width=
        neuralWidth+"px";

    neuralCanvas.style.height=
        neuralHeight+"px";

    neuralCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    neuralCx=
        neuralWidth/2;

    neuralCy=
        neuralHeight/2;

    neuralRadius=
        Math.min(
            neuralWidth,
            neuralHeight
        )*.30;

    createNeuralNodes();

}


/* =====================================================
   NODI
===================================================== */

function createNeuralNodes(){

    nodes=[];

    for(
        let i=0;
        i<145;
        i++
    ){

        /*
           Ogni nodo ha un valore
           che decide se può diventare
           un nodo secondario.
        */

        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .72+
                    Math.random()*.55
                ),

            size:
                .7+
                Math.random()*1.8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            /*
               Circa il 13% dei nodi
               appartiene al gruppo speciale.
            */

            special:
                Math.random()<.13,

            colorPhase:
                Math.random()
                *
                Math.PI
                *
                2

        });

    }

}


/* =====================================================
   ANIMAZIONE RETE NEURALE
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );

    const time=
        performance.now()/1000;

    let speed=1;

    let energy=.2;

    if(state==="listening"){

        speed=4;

        energy=1.2;

    }

    if(state==="thinking"){

        speed=7;

        energy=2;

    }

    if(state==="speaking"){

        speed=5;

        energy=1.5;

    }

    neuralRotation+=
        .004*speed;

    neuralCtx.fillStyle=
        "rgba(0,0,0,.28)";

    neuralCtx.fillRect(
        0,
        0,
        neuralWidth,
        neuralHeight
    );


    /* =================================================
       COLORE CORE
    ================================================= */

    let targetColor;

    if(

        state==="listening" ||

        state==="thinking" ||

        state==="speaking"

    ){

        targetColor={
            r:25,
            g:140,
            b:255
        };

    }else{

        targetColor={
            r:255,
            g:195,
            b:0
        };

    }


    window.jarvisColor=
        window.jarvisColor ||
        {
            r:255,
            g:195,
            b:0
        };


    jarvisColor.r+=
        (
            targetColor.r-
            jarvisColor.r
        )*.055;

    jarvisColor.g+=
        (
            targetColor.g-
            jarvisColor.g
        )*.055;

    jarvisColor.b+=
        (
            targetColor.b-
            jarvisColor.b
        )*.055;


    const r=
        Math.round(
            jarvisColor.r
        );

    const g=
        Math.round(
            jarvisColor.g
        );

    const b=
        Math.round(
            jarvisColor.b
        );


    const pulse=
        (
            Math.sin(time*4)+1
        )/2;


    /* =================================================
       GLOW
    ================================================= */

    const glowRadius=
        neuralRadius*
        (
            1.05+
            energy*.7+
            pulse*.18
        );

    const gradient=
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glowRadius

        );

    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},.48)`
    );

    gradient.addColorStop(
        .35,
        `rgba(${r},${g},${b},.15)`
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    neuralCtx.fillStyle=
        gradient;

    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        glowRadius,
        0,
        Math.PI*2
    );

    neuralCtx.fill();


    /* =================================================
       PROIEZIONE NODI
    ================================================= */

    const projected=[];

    nodes.forEach(n=>{

        const rr=
            n.r+
            Math.sin(
                time*3+n.phase
            )
            *
            energy*
            7;

        let x=
            rr*
            Math.sin(n.phi)*
            Math.cos(
                n.theta+
                neuralRotation
            );

        let y=
            rr*
            Math.cos(n.phi);

        let z=
            rr*
            Math.sin(n.phi)*
            Math.sin(
                n.theta+
                neuralRotation
            );


        if(state!=="idle"){

            x+=
                Math.sin(
                    time*2+n.phase
                )
                *
                energy*
                7;

            y+=
                Math.cos(
                    time*2.5+n.phase
                )
                *
                energy*
                7;

        }


        const perspective=
            430/
            (
                430+z
            );


        projected.push({

            x:
                neuralCx+
                x*perspective,

            y:
                neuralCy+
                y*perspective,

            z,

            size:
                n.size*
                perspective,

            alpha:
                Math.max(
                    .1,
                    Math.min(
                        1,
                        (z+neuralRadius)/
                        (neuralRadius*2)
                    )
                ),

            phase:n.phase,

            special:n.special,

            colorPhase:n.colorPhase

        });

    });


    /* =================================================
       COLLEGAMENTI
    ================================================= */

    const maxDist=
        state==="thinking"
        ? 110
        : 82;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        for(
            let j=i+1;
            j<projected.length;
            j++
        ){

            const a=
                projected[i];

            const c=
                projected[j];

            const dx=
                a.x-c.x;

            const dy=
                a.y-c.y;

            const dist=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );

            if(dist<maxDist){

                const alpha=
                    (
                        1-
                        dist/maxDist
                    )
                    *
                    .3*
                    a.alpha;

                neuralCtx.beginPath();

                neuralCtx.moveTo(
                    a.x,
                    a.y
                );

                neuralCtx.lineTo(
                    c.x,
                    c.y
                );

                neuralCtx.strokeStyle=
                    `rgba(${r},${g},${b},${alpha})`;

                neuralCtx.lineWidth=.65;

                neuralCtx.stroke();

            }

        }

    }


    /* =================================================
       NODI
    ================================================= */

    projected.forEach(n=>{

        const flicker=
            (
                Math.sin(
                    time*7+n.phase
                )+1
            )/2;


        const size=
            n.size+
            flicker*
            (
                state==="thinking"
                ? 1.8
                : .7
            );


        /*
           COLORE SECONDARIO DINAMICO

           I nodi speciali non sono più
           semplicemente "viola fissi".

           Il colore cambia gradualmente
           durante l'animazione.
        */

        let nodeR=r;
        let nodeG=g;
        let nodeB=b;


        if(n.special){

            /*
               Valore che cambia nel tempo.
            */

            const colorWave=
                (
                    Math.sin(
                        time*.75+
                        n.colorPhase
                    )+1
                )/2;


            /*
               Passaggio morbido:
               giallo → viola → rosa
               → ritorno al colore principale.
            */

            const violetR=170;
            const violetG=55;
            const violetB=255;

            const pinkR=255;
            const pinkG=45;
            const pinkB=190;


            if(colorWave<.5){

                const p=
                    colorWave*2;

                nodeR=
                    Math.round(
                        violetR+
                        (pinkR-violetR)*p
                    );

                nodeG=
                    Math.round(
                        violetG+
                        (pinkG-violetG)*p
                    );

                nodeB=
                    Math.round(
                        violetB+
                        (pinkB-violetB)*p
                    );

            }else{

                const p=
                    (colorWave-.5)*2;

                nodeR=
                    Math.round(
                        pinkR+
                        (r-pinkR)*p
                    );

                nodeG=
                    Math.round(
                        pinkG+
                        (g-pinkG)*p
                    );

                nodeB=
                    Math.round(
                        pinkB+
                        (b-pinkB)*p
                    );

            }

        }


        /* GLOW DEL NODO */

        neuralCtx.fillStyle=
            `rgba(${nodeR},${nodeG},${nodeB},${n.alpha*.30})`;

        neuralCtx.beginPath();

        neuralCtx.arc(
            n.x,
            n.y,
            size*4,
            0,
            Math.PI*2
        );

        neuralCtx.fill();


        /* NUCLEO */

        neuralCtx.fillStyle=
            `rgba(${nodeR},${nodeG},${nodeB},${n.alpha})`;

        neuralCtx.beginPath();

        neuralCtx.arc(
            n.x,
            n.y,
            size,
            0,
            Math.PI*2
        );

        neuralCtx.fill();

    });


    /* =================================================
       CORE CENTRALE
    ================================================= */

    const core=
        5+
        pulse*2+
        energy*2;

    neuralCtx.fillStyle=
        `rgba(${r},${g},${b},.38)`;

    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core*5,
        0,
        Math.PI*2
    );

    neuralCtx.fill();

    neuralCtx.fillStyle="#fff";

    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core,
        0,
        Math.PI*2
    );

    neuralCtx.fill();

}


/* =====================================================
   TERRA ANIMATA
===================================================== */

let markerPulse=0;

function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );

    if(
        mapMode &&
        zoomAnimating
    ){

        zoomProgress+=.012;

        if(zoomProgress>=1){

            zoomProgress=1;

            zoomAnimating=false;

            controls.enabled=true;

            setState("idle");

        }

        const eased=
            1-
            Math.pow(
                1-zoomProgress,
                3
            );

        const distance=
            zoomStart+
            (
                zoomEnd-
                zoomStart
            )
            *
            eased;

        const cameraDirection=
            earthCamera.position
            .clone()
            .normalize();

        earthCamera.position.copy(

            cameraDirection
            .multiplyScalar(
                distance
            )

        );

        earthGroup.quaternion.slerp(
            targetQuaternion,
            .045
        );

    }

    controls.update();

    if(marker.visible){

        markerPulse+=.08;

        const scale=
            1+
            Math.sin(
                markerPulse
            )*.3;

        marker.scale.set(
            scale,
            scale,
            scale
        );

        markerRing.visible=true;

        markerRing.position.copy(
            marker.position
        );

        markerRing.lookAt(
            earthCamera.position
        );

        markerRing.scale.set(
            scale,
            scale,
            scale
        );

    }

    earthRenderer.render(
        earthScene,
        earthCamera
    );

}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localCommand(text){

    const t=
        text.toLowerCase();


    if(

        t.includes("che ore sono") ||

        t.includes("che ora è") ||

        t.includes("che ora e")

    ){

        return(

            "Sono le "
            +
            new Date()
            .toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
            +
            "."

        );

    }


    if(

        t.includes("che giorno è") ||

        t.includes("che giorno e")

    ){

        return(

            "Oggi è "
            +
            new Date()
            .toLocaleDateString(
                "it-IT",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )
            +
            "."

        );

    }


    if(

        t.includes("mia posizione") ||

        t.includes("dove sono")

    ){

        showMyLocation();

        return "__LOCATION__";

    }


    if(isMapCommand(t)){

        openMap();

        return "Mappa terrestre attivata.";

    }


    return null;

}


/* =====================================================
   INVIO
===================================================== */

send.onclick=
    sendMessage;


input.addEventListener(
    "keydown",
    event=>{

        if(event.key==="Enter"){

            event.preventDefault();

            input.blur();

            sendMessage();

        }

    }
);


async function sendMessage(){

    const text=
        input.value.trim();

    if(!text || busy){

        return;

    }

    busy=true;

    input.blur();

    input.value="";

    addMessage(
        "user",
        text
    );

    remember(
        "user",
        text
    );


    const place=
        extractLocation(text);


    if(place){

        openMap();

        const answer=
            addMessage(
                "jarvis",
                "Localizzazione di "
                +
                place
                +
                "..."
            );

        const result=
            await searchPlace(
                place
            );

        if(result){

            answer.textContent=
                "Ho individuato "
                +
                result.name
                +
                ".";

            remember(
                "assistant",
                answer.textContent
            );

        }

        finish();

        return;

    }


    const local=
        localCommand(text);


    if(local){

        if(local!=="__LOCATION__"){

            addMessage(
                "jarvis",
                local
            );

            remember(
                "assistant",
                local
            );

            if(conversationMode){

                speak(local);

            }else{

                setState("idle");

            }

        }

        finish();

        return;

    }


    input.disabled=true;

    send.disabled=true;

    mic.disabled=true;

    conversation.disabled=true;

    setState("thinking");


    const answer=
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory=
        memory.slice(-24);


    const intelligentContext={

        assistantName:"JARVIS",

        language:"it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        mapMode:mapMode,

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Comprendi il significato della domanda e non limitarti a ripetere parole chiave.",

            "Se hai abbastanza informazioni, rispondi direttamente.",

            "Se una domanda è ambigua, fai una domanda breve per capire meglio.",

            "Usa la memoria della conversazione quando è utile.",

            "Non inventare informazioni quando non sei sicuro.",

            "Spiega le cose in modo naturale e intelligente.",

            "Per domande complesse, ragiona per passaggi ma presenta una risposta chiara.",

            "Non dire continuamente che sei un'intelligenza artificiale.",

            "Comportati come un assistente personale chiamato JARVIS."

        ]

    };


    try{

        const response=
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data=
            await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent=
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        if(conversationMode){

            speak(
                data.reply
            );

        }else{

            setState("idle");

        }


    }catch(error){

        console.error(error);


        answer.textContent=
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        setState("idle");

    }


    finish();

}


/* =====================================================
   FINE
===================================================== */

function finish(){

    busy=false;

    input.disabled=false;

    send.disabled=false;

    mic.disabled=false;

    conversation.disabled=false;

}


/* =====================================================
   VOCI
===================================================== */

function speak(text){

    if(!("speechSynthesis" in window)){

        setState("idle");

        return;

    }

    speechSynthesis.cancel();


    const utterance=
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang="it-IT";

    utterance.rate=.88;

    utterance.pitch=.65;

    utterance.volume=1;


    utterance.onstart=()=>{

        setState(
            "speaking"
        );

    };


    utterance.onend=()=>{

        setState(
            "idle"
        );


        if(
            conversationMode &&
            wakeMode
        ){

            setTimeout(
                startWakeWord,
                600
            );

        }

    };


    utterance.onerror=()=>{

        setState(
            "idle"
        );

    };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   CONVERSAZIONE
===================================================== */

conversation.onclick=()=>{

    conversationMode=
        !conversationMode;


    if(conversationMode){

        wakeMode=true;

        conversation.classList.add(
            "active"
        );

        conversation.textContent=
            "🔵";

        setState(
            "listening"
        );

        startWakeWord();


    }else{

        wakeMode=false;

        conversation.classList.remove(
            "active"
        );

        conversation.textContent=
            "🔊";

        stopWakeWord();

        if(speechSynthesis){

            speechSynthesis.cancel();

        }

        setState(
            "idle"
        );

    }

};


/* =====================================================
   MICROFONO
===================================================== */

const Recognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(Recognition){

    recognition=
        new Recognition();


    recognition.lang=
        "it-IT";


    recognition.continuous=
        false;


    recognition.interimResults=
        true;


    recognition.onstart=()=>{

        listening=true;

        mic.classList.add(
            "active"
        );

        mic.textContent=
            "■";

        input.placeholder=
            "JARVIS ti sta ascoltando...";

        setState(
            "listening"
        );

    };


    recognition.onresult=
        event=>{

            let transcript="";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript+=
                    event.results[i][0]
                    .transcript;

            }


            input.value=
                transcript;


            const last=
                event.results[
                    event.results.length-1
                ];


            if(last.isFinal){

                setTimeout(()=>{

                    if(
                        input.value.trim()
                    ){

                        input.blur();

                        sendMessage();

                    }

                },250);

            }

        };


    recognition.onerror=
        event=>{

            console.log(
                "Speech recognition:",
                event.error
            );

        };


    recognition.onend=()=>{

        listening=false;

        mic.classList.remove(
            "active"
        );

        mic.textContent=
            "🎙";

        input.placeholder=
            "Comunica con JARVIS...";


        if(state==="listening"){

            setState(
                "idle"
            );

        }

    };


    mic.onclick=()=>{

        if(busy)return;

        conversationMode=true;

        wakeMode=false;

        conversation.classList.add(
            "active"
        );

        conversation.textContent=
            "🔵";


        if(listening){

            recognition.stop();

            return;

        }


        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    };


}else{

    mic.disabled=true;

}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(

        !Recognition ||
        !conversationMode ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition

    ){

        return;

    }


    wakeRecognition=
        new Recognition();


    wakeRecognition.lang=
        "it-IT";


    wakeRecognition.continuous=
        true;


    wakeRecognition.interimResults=
        true;


    wakeRecognition.onresult=
        event=>{

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                const text=
                    event.results[i][0]
                    .transcript
                    .toLowerCase();


                if(text.includes("jarvis")){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition=null;

                    activateJarvis();

                    return;

                }

            }

        };


    wakeRecognition.onerror=()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(
                startWakeWord,
                1200
            );

        }

    };


    wakeRecognition.onend=()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(
                startWakeWord,
                600
            );

        }

    };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition=null;

    }

}


function stopWakeWord(){

    if(wakeRecognition){

        try{

            wakeRecognition.stop();

        }catch{}

        wakeRecognition=null;

    }

}


function activateJarvis(){

    if(
        busy ||
        listening
    ){

        return;

    }

    setState(
        "listening"
    );

    input.placeholder=
        "JARVIS ti ascolta...";


    setTimeout(()=>{

        try{

            recognition.start();

        }catch{}

    },250);

}
