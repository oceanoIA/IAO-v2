<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>J.A.R.V.I.S.</title>


<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#010405;

    font-family:Arial,sans-serif;

}

body{

    background:
        radial-gradient(
            circle at center,
            #071719 0%,
            #020708 48%,
            #000000 100%
        );

}


/* =====================================================
   THREE
===================================================== */

#webgl-container{

    position:fixed;

    inset:0;

    z-index:1;

}


.vignette{

    position:fixed;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.20) 65%,
            rgba(0,0,0,.80) 100%
        );

}


/* =====================================================
   JARVIS
===================================================== */

.jarvis-title{

    position:fixed;

    top:2%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:10;

    color:
        rgba(255,255,255,.86);

    font-size:
        clamp(22px,3vw,34px);

    font-weight:300;

    letter-spacing:
        clamp(5px,1vw,9px);

    white-space:nowrap;

    text-shadow:
        0 0 10px
        rgba(255,255,255,.12);

    pointer-events:none;

}


/* =====================================================
   DATA / ORA
===================================================== */

.datetime{

    position:fixed;

    top:18px;

    right:24px;

    z-index:10;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:3px;

    font-family:monospace;

    pointer-events:none;

}


.time{

    color:
        rgba(150,255,255,.60);

    font-size:11px;

    letter-spacing:2px;

    text-shadow:
        0 0 8px
        rgba(0,255,255,.20);

}


.date{

    color:
        rgba(150,255,255,.38);

    font-size:8px;

    letter-spacing:1px;

}


/* =====================================================
   CHAT
===================================================== */

#chat{

    position:fixed;

    left:50%;

    bottom:92px;

    transform:
        translateX(-50%);

    z-index:15;

    width:min(620px,88%);

    text-align:center;

    pointer-events:none;

}


.msg{

    display:inline-block;

    max-width:100%;

    padding:
        10px 18px;

    border:
        1px solid
        rgba(0,255,255,.22);

    border-radius:24px;

    background:
        rgba(4,20,23,.40);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    color:
        rgba(235,255,255,.90);

    font-size:12px;

    line-height:1.45;

}


/* =====================================================
   INPUT
===================================================== */

.command-wrapper{

    position:fixed;

    left:50%;

    bottom:23px;

    transform:
        translateX(-50%);

    z-index:20;

    width:min(650px,90%);

    display:flex;

    align-items:center;

    padding:
        6px 7px 6px 20px;

    border:
        1px solid
        rgba(100,255,255,.28);

    border-radius:40px;

    background:
        rgba(5,20,23,.38);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 0 30px
        rgba(0,255,255,.05);

}


.command-wrapper:focus-within{

    border-color:
        rgba(0,255,255,.60);

    box-shadow:
        0 0 25px
        rgba(0,255,255,.12);

}


/* =====================================================
   TEXT INPUT
===================================================== */

#textInput{

    flex:1;

    min-width:0;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:
        12px 5px;

}


#textInput::placeholder{

    color:
        rgba(255,255,255,.30);

}


/* =====================================================
   MICROFONO
===================================================== */

#micBtn{

    width:34px;

    height:34px;

    margin-right:7px;

    border:none;

    background:transparent;

    color:
        rgba(210,255,255,.65);

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

}


.mic-icon{

    width:8px;

    height:14px;

    border:
        1.3px solid
        currentColor;

    border-radius:6px;

    position:relative;

}


.mic-icon::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-6px;

    width:12px;

    height:7px;

    transform:
        translateX(-50%);

    border:
        1.3px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 8px 8px;

}


#micBtn:hover{

    color:#00ffff;

}


#micBtn.active{

    color:#8fffff;

}


/* =====================================================
   INVIA
===================================================== */

#sendBtn{

    height:39px;

    padding:
        0 17px;

    border:
        1px solid
        rgba(0,255,255,.28);

    border-radius:22px;

    background:
        rgba(0,255,255,.05);

    color:
        rgba(220,255,255,.78);

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

}


#sendBtn:hover{

    color:white;

    border-color:#00ffff;

    background:
        rgba(0,255,255,.10);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .jarvis-title{

        top:1.5%;

        font-size:24px;

        letter-spacing:5px;

    }


    .datetime{

        top:12px;

        right:13px;

    }


    .time{

        font-size:10px;

    }


    .date{

        font-size:7px;

    }


    .command-wrapper{

        width:
            calc(100% - 24px);

        bottom:17px;

    }


    #textInput{

        font-size:13px;

    }


    #chat{

        bottom:80px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SCENA
===================================================== -->

<div id="webgl-container"></div>

<div class="vignette"></div>


<!-- =====================================================
     TITOLO
===================================================== -->

<div class="jarvis-title">
    J.A.R.V.I.S
</div>


<!-- =====================================================
     ORA E DATA
===================================================== -->

<div class="datetime">

    <div
        id="clock"
        class="time"
    >
        00:00:00
    </div>

    <div
        id="date"
        class="date"
    >
        00 AGO 2026
    </div>

</div>


<!-- =====================================================
     CHAT
===================================================== -->

<div id="chat"></div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="command-wrapper">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        placeholder="Chiedi qualcosa a JARVIS..."
    >


    <button
        id="micBtn"
        aria-label="Microfono"
    >

        <span
            class="mic-icon"
        ></span>

    </button>


    <button
        id="sendBtn"
    >
        INVIA
    </button>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">

{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}

</script>


<script type="module">

import * as THREE from "three";


/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


const MEMORY_KEY =
    "jarvis_memory_v1";


const MAX_MEMORY =
    30;


/* =====================================================
   ELEMENTI
===================================================== */

const container =
    document.getElementById(
        "webgl-container"
    );


const chat =
    document.getElementById(
        "chat"
    );


const textInput =
    document.getElementById(
        "textInput"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const micBtn =
    document.getElementById(
        "micBtn"
    );


const clock =
    document.getElementById(
        "clock"
    );


const date =
    document.getElementById(
        "date"
    );


/* =====================================================
   MEMORIA
===================================================== */

let memory = [];


try{

    const saved =
        localStorage.getItem(
            MEMORY_KEY
        );


    if(saved){

        const parsed =
            JSON.parse(saved);


        if(
            Array.isArray(parsed)
        ){

            memory =
                parsed.slice(
                    -MAX_MEMORY
                );

        }

    }

}catch(error){

    console.warn(
        "Memoria:",
        error
    );

}


function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                memory.slice(
                    -MAX_MEMORY
                )
            )
        );

    }catch(error){

        console.warn(
            "Salvataggio memoria:",
            error
        );

    }

}


function addMemory(
    role,
    content
){

    memory.push({

        role:
            role,

        content:
            content

    });


    memory =
        memory.slice(
            -MAX_MEMORY
        );


    saveMemory();

}


/* =====================================================
   ORA / DATA
===================================================== */

const months = [

    "GEN",
    "FEB",
    "MAR",
    "APR",
    "MAG",
    "GIU",
    "LUG",
    "AGO",
    "SET",
    "OTT",
    "NOV",
    "DIC"

];


function updateClock(){

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2,"0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const s =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    clock.textContent =
        `${h}:${m}:${s}`;


    const d =
        String(
            now.getDate()
        ).padStart(2,"0");


    const month =
        months[
            now.getMonth()
        ];


    const year =
        now.getFullYear();


    date.textContent =
        `${d} ${month} ${year}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   THREE SCENE
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        .1,

        1000

    );


camera.position.z =
    5.2;


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


container.appendChild(
    renderer.domElement
);


/* =====================================================
   TEXTURE
===================================================== */

function createGlow(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        64;


    canvas.height =
        64;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const gradient =
        ctx.createRadialGradient(
            32,
            32,
            0,
            32,
            32,
            32
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );


    gradient.addColorStop(
        .2,
        "rgba(220,255,255,1)"
    );


    gradient.addColorStop(
        .4,
        "rgba(0,255,255,.9)"
    );


    gradient.addColorStop(
        .7,
        "rgba(0,150,190,.25)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        64,
        64
    );


    return new THREE.CanvasTexture(
        canvas
    );

}


/* =====================================================
   PARTICELLE
===================================================== */

const COUNT =
    3000;


const geometry =
    new THREE.BufferGeometry();


const positions =
    new Float32Array(
        COUNT * 3
    );


const radii =
    new Float32Array(
        COUNT
    );


const angles =
    new Float32Array(
        COUNT * 2
    );


const seeds =
    new Float32Array(
        COUNT
    );


for(
    let i=0;
    i<COUNT;
    i++
){

    const r =
        1.10 +
        Math.random()*.70;


    const theta =
        Math.random() *
        Math.PI *
        2;


    const phi =
        Math.acos(
            2*Math.random()-1
        );


    radii[i] =
        r;


    angles[i*2] =
        theta;


    angles[i*2+1] =
        phi;


    seeds[i] =
        Math.random()*100;


    positions[i*3] =
        r *
        Math.sin(phi) *
        Math.cos(theta);


    positions[i*3+1] =
        r *
        Math.sin(phi) *
        Math.sin(theta);


    positions[i*3+2] =
        r *
        Math.cos(phi);

}


geometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        positions,
        3
    )

);


/* =====================================================
   MATERIALE
===================================================== */

const material =
    new THREE.PointsMaterial({

        color:
            new THREE.Color(
                0x00cfe8
            ),

        size:
            .034,

        map:
            createGlow(),

        transparent:true,

        opacity:.82,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending

    });


const particles =
    new THREE.Points(
        geometry,
        material
    );


scene.add(
    particles
);


/* =====================================================
   ENERGIA
===================================================== */

let targetEnergy =
    .15;


let energy =
    .15;


const normalColor =
    new THREE.Color(
        0x00cfe8
    );


const activeColor =
    new THREE.Color(
        0x8fffff
    );


const currentColor =
    normalColor.clone();


function setState(
    state
){

    if(
        state === "thinking"
    ){

        targetEnergy =
            1;

    }

    else if(
        state === "speaking"
    ){

        targetEnergy =
            .8;

    }

    else if(
        state === "listening"
    ){

        targetEnergy =
            .55;

    }

    else{

        targetEnergy =
            .15;

    }

}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now()*.001;


    energy +=
        (
            targetEnergy -
            energy
        )*.045;


    currentColor.lerp(
        activeColor,
        energy*.04
    );


    if(
        energy < .3
    ){

        currentColor.lerp(
            normalColor,
            .03
        );

    }


    material.color =
        currentColor;


    material.size =
        .032 +
        energy*.008;


    const pos =
        geometry
            .attributes
            .position
            .array;


    for(
        let i=0;
        i<COUNT;
        i++
    ){

        const index =
            i*3;


        const r =
            radii[i];


        const theta =
            angles[i*2];


        const phi =
            angles[i*2+1];


        const seed =
            seeds[i];


        const pulse =
            Math.sin(
                time*2 +
                seed
            )*.035;


        const strangeShape =
            Math.sin(
                theta*6 +
                time*2 +
                seed
            )*.18*energy;


        const wave =
            Math.cos(
                phi*7 -
                time*1.8 +
                seed
            )*.12*energy;


        const rr =
            r +
            pulse +
            strangeShape +
            wave;


        let x =
            rr *
            Math.sin(phi) *
            Math.cos(theta);


        let y =
            rr *
            Math.sin(phi) *
            Math.sin(theta);


        let z =
            rr *
            Math.cos(phi);


        x +=
            Math.sin(
                time*2.4 +
                phi*8 +
                seed
            )*.08*energy;


        y +=
            Math.cos(
                time*2.1 +
                theta*9 +
                seed
            )*.08*energy;


        z +=
            Math.sin(
                time*2.7 +
                (theta+phi)*7
            )*.10*energy;


        pos[index] =
            x;


        pos[index+1] =
            y;


        pos[index+2] =
            z;

    }


    geometry
        .attributes
        .position
        .needsUpdate =
            true;


    particles.rotation.y +=
        .0005 +
        energy*.0008;


    particles.rotation.x =
        Math.sin(
            time*.25
        )*.04;


    particles.rotation.z =
        Math.cos(
            time*.18
        )*.025;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   MESSAGGIO
===================================================== */

function addMsg(
    text
){

    chat.innerHTML =
        "";


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "msg";


    element.textContent =
        text;


    chat.appendChild(
        element
    );

}


/* =====================================================
   CONTESTO TEMPORALE
===================================================== */

function getTimeData(){

    const now =
        new Date();


    return {

        currentTime:
            now.toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            ),

        currentDate:
            now.toLocaleDateString(
                "it-IT",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric"
                }
            ),

        dayOfWeek:
            now.toLocaleDateString(
                "it-IT",
                {
                    weekday:"long"
                }
            ),

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone

    };

}


/* =====================================================
   PROCESS AI
===================================================== */

async function processAi(
    text
){

    setState(
        "thinking"
    );


    try{

        const temporal =
            getTimeData();


        addMemory(
            "user",
            text
        );


        console.log(
            "Invio a JARVIS:",
            {
                message:text,
                memory:memory,
                ...temporal
            }
        );


        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                memory,

                            currentTime:
                                temporal.currentTime,

                            currentDate:
                                temporal.currentDate,

                            dayOfWeek:
                                temporal.dayOfWeek,

                            timezone:
                                temporal.timezone

                        })

                }
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        if(
            !response.ok
        ){

            const error =
                await response.text();


            console.error(
                "Worker:",
                error
            );


            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Risposta JARVIS:",
            data
        );


        if(
            !data.reply
        ){

            throw new Error(
                "Risposta non valida"
            );

        }


        const reply =
            String(
                data.reply
            ).trim();


        addMemory(
            "assistant",
            reply
        );


        addMsg(
            reply
        );


        speak(
            reply
        );


    }catch(error){

        console.error(
            "JARVIS ERROR:",
            error
        );


        addMsg(
            "Errore di connessione."
        );


        setState(
            "idle"
        );

    }

}


/* =====================================================
   INVIO
===================================================== */

function sendMessage(){

    const text =
        textInput.value.trim();


    if(
        !text
    ){

        return;

    }


    textInput.value =
        "";


    addMsg(
        text
    );


    processAi(
        text
    );

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


textInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   VOCE
===================================================== */

function speak(
    text
){

    if(
        !window.speechSynthesis
    ){

        setState(
            "idle"
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    utterance.rate =
        .95;


    utterance.pitch =
        .85;


    utterance.onstart =
        () => {

            setState(
                "speaking"
            );

        };


    utterance.onend =
        () => {

            setState(
                "idle"
            );

        };


    utterance.onerror =
        () => {

            setState(
                "idle"
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICROFONO
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


let listening =
    false;


if(
    Recognition
){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening =
                true;


            micBtn.classList.add(
                "active"
            );


            setState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if(
                text
            ){

                textInput.value =
                    text;


                sendMessage();

            }

        };


    recognition.onerror =
        error => {

            console.error(
                "Microfono:",
                error
            );


            listening =
                false;


            micBtn.classList.remove(
                "active"
            );


            setState(
                "idle"
            );

        };


    recognition.onend =
        () => {

            listening =
                false;


            micBtn.classList.remove(
                "active"
            );

        };


    micBtn.addEventListener(
        "click",
        () => {

            if(
                listening
            ){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }

        }
    );

}else{

    micBtn.style.opacity =
        ".3";

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   CANCELLA MEMORIA
===================================================== */

window.clearJarvisMemory =
    function(){

        memory =
            [];
