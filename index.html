<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

.header{
    position:fixed;
    top:25px;
    left:0;
    width:100%;
    text-align:center;
    z-index:10;
    pointer-events:none;
}

.header h1{
    margin:0;
    font-size:25px;
    font-weight:300;
    letter-spacing:12px;
    text-shadow:0 0 15px #ffb300;
}

.status{
    margin-top:7px;
    font-family:monospace;
    font-size:10px;
    letter-spacing:3px;
    opacity:.7;
}

#statusDot{
    color:#ffd000;
    text-shadow:0 0 10px currentColor;
}

.info{
    position:fixed;
    top:25px;
    left:25px;
    z-index:10;
    font:10px monospace;
    letter-spacing:2px;
    line-height:1.8;
    color:rgba(255,200,0,.5);
    border-left:2px solid rgba(255,200,0,.6);
    padding-left:10px;
}

.info.right{
    left:auto;
    right:25px;
    text-align:right;
    border-left:0;
    border-right:2px solid rgba(255,200,0,.6);
    padding-left:0;
    padding-right:10px;
}

#coreText{
    position:fixed;
    z-index:5;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font:9px monospace;
    letter-spacing:4px;
    color:rgba(255,255,255,.35);
    pointer-events:none;
}

#coreText span{
    display:block;
    margin-top:7px;
    font-size:7px;
    letter-spacing:2px;
}

#chat{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    max-height:25vh;
    overflow-y:auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scrollbar-width:none;
}

#chat::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:85%;
    padding:11px 15px;
    border-radius:5px;
    font-size:14px;
    line-height:1.5;
    word-wrap:break-word;
    backdrop-filter:blur(10px);
}

.user{
    align-self:flex-end;
    background:rgba(255,180,0,.08);
    border:1px solid rgba(255,190,0,.35);
    border-right:3px solid #ffbf00;
}

.jarvis{
    align-self:flex-start;
    background:rgba(15,10,0,.82);
    border:1px solid rgba(255,190,0,.18);
    border-left:3px solid #ffbf00;
    color:#ffeab0;
}

.inputArea{
    position:fixed;
    z-index:30;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    padding:0 20px;
}

.inputBox{
    display:flex;
    gap:7px;
    padding:5px;
    background:rgba(8,6,2,.95);
    border:1px solid rgba(255,190,0,.4);
    border-radius:7px;
    box-shadow:0 0 25px rgba(255,170,0,.08);
}

#input{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 14px;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    font-size:14px;
}

#input::placeholder{
    color:rgba(255,220,150,.35);
}

button{
    height:44px;
    border-radius:5px;
    border:1px solid rgba(255,190,0,.5);
    background:rgba(255,180,0,.1);
    color:#ffc400;
    font-family:monospace;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffc400;
    color:#000;
    box-shadow:0 0 18px rgba(255,190,0,.6);
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#mic{
    width:48px;
    font-size:17px;
}

#send{
    width:70px;
}

#mic.active{
    background:#287cff;
    color:white;
    border-color:#287cff;
    box-shadow:0 0 20px #287cff;
}

@media(max-width:600px){

    .info{
        display:none;
    }

    .header h1{
        font-size:20px;
        letter-spacing:8px;
    }

    #chat{
        bottom:110px;
    }

    .message{
        max-width:90%;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="info">
JARVIS CORE V6<br>
NEURAL ENGINE: ONLINE<br>
SYSTEM: ACTIVE
</div>

<div class="info right">
MEMORY: <span id="memoryCount">0</span><br>
STATE: <span id="stateText">IDLE</span>
</div>

<div class="header">
    <h1>J.A.R.V.I.S.</h1>

    <div class="status">
        <span id="statusDot">●</span>
        NEURAL INTERFACE ONLINE
    </div>
</div>

<div id="coreText">
    NEURAL CORE
    <span id="coreState">READY</span>
</div>

<div id="chat">

    <div class="message jarvis">
        JARVIS online. In attesa di istruzioni.
    </div>

</div>

<div class="inputArea">

    <div class="inputBox">

        <input
            id="input"
            type="text"
            placeholder="Scrivi a JARVIS..."
            autocomplete="off"
        >

        <button id="mic" type="button">
            🎙
        </button>

        <button id="send" type="button">
            INVIA
        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API_URL =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const chat =
document.getElementById("chat");

const stateText =
document.getElementById("stateText");

const coreState =
document.getElementById("coreState");

const statusDot =
document.getElementById("statusDot");

const memoryCount =
document.getElementById("memoryCount");


/* =====================================================
   STATO JARVIS
===================================================== */

let jarvisState =
"idle";

let recognition =
null;

let isListening =
false;

let isBusy =
false;


function setState(state){

    jarvisState =
    state;

    stateText.textContent =
    state.toUpperCase();


    if(state === "idle"){

        coreState.textContent =
        "READY";

    }

    if(state === "listening"){

        coreState.textContent =
        "LISTENING";

    }

    if(state === "thinking"){

        coreState.textContent =
        "PROCESSING";

    }

    if(state === "speaking"){

        coreState.textContent =
        "SPEAKING";

    }

}


/* =====================================================
   MEMORIA LOCALE
===================================================== */

let memory = [];

try{

    const saved =
    localStorage.getItem(
        "jarvis_memory"
    );

    if(saved){

        memory =
        JSON.parse(saved);

    }

}catch(error){

    memory = [];

}


function saveMemory(){

    memory =
    memory.slice(-20);

    try{

        localStorage.setItem(
            "jarvis_memory",
            JSON.stringify(memory)
        );

    }catch(error){}

    memoryCount.textContent =
    memory.length;

}


function addMemory(
    role,
    content
){

    memory.push({
        role:role,
        content:content
    });

    saveMemory();

}


saveMemory();


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const element =
    document.createElement("div");

    element.className =
    "message " + type;

    element.textContent =
    text;

    chat.appendChild(
        element
    );

    chat.scrollTop =
    chat.scrollHeight;

    return element;

}


/* =====================================================
   ORA
===================================================== */

function currentTime(){

    return new Date()
    .toLocaleTimeString(
        "it-IT",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localAnswer(text){

    const t =
    text
    .toLowerCase()
    .trim();


    if(
        t.includes("che ore sono") ||
        t.includes("che ora è") ||
        t.includes("che ora e") ||
        t.includes("dimmi l'ora") ||
        t.includes("dimmi l ora")
    ){

        return (
            "Sono le " +
            currentTime() +
            "."
        );

    }


    if(
        t === "ciao" ||
        t === "ciao jarvis" ||
        t === "hey jarvis"
    ){

        return "Ciao. Sono JARVIS, pronto.";

    }


    return null;

}


/* =====================================================
   INVIO MESSAGGIO
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    const text =
    input.value.trim();


    if(
        !text ||
        isBusy
    ){

        return;

    }


    isBusy =
    true;

    input.value =
    "";


    addMessage(
        "user",
        text
    );


    addMemory(
        "user",
        text
    );


    setState(
        "thinking"
    );


    input.disabled =
    true;

    send.disabled =
    true;

    mic.disabled =
    true;


    /* ==============================
       RISPOSTA LOCALE
    ============================== */

    const local =
    localAnswer(text);


    if(local){

        const message =
        addMessage(
            "jarvis",
            local
        );


        addMemory(
            "assistant",
            local
        );


        speak(local);


        finish();

        return;

    }


    /* ==============================
       API
    ============================== */

    const jarvisMessage =
    addMessage(
        "jarvis",
        "JARVIS sta elaborando..."
    );


    try{

        const response =
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    message:text,

                    memory:
                    memory.slice(-20)

                })

            }
        );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
        await response.json();


        if(
            !data.reply
        ){

            throw new Error(
                "Risposta vuota"
            );

        }


        jarvisMessage.textContent =
        data.reply;


        addMemory(
            "assistant",
            data.reply
        );


        chat.scrollTop =
        chat.scrollHeight;


        speak(
            data.reply
        );


    }catch(error){

        console.error(
            "JARVIS ERROR:",
            error
        );


        jarvisMessage.textContent =
        "Non riesco a collegarmi al Neural Core.";

    }


    finish();

}


/* =====================================================
   FINE OPERAZIONE
===================================================== */

function finish(){

    input.disabled =
    false;

    send.disabled =
    false;

    mic.disabled =
    false;

    isBusy =
    false;

    if(
        !isListening &&
        !speechSynthesis.speaking
    ){

        setState(
            "idle"
        );

    }

    input.focus();

}


/* =====================================================
   VOCE JARVIS
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        setState("idle");

        return;

    }


    speechSynthesis.cancel();


    const voice =
    new SpeechSynthesisUtterance(
        text
    );


    voice.lang =
    "it-IT";

    voice.rate =
    .92;

    voice.pitch =
    .75;

    voice.volume =
    1;


    voice.onstart =
    function(){

        setState(
            "speaking"
        );

    };


    voice.onend =
    function(){

        setState(
            "idle"
        );

    };


    voice.onerror =
    function(){

        setState(
            "idle"
        );

    };


    speechSynthesis.speak(
        voice
    );

}


/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(
    SpeechRecognition
){

    recognition =
    new SpeechRecognition();


    recognition.lang =
    "it-IT";

    recognition.continuous =
    false;

    recognition.interimResults =
    true;


    recognition.onstart =
    function(){

        isListening =
        true;

        mic.classList.add(
            "active"
        );

        mic.textContent =
        "■";

        input.placeholder =
        "Ti ascolto...";

        setState(
            "listening"
        );

    };


    recognition.onresult =
    function(event){

        let text =
        "";


        for(
            let i =
            event.resultIndex;

            i <
            event.results.length;

            i++
        ){

            text +=
            event.results[i][0]
            .transcript;

        }


        input.value =
        text;


        const last =
        event.results[
            event.results.length-1
        ];


        if(
            last.isFinal
        ){

            setTimeout(
                function(){

                    if(
                        input.value.trim()
                    ){

                        sendMessage();

                    }

                },
                150
            );

        }

    };


    recognition.onerror =
    function(event){

        console.log(
            "Microfono:",
            event.error
        );

        isListening =
        false;

        mic.classList.remove(
            "active"
        );

        mic.textContent =
        "🎙";

        input.placeholder =
        "Scrivi a JARVIS...";

        setState(
            "idle"
        );

    };


    recognition.onend =
    function(){

        isListening =
        false;

        mic.classList.remove(
            "active"
        );

        mic.textContent =
        "🎙";

        input.placeholder =
        "Scrivi a JARVIS...";

        if(
            jarvisState ===
            "listening"
        ){

            setState(
                "idle"
            );

        }

    };


    mic.addEventListener(
        "click",
        function(){

            if(
                isListening
            ){

                recognition.stop();

                return;

            }


            try{

                recognition.start();

            }catch(error){

                console.log(error);

            }

        }
    );


}else{

    mic.disabled =
    true;

    mic.title =
    "Riconoscimento vocale non supportato";

}


/* =====================================================
   SFERA NEURALE
===================================================== */

let width =
window.innerWidth;

let height =
window.innerHeight;

let centerX =
width / 2;

let centerY =
height / 2;

let radius =
Math.min(
    width,
    height
) * .22;


let rotation =
0;


let nodes =
[];


function resize(){

    width =
    window.innerWidth;

    height =
    window.innerHeight;


    canvas.width =
    width *
    devicePixelRatio;

    canvas.height =
    height *
    devicePixelRatio;


    canvas.style.width =
    width + "px";

    canvas.style.height =
    height + "px";


    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    centerX =
    width / 2;

    centerY =
    height / 2;


    radius =
    Math.min(
        width,
        height
    ) * .22;


    createNodes();

}


function createNodes(){

    nodes = [];


    for(
        let i=0;
        i<160;
        i++
    ){

        const theta =
        Math.random() *
        Math.PI *
        2;


        const phi =
        Math.acos(
            2 *
            Math.random() -
            1
        );


        nodes.push({

            theta:theta,

            phi:phi,

            r:
            radius *
            (
                .72 +
                Math.random()*.45
            ),

            size:
            .8 +
            Math.random()*1.7,

            phase:
            Math.random() *
            Math.PI *
            2

        });

    }

}


/* =====================================================
   COLORI
===================================================== */

const colors = {

    idle:{
        r:255,
        g:190,
        b:0
    },

    listening:{
        r:30,
        g:130,
        b:255
    },

    thinking:{
        r:190,
        g:50,
        b:255
    },

    speaking:{
        r:40,
        g:255,
        b:110
    }

};


let color = {
    r:255,
    g:190,
    b:0
};


function updateColor(){

    const target =
    colors[jarvisState];


    color.r +=
    (
        target.r -
        color.r
    ) * .035;


    color.g +=
    (
        target.g -
        color.g
    ) * .035;


    color.b +=
    (
        target.b -
        color.b
    ) * .035;

}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateColor();


    const time =
    performance.now() /
    1000;


    let speed =
    1;


    let energy =
    .3;


    if(
        jarvisState ===
        "listening"
    ){

        speed =
        3;

        energy =
        .8;

    }


    if(
        jarvisState ===
        "thinking"
    ){

        speed =
        5;

        energy =
        1.2;

    }


    if(
        jarvisState ===
        "speaking"
    ){

        speed =
        3.5;

        energy =
        1;

    }


    rotation +=
    .004 *
    speed;


    /* ==============================
       SFONDO
    ============================== */

    ctx.fillStyle =
    "rgba(0,0,0,.25)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const r =
    Math.round(color.r);

    const g =
    Math.round(color.g);

    const b =
    Math.round(color.b);


    /* ==============================
       GLOW CENTRALE
    ============================== */

    const pulse =
    (
        Math.sin(
            time*4
        ) + 1
    ) / 2;


    const glowRadius =
    radius *
    (
        1.2 +
        energy*.65 +
        pulse*.15
    );


    const gradient =
    ctx.createRadialGradient(
        centerX,
        centerY,
        0,
        centerX,
        centerY,
        glowRadius
    );


    gradient.addColorStop(
        0,
        `rgba(
            ${r},
            ${g},
            ${b},
            .45
        )`
    );


    gradient.addColorStop(
        .25,
        `rgba(
            ${r},
            ${g},
            ${b},
            .15
        )`
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
    gradient;


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        glowRadius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ==============================
       NODI
    ============================== */

    const projected =
    [];


    nodes.forEach(
        function(node){

            const extra =
            Math.sin(
                time*3 +
                node.phase
            ) *
            energ
