<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   INTERFACCIA
========================= */

.hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

.title {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;

    font-size: 34px;
    font-weight: 300;
    letter-spacing: 12px;

    color: #e9fbff;

    text-shadow:
        0 0 8px rgba(0,234,255,.7),
        0 0 25px rgba(0,234,255,.3);
}

.system {
    margin-top: 8px;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(255,255,255,.4);
}

.system span {
    color: #00eaff;
    text-shadow: 0 0 12px #00eaff;
}

/* =========================
   CHAT
========================= */

#chat {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: 95px;

    max-height: 25vh;
    overflow-y: auto;

    display: flex;
    flex-direction: column;
    gap: 7px;

    z-index: 20;
}

.message {
    max-width: 82%;
    padding: 11px 14px;

    border-radius: 12px;

    font-size: 14px;
    line-height: 1.4;

    backdrop-filter: blur(12px);
}

.user {
    align-self: flex-end;

    background: rgba(0,234,255,.06);
    border: 1px solid rgba(0,234,255,.23);
}

.jarvis {
    align-self: flex-start;

    background: rgba(255,255,255,.035);
    border: 1px solid rgba(0,234,255,.12);
}

/* =========================
   INPUT
========================= */

.input-area {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: 17px;

    display: flex;
    gap: 9px;

    z-index: 30;
}

input {
    flex: 1;

    height: 52px;

    padding: 0 18px;

    border-radius: 26px;

    border: 1px solid rgba(0,234,255,.22);

    background: rgba(3,3,3,.9);

    color: white;
    outline: none;

    font-size: 15px;

    backdrop-filter: blur(15px);
}

input:focus {
    border-color: rgba(0,234,255,.7);

    box-shadow:
        0 0 20px rgba(0,234,255,.12);
}

button {
    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: #00dff5;

    color: #001114;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(0,234,255,.55),
        0 0 35px rgba(0,234,255,.2);
}

button:active {
    transform: scale(.9);
}

@media (max-width: 500px) {

    .title {
        font-size: 29px;
        letter-spacing: 9px;
    }
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="hud">

    <div class="title">

        JARVIS

        <div class="system">
            <span>●</span> NEURAL CORE ONLINE
        </div>

    </div>

</div>

<div id="chat">

    <div class="message jarvis">
        Sistema online. Sono JARVIS.
    </div>

</div>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">➤</button>

</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   SCENA
========================================================= */

const canvas =
    document.getElementById("scene");

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        0.1,
        1000
    );

camera.position.z = 7;

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

/* =========================================================
   LUCI
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0x061519,
        1.4
    );

scene.add(ambient);

const cyanLight =
    new THREE.PointLight(
        0x00eaff,
        7,
        9
    );

scene.add(cyanLight);

const goldLight =
    new THREE.PointLight(
        0xffb800,
        3,
        5
    );

scene.add(goldLight);

/* =========================================================
   MENTE JARVIS
========================================================= */

const brain =
    new THREE.Group();

scene.add(brain);

/* =========================================================
   NUCLEO CENTRALE
========================================================= */

const nucleusGeometry =
    new THREE.SphereGeometry(
        .42,
        64,
        64
    );

const nucleusMaterial =
    new THREE.MeshPhysicalMaterial({

        color: 0xffd94a,

        emissive: 0xffa800,

        emissiveIntensity: 2.2,

        roughness: .12,

        metalness: .15,

        clearcoat: 1
    });

const nucleus =
    new THREE.Mesh(
        nucleusGeometry,
        nucleusMaterial
    );

brain.add(nucleus);

/* piccolo nucleo bianco */

const nucleusGlowGeometry =
    new THREE.SphereGeometry(
        .20,
        32,
        32
    );

const nucleusGlowMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

const nucleusGlow =
    new THREE.Mesh(
        nucleusGlowGeometry,
        nucleusGlowMaterial
    );

brain.add(nucleusGlow);

/* =========================================================
   RETE NEURALE
========================================================= */

const nodes = [];
const nodeCount = 125;

/*
    I nodi vengono distribuiti
    su una sfera 3D.
*/

for (let i = 0; i < nodeCount; i++) {

    const phi =
        Math.acos(
            1 -
            2 *
            (i + .5) /
            nodeCount
        );

    const theta =
        Math.PI *
        (1 + Math.sqrt(5)) *
        i;

    const radius =
        1.0 +
        Math.random() * .45;

    const x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.cos(phi);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    nodes.push(
        new THREE.Vector3(
            x,
            y,
            z
        )
    );
}

/* =========================================================
   PUNTI DELLA RETE
========================================================= */

const nodePositions =
    new Float32Array(
        nodeCount * 3
    );

for (
    let i = 0;
    i < nodeCount;
    i++
) {

    nodePositions[i * 3] =
        nodes[i].x;

    nodePositions[i * 3 + 1] =
        nodes[i].y;

    nodePositions[i * 3 + 2] =
        nodes[i].z;
}

const nodeGeometry =
    new THREE.BufferGeometry();

nodeGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        nodePositions,
        3
    )
);

const nodeMaterial =
    new THREE.PointsMaterial({

        color: 0x7df6ff,

        size: .035,

        transparent: true,

        opacity: .9,

        blending:
            THREE.AdditiveBlending
    });

const nodePoints =
    new THREE.Points(
        nodeGeometry,
        nodeMaterial
    );

brain.add(nodePoints);

/* =========================================================
   CONNESSIONI NEURALI
========================================================= */

const linePositions = [];

for (
    let i = 0;
    i < nodeCount;
    i++
) {

    for (
        let j = i + 1;
        j < nodeCount;
        j++
    ) {

        const distance =
            nodes[i].distanceTo(
                nodes[j]
            );

        if (distance < .48) {

            linePositions.push(
                nodes[i].x,
                nodes[i].y,
                nodes[i].z,

                nodes[j].x,
                nodes[j].y,
                nodes[j].z
            );
        }
    }
}

const lineGeometry =
    new THREE.BufferGeometry();

lineGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        linePositions,
        3
    )
);

const lineMaterial =
    new THREE.LineBasicMaterial({

        color: 0x00dff5,

        transparent: true,

        opacity: .20,

        blending:
            THREE.AdditiveBlending
    });

const neuralLines =
    new THREE.LineSegments(
        lineGeometry,
        lineMaterial
    );

brain.add(neuralLines);

/* =========================================================
   ANELLI
========================================================= */

const rings = [];

function createRing(
    radius,
    rotation,
    speed,
    opacity
) {

    const geometry =
        new THREE.TorusGeometry(
            radius,
            .006,
            8,
            240
        );

    const material =
        new THREE.MeshBasicMaterial({

            color: 0x00eaff,

            transparent: true,

            opacity,

            blending:
                THREE.AdditiveBlending
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.set(
        rotation.x,
        rotation.y,
        rotation.z
    );

    ring.userData.speed =
        speed;

    brain.add(ring);

    rings.push(ring);
}

createRing(
    1.45,
    {x: .9, y: .2, z: .2},
    .00055,
    .55
);

createRing(
    1.65,
    {x: 1.3, y: -.4, z: .8},
    -.00035,
    .38
);

createRing(
    1.85,
    {x: .3, y: 1.1, z: -.5},
    .00025,
    .28
);

/* =========================================================
   PARTICELLE
========================================================= */

const particleCount = 280;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const radius =
        1.5 +
        Math.random() * 2.5;

    const angle =
        Math.random() *
        Math.PI * 2;

    particlePositions[i * 3] =
        Math.cos(angle) *
        radius;

    particlePositions[i * 3 + 1] =
        (Math.random() - .5) *
        3;

    particlePositions[i * 3 + 2] =
        Math.sin(angle) *
        radius;
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({

        color: 0x52eefa,

        size: .014,

        transparent: true,

        opacity: .35,

        blending:
            THREE.AdditiveBlending
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

brain.add(particles);

/* =========================================================
   ANIMAZIONE
========================================================= */

let thinking = false;

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();

    /* ROTAZIONE GENERALE */

    brain.rotation.y =
        t * .035;

    brain.rotation.x =
        Math.sin(t * .12) * .025;

    /* NUCLEO */

    nucleus.rotation.y =
        t * .15;

    nucleusGlow.scale.setScalar(
        1 +
        Math.sin(t * 2) * .08
    );

    /* RETE */

    nodePoints.rotation.y =
        -t * .025;

    neuralLines.rotation.y =
        -t * .025;

    /* ANELLI */

    rings.forEach(
        ring => {

            ring.rotation.z +=
                ring.userData.speed *
                (thinking ? 1.5 : 1);

            ring.rotation.x +=
                ring.userData.speed *
                .05;
        }
    );

    /* PARTICELLE */

    particles.rotation.y =
        t * .012;

    particles.rotation.x =
        Math.sin(t * .1) * .025;

    /* PULSAZIONE */

    const pulse =
        1 +
        Math.sin(t * 1.7) *
        .018;

    const active =
        thinking
            ? 1.07
            : 1;

    brain.scale.setScalar(
        pulse * active
    );

    /* LUCI */

    cyanLight.intensity =
        thinking
            ? 11
            : 6 +
              Math.sin(t * 1.7) *
              .7;

    goldLight.intensity =
        thinking
            ? 5
            : 2.5;

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   CHAT JARVIS
========================================================= */

window.sendMessage =
async function() {

    const input =
        document.getElementById(
            "input"
        );

    const chat =
        document.getElementById(
            "chat"
        );

    const text =
        input.value.trim();

    if (!text)
        return;

    const userMessage =
        document.createElement(
            "div"
        );

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(
        userMessage
    );

    input.value = "";

    const jarvisMessage =
        document.createElement(
            "div"
        );

    jarvisMessage.className =
        "message jarvis";

    jarvisMessage.textContent =
        "Sto elaborando...";

    chat.appendChild(
        jarvisMessage
    );

    thinking = true;

    chat.scrollTop =
        chat.scrollHeight;

    try {

        const response =
            await fetch(
                "https://iao-ai-v3.oceano-masoud.workers.dev/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        jarvisMessage.textContent =
            data.reply ||
            "Non ho ricevuto una risposta.";

    } catch (error) {

        console.error(error);

        jarvisMessage.textContent =
            "Errore di collegamento.";

    }

    thinking = false;

    chat.scrollTop =
        chat.scrollHeight;
};

</script>

</body>
</html>
