<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Advanced Neural Core</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020305;
        font-family: monospace;
        color: #ffffff;
    }

    #webgl-container {
        position: absolute;
        inset: 0;
        z-index: 1;
    }

    /* UI HUD */
    .hud-top-left {
        position: absolute;
        top: 25px;
        left: 25px;
        z-index: 10;
    }
    .btn-hud {
        background: rgba(8, 14, 25, 0.7);
        border: 1px solid rgba(0, 160, 255, 0.35);
        color: #70b8ff;
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 2px;
        border-radius: 4px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }
    .btn-hud:hover {
        border-color: #00d2ff;
        box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
    }

    .hud-top-right {
        position: absolute;
        top: 25px;
        right: 25px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 1px;
        color: #00ffcc;
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: #00ffcc;
        border-radius: 50%;
        box-shadow: 0 0 10px #00ffcc;
    }

    .hud-bottom {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        text-align: center;
    }
    #statusText {
        font-size: 12px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    #chat {
        position: absolute;
        bottom: 75px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: min(520px, 90%);
        text-align: center;
        pointer-events: none;
    }
    .msg {
        background: rgba(4, 10, 20, 0.85);
        border: 1px solid rgba(0, 180, 255, 0.4);
        box-shadow: 0 0 15px rgba(0, 120, 255, 0.2);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 12px;
        color: #e0f2ff;
        backdrop-filter: blur(8px);
    }
</style>
</head>
<body>

<div class="hud-top-left">
    <button class="btn-hud" id="micBtn">MUTE</button>
</div>

<div class="hud-top-right">
    <div class="status-dot"></div>
    <span>connected</span>
</div>

<div id="webgl-container"></div>
<div id="chat"></div>

<div class="hud-bottom">
    <div id="statusText">listening...</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

const API = "https://iao-ai-v3.oceano-masoud.workers.dev/";

// SCENA THREE.JS
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 4.8;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// GEOMETRIA PARTICELLE E NEURONI
const count = 2200;
const geometry = new THREE.BufferGeometry();
const spherePositions = new Float32Array(count * 3);
const ringPositions = new Float32Array(count * 3);
const currentPositions = new Float32Array(count * 3);
const randomOffsets = new Float32Array(count * 3);

for(let i = 0; i < count; i++) {
    // Offset casuali per movimento neurale organico
    randomOffsets[i*3] = (Math.random() - 0.5) * 2;
    randomOffsets[i*3+1] = (Math.random() - 0.5) * 2;
    randomOffsets[i*3+2] = (Math.random() - 0.5) * 2;

    // 1. Sfera
    const r = 1.7 * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    
    spherePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    spherePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    spherePositions[i*3+2] = r * Math.cos(phi);

    // 2. Anello 3D
    const ringR = 1.8 + (Math.random() - 0.5) * 0.45;
    const ringAngle = Math.random() * Math.PI * 2;
    const tubeR = (Math.random() - 0.5) * 0.35;
    const tubeAngle = Math.random() * Math.PI * 2;

    ringPositions[i*3] = (ringR + tubeR * Math.cos(tubeAngle)) * Math.cos(ringAngle);
    ringPositions[i*3+1] = (ringR + tubeR * Math.cos(tubeAngle)) * Math.sin(ringAngle);
    ringPositions[i*3+2] = tubeR * Math.sin(tubeAngle);

    currentPositions[i*3] = spherePositions[i*3];
    currentPositions[i*3+1] = spherePositions[i*3+1];
    currentPositions[i*3+2] = spherePositions[i*3+2];
}

geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

// MATERIALE PARTICELLE BLU SCURO INTENSO / BRILLANTE
const pMaterial = new THREE.PointsMaterial({
    color: new THREE.Color(0x0055ff),
    size: 0.028,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// CORE FUTURISTICO MULTISTRATO
const coreGroup = new THREE.Group();

// Strato 1: Nucleo denso
const innerGeo = new THREE.IcosahedronGeometry(0.2, 3);
const innerMat = new THREE.MeshBasicMaterial({
    color: 0x00d2ff,
    wireframe: true,
    transparent: true,
    opacity: 0.9
});
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
coreGroup.add(innerMesh);

// Strato 2: Halo energetico esterno
const outerGeo = new THREE.SphereGeometry(0.35, 32, 32);
const outerMat = new THREE.MeshBasicMaterial({
    color: 0x0033aa,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending
});
const outerMesh = new THREE.Mesh(outerGeo, outerMat);
coreGroup.add(outerMesh);

scene.add(coreGroup);

// CONTROLLO TRANSIZIONE E COLORI
let morphTarget = 0; 
let morphProgress = 0;
let baseColor = new THREE.Color(0x0044cc);
let activeColor = new THREE.Color(0x00f0ff);
let currentColor = baseColor.clone();

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.0015;

    // Transizione forma (0 = Sfera, 1 = Anello)
    morphProgress += (morphTarget - morphProgress) * 0.04;

    // Transizione colore dinamica
    const targetColor = morphTarget > 0.1 ? activeColor : baseColor;
    currentColor.lerp(targetColor, 0.05);
    pMaterial.color = currentColor;

    const pos = geometry.attributes.position.array;
    for(let i = 0; i < count; i++) {
        const idx = i * 3;

        // Base interpolazione Sfera -> Anello
        let bx = spherePositions[idx] + (ringPositions[idx] - spherePositions[idx]) * morphProgress;
        let by = spherePositions[idx+1] + (ringPositions[idx+1] - spherePositions[idx+1]) * morphProgress;
        let bz = spherePositions[idx+2] + (ringPositions[idx+2] - spherePositions[idx+2]) * morphProgress;

        // Movimento fluido dei neuroni
        const wave = Math.sin(time * 2 + randomOffsets[idx] * 5) * (0.04 + morphProgress * 0.03);
        pos[idx] = bx + randomOffsets[idx] * wave;
        pos[idx+1] = by + randomOffsets[idx+1] * wave;
        pos[idx+2] = bz + randomOffsets[idx+2] * wave;
    }
    geometry.attributes.position.needsUpdate = true;

    // Rotazione adattiva
    particleSystem.rotation.y += 0.002 + morphProgress * 0.005;
    particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, morphTarget * 0.85, 0.04);

    // Animazione Core Futuristico
    innerMesh.rotation.x += 0.01;
    innerMesh.rotation.y += 0.015;
    const pulse = 1 + Math.sin(time * 4) * (0.15 + morphProgress * 0.2);
    coreGroup.scale.setScalar(pulse);

    // Fade-out Core quando si apre l'anello
    innerMat.opacity = THREE.MathUtils.lerp(0.9, 0.1, morphProgress);
    outerMat.opacity = THREE.MathUtils.lerp(0.4, 0.05, morphProgress);

    renderer.render(scene, camera);
}

animate();

// LOGICA E VOCALE
const statusText = document.getElementById("statusText");
const chat = document.getElementById("chat");
const micBtn = document.getElementById("micBtn");

function setJarvisState(state) {
    if(state === "listening") {
        morphTarget = 0;
        statusText.textContent = "listening...";
        statusText.style.color = "rgba(255, 255, 255, 0.4)";
        statusText.style.textShadow = "none";
    } else if(state === "speaking" || state === "thinking") {
        morphTarget = 1;
        statusText.textContent = state === "thinking" ? "thinking..." : "speaking...";
        statusText.style.color = "#00f0ff";
        statusText.style.textShadow = "0 0 10px rgba(0, 240, 255, 0.8)";
    }
}

function addMsg(text) {
    chat.innerHTML = `<div class="msg">${text}</div>`;
}

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(Recognition) {
    const rec = new Recognition();
    rec.lang = 'it-IT';

    rec.onstart = () => setJarvisState("listening");
    rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        addMsg(text);
        processAi(text);
    };
    rec.onend = () => {};

    micBtn.onclick = () => {
        try { rec.start(); } catch{}
    };
}

async function processAi(text) {
    setJarvisState("thinking");
    try {
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        const reply = data.reply || "Elaborazione completata.";
        addMsg(reply);
        speak(reply);
    } catch {
        speak("Errore di connessione.");
    }
}

function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.onstart = () => setJarvisState("speaking");
    u.onend = () => setJarvisState("listening");
    speechSynthesis.speak(u);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
