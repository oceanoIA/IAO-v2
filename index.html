<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010405;
    font-family:Arial, sans-serif;
}

/* =========================
   SFONDO
========================= */

body{
    background:
        radial-gradient(
            circle at center,
            #07171a 0%,
            #020708 42%,
            #000 100%
        );
}

#webgl-container{
    position:fixed;
    inset:0;
    z-index:1;
}

/* Leggerissima vignettatura */

.vignette{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 38%,
            rgba(0,0,0,.22) 70%,
            rgba(0,0,0,.7) 100%
        );
}

/* =========================
   J.A.R.V.I.S.
========================= */

.jarvis-title{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;

    font-family:Arial, sans-serif;

    font-size:clamp(34px,7vw,72px);

    font-weight:300;

    letter-spacing:
        clamp(8px,2vw,20px);

    color:rgba(255,255,255,.82);

    text-shadow:
        0 0 8px rgba(255,255,255,.18),
        0 0 25px rgba(0,255,255,.12);

    white-space:nowrap;

    transition:
        opacity .4s ease,
        transform .4s ease;
}


/* =========================
   CASELLA COMANDO
========================= */

.command-wrapper{

    position:fixed;

    left:50%;
    bottom:28px;

    transform:translateX(-50%);

    z-index:20;

    width:min(620px,88%);

    display:flex;
    align-items:center;

    padding:6px 7px 6px 20px;

    border-radius:40px;

    background:
        rgba(5,20,23,.38);

    border:
        1px solid rgba(120,255,255,.28);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:

        0 0 25px
        rgba(0,255,255,.06),

        inset 0 0 20px
        rgba(0,255,255,.025);

    transition:
        border-color .3s ease,
        box-shadow .3s ease;
}

.command-wrapper:focus-within{

    border-color:
        rgba(0,255,255,.65);

    box-shadow:

        0 0 25px
        rgba(0,255,255,.12),

        inset 0 0 25px
        rgba(0,255,255,.035);
}


/* =========================
   INPUT
========================= */

#textInput{

    flex:1;

    min-width:0;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:12px 5px;

    letter-spacing:.3px;
}

#textInput::placeholder{

    color:
        rgba(255,255,255,.32);

    transition:
        color .3s ease;
}

.command-wrapper:focus-within
#textInput::placeholder{

    color:
        rgba(255,255,255,.5);
}


/* =========================
   MICROFONO MINIMAL
========================= */

#micBtn{

    flex-shrink:0;

    width:38px;
    height:38px;

    margin-right:5px;

    border-radius:50%;

    border:
        1px solid
        rgba(150,255,255,.22);

    background:
        rgba(255,255,255,.035);

    color:
        rgba(220,255,255,.75);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        .25s ease;
}

/* Microfono disegnato con CSS */

.mic-icon{

    position:relative;

    width:10px;
    height:17px;

    border:
        1.5px solid
        currentColor;

    border-radius:7px;

    display:block;
}

.mic-icon::before{

    content:"";

    position:absolute;

    left:50%;
    bottom:-7px;

    width:14px;
    height:9px;

    transform:
        translateX(-50%);

    border:
        1.5px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 10px 10px;
}

.mic-icon::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:-11px;

    width:1.5px;
    height:5px;

    transform:
        translateX(-50%);

    background:
        currentColor;

    box-shadow:
        -4px 4px 0 -0.2px currentColor,
         4px 4px 0 -0.2px currentColor;
}

#micBtn:hover{

    color:#00ffff;

    border-color:
        rgba(0,255,255,.7);

    background:
        rgba(0,255,255,.07);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.18);
}

#micBtn.active{

    color:#ffff00;

    border-color:
        rgba(255,255,0,.7);

    box-shadow:
        0 0 18px
        rgba(255,255,0,.22);
}


/* =========================
   INVIA
========================= */

#sendBtn{

    flex-shrink:0;

    height:38px;

    padding:
        0 17px;

    border-radius:22px;

    border:
        1px solid
        rgba(0,255,255,.25);

    background:
        rgba(0,255,255,.055);

    color:
        rgba(220,255,255,.75);

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.25s ease;
}

#sendBtn:hover{

    color:#fff;

    border-color:
        rgba(0,255,255,.7);

    background:
        rgba(0,255,255,.12);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.15);
}

#sendBtn:active{

    transform:scale(.95);
}


/* =========================
   CHAT
========================= */

#chat{

    position:fixed;

    left:50%;
    bottom:92px;

    transform:translateX(-50%);

    z-index:15;

    width:min(600px,85%);

    text-align:center;

    pointer-events:none;
}

.msg{

    display:inline-block;

    max-width:100%;

    padding:
        10px 18px;

    border-radius:25px;

    border:
        1px solid
        rgba(0,255,255,.2);

    background:
        rgba(5,20,23,.35);

    backdrop-filter:
        blur(12px);

    color:
        rgba(235,255,255,.85);

    font-size:12px;

    line-height:1.45;

    animation:
        messageIn .3s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:
            translateY(8px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .jarvis-title{

        font-size:38px;

        letter-spacing:8px;
    }

    .command-wrapper{

        width:calc(100% - 28px);

        bottom:18px;

        padding-left:16px;
    }

    #textInput{

        font-size:13px;
    }

    #sendBtn{

        padding:0 13px;

        font-size:9px;
    }

    #micBtn{

        width:36px;
        height:36px;
    }

    #chat{

        bottom:82px;

        width:88%;
    }

    .msg{

        font-size:11px;
    }
}

</style>
</head>

<body>

<div id="webgl-container"></div>

<div class="vignette"></div>


<!-- =========================
     TITOLO CENTRALE
========================= -->

<div class="jarvis-title">
    J.A.R.V.I.S
</div>


<!-- =========================
     CHAT
========================= -->

<div id="chat"></div>


<!-- =========================
     COMANDO
========================= -->

<div class="command-wrapper">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        placeholder="Chiedi qualcosa a JARVIS..."
    >

    <button
        id="micBtn"
        aria-label="Microfono"
    >
        <span class="mic-icon"></span>
    </button>

    <button
        id="sendBtn"
    >
        INVIA
    </button>

</div>


<!-- =========================
     THREE.JS
========================= -->

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from 'three';


/* =====================================================
   API
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   DOM
===================================================== */

const container =
    document.getElementById(
        "webgl-container"
    );

const chat =
    document.getElementById(
        "chat"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const jarvisTitle =
    document.querySelector(
        ".jarvis-title"
    );


/* =====================================================
   SCENA
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.z = 5.2;


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

container.appendChild(
    renderer.domElement
);


/* =====================================================
   TEXTURE PARTICELLA
===================================================== */

function createGlowTexture(){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 64;
    canvas.height = 64;

    const ctx =
        canvas.getContext(
            "2d"
        );

    const gradient =
        ctx.createRadialGradient(
            32,32,0,
            32,32,32
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        .18,
        "rgba(255,255,170,.98)"
    );

    gradient.addColorStop(
        .4,
        "rgba(0,255,255,.9)"
    );

    gradient.addColorStop(
        .7,
        "rgba(0,180,200,.35)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,0,64,64
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


/* =====================================================
   RETE NEURALE
===================================================== */

const COUNT = 3000;

const geometry =
    new THREE.BufferGeometry();


const positions =
    new Float32Array(
        COUNT * 3
    );

const basePositions =
    new Float32Array(
        COUNT * 3
    );

const radii =
    new Float32Array(
        COUNT
    );

const angles =
    new Float32Array(
        COUNT * 2
    );


for(
    let i=0;
    i<COUNT;
    i++
){

    const r =
        1.55 +
        Math.random() * .5;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );


    radii[i] = r;

    angles[i*2] =
        theta;

    angles[i*2+1] =
        phi;


    const x =
        r *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        r *
        Math.sin(phi) *
        Math.sin(theta);

    const z =
        r *
        Math.cos(phi);


    positions[i*3] =
        x;

    positions[i*3+1] =
        y;

    positions[i*3+2] =
        z;


    basePositions[i*3] =
        x;

    basePositions[i*3+1] =
        y;

    basePositions[i*3+2] =
        z;
}


geometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        positions,
        3
    )
);


/* =====================================================
   MATERIALE
===================================================== */

const particleMaterial =
    new THREE.PointsMaterial({

        color:
            new THREE.Color(
                0x00ffff
            ),

        size:
            .044,

        map:
            createGlowTexture(),

        transparent:
            true,

        opacity:
            .9,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const particles =
    new THREE.Points(
        geometry,
        particleMaterial
    );

scene.add(
    particles
);


/* =====================================================
   STATO
===================================================== */

let targetEnergy = .15;
let currentEnergy = .15;


const cyan =
    new THREE.Color(
        0x00ffff
    );

const yellow =
    new THREE.Color(
        0xffff00
    );

const currentColor =
    cyan.clone();


function setState(state){

    if(
        state === "thinking" ||
        state === "speaking"
    ){

        targetEnergy = 1;

        jarvisTitle.style.opacity =
            ".95";

    }else{

        targetEnergy = .15;

        jarvisTitle.style.opacity =
            ".82";
    }
}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now()
        * .001;


    currentEnergy +=
        (
            targetEnergy -
            currentEnergy
        ) * .035;


    currentColor.lerp(
        currentEnergy > .35
            ? yellow
            : cyan,
        .035
    );


    particleMaterial.color =
        currentColor;


    const pos =
        geometry.attributes
        .position.array;


    for(
        let i=0;
        i<COUNT;
        i++
    ){

        const index =
            i * 3;


        const r =
            radii[i];

        const theta =
            angles[i*2];

        const phi =
            angles[i*2+1];


        const wave =
            Math.sin(
                time * 1.8 +
                phi * 5 +
                i * .002
            ) * .045;


        const energyWave =
            Math.sin(
                time * 3 +
                theta * 5
            )
            *
            .18
            *
            currentEnergy;


        const rr =
            r +
            wave +
            energyWave;


        pos[index] =
            rr *
            Math.sin(phi) *
            Math.cos(
                theta +
                Math.sin(
                    time + phi
                ) *
                .04 *
                currentEnergy
            );


        pos[index+1] =
            rr *
            Math.sin(phi) *
            Math.sin(theta);


        pos[index+2] =
            rr *
            Math.cos(
                phi +
                Math.sin(
                    time * 1.5 +
                    theta
                ) *
                .03 *
                currentEnergy
            );
    }


    geometry.attributes
        .position
        .needsUpdate = true;


    particles.rotation.y +=
        .0018 +
        currentEnergy *
        .004;

    particles.rotation.x =
        Math.sin(
            time * .35
        ) * .08;


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   CHAT
===================================================== */

function addMsg(text){

    chat.innerHTML = "";

    const msg =
        document.createElement(
            "div"
        );

    msg.className =
        "msg";

    msg.textContent =
        text;

    chat.appendChild(
        msg
    );
}


/* =====================================================
   AI
===================================================== */

async function processAi(text){

    setState(
        "thinking"
    );


    try{

        const response =
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:text
                        })
                }
            );


        if(!response.ok)
            throw new Error();


        const data =
            await response.json();


        const reply =
            data.reply ||
            "Elaborazione completata.";


        addMsg(
            reply
        );

        speak(
            reply
        );


    }catch(error){

        console.error(
            error
        );

        addMsg(
            "Errore di connessione."
        );

        speak(
            "Errore di connessione."
        );
    }
}


/* =====================================================
   INVIO
===================================================== */

function sendMessage(){

    const text =
        textInput.value.trim();


    if(!text)
        return;


    textInput.value = "";

    addMsg(
        text
    );

    processAi(
        text
    );
}


sendBtn.addEventListener(
    "click",
    sendMessage
);


textInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =====================================================
   VOCE
===================================================== */

function speak(text){

    if(
        !("speechSynthesis"
        in window)
    )
        return;


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";

    utterance.rate =
        .95;

    utterance.pitch =
        .85;

    utterance.volume =
        1;


    utterance.onstart =
        () => {

            setState(
                "speaking"
            );
        };


    utterance.onend =
        () => {

            setState(
                "idle"
            );
        };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   MICROFONO
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let listening = false;


if(Recognition){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening = true;

            micBtn.classList.add(
                "active"
            );

            setState(
                "listening"
            );
        };


    recognition.onresult =
        event => {

            const text =
                event
                .results[0][0]
                .transcript
                .trim();


            if(text){

                textInput.value =
                    text;

                sendMessage();
            }
        };


    recognition.onerror =
        () => {

            listening = false;

            micBtn.classList.remove(
                "active"
            );

            setState(
                "idle"
            );
        };


    recognition.onend =
        () => {

            listening = false;

            micBtn.classList.remove(
                "active"
            );

            setState(
                "idle"
            );
        };


    micBtn.addEventListener(
        "click",
        () => {

            if(listening){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(e){

                    console.log(e);
                }
            }
        }
    );

}else{

    micBtn.style.opacity =
        ".3";

    micBtn.disabled =
        true;
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   START
===================================================== */

setState(
    "idle"
);

</script>

</body>
</html>
