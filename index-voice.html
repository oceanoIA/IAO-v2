<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAO — Neural Interface</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #ffd000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* =========================
   CANVAS
========================= */

#canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* =========================
   HUD
========================= */

.hud-meta {
    position: fixed;
    z-index: 5;
    pointer-events: none;

    font-family: monospace;
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 1.8;

    color: rgba(255, 205, 0, 0.5);
}

.top-left {
    top: 24px;
    left: 24px;

    border-left: 2px solid rgba(255, 190, 0, 0.65);
    padding-left: 10px;
}

.top-right {
    top: 24px;
    right: 24px;

    text-align: right;

    border-right: 2px solid rgba(255, 190, 0, 0.65);
    padding-right: 10px;
}

/* =========================
   TITOLO
========================= */

.header-title {
    position: fixed;
    top: 22px;
    left: 0;
    right: 0;

    z-index: 6;
    pointer-events: none;

    text-align: center;
}

.header-title h1 {
    margin: 0;

    color: #fff;

    font-size: 24px;
    font-weight: 300;

    letter-spacing: 11px;

    text-shadow:
        0 0 10px rgba(255, 210, 0, .9),
        0 0 25px rgba(255, 160, 0, .5);
}

.status {
    margin-top: 5px;

    font-family: monospace;
    font-size: 9px;
    letter-spacing: 3px;

    color: rgba(255, 205, 0, .65);
}

.status b {
    color: #ffd000;

    text-shadow:
        0 0 5px #ffd000,
        0 0 15px #ffae00;
}

/* =========================
   CHAT
========================= */

#chat {
    position: fixed;

    left: 50%;
    bottom: 92px;

    transform: translateX(-50%);

    width: 100%;
    max-width: 700px;

    max-height: 27vh;

    padding: 0 20px;

    display: flex;
    flex-direction: column;

    gap: 10px;

    overflow-y: auto;

    z-index: 10;

    scrollbar-width: none;
}

#chat::-webkit-scrollbar {
    display: none;
}

.message {
    max-width: 80%;

    padding: 11px 16px;

    border-radius: 4px;

    font-size: 14px;
    line-height: 1.5;

    backdrop-filter: blur(15px);

    word-break: break-word;
}

.user {
    align-self: flex-end;

    color: #fff;

    background: rgba(255, 200, 0, .07);

    border: 1px solid rgba(255, 200, 0, .3);
    border-right: 3px solid #ffd000;
}

.jarvis {
    align-self: flex-start;

    color: #ffe9a0;

    background: rgba(15, 10, 0, .75);

    border: 1px solid rgba(255, 190, 0, .18);
    border-left: 3px solid #ffd000;
}

/* =========================
   INPUT
========================= */

.input-container {
    position: fixed;

    left: 50%;
    bottom: 24px;

    transform: translateX(-50%);

    width: 100%;
    max-width: 700px;

    padding: 0 20px;

    z-index: 20;
}

.input-box {
    display: flex;
    gap: 9px;

    padding: 4px;

    background: rgba(10, 7, 0, .9);

    border: 1px solid rgba(255, 195, 0, .35);

    border-radius: 6px;

    backdrop-filter: blur(18px);

    transition:
        border-color .3s,
        box-shadow .3s;
}

.input-box:focus-within {
    border-color: rgba(255, 210, 0, .9);

    box-shadow:
        0 0 15px rgba(255, 200, 0, .18),
        0 0 35px rgba(255, 160, 0, .08);
}

input {
    flex: 1;

    height: 44px;

    padding: 0 15px;

    background: transparent;

    border: none;
    outline: none;

    color: white;

    font-size: 14px;
}

input::placeholder {
    color: rgba(255, 220, 130, .32);
}

button {
    width: 78px;
    height: 44px;

    border-radius: 4px;

    border: 1px solid rgba(255, 200, 0, .5);

    background: rgba(255, 190, 0, .12);

    color: #ffd000;

    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;

    cursor: pointer;

    transition: .2s;
}

button:hover:not(:disabled) {
    background: #ffd000;
    color: #000;

    box-shadow:
        0 0 12px #ffd000,
        0 0 30px rgba(255, 180, 0, .5);
}

button:disabled {
    opacity: .3;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .hud-meta {
        display: none;
    }

    .header-title h1 {
        font-size: 19px;
        letter-spacing: 7px;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="hud-meta top-left">
    IAO_CORE // V3.0<br>
    NEURAL SYSTEM: ONLINE
</div>

<div class="hud-meta top-right">
    NETWORK: ACTIVE<br>
    NODES: <span id="nodeCounter">180</span>
</div>

<div class="header-title">
    <h1>I.A.O.</h1>

    <div class="status">
        <b>●</b> NEURAL MATRIX ONLINE
    </div>
</div>

<canvas id="canvas-container"></canvas>

<div id="chat">

    <div class="message jarvis">
        Matrice neurale inizializzata. In attesa di istruzioni.
    </div>

</div>

<div class="input-container">

    <div class="input-box">

        <input
            id="input"
            type="text"
            placeholder="Comunica con IAO..."
            autocomplete="off"
        >

        <button id="send">
            EXEC
        </button>

    </div>

</div>

<script>

/* =========================================================
   IAO NEURAL ENGINE
========================================================= */

const canvas =
    document.getElementById("canvas-container");

const ctx =
    canvas.getContext("2d");

const nodeCounter =
    document.getElementById("nodeCounter");

let width;
let height;
let dpr;

let centerX;
let centerY;

let thinking = false;

let nodes = [];
let pulses = [];


/* =========================================================
   CONFIGURAZIONE
========================================================= */

const NODE_COUNT = 180;

const CONNECTION_DISTANCE = 90;

let sphereRadius;


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    centerX = width / 2;

    centerY =
        height / 2 - 25;

    sphereRadius =
        Math.min(width, height) * .23;

    createNetwork();
}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   CREAZIONE RETE
========================================================= */

function createNetwork() {

    nodes = [];

    for (
        let i = 0;
        i < NODE_COUNT;
        i++
    ) {

        const theta =
            Math.random() *
            Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        const radius =
            sphereRadius *
            (
                .72 +
                Math.random() * .5
            );

        nodes.push({

            theta,
            phi,

            radius,

            speed:
                .002 +
                Math.random() * .006,

            direction:
                Math.random() < .5
                    ? -1
                    : 1,

            size:
                .7 +
                Math.random() * 1.6,

            phase:
                Math.random() *
                Math.PI * 2,

            energy:
                Math.random()

        });
    }

    nodeCounter.textContent =
        NODE_COUNT;
}


/* =========================================================
   ROTAZIONE
========================================================= */

let rotationY = 0;
let rotationX = 0;


/* =========================================================
   CREAZIONE IMPULSI
========================================================= */

function createPulse() {

    if (nodes.length < 2)
        return;

    const node =
        nodes[
            Math.floor(
                Math.random() *
                nodes.length
            )
        ];

    pulses.push({

        x: node.theta,
        y: node.phi,

        life: 1,

        speed:
            .012 +
            Math.random() * .018

    });
}


/* =========================================================
   ANIMAZIONE
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        performance.now() *
        .001;

    const speed =
        thinking
            ? 3.5
            : 1;

    /* TRAIL */

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* ROTAZIONE */

    rotationY +=
        .0045 *
        speed;

    rotationX +=
        .0012 *
        speed;


    /* =====================================================
       GLOW CENTRALE
    ===================================================== */

    const glowSize =
        sphereRadius *
        (
            thinking
                ? 1.7
                : 1.25
        );

    const glow =
        ctx.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            glowSize
        );

    glow.addColorStop(
        0,
        thinking
            ? "rgba(255,245,180,.95)"
            : "rgba(255,230,130,.65)"
    );

    glow.addColorStop(
        .18,
        "rgba(255,200,0,.35)"
    );

    glow.addColorStop(
        .5,
        "rgba(255,150,0,.08)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        glowSize,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* =====================================================
       PROIEZIONE NODI
    ===================================================== */

    const projected = [];

    nodes.forEach(
        n => {

            n.theta +=
                n.speed *
                n.direction *
                speed;

            n.phi +=
                Math.sin(time + n.phase) *
                .0008 *
                speed;


            let x =
                n.radius *
                Math.sin(n.phi) *
                Math.cos(n.theta);

            let y =
                n.radius *
                Math.cos(n.phi);

            let z =
                n.radius *
                Math.sin(n.phi) *
                Math.sin(n.theta);


            /* ROTAZIONE Y */

            const cosY =
                Math.cos(rotationY);

            const sinY =
                Math.sin(rotationY);

            const rx =
                x * cosY +
                z * sinY;

            const rz =
                -x * sinY +
                z * cosY;


            /* ROTAZIONE X */

            const cosX =
                Math.cos(rotationX);

            const sinX =
                Math.sin(rotationX);

            const ry =
                y * cosX -
                rz * sinX;

            const finalZ =
                y * sinX +
                rz * cosX;


            /* PROSPETTIVA */

            const perspective =
                420 /
                (
                    420 +
                    finalZ
                );

            const px =
                centerX +
                rx *
                perspective;

            const py =
                centerY +
                ry *
                perspective;


            const alpha =
                Math.max(
                    .08,
                    Math.min(
                        1,
                        (
                            finalZ +
                            sphereRadius
                        ) /
                        (
                            sphereRadius * 2
                        )
                    )
                );


            projected.push({

                x: px,
                y: py,

                z: finalZ,

                alpha,

                size:
                    n.size *
                    perspective,

                pulse:
                    (
                        Math.sin(
                            time * 5 +
                            n.phase
                        ) + 1
                    ) / 2

            });

        }
    );


    /* =====================================================
       ORDINE PROFONDITÀ
    ===================================================== */

    projected.sort(
        (a,b) =>
            a.z - b.z
    );


    /* =====================================================
       CONNESSIONI
    ===================================================== */

    for (
        let i = 0;
        i < projected.length;
        i++
    ) {

        const a =
            projected[i];

        for (
            let j = i + 1;
            j < projected.length;
            j++
        ) {

            const b =
                projected[j];

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                distance <
                CONNECTION_DISTANCE
            ) {

                const strength =
                    (
                        1 -
                        distance /
                        CONNECTION_DISTANCE
                    ) *
                    .32 *
                    a.alpha;


                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.strokeStyle =
                    `rgba(
                        255,
                        195,
                        20,
                        ${strength}
                    )`;

                ctx.lineWidth =
                    thinking
                        ? 1
                        : .65;

                ctx.stroke();
            }
        }
    }


    /* =====================================================
       IMPULSI
    ===================================================== */

    if (
        Math.random() <
        (
            thinking
                ? .18
                : .035
        )
    ) {

        createPulse();
    }


    /* =====================================================
       NODI
    ===================================================== */

    projected.forEach(
        n => {

            const brightness =
                .65 +
                n.pulse *
                .35;


            /* GLOW */

            const glow =
                ctx.createRadialGradient(
                    n.x,
                    n.y,
                    0,
                    n.x,
                    n.y,
                    n.size * 5
                );

            glow.addColorStop(
                0,
                `rgba(
                    255,
                    210,
                    70,
                    ${.45 * n.alpha}
                )`
            );

            glow.addColorStop(
                1,
                "rgba(255,160,0,0)"
            );

            ctx.fillStyle =
                glow;

            ctx.beginPath();

            ctx.arc(
                n.x,
                n.y,
                n.size * 5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* CORE */

            ctx.fillStyle =
                `rgba(
                    255,
                    245,
                    180,
                    ${brightness * n.alpha}
                )`;

            ctx.beginPath();

            ctx.arc(
                n.x,
                n.y,
                n.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    /* =====================================================
       PULSES VISIVI
    ===================================================== */

    pulses.forEach(
        p => {

            p.life -=
                p.speed *
                speed;

        }
    );

    pulses =
        pulses.filter(
            p =>
                p.life > 0
        );


    pulses.forEach(
        p => {

            const angle =
                p.x +
                (
                    1 -
                    p.life
                ) *
                3;

            const px =
                centerX +
                Math.cos(angle) *
                sphereRadius *
                p.life;

            const py =
                centerY +
                Math.sin(
                    angle * 1.7
                ) *
                sphereRadius *
                p.life *
                .55;


            ctx.fillStyle =
                `rgba(
                    255,
                    245,
                    150,
                    ${p.life}
                )`;

            ctx.shadowBlur =
                15;

            ctx.shadowColor =
                "#ffd000";

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                thinking
                    ? 2.5
                    : 1.7,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.shadowBlur = 0;

        }
    );

}


/* =========================================================
   AVVIO
========================================================= */

resize();
animate();


/* =========================================================
   CHAT / API
========================================================= */

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const chat =
    document.getElementById(
        "chat"
    );


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


/* =========================================================
   INVIO MESSAGGIO
========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();


    if (
        !text ||
        input.disabled
    ) {

        return;

    }


    input.disabled =
        true;

    send.disabled =
        true;


    /* MESSAGGIO UTENTE */

    const userMsg =
        document.createElement(
            "div"
        );

    userMsg.className =
        "message user";

    userMsg.textContent =
        text;

    chat.appendChild(
        userMsg
    );


    input.value = "";


    /* RISPOSTA IAO */

    const jarvisMsg =
        document.createElement(
            "div"
        );

    jarvisMsg.className =
        "message jarvis";

    jarvisMsg.textContent =
        "Analisi neurale in corso...";

    chat.appendChild(
        jarvisMsg
    );


    thinking = true;


    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch(
                "https://iao-ai-v3.oceano-masoud.workers.dev/",
                {
                    method: "POST",

                    headers: {
