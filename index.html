<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    position: relative;
}

/* SFONDO */

#space {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* INTERFACCIA */

.interface {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

.header {
    position: absolute;
    top: 28px;
    left: 0;
    width: 100%;
    text-align: center;
}

.logo {
    font-size: 38px;
    letter-spacing: 12px;
    font-weight: 300;
    color: #ffd21f;

    text-shadow:
        0 0 8px #fff06a,
        0 0 25px #ffd21f,
        0 0 55px #ff9900;
}

.status {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #aaa;
}

.status-dot {
    color: #ffd21f;
    text-shadow: 0 0 12px #ffd21f;
}

/* INFO LATERALI */

.info {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(255, 215, 70, .55);
    line-height: 2;
}

.info.left {
    left: 18px;
}

.info.right {
    right: 18px;
    text-align: right;
}

/* CHAT */

#chat {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: 100px;

    max-height: 28vh;
    overflow-y: auto;

    display: flex;
    flex-direction: column;
    gap: 8px;

    z-index: 20;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    border-radius: 15px;

    font-size: 14px;
    line-height: 1.45;

    backdrop-filter: blur(15px);
}

.user {
    align-self: flex-end;

    background: rgba(255, 205, 20, .10);
    border: 1px solid rgba(255, 215, 70, .35);
}

.jarvis {
    align-self: flex-start;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,215,70,.20);
}

/* INPUT */

.input-area {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: 18px;

    display: flex;
    gap: 10px;

    z-index: 30;
}

input {
    flex: 1;
    height: 55px;

    padding: 0 20px;

    border-radius: 30px;
    border: 1px solid rgba(255, 210, 30, .35);

    outline: none;

    background: rgba(5,5,5,.82);
    color: white;

    font-size: 16px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 25px rgba(255,170,0,.08);
}

input:focus {
    border-color: #ffd21f;

    box-shadow:
        0 0 25px rgba(255,210,30,.25);
}

button {
    width: 55px;
    height: 55px;

    border: 0;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff9a0,
            #ffd21f 40%,
            #e88900
        );

    color: #211500;

    font-size: 21px;

    box-shadow:
        0 0 15px #ffd21f,
        0 0 40px rgba(255,150,0,.4);

    cursor: pointer;
}

button:active {
    transform: scale(.92);
}

/* MOBILE */

@media (max-width: 500px) {

    .logo {
        font-size: 30px;
        letter-spacing: 9px;
    }

    .info {
        display: none;
    }

    #chat {
        max-height: 25vh;
    }
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="interface">

    <div class="header">

        <div class="logo">
            JARVIS
        </div>

        <div class="status">
            <span class="status-dot">●</span>
            SYSTEM ONLINE
        </div>

    </div>

    <div class="info left">
        CORE<br>
        ONLINE<br>
        POWER 100%<br>
        NEURAL LINK<br>
        ACTIVE
    </div>

    <div class="info right">
        JARVIS AI<br>
        MODEL ONLINE<br>
        RESPONSE READY<br>
        MEMORY ACTIVE<br>
        v2.0
    </div>

</div>

<div id="chat">

    <div class="message jarvis">
        Ciao. Sono JARVIS. 🧠
    </div>

</div>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">
        ➤
    </button>

</div>

<script>

/* =========================================================
   JARVIS CORE
   ========================================================= */

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let width;
let height;
let centerX;
let centerY;

let time = 0;
let thinking = false;

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = width / 2;
    centerY = height * 0.45;
}

window.addEventListener("resize", resize);

resize();

/* PARTICELLE */

const particles = [];

for (let i = 0; i < 180; i++) {

    particles.push({

        angle: Math.random() * Math.PI * 2,

        radius:
            75 +
            Math.random() * 150,

        speed:
            .0008 +
            Math.random() * .002,

        size:
            .5 +
            Math.random() * 1.8,

        offset:
            Math.random() * Math.PI * 2,

        depth:
            Math.random() * 2 - 1

    });
}

/* =========================================================
   SFONDO
   ========================================================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            Math.max(width, height) * .7
        );

    gradient.addColorStop(0, "#171000");
    gradient.addColorStop(.25, "#090700");
    gradient.addColorStop(.55, "#030303");
    gradient.addColorStop(1, "#000000");

    ctx.fillStyle = gradient;

    ctx.fillRect(0, 0, width, height);

    /* STELLE */

    for (let i = 0; i < particles.length; i++) {

        const p = particles[i];

        const a =
            p.angle +
            time * p.speed * 20;

        const x =
            centerX +
            Math.cos(a) * p.radius;

        const y =
            centerY +
            Math.sin(a) * p.radius * .55;

        const opacity =
            .15 +
            .4 *
            Math.abs(
                Math.sin(time * .01 + p.offset)
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,215,70,${opacity})`;

        ctx.fill();
    }
}

/* =========================================================
   BAGLIORE CENTRALE
   ========================================================= */

function drawGlow() {

    const pulse =
        1 +
        Math.sin(time * .035) * .08;

    if (thinking) {
        pulse += .15;
    }

    const gradient =
        ctx.createRadialGradient(
            centerX,
            centerY,
            5,
            centerX,
            centerY,
            190 * pulse
        );

    gradient.addColorStop(
        0,
        "rgba(255,245,120,.75)"
    );

    gradient.addColorStop(
        .15,
        "rgba(255,210,30,.40)"
    );

    gradient.addColorStop(
        .45,
        "rgba(255,150,0,.15)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,100,0,0)"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        190 * pulse,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

/* =========================================================
   SFERA 3D
   ========================================================= */

function drawCore() {

    const radius =
        67 +
        Math.sin(time * .035) * 3 +
        (thinking ? 5 : 0);

    /* alone */

    const glow =
        ctx.createRadialGradient(
            centerX - 20,
            centerY - 22,
            2,
            centerX,
            centerY,
            radius * 1.6
        );

    glow.addColorStop(
        0,
        "#fffbd0"
    );

    glow.addColorStop(
        .12,
        "#fff06a"
    );

    glow.addColorStop(
        .35,
        "#ffd21f"
    );

    glow.addColorStop(
        .65,
        "#ff9d00"
    );

    glow.addColorStop(
        .86,
        "#9d4000"
    );

    glow.addColorStop(
        1,
        "#170700"
    );

    ctx.shadowColor = "#ffd21f";

    ctx.shadowBlur =
        thinking ? 65 : 45;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = glow;

    ctx.fill();

    ctx.shadowBlur = 0;

    /* RIFLESSO */

    const reflection =
        ctx.createRadialGradient(
            centerX - 25,
            centerY - 30,
            1,
            centerX - 15,
            centerY - 20,
            50
        );

    reflection.addColorStop(
        0,
        "rgba(255,255,220,.85)"
    );

    reflection.addColorStop(
        .2,
        "rgba(255,255,170,.25)"
    );

    reflection.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle = reflection;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* FILAMENTI INTERNI */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius - 2,
        0,
        Math.PI * 2
    );

    ctx.clip();

    for (let i = 0; i < 15; i++) {

        const wave =
            Math.sin(
                time * .025 +
                i * .8
            );

        ctx.beginPath();

        ctx.moveTo(
            centerX - radius,
            centerY + wave * radius
        );

        ctx.bezierCurveTo(
            centerX - 20,
            centerY - radius + i * 8,
            centerX + 20,
            centerY + radius - i * 5,
            centerX + radius,
            centerY - wave * radius
        );

        ctx.strokeStyle =
            `rgba(255,245,130,${.12 + i*.012})`;

        ctx.lineWidth = 1;

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   ANELLI ORBITANTI
   ========================================================= */

function drawOrbit(
    radiusX,
    radiusY,
    rotation,
    speed,
    alpha,
    dash
) {

    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );

    ctx.rotate(
        rotation +
        time * speed
    );

    ctx.scale(
        1,
        radiusY / radiusX
    );

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radiusX,
        0,
        Math.PI * 2
    );

    ctx.setLineDash(
        dash ? [5, 8] : []
    );

    ctx.strokeStyle =
        `rgba(255,215,70,${alpha})`;

    ctx.lineWidth = 1;

    ctx.shadowColor = "#ffd21f";

    ctx.shadowBlur = 8;

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   PARTICELLE ORBITANTI
   ========================================================= */

function drawOrbitParticles() {

    for (let i = 0; i < 14; i++) {

        const angle =
            time * (.006 + i * .00015) +
            i * (Math.PI * 2 / 14);

        const radius = 115 + (i % 3) * 28;

        const x =
            centerX +
            Math.cos(angle) * radius;

        const y =
            centerY +
            Math.sin(angle) * radius * .42;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffe76a";

        ctx.shadowColor = "#ffd21f";
        ctx.shadowBlur = 15;

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

/* =========================================================
   RENDER
   ========================================================= */

function render() {

    time++;

    drawBackground();

    drawGlow();

    /* anelli */

    drawOrbit(
        175,
        65,
        .2,
        .003,
        .65,
        false
    );

    drawOrbit(
        155,
        70,
        1.1,
        -.004,
        .55,
        false
    );

    drawOrbit(
        145,
        95,
        -.5,
        .002,
        .45,
        true
    );

    drawOrbit(
        125,
        125,
        .7,
        -.0018,
        .25,
        true
    );

    drawOrbitParticles();

    drawCore();

    requestAnimationFrame(render);
}

render();

/* =========================================================
   CHAT CON JARVIS
   ========================================================= */

async function sendMessage() {

    const input =
        document.getElementById("input");

    const chat =
        document.getElementById("chat");

    const text =
        input.value.trim();

    if (!text) return;

    /* UTENTE */

    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(userMessage);

    input.value = "";

    /* JARVIS */

    const jarvisMessage =
        document.createElement("div");

    jarvisMessage.className =
        "message jarvis";

    jarvisMessage.textContent =
        "Elaborazione in corso...";

    chat.appendChild(jarvisMessage);

    thinking = true;

    chat.scrollTop =
        chat.scrollHeight;

    try {

        const response =
            await fetch(
                "https://iao-ai-v3.oceano-masoud.workers.dev/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        jarvisMessage.textContent =
            data.reply ||
            "Non ho ricevuto una risposta.";

    } catch (error) {

        console.error(error);

        jarvisMessage.textContent =
            "Errore di collegamento con JARVIS.";

    }

    thinking = false;

    chat.scrollTop =
        chat.scrollHeight;
}

</script>

</body>
</html>
