<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   HUD
========================= */

.hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

.title {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;

    font-size: 32px;
    font-weight: 300;
    letter-spacing: 12px;

    color: #eaffff;

    text-shadow:
        0 0 10px rgba(0, 234, 255, .8),
        0 0 35px rgba(0, 234, 255, .25);
}

.status {
    margin-top: 8px;

    font-size: 8px;
    letter-spacing: 4px;

    color: rgba(255,255,255,.45);
}

.status span {
    color: #00eaff;

    text-shadow:
        0 0 10px #00eaff;
}

/* =========================
   CHAT
========================= */

#chat {
    position: fixed;

    left: 14px;
    right: 14px;
    bottom: 90px;

    max-height: 27vh;

    overflow-y: auto;

    display: flex;
    flex-direction: column;
    gap: 7px;

    z-index: 20;
}

.message {
    max-width: 82%;

    padding: 10px 14px;

    border-radius: 13px;

    font-size: 14px;
    line-height: 1.4;

    backdrop-filter: blur(15px);
}

.user {
    align-self: flex-end;

    background: rgba(0, 220, 255, .06);

    border:
        1px solid rgba(0, 220, 255, .25);
}

.jarvis {
    align-self: flex-start;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(0, 220, 255, .12);
}

/* =========================
   INPUT
========================= */

.input-area {
    position: fixed;

    left: 14px;
    right: 14px;
    bottom: 16px;

    display: flex;
    gap: 9px;

    z-index: 30;
}

input {
    flex: 1;

    height: 52px;

    padding: 0 18px;

    border-radius: 28px;

    border:
        1px solid rgba(0, 234, 255, .25);

    background:
        rgba(0,0,0,.9);

    color: white;

    outline: none;

    font-size: 15px;

    backdrop-filter: blur(20px);
}

input:focus {
    border-color:
        rgba(0,234,255,.7);

    box-shadow:
        0 0 25px rgba(0,234,255,.12);
}

button {
    width: 52px;
    height: 52px;

    border: none;
    border-radius: 50%;

    background: #00eaff;

    color: #001015;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(0,234,255,.6),
        0 0 40px rgba(0,234,255,.18);
}

button:active {
    transform: scale(.9);
}

@media (max-width: 500px) {

    .title {
        font-size: 28px;
        letter-spacing: 9px;
    }
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="hud">

    <div class="title">

        JARVIS

        <div class="status">
            <span>●</span> NEURAL CORE ONLINE
        </div>

    </div>

</div>

<div id="chat">

    <div class="message jarvis">
        Sistema online. Sono JARVIS.
    </div>

</div>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">➤</button>

</div>

<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =====================================================
   SCENA
===================================================== */

const canvas =
    document.getElementById("scene");

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        40,
        innerWidth / innerHeight,
        .1,
        100
    );

camera.position.z = 6.5;

const renderer =
    new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

/* =====================================================
   LUCI
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0x062025,
        1.5
    )
);

const cyanLight =
    new THREE.PointLight(
        0x00eaff,
        5,
        8
    );

scene.add(cyanLight);

const goldLight =
    new THREE.PointLight(
        0xffb400,
        3,
        5
    );

scene.add(goldLight);

/* =====================================================
   CORE
===================================================== */

const core =
    new THREE.Group();

scene.add(core);

/* =====================================================
   ENERGIA CENTRALE
===================================================== */

const energyGeometry =
    new THREE.SphereGeometry(
        .38,
        64,
        64
    );

const energyMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

const energy =
    new THREE.Mesh(
        energyGeometry,
        energyMaterial
    );

core.add(energy);

/* =====================================================
   GLOW INTERNO
===================================================== */

const glowGeometry =
    new THREE.SphereGeometry(
        .62,
        64,
        64
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color: 0x00eaff,

        transparent: true,

        opacity: .07,

        side: THREE.BackSide,

        blending:
            THREE.AdditiveBlending
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

core.add(glow);

/* =====================================================
   RETE NEURALE
===================================================== */

const nodeCount = 180;

const nodes = [];

for (
    let i = 0;
    i < nodeCount;
    i++
) {

    const phi =
        Math.acos(
            1 -
            2 * (
                i + .5
            ) /
            nodeCount
        );

    const theta =
        Math.PI *
        (1 + Math.sqrt(5)) *
        i;

    /*
       Distanza variabile:
       crea una struttura meno perfetta
       e più organica.
    */

    const radius =
        0.85 +
        Math.random() * .55;

    nodes.push(
        new THREE.Vector3(
            radius *
            Math.sin(phi) *
            Math.cos(theta),

            radius *
            Math.cos(phi),

            radius *
            Math.sin(phi) *
            Math.sin(theta)
        )
    );
}

/* =====================================================
   NODI
===================================================== */

const nodePositions =
    new Float32Array(
        nodeCount * 3
    );

for (
    let i = 0;
    i < nodeCount;
    i++
) {

    nodePositions[
        i * 3
    ] =
        nodes[i].x;

    nodePositions[
        i * 3 + 1
    ] =
        nodes[i].y;

    nodePositions[
        i * 3 + 2
    ] =
        nodes[i].z;
}

const nodeGeometry =
    new THREE.BufferGeometry();

nodeGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        nodePositions,
        3
    )
);

const nodeMaterial =
    new THREE.PointsMaterial({

        color: 0x8ff8ff,

        size: .025,

        transparent: true,

        opacity: .9,

        blending:
            THREE.AdditiveBlending
    });

const nodePoints =
    new THREE.Points(
        nodeGeometry,
        nodeMaterial
    );

core.add(nodePoints);

/* =====================================================
   CONNESSIONI
===================================================== */

const connections = [];

for (
    let i = 0;
    i < nodeCount;
    i++
) {

    for (
        let j = i + 1;
        j < nodeCount;
        j++
    ) {

        const distance =
            nodes[i].distanceTo(
                nodes[j]
            );

        if (
            distance <
            .43
        ) {

            connections.push(
                nodes[i].x,
                nodes[i].y,
                nodes[i].z,

                nodes[j].x,
                nodes[j].y,
                nodes[j].z
            );
        }
    }
}

const connectionGeometry =
    new THREE.BufferGeometry();

connectionGeometry.setAttribute(
    "position",

    new THREE.Float32BufferAttribute(
        connections,
        3
    )
);

const connectionMaterial =
    new THREE.LineBasicMaterial({

        color: 0x00eaff,

        transparent: true,

        opacity: .16,

        blending:
            THREE.AdditiveBlending
    });

const connectionsMesh =
    new THREE.LineSegments(
        connectionGeometry,
        connectionMaterial
    );

core.add(connectionsMesh);

/* =====================================================
   ANELLI ORBITALI
===================================================== */

const rings = [];

function addRing(
    radius,
    rotX,
    rotY,
    rotZ,
    speed,
    opacity
) {

    const geometry =
        new THREE.TorusGeometry(
            radius,
            .004,
            8,
            300
        );

    const material =
        new THREE.MeshBasicMaterial({

            color: 0x00eaff,

            transparent: true,

            opacity: opacity,

            blending:
                THREE.AdditiveBlending
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.set(
        rotX,
        rotY,
        rotZ
    );

    ring.userData.speed =
        speed;

    core.add(ring);

    rings.push(ring);
}

addRing(
    1.42,
    .8,
    .2,
    .2,
    .00045,
    .45
);

addRing(
    1.63,
    1.3,
    -.4,
    .8,
    -.00028,
    .32
);

addRing(
    1.82,
    .3,
    1.1,
    -.5,
    .00020,
    .22
);

/* =====================================================
   PARTICELLE
===================================================== */

const particleCount = 450;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const radius =
        1.5 +
        Math.random() * 2.7;

    const angle =
        Math.random() *
        Math.PI * 2;

    particlePositions[
        i * 3
    ] =
        Math.cos(angle) *
        radius;

    particlePositions[
        i * 3 + 1
    ] =
        (
            Math.random() -
            .5
        ) * 3;

    particlePositions[
        i * 3 + 2
    ] =
        Math.sin(angle) *
        radius;
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({

        color: 0x39eaff,

        size: .012,

        transparent: true,

        opacity: .3,

        blending:
            THREE.AdditiveBlending
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

core.add(particles);

/* =====================================================
   STATO
===================================================== */

let thinking = false;

const clock =
    new THREE.Clock();

/* =====================================================
   ANIMAZIONE
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();

    /* movimento generale */

    core.rotation.y =
        t * .025;

    core.rotation.x =
        Math.sin(
            t * .12
        ) * .025;

    /* rete */

    nodePoints.rotation.y =
        -t * .035;

    connectionsMesh.rotation.y =
        -t * .035;

    /* anelli */

    rings.forEach(
        ring => {

            ring.rotation.z +=
                ring.userData.speed *
                (
                    thinking
                    ? 1.6
                    : 1
                );

            ring.rotation.x +=
                ring.userData.speed *
                .04;
        }
    );

    /* particelle */

    particles.rotation.y =
        t * .01;

    particles.rotation.x =
        Math.sin(
            t * .08
        ) * .02;

    /* pulsazione */

    const pulse =
        1 +
        Math.sin(
            t * 1.6
        ) * .025;

    const active =
        thinking
        ? 1.08
        : 1;

    core.scale.setScalar(
        pulse * active
    );

    /* energia */

    energy.scale.setScalar(
        thinking
        ? 1.15 +
          Math.sin(t * 6) * .06
        : 1 +
          Math.sin(t * 2) * .03
    );

    /* luci */

    cyanLight.intensity =
        thinking
        ? 10
        : 5 +
          Math.sin(
              t * 1.5
          ) * .6;

    goldLight.intensity =
        thinking
        ? 5
        : 2.5;

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =====================================================
   CHAT
===================================================== */

window.sendMessage =
async function() {

    const input =
        document.getElementById(
            "input"
        );

    const chat =
        document.getElementById(
            "chat"
        );

    const text =
        input.value.trim();

    if (!text)
        return;

    const user =
        document.createElement(
            "div"
        );

    user.className =
        "message user";

    user.textContent =
        text;

    chat.appendChild(
        user
    );

    input.value = "";

    const reply =
        document.createElement(
            "div"
        );

    reply.className =
        "message jarvis";

    reply.textContent =
        "Elaborazione...";

    chat.appendChild(
        reply
    );

    thinking = true;

    chat.scrollTop =
        chat.scrollHeight;

    try {

        const response =
            await fetch(
                "https://iao-ai-v3.oceano-masoud.workers.dev/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        reply.textContent =
            data.reply ||
            "Non ho ricevuto una risposta.";

    } catch (error) {

        console.error(error);

        reply.textContent =
            "Errore di collegamento.";
    }

    thinking = false;

    chat.scrollTop =
        chat.scrollHeight;
};

</script>

</body>
</html>
