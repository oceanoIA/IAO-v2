<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<link rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#010405;
 font-family:Arial,sans-serif;
}

body{
 background:radial-gradient(
  circle at center,
  #071719 0%,
  #020708 48%,
  #000 100%
 );
}

#webgl-container{
 position:fixed;
 inset:0;
 z-index:1;
}

#webgl-container canvas{
 display:block;
 width:100%;
 height:100%;
}

.vignette{
 position:fixed;
 inset:0;
 z-index:3;
 pointer-events:none;
 background:radial-gradient(
  circle at center,
  transparent 30%,
  rgba(0,0,0,.2) 65%,
  rgba(0,0,0,.8) 100%
 );
}

.jarvis-title{
 position:fixed;
 top:2.4%;
 left:50%;
 transform:translateX(-50%);
 z-index:30;
 color:rgba(255,255,255,.86);
 font-size:clamp(20px,2.8vw,31px);
 font-weight:300;
 letter-spacing:clamp(5px,1vw,8px);
 white-space:nowrap;
 text-shadow:0 0 10px rgba(255,255,255,.12);
 pointer-events:none;
}

.datetime{
 position:fixed;
 top:18px;
 right:24px;
 z-index:30;
 display:flex;
 flex-direction:column;
 align-items:flex-end;
 gap:3px;
 font-family:monospace;
 pointer-events:none;
}

.time{
 color:rgba(150,255,255,.6);
 font-size:11px;
 letter-spacing:2px;
}

.date{
 color:rgba(150,255,255,.38);
 font-size:8px;
 letter-spacing:1px;
}


/* =====================================================
   CHAT
===================================================== */

#chat{
 position:fixed;
 left:50%;
 bottom:92px;
 transform:translateX(-50%);
 z-index:40;
 width:min(620px,88%);
 text-align:center;
 pointer-events:none;
}

.msg{
 display:inline-block;
 max-width:100%;
 padding:10px 18px;
 border:1px solid rgba(0,255,255,.22);
 border-radius:24px;
 background:rgba(4,20,23,.4);
 backdrop-filter:blur(14px);
 color:rgba(235,255,255,.9);
 font-size:12px;
 line-height:1.45;
 white-space:pre-wrap;
}


/* =====================================================
   COMMAND BAR
===================================================== */

.command-wrapper{
 position:fixed;
 left:50%;
 bottom:23px;
 transform:translateX(-50%);
 z-index:50;
 width:min(650px,90%);
 display:flex;
 align-items:center;
 padding:6px 7px 6px 20px;
 border:1px solid rgba(100,255,255,.28);
 border-radius:40px;
 background:rgba(5,20,23,.38);
 backdrop-filter:blur(20px);
 box-shadow:0 0 30px rgba(0,255,255,.05);
}

.command-wrapper:focus-within{
 border-color:rgba(0,255,255,.6);
 box-shadow:0 0 25px rgba(0,255,255,.12);
}

#textInput{
 flex:1;
 min-width:0;
 border:none;
 outline:none;
 background:transparent;
 color:white;
 font-size:14px;
 padding:12px 5px;
}

#textInput::placeholder{
 color:rgba(255,255,255,.3);
}


/* =====================================================
   MICROFONO
===================================================== */

#micBtn{
 width:42px;
 height:39px;
 margin-right:5px;
 border:1px solid transparent;
 border-radius:50%;
 background:transparent;
 color:rgba(210,255,255,.65);
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.2s ease;
}

.mic-icon{
 width:10px;
 height:17px;
 border:1.5px solid currentColor;
 border-radius:60px;
 position:relative;
}

.mic-icon:before{
 content:"";
 position:absolute;
 left:50%;
 bottom:-8px;
 width:15px;
 height:9px;
 transform:translateX(-50%);
 border:1.5px solid currentColor;
 border-top:none;
 border-radius:0 0 10px 10px;
}

.mic-icon:after{
 content:"";
 position:absolute;
 left:50%;
 bottom:-11px;
 width:1.5px;
 height:4px;
 transform:translateX(-50%);
 background:currentColor;
}

#micBtn:hover{
 color:#8fffff;
 border-color:rgba(0,255,255,.25);
 background:rgba(0,255,255,.05);
}

#micBtn.active{
 color:#8fffff;
 border-color:rgba(0,255,255,.45);
 background:rgba(0,255,255,.08);
 filter:drop-shadow(0 0 8px rgba(0,255,255,.7));
 animation:micPulse 1.2s infinite;
}

@keyframes micPulse{

 0%,100%{
  box-shadow:0 0 0 rgba(0,255,255,0);
 }

 50%{
  box-shadow:0 0 18px rgba(0,255,255,.28);
 }
}

#micBtn.unsupported{
 opacity:.3;
 cursor:not-allowed;
}

#micStatus{
 position:fixed;
 left:50%;
 bottom:74px;
 transform:translateX(-50%);
 z-index:55;
 display:none;
 padding:6px 12px;
 border:1px solid rgba(0,255,255,.2);
 border-radius:15px;
 background:rgba(2,15,18,.85);
 color:rgba(150,255,255,.75);
 font-family:monospace;
 font-size:8px;
 letter-spacing:1.3px;
 pointer-events:none;
 white-space:nowrap;
}

#micStatus.active{
 display:block;
}

#sendBtn{
 height:39px;
 padding:0 17px;
 border:1px solid rgba(0,255,255,.28);
 border-radius:22px;
 background:rgba(0,255,255,.05);
 color:rgba(220,255,255,.78);
 font-size:10px;
 letter-spacing:2px;
 cursor:pointer;
}

#sendBtn:hover{
 color:white;
 border-color:#00ffff;
 background:rgba(0,255,255,.1);
}


/* =====================================================
   CONVERSAZIONE CONTINUA
===================================================== */

#conversationBtn{
 position:fixed;
 left:22px;
 bottom:24px;
 z-index:60;
 height:39px;
 padding:0 15px;
 border:1px solid rgba(0,255,255,.25);
 border-radius:22px;
 background:rgba(3,15,18,.72);
 color:rgba(210,255,255,.7);
 font-size:10px;
 letter-spacing:1.5px;
 cursor:pointer;
 backdrop-filter:blur(12px);
}

#conversationBtn.active{
 color:#8fffff;
 border-color:rgba(0,255,255,.75);
 background:rgba(0,255,255,.09);
 box-shadow:
  0 0 15px rgba(0,255,255,.15),
  inset 0 0 15px rgba(0,255,255,.04);
}

#conversationStatus{
 position:fixed;
 left:22px;
 bottom:70px;
 z-index:60;
 display:none;
 padding:7px 12px;
 border:1px solid rgba(0,255,255,.2);
 border-radius:15px;
 background:rgba(2,15,18,.8);
 color:rgba(150,255,255,.7);
 font-family:monospace;
 font-size:8px;
 letter-spacing:1.2px;
}

#conversationStatus.active{
 display:block;
}


/* =====================================================
   VOCE
===================================================== */

#voiceBtn{
 position:fixed;
 right:22px;
 bottom:24px;
 z-index:60;
 height:39px;
 padding:0 15px;
 border:1px solid rgba(0,255,255,.25);
 border-radius:22px;
 background:rgba(3,15,18,.72);
 color:rgba(210,255,255,.7);
 font-size:10px;
 letter-spacing:1.5px;
 cursor:pointer;
 backdrop-filter:blur(12px);
}

#voicePanel{
 position:fixed;
 right:22px;
 bottom:72px;
 z-index:100;
 width:min(330px,calc(100% - 30px));
 padding:15px;
 display:none;
 border:1px solid rgba(0,255,255,.25);
 border-radius:18px;
 background:rgba(2,13,16,.94);
 backdrop-filter:blur(20px);
}

#voicePanel.active{
 display:block;
}

.voice-title{
 color:rgba(220,255,255,.9);
 font-size:11px;
 letter-spacing:2px;
 margin-bottom:10px;
}

#voiceSelector,
#voiceTest{
 width:100%;
 padding:10px;
 border:1px solid rgba(0,255,255,.2);
 border-radius:10px;
 outline:none;
 background:rgba(0,20,23,.9);
 color:rgba(220,255,255,.85);
 font-size:11px;
}

#voiceTest{
 margin-top:10px;
 background:rgba(0,255,255,.04);
 cursor:pointer;
}


/* =====================================================
   MAPPA
===================================================== */

#tacticalMap{
 position:fixed;
 inset:0;
 z-index:20;
 display:none;
 background:radial-gradient(
  circle at center,
  #081719 0%,
  #020708 65%,
  #000 100%
 );
}

#tacticalMap.active{
 display:block;
 animation:mapIn .45s ease;
}

@keyframes mapIn{

 from{
  opacity:0;
  transform:scale(1.015);
 }

 to{
  opacity:1;
  transform:scale(1);
 }
}

.map-header{
 position:absolute;
 top:2.4%;
 left:50%;
 transform:translateX(-50%);
 z-index:600;
 color:rgba(220,255,255,.9);
 font-size:clamp(24px,4vw,42px);
 font-weight:300;
 letter-spacing:clamp(6px,1.3vw,12px);
 white-space:nowrap;
 text-shadow:0 0 12px rgba(0,255,255,.25);
 pointer-events:none;
}

#map{
 position:absolute;
 top:3cm;
 right:3cm;
 bottom:3cm;
 left:3cm;
 overflow:hidden;
 border-radius:28px;
 background:#071012;
 box-shadow:
  0 0 35px rgba(0,0,0,.65),
  0 0 70px rgba(0,255,255,.035);
 border:1px solid rgba(0,255,255,.10);
}

.map-overlay{
 position:absolute;
 inset:0;
 z-index:400;
 pointer-events:none;
 border-radius:28px;
 box-shadow:inset 0 0 80px rgba(0,0,0,.28);
}

#closeMap{
 position:absolute;
 top:28px;
 left:34px;
 z-index:700;
 width:38px;
 height:38px;
 border:1px solid rgba(0,255,255,.35);
 border-radius:50%;
 background:rgba(0,15,18,.85);
 color:rgba(200,255,255,.85);
 cursor:pointer;
 font-size:19px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.maplibregl-ctrl-group{
 background:rgba(0,15,18,.85)!important;
 border:1px solid rgba(0,255,255,.18)!important;
 border-radius:12px!important;
 overflow:hidden;
}

.maplibregl-ctrl-group button{
 background:transparent!important;
}

.maplibregl-ctrl-attrib{
 background:rgba(0,8,10,.65)!important;
 font-size:8px!important;
}

.jarvis-map-marker{
 width:20px;
 height:20px;
 border-radius:50%;
 border:2px solid #00ffff;
 background:rgba(0,255,255,.16);
 box-shadow:
  0 0 15px rgba(0,255,255,.9),
  0 0 35px rgba(0,255,255,.4);
 animation:markerPulse 1.5s infinite;
}

@keyframes markerPulse{

 0%,100%{
  transform:scale(1);
 }

 50%{
  transform:scale(1.18);
 }
}


/* =====================================================
   WEB WINDOWS
===================================================== */

#webSearchWindows{
 position:fixed;
 inset:0;
 z-index:200;
 pointer-events:none;
}

.web-window{
 position:absolute;
 width:430px;
 height:330px;
 min-width:250px;
 min-height:190px;
 background:rgba(2,12,15,.96);
 border:1px solid rgba(0,255,255,.28);
 border-radius:16px;
 box-shadow:
  0 0 25px rgba(0,255,255,.10),
  0 15px 50px rgba(0,0,0,.5);
 overflow:hidden;
 resize:both;
 pointer-events:auto;
 backdrop-filter:blur(15px);
 touch-action:none;
}

.web-window-header{
 position:relative;
 height:39px;
 display:flex;
 align-items:center;
 padding:0 8px 0 13px;
 background:rgba(0,25,29,.92);
 border-bottom:1px solid rgba(0,255,255,.15);
 cursor:grab;
 user-select:none;
 -webkit-user-select:none;
 touch-action:none;
}

.web-window-header:active{
 cursor:grabbing;
}

.web-window-title{
 flex:1;
 min-width:0;
 color:rgba(210,255,255,.85);
 font-size:9px;
 letter-spacing:1.5px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.web-window-number{
 color:rgba(0,255,255,.5);
 margin-right:8px;
 font-size:8px;
}

.web-window-controls{
 display:flex;
 gap:5px;
}

.web-window-btn{
 width:24px;
 height:24px;
 border:1px solid rgba(0,255,255,.16);
 border-radius:7px;
 background:rgba(0,255,255,.025);
 color:rgba(190,255,255,.7);
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:12px;
}

.web-window-btn:hover{
 color:white;
 border-color:#00ffff;
}

.web-window iframe{
 display:block;
 width:100%;
 height:calc(100% - 39px);
 border:none;
 background:white;
}

.web-window.minimized{
 height:39px!important;
 min-height:39px!important;
 resize:none;
}

.web-window.minimized iframe{
 display:none;
}

#webSearchIndicator{
 position:fixed;
 left:20px;
 bottom:20px;
 z-index:210;
 display:none;
 padding:8px 12px;
 border:1px solid rgba(0,255,255,.2);
 border-radius:15px;
 background:rgba(2,15,18,.75);
 color:rgba(180,255,255,.6);
 font-size:8px;
 letter-spacing:1.5px;
 pointer-events:none;
}

#webSearchIndicator.active{
 display:block;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

 .jarvis-title{
  top:2.2%;
  font-size:23px;
  letter-spacing:5px;
 }

 .datetime{
  top:12px;
  right:13px;
 }

 .command-wrapper{
  width:calc(100% - 24px);
  bottom:17px;
 }

 #textInput{
  font-size:13px;
 }

 #chat{
  bottom:80px;
 }

 #micStatus{
  bottom:66px;
 }

 #map{
  top:3cm;
  right:3cm;
  bottom:3cm;
  left:3cm;
  border-radius:22px;
 }

 .map-overlay{
  border-radius:22px;
 }

 .map-header{
  top:2.5%;
  font-size:23px;
  letter-spacing:5px;
 }

 #closeMap{
  top:24px;
  left:25px;
  width:34px;
  height:34px;
 }

 #voiceBtn{
  right:12px;
  bottom:70px;
  height:34px;
  font-size:9px;
  padding:0 11px;
 }

 #conversationBtn{
  left:12px;
  bottom:70px;
  height:34px;
  font-size:9px;
  padding:0 11px;
 }

 #conversationStatus{
  left:12px;
  bottom:112px;
 }

 #voicePanel{
  right:12px;
  bottom:112px;
  width:calc(100% - 24px);
 }

 .web-window{
  width:calc(100vw - 40px);
  height:300px;
  min-width:230px;
  min-height:180px;
 }

}

@media(max-width:430px){

 #map{
  top:2.2cm;
  right:2.2cm;
  bottom:2.2cm;
  left:2.2cm;
 }

}


/* =====================================================
   TRASCRIZIONE
===================================================== */

#textInput.listening{
 color:#8fffff;
 text-shadow:0 0 8px rgba(0,255,255,.3);
}

</style>

</head>

<div id="chat"></div>

<script type="module">

import * as THREE from "three";


/* =====================================================
   CONFIG
===================================================== */

const API=
 "https://iao-ai-v3.oceano-masoud.workers.dev/";

const MEMORY_KEY=
 "jarvis_memory_v1";

const MAX_MEMORY=30;

const ELEVEN_VOICE_ID=
 "vkBFlAtUdZqNR4MqxSVr";


/* =====================================================
   VARIABILI AUDIO
===================================================== */

let currentAudio=null;

let audioPlaying=false;

let deviceVoices=[];

let selectedDeviceVoice=null;


/* =====================================================
   VARIABILI CONVERSAZIONE
===================================================== */

let conversationMode=false;

let recognition=null;

let listening=false;

let recognitionRestartTimer=null;

let recognitionShouldRun=false;

let recognitionStarting=false;

let speechGeneration=0;

let manualRecognition=false;


/* =====================================================
   ELEMENTI
===================================================== */

const container=
 document.getElementById(
  "webgl-container"
 );

const chat=
 document.getElementById(
  "chat"
 );

const textInput=
 document.getElementById(
  "textInput"
 );

const sendBtn=
 document.getElementById(
  "sendBtn"
 );

const micBtn=
 document.getElementById(
  "micBtn"
 );

const micStatus=
 document.getElementById(
  "micStatus"
 );

const clock=
 document.getElementById(
  "clock"
 );

const date=
 document.getElementById(
  "date"
 );

const tacticalMap=
 document.getElementById(
  "tacticalMap"
 );

const closeMap=
 document.getElementById(
  "closeMap"
 );

const jarvisTitle=
 document.getElementById(
  "jarvisTitle"
 );

const mapHeader=
 document.querySelector(
  ".map-header"
 );

const voiceBtn=
 document.getElementById(
  "voiceBtn"
 );

const voicePanel=
 document.getElementById(
  "voicePanel"
 );

const voiceSelector=
 document.getElementById(
  "voiceSelector"
 );

const voiceTest=
 document.getElementById(
  "voiceTest"
 );

const conversationBtn=
 document.getElementById(
  "conversationBtn"
 );

const conversationStatus=
 document.getElementById(
  "conversationStatus"
 );

const webSearchWindows=
 document.getElementById(
  "webSearchWindows"
 );

const webSearchIndicator=
 document.getElementById(
  "webSearchIndicator"
 );


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

 const saved=
  localStorage.getItem(
   MEMORY_KEY
  );

 if(saved){

  const parsed=
   JSON.parse(saved);

  if(Array.isArray(parsed))
   memory=
    parsed.slice(
     -MAX_MEMORY
    );

 }

}catch(error){

 console.warn(
  "Memoria:",
  error
 );

}


function saveMemory(){

 try{

  localStorage.setItem(
   MEMORY_KEY,
   JSON.stringify(
    memory.slice(
     -MAX_MEMORY
    )
   )
  );

 }catch(error){

  console.warn(
   "Salvataggio memoria:",
   error
  );

 }

}


function addMemory(
 role,
 content
){

 memory.push({
  role,
  content
 });

 memory=
  memory.slice(
   -MAX_MEMORY
  );

 saveMemory();

}


/* =====================================================
   OROLOGIO
===================================================== */

const months=[
 "GEN","FEB","MAR","APR","MAG","GIU",
 "LUG","AGO","SET","OTT","NOV","DIC"
];


function updateClock(){

 const now=
  new Date();

 clock.textContent=
  `${String(now.getHours()).padStart(2,"0")}:`+
  `${String(now.getMinutes()).padStart(2,"0")}:`+
  `${String(now.getSeconds()).padStart(2,"0")}`;

 date.textContent=
  `${String(now.getDate()).padStart(2,"0")} `+
  `${months[now.getMonth()]} `+
  `${now.getFullYear()}`;

}


updateClock();

setInterval(
 updateClock,
 1000
);


/* =====================================================
   THREE.JS
===================================================== */

const scene=
 new THREE.Scene();


const camera=
 new THREE.PerspectiveCamera(
  55,
  window.innerWidth/
  window.innerHeight,
  .1,
  1000
 );


camera.position.z=
 5.2;


const renderer=
 new THREE.WebGLRenderer({

  antialias:true,

  alpha:true,

  powerPreference:
   "high-performance"

 });


renderer.setSize(
 window.innerWidth,
 window.innerHeight
 );


renderer.setPixelRatio(
 Math.min(
  window.devicePixelRatio||1,
  2
 )
 );


container.appendChild(
 renderer.domElement
 );


/* =====================================================
   GLOW
===================================================== */

function createGlow(){

 const canvas=
  document.createElement(
   "canvas"
  );

 canvas.width=64;

 canvas.height=64;


 const ctx=
  canvas.getContext(
   "2d"
  );


 const gradient=
  ctx.createRadialGradient(
   32,32,0,
   32,32,32
  );


 gradient.addColorStop(
  0,
  "rgba(255,255,255,1)"
 );

 gradient.addColorStop(
  .2,
  "rgba(220,255,255,1)"
 );

 gradient.addColorStop(
  .4,
  "rgba(0,255,255,.9)"
 );

 gradient.addColorStop(
  .7,

const COUNT=3000;


const geometry=
 new THREE.BufferGeometry();


const positions=
 new Float32Array(
  COUNT*3
 );


const radii=
 new Float32Array(
  COUNT
 );


const angles=
 new Float32Array(
  COUNT*2
 );


const seeds=
 new Float32Array(
  COUNT
 );


for(
 let i=0;
 i<COUNT;
 i++
){

 const r=
  1.10+
  Math.random()*.70;


 const theta=
  Math.random()*
  Math.PI*2;


 const phi=
  Math.acos(
   2*Math.random()-1
  );


 radii[i]=r;

 angles[i*2]=theta;

 angles[i*2+1]=phi;

 seeds[i]=
  Math.random()*100;


 positions[i*3]=
  r*
  Math.sin(phi)*
  Math.cos(theta);


 positions[i*3+1]=
  r*
  Math.sin(phi)*
  Math.sin(theta);


 positions[i*3+2]=
  r*
  Math.cos(phi);

}


geometry.setAttribute(
 "position",
 new THREE.BufferAttribute(
  positions,
  3
 )
);


const material=
 new THREE.PointsMaterial({

  color:
   new THREE.Color(
    0x00cfe8
   ),

  size:.042,

  map:createGlow(),

  transparent:true,

 });

/* =====================================================
   STATO NEURONI
===================================================== */

let targetEnergy=.15;

let energy=.15;


const normalColor=
 new THREE.Color(
  0x00cfe8
 );


const activeColor=
 new THREE.Color(
  0x8fffff
 );


const currentColor=
 normalColor.clone();


function setState(state){

 if(state==="thinking")
  targetEnergy=2;

 else if(state==="speaking")
  targetEnergy=.8;

 else if(state==="listening")
  targetEnergy=.55;

 else
  targetEnergy=.15;

}


/* =====================================================
   ANIMAZIONE NEURONI
===================================================== */

function animate(){

 requestAnimationFrame(
  animate
 );


 const time=
  performance.now()*.001;


 energy+=
  (targetEnergy-energy)*
  .045;


 currentColor.lerp(
  activeColor,
  Math.min(
   energy*.04,
   1
  )
 );


 if(energy<.3){

  currentColor.lerp(
   normalColor,
   .03
  );

 }


 material.color=
  currentColor;


 material.size=
  .032+
  energy*.008;


 const pos=
  geometry.attributes
   .position.array;


 for(
  let i=0;
  i<COUNT;
  i++
 ){

  const index=
   i*3;


  const r=
   radii[i];


  const theta=
   angles[i*2];


  const phi=
   angles[i*2+1];


  const seed=
   seeds[i];


  const pulse=
   Math.sin(
    time*2+
    seed
   )*.035;


  const strangeShape=
   Math.sin(
    theta*6+
    time*2+
    seed
   )*.18*energy;


  const wave=
   Math.cos(
    phi*7-
    time*1.8+
    seed
   )*.12*energy;


  const rr=
   r+
   pulse+
   strangeShape+
   wave;


  let x=
   rr*
   Math.sin(phi)*
   Math.cos(theta);


  let y=
   rr*
   Math.sin(phi)*
   Math.sin(theta);


  /*
     CORRETTO:
     mancava la parentesi ")" nel codice originale.
  */

  let z=
   rr*
   Math.cos(phi);


  x+=
   Math.sin(
    time*2.4+
    phi*8+
    seed
   )*.08*energy;


  y+=
   Math.cos(
    time*2.1+
    theta*9+
    seed
   )*.08*energy;


  z+=
   Math.sin(
    time*2.7+
    (theta+phi)*7
   )*.10*energy;


  pos[index]=x;

  pos[index+1]=y;

  pos[index+2]=z;

 }


 geometry.attributes
  .position
  .needsUpdate=true;


 particles.rotation.y+=
  .0005+
  energy*.0008;


 particles.rotation.x=
  Math.sin(
   time*.25
  )*.04;


 particles.rotation.z=
  Math.cos(
   time*.18
  )*.025;


 renderer.render(
  scene,
  camera
 );

}


animate();

function escapeHtml(text){

 return String(text)

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}

/* =====================================================
   NORMALIZZAZIONE
===================================================== */

function normalizeText(text){

 return String(text||"")

  .toLowerCase()

  .normalize("NFD")

  .replace(
   /[\u0300-\u036f]/g,
   ""
  )

  .replace(
   /[^a-z0-9\s]/g,
   " "
  )

  .replace(
   /\s+/g,
   " "
  )

  .trim();

}


function similarity(a,b){

 a=normalizeText(a);

 b=normalizeText(b);


 if(a===b)
  return 1;


 if(!a||!b)
  return 0;


 const longer=
  a.length>b.length?a:b;


 const shorter=
  a.length>b.length?b:a;


 if(longer.includes(shorter))
  return shorter.length/
   longer.length;


 const matrix=[];


 for(
  let i=0;
  i<=shorter.length;
  i++
 ){

  matrix[i]=[i];

 }


 for(
  let j=0;
  j<=longer.length;
  j++
 ){

  matrix[0][j]=j;

 }


 for(
  let i=1;
  i<=shorter.length;
  i++
 ){

  for(
   let j=1;
   j<=longer.length;
   j++
  ){

   matrix[i][j]=
    Math.min(

     matrix[i-1][j]+1,

     matrix[i][j-1]+1,

     matrix[i-1][j-1]+
      (
       shorter[i-1]===
       longer[j-1]
       ?0
       :1
      )

    );

  }

 }


 const distance=
  matrix[
   shorter.length
  ][
   longer.length
  ];


 return 1-
  distance/
  longer.length;

}


function commandLooksLike(
 text,
 variants
){

 const normalized=
  normalizeText(text);


 for(
  const variant of variants
 ){

  const v=
   normalizeText(variant);


  if(normalized===v)
   return true;


  if(
   normalized.includes(v)||
   v.includes(normalized)
  )
   return true;


  if(
   similarity(
    normalized,
    v
   )>=.72
  )
   return true;

 }


 return false;

}

/* =====================================================
   RICERCA POSIZIONE
===================================================== */

async function searchLocation(place){

 try{

  openTacticalMap();


  addMsg(
   "Ricerca posizione: "+
   place
  );


  const url=
   "https://nominatim.openstreetmap.org/search"+
   "?format=json&limit=1&q="+
   encodeURIComponent(place);


  const response=
   await fetch(
    url,
    {
     headers:{
      "Accept":
       "application/json"
     }
    }
   );


  if(!response.ok)
   throw new Error(
    "Ricerca posizione fallita"
   );


  const results=
   await response.json();


  if(!results.length){

   addMsg(
    "Non riesco a trovare "+
    place+"."
   );

   return;

  }


  const result=
   results[0];


  const lat=
   parseFloat(
    result.lat
   );


  const lon=
   parseFloat(
    result.lon
   );


  if(!map)
   throw new Error(
    "Mappa non inizializzata"
   );


  map.flyTo({

   center:[
    lon,
    lat
   ],

   zoom:12,

   speed:.8,

   curve:1.5,

   essential:true

  });


  createJarvisMarker(
   lat,
   lon,
   place
  );


  addMsg(
   "Posizione acquisita: "+
   place
  );


 }catch(error){

  console.error(
   "MAP ERROR:",
   error
  );


  addMsg(
   "Impossibile localizzare "+
   place+"."
  );

 }

}

    </button>

     title="Chiudi">

    </button>

   </div>

  </div>

  <iframe
   title="Ricerca web ${safeTitle}"
   loading="eager">
  </iframe>

 `;


 webSearchWindows.appendChild(
  windowElement
 );


 const iframe=
  windowElement.querySelector(
   "iframe"
  );


 iframe.src=
  "https://www.google.com/search?igu=1&q="+
  encodeURIComponent(query);


 windowElement.addEventListener(
  "pointerdown",
  ()=>{
   bringWebWindowToFront(
    windowElement
   );
  }
 );


 const minimizeButton=
  windowElement.querySelector(
   ".minimize-web"
  );


 minimizeButton.addEventListener(
  "click",
  event=>{

   event.stopPropagation();

   windowElement
    .classList
    .toggle("minimized");

  }
 );


 const closeButton=
  windowElement.querySelector(
   ".close-web"
  );


 closeButton.addEventListener(
  "click",
  event=>{

   event.stopPropagation();

   windowElement.remove();

   updateWebIndicator();

  }
 );


 const header=
  windowElement.querySelector(
   ".web-window-header"
  );


 let dragging=false;

 let dragOffsetX=0;

 let dragOffsetY=0;


 header.addEventListener(
  "pointerdown",
  event=>{

   if(
    event.target.closest(
     ".web-window-btn"
    )
   )
    return;


   dragging=true;


   bringWebWindowToFront(
    windowElement
   );


   const rect=
    windowElement
     .getBoundingClientRect();


   dragOffsetX=
    event.clientX-
    rect.left;


   dragOffsetY=
    event.clientY-
    rect.top;


   try{

    header.setPointerCapture(
     event.pointerId
    );

   }catch(error){}


   event.preventDefault();

  },
  {
   passive:false
  }
 );


 header.addEventListener(
  "pointermove",
  event=>{

   if(!dragging)
    return;


   event.preventDefault();


   let newLeft=
    event.clientX-
    dragOffsetX;


   let newTop=
    event.clientY-
    dragOffsetY;


   const rect=
    windowElement
     .getBoundingClientRect();


   const minLeft=
    -rect.width+100;


   const maxLeft=
    window.innerWidth-80;


   const minTop=0;


   const maxTop=
    window.innerHeight-60;


   newLeft=
    Math.max(
     minLeft,
     Math.min(
      newLeft,
      maxLeft
     )
    );


   newTop=
    Math.max(
     minTop,
     Math.min(
      newTop,
      maxTop
     )
    );


   windowElement.style.left=
    newLeft+"px";


   windowElement.style.top=
    newTop+"px";

  },
  {
   passive:false
  }
 );


 function stopDragging(event){

  if(!dragging)
   return;


  dragging=false;


  try{

   header.releasePointerCapture(
    event.pointerId
   );

  }catch(error){}

 }


 header.addEventListener(
  "pointerup",
  stopDragging
 );


 header.addEventListener(
  "pointercancel",
  stopDragging
 );


 header.addEventListener(
  "lostpointercapture",
  ()=>{
   dragging=false;
  }
 );


 updateWebIndicator();


 addMsg(
  "Ricerca web: "+
  query
 );

}

function speakDevice(text){

 return new Promise(
  resolve=>{

   if(
    !("speechSynthesis" in window)
   ){

    resolve(false);

    return;

   }


   try{

    window.speechSynthesis.cancel();


    const utterance=
     new SpeechSynthesisUtterance(
      text
     );


    utterance.lang=
     "it-IT";


    utterance.rate=
     .95;


    utterance.pitch=
     .9;


    utterance.volume=
     1;


    if(selectedDeviceVoice){

     utterance.voice=
      selectedDeviceVoice;

    }else{

     const italianVoice=
      deviceVoices.find(
       voice=>
        voice.lang
         .toLowerCase()
         .startsWith("it")
      );


     if(italianVoice)
      utterance.voice=
       italianVoice;

    }


    utterance.onstart=()=>{

     audioPlaying=true;

     setState(
      "speaking"
     );

    };


    utterance.onend=()=>{

     audioPlaying=false;


     if(conversationMode){

      setState(
       "listening"
      );


      startContinuousRecognition();

     }else{

      setState(
       "idle"
      );

     }


     resolve(true);

    };


    utterance.onerror=()=>{

     audioPlaying=false;


     if(conversationMode){

      setState(
       "listening"
      );


      startContinuousRecognition();

     }else{

      setState(
       "idle"
      );

     }


     resolve(false);

    };


    window.speechSynthesis
     .speak(
      utterance
     );


    setTimeout(
     ()=>{

      try{

       window.speechSynthesis.resume();

      }catch(error){}

     },
     100
    );


   }catch(error){

    console.error(
     error
    );


    resolve(false);

   }

  }
 );

}


/* =====================================================
   ELEVENLABS
===================================================== */

async function speakElevenLabs(
 text,
 generation
){

 if(!text)
  return false;


 if(currentAudio){

  try{

   currentAudio.pause();

   currentAudio.currentTime=0;

  }catch(error){}


  currentAudio=null;

 }


 const controller=
  new AbortController();


 const timeout=
  setTimeout(
   ()=>{
    controller.abort();
   },
   30000
  );


 try{

  const response=
   await fetch(
    API,
    {

     method:"POST",

     headers:{
      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({

      action:"tts",

      text:text,

      voiceId:
       ELEVEN_VOICE_ID

     }),

     signal:
      controller.signal

    }
   );


  if(!response.ok)
   return false;


  if(
   generation!==speechGeneration
  )
   return false;


  const contentType=
   response.headers
    .get("content-type")||
   "";


  if(
   !contentType.includes(
    "audio"
   )
  )
   return false;


  const audioBlob=
   await response.blob();


  if(
   !audioBlob||
   audioBlob.size===0
  )
   return false;


  if(
   generation!==speechGeneration
  )
   return false;


  const audioUrl=
   URL.createObjectURL(
    audioBlob
   );


  const audio=
   new Audio(
    audioUrl
   );


  currentAudio=
   audio;


  audio.volume=1;


  audio.onplay=()=>{

   audioPlaying=true;

   setState(
    "speaking"
   );

  };


  audio.onended=()=>{

   audioPlaying=false;


   URL.revokeObjectURL(
    audioUrl
   );


   if(
    currentAudio===audio
   )
    currentAudio=null;


   if(conversationMode){

    setState(
     "listening"
    );


    startContinuousRecognition();

   }else{

    setState(
     "idle"
    );

   }

  };


  audio.onerror=()=>{

   audioPlaying=false;


   URL.revokeObjectURL(
    audioUrl
   );


   if(
    currentAudio===audio
   )
    currentAudio=null;


   if(conversationMode){

    setState(
     "listening"
    );


    startContinuousRecognition();

   }else{

    setState(
     "idle"
    );

   }

  };


  await audio.play();


  return true;


 }catch(error){

  console.warn(
   "ElevenLabs:",
   error
  );


  return false;


 }finally{

  clearTimeout(
   timeout
  );

 }

}


/* =====================================================
   SPEAK
===================================================== */

async function speak(text){

 if(!text)
  return;


 speechGeneration++;


 const generation=
  speechGeneration;


 if(conversationMode)
  stopRecognitionOnly();


 const elevenSuccess=
  await speakElevenLabs(
   text,
   generation
  );


 if(elevenSuccess)
  return;


 if(
  generation!==speechGeneration
 )
  return;


 await speakDevice(
  text
 );

}

/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const Recognition=
 window.SpeechRecognition||
 window.webkitSpeechRecognition;


function setMicStatus(
 text,
 active
){

 micStatus.textContent=
  text;


 if(active){

  micStatus.classList.add(
   "active"
  );

 }else{

  micStatus.classList.remove(
   "active"
  );

 }

}


function setupRecognition(){

 if(!Recognition)
  return false;


 recognition=
  new Recognition();


 recognition.lang=
  "it-IT";


 recognition.continuous=
  false;


 recognition.interimResults=
  true;


 recognition.maxAlternatives=
  1;


 recognition.onstart=()=>{

  recognitionStarting=false;

  listening=true;


  micBtn.classList.add(
   "active"
  );


  textInput.classList.add(
   "listening"
  );


  setMicStatus(
   "MICROFONO: ASCOLTO...",
   true
  );


  setState(
   "listening"
  );

 };


 recognition.onresult=
  event=>{

   let finalText="";

   let interimText="";


   for(
    let i=event.resultIndex;
    i<event.results.length;
    i++
   ){

    const transcript=
     event.results[i][0]
      .transcript
      .trim();


    if(
     event.results[i].isFinal
    ){

     finalText+=
      transcript+" ";

    }else{

     interimText+=
      transcript+" ";

    }

   }


   finalText=
    finalText.trim();


   interimText=
    interimText.trim();


   if(interimText){

    textInput.value=
     interimText;

   }


   if(finalText){

    textInput.value=
     finalText;


    if(audioPlaying)
     stopSpeaking();


    setMicStatus(
     "MICROFONO: FRASE ACQUISITA",
     true
    );


    sendMessage();

   }

 };


 recognition.onerror=
  error=>{

   recognitionStarting=false;

   listening=false;


   micBtn.classList.remove(
    "active"
   );


   textInput.classList.remove(
    "listening"
   );


   console.warn(
    "Microfono:",
    error
   );


   if(
    error.error==="not-allowed"||
    error.error==="service-not-allowed"
   ){

    setMicStatus(
     "MICROFONO: PERMESSO NEGATO",
     true
    );


    addMsg(
     "Permesso microfono negato. Consenti l'accesso al microfono nel browser."
    );


    if(conversationMode){

     conversationMode=false;

     recognitionShouldRun=false;

     updateConversationUI();

    }


    setState("idle");

    return;

   }


   if(
    error.error==="no-speech"
   ){

    setMicStatus(
     "MICROFONO: NESSUNA VOCE",
     true
    );

   }else if(
    error.error==="audio-capture"
   ){

    setMicStatus(
     "MICROFONO: MICROFONO NON DISPONIBILE",
     true
    );

   }else{

    setMicStatus(
     "MICROFONO: RIAVVIO...",
     true
    );

   }


   if(conversationMode){

    scheduleContinuousRecognition();

   }else{

    setTimeout(
     ()=>{

      setMicStatus(
       "MICROFONO: PRONTO",
       false
      );

     },
     1200
    );


    setState(
     "idle"
    );

   }

 };


 recognition.onend=
  ()=>{

   recognitionStarting=false;

   listening=false;


   micBtn.classList.remove(
    "active"
   );


   textInput.classList.remove(
    "listening"
   );


   if(
    conversationMode&&
    recognitionShouldRun
   ){

    setMicStatus(
     "MICROFONO: RIAVVIO...",
     true
    );


    scheduleContinuousRecognition();

   }else{

    setMicStatus(
     "MICROFONO: PRONTO",
     false
    );


    if(!audioPlaying)
     setState("idle");

   }

 };

 return true;

}


if(Recognition){

 setupRecognition();

}else{

 micBtn.classList.add(
  "unsupported"
 );


 micBtn.title=
  "Riconoscimento vocale non supportato";


 addMsg(
  "Il browser non supporta il riconoscimento vocale."
 );

}


/* =====================================================
   STOP RICONOSCIMENTO
===================================================== */

function stopRecognitionOnly(){

 recognitionShouldRun=false;


 clearTimeout(
  recognitionRestartTimer
 );


 if(recognition){

  try{

   recognition.stop();

  }catch(error){}

 }


 listening=false;

 recognitionStarting=false;


 micBtn.classList.remove(
  "active"
 );


 textInput.classList.remove(
  "listening"
 );


 setMicStatus(
  "MICROFONO: PRONTO",
  false
 );

}


/* =====================================================
   RICONOSCIMENTO MANUALE
===================================================== */

function startManualRecognition(){

 if(!recognition){

  addMsg(
   "Il browser non supporta il riconoscimento vocale."
  );

  return;

 }


 if(audioPlaying)
  stopSpeaking();


 if(
  listening||
  recognitionStarting
 )
  return;


 manualRecognition=true;

 recognitionShouldRun=false;

 recognitionStarting=true;


 textInput.value="";


 setMicStatus(
  "MICROFONO: AVVIO...",
  true
 );


 try{

  recognition.start();

 }catch(error){

  recognitionStarting=false;


  console.warn(
   "Avvio microfono:",
   error
  );


  setTimeout(
   ()=>{

    if(
     !listening&&
     !recognitionStarting&&
     !conversationMode
    ){

     recognitionStarting=true;


     try{

      recognition.start();

     }catch(error2){

      recognitionStarting=false;

      console.warn(
       error2
      );


      setMicStatus(
       "MICROFONO: ERRORE",
       true
      );

     }

    }

   },
   350
  );

 }

}


/* =====================================================
   CONVERSAZIONE CONTINUA
===================================================== */

function startContinuousRecognition(){

 if(
  !conversationMode||
  !recognition
 )
  return;


 recognitionShouldRun=true;


 clearTimeout(
  recognitionRestartTimer
 );


 if(
  listening||
  recognitionStarting
 )
  return;


 recognitionRestartTimer=
  setTimeout(
   ()=>{

    if(
     !conversationMode||
     !recognitionShouldRun||
     listening||
     recognitionStarting
    )
     return;


    recognitionStarting=true;


    textInput.value="";


    setMicStatus(
     "MICROFONO: ASCOLTO...",
     true
    );


    try{

     recognition.start();

    }catch(error){

     recognitionStarting=false;


     console.warn(
      "Avvio conversazione:",
      error
     );


     scheduleContinuousRecognition();

    }

   },
   300
  );

}


function scheduleContinuousRecognition(){

 if(
  !conversationMode||
  !recognitionShouldRun
 )
  return;


 clearTimeout(
  recognitionRestartTimer
 );


 recognitionRestartTimer=
  setTimeout(
   startContinuousRecognition,
   500
  );

}


/* =====================================================
   PULSANTE MICROFONO
===================================================== */

micBtn.addEventListener(
 "click",
 ()=>{

  if(!recognition){

   addMsg(
    "Il browser non supporta il riconoscimento vocale."
   );

   return;

  }


  if(conversationMode){

   if(
    listening||
    recognitionStarting
   ){

    disableConversationMode();

   }else{

    enableConversationMode();

   }


   return;

  }


  if(
   listening||
   recognitionStarting
  ){

   stopRecognitionOnly();

   setState("idle");

   return;

  }


  startManualRecognition();

 }
);


/* =====================================================
   MODALITÀ CONVERSAZIONE
===================================================== */

function updateConversationUI(){

 if(conversationMode){

  conversationBtn.classList.add(
   "active"
  );


  conversationBtn.textContent=
   "● CONVERSAZIONE ON";


  conversationStatus.classList.add(
   "active"
  );


  conversationStatus.textContent=
   "CONVERSAZIONE CONTINUA: ON";

 }else{

  conversationBtn.classList.remove(
   "active"
  );


  conversationBtn.textContent=
   "🎙 CONVERSAZIONE";


  conversationStatus.classList.remove(
   "active"
  );


  conversationStatus.textContent=
   "CONVERSAZIONE CONTINUA: OFF";

 }

}


function enableConversationMode(){

 if(!recognition){

  addMsg(
   "Il browser non supporta la conversazione vocale continua."
  );

  return;

 }


 conversationMode=true;

 recognitionShouldRun=true;


 updateConversationUI();


 addMsg(
  "Modalità conversazione continua attivata."
 );


 startContinuousRecognition();

}


function disableConversationMode(){

 conversationMode=false;

 recognitionShouldRun=false;


 clearTimeout(
  recognitionRestartTimer
 );


 stopRecognitionOnly();


 updateConversationUI();


 setState(
  "idle"
 );


 addMsg(
  "Modalità conversazione continua disattivata."
 );

}


function toggleConversationMode(){

 if(conversationMode){

  disableConversationMode();

 }else{

  enableConversationMode();

 }

}


conversationBtn.addEventListener(
 "click",
 toggleConversationMode
 );


/* =====================================================
   COMANDI CONVERSAZIONE
===================================================== */

function handleConversationCommand(text){

 const normalized=
  normalizeText(text);


 const activate=[
  "modalita conversazione",
  "modalita conversazione continua",
  "conversazione continua",
  "attiva conversazione",
  "attiva modalita conversazione",
  "attiva conversazione continua",
  "microfono sempre acceso",
  "tieni il microfono acceso",
  "ascolto continuo",
  "attiva ascolto continuo"
 ];


 const deactivate=[
  "disattiva conversazione",
  "disattiva modalita conversazione",
  "disattiva conversazione continua",
  "chiudi conversazione continua",
  "spegni conversazione",
  "spegni ascolto continuo",
  "disattiva ascolto continuo",
  "spegni microfono continuo"
 ];


 if(
  commandLooksLike(
   normalized,
   activate
  )
 ){

  enableConversationMode();

  return true;

 }


 if(
  commandLooksLike(
   normalized,
   deactivate
  )
 ){

  disableConversationMode();

  return true;

 }


 return false;

}


/* =====================================================
   PROCESS AI
===================================================== */

async function processAi(text){

 if(
  handleConversationCommand(
   text
  )
 )
  return;


 if(
  handleFullscreenCommand(
   text
  )
 )
  return;


 if(
  handleWebWindowCommand(
   text
  )
 )
  return;


 if(
  handleWebCommand(
   text
  )
 )
  return;


 if(
  handleMapCommand(
   text
  )
 )
  return;


 setState(
  "thinking"
 );


 try{

  const temporal=
   getTimeData();


  addMemory(
   "user",
   text
  );


  const controller=
   new AbortController();


  const timeout=
   setTimeout(
    ()=>{
     controller.abort();
    },
    30000
   );


  let response;


  try{

   response=
    await fetch(
     API,
     {

      method:"POST",

      headers:{
       "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

       message:text,

       memory:
        memory.slice(-4),

       currentTime:
        temporal.currentTime,

       currentDate:
        temporal.currentDate,

       dayOfWeek:
        temporal.dayOfWeek,

       timezone:
        temporal.timezone

      }),

      signal:
       controller.signal

     }
    );


  }finally{

   clearTimeout(
    timeout
   );

  }


  if(!response.ok){

   const errorText=
    await response.text();


   let errorMessage=
    "HTTP "+
    response.status;


   try{

    const errorData=
     JSON.parse(
      errorText
     );


    if(
     errorData&&
     errorData.error
    ){

     errorMessage=
      errorData.error;

    }

   }catch(error){

    if(errorText){

     errorMessage=
      errorText.substring(
       0,
       200
      );

    }

   }


   throw new Error(
    errorMessage
   );

  }


  const data=
   await response.json();


  const reply=
   typeof data.response===
    "string"
     ?data.response.trim()
     :"";


  if(!reply)
   throw new Error(
    "Risposta AI vuota"
   );


  addMsg(
   reply
  );


  addMemory(
   "assistant",
   reply
  );


  speak(
   reply
  ).catch(
   console.error
  );


 }catch(error){

  console.error(
   "JARVIS ERROR:",
   error
  );


  let message=
   error.message||
   "Errore sconosciuto";


  if(
   error.name===
   "AbortError"
  ){

   message=
    "Il server ha impiegato troppo tempo a rispondere.";

  }else if(
   message===
   "Failed to fetch"
  ){

   message=
    "Errore di connessione al server JARVIS.";

  }


  addMsg(
   "ERRORE: "+
   message
  );


  if(
   conversationMode
  ){

   setState(
    "listening"
   );


   startContinuousRecognition();

  }else{

   setState(
    "idle"
   );

  }

 }

}


/* =====================================================
   INVIO
===================================================== */

function sendMessage(){

 const text=
  textInput.value.trim();


 if(!text)
  return;


 textInput.value="";


 if(audioPlaying)
  stopSpeaking();


 addMsg(
  text
 );


 processAi(
  text
 );

}

 "click",
 sendMessage
 );


textInput.addEventListener(
 "keydown",
 event=>{

  if(
   event.key===
   "Enter"
  ){

   event.preventDefault();

   sendMessage();

  }

 }
);
