<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA - Interactive Particle System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam-video {
            display: none;
        }
        /* UI in basso per selezionare le forme come nella foto */
        #ui-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(20, 20, 20, 0.75);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .ui-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .ui-btn.active, .ui-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }
        #status-text {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="status-text">NEBULA // INTERACTIVE SYSTEM</div>
    <div id="canvas-container"></div>
    <video id="webcam-video" playsinline></video>

    <!-- Barra UI inferiore per cambiare forma al volo -->
    <div id="ui-bar">
        <button class="ui-btn active" onclick="setShape('star')">⭐ Star</button>
        <button class="ui-btn" onclick="setShape('saturn')">🪐 Saturn</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = 20000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3); // Per transizioni fluide
        const colors = new Float32Array(particleCount * 3);

        const colorPalette = [
            new THREE.Color('#ff3399'),
            new THREE.Color('#33ccff'),
            new THREE.Color('#9933ff'),
            new THREE.Color('#ffffff'),
            new THREE.Color('#33ff99')
        ];

        // Funzioni di generazione coordinate per le forme
        function generateStarCoordinates(i3) {
            const u = Math.random() * Math.PI * 2;
            const t = Math.random();
            const arms = 5;
            const rBase = 1.0 + 0.8 * Math.abs(Math.cos(arms * u / 2));
            const r = rBase * (0.2 + 0.8 * Math.random());

            return {
                x: r * Math.cos(u) * (1.2 - t * 0.4),
                y: r * Math.sin(u) * (1.2 - t * 0.4),
                z: (Math.random() - 0.5) * 0.6 * (2.0 - r)
            };
        }

        function generateSaturnCoordinates(i3) {
            // 70% Pianeta centrale, 30% Anelli
            if (i3 < particleCount * 0.7 * 3) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 1.2 * Math.cbrt(Math.random()); // Densità sferica
                return {
                    x: r * Math.sin(phi) * Math.cos(theta),
                    y: r * Math.sin(phi) * Math.sin(theta),
                    z: r * Math.cos(phi)
                };
            } else {
                // Anelli di Saturno
                const u = Math.random() * Math.PI * 2;
                const r = 1.8 + Math.random() * 1.2;
                return {
                    x: r * Math.cos(u),
                    y: (Math.random() - 0.5) * 0.15,
                    z: r * Math.sin(u)
                };
            }
        }

        let currentShapeType = 'star';

        // Inizializzazione posizioni
        for (let i = 0; i < particleCount * 3; i += 3) {
            const coords = generateStarCoordinates(i);
            positions[i] = coords.x;
            positions[i + 1] = coords.y;
            positions[i + 2] = coords.z;

            targetPositions[i] = coords.x;
            targetPositions[i + 1] = coords.y;
            targetPositions[i + 2] = coords.z;

            const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i] = randomColor.r;
            colors[i + 1] = randomColor.g;
            colors[i + 2] = randomColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.85,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Funzione globale chiamata dai bottoni UI inferiori
        window.setShape = function(shape) {
            currentShapeType = shape;
            
            // Aggiorna classe attiva ai bottoni
            document.querySelectorAll('.ui-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Calcola i nuovi target
            for (let i = 0; i < particleCount * 3; i += 3) {
                let coords = (shape === 'star') ? generateStarCoordinates(i) : generateSaturnCoordinates(i);
                targetPositions[i] = coords.x;
                targetPositions[i + 1] = coords.y;
                targetPositions[i + 2] = coords.z;
            }
        };

        // Interazione Webcam / Mano
        let handPosition = { x: 0, y: 0, active: false };
        const videoElement = document.getElementById('webcam-video');

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const indexFinger = results.multiHandLandmarks[0][8];
                handPosition.x = (indexFinger.x - 0.5) * -4;
                handPosition.y = (indexFinger.y - 0.5) * -4;
                handPosition.active = true;
            } else {
                handPosition.active = false;
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // Loop di Animazione con transizione fluida verso la forma scelta
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const positionAttribute = geometry.attributes.position;

            particleSystem.rotation.z = elapsedTime * 0.05;

            for (let i = 0; i < particleCount; i++) {
                let i3 = i * 3;
                let px = positionAttribute.getX(i);
                let py = positionAttribute.getY(i);
                let pz = positionAttribute.getZ(i);

                // Interpolazione fluida verso il target della forma selezionata
                px += (targetPositions[i3] - px) * 0.08;
                py += (targetPositions[i3 + 1] - py) * 0.08;
                pz += (targetPositions[i3 + 2] - pz) * 0.08;

                // Interazione con la mano
                if (handPosition.active) {
                    const dx = handPosition.x - px;
                    const dy = handPosition.y - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 2.5) {
                        px += dx * 0.04;
                        py += dy * 0.04;
                    }
                }

                positionAttribute.setXYZ(i, px, py, pz);
            }
            positionAttribute.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
