<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
/>

<style>

:root{
    --jarvis-main:#D6A900;
    --jarvis-bright:#FFD84A;
    --jarvis-light:#FFF2A6;
    --jarvis-dark:#3A2A00;

    --jarvis-glow:rgba(255,190,0,.65);
    --jarvis-glow-light:rgba(255,220,80,.32);
}

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010100;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at center,
            #171300 0%,
            #080700 42%,
            #000000 100%
        );
}

/* =====================================================
   HOLOGRAM
===================================================== */

#webgl-container{
    position:fixed;
    inset:0;
    z-index:1;
}

#webgl-container canvas{
    display:block;
}

/* =====================================================
   VIGNETTE
===================================================== */

.vignette{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 22%,
            rgba(0,0,0,.25) 58%,
            rgba(0,0,0,.9) 100%
        );
}

/* =====================================================
   SCANLINES
===================================================== */

.vignette::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,215,80,.018) 0px,
            rgba(255,215,80,.018) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity:.7;
}

/* =====================================================
   TITOLO
===================================================== */

.jarvis-title{
    position:fixed;

    top:2.4%;
    left:50%;

    transform:translateX(-50%);

    z-index:30;

    color:rgba(255,239,170,.94);

    font-size:clamp(20px,2.8vw,31px);

    font-weight:300;

    letter-spacing:clamp(5px,1vw,8px);

    white-space:nowrap;

    text-shadow:
        0 0 8px rgba(255,190,0,.7),
        0 0 25px rgba(255,210,70,.35),
        0 0 50px rgba(255,170,0,.12);

    pointer-events:none;
}

/* =====================================================
   DATA / ORA
===================================================== */

.datetime{
    position:fixed;

    top:18px;
    right:24px;

    z-index:30;

    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:3px;

    font-family:monospace;

    pointer-events:none;
}

.time{
    color:rgba(255,218,85,.88);

    font-size:11px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(255,190,0,.7);
}

.date{
    color:rgba(255,220,100,.5);

    font-size:8px;
    letter-spacing:1px;
}

/* =====================================================
   HUD ORIZZONTALE
===================================================== */

.hud-left{
    position:fixed;
    left:25px;
    top:50%;

    transform:translateY(-50%);

    z-index:20;

    color:rgba(255,220,100,.42);

    font-family:monospace;
    font-size:8px;

    line-height:2.1;

    letter-spacing:2px;

    pointer-events:none;

    text-shadow:
        0 0 8px rgba(255,190,0,.35);
}

.hud-right{
    position:fixed;
    right:25px;
    top:50%;

    transform:translateY(-50%);

    z-index:20;

    color:rgba(255,220,100,.42);

    font-family:monospace;
    font-size:8px;

    line-height:2.1;

    letter-spacing:2px;

    text-align:right;

    pointer-events:none;

    text-shadow:
        0 0 8px rgba(255,190,0,.35);
}

/* =====================================================
   CHAT
===================================================== */

#chat{
    position:fixed;

    left:50%;
    bottom:92px;

    transform:translateX(-50%);

    z-index:40;

    width:min(620px,88%);

    text-align:center;

    pointer-events:none;
}

.msg{
    display:inline-block;

    max-width:100%;

    padding:10px 18px;

    border:
        1px solid
        rgba(255,195,30,.38);

    border-radius:24px;

    background:
        rgba(18,13,0,.52);

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    color:rgba(255,247,210,.95);

    font-size:12px;
    line-height:1.45;

    white-space:pre-wrap;

    box-shadow:
        0 0 18px rgba(255,190,0,.09),
        inset 0 0 15px rgba(255,200,50,.025);
}

/* =====================================================
   COMMAND BAR
===================================================== */

.command-wrapper{
    position:fixed;

    left:50%;
    bottom:23px;

    transform:translateX(-50%);

    z-index:50;

    width:min(650px,90%);

    display:flex;
    align-items:center;

    padding:6px 7px 6px 20px;

    border:
        1px solid
        rgba(255,195,30,.5);

    border-radius:40px;

    background:
        rgba(12,9,0,.68);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 0 30px rgba(255,190,0,.12),
        inset 0 0 20px rgba(255,210,60,.025);
}

.command-wrapper:focus-within{
    border-color:var(--jarvis-bright);

    box-shadow:
        0 0 25px rgba(255,190,0,.28),
        0 0 55px rgba(255,220,80,.08);
}

/* =====================================================
   INPUT
===================================================== */

#textInput{
    flex:1;

    min-width:0;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:12px 5px;
}

#textInput::placeholder{
    color:rgba(255,225,130,.38);
}

/* =====================================================
   MICROFONO
===================================================== */

#micBtn{
    width:34px;
    height:34px;

    margin-right:7px;

    border:none;

    background:transparent;

    color:rgba(255,220,120,.82);

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;
}

.mic-icon{
    width:8px;
    height:14px;

    border:
        1.3px solid
        currentColor;

    border-radius:60px;

    position:relative;
}

.mic-icon::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-6px;

    width:12px;
    height:7px;

    transform:translateX(-50%);

    border:
        1.3px solid
        currentColor;

    border-top:none;

    border-radius:0 0 8px 8px;
}

#micBtn:hover{
    color:var(--jarvis-bright);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,210,60,.8)
        );
}

#micBtn.active{
    color:#FFF1A0;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,190,0,.95)
        );
}

/* =====================================================
   INVIA
===================================================== */

#sendBtn{
    height:39px;

    padding:0 17px;

    border:
        1px solid
        rgba(255,195,30,.5);

    border-radius:22px;

    background:
        rgba(255,190,0,.08);

    color:
        rgba(255,230,150,.9);

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.2s;
}

#sendBtn:hover{
    color:white;

    border-color:
        var(--jarvis-bright);

    background:
        rgba(255,190,0,.18);

    box-shadow:
        0 0 15px
        rgba(255,190,0,.3);
}

/* =====================================================
   VOCE
===================================================== */

#voiceBtn{
    position:fixed;

    right:22px;
    bottom:24px;

    z-index:60;

    height:39px;

    padding:0 15px;

    border:
        1px solid
        rgba(255,195,30,.5);

    border-radius:22px;

    background:
        rgba(12,9,0,.84);

    color:
        rgba(255,225,145,.84);

    font-size:10px;

    letter-spacing:1.5px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.2s;
}

#voiceBtn:hover{
    color:white;

    border-color:
        var(--jarvis-bright);

    box-shadow:
        0 0 15px
        rgba(255,190,0,.4);
}

/* =====================================================
   VOICE PANEL
===================================================== */

#voicePanel{
    position:fixed;

    right:22px;
    bottom:72px;

    z-index:100;

    width:min(330px,calc(100% - 30px));

    padding:15px;

    display:none;

    border:
        1px solid
        rgba(255,195,30,.45);

    border-radius:18px;

    background:
        rgba(8,6,0,.97);

    backdrop-filter:blur(20px);

    box-shadow:
        0 0 35px
        rgba(255,190,0,.25);
}

#voicePanel.active{
    display:block;
}

.voice-title{
    color:rgba(255,235,170,.95);

    font-size:11px;
    letter-spacing:2px;

    margin-bottom:10px;
}

#voiceSelector{
    width:100%;

    padding:11px;

    border:
        1px solid
        rgba(255,195,30,.35);

    border-radius:10px;

    outline:none;

    background:
        rgba(25,18,0,.95);

    color:
        rgba(255,235,170,.9);

    font-size:11px;
}

#voiceTest{
    width:100%;

    margin-top:10px;

    padding:9px;

    border:
        1px solid
        rgba(255,195,30,.35);

    border-radius:10px;

    background:
        rgba(255,190,0,.07);

    color:
        rgba(255,225,145,.8);

    cursor:pointer;

    font-size:10px;

    letter-spacing:1px;
}

#voiceTest:hover{
    border-color:
        var(--jarvis-bright);

    color:white;

    box-shadow:
        0 0 12px
        rgba(255,190,0,.2);
}

/* =====================================================
   MAPPA TATTICA
===================================================== */

#tacticalMap{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    background:
        radial-gradient(
            circle at center,
            #171300 0%,
            #050400 65%,
            #000000 100%
        );
}

#tacticalMap.active{
    display:block;

    animation:
        mapIn .45s ease;
}

@keyframes mapIn{
    from{
        opacity:0;
        transform:scale(1.015);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =====================================================
   HEADER MAPPA
===================================================== */

.map-header{
    position:absolute;

    top:2.4%;
    left:50%;

    transform:translateX(-50%);

    z-index:600;

    color:
        rgba(255,235,165,.95);

    font-size:
        clamp(24px,4vw,42px);

    font-weight:300;

    letter-spacing:
        clamp(6px,1.3vw,12px);

    white-space:nowrap;

    text-shadow:
        0 0 12px rgba(255,190,0,.65),
        0 0 30px rgba(255,215,70,.25);

    pointer-events:none;
}

/* =====================================================
   MAPPA
===================================================== */

#map{
    position:absolute;

    top:3cm;
    right:3cm;
    bottom:3cm;
    left:3cm;

    overflow:hidden;

    border-radius:28px;

    background:#071012;

    box-shadow:
        0 0 35px rgba(0,0,0,.65),
        0 0 70px rgba(255,190,0,.12);

    border:
        1px solid
        rgba(255,195,30,.3);
}

.map-overlay{
    position:absolute;

    inset:0;

    z-index:400;

    pointer-events:none;

    border-radius:28px;

    box-shadow:
        inset 0 0 80px rgba(0,0,0,.28),
        inset 0 0 25px rgba(255,190,0,.06);
}

/* =====================================================
   CHIUSURA MAPPA
===================================================== */

#closeMap{
    position:absolute;

    top:28px;
    left:34px;

    z-index:700;

    width:38px;
    height:38px;

    border:
        1px solid
        rgba(255,195,30,.6);

    border-radius:50%;

    background:
        rgba(12,9,0,.9);

    color:
        rgba(255,225,145,.9);

    cursor:pointer;

    font-size:19px;

    display:flex;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(10px);

    transition:.2s;
}

#closeMap:hover{
    color:white;

    border-color:
        var(--jarvis-bright);

    box-shadow:
        0 0 15px
        rgba(255,190,0,.5);
}

/* =====================================================
   MAPLIBRE
===================================================== */

.maplibregl-ctrl-group{
    background:
        rgba(12,9,0,.9)!important;

    border:
        1px solid
        rgba(255,195,30,.4)!important;

    border-radius:12px!important;

    overflow:hidden;

    box-shadow:
        0 0 15px
        rgba(255,190,0,.15);
}

.maplibregl-ctrl-group button{
    background:
        transparent!important;

    color:
        #FFE58A!important;
}

.maplibregl-ctrl-group button:hover{
    background:
        rgba(255,190,0,.15)!important;
}

.maplibregl-ctrl-attrib{
    background:
        rgba(0,0,0,.75)!important;

    color:
        rgba(255,220,130,.4)!important;

    font-size:8px!important;
}

.maplibregl-ctrl-attrib a{
    color:
        rgba(255,200,70,.55)!important;
}

/* =====================================================
   MARKER
===================================================== */

.jarvis-map-marker{
    width:20px;
    height:20px;

    border-radius:50%;

    border:
        2px solid
        #FFD21C;

    background:
        rgba(255,190,0,.2);

    box-shadow:
        0 0 15px rgba(255,190,0,1),
        0 0 35px rgba(255,220,80,.5);

    position:relative;

    animation:
        markerPulse 1.5s infinite;
}

.jarvis-map-marker::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#FFFBE0;

    box-shadow:
        0 0 8px
        #FFD84A;
}

@keyframes markerPulse{

    0%,100%{
        transform:scale(1);

        box-shadow:
            0 0 15px rgba(255,190,0,.9),
            0 0 35px rgba(255,220,80,.4);
    }

    50%{
        transform:scale(1.18);

        box-shadow:
            0 0 22px rgba(255,200,0,1),
            0 0 50px rgba(255,220,80,.6);
    }
}

/* =====================================================
   POPUP
===================================================== */

.maplibregl-popup-content{
    background:
        rgba(12,9,0,.97)!important;

    color:
        rgba(255,240,190,.95)!important;

    border:
        1px solid
        rgba(255,195,30,.45);

    border-radius:10px;

    padding:10px 14px;

    box-shadow:
        0 0 20px
        rgba(255,190,0,.25);
}

.maplibregl-popup-close-button{
    color:
        #FFD84A!important;

    font-size:18px;
}

/* =====================================================
   WEB SEARCH
===================================================== */

#webSearchPanel{
    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    background:
        rgba(5,4,0,.97);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);
}

#webSearchPanel.active{
    display:block;

    animation:
        webPanelIn .3s ease;
}

@keyframes webPanelIn{
    from{
        opacity:0;
        transform:scale(.985);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.web-search-header{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:520;

    color:
        rgba(255,235,165,.95);

    font-size:13px;

    letter-spacing:4px;

    white-space:nowrap;

    text-shadow:
        0 0 12px rgba(255,190,0,.6),
        0 0 25px rgba(255,215,70,.2);
}

#webSearchFrame{
    position:absolute;

    top:58px;

    left:3%;
    right:3%;

    bottom:3%;

    width:94%;

    height:calc(97% - 58px);

    border:
        1px solid
        rgba(255,195,30,.35);

    border-radius:20px;

    background:#fff;

    box-shadow:
        0 0 40px
        rgba(255,190,0,.15);
}

#closeWebSearch{
    position:absolute;

    top:14px;
    right:20px;

    z-index:530;

    width:36px;
    height:36px;

    border:
        1px solid
        rgba(255,195,30,.5);

    border-radius:50%;

    background:
        rgba(12,9,0,.92);

    color:
        rgba(255,225,145,.9);

    cursor:pointer;

    font-size:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:.2s;
}

#closeWebSearch:hover{
    color:white;

    border-color:
        #FFD84A;

    box-shadow:
        0 0 15px
        rgba(255,190,0,.5);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .jarvis-title{
        top:2.2%;
        font-size:23px;
        letter-spacing:5px;
    }

    .datetime{
        top:12px;
        right:13px;
    }

    .time{
        font-size:10px;
    }

    .date{
        font-size:7px;
    }

    .command-wrapper{
        width:calc(100% - 24px);
        bottom:17px;
    }

    #textInput{
        font-size:13px;
    }

    #chat{
        bottom:80px;
    }

    .hud-left{
        left:10px;
        font-size:6px;
    }

    .hud-right{
        right:10px;
        font-size:6px;
    }

    #map{
        top:3cm;
        right:3cm;
        bottom:3cm;
        left:3cm;
        border-radius:22px;
    }

    .map-overlay{
        border-radius:22px;
    }

    .map-header{
        top:2.5%;
        font-size:23px;
        letter-spacing:5px;
    }

    #closeMap{
        top:24px;
        left:25px;
        width:34px;
        height:34px;
    }

    #voiceBtn{
        right:12px;
        bottom:70px;
        height:34px;
        font-size:9px;
        padding:0 11px;
    }

    #voicePanel{
        right:12px;
        bottom:112px;
        width:calc(100% - 24px);
    }
}

@media(max-width:430px){

    #map{
        top:2.2cm;
        right:2.2cm;
        bottom:2.2cm;
        left:2.2cm;
    }
}

</style>
</head>

<body>

<div id="webgl-container"></div>

<div class="vignette"></div>

<div class="hud-left">
    NEURAL SYSTEM<br>
    HOLOGRAPHIC CORE<br>
    OPTICAL ARRAY<br>
    DEPTH MATRIX<br>
    SENSOR LINK<br>
    MEMORY ONLINE
</div>

<div class="hud-right">
    JARVIS CORE<br>
    HOLOGRAM ACTIVE<br>
    SYSTEM ONLINE<br>
    VOICE READY<br>
    AI ENGINE<br>
    V8.4
</div>

<div
    class="jarvis-title"
    id="jarvisTitle"
>
    J.A.R.V.I.S
</div>

<div class="datetime">

    <div id="clock" class="time">
        00:00:00
    </div>

    <div id="date" class="date">
        00 AGO 2026
    </div>

</div>

<!-- =====================================================
     MAPPA TATTICA
===================================================== -->

<div id="tacticalMap">

    <div id="map"></div>

    <div class="map-overlay"></div>

    <div class="map-header">
        TACTICAL MAP
    </div>

    <button
        id="closeMap"
        title="Chiudi mappa"
        aria-label="Chiudi mappa"
    >
        ×
    </button>

</div>

<!-- =====================================================
     WEB SEARCH
===================================================== -->

<div id="webSearchPanel">

    <div class="web-search-header">
        J.A.R.V.I.S. // WEB SEARCH
    </div>

    <button
        id="closeWebSearch"
        title="Torna a JARVIS"
        aria-label="Chiudi ricerca web"
    >
        ×
    </button>

    <iframe
        id="webSearchFrame"
        title="Ricerca web JARVIS"
        loading="lazy"
    ></iframe>

</div>

<div id="chat"></div>

<!-- =====================================================
     COMANDO
===================================================== -->

<div class="command-wrapper">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        placeholder="Chiedi qualcosa a JARVIS..."
    >

    <button
        id="micBtn"
        aria-label="Microfono"
    >
        <span class="mic-icon"></span>
    </button>

    <button id="sendBtn">
        INVIA
    </button>

</div>

<button id="voiceBtn">
    ⚙ VOCE
</button>

<div id="voicePanel">

    <div class="voice-title">
        VOCE J.A.R.V.I.S.
    </div>

    <select id="voiceSelector">

        <option value="">
            Voce dispositivo automatica
        </option>

    </select>

    <button id="voiceTest">
        TESTA VOCE
    </button>

</div>

<script
    src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
</script>

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";

const MEMORY_KEY =
    "jarvis_memory_v1";

const MAX_MEMORY =
    30;

const ELEVEN_VOICE_ID =
    "vkBFlAtUdZqNR4MqxSVr";

let currentAudio = null;
let audioPlaying = false;

let deviceVoices = [];
let selectedDeviceVoice = null;

/* =====================================================
   ELEMENTI
===================================================== */

const container =
    document.getElementById("webgl-container");

const chat =
    document.getElementById("chat");

const textInput =
    document.getElementById("textInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const clock =
    document.getElementById("clock");

const date =
    document.getElementById("date");

let memory = [];

try{

    const saved =
        localStorage.getItem(MEMORY_KEY);

    if(saved){

        const parsed =
            JSON.parse(saved);

        if(Array.isArray(parsed)){

            memory =
                parsed.slice(-MAX_MEMORY);

        }

    }

}catch(error){

    console.warn("Memoria:",error);

}

function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                memory.slice(-MAX_MEMORY)
            )
        );

    }catch(error){

        console.warn(
            "Salvataggio memoria:",
            error
        );

    }

}

function addMemory(role,content){

    memory.push({
        role,
        content
    });

    memory =
        memory.slice(-MAX_MEMORY);

    saveMemory();

}

function updateClock(){

    const now = new Date();

    const h =
        String(now.getHours())
        .padStart(2,"0");

    const m =
        String(now.getMinutes())
        .padStart(2,"0");

    const s =
        String(now.getSeconds())
        .padStart(2,"0");

    clock.textContent =
        `${h}:${m}:${s}`;

    const d =
        String(now.getDate())
        .padStart(2,"0");

    const month =
        months[now.getMonth()];

    const year =
        now.getFullYear();

    date.textContent =
        `${d} ${month} ${year}`;

}

){

    const mesh =
        new THREE.Mesh(
            geometry,
            hologramMaterial
        );

    mesh.scale.set(
        scale[0],
        scale[1],
        scale[2]
    );

    mesh.position.set(
        position[0],
        position[1],
        position[2]
    );

    hologram.add(mesh);

    return mesh;

let targetEnergy =

let energy =
    .15;

function setState(state){

    if(state === "thinking"){
        targetEnergy = 1.7;
    }

    else if(state === "speaking"){
        targetEnergy = .8;
    }

    else if(state === "listening"){
        targetEnergy = .65;
    }

    else{
        targetEnergy = .15;
    }

}

/* =====================================================
   ANIMAZIONE OLOGRAMMA
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
        performance.now()*.001;

    energy +=
        (
            targetEnergy -
            energy
        )*.045;

    /* Movimento leggero */

    hologram.position.y =
        Math.sin(
            time*1.2
        )*.025;

    hologram.rotation.y =
        Math.sin(
            time*.25
        )*.055;

    hologram.rotation.x =
        Math.sin(
            time*.18
        )*.015;

    /* Flicker realistico */

    const flicker =
        .82 +
        Math.sin(time*17)*.04 +
        Math.sin(time*31)*.025;

    hologramMaterial.opacity =
        (.16 + energy*.08) *
        flicker;

    lineMaterial.opacity =
        (.30 + energy*.14) *
        flicker;

    particleMaterial.opacity =
        (.25 + energy*.16) *
        flicker;

    /* Core */

    const coreScale =
        1 +
        Math.sin(time*4)*
        (.06 + energy*.035);

    core.scale.set(
        coreScale,
        coreScale,
        coreScale
    );

    /* Anelli */

    rings.forEach(
        (ring,index)=>{

            ring.rotation.z +=
                .002 *
                (index%2 ? -1 : 1);

            ring.rotation.x =
                Math.PI/2 +
                Math.sin(
                    time*.6+
                    index
                )*.25;

        }
    );

    /* Scanner */

    scan.position.y =
        -2.05 +
        (
            (time*.8)%1
        )*4.0;

    if(
        scan.position.y >
        2.0
    ){
        scan.position.y =
            -2.05;
    }

    scan.material.opacity =
        .25 +
        energy*.12;

    /* Particelle */

    const pos =
        particleGeometry
            .attributes
            .position
            .array;

    for(
        let i=0;
        i<particleCount;
        i++
    ){

        const index =
            i*3;

        pos[index+1] +=
            .0015;

        if(
            pos[index+1] >
            2.2
        ){

            pos[index+1] =
                -2.2;

        }

    }

    particleGeometry
        .attributes
        .position
        .needsUpdate =
            true;

    /* Base */

    baseRing.rotation.z =
        time*.15;

    base.material.opacity =
        .10 +
        energy*.08;

    renderer.render(
        scene,
        camera
    );

}

/* =====================================================
   MARKER
===================================================== */

function escapeHtml(text){

    return String(text)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function createJarvisMarker(
    lat,
    lon,
    name
){

    if(!map){
        return;
    }

    if(currentMarker){

        currentMarker.remove();

        currentMarker = null;

    }

    const markerElement =
        document.createElement(
            "div"
        );

    markerElement.className =
        "jarvis-map-marker";

    currentMarker =
        new maplibregl.Marker({

            element:
                markerElement,

            anchor:
                "center"

        })

        .setLngLat(
            [lon,lat]
        )

        .setPopup(

            new maplibregl.Popup({
                offset:15
            })

            .setHTML(
                `<b style="color:#FFD21F">${escapeHtml(name)}</b>`
            )

        )

        .addTo(map);

    currentMarker.togglePopup();

}

/* =====================================================
   RICERCA POSIZIONE
===================================================== */

async function searchLocation(place){

    try{

        openTacticalMap();

        addMsg(
            "Ricerca posizione: " +
            place
        );

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=1" +
            "&q=" +
            encodeURIComponent(place);

        const response =
            await fetch(
                url,
                {
                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );

        if(!response.ok){
            throw new Error(
                "Ricerca posizione fallita"
            );
        }

        const results =
            await response.json();

        if(!results.length){

            addMsg(
                "Non riesco a trovare " +
                place +
                "."
            );

            return;
        }

        const result =
            results[0];

        const lat =
            parseFloat(result.lat);

        const lon =
            parseFloat(result.lon);

        if(!map){

            throw new Error(
                "Mappa non inizializzata"
            );

        }

        map.flyTo({

            center:
                [lon,lat],

            zoom:12,

            speed:.8,

            curve:1.5,

            essential:true

        });

        createJarvisMarker(
            lat,
            lon,
            place
        );

        addMsg(
            "Posizione acquisita: " +
            place
        );

    }catch(error){

        console.error(
            "MAP ERROR:",
            error
        );

        addMsg(
            "Impossibile localizzare " +
            place +
            "."
        );

    }

}

function handleMapCommand(text){

    const normalized =
        text.toLowerCase().trim();

    if(

        normalized.includes(
            "apri la mappa"
        )

        ||

        normalized.includes(
            "apri mappa"
        )

        ||

        normalized.includes(
            "mappa tattica"
        )

        ||

        normalized.includes(
            "modalità tattica"
        )

        ||

        normalized.includes(
            "modalita tattica"
        )

        ||

        normalized.includes(
            "attiva la mappa"
        )

    ){

        openTacticalMap();

        addMsg(
            "Mappa tattica attivata."
        );

        return true;
    }

    if(

        normalized.includes(
            "chiudi la mappa"
        )

        ||

        normalized.includes(
            "chiudi mappa"
        )

        ||

        normalized.includes(
            "esci dalla mappa"
        )

        ||

        normalized.includes(
            "torna alla modalità normale"
        )

        ||

        normalized.includes(
            "torna alla modalita normale"
        )

    ){

        closeTacticalMap();

        addMsg(
            "Modalità tattica disattivata."
        );

        return true;
    }

    const patterns = [
        "mostrami ",
        "mostra ",
        "vai a ",
        "portami a ",
        "localizza ",
        "cerca ",
        "visualizza "
    ];

    for(
        const pattern of patterns
    ){

        if(
            normalized.startsWith(
                pattern
            )
        ){

            const place =
                text
                    .trim()
                    .substring(
                        pattern.length
                    )
                    .trim();

            if(
                place.length > 1
            ){

                searchLocation(
                    place
                );

                return true;

            }

        }

    }

    return false;

}

            now.toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            ),

        currentDate:
            now.toLocaleDateString(
                "it-IT",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric"
                }
            ),

        dayOfWeek:
            now.toLocaleDateString(
                "it-IT",
                {
                    weekday:"long"
                }
            ),

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone

    };

}

/* =====================================================
   VOCI
===================================================== */

function loadDeviceVoices(){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    deviceVoices =
        window.speechSynthesis
            .getVoices();

    voiceSelector.innerHTML = "";

    const automatic =
        document.createElement(
            "option"
        );

    automatic.value = "";

    automatic.textContent =
        "Voce dispositivo automatica";

    voiceSelector.appendChild(
        automatic
    );

    deviceVoices.forEach(
        (voice,index)=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                String(index);

            option.textContent =
                `${voice.name} — ${voice.lang}`;

            voiceSelector.appendChild(
                option
            );

        }
    );

    const savedVoice =
        localStorage.getItem(
            "jarvis_device_voice"
        );

    if(
        savedVoice !== null &&
        Number(savedVoice) <
            deviceVoices.length
    ){

        voiceSelector.value =
            savedVoice;

        selectedDeviceVoice =
            deviceVoices[
                Number(savedVoice)
            ];

    }

}

if(
    "speechSynthesis" in window
){

    loadDeviceVoices();

    window.speechSynthesis
        .addEventListener(
            "voiceschanged",
            loadDeviceVoices
        );

}

/* =====================================================
   DEVICE SPEECH
===================================================== */

function speakDevice(text){

    return new Promise(
        resolve=>{

            if(
                !("speechSynthesis" in window)
            ){

                resolve(false);

                return;

            }

            try{

                window.speechSynthesis.cancel();

                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );

                utterance.lang =
                    "it-IT";

                utterance.rate =
                    .95;

                utterance.pitch =
                    .9;

                utterance.volume =
                    1;

                if(
                    selectedDeviceVoice
                ){

                    utterance.voice =
                        selectedDeviceVoice;

                }

                else{

                    const italianVoice =
                        deviceVoices.find(
                            voice =>
                                voice.lang
                                    .toLowerCase()
                                    .startsWith("it")
                        );

                    if(
                        italianVoice
                    ){
                        utterance.voice =
                            italianVoice;
                    }

                }

                utterance.onstart =
                    ()=>{
                        audioPlaying = true;
                        setState("speaking");
                    };

                utterance.onend =
                    ()=>{
                        audioPlaying = false;
                        setState("idle");
                        resolve(true);
                    };

                utterance.onerror =
                    ()=>{
                        audioPlaying = false;
                        setState("idle");
                        resolve(false);
                    };

                window.speechSynthesis
                    .speak(
                        utterance
                    );

            }catch(error){

                console.error(
                    "DEVICE TTS:",
                    error
                );

                resolve(false);

            }

        }
    );

}

/* =====================================================
   ELEVENLABS
===================================================== */

async function speakElevenLabs(text){

    if(!text){
        return false;
    }

    if(currentAudio){

        try{
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }catch(error){}

        currentAudio = null;
    }

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            ()=>{
                controller.abort();
            },
            30000
        );

    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:"tts",

                            text:text,

                            voiceId:
                                ELEVEN_VOICE_ID

                        }),

                    signal:
                        controller.signal

                }
            );

        if(!response.ok){
            return false;
        }

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";

        if(
            !contentType.includes("audio")
        ){
            return false;
        }

        const audioBlob =
            await response.blob();

        if(
            !audioBlob ||
            audioBlob.size === 0
        ){
            return false;
        }

        const audioUrl =
            URL.createObjectURL(
                audioBlob
            );

        const audio =
            new Audio(audioUrl);

        currentAudio =
            audio;

        audio.volume = 1;

        audio.onplay =
            ()=>{
                audioPlaying = true;
                setState("speaking");
            };

        audio.onended =
            ()=>{
                audioPlaying = false;
                setState("idle");

                URL.revokeObjectURL(
                    audioUrl
                );

                if(
                    currentAudio === audio
                ){
                    currentAudio = null;
                }
            };

        audio.onerror =
            ()=>{
                audioPlaying = false;
                setState("idle");

                URL.revokeObjectURL(
                    audioUrl
                );
            };

        await audio.play();

        return true;

    }catch(error){

        console.warn(
            "ElevenLabs TTS:",
            error
        );

        return false;

    }finally{

        clearTimeout(timeout);

    }

}

/* =====================================================
   SPEAK
===================================================== */

async function speak(text){

    if(!text){
        return;
    }

    const elevenSuccess =
        await speakElevenLabs(
            text
        );

    if(elevenSuccess){
        return;
    }

    await speakDevice(
        text
    );

}

/* =====================================================
   FULLSCREEN
===================================================== */

async function enterFullscreen(){

    try{

        if(
            !document.fullscreenElement
        ){

            await document.documentElement
                .requestFullscreen();

        }

    }catch(error){

        console.warn(
            "Fullscreen:",
            error
        );

    }

}

async function exitFullscreen(){

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

    }catch(error){

        console.warn(
            "Fullscreen:",
            error
        );

    }

}

function handleFullscreenCommand(text){

    const normalized =
        text
            .toLowerCase()
            .trim();

    if(

        normalized.includes(
            "modalità fullscreen"
        )

        ||

        normalized.includes(
            "modalita fullscreen"
        )

        ||

        normalized.includes(
            "modalità schermo intero"
        )

        ||

        normalized.includes(
            "modalita schermo intero"
        )

        ||

        normalized.includes(
            "entra in fullscreen"
        )

        ||

        normalized.includes(
            "schermo intero"
        )

    ){

        enterFullscreen();

        addMsg(
            "Modalità fullscreen attivata."
        );

        return true;

    }

    if(

        normalized.includes(
            "esci dal fullscreen"
        )

        ||

        normalized.includes(
            "esci da fullscreen"
        )

        ||

        normalized.includes(
            "esci dallo schermo intero"
        )

    ){

        exitFullscreen();

        addMsg(
            "Modalità fullscreen disattivata."
        );

        return true;

    }

    return false;

}

/* =====================================================
   PROCESS AI
===================================================== */

async function processAi(text){

    if(
        handleFullscreenCommand(text)
    ){
        return;
    }

    if(
        handleWebCommand(text)
    ){
        return;
    }

    if(
        handleMapCommand(text)
    ){
        return;
    }

    setState("thinking");

    try{

        const temporal =
            getTimeData();

        addMemory(
            "user",
            text
        );

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                ()=>{
                    controller.abort();
                },
                30000
            );

        let response;

        try{

            response =
                await fetch(
                    API,
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:text,

                                memory:
                                    memory.slice(-4),

                                currentTime:
                                    temporal.currentTime,

                                currentDate:
                                    temporal.currentDate,

                                dayOfWeek:
                                    temporal.dayOfWeek,

                                timezone:
                                    temporal.timezone

                            }),

                        signal:
                            controller.signal

                    }
                );

        }finally{

            clearTimeout(
                timeout
            );

        }

        if(!response.ok){

            const errorText =
                await response.text();

            let errorMessage =
                "HTTP " +
                response.status;

            try{

                const errorData =
                    JSON.parse(
                        errorText
                    );

                if(
                    errorData &&
                    errorData.error
                ){

                    errorMessage =
                        errorData.error;

                }

            }catch(parseError){

                if(errorText){

                    errorMessage =
                        errorText.substring(
                            0,
                            200
                        );

                }

            }

            throw new Error(
                errorMessage
            );

        }

        const data =
            await response.json();

        const reply =
            typeof data.response ===
                "string"
                ? data.response.trim()
                : "";

        if(!reply){

            throw new Error(
                "Risposta AI vuota"
            );

        }

        addMsg(
            reply
        );

        addMemory(
            "assistant",
            reply
        );

        speak(
            reply
        ).catch(
            error=>{
                console.error(
                    "TTS:",
                    error
                );
            }
        );

        setState("idle");

    }catch(error){

        console.error(
            "JARVIS ERROR:",
            error
        );

        let message =
            error.message ||
            "Errore sconosciuto";

        if(
            error.name ===
            "AbortError"
        ){

            message =
                "Il server ha impiegato troppo tempo a rispondere.";

        }

        else if(
            message ===
            "Failed to fetch"
        ){

            message =
                "Errore di connessione al server JARVIS.";

        }

        addMsg(
            "ERRORE: " +
            message
        );

        setState("idle");

    }

}

/* =====================================================
   INVIO
===================================================== */

function sendMessage(){

    const text =
        textInput.value.trim();

    if(!text){
        return;
    }

    textInput.value = "";

    addMsg(text);

    processAi(text);

}

sendBtn.addEventListener(
    "click",
    sendMessage
);

textInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);

/* =====================================================
   MICROFONO
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if(Recognition){

    recognition =
        new Recognition();

    recognition.lang =
        "it-IT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart =
        ()=>{

            listening = true;

            micBtn.classList.add(
                "active"
            );

            setState(
                "listening"
            );

        };

    recognition.onresult =
        event=>{

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();

            if(text){

                textInput.value =
                    text;

                sendMessage();

            }

        };

    recognition.onerror =
        error=>{

            console.error(
                "Microfono:",
                error
            );

            listening = false;

            micBtn.classList.remove(
                "active"
            );

            setState(
                "idle"
            );

        };

    recognition.onend =
        ()=>{

            listening = false;

            micBtn.classList.remove(
                "active"
            );

        };

    micBtn.addEventListener(
        "click",
        ()=>{

            if(listening){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }

        }
    );

}else{

    micBtn.style.opacity =
        ".3";

}
