<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   HUD
========================= */

.hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

.title {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;

    font-size: 32px;
    font-weight: 300;
    letter-spacing: 12px;

    color: #eaffff;

    text-shadow:
        0 0 10px rgba(0,234,255,.8),
        0 0 35px rgba(0,234,255,.25);
}

.status {
    margin-top: 8px;

    font-size: 8px;
    letter-spacing: 4px;

    color: rgba(255,255,255,.45);
}

.status span {
    color: #00eaff;

    text-shadow:
        0 0 12px #00eaff;
}

/* =========================
   CHAT
========================= */

#chat {
    position: fixed;

    left: 14px;
    right: 14px;
    bottom: 90px;

    max-height: 27vh;

    overflow-y: auto;

    display: flex;
    flex-direction: column;
    gap: 7px;

    z-index: 20;
}

.message {
    max-width: 82%;

    padding: 10px 14px;

    border-radius: 13px;

    font-size: 14px;
    line-height: 1.4;

    backdrop-filter: blur(15px);
}

.user {
    align-self: flex-end;

    background:
        rgba(0,220,255,.06);

    border:
        1px solid rgba(0,220,255,.25);
}

.jarvis {
    align-self: flex-start;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(0,220,255,.12);
}

/* =========================
   INPUT
========================= */

.input-area {
    position: fixed;

    left: 14px;
    right: 14px;
    bottom: 16px;

    display: flex;
    gap: 9px;

    z-index: 30;
}

input {
    flex: 1;

    height: 52px;

    padding: 0 18px;

    border-radius: 28px;

    border:
        1px solid rgba(0,234,255,.25);

    background:
        rgba(0,0,0,.9);

    color: white;

    outline: none;

    font-size: 15px;

    backdrop-filter: blur(20px);
}

input:focus {
    border-color:
        rgba(0,234,255,.7);

    box-shadow:
        0 0 25px rgba(0,234,255,.12);
}

button {
    width: 52px;
    height: 52px;

    border: none;
    border-radius: 50%;

    background: #00eaff;

    color: #001015;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(0,234,255,.6),
        0 0 40px rgba(0,234,255,.18);
}

button:active {
    transform: scale(.9);
}

@media (max-width: 500px) {

    .title {
        font-size: 28px;
        letter-spacing: 9px;
    }
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="hud">

    <div class="title">

        JARVIS

        <div class="status">
            <span>●</span> NEURAL CORE ONLINE
        </div>

    </div>

</div>

<div id="chat">

    <div class="message jarvis">
        Sistema online. Sono JARVIS.
    </div>

</div>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">➤</button>

</div>

<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =====================================================
   SCENA
===================================================== */

const canvas =
    document.getElementById("scene");

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        .1,
        100
    );

camera.position.z = 6.5;

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

/* =====================================================
   LUCI
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0x061820,
        1.4
    )
);

const cyanLight =
    new THREE.PointLight(
        0x00eaff,
        7,
        9
    );

scene.add(cyanLight);

const goldLight =
    new THREE.PointLight(
        0xffb400,
        3,
        5
    );

scene.add(goldLight);

/* =====================================================
   CERVELLO
===================================================== */

const brain =
    new THREE.Group();

scene.add(brain);

/*
    Dimensioni principali
*/

const WIDTH = 2.4;
const HEIGHT = 1.65;
const DEPTH = 1.35;

/* =====================================================
   FUNZIONE FORMA CERVELLO
===================================================== */

function brainPoint(t, side) {

    /*
       t = posizione lungo il cervello
       side = emisfero
    */

    const x =
        side *
        (
            .15 +
            .95 *
            Math.sin(t)
        );

    const y =
        .25 *
        Math.cos(t * 2) +
        .35;

    const z =
        .7 *
        Math.sin(t * 1.5);

    return new THREE.Vector3(
        x,
        y,
        z
    );
}

/* =====================================================
   FILAMENTI CEREBRALI
===================================================== */

const filamentGroup =
    new THREE.Group();

brain.add(
    filamentGroup
);

const filamentMaterials = [
    new THREE.LineBasicMaterial({
        color: 0x00eaff,
        transparent: true,
        opacity: .65,
        blending: THREE.AdditiveBlending
    }),

    new THREE.LineBasicMaterial({
        color: 0x52f3ff,
        transparent: true,
        opacity: .32,
        blending: THREE.AdditiveBlending
    })
];

/*
    Creiamo molte "circonvoluzioni"
*/

for (
    let row = 0;
    row < 30;
    row++
) {

    const points = [];

    const side =
        row % 2 === 0
        ? 1
        : -1;

    const offset =
        (row / 30) * Math.PI * 2;

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const t =
            (i / 69) *
            Math.PI *
            2;

        const x =
            side *
            (
                .25 +
                .72 *
                Math.cos(t)
            );

        const y =
            .15 +
            .55 *
            Math.sin(t * 2 + offset)
            +
            (
                row / 30 -
                .5
            ) *
            .45;

        const z =
            .62 *
            Math.sin(
                t +
                offset
            );

        points.push(
            new THREE.Vector3(
                x,
                y,
                z
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    const line =
        new THREE.Line(
            geometry,
            filamentMaterials[
                row % 2
            ]
        );

    filamentGroup.add(
        line
    );
}

/* =====================================================
   NODI NEURALI
===================================================== */

const nodes = [];

for (
    let i = 0;
    i < 260;
    i++
) {

    const side =
        Math.random() > .5
        ? 1
        : -1;

    const x =
        side *
        (
            .15 +
            Math.random() *
            .95
        );

    const y =
        (
            Math.random() -
            .5
        ) *
        1.25;

    const z =
        (
            Math.random() -
            .5
        ) *
        1.25;

    /*
       Eliminiamo alcuni punti
       fuori dalla forma.
    */

    const normalized =
        (
            x * x
        ) / 1.1 +
        (
            y * y
        ) / 1.0 +
        (
            z * z
        ) / 1.0;

    if (
        normalized <
        1.35
    ) {

        nodes.push(
            new THREE.Vector3(
                x,
                y,
                z
            )
        );
    }
}

/* =====================================================
   PUNTI
===================================================== */

const nodePositions =
    new Float32Array(
        nodes.length * 3
    );

for (
    let i = 0;
    i < nodes.length;
    i++
) {

    nodePositions[
        i * 3
    ] =
        nodes[i].x;

    nodePositions[
        i * 3 + 1
    ] =
        nodes[i].y;

    nodePositions[
        i * 3 + 2
    ] =
        nodes[i].z;
}

const nodeGeometry =
    new THREE.BufferGeometry();

nodeGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        nodePositions,
        3
    )
);

const nodeMaterial =
    new THREE.PointsMaterial({

        color: 0x9dfaff,

        size: .025,

        transparent: true,

        opacity: .95,

        blending:
            THREE.AdditiveBlending
    });

const nodePoints =
    new THREE.Points(
        nodeGeometry,
        nodeMaterial
    );

brain.add(
    nodePoints
);

/* =====================================================
   CONNESSIONI
===================================================== */

const connections = [];

for (
    let i = 0;
    i < nodes.length;
    i++
) {

    for (
        let j = i + 1;
        j < nodes.length;
        j++
    ) {

        const distance =
            nodes[i].distanceTo(
                nodes[j]
            );

        if (
            distance <
            .28
        ) {

            connections.push(
                nodes[i].x,
                nodes[i].y,
                nodes[i].z,

                nodes[j].x,
                nodes[j].y,
                nodes[j].z
            );
        }
    }
}

const connectionGeometry =
    new THREE.BufferGeometry();

connectionGeometry.setAttribute(
    "position",

    new THREE.Float32BufferAttribute(
        connections,
        3
    )
);

const connectionMaterial =
    new THREE.LineBasicMaterial({

        color: 0x00dff5,

        transparent: true,

        opacity: .13,

        blending:
            THREE.AdditiveBlending
    });

const connectionMesh =
    new THREE.LineSegments(
        connectionGeometry,
        connectionMaterial
    );

brain.add(
    connectionMesh
);

/* =====================================================
   DIVISIONE TRA EMISFERI
===================================================== */

const divisionGeometry =
    new THREE.BoxGeometry(
        .025,
        1.3,
        1.1
    );

const divisionMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x00eaff,
        transparent: true,
        opacity: .15,
        blending: THREE.AdditiveBlending
    });

const division =
    new THREE.Mesh(
        divisionGeometry,
        divisionMaterial
    );

brain.add(
    division
);

/* =====================================================
   NUCLEO
===================================================== */

const coreGeometry =
    new THREE.SphereGeometry(
        .20,
        32,
        32
    );

const coreMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

const coreLight =
    new THREE.Mesh(
        coreGeometry,
        coreMaterial
    );

brain.add(
    coreLight
);

/* =====================================================
   ANELLI
===================================================== */

const rings = [];

function createRing(
    radius,
    rotation,
    speed
) {

    const geometry =
        new THREE.TorusGeometry(
            radius,
            .004,
            8,
            260
        );

    const material =
        new THREE.MeshBasicMaterial({

            color: 0x00eaff,

            transparent: true,

            opacity: .28,

            blending:
                THREE.AdditiveBlending
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.set(
        rotation.x,
        rotation.y,
        rotation.z
    );

    ring.userData.speed =
        speed;

    brain.add(
        ring
    );

    rings.push(
        ring
    );
}

createRing(
    1.45,
    {x: .9, y: .2, z: .2},
    .00035
);

createRing(
    1.65,
    {x: 1.3, y: -.4, z: .8},
    -.00025
);

createRing(
    1.85,
    {x: .3, y: 1.1, z: -.5},
    .00018
);

/* =====================================================
   PARTICELLE
===================================================== */

const particleCount = 300;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const radius =
        1.4 +
        Math.random() * 2.5;

    const angle =
        Math.random() *
        Math.PI * 2;

    particlePositions[
        i * 3
    ] =
        Math.cos(angle) *
        radius;

    particlePositions[
        i * 3 + 1
    ] =
        (
            Math.random() -
            .5
        ) * 2.7;

    particlePositions[
        i * 3 + 2
    ] =
        Math.sin(angle) *
        radius;
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({

        color: 0x42eaff,

        size: .012,

        transparent: true,

        opacity: .25,

        blending:
            THREE.AdditiveBlending
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

brain.add(
    particles
);

/* =====================================================
   ANIMAZIONE
===================================================== */

let thinking = false;

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();

    /* movimento cervello */

    brain.rotation.y =
        Math.sin(
            t * .08
        ) * .10;

    brain.rotation.x =
        Math.sin(
            t * .11
        ) * .025;

    /* filamenti */

    filamentGroup.rotation.y =
        t * .012;

    /* rete */

    nodePoints.rotation.y =
        -t * .018;

    connectionMesh.rotation.y =
        -t * .018;

    /* anelli */

    rings.forEach(
        ring => {

            ring.rotation.z +=
                ring.userData.speed *
                (
                    thinking
                    ? 1.5
                    : 1
                );

            ring.rotation.x +=
                ring.userData.speed *
                .03;
        }
    );

    /* particelle */

    particles.rotation.y =
        t * .008;

    /* nucleo */

    coreLight.scale.setScalar(
        thinking
        ? 1.25 +
          Math.sin(t * 7) * .08
        : 1 +
          Math.sin(t * 2) * .03
    );

    /* luce */

    cyanLight.intensity =
        thinking
        ? 11
        : 6 +
          Math.sin(t * 1.5) * .6;

    goldLight.intensity =
        thinking
        ? 5
        : 2.5;

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =====================================================
   CHAT
===================================================== */

window.sendMessage =
async function() {

    const input =
        document.getElementById(
            "input"
        );

    const chat =
        document.getElementById(
            "chat"
        );

    const text =
        input.value.trim();

    if (!text)
        return;

    const userMessage =
        document.createElement(
            "div"
        );

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(
        userMessage
    );

    input.value = "";

    const jarvisMessage =
        document.createElement(
            "div"
        );

    jarvisMessage.className =
        "message jarvis";

    jarvisMessage.textContent =
        "Elaborazione...";

    chat.appendChild(
        jarvisMessage
    );

    thinking = true;

    chat.scrollTop =
        chat.scrollHeight;

    try {

        const response =
            await fetch(
                "https://iao-ai-v3.oceano-masoud.workers.dev/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        jarvisMessage.textContent =
            data.reply ||
            "Non ho ricevuto una risposta.";

    } catch (error) {

        console.error(error);

        jarvisMessage.textContent =
            "Errore di collegamento.";
    }

    thinking = false;

    chat.scrollTop =
        chat.scrollHeight;
};

</script>

</body>
</html>
