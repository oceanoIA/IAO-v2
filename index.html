<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS HUD System</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020813;
    color: #00f0ff;
    font-family: 'Consolas', 'Courier New', monospace;
}

/* GRIGLIA DI SFONDO HUD */
.bg-grid {
    position: fixed;
    inset: 0;
    background-image: 
        radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: 0;
    pointer-events: none;
}

#hud {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* CORNICI ED ELEMENTI TATTICI AI LATI */
.hud-corner {
    position: fixed;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0, 240, 255, 0.5);
    z-index: 5;
    pointer-events: none;
    text-transform: uppercase;
}

.top-left { top: 20px; left: 20px; border-left: 2px solid #00f0ff; padding-left: 8px; }
.top-right { top: 20px; right: 20px; border-right: 2px solid #00f0ff; padding-right: 8px; text-align: right; }
.bottom-left { bottom: 85px; left: 20px; }

/* TITOLO E STATO */
.title {
    position: fixed;
    top: 25px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 14px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0,240,255,0.8), 0 0 30px rgba(0,240,255,0.4);
    user-select: none;
}

.status {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(0,240,255,0.6);
}

.status b {
    color: #00f0ff;
    text-shadow: 0 0 8px #00f0ff;
}

/* CHAT STILE TERMINALE TATTICO */
#chat {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 85px;
    max-height: 30vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
    scrollbar-width: none;
}

.message {
    max-width: 75%;
    padding: 10px 16px;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 1px;
    backdrop-filter: blur(8px);
    word-break: break-word;
}

.user {
    align-self: flex-end;
    background: rgba(0, 240, 255, 0.08);
    border: 1px solid rgba(0, 240, 255, 0.5);
    border-radius: 10px 0px 10px 10px;
    color: #ffffff;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
}

.jarvis {
    align-self: flex-start;
    background: rgba(2, 20, 40, 0.6);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-left: 3px solid #00f0ff;
    border-radius: 0px 10px 10px 10px;
    color: #d0f8ff;
}

/* CAMPO DI INPUT */
.input-area {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 20px;
    display: flex;
    gap: 10px;
    z-index: 20;
}

input {
    flex: 1;
    height: 48px;
    padding: 0 20px;
    border-radius: 4px;
    outline: none;
    border: 1px solid rgba(0, 240, 255, 0.4);
    background: rgba(2, 12, 27, 0.85);
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

input:focus {
    border-color: #00f0ff;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
}

button {
    width: 60px;
    height: 48px;
    border: 1px solid #00f0ff;
    border-radius: 4px;
    background: rgba(0, 240, 255, 0.15);
    color: #00f0ff;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
}

button:hover:not(:disabled) {
    background: #00f0ff;
    color: #020813;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
}

button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}
</style>
</head>

<body>

<div class="bg-grid"></div>

<!-- ELEMENTI GRAFICI CORNICE HUD -->
<div class="hud-corner top-left">
    SYS.DIAG // V3.08<br>
    CORE: ONLINE
</div>
<div class="hud-corner top-right">
    LOC: STARK TOWER<br>
    SEC: ENCRYPTED
</div>
<div class="hud-corner bottom-left">
    AUDIO: ACTIVE<br>
    FREQ: 432.00 MHz
</div>

<div class="title">
    J.A.R.V.I.S.
    <div class="status">
        <b>●</b> MARK VII PROTOCOL ACTIVE
    </div>
</div>

<canvas id="hud"></canvas>

<div id="chat">
    <div class="message jarvis">
        Al tuo servizio, Signore. Sistemi operativi.
    </div>
</div>

<div class="input-area">
    <input id="input" type="text" placeholder="Inserisci un comando..." autocomplete="off">
    <button id="send">EXEC</button>
</div>

<script>
const canvas = document.getElementById("hud");
const ctx = canvas.getContext("2d");

let width, height, dpr, centerX, centerY;
let rotationAngle = 0;
let thinking = false;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = width / 2;
    centerY = height / 2 - 20;
}

window.addEventListener("resize", resize);

/* DISEGNO ANELLO SEGMENTATO (ARC REACTOR STYLE) */
function drawSegmentedRing(radius, segments, widthAngle, speed, color, lineWidth) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(rotationAngle * speed);

    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;

    const step = (Math.PI * 2) / segments;
    for (let i = 0; i < segments; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, i * step, i * step + widthAngle);
        ctx.stroke();
    }
    ctx.restore();
}

/* DISEGNO TACCHE DIREZIONALI */
function drawTicks(radius, count, length, color) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(-rotationAngle * 0.2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;

    for (let i = 0; i < count; i++) {
        const angle = (i * Math.PI * 2) / count;
        const x1 = Math.cos(angle) * radius;
        const y1 = Math.sin(angle) * radius;
        const x2 = Math.cos(angle) * (radius - length);
        const y2 = Math.sin(angle) * (radius - length);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
    ctx.restore();
}

function animate() {
    requestAnimationFrame(animate);
    
    const speedMult = thinking ? 2.5 : 1.0;
    rotationAngle += 0.005 * speedMult;

    ctx.clearRect(0, 0, width, height);

    const baseRadius = Math.min(width, height) * 0.22;

    // Glow Centrale (Core Glow)
    const glowRadius = thinking ? baseRadius * 0.8 : baseRadius * 0.5;
    const coreGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius);
    coreGlow.addColorStop(0, "rgba(255, 255, 255, 0.9)");
    coreGlow.addColorStop(0.3, "rgba(0, 240, 255, 0.5)");
    coreGlow.addColorStop(1, "rgba(0, 240, 255, 0)");

    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(centerX, centerY, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // Anelli Concentrici Esterni
    drawSegmentedRing(baseRadius * 1.4, 12, 0.2, 0.5, "rgba(0, 240, 255, 0.3)", 1);
    drawSegmentedRing(baseRadius * 1.25, 4, Math.PI / 3, -0.8, "rgba(0, 240, 255, 0.6)", 2);
    
    // Tacche Tattiche
    drawTicks(baseRadius * 1.1, 36, 8, "rgba(0, 240, 255, 0.4)");

    // Anello Centrale Reattivo
    const innerColor = thinking ? "#ffffff" : "rgba(0, 240, 255, 0.8)";
    drawSegmentedRing(baseRadius * 0.85, 8, 0.5, 1.5, innerColor, 3);
    drawSegmentedRing(baseRadius * 0.6, 3, Math.PI / 2, -1.2, "rgba(0, 240, 255, 0.7)", 1.5);
    
    // Cerchio Esterno Sottile
    ctx.beginPath();
    ctx.arc(centerX, centerY, baseRadius * 1.5, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0, 240, 255, 0.15)";
    ctx.lineWidth = 1;
    ctx.stroke();
}

resize();
animate();

/* GESTIONE CHAT */
const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

send.addEventListener("click", sendMessage);
input.addEventListener("keydown", event => {
    if (event.key === "Enter") sendMessage();
});

async function sendMessage() {
    const text = input.value.trim();
    if (!text || input.disabled) return;

    input.disabled = true;
    send.disabled = true;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chat.appendChild(userMsg);

    input.value = "";

    const jarvisMsg = document.createElement("div");
    jarvisMsg.className = "message jarvis";
    jarvisMsg.textContent = "Elaborazione dati in corso...";
    chat.appendChild(jarvisMsg);

    thinking = true;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://iao-ai-v3.oceano-masoud.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Errore API");

        const data = await response.json();
        jarvisMsg.textContent = data.reply || "Nessun dato ricevuto.";
    } catch (error) {
        jarvisMsg.textContent = "Sistemi offline. Impossibile stabilire una connessione.";
    } finally {
        setTimeout(() => { thinking = false; }, 400);
        input.disabled = false;
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}
</script>

</body>
</html>
