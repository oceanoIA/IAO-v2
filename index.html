<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS — Neural Interface</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #ffd000;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* =====================================================
   CANVAS
===================================================== */

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}


/* =====================================================
   HUD
===================================================== */

.hud {
    position: fixed;

    z-index: 5;

    font-family: monospace;

    font-size: 10px;

    letter-spacing: 2px;

    line-height: 1.8;

    color: rgba(255, 210, 0, .55);

    pointer-events: none;
}

.hud-left {
    top: 24px;
    left: 24px;

    border-left:
        2px solid
        rgba(255, 200, 0, .7);

    padding-left: 10px;
}

.hud-right {
    top: 24px;
    right: 24px;

    text-align: right;

    border-right:
        2px solid
        rgba(255, 200, 0, .7);

    padding-right: 10px;
}


/* =====================================================
   TITOLO
===================================================== */

.title {

    position: fixed;

    top: 22px;

    left: 0;
    right: 0;

    z-index: 6;

    text-align: center;

    pointer-events: none;
}

.title h1 {

    margin: 0;

    color: white;

    font-size: 24px;

    font-weight: 300;

    letter-spacing: 11px;

    text-shadow:
        0 0 8px rgba(255, 210, 0, .9),
        0 0 20px rgba(255, 170, 0, .6),
        0 0 40px rgba(255, 120, 0, .3);
}

.status {

    margin-top: 6px;

    font-family: monospace;

    font-size: 9px;

    letter-spacing: 3px;

    color:
        rgba(255, 210, 0, .7);
}

.status span {

    color: #ffd000;

    text-shadow:
        0 0 5px #ffd000,
        0 0 15px #ffae00;
}


/* =====================================================
   CHAT
===================================================== */

#chat {

    position: fixed;

    left: 50%;

    bottom: 92px;

    transform:
        translateX(-50%);

    width: 100%;

    max-width: 700px;

    max-height: 27vh;

    padding:
        0 20px;

    display: flex;

    flex-direction: column;

    gap: 10px;

    overflow-y: auto;

    scrollbar-width: none;

    z-index: 10;
}

#chat::-webkit-scrollbar {
    display: none;
}

.message {

    max-width: 80%;

    padding:
        11px 16px;

    border-radius: 4px;

    font-size: 14px;

    line-height: 1.5;

    backdrop-filter:
        blur(15px);

    word-break: break-word;
}

.user {

    align-self: flex-end;

    color: white;

    background:
        rgba(255, 200, 0, .07);

    border:
        1px solid
        rgba(255, 200, 0, .3);

    border-right:
        3px solid #ffd000;
}

.jarvis {

    align-self: flex-start;

    color:
        #ffe9a0;

    background:
        rgba(15, 10, 0, .78);

    border:
        1px solid
        rgba(255, 190, 0, .2);

    border-left:
        3px solid #ffd000;
}


/* =====================================================
   INPUT
===================================================== */

.input-container {

    position: fixed;

    left: 50%;

    bottom: 24px;

    transform:
        translateX(-50%);

    width: 100%;

    max-width: 700px;

    padding:
        0 20px;

    z-index: 20;
}

.input-box {

    display: flex;

    gap: 9px;

    padding: 4px;

    background:
        rgba(10, 7, 0, .9);

    border:
        1px solid
        rgba(255, 195, 0, .4);

    border-radius: 6px;

    backdrop-filter:
        blur(18px);

    transition:
        .3s;
}

.input-box:focus-within {

    border-color:
        rgba(255, 215, 0, .9);

    box-shadow:
        0 0 15px
        rgba(255, 200, 0, .2),

        0 0 35px
        rgba(255, 160, 0, .1);
}

input {

    flex: 1;

    height: 44px;

    padding:
        0 15px;

    background:
        transparent;

    border: none;

    outline: none;

    color: white;

    font-size: 14px;
}

input::placeholder {

    color:
        rgba(255, 220, 130, .35);
}

button {

    width: 78px;

    height: 44px;

    border-radius: 4px;

    border:
        1px solid
        rgba(255, 200, 0, .55);

    background:
        rgba(255, 190, 0, .13);

    color: #ffd000;

    font-family: monospace;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    transition: .2s;
}

button:hover:not(:disabled) {

    background:
        #ffd000;

    color: #000;

    box-shadow:
        0 0 12px #ffd000,
        0 0 30px
        rgba(255, 180, 0, .5);
}

button:disabled {

    opacity: .3;

    cursor: not-allowed;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .hud {
        display: none;
    }

    .title h1 {

        font-size: 19px;

        letter-spacing: 7px;
    }

    .message {

        max-width: 90%;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HUD
===================================================== -->

<div class="hud hud-left">

    JARVIS_CORE // V4.0<br>

    NEURAL SYSTEM: ONLINE

</div>


<div class="hud hud-right">

    NETWORK: ACTIVE<br>

    NODES:
    <span id="nodeCount">200</span>

</div>


<!-- =====================================================
     TITOLO
===================================================== -->

<div class="title">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status">

        <span>●</span>
        NEURAL MATRIX ONLINE

    </div>

</div>


<!-- =====================================================
     RETE NEURALE
===================================================== -->

<canvas id="canvas"></canvas>


<!-- =====================================================
     CHAT
===================================================== -->

<div id="chat">

    <div class="message jarvis">

        JARVIS online.
        Matrice neurale inizializzata.
        In attesa di istruzioni.

    </div>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-container">

    <div class="input-box">

        <input
            id="input"
            type="text"
            placeholder="Comunica con JARVIS..."
            autocomplete="off"
        >

        <button id="send">
            EXEC
        </button>

    </div>

</div>


<script>

/* =====================================================
   JARVIS NEURAL ENGINE
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const nodeCount =
    document.getElementById("nodeCount");


/* =====================================================
   VARIABILI
===================================================== */

let width;
let height;

let centerX;
let centerY;

let dpr;

let radius;

let thinking = false;

let nodes = [];

let pulses = [];

let rotationY = 0;

let rotationX = 0;


/* =====================================================
   CONFIGURAZIONE
===================================================== */

const NODE_TOTAL = 200;

const MAX_CONNECTION =
    95;


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    centerX =
        width / 2;

    centerY =
        height / 2 - 20;


    radius =
        Math.min(
            width,
            height
        ) * .23;


    createNodes();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   CREAZIONE NODI
===================================================== */

function createNodes() {

    nodes = [];

    for (
        let i = 0;
        i < NODE_TOTAL;
        i++
    ) {

        const theta =
            Math.random() *
            Math.PI * 2;


        const phi =
            Math.acos(
                2 *
                Math.random()
                - 1
            );


        const r =
            radius *
            (
                .70 +
                Math.random() *
                .55
            );


        nodes.push({

            theta: theta,

            phi: phi,

            r: r,

            speed:
                .002 +
                Math.random() *
                .005,

            direction:
                Math.random() < .5
                    ? -1
                    : 1,

            size:
                .7 +
                Math.random() *
                1.7,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }


    nodeCount.textContent =
        NODE_TOTAL;
}


/* =====================================================
   IMPULSO
===================================================== */

function createPulse() {

    if (
        nodes.length === 0
    ) {
        return;
    }


    const node =
        nodes[
            Math.floor(
                Math.random() *
                nodes.length
            )
        ];


    pulses.push({

        angle:
            node.theta,

        progress: 0,

        speed:
            .012 +
            Math.random() *
            .02

    });

}


/* =====================================================
   DISEGNO
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now() /
        1000;


    const speed =
        thinking
            ? 3.2
            : 1;


    /* TRAIL */

    ctx.fillStyle =
        "rgba(0,0,0,.24)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* ROTAZIONE */

    rotationY +=
        .004 *
        speed;

    rotationX +=
        .001 *
        speed;


    /* =================================================
       GLOW CENTRALE
    ================================================= */

    const glowRadius =
        radius *
        (
            thinking
                ? 1.7
                : 1.25
        );


    const gradient =
        ctx.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            glowRadius
        );


    gradient.addColorStop(
        0,
        thinking
            ? "rgba(255,250,190,.95)"
            : "rgba(255,235,150,.65)"
    );


    gradient.addColorStop(
        .18,
        "rgba(255,200,0,.38)"
    );


    gradient.addColorStop(
        .5,
        "rgba(255,150,0,.08)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        glowRadius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* =================================================
       PROIEZIONE 3D
    ================================================= */

    const projected =
        [];


    nodes.forEach(
        n => {

            n.theta +=
                n.speed *
                n.direction *
                speed;


            n.phi +=
                Math.sin(
                    time +
                    n.phase
                ) *
                .0007 *
                speed;


            let x =
                n.r *
                Math.sin(n.phi) *
                Math.cos(n.theta);


            let y =
                n.r *
                Math.cos(n.phi);


            let z =
                n.r *
                Math.sin(n.phi) *
                Math.sin(n.theta);


            /* ROTAZIONE Y */

            const cosY =
                Math.cos(
                    rotationY
                );

            const sinY =
                Math.sin(
                    rotationY
                );


            const rx =
                x * cosY +
                z * sinY;


            const rz =
                -x * sinY +
                z * cosY;


            /* ROTAZIONE X */

            const cosX =
                Math.cos(
                    rotationX
                );

            const sinX =
                Math.sin(
                    rotationX
                );


            const ry =
                y * cosX -
                rz * sinX;


            const finalZ =
                y * sinX +
                rz * cosX;


            /* PROSPETTIVA */

            const perspective =
                420 /
                (
                    420 +
                    finalZ
                );


            const px =
                centerX +
                rx *
                perspective;


            const py =
                centerY +
                ry *
                perspective;


            const alpha =
                Math.max(
                    .08,
                    Math.min(
                        1,
                        (
                            finalZ +
                            radius
                        ) /
                        (
                            radius * 2
                        )
                    )
                );


            projected.push({

                x: px,

                y: py,

                z: finalZ,

                alpha: alpha,

                size:
                    n.size *
                    perspective,

                pulse:
                    (
                        Math.sin(
                            time * 5 +
                            n.phase
                        ) + 1
                    ) / 2

            });

        }
    );


    /* PROFONDITÀ */

    projected.sort(
        (a, b) =>
            a.z - b.z
    );


    /* =================================================
       CONNESSIONI
    ================================================= */

    for (
        let i = 0;
        i < projected.length;
        i++
    ) {

        const a =
            projected[i];


        for (
            let j = i + 1;
            j < projected.length;
            j++
        ) {

            const b =
                projected[j];


            const dx =
                a.x - b.x;


            const dy =
                a.y - b.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                MAX_CONNECTION
            ) {

                const opacity =
                    (
                        1 -
                        distance /
                        MAX_CONNECTION
                    ) *
                    .30 *
                    a.alpha;


                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );


                ctx.strokeStyle =
                    `rgba(
                        255,
                        195,
                        20,
                        ${opacity}
                    )`;


                ctx.lineWidth =
                    thinking
                        ? 1
                        : .65;


                ctx.stroke();

            }

        }

    }


    /* =================================================
       IMPULSI
    ================================================= */

    if (
        Math.random() <
        (
            thinking
                ? .16
                : .025
        )
    ) {

        createPulse();

    }


    pulses.forEach(
        pulse => {

            pulse.progress +=
                pulse.speed *
                speed;

        }
    );


    pulses =
        pulses.filter(
            pulse =>
                pulse.progress < 1
        );


    /* =================================================
       NODI
    ================================================= */

    projected.forEach(
        n => {

            const glow =
                ctx.createRadialGradient(
                    n.x,
                    n.y,
                    0,
                    n.x,
                    n.y,
                    n.size * 5
                );


            glow.addColorStop(
                0,
                `rgba(
                    255,
                    215,
                    70,
                    ${.45 * n.alpha}
                )`
            );


            glow.addColorStop(
                1,
                "rgba(255,150,0,0)"
            );


            ctx.fillStyle =
                glow;


            ctx.beginPath();

            ctx.arc(
                n.x,
                n.y,
                n.size * 5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* PUNTO */

            const brightness =
                .65 +
                n.pulse *
                .35;


            ctx.fillStyle =
                `rgba(
                    255,
                    245,
                    180,
                    ${brightness * n.alpha}
                )`;


            ctx.beginPath();

            ctx.arc(
                n.x,
                n.y,
                n.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    /* =================================================
       IMPULSI LUMINOSI
    ================================================= */

    pulses.forEach(
        pulse => {

            const angle =
                pulse.angle +
                pulse.progress *
                Math.PI *
                4;


            const distance =
                radius *
                (
                    .2 +
                    pulse.progress *
                    .8
                );


            const x =
                centerX +
                Math.cos(angle) *
                distance;


            const y =
                centerY +
                Math.sin(
                    angle * 1.7
                ) *
                distance *
                .5;


            ctx.shadowBlur =
                18;


            ctx.shadowColor =
                "#ffd000";


            ctx.fillStyle =
                `rgba(
                    255,
                    245,
                    160,
                    ${1 - pulse.progress}
                )`;


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                thinking
                    ? 2.8
                    : 2,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.shadowBlur = 0;

        }
    );

}


/* =====================================================
   AVVIO
====================================
