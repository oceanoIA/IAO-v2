<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport"

<title>J.A.R.V.I.S.</title><link

/* =====================================================
J.A.R.V.I.S. — HOLOGRAPHIC GOLD INTERFACE
===================================================== */

:root{

    --jarvis-main:#FFB300;
    --jarvis-bright:#FFF200;
    --jarvis-light:#FFF6A0;
    --jarvis-dark:#4D3500;

    --jarvis-glow:
        rgba(255,179,0,.65);

    --jarvis-glow-light:
        rgba(255,242,0,.35);
}


/* =====================================================
BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#050401;

    font-family:Arial,sans-serif;
}

body{

    background:

        radial-gradient(
            circle at center,
            #211900 0%,
            #0B0902 42%,
            #020201 72%,
            #000000 100%
        );

}


/* =====================================================
THREE.JS
===================================================== */

#webgl-container{

    position:fixed;

    inset:0;

    z-index:1;

}


/* =====================================================
VIGNETTE
===================================================== */

.vignette{

    position:fixed;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:

        radial-gradient(
            circle at center,
            transparent 27%,
            rgba(0,0,0,.18) 58%,
            rgba(0,0,0,.75) 100%
        );

}


/* =====================================================
TITOLO
===================================================== */

.jarvis-title{

    position:fixed;

    top:2.4%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:30;

    color:
        rgba(255,248,205,.94);

    font-size:
        clamp(20px,2.8vw,31px);

    font-weight:300;

    letter-spacing:
        clamp(5px,1vw,8px);

    white-space:nowrap;

    text-shadow:

        0 0 10px
        rgba(255,190,0,.65),

        0 0 25px
        rgba(255,210,0,.3),

        0 0 45px
        rgba(255,170,0,.15);

    pointer-events:none;
}


/* =====================================================
DATA / ORA
===================================================== */

.datetime{

    position:fixed;

    top:18px;

    right:24px;

    z-index:30;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:3px;

    font-family:monospace;

    pointer-events:none;
}

.time{

    color:
        rgba(255,220,80,.88);

    font-size:11px;

    letter-spacing:2px;

    text-shadow:
        0 0 8px
        rgba(255,190,0,.65);
}

.date{

    color:
        rgba(255,210,80,.55);

    font-size:8px;

    letter-spacing:1px;
}


/* =====================================================
CHAT
===================================================== */

#chat{

    position:fixed;

    left:50%;

    bottom:92px;

    transform:
        translateX(-50%);

    z-index:40;

    width:
        min(620px,88%);

    text-align:center;

    pointer-events:none;
}

.msg{

    display:inline-block;

    max-width:100%;

    padding:10px 18px;

    border:
        1px solid
        rgba(255,190,0,.4);

    border-radius:24px;

    background:
        rgba(24,16,0,.52);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    color:
        rgba(255,250,225,.95);

    font-size:12px;

    line-height:1.45;

    white-space:pre-wrap;

    box-shadow:

        0 0 18px
        rgba(255,180,0,.08);
}


/* =====================================================
COMMAND BAR
===================================================== */

.command-wrapper{

    position:fixed;

    left:50%;

    bottom:23px;

    transform:
        translateX(-50%);

    z-index:50;

    width:
        min(650px,90%);

    display:flex;

    align-items:center;

    padding:
        6px 7px 6px 20px;

    border:
        1px solid
        rgba(255,185,0,.5);

    border-radius:40px;

    background:
        rgba(20,13,0,.65);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 0 30px
        rgba(255,170,0,.12),

        inset 0 0 20px
        rgba(255,190,0,.025);
}

.command-wrapper:focus-within{

    border-color:
        var(--jarvis-bright);

    box-shadow:

        0 0 25px
        rgba(255,190,0,.3),

        0 0 55px
        rgba(255,220,0,.1);
}


/* =====================================================
INPUT
===================================================== */

#textInput{

    flex:1;

    min-width:0;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:12px 5px;
}

#textInput::placeholder{

    color:
        rgba(255,220,140,.38);
}


/* =====================================================
MICROFONO
===================================================== */

#micBtn{

    width:34px;

    height:34px;

    margin-right:7px;

    border:none;

    background:transparent;

    color:
        rgba(255,220,130,.85);

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;
}

.mic-icon{

    width:8px;

    height:14px;

    border:
        1.3px solid
        currentColor;

    border-radius:60px;

    position:relative;
}

.mic-icon::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-6px;

    width:12px;

    height:7px;

    transform:
        translateX(-50%);

    border:
        1.3px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 8px 8px;
}

#micBtn:hover{

    color:
        var(--jarvis-bright);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,220,0,.8)
        );
}

#micBtn.active{

    color:
        #FFF8B0;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,190,0,1)
        );
}


/* =====================================================
INVIA
===================================================== */

#sendBtn{

    height:39px;

    padding:0 17px;

    border:
        1px solid
        rgba(255,185,0,.5);

    border-radius:22px;

    background:
        rgba(255,180,0,.08);

    color:
        rgba(255,230,160,.9);

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.2s;
}

#sendBtn:hover{

    color:white;

    border-color:
        var(--jarvis-bright);

    background:
        rgba(255,190,0,.18);

    box-shadow:
        0 0 15px
        rgba(255,190,0,.3);
}


/* =====================================================
VOCE
===================================================== */

#voiceBtn{

    position:fixed;

    right:22px;

    bottom:24px;

    z-index:60;

    height:39px;

    padding:0 15px;

    border:
        1px solid
        rgba(255,185,0,.5);

    border-radius:22px;

    background:
        rgba(20,13,0,.86);

    color:
        rgba(255,225,150,.85);

    font-size:10px;

    letter-spacing:1.5px;

    cursor:pointer;

    backdrop-filter:
        blur(12px);

    transition:.2s;
}

#voiceBtn:hover{

    color:white;

    border-color:
        var(--jarvis-bright);

    box-shadow:
        0 0 15px
        rgba(255,190,0,.45);
}


/* =====================================================
VOICE PANEL
===================================================== */

#voicePanel{

    position:fixed;

    right:22px;

    bottom:72px;

    z-index:100;

    width:
        min(330px,calc(100% - 30px));

    padding:15px;

    display:none;

    border:
        1px solid
        rgba(255,185,0,.45);

    border-radius:18px;

    background:
        rgba(15,10,0,.97);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 0 35px
        rgba(255,180,0,.25);
}

#voicePanel.active{

    display:block;
}

.voice-title{

    color:
        rgba(255,240,190,.95);

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:10px;
}

#voiceSelector{

    width:100%;

    padding:11px;

    border:
        1px solid
        rgba(255,185,0,.35);

    border-radius:10px;

    outline:none;

    background:
        rgba(25,17,0,.95);

    color:
        rgba(255,235,180,.9);

    font-size:11px;
}

#voiceTest{

    width:100%;

    margin-top:10px;

    padding:9px;

    border:
        1px solid
        rgba(255,185,0,.35);

    border-radius:10px;

    background:
        rgba(255,180,0,.07);

    color:
        rgba(255,225,160,.8);

    cursor:pointer;

    font-size:10px;

    letter-spacing:1px;
}

#voiceTest:hover{

    border-color:
        var(--jarvis-bright);

    color:white;

    box-shadow:
        0 0 12px
        rgba(255,190,0,.25);
}


/* =====================================================
MAPPA TATTICA
===================================================== */

#tacticalMap{

    position:fixed;

    inset:0;

    z-index:20;

    display:none;

    background:

        radial-gradient(
            circle at center,
            #211900 0%,
            #080602 65%,
            #000000 100%
        );
}

#tacticalMap.active{

    display:block;

    animation:
        mapIn .45s ease;
}

@keyframes mapIn{

    from{

        opacity:0;

        transform:
            scale(1.015);
    }

    to{

        opacity:1;

        transform:
            scale(1);
    }
}


/* =====================================================
HEADER MAPPA
===================================================== */

.map-header{

    position:absolute;

    top:2.4%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:600;

    color:
        rgba(255,240,190,.95);

    font-family:Arial,sans-serif;

    font-size:
        clamp(24px,4vw,42px);

    font-weight:300;

    letter-spacing:
        clamp(6px,1.3vw,12px);

    white-space:nowrap;

    text-shadow:

        0 0 12px
        rgba(255,190,0,.65),

        0 0 30px
        rgba(255,210,0,.25);

    pointer-events:none;
}


/* =====================================================
MAPPA
===================================================== */

#map{

    position:absolute;

    top:3cm;

    right:3cm;

    bottom:3cm;

    left:3cm;

    overflow:hidden;

    border-radius:28px;

    background:#071012;

    box-shadow:

        0 0 35px
        rgba(0,0,0,.65),

        0 0 70px
        rgba(255,180,0,.12);

    border:
        1px solid
        rgba(255,185,0,.3);
}

.map-overlay{

    position:absolute;

    inset:0;

    z-index:400;

    pointer-events:none;

    border-radius:28px;

    box-shadow:

        inset 0 0 80px
        rgba(0,0,0,.28),

        inset 0 0 25px
        rgba(255,190,0,.06);
}


/* =====================================================
CHIUSURA MAPPA
===================================================== */

#closeMap{

    position:absolute;

    top:28px;

    left:34px;

    z-index:700;

    width:38px;

    height:38px;

    border:
        1px solid
        rgba(255,185,0,.6);

    border-radius:50%;

    background:
        rgba(20,12,0,.9);

    color:
        rgba(255,230,170,.9);

    cursor:pointer;

    font-size:19px;

    display:flex;

    align-items:center;

    justify-content:center;

    backdrop-filter:
        blur(10px);

    transition:.2s;
}

#closeMap:hover{

    color:white;

    border-color:
        var(--jarvis-bright);

    box-shadow:
        0 0 15px
        rgba(255,190,0,.5);
}


/* =====================================================
CONTROLLI MAPLIBRE
===================================================== */

.maplibregl-ctrl-group{

    background:
        rgba(20,12,0,.9)!important;

    border:
        1px solid
        rgba(255,185,0,.4)!important;

    border-radius:12px!important;

    overflow:hidden;

    box-shadow:
        0 0 15px
        rgba(255,180,0,.15);
}

.maplibregl-ctrl-group button{

    background:
        transparent!important;

    color:
        #FFF0A0!important;
}

.maplibregl-ctrl-group button:hover{

    background:
        rgba(255,185,0,.15)!important;
}

.maplibregl-ctrl-attrib{

    background:
        rgba(5,3,0,.75)!important;

    color:
        rgba(255,220,150,.4)!important;

    font-size:8px!important;
}

.maplibregl-ctrl-attrib a{

    color:
        rgba(255,200,100,.55)!important;
}


/* =====================================================
MARKER JARVIS
===================================================== */

.jarvis-map-marker{

    width:20px;

    height:20px;

    border-radius:50%;

    border:
        2px solid
        #FFD000;

    background:
        rgba(255,180,0,.2);

    box-shadow:

        0 0 15px
        rgba(255,190,0,1),

        0 0 35px
        rgba(255,210,0,.5);

    position:relative;

    animation:
        markerPulse 1.5s infinite;
}

.jarvis-map-marker::after{

    content:"";

    position:absolute;

    left:50%;

    top:50%;

    width:5px;

    height:5px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#FFFBE0;

    box-shadow:
        0 0 8px
        #FFF200;
}

@keyframes markerPulse{

    0%,100%{

        transform:scale(1);

        box-shadow:

            0 0 15px
            rgba(255,190,0,.9),

            0 0 35px
            rgba(255,210,0,.4);
    }

    50%{

        transform:scale(1.18);

        box-shadow:

            0 0 22px
            rgba(255,205,0,1),

            0 0 50px
            rgba(255,220,0,.6);
    }
}


/* =====================================================
POPUP
===================================================== */

.maplibregl-popup-content{

    background:
        rgba(20,12,0,.97)!important;

    color:
        rgba(255,240,200,.95)!important;

    border:
        1px solid
        rgba(255,185,0,.45);

    border-radius:10px;

    padding:10px 14px;

    box-shadow:
        0 0 20px
        rgba(255,190,0,.25);
}

.maplibregl-popup-close-button{

    color:
        #FFF000!important;

    font-size:18px;
}


/* =====================================================
WEB SEARCH
===================================================== */

#webSearchPanel{

    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    background:
        rgba(8,5,0,.96);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

#webSearchPanel.active{

    display:block;

    animation:
        webPanelIn .3s ease;
}

@keyframes webPanelIn{

    from{

        opacity:0;

        transform:
            scale(.985);
    }

    to{

        opacity:1;

        transform:
            scale(1);
    }
}

.web-search-header{

    position:absolute;

    top:18px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:520;

    color:
        rgba(255,240,190,.95);

    font-size:13px;

    letter-spacing:4px;

    white-space:nowrap;

    text-shadow:

        0 0 12px
        rgba(255,190,0,.6),

        0 0 25px
        rgba(255,210,0,.2);
}

#webSearchFrame{

    position:absolute;

    top:58px;

    left:3%;

    right:3%;

    bottom:3%;

    width:94%;

    height:
        calc(97% - 58px);

    border:
        1px solid
        rgba(255,185,0,.35);

    border-radius:20px;

    background:#fff;

    box-shadow:
        0 0 40px
        rgba(255,180,0,.15);
}

#closeWebSearch{

    position:absolute;

    top:14px;

    right:20px;

    z-index:530;

    width:36px;

    height:36px;

    border:
        1px solid
        rgba(255,185,0,.5);

    border-radius:50%;

    background:
        rgba(20,12,0,.92);

    color:
        rgba(255,230,170,.9);

    cursor:pointer;

    font-size:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;
}

#closeWebSearch:hover{

    color:white;

    border-color:
        #FFF200;

    box-shadow:
        0 0 15px
        rgba(255,190,0,.5);
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:600px){

    .jarvis-title{

        top:2.2%;

        font-size:23px;

        letter-spacing:5px;
    }

    .datetime{

        top:12px;

        right:13px;
    }

    .time{

        font-size:10px;
    }

    .date{

        font-size:7px;
    }

    .command-wrapper{

        width:

        bottom:17px;
    }

    #textInput{

        font-size:13px;
    }

    #chat{

        bottom:80px;
    }

    #map{

        top:3cm;

        right:3cm;

        bottom:3cm;

        left:3cm;

        border-radius:22px;
    }

    .map-overlay{

        border-radius:22px;
    }

    .map-header{

        top:2.5%;

        font-size:23px;

        letter-spacing:5px;
    }

    #closeMap{

        top:24px;

        left:25px;

        width:34px;

        height:34px;
    }

    #voiceBtn{

        right:12px;

        bottom:70px;

        height:34px;

        font-size:9px;

        padding:0 11px;
    }

    #voicePanel{

        right:12px;

        bottom:112px;

        width:
            calc(100% - 24px);
    }

}

@media(max-width:430px){

    #map{

        top:2.2cm;

        right:2.2cm;

        bottom:2.2cm;

        left:2.2cm;
    }

}

function createGlow(){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const gradient =
        ctx.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        .10,
        "rgba(255,255,225,1)"
    );

    gradient.addColorStop(
        .25,
        "rgba(255,245,100,1)"
    );

    gradient.addColorStop(
        .45,
        "rgba(255,215,25,.95)"
    );

    gradient.addColorStop(
        .68,
        "rgba(255,175,0,.38)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,130,0,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        128,
        128
    );


    return new THREE.CanvasTexture(
        canvas
    );

}

const COUNT =
    4200;


const geometry =
    new THREE.BufferGeometry();


const positions =
    new Float32Array(
        COUNT * 3
    );


const radii =
    new Float32Array(
        COUNT
    );


const angles =
    new Float32Array(
        COUNT * 2
    );


const seeds =
    new Float32Array(
        COUNT
    );


for(
    let i = 0;
    i < COUNT;
    i++
){

    const r =
        1.05 +
        Math.random() * .72;


    const theta =
        Math.random() *
        Math.PI * 2;


    const phi =
        Math.acos(
            2 * Math.random() - 1
        );


    radii[i] =
        r;


    angles[i * 2] =
        theta;


    angles[i * 2 + 1] =
        phi;


    seeds[i] =
        Math.random() * 1000;


    positions[i * 3] =
        r *
        Math.sin(phi) *
        Math.cos(theta);


    positions[i * 3 + 1] =
        r *
        Math.sin(phi) *
        Math.sin(theta);


    positions[i * 3 + 2] =
        r *
        Math.cos(phi);

}

    "position",
    new THREE.BufferAttribute(
        positions,

    )
);

ENERGIA
===================================================== */

let targetEnergy =
    .15;

let energy =
    .15;


const normalColor =
    new THREE.Color(
        0xFFB300
    );


const activeColor =
    new THREE.Color(
        0xFFF200
    );


const currentColor =
    normalColor.clone();


function setState(state){

    if(
        state === "thinking"
    ){

        targetEnergy =
            2.4;

    }

    else if(
        state === "speaking"
    ){

        targetEnergy =
            1.0;

    }

    else if(
        state === "listening"
    ){

        targetEnergy =
            .7;

    }

    else{

        targetEnergy =
            .18;

    }

}


/* =====================================================
ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now() *
        .001;


    energy +=
        (
            targetEnergy -
            energy
        ) * .045;


    currentColor.lerp(
        activeColor,
        Math.min(
            energy * .035,
            .25
        )
    );


    if(
        energy < .3
    ){

        currentColor.lerp(
            normalColor,
            .045
        );

    }


    material.color =
        currentColor;


    material.size =
        .042 +
        energy * .010;


    const pos =
        geometry
            .attributes
            .position
            .array;


    for(
        let i = 0;
        i < COUNT;
        i++
    ){

        const index =
            i * 3;


        const r =
            radii[i];


        const theta =
            angles[i * 2];


        const phi =
            angles[i * 2 + 1];


        const seed =
            seeds[i];


        const pulse =
            Math.sin(
                time * 2.2 +
                seed
            ) * .025;


        const wave1 =
            Math.sin(
                theta * 7 +
                time * 1.8 +
                seed
            ) *
            .11 *
            energy;


        const wave2 =
            Math.cos(
                phi * 8 -
                time * 2.1 +
                seed
            ) *
            .09 *
            energy;


        const distortion =
            Math.sin(
                theta * 5 +
                phi * 4 +
                time * 1.5
            ) *
            .045 *
            energy;


        const rr =
            r +
            pulse +
            wave1 +
            wave2 +
            distortion;


        let x =
            rr *
            Math.sin(phi) *
            Math.cos(theta);


        let y =
            rr *
            Math.sin(phi) *
            Math.sin(theta);


        let z =
            rr *
            Math.cos(phi);


        x +=
            Math.sin(
                time * 1.7 +
                phi * 9 +
                seed
            ) *
            .035 *
            energy;


        y +=
            Math.cos(
                time * 1.9 +
                theta * 8 +
                seed
            ) *
            .035 *
            energy;


        z +=
            Math.sin(
                time * 2.0 +
                (theta + phi) * 7 +
                seed
            ) *
            .045 *
            energy;


        pos[index] =
            x;

        pos[index + 1] =
            y;

        pos[index + 2] =
            z;

    }


    geometry
        .attributes
        .position
        .needsUpdate =
        true;


    particles.rotation.y +=
        .0007 +
        energy * .001;


    particles.rotation.x =
        Math.sin(
            time * .22
        ) * .035;


    particles.rotation.z =
        Math.cos(
            time * .17
        ) * .025;


    renderer.render(
        scene,
        camera
    );

}

animate();

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

            /"/g,
            "&quot;"
        )

            /'/g,
            "&#039;"
        );

}

===================================================== */

async function searchLocation(
    place
){

    try{

        openTacticalMap();


        addMsg(
            "Ricerca posizione: " +
            place
        );


        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=1" +
            "&q=" +
            encodeURIComponent(
                place
            );


        const response =
            await fetch(
                url,
                {

                    headers:{

                        "Accept":
                            "application/json"

                    }

                }
            );


        if(!response.ok){

            throw new Error(
                "Ricerca posizione fallita"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            addMsg(
                "Non riesco a trovare " +
                place +
                "."
            );

            return;

        }


        const result =
            results[0];


        const lat =
            parseFloat(
                result.lat
            );


        const lon =
            parseFloat(
                result.lon
            );


        if(!map){

            throw new Error(
                "Mappa non inizializzata"
            );

        }


        map.flyTo({

            center:
                [lon,lat],

            zoom:
                12,

            speed:
                .8,

            curve:
                1.5,

            essential:
                true

        });


        createJarvisMarker(
            lat,
            lon,
            place
        );


        addMsg(
            "Posizione acquisita: " +
            place
        );


    }catch(error){

        console.error(
            "MAP ERROR:",
            error
        );


        addMsg(
            "Impossibile localizzare " +
            place +
            "."
        );

    }

}

function loadDeviceVoices(){

            .getVoices();

        );

    );

        (voice,index) => {

                document.createElement(
                    "option"
                );


            option.value =
                String(index);


            option.textContent =
                `${voice.name} — ${voice.lang}`;


            voiceSelector.appendChild(
                option
            );

        }
    );


    const savedVoice =
        localStorage.getItem(
            "jarvis_device_voice"
        );


    if(
        savedVoice !== null &&
        Number(savedVoice) <
            deviceVoices.length
    ){

        voiceSelector.value =

        selectedDeviceVoice =
            deviceVoices[
                Number(savedVoice)
            ];

    }

}

/* =====================================================
SPEECH SYNTHESIS
===================================================== */

function speakDevice(text){

    return new Promise(
        resolve => {

            if(
                !("speechSynthesis" in window)
            ){

                resolve(false);

                return;

            }


            try{

                window.speechSynthesis.cancel();


                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );


                utterance.lang =
                    "it-IT";


                utterance.rate =
                    0.95;


                utterance.pitch =
                    0.9;


                utterance.volume =
                    1;


                if(
                    selectedDeviceVoice
                ){

                    utterance.voice =
                        selectedDeviceVoice;

                }

                else{

                    const italianVoice =
                        deviceVoices.find(
                            voice =>
                                voice.lang
                                    .toLowerCase()
                                    .startsWith(
                                        "it"
                                    )
                        );


                    if(
                        italianVoice
                    ){

                        utterance.voice =
                            italianVoice;

                    }

                }


                utterance.onstart =
                    () => {

                        audioPlaying =
                            true;

                        setState(
                            "speaking"
                        );

                    };


                utterance.onend =
                    () => {

                        audioPlaying =
                            false;

                        setState(
                            "idle"
                        );

                        resolve(true);

                    };


                utterance.onerror =
                    error => {

                        console.error(
                            "DEVICE TTS ERROR:",
                            error
                        );

                        audioPlaying =
                            false;

                        setState(
                            "idle"
                        );

                        resolve(false);

                    };


                window.speechSynthesis
                    .speak(
                        utterance
                    );


                setTimeout(
                    () => {

                        try{

                            window.speechSynthesis.resume();

                        }catch(error){

                            console.warn(
                                error
                            );

                        }

                    },
                    100
                );


            }catch(error){

                console.error(
                    "DEVICE TTS:",
                    error
                );

                resolve(false);

            }

        }
    );

}


/* =====================================================
ELEVENLABS
===================================================== */

async function speakElevenLabs(text){

    if(!text){
        return false;
    }


    if(currentAudio){

        try{

            currentAudio.pause();

            currentAudio.currentTime =
                0;

        }catch(error){

            console.warn(
                error
            );

        }


        currentAudio =
            null;

    }


    audioPlaying =
        false;


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => {

                controller.abort();

            },
            30000
        );


    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "tts",

                            text:
                                text,

                            voiceId:
                                ELEVEN_VOICE_ID

                        }),

                    signal:
                        controller.signal

                }
            );


        if(!response.ok){

            console.warn(
                "ElevenLabs HTTP:",
                response.status
            );

            return false;

        }


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if(
            !contentType.includes(
                "audio"
            )
        ){

            return false;

        }


        const audioBlob =
            await response.blob();


        if(
            !audioBlob ||
            audioBlob.size === 0
        ){

            return false;

        }


        const audioUrl =
            URL.createObjectURL(
                audioBlob
            );


        const audio =
            new Audio(
                audioUrl
            );


        currentAudio =
            audio;


        audio.volume =
            1;


        audio.onplay =
            () => {

                audioPlaying =
                    true;

                setState(
                    "speaking"
                );

            };


        audio.onended =
            () => {

                audioPlaying =
                    false;

                setState(
                    "idle"
                );


                URL.revokeObjectURL(
                    audioUrl
                );


                if(
                    currentAudio ===
                    audio
                ){

                    currentAudio =
                        null;

                }

            };


        audio.onerror =
            error => {

                console.warn(
                    "ElevenLabs audio:",
                    error
                );

                audioPlaying =
                    false;

                setState(
                    "idle"
                );


                URL.revokeObjectURL(
                    audioUrl
                );

            };


        await audio.play();


        return true;


    }catch(error){

        console.warn(
            "ElevenLabs TTS:",
            error
        );

        return false;


    }finally{

        clearTimeout(
            timeout
        );

    }

}


/* =====================================================
SPEAK
===================================================== */

async function speak(text){

    if(!text){
        return;
    }


    const elevenSuccess =
        await speakElevenLabs(
            text
        );


    if(
        elevenSuccess
    ){

/* =====================================================
PROCESS AI
===================================================== */

async function processAi(text){

    if(
        handleWebCommand(
            text
        )
    ){

        return;

    }


    if(
        handleMapCommand(
            text
        )
    ){

        return;

    }


    setState(
        "thinking"
    );


    try{

        const temporal =
            getTimeData();


        addMemory(
            "user",
            text
        );


        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => {

                    controller.abort();

                },
                30000
            );


        let response;


        try{

            response =
                await fetch(
                    API,
                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                memory:
                                    memory.slice(-4),

                                currentTime:
                                    temporal.currentTime,

                                currentDate:
                                    temporal.currentDate,

                                dayOfWeek:
                                    temporal.dayOfWeek,

                                timezone:
                                    temporal.timezone

                            }),

                        signal:
                            controller.signal

                    }
                );

        }finally{

            clearTimeout(
                timeout
            );

        }


        if(!response.ok){

            const errorText =
                await response.text();


            let errorMessage =
                "HTTP " +
                response.status;


            try{

                const errorData =
                    JSON.parse(
                        errorText
                    );


                if(
                    errorData &&
                    errorData.error
                ){

                    errorMessage =
                        errorData.error;

                }

            }catch(parseError){

                if(errorText){

                    errorMessage =
                        errorText.substring(
                            0,
                            200
                        );

                }

            }


            throw new Error(
                errorMessage
            );

        }


        const data =
            await response.json();


        console.log(
            "JARVIS RESPONSE:",
            data
        );


        const reply =
            typeof data.response ===
                "string"
                ? data.response.trim()
                : "";


        if(!reply){

            throw new Error(
                "Risposta AI vuota"
            );

        }


        addMsg(
            reply
        );


        addMemory(
            "assistant",
            reply
        );


        speak(
            reply
        ).catch(
            error => {

                console.error(
                    "TTS:",
                    error
                );

            }
        );


        setState(
            "idle"
        );


    }catch(error){

        console.error(
            "JARVIS ERROR:",
            error
        );


        let message =
            error.message ||
            "Errore sconosciuto";


        if(
            error.name ===
            "AbortError"
        ){

            message =
                "Il server ha impiegato troppo tempo a rispondere.";

        }

        else if(
            message ===
            "Failed to fetch"
        ){

            message =
                "Errore di connessione al server JARVIS.";

        }


        addMsg(
            "ERRORE: " +
            message
        );


        setState(
            "idle"
        );

    }

}


/* =====================================================
INVIO
===================================================== */

function sendMessage(){

    const text =
        textInput.value.trim();


    if(!text){
        return;
    }


    textInput.value =
        "";


    addMsg(
        text
    );


    processAi(
        text
    );

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


textInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
MICROFONO
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


let listening =
    false;


if(Recognition){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening =
                true;


            micBtn.classList.add(
                "active"
            );


            setState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if(text){

                textInput.value =
                    text;


                sendMessage();

            }

        };


    recognition.onerror =
        error => {

            console.error(
                "Microfono:",
                error
            );


            listening =
                false;


            micBtn.classList.remove(
                "active"
            );


            setState(
                "idle"
            );

        };


    recognition.onend =
        () => {

            listening =
                false;


            micBtn.classList.remove(
                "active"
            );

        };


    micBtn.addEventListener(
        "click",
        () => {

            if(listening){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }

        }
    );

}else{

    micBtn.style.opacity =
        ".3";

}
