<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
/>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010405;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at center,
            #071719 0%,
            #020708 48%,
            #000000 100%
        );
}

#webgl-container{
    position:fixed;
    inset:0;
    z-index:1;
}

.vignette{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.2) 65%,
            rgba(0,0,0,.8) 100%
        );
}

.jarvis-title{
    position:fixed;
    top:2.4%;
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    color:rgba(255,255,255,.86);

    font-size:
        clamp(20px,2.8vw,31px);

    font-weight:300;

    letter-spacing:
        clamp(5px,1vw,8px);

    white-space:nowrap;

    text-shadow:
        0 0 10px
        rgba(255,255,255,.12);

    pointer-events:none;
}

.datetime{
    position:fixed;
    top:18px;
    right:24px;
    z-index:30;

    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:3px;

    font-family:monospace;

    pointer-events:none;
}

.time{
    color:rgba(150,255,255,.6);
    font-size:11px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px
        rgba(0,255,255,.2);
}

.date{
    color:rgba(150,255,255,.38);
    font-size:8px;
    letter-spacing:1px;
}

#chat{
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%);
    z-index:40;

    width:min(620px,88%);

    text-align:center;

    pointer-events:none;
}

.msg{
    display:inline-block;
    max-width:100%;

    padding:10px 18px;

    border:
        1px solid
        rgba(0,255,255,.22);

    border-radius:24px;

    background:
        rgba(4,20,23,.4);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    color:
        rgba(235,255,255,.9);

    font-size:12px;
    line-height:1.45;

    white-space:pre-wrap;
}

.command-wrapper{
    position:fixed;
    left:50%;
    bottom:23px;
    transform:translateX(-50%);
    z-index:50;

    width:min(650px,90%);

    display:flex;
    align-items:center;

    padding:6px 7px 6px 20px;

    border:
        1px solid
        rgba(100,255,255,.28);

    border-radius:40px;

    background:
        rgba(5,20,23,.38);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 0 30px
        rgba(0,255,255,.05);
}

.command-wrapper:focus-within{
    border-color:
        rgba(0,255,255,.6);

    box-shadow:
        0 0 25px
        rgba(0,255,255,.12);
}

#textInput{
    flex:1;
    min-width:0;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;
    font-size:14px;

    padding:12px 5px;
}

#textInput::placeholder{
    color:rgba(255,255,255,.3);
}

#micBtn{
    width:34px;
    height:34px;

    margin-right:7px;

    border:none;

    background:transparent;

    color:rgba(210,255,255,.65);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.mic-icon{
    width:8px;
    height:14px;

    border:
        1.3px solid
        currentColor;

    border-radius:60px;

    position:relative;
}

.mic-icon::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-6px;

    width:12px;
    height:7px;

    transform:translateX(-50%);

    border:
        1.3px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 8px 8px;
}

#micBtn:hover{
    color:#00ffff;
}

#micBtn.active{
    color:#8fffff;

    filter:
        drop-shadow(
            0 0 8px
            rgba(0,255,255,.7)
        );
}

#sendBtn{
    height:39px;

    padding:0 17px;

    border:
        1px solid
        rgba(0,255,255,.28);

    border-radius:22px;

    background:
        rgba(0,255,255,.05);

    color:
        rgba(220,255,255,.78);

    font-size:10px;
    letter-spacing:2px;

    cursor:pointer;
}

#sendBtn:hover{
    color:white;

    border-color:#00ffff;

    background:
        rgba(0,255,255,.1);
}

#voiceBtn{
    position:fixed;

    right:22px;
    bottom:24px;

    z-index:60;

    height:39px;

    padding:0 15px;

    border:
        1px solid
        rgba(0,255,255,.25);

    border-radius:22px;

    background:
        rgba(3,15,18,.72);

    color:
        rgba(210,255,255,.7);

    font-size:10px;
    letter-spacing:1.5px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.2s;
}

#voiceBtn:hover{
    color:white;

    border-color:#00ffff;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.2);
}

#voicePanel{
    position:fixed;

    right:22px;
    bottom:72px;

    z-index:100;

    width:min(330px,calc(100% - 30px));

    padding:15px;

    display:none;

    border:
        1px solid
        rgba(0,255,255,.25);

    border-radius:18px;

    background:
        rgba(2,13,16,.94);

    backdrop-filter:blur(20px);

    box-shadow:
        0 0 35px
        rgba(0,255,255,.12);
}

#voicePanel.active{
    display:block;
}

.voice-title{
    color:
        rgba(220,255,255,.9);

    font-size:11px;
    letter-spacing:2px;

    margin-bottom:10px;
}

#voiceSelector{
    width:100%;

    padding:11px;

    border:
        1px solid
        rgba(0,255,255,.2);

    border-radius:10px;

    outline:none;

    background:
        rgba(0,20,23,.9);

    color:
        rgba(220,255,255,.85);

    font-size:11px;
}

#voiceTest{
    width:100%;

    margin-top:10px;

    padding:9px;

    border:
        1px solid
        rgba(0,255,255,.2);

    border-radius:10px;

    background:
        rgba(0,255,255,.04);

    color:
        rgba(210,255,255,.7);

    cursor:pointer;

    font-size:10px;
    letter-spacing:1px;
}

#voiceTest:hover{
    border-color:#00ffff;
    color:white;
}

#tacticalMap{
    position:fixed;
    inset:0;

    z-index:20;

    display:none;

    background:
        radial-gradient(
            circle at center,
            #081719 0%,
            #020708 65%,
            #000000 100%
        );
}

#tacticalMap.active{
    display:block;

    animation:
        mapIn .45s ease;
}

@keyframes mapIn{
    from{
        opacity:0;
        transform:scale(1.015);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.map-header{
    position:absolute;

    top:2.4%;
    left:50%;

    transform:
        translateX(-50%);

    z-index:600;

    color:
        rgba(220,255,255,.9);

    font-family:Arial,sans-serif;

    font-size:
        clamp(24px,4vw,42px);

    font-weight:300;

    letter-spacing:
        clamp(6px,1.3vw,12px);

    white-space:nowrap;

    text-shadow:
        0 0 12px
        rgba(0,255,255,.25);

    pointer-events:none;
}

#map{
    position:absolute;

    top:3cm;
    right:3cm;
    bottom:3cm;
    left:3cm;

    overflow:hidden;

    border-radius:28px;

    background:#071012;

    box-shadow:
        0 0 35px rgba(0,0,0,.65),
        0 0 70px rgba(0,255,255,.035);

    border:
        1px solid
        rgba(0,255,255,.10);
}

.map-overlay{
    position:absolute;

    inset:0;

    z-index:400;

    pointer-events:none;

    border-radius:28px;

    box-shadow:
        inset 0 0 80px
        rgba(0,0,0,.28);
}

#closeMap{
    position:absolute;

    top:28px;
    left:34px;

    z-index:700;

    width:38px;
    height:38px;

    border:
        1px solid
        rgba(0,255,255,.35);

    border-radius:50%;

    background:
        rgba(0,15,18,.85);

    color:
        rgba(200,255,255,.85);

    cursor:pointer;

    font-size:19px;

    display:flex;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(10px);

    transition:.2s;
}

#closeMap:hover{
    color:white;

    border-color:#00ffff;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.3);
}

.maplibregl-ctrl-group{
    background:
        rgba(0,15,18,.85)!important;

    border:
        1px solid
        rgba(0,255,255,.18)!important;

    border-radius:12px!important;

    overflow:hidden;
}

.maplibregl-ctrl-group button{
    background:
        transparent!important;

    color:#bfffff!important;
}

.maplibregl-ctrl-group button:hover{
    background:
        rgba(0,255,255,.08)!important;
}

.maplibregl-ctrl-attrib{
    background:
        rgba(0,8,10,.65)!important;

    color:
        rgba(180,255,255,.35)!important;

    font-size:8px!important;
}

.maplibregl-ctrl-attrib a{
    color:
        rgba(150,240,255,.45)!important;
}

.jarvis-map-marker{
    width:20px;
    height:20px;

    border-radius:50%;

    border:
        2px solid
        #00ffff;

    background:
        rgba(0,255,255,.16);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.9),
        0 0 35px
        rgba(0,255,255,.4);

    position:relative;

    animation:
        markerPulse 1.5s infinite;
}

.jarvis-map-marker::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#dfffff;

    box-shadow:
        0 0 8px #00ffff;
}

@keyframes markerPulse{
    0%,100%{
        transform:scale(1);

        box-shadow:
            0 0 15px
            rgba(0,255,255,.9),
            0 0 35px
            rgba(0,255,255,.4);
    }

    50%{
        transform:scale(1.18);

        box-shadow:
            0 0 22px
            rgba(0,255,255,1),
            0 0 50px
            rgba(0,255,255,.55);
    }
}

.maplibregl-popup-content{
    background:
        rgba(3,15,18,.96)!important;

    color:
        rgba(220,255,255,.9)!important;

    border:
        1px solid
        rgba(0,255,255,.25);

    border-radius:10px;

    padding:10px 14px;

    box-shadow:
        0 0 20px
        rgba(0,255,255,.12);
}

.maplibregl-popup-close-button{
    color:#00ffff!important;
    font-size:18px;
}

@media(max-width:600px){

    .jarvis-title{
        top:2.2%;
        font-size:23px;
        letter-spacing:5px;
    }

    .datetime{
        top:12px;
        right:13px;
    }

    .time{
        font-size:10px;
    }

    .date{
        font-size:7px;
    }

    .command-wrapper{
        width:
            calc(100% - 24px);

        bottom:17px;
    }

    #textInput{
        font-size:13px;
    }

    #chat{
        bottom:80px;
    }

    #map{
        top:3cm;
        right:3cm;
        bottom:3cm;
        left:3cm;

        border-radius:22px;
    }

    .map-overlay{
        border-radius:22px;
    }

    .map-header{
        top:2.5%;
        font-size:23px;
        letter-spacing:5px;
    }

    #closeMap{
        top:24px;
        left:25px;

        width:34px;
        height:34px;
    }

    #voiceBtn{
        right:12px;
        bottom:70px;

        height:34px;

        font-size:9px;

        padding:0 11px;
    }

    #voicePanel{
        right:12px;
        bottom:112px;

        width:
            calc(100% - 24px);
    }

}

@media(max-width:430px){

    #map{
        top:2.2cm;
        right:2.2cm;
        bottom:2.2cm;
        left:2.2cm;
    }

}

</style>

</head>

<body>

<div id="webgl-container"></div>

<div class="vignette"></div>

<div
    class="jarvis-title"
    id="jarvisTitle"
>
    J.A.R.V.I.S
</div>

<div class="datetime">

    <div id="clock" class="time">
        00:00:00
    </div>

    <div id="date" class="date">
        00 AGO 2026
    </div>

</div>

<div id="tacticalMap">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        placeholder="Chiedi qualcosa a JARVIS..."
    >

    <button
        id="micBtn"
        aria-label="Microfono"
    >
        <span class="mic-icon"></span>
    </button>

        INVIA
    </button>

</div>

    ⚙ VOCE
</button>

    <div class="voice-title">
        VOCE J.A.R.V.I.S.
    </div>

    <select id="voiceSelector">

        <option value="a7vno2SJkTdglAq4liNI">
            ElevenLabs — J.A.R.V.I.S.
        </option>

    </select>

    <button id="voiceTest">
        TESTA VOCE
    </button>

</div>

<script
    src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js">
</script>

<script type="importmap">

    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }

<script type="module">

import * as THREE from "three";


/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";

const MEMORY_KEY =
    "jarvis_memory_v1";

const MAX_MEMORY =
    30;


/* =====================================================
   ELEVENLABS
===================================================== */

/*
   IMPORTANTE:
   QUI NON VA MESSA LA API KEY.

   La API Key rimane nel Secret del Worker.

   Questo è il Voice ID ElevenLabs.
*/

const ELEVEN_VOICE_ID =
    "a7vno2SJkTdglAq4liNI";


/*
   Audio J.A.R.V.I.S.
*/

let currentAudio =
    null;

let audioPlaying =
    false;


/* =====================================================
   MAPTILER
===================================================== */

const MAPTILER_KEY =
    "NmSlgtsAdQyEWy7t0OJf";

const MAPTILER_STYLE =
    "https://api.maptiler.com/maps/01a050ff-ecff-7fb2-911f-81c59fc71217/style.json?key="
    +
    MAPTILER_KEY;


/* =====================================================
   ELEMENTI
===================================================== */

const container =
    document.getElementById(
        "webgl-container"
    );

const chat =
    document.getElementById(
        "chat"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const clock =
    document.getElementById(
        "clock"
    );

const date =
    document.getElementById(
        "date"
    );

const tacticalMap =
    document.getElementById(
        "tacticalMap"
    );

const closeMap =
    document.getElementById(
        "closeMap"
    );

const jarvisTitle =
    document.getElementById(
        "jarvisTitle"
    );

const mapHeader =
    document.querySelector(
        ".map-header"
    );

const voiceBtn =
    document.getElementById(
        "voiceBtn"
    );

const voicePanel =
    document.getElementById(
        "voicePanel"
    );

const voiceSelector =
    document.getElementById(
        "voiceSelector"
    );

const voiceTest =
    document.getElementById(
        "voiceTest"
    );


/* =====================================================
   MEMORIA
===================================================== */

let memory = [];

try{

    const saved =
        localStorage.getItem(
            MEMORY_KEY
        );

    if(saved){

        const parsed =
            JSON.parse(saved);

        if(Array.isArray(parsed)){

            memory =
                parsed.slice(
                    -MAX_MEMORY
                );

        }

    }

}catch(error){

    console.warn(
        "Memoria:",
        error
    );

}


function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                memory.slice(
                    -MAX_MEMORY
                )
            )
        );

    }catch(error){

        console.warn(
            "Salvataggio memoria:",
            error
        );

    }

}


function addMemory(
    role,
    content
){

    memory.push({
        role,
        content
    });

    memory =
        memory.slice(
            -MAX_MEMORY
        );

    saveMemory();

}


/* =====================================================
   ORA
===================================================== */

const months = [

    "GEN",
    "FEB",
    "MAR",
    "APR",
    "MAG",
    "GIU",
    "LUG",
    "AGO",
    "SET",
    "OTT",
    "NOV",
    "DIC"

];


function updateClock(){

    const now =
        new Date();

    const h =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );

    const m =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const s =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );

    clock.textContent =
        `${h}:${m}:${s}`;

    const d =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );

    const month =
        months[
            now.getMonth()
        ];

    const year =
        now.getFullYear();

    date.textContent =
        `${d} ${month} ${year}`;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   THREE.JS
===================================================== */

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.z =
    5.2;


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,
        alpha:true

    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

container.appendChild(
    renderer.domElement
);


/* =====================================================
   GLOW
===================================================== */

function createGlow(){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        64;

    canvas.height =
        64;

    const ctx =
        canvas.getContext(
            "2d"
        );

    const gradient =
        ctx.createRadialGradient(
            32,
            32,
            0,
            32,
            32,
            32
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        .2,
        "rgba(220,255,255,1)"
    );

    gradient.addColorStop(
        .4,
        "rgba(0,255,255,.9)"
    );

    gradient.addColorStop(
        .7,
        "rgba(0,150,190,.25)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        64,
        64
    );

    return new THREE.CanvasTexture(
        canvas
    );

}


/* =====================================================
   PARTICELLE
===================================================== */

const COUNT =
    3000;

const geometry =
    new THREE.BufferGeometry();

const positions =
    new Float32Array(
        COUNT * 3
    );

const radii =
    new Float32Array(
        COUNT
    );

const angles =
    new Float32Array(
        COUNT * 2
    );

const seeds =
    new Float32Array(
        COUNT
    );


for(
    let i=0;
    i<COUNT;
    i++
){

    const r =
        1.10 +
        Math.random()*.70;

    const theta =
        Math.random() *
        Math.PI *
        2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    radii[i] =
        r;

    angles[i*2] =
        theta;

    angles[i*2+1] =
        phi;

    seeds[i] =
        Math.random()*100;

    positions[i*3] =
        r *
        Math.sin(phi) *
        Math.cos(theta);

    positions[i*3+1] =
        r *
        Math.sin(phi) *
        Math.sin(theta);

    positions[i*3+2] =
        r *
        Math.cos(phi);

}


geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const material =
    new THREE.PointsMaterial({

        color:
            new THREE.Color(
                0x00cfe8
            ),

        size:.034,

        map:createGlow(),

        transparent:true,

        opacity:.82,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending

    });


const particles =
    new THREE.Points(
        geometry,
        material
    );

scene.add(
    particles
);


/* =====================================================
   ENERGIA
===================================================== */

let targetEnergy =
    .15;

let energy =
    .15;

const normalColor =
    new THREE.Color(
        0x00cfe8
    );

const activeColor =
    new THREE.Color(
        0x8fffff
    );

const currentColor =
    normalColor.clone();


function setState(
    state
){

    if(
        state === "thinking"
    ){

        targetEnergy =
            2;

    }

    else if(
        state === "speaking"
    ){

        targetEnergy =
            .8;

    }

    else if(
        state === "listening"
    ){

        targetEnergy =
            .55;

    }

    else{

        targetEnergy =
            .15;

    }

}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
        performance.now()*.001;

    energy +=
        (
            targetEnergy -
            energy
        )*.045;

    currentColor.lerp(
        activeColor,
        energy*.04
    );

    if(
        energy < .3
    ){

        currentColor.lerp(
            normalColor,
            .03
        );

    }

    material.color =
        currentColor;

    material.size =
        .032 +
        energy*.008;

    const pos =
        geometry
            .attributes
            .position
            .array;


    for(
        let i=0;
        i<COUNT;
        i++
    ){

        const index =
            i*3;

        const r =
            radii[i];

        const theta =
            angles[i*2];

        const phi =
            angles[i*2+1];

        const seed =
            seeds[i];

        const pulse =
            Math.sin(
                time*2 +
                seed
            )*.035;

        const strangeShape =
            Math.sin(
                theta*6 +
                time*2 +
                seed
            )*.18*energy;

        const wave =
            Math.cos(
                phi*7 -
                time*1.8 +
                seed
            )*.12*energy;

        const rr =
            r +
            pulse +
            strangeShape +
            wave;

        let x =
            rr *
            Math.sin(phi) *
            Math.cos(theta);

        let y =
            rr *
            Math.sin(phi) *
            Math.sin(theta);

        let z =
            rr *
            Math.cos(phi);

        x +=
            Math.sin(
                time*2.4 +
                phi*8 +
                seed
            )*.08*energy;

        y +=
            Math.cos(
                time*2.1 +
                theta*9 +
                seed
            )*.08*energy;

        z +=
            Math.sin(
                time*2.7 +
                (theta+phi)*7
            )*.10*energy;

        pos[index] =
            x;

        pos[index+1] =
            y;

        pos[index+2] =
            z;

    }

    geometry
        .attributes
        .position
        .needsUpdate =
            true;

    particles.rotation.y +=
        .0005 +
        energy*.0008;

    particles.rotation.x =
        Math.sin(
            time*.25
        )*.04;

    particles.rotation.z =
        Math.cos(
            time*.18
        )*.025;

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =====================================================
   MARKER
===================================================== */

function createJarvisMarker(
    lat,
    lon,
    name
){

    if(!map){
        return;
    }

    if(currentMarker){

        currentMarker.remove();

        currentMarker =
            null;

    }

    const markerElement =
        document.createElement(
            "div"
        );

    markerElement.className =
        "jarvis-map-marker";


    currentMarker =
        new maplibregl.Marker({

            element:
                markerElement,

            anchor:
                "center"

        })

        .setLngLat(
            [lon,lat]
        )

        .setPopup(

            new maplibregl.Popup({
                offset:15
            })

            .setHTML(
                `<b style="color:#00ffff">${escapeHtml(name)}</b>`
            )

        )

        .addTo(
            map
        );

    currentMarker.togglePopup();

}


/* =====================================================
   SICUREZZA TESTO
===================================================== */

function escapeHtml(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   RICERCA POSIZIONE
===================================================== */

async function searchLocation(
    place
){

    try{

        openTacticalMap();

        addMsg(
            "Ricerca posizione: " +
            place
        );

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=1" +
            "&q=" +
            encodeURIComponent(
                place
            );

        const response =
            await fetch(
                url,
                {

                    headers:{
                        "Accept":
                            "application/json"
                    }

                }
            );

        if(!response.ok){

            throw new Error(
                "Ricerca posizione fallita"
            );

        }

        const results =
            await response.json();

        if(!results.length){

            addMsg(
                "Non riesco a trovare " +
                place +
                "."
            );

            return;

        }

        const result =
            results[0];

        const lat =
            parseFloat(
                result.lat
            );

        const lon =
            parseFloat(
                result.lon
            );

        if(!map){

            throw new Error(
                "Mappa non inizializzata"
            );

        }

        map.flyTo({

            center:
                [lon,lat],

            zoom:
                12,

            speed:
                .8,

            curve:
                1.5,

            essential:
                true

        });

        createJarvisMarker(
            lat,
            lon,
            place
        );

        addMsg(
            "Posizione acquisita: " +
            place
        );


    }catch(error){

        console.error(
            "MAP ERROR:",
            error
        );

        addMsg(
            "Impossibile localizzare " +
            place +
            "."
        );

    }

}


/* =====================================================
   COMANDI MAPPA
===================================================== */

function handleMapCommand(
    text
){

    const normalized =
        text
            .toLowerCase()
            .trim();


    if(

        normalized.includes(
            "apri la mappa"
        )

        ||

        normalized.includes(
            "apri mappa"
        )

        ||

        normalized.includes(
            "mappa tattica"
        )

        ||

        normalized.includes(
            "modalità tattica"
        )

        ||

        normalized.includes(
            "modalita tattica"
        )

        ||

        normalized.includes(
            "attiva la mappa"
        )

    ){

        openTacticalMap();

        addMsg(
            "Mappa tattica attivata."
        );

        return true;

    }


    if(

        normalized.includes(
            "chiudi la mappa"
        )

        ||

        normalized.includes(
            "chiudi mappa"
        )

        ||

        normalized.includes(
            "esci dalla mappa"
        )

        ||

        normalized.includes(
            "torna alla modalità normale"
        )

        ||

        normalized.includes(
            "torna alla modalita normale"
        )

    ){

        closeTacticalMap();

        addMsg(
            "Modalità tattica disattivata."
        );

        return true;

    }


    const patterns = [

        "mostrami ",
        "mostra ",
        "vai a ",
        "portami a ",
        "localizza ",
        "cerca ",
        "visualizza "

    ];


    for(
        const pattern of patterns
    ){

        if(
            normalized.startsWith(
                pattern
            )
        ){

            const place =
                text
                    .trim()
                    .substring(
                        pattern.length
                    )
                    .trim();

            if(
                place.length > 1
            ){

                searchLocation(
                    place
                );

                return true;

            }

        }

    }


    return false;

}

/* =====================================================

===================================================== */

function getTimeData(){

    const now =
        new Date();

    return {

        currentTime:
            now.toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            ),

        currentDate:
            now.toLocaleDateString(
                "it-IT",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric"
                }
            ),

        dayOfWeek:
            now.toLocaleDateString(
                "it-IT",
                {
                    weekday:"long"
                }
            ),

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone

    };

}


/* =====================================================
   ELEVENLABS SPEAK
===================================================== */

/*
   Questa funzione NON usa più speechSynthesis.

   Chiede al Worker di generare l'audio ElevenLabs.
*/

async function speak(
    text
){

    if(!text){
        return;
    }


    /*
       Ferma eventuale audio precedente
    */

    if(currentAudio){

        try{
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }catch(error){
            console.warn(error);
        }

        currentAudio =
            null;

    }

    audioPlaying =
        false;


    setState(
        "speaking"
    );


    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "tts",

                            text:
                                text,

                            voiceId:
                                ELEVEN_VOICE_ID

                        })

                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "ElevenLabs Worker:",
                errorText
            );

            throw new Error(
                "Errore ElevenLabs HTTP " +
                response.status
            );

        }


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        /*
           Il Worker deve restituire
           direttamente l'audio.
        */

        if(
            !contentType.includes(
                "audio"
            )
        ){

            const errorText =
                await response.text();

            console.error(
                "Risposta TTS:",
                errorText
            );

            throw new Error(
                "Il Worker non ha restituito audio."
            );

        }


        const audioBlob =
            await response.blob();


        const audioUrl =
            URL.createObjectURL(
                audioBlob
            );


        const audio =
            new Audio(
                audioUrl
            );


        currentAudio =
            audio;


        audio.volume =
            1;


        audio.onplay =
            () => {

                audioPlaying =
                    true;

                setState(
                    "speaking"
                );

            };


        audio.onended =
            () => {

                audioPlaying =
                    false;

                setState(
                    "idle"
                );

                URL.revokeObjectURL(
                    audioUrl
                );

                if(
                    currentAudio ===
                    audio
                ){

                    currentAudio =
                        null;

                }

            };


        audio.onerror =
            error => {

                console.error(
                    "Audio ElevenLabs:",
                    error
                );

                audioPlaying =
                    false;

                setState(
                    "idle"
                );

                URL.revokeObjectURL(
                    audioUrl
                );

                if(
                    currentAudio ===
                    audio
                ){

                    currentAudio =
                        null;

                }

            };


        await audio.play();


    }catch(error){

        console.error(
            "JARVIS TTS ERROR:",
            error
        );

        audioPlaying =
            false;

        setState(
            "idle"
        );

        addMsg(
            "Errore voce J.A.R.V.I.S.: " +
            error.message
        );

    }

}


/* =====================================================
   PROCESS AI
===================================================== */

async function processAi(
    text
){

    if(
        handleMapCommand(
            text
        )
    ){

        return;

    }

    setState(
        "thinking"
    );


    try{

        const temporal =
            getTimeData();

        addMemory(
            "user",
            text
        );


        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                memory.slice(-4),

                            currentTime:
                                temporal.currentTime,

                            currentDate:
                                temporal.currentDate,

                            dayOfWeek:
                                temporal.dayOfWeek,

                            timezone:
                                temporal.timezone

                        })

                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "Worker:",
                errorText
            );

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        if(!response.body){

            throw new Error(
                "Streaming non disponibile"
            );

        }


        chat.innerHTML =
            "";

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "msg";

        chat.appendChild(
            element
        );


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();

        let buffer =
            "";

        let reply =
            "";


        while(true){

            const {
                value,
                done
            } =
                await reader.read();

            if(done){
                break;
            }


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split(
                    "\n"
                );


            buffer =
                lines.pop() || "";


            for(
                const line of lines
            ){

                const trimmed =
                    line.trim();

                if(!trimmed){
                    continue;
                }

                if(
                    !trimmed.startsWith(
                        "data:"
                    )
                ){
                    continue;
                }


                const raw =
                    trimmed
                        .substring(5)
                        .trim();


                if(
                    !raw ||
                    raw === "[DONE]"
                ){
                    continue;
                }


                try{

                    const json =
                        JSON.parse(
                            raw
                        );


                    let piece =
                        "";


                    if(
                        typeof json.response ===
                        "string"
                    ){

                        piece =
                            json.response;

                    }

                    else if(
                        json.choices &&
                        json.choices[0]
                    ){

                        const choice =
                            json.choices[0];


                        if(
                            choice.delta &&
                            typeof choice.delta.content ===
                            "string"
                        ){

                            piece =
                                choice.delta.content;

                        }

                        else if(
                            choice.message &&
                            typeof choice.message.content ===
                            "string"
                        ){

                            piece =
                                choice.message.content;

                        }

                        else if(
                            typeof choice.text ===
                            "string"
                        ){

                            piece =
                                choice.text;

                        }

                    }


                    if(piece){

                        reply +=
                            piece;

                        element.textContent =
                            reply;

                        setState(
                            "speaking"
                        );

                    }


                }catch(error){

                    console.warn(
                        "Stream JSON:",
                        raw
                    );

                }

            }

        }


        reply =
            reply.trim();


        if(!reply){

            throw new Error(
                "Risposta AI vuota"
            );

        }


        addMemory(
            "assistant",
            reply
        );


        /*
           ORA JARVIS USA ELEVENLABS
        */

        speak(
            reply
        );


    }catch(error){

        console.error(
            "JARVIS ERROR:",
            error
        );

        addMsg(
            "ERRORE: " +
            error.message
        );

        setState(
            "idle"
        );

    }

}

/* =====================================================
   MICROFONO
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let listening =
    false;


if(Recognition){

    recognition =
        new Recognition();

    recognition.lang =
        "it-IT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening =
                true;

            micBtn.classList.add(
                "active"
            );

            setState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();

            if(text){

                textInput.value =
                    text;

                sendMessage();

            }

        };


    recognition.onerror =
        error => {

            console.error(
                "Microfono:",
                error
            );

            listening =
                false;

            micBtn.classList.remove(
                "active"
            );

            setState(
                "idle"
            );

        };


    recognition.onend =
        () => {

            listening =
                false;

            micBtn.classList.remove(
                "active"
            );

        };


    micBtn.addEventListener(
        "click",
        () => {

            if(listening){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }

        }
    );

}else{

    micBtn.style.opacity =
        ".3";

}
