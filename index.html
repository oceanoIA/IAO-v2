<script type="module">

import * as THREE from "three";


/* =====================================================
   J.A.R.V.I.S. HOLOGRAPHIC HUD
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.z = 5;


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,
        alpha:true

    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

container.appendChild(
    renderer.domElement
);


/* =====================================================
   COLORI JARVIS ORO
===================================================== */

const GOLD =
    new THREE.Color(
        0xFFD34E
    );

const GOLD_BRIGHT =
    new THREE.Color(
        0xFFF4B0
    );

const GOLD_DARK =
    new THREE.Color(
        0x9A6A00
    );


/* =====================================================
   GRUPPO HUD
===================================================== */

const hud =
    new THREE.Group();

scene.add(
    hud
);


/* =====================================================
   CREA ANELLO
===================================================== */

function createRing(
    radius,
    tube,
    color,
    opacity,
    segments = 160
){

    const geometry =
        new THREE.TorusGeometry(
            radius,
            tube,
            8,
            segments
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:color,

            transparent:true,

            opacity:opacity,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false

        });

    return new THREE.Mesh(
        geometry,
        material
    );

}


/* =====================================================
   ANELLI PRINCIPALI
===================================================== */

const ringOuter =
    createRing(
        1.55,
        .012,
        GOLD,
        .65
    );

const ringMiddle =
    createRing(
        1.25,
        .018,
        GOLD_BRIGHT,
        .8
    );

const ringInner =
    createRing(
        .88,
        .014,
        GOLD,
        .9
    );


hud.add(
    ringOuter,
    ringMiddle,
    ringInner
);


/* =====================================================
   ANELLI INCLINATI
===================================================== */

const ringTilt1 =
    createRing(
        1.38,
        .008,
        GOLD_BRIGHT,
        .45
    );

ringTilt1.rotation.x =
    Math.PI * .32;

ringTilt1.rotation.y =
    Math.PI * .15;


const ringTilt2 =
    createRing(
        1.05,
        .009,
        GOLD,
        .5
    );

ringTilt2.rotation.x =
    -Math.PI * .42;

ringTilt2.rotation.z =
    Math.PI * .2;


hud.add(
    ringTilt1,
    ringTilt2
);


/* =====================================================
   TACCHETTE HUD
===================================================== */

const tickGroup =
    new THREE.Group();

hud.add(
    tickGroup
);


const tickMaterial =
    new THREE.LineBasicMaterial({

        color:
            GOLD_BRIGHT,

        transparent:true,

        opacity:.65,

        blending:
            THREE.AdditiveBlending

    });


for(
    let i=0;
    i<72;
    i++
){

    const angle =
        (i / 72) *
        Math.PI *
        2;


    const radius =
        i % 6 === 0
            ? 1.62
            : 1.55;


    const length =
        i % 6 === 0
            ? .12
            : .055;


    const x1 =
        Math.cos(angle) *
        radius;


    const y1 =
        Math.sin(angle) *
        radius;


    const x2 =
        Math.cos(angle) *
        (radius - length);


    const y2 =
        Math.sin(angle) *
        (radius - length);


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([

                new THREE.Vector3(
                    x1,
                    y1,
                    0
                ),

                new THREE.Vector3(
                    x2,
                    y2,
                    0
                )

            ]);


    tickGroup.add(
        new THREE.Line(
            geometry,
            tickMaterial
        )
    );

}


/* =====================================================
   SEGMENTI RADIALI
===================================================== */

const segmentGroup =
    new THREE.Group();

hud.add(
    segmentGroup
);


for(
    let i=0;
    i<12;
    i++
){

    const angle =
        i *
        Math.PI /
        6;


    const radius =
        1.72;


    const gap =
        .22;


    const x1 =
        Math.cos(angle) *
        radius;


    const y1 =
        Math.sin(angle) *
        radius;


    const x2 =
        Math.cos(angle) *
        (radius - gap);


    const y2 =
        Math.sin(angle) *
        (radius - gap);


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([

                new THREE.Vector3(
                    x1,
                    y1,
                    0
                ),

                new THREE.Vector3(
                    x2,
                    y2,
                    0
                )

            ]);


    const material =
        new THREE.LineBasicMaterial({

            color:
                GOLD,

            transparent:true,

            opacity:.5,

            blending:
                THREE.AdditiveBlending

        });


    segmentGroup.add(
        new THREE.Line(
            geometry,
            material
        )
    );

}


/* =====================================================
   NUCLEO CENTRALE
===================================================== */

const coreGeometry =
    new THREE.CircleGeometry(
        .28,
        64
    );


const coreMaterial =
    new THREE.MeshBasicMaterial({

        color:
            GOLD_BRIGHT,

        transparent:true,

        opacity:.9,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false

    });


const core =
    new THREE.Mesh(
        coreGeometry,
        coreMaterial
    );


hud.add(
    core
);


/* =====================================================
   GLOW CENTRALE
===================================================== */

function createGlowTexture(){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 128;
    canvas.height = 128;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const gradient =
        ctx.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,230,1)"
    );

    gradient.addColorStop(
        .15,
        "rgba(255,225,100,.9)"
    );

    gradient.addColorStop(
        .4,
        "rgba(255,190,30,.45)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,180,0,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        128,
        128
    );


    return new THREE.CanvasTexture(
        canvas
    );

}


const glowMaterial =
    new THREE.SpriteMaterial({

        map:
            createGlowTexture(),

        transparent:true,

        opacity:.75,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false

    });


const glow =
    new THREE.Sprite(
        glowMaterial
    );


glow.scale.set(
    1.4,
    1.4,
    1
);


hud.add(
    glow
);


/* =====================================================
   LINEE DI SCANSIONE
===================================================== */

const scanMaterial =
    new THREE.LineBasicMaterial({

        color:
            GOLD_BRIGHT,

        transparent:true,

        opacity:.22,

        blending:
            THREE.AdditiveBlending

    });


const scanGeometry =
    new THREE.BufferGeometry()
        .setFromPoints([

            new THREE.Vector3(
                -1.8,
                0,
                0
            ),

            new THREE.Vector3(
                1.8,
                0,
                0
            )

        ]);


const scanLine =
    new THREE.Line(
        scanGeometry,
        scanMaterial
    );


hud.add(
    scanLine
);


/* =====================================================
   STATO ENERGIA
===================================================== */

let targetEnergy =
    .15;

let energy =
    .15;


function setState(
    state
){

    if(
        state === "thinking"
    ){

        targetEnergy =
            1.5;

    }

    else if(
        state === "speaking"
    ){

        targetEnergy =
            .85;

    }

    else if(
        state === "listening"
    ){

        targetEnergy =
            .65;

    }

    else{

        targetEnergy =
            .15;

    }

}


/* =====================================================
   ANIMAZIONE HUD
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now() *
        .001;


    energy +=
        (
            targetEnergy -
            energy
        ) *
        .045;


    /* ROTAZIONE */

    ringOuter.rotation.z +=
        .00035 +
        energy * .0008;


    ringMiddle.rotation.z -=
        .00055 +
        energy * .001;


    ringInner.rotation.z +=
        .0008 +
        energy * .0012;


    ringTilt1.rotation.z -=
        .0003;


    ringTilt2.rotation.z +=
        .00045;


    tickGroup.rotation.z =
        Math.sin(
            time * .12
        ) * .025;


    segmentGroup.rotation.z -=
        .00025 +
        energy * .0005;


    /* PULSAZIONE */

    const pulse =
        1 +
        Math.sin(
            time * 2.2
        ) *
        (.015 + energy * .025);


    hud.scale.set(
        pulse,
        pulse,
        pulse
    );


    coreMaterial.opacity =
        .65 +
        energy * .25;


    glowMaterial.opacity =
        .35 +
        energy * .3;


    /* SCANSIONE */

    scanLine.position.y =
        Math.sin(
            time * (
                .7 +
                energy
            )
        ) *
        1.25;


    scanMaterial.opacity =
        .12 +
        energy * .16;


    /* LEGGERA OSCILLAZIONE */

    hud.rotation.x =
        Math.sin(
            time * .18
        ) * .035;


    hud.rotation.y =
        Math.cos(
            time * .15
        ) * .035;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
