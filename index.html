content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — NEURAL CORE</title>


<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html,body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
    color:#fff;

    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}


/* =====================================================
   LOADING
===================================================== */

#loading{

    position:fixed;
    inset:0;

    z-index:1000;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;

    letter-spacing:4px;

    color:#ffd000;

    transition:opacity 1s ease;
}

#loading.hidden{

    opacity:0;
    pointer-events:none;

}


/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease,
        filter 1.2s ease;
}

body.mapMode #neuralCanvas{

    opacity:0;

    transform:scale(.45);

    filter:blur(15px);

    pointer-events:none;
}


/* =====================================================
   EARTH
===================================================== */

#earthContainer{

    position:fixed;
    inset:0;

    z-index:2;

    opacity:0;
    pointer-events:none;

    transform:scale(.55);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

body.mapMode #earthContainer{

    opacity:1;

    transform:scale(1);

    pointer-events:auto;
}

#earthCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:fixed;

    top:20px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;
}

.header h1{

    margin:0;

    font-size:35px;

    font-weight:300;

    letter-spacing:12px;

    text-shadow:
        0 0 15px #ffd000,
        0 0 35px rgba(255,200,0,.35);
}

.status{

    margin-top:7px;

    font:10px monospace;

    letter-spacing:3px;
}

#dot{

    color:#ffd000;

    text-shadow:
        0 0 10px currentColor;
}

body.mapMode .header h1{

    text-shadow:
        0 0 15px #168cff,
        0 0 35px rgba(30,140,255,.4);
}


/* =====================================================
   OROLOGIO
===================================================== */

#clockPanel{

    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{

    font-size:15px;

    letter-spacing:2px;

    color:#fff;
}

#date{

    margin-top:3px;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(255,210,0,.65);
}

body.mapMode #date{

    color:rgba(80,170,255,.8);
}


/* =====================================================
   CHAT — NUOVO DESIGN
===================================================== */

#chat{

    position:fixed;

    z-index:25;

    left:22px;
    top:125px;

    width:350px;

    max-height:calc(100vh - 245px);

    overflow-y:auto;

    display:flex;

    flex-direction:column;

    gap:10px;

    padding:18px;

    scrollbar-width:none;


    /* ==============================================
       VETRO NERO
    ============================================== */

    background:
        linear-gradient(
            135deg,
            rgba(5,7,10,.78),
            rgba(0,0,0,.58)
        );

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);


    /* ==============================================
       FORMA ROTONDA
    ============================================== */

    border-radius:30px;


    /* ==============================================
       BORDO
    ============================================== */

    border:
        1px solid
        rgba(255,208,0,.25);


    /* ==============================================
       BAGLIORE
    ============================================== */

    box-shadow:

        0 0 30px
        rgba(0,0,0,.9),

        0 0 60px
        rgba(255,208,0,.035),

        inset 0 0 30px
        rgba(255,255,255,.025);

    
    /* ==============================================
       EFFETTO SFUMATURA
    ============================================== */

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0,
            black 15px,
            black 92%,
            transparent 100%
        );
}

#chat::-webkit-scrollbar{

    display:none;
}


/* =====================================================
   MESSAGGI
===================================================== */

.message{

    max-width:100%;

    padding:11px 15px;

    border-radius:20px;

    font-size:13px;

    line-height:1.5;

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    animation:
        messageIn .3s ease;
}

@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateX(-12px)
            scale(.97);
    }

    to{

        opacity:1;

        transform:
            translateX(0)
            scale(1);
    }
}


/* =====================================================
   MESSAGGIO UTENTE
===================================================== */

.user{

    align-self:flex-end;

    background:
        rgba(255,190,0,.07);

    border:
        1px solid

    border-right:

    box-shadow:
        0 0 15px

}


/* =====================================================
   MESSAGGIO JARVIS
===================================================== */

.jarvis{

    background:

    border:
        1px solid

}


/* =====================================================
   MAP HUD
===================================================== */

#mapHud{

    z-index:15;

    left:50%;
    top:90px;

    text-align:center;

body.mapMode #mapHud{

}

#mapTitle{

    text-shadow:

}

#coordinates{

}


/* =====================================================

===================================================== */

#locationInfo{

#locationInfo.visible{

#locationName{

/* =====================================================

===================================================== */

.inputArea{

===================================================== */

    top:50%;

    height:25px;

    opacity:0;

    pointer-events:none;

    transition:

body.mapMode #mapCrosshair{

    box-shadow:

    width:25px;

    top:12px;
    left:0;
}

#mapCrosshair::after{

    width:1px;
    height:25px;

    left:12px;

===================================================== */

let memory=[];

try{

    memory=JSON.parse(
        localStorage.getItem(

        ) || "[]"
    );

}catch{

    memory=[];

}

memory=memory.slice(-40);


function saveMemory(){

    memory=memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );

}


function remember(
    role,
    content
){

    if(!content)return;

    memory.push({

        role,
        content,
        time:Date.now()

    });

    saveMemory();

}


saveMemory();

   STATO
===================================================== */

updateClock();

setInterval(

/* =====================================================
   CHAT
===================================================== */

function addMessage(

){

        );

}


/* =====================================================

const earthScene =

const earthCamera =

/* =====================================================
   COMANDO MAPPA
===================================================== */

function isMapCommand(text){

    const t =
        text.toLowerCase();

    return(

        t.includes(
            "apri la mappa"
        ) ||

        t.includes(
            "apri mappa"
        ) ||

        t.includes(
            "mostrami la mappa"
        ) ||

        t.includes(
            "mostra la mappa"
        ) ||

        t.includes(
            "mappa del mondo"
        ) ||

        t==="mappa"

    );

}


/* =====================================================
   ESTRAZIONE LUOGO
===================================================== */

function extractLocation(
    text
){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower =
        text.toLowerCase();


    for(
        const prefix of patterns
    ){

        const index =
            lower.indexOf(
                prefix
            );


        if(index!==-1){

            let place =
                text.substring(

                    index +
                    prefix.length

                ).trim();


            place =
                place.replace(

                    /^(la|il|lo|un|una|a|ad)\s+/i,

                    ""

                );


            if(place.length>1){

                return place;

            }

        }

    }

    return null;

}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(
    place
){

    setState("thinking");

    coordinates.textContent =
        "SEARCHING LOCATION...";


    try{

        const url =
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(
                place
            );


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }


        const result =
            results[0];


        const lat =
            parseFloat(
                result.lat
            );


        const lon =
            parseFloat(
                result.lon
            );


        const name =
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");


        showLocation(
            name,
            lat,
            lon
        );


        return{

            name,
            lat,
            lon

        };


    }catch(error){

        console.error(error);

        coordinates.textContent =
            "LOCATION NOT FOUND";

        setState("idle");

        addMessage(

            "jarvis",

            "Non riesco a trovare questo luogo."

        );

        return null;

    }

}

   COORDINATE
===================================================== */

function formatCoordinates(
    lat,
    lon
){

    const latDir =
        lat>=0
        ? "N"
        : "S";

    const lonDir =
        lon>=0
        ? "E"
        : "W";


    return(

        Math.abs(lat).toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon).toFixed(4)
        +
        "° "
        +
        lonDir

    );

}

===================================================== */

let zoomAnimating=false;

let zoomProgress=1;

let zoomStart=3.3;

let zoomEnd=1.55;

let targetQuaternion =
    new THREE.Quaternion();


function latLonToVector3(

    lat,
    lon,
    radius

){

    const phi =
        (90-lat)
        *
        Math.PI/180;


    const theta =
        (lon+180)
        *
        Math.PI/180;


    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );

}


function focusEarth(

    lat,
    lon

){

    openMap();


    const target =
        latLonToVector3(

            lat,
            lon,
            1

        );


    marker.position.copy(

        target
        .clone()
        .multiplyScalar(
            1.025
        )

    );


    marker.visible=true;

    markerRing.visible=true;


    const direction =
        target
        .clone()
        .normalize();


    const front =
        new THREE.Vector3(
            0,
            0,
            1
        );


    targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion.setFromUnitVectors(

        direction,

        front

    );


    zoomStart =
        earthCamera.position.length();


    if(zoomStart<2){

        zoomStart=3.3;

        earthCamera.position.set(

            0,
            0,
            zoomStart

        );

    }


    zoomEnd=1.55;

    zoomProgress=0;

    zoomAnimating=true;

    controls.enabled=false;

    setState("thinking");

}


/* =====================================================
   RETE NEURALE
===================================================== */

let neuralWidth =
    innerWidth;

let neuralHeight =
    innerHeight;

let neuralCx =
    neuralWidth/2;

let neuralCy =
    neuralHeight/2;


let neuralRadius =
    Math.min(

        neuralWidth,

        neuralHeight

    )*.30;


let neuralRotation=0;

let nodes=[];


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth =
        innerWidth;

    neuralHeight =
        innerHeight;


    const dpr =
        Math.min(

            devicePixelRatio || 1,

            2

        );


    neuralCanvas.width =
        neuralWidth*dpr;

    neuralCanvas.height =
        neuralHeight*dpr;


    neuralCanvas.style.width =
        neuralWidth+"px";

    neuralCanvas.style.height =
        neuralHeight+"px";


    neuralCtx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );


    neuralCx =
        neuralWidth/2;

    neuralCy =
        neuralHeight/2;


    neuralRadius =
        Math.min(

            neuralWidth,

            neuralHeight

        )*.30;


    createNeuralNodes();

}


/* =====================================================
   NODI
===================================================== */

function createNeuralNodes(){

    nodes=[];


    for(
        let i=0;
        i<145;
        i++
    ){

        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .72+
                    Math.random()*.55
                ),

            size:
                .7+
                Math.random()*1.8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            /* ==========================================
               COLORE DINAMICO
               CIRCA 12% DEI NODI SONO VIOLA
            ========================================== */

            special:
                Math.random()<.12

        });

    }

}


/* =====================================================
   ANIMAZIONE RETE NEURALE
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );


    const time =
        performance.now()/1000;


    let speed=1;

    let energy=.2;


    if(state==="listening"){

        speed=4;

        energy=1.2;

    }


    if(state==="thinking"){

        speed=7;

        energy=2;

    }


    if(state==="speaking"){

        speed=5;

        energy=1.5;

    }


    neuralRotation +=
        .004*speed;


    neuralCtx.fillStyle =
        "rgba(0,0,0,.28)";


    neuralCtx.fillRect(

        0,
        0,
        neuralWidth,
        neuralHeight

    );


    let targetColor;


    if(

        state==="listening" ||

        state==="thinking" ||

        state==="speaking"

    ){

        targetColor={

            r:25,
            g:140,
            b:255

        };

    }else{

        targetColor={

            r:255,
            g:195,
            b:0

        };

    }


    window.jarvisColor =
        window.jarvisColor ||
        {

            r:255,
            g:195,
            b:0

        };


    jarvisColor.r +=
        (
            targetColor.r -
            jarvisColor.r
        )*.055;


    jarvisColor.g +=
        (
            targetColor.g -
            jarvisColor.g
        )*.055;


    jarvisColor.b +=
        (
            targetColor.b -
            jarvisColor.b
        )*.055;


    const r =
        Math.round(
            jarvisColor.r
        );

    const g =
        Math.round(
            jarvisColor.g
        );

    const b =
        Math.round(
            jarvisColor.b
        );


    const pulse =
        (
            Math.sin(time*4)+1
        )/2;


    const glowSize =
        neuralRadius *
        (
            1.05+
            energy*.7+
            pulse*.18
        );


    const gradient =
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glowSize

        );


    gradient.addColorStop(

        0,

        `rgba(${r},${g},${b},.48)`

    );


    gradient.addColorStop(

        .35,

        `rgba(${r},${g},${b},.15)`

    );


    gradient.addColorStop(

        1,

        "rgba(0,0,0,0)"

    );


    neuralCtx.fillStyle =
        gradient;


    neuralCtx.beginPath();


    neuralCtx.arc(

        neuralCx,
        neuralCy,
        glowSize,
        0,
        Math.PI*2

    );


    neuralCtx.fill();


    const projected=[];


    nodes.forEach(n=>{

        const rr =
            n.r +
            Math.sin(

                time*3+
                n.phase

            )
            *
            energy*
            7;


        let x =
            rr *
            Math.sin(n.phi) *
            Math.cos(

                n.theta+
                neuralRotation

            );


        let y =
            rr *
            Math.cos(n.phi);


        let z =
            rr *
            Math.sin(n.phi) *
            Math.sin(

                n.theta+
                neuralRotation

            );


        if(state!=="idle"){

            x +=
                Math.sin(

                    time*2+
                    n.phase

                )
                *
                energy*
                7;


            y +=
                Math.cos(

                    time*2.5+
                    n.phase

                )
                *
                energy*
                7;

        }


        const perspective =
            430 /
            (
                430+z
            );


        projected.push({

            x:
                neuralCx+
                x*perspective,

            y:
                neuralCy+
                y*perspective,

            z,

            size:
                n.size*
                perspective,

            alpha:
                Math.max(

                    .1,

                    Math.min(

                        1,

                        (z+neuralRadius)/
                        (neuralRadius*2)

                    )

                ),

            phase:n.phase,

            special:n.special

        });

    });


    const maxDist =
        state==="thinking"
        ? 110
        : 82;


    for(

        let i=0;

        i<projected.length;

        i++

    ){

        for(

            let j=i+1;

            j<projected.length;

            j++

        ){

            const a =
                projected[i];

            const c =
                projected[j];


            const dx =
                a.x-c.x;

            const dy =
                a.y-c.y;


            const dist =
                Math.sqrt(

                    dx*dx+
                    dy*dy

                );


            if(dist<maxDist){

                const alpha =
                    (
                        1-
                        dist/maxDist
                    )
                    *
                    .3*
                    a.alpha;


                neuralCtx.beginPath();


                neuralCtx.moveTo(

                    a.x,
                    a.y

                );


                neuralCtx.lineTo(

                    c.x,
                    c.y

                );


                neuralCtx.strokeStyle =

                    `rgba(${r},${g},${b},${alpha})`;


                neuralCtx.lineWidth=.65;


                neuralCtx.stroke();

            }

        }

    }


    projected.forEach(n=>{

        const flicker =
            (
                Math.sin(

                    time*7+
                    n.phase

                )+1

            )/2;


        const size =
            n.size+
            flicker*
            (

                state==="thinking"
                ? 1.8
                : .7

            );


        /* ============================================
           COLORE DINAMICO
        ============================================ */

        let particleColor;


        if(n.special){

            const wave =
                (
                    Math.sin(
                        time*2.2+
                        n.phase
                    )+1
                )/2;


            /* Viola che cambia intensità */

            particleColor={

                r:180+
                    wave*60,

                g:45+
                    wave*35,

                b:220+
                    wave*35

            };

        }else{

            particleColor={

                r:r,
                g:g,
                b:b

            };

        }


        const pr =
            Math.round(
                particleColor.r
            );

        const pg =
            Math.round(
                particleColor.g
            );

        const pb =
            Math.round(
                particleColor.b
            );


        /* GLOW */

        neuralCtx.fillStyle =

            `rgba(${pr},${pg},${pb},${n.alpha*.28})`;


        neuralCtx.beginPath();


        neuralCtx.arc(

            n.x,
            n.y,
            size*4,

            0,
            Math.PI*2

        );


        neuralCtx.fill();


        /* PALLINA */

        neuralCtx.fillStyle =

            `rgba(${pr},${pg},${pb},${n.alpha})`;


        neuralCtx.beginPath();


        neuralCtx.arc(

            n.x,
            n.y,
            size,

            0,
            Math.PI*2

        );


        neuralCtx.fill();

    });


    const core =
        5+
        pulse*2+
        energy*2;


    neuralCtx.fillStyle =

        `rgba(${r},${g},${b},.38)`;


    neuralCtx.beginPath();


    neuralCtx.arc(

        neuralCx,
        neuralCy,
        core*5,

        0,
        Math.PI*2

    );


    neuralCtx.fill();


    neuralCtx.fillStyle =
        "#fff";


    neuralCtx.beginPath();


    neuralCtx.arc(

        neuralCx,
        neuralCy,
        core,

        0,
        Math.PI*2

    );


    neuralCtx.fill();

}


/* =====================================================
   TERRA ANIMATA
===================================================== */

let markerPulse=0;


function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );


    if(

        mapMode &&
        zoomAnimating

    ){

        zoomProgress += .012;


        if(zoomProgress>=1){

            zoomProgress=1;

            zoomAnimating=false;

            controls.enabled=true;

            setState("idle");

        }


        const eased =
            1-
            Math.pow(

                1-zoomProgress,
                3

            );


        const distance =
            zoomStart+
            (

                zoomEnd-
                zoomStart

            )
            *
            eased;


        const cameraDirection =
            earthCamera.position
            .clone()
            .normalize();


        earthCamera.position.copy(

            cameraDirection
            .multiplyScalar(
                distance
            )

        );


        earthGroup.quaternion.slerp(

            targetQuaternion,

            .045

        );

    }


    controls.update();


    if(marker.visible){

        markerPulse += .08;


        const scale =
            1+
            Math.sin(
                markerPulse
            )*.3;


        marker.scale.set(

            scale,
            scale,
            scale

        );


        markerRing.visible=true;


        markerRing.position.copy(
            marker.position
        );


        markerRing.lookAt(
            earthCamera.position
        );


        markerRing.scale.set(

            scale,
            scale,
            scale

        );

    }


    earthRenderer.render(

        earthScene,
        earthCamera

    );

}

function localCommand(text){

    const t =
        text.toLowerCase();


    if(

        t.includes(
            "che ore sono"
        ) ||

        t.includes(
            "che ora è"
        ) ||

        t.includes(
            "che ora e"
        )

    ){

        return(

            "Sono le "
            +
            new Date()
            .toLocaleTimeString(

                "it-IT",

                {

                    hour:"2-digit",
                    minute:"2-digit"

                }

            )
            +
            "."

        );

    }


    if(

        t.includes(
            "che giorno è"
        ) ||

        t.includes(
            "che giorno e"
        )

    ){

        return(

            "Oggi è "
            +
            new Date()
            .toLocaleDateString(

                "it-IT",

                {

                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"

                }

            )
            +
            "."

        );

    }


    if(

        t.includes(
            "mia posizione"
        ) ||

        t.includes(
            "dove sono"
        )

    ){

        showMyLocation();

        return "__LOCATION__";

    }


    if(isMapCommand(t)){

        openMap();

        return "Mappa terrestre attivata.";

    }


    return null;

}

async function sendMessage(){

    const text =
        input.value.trim();


    if(
        !text ||
        busy
    ){

        return;

    }


    busy=true;


    input.blur();

    input.value="";


    addMessage(

        "user",

        text

    );


    remember(

        "user",

        text

    );


    const place =
        extractLocation(
            text
        );


    if(place){

        openMap();


        const answer =
            addMessage(

                "jarvis",

                "Localizzazione di "
                +
                place
                +
                "..."

            );


        const result =
            await searchPlace(
                place
            );


        if(result){

            answer.textContent =

                "Ho individuato "
                +
                result.name
                +
                ".";


            remember(

                "assistant",

                answer.textContent

            );

        }


        finish();

        return;

    }


    const local =
        localCommand(
            text
        );


    if(local){

        if(
            local !==
            "__LOCATION__"
        ){

            addMessage(

                "jarvis",

                local

            );


            remember(

                "assistant",

                local

            );


            if(conversationMode){

                speak(local);

            }else{

                setState("idle");

            }

        }


        finish();

        return;

    }


    input.disabled=true;

    send.disabled=true;

    mic.disabled=true;

    conversation.disabled=true;


    setState(
        "thinking"
    );


    const answer =
        addMessage(

            "jarvis",

            "Analisi del Neural Core..."

        );


    const recentMemory =
        memory.slice(-24);


    const intelligentContext={

        assistantName:
            "JARVIS",

        language:
            "it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        mapMode:
            mapMode,

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Comprendi il significato della domanda e non limitarti a ripetere parole chiave.",

            "Se hai abbastanza informazioni, rispondi direttamente.",

            "Se una domanda è ambigua, fai una domanda breve per capire meglio.",

            "Usa la memoria della conversazione quando è utile.",

            "Non inventare informazioni quando non sei sicuro.",

            "Spiega le cose in modo naturale e intelligente.",

            "Per domande complesse, ragiona per passaggi ma presenta una risposta chiara.",

            "Non dire continuamente che sei un'intelligenza artificiale.",

            "Comportati come un assistente personale chiamato JARVIS."

        ]

    };


    try{

        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            message:text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }

            );


        if(!response.ok){

            throw new Error(

                "HTTP "
                +
                response.status

            );

        }


        const data =
            await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent =
            data.reply;


        remember(

            "assistant",

            data.reply

        );


        if(conversationMode){

            speak(
                data.reply
            );

        }else{

            setState(
                "idle"
            );

        }


    }catch(error){

        console.error(error);


        answer.textContent =

            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        setState(
            "idle"
        );

    }


    finish();

}

/* =====================================================
   VOCI
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        setState("idle");

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";

    utterance.rate =
        .88;

    utterance.pitch =
        .65;

    utterance.volume =
        1;


    utterance.onstart = ()=>{

        setState(
            "speaking"
        );

    };


    utterance.onend = ()=>{

        setState(
            "idle"
        );


        if(

            conversationMode &&
            wakeMode

        ){

            setTimeout(

                startWakeWord,

                600

            );

        }

    };


    utterance.onerror = ()=>{

        setState(
            "idle"
        );

    };


    speechSynthesis.speak(
        utterance
    );

}

        input.placeholder =
            "Comunica con JARVIS...";


        if(
            state==="listening"
        ){

            setState(
                "idle"
            );

        }

    };


    mic.onclick = ()=>{

        if(busy)return;


        conversationMode=true;

        wakeMode=false;


        conversation.classList.add(
            "active"
        );


        conversation.textContent =
            "🔵";


        if(listening){

            recognition.stop();

            return;

        }


        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    };


}else{

    mic.disabled=true;

}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(

        !Recognition ||
        !conversationMode ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition

    ){

        return;

    }


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeRecognition.onresult =
        event=>{

            for(

                let i=event.resultIndex;

                i<event.results.length;

                i++

            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase();


                if(
                    text.includes(
                        "jarvis"
                    )
                ){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition=null;

                    activateJarvis();

                    return;

                }

            }

        };


    wakeRecognition.onerror = ()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(

                startWakeWord,

                1200

            );

        }

    };


    wakeRecognition.onend = ()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(

                startWakeWord,

                600

            );

        }

    };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition=null;

    }

}


function stopWakeWord(){

    if(wakeRecognition){

        try{

            wakeRecognition.stop();

        }catch{}


        wakeRecognition=null;

    }

}


function activateJarvis(){

    if(

        busy ||
        listening

    ){

        return;

    }


    setState(
        "listening"
    );


    input.placeholder =
        "JARVIS ti ascolta...";


    setTimeout(()=>{

        try{

            recognition.start();

        }catch{}

    },250);

}
