/* =====================================================
BASE
===================================================== */

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;

background:#01030A;  

font-family:Arial,sans-serif;

}

body{
background:
radial-gradient(
circle at center,
#07152B 0%,
#020817 48%,
#000000 100%
);
}

/* =====================================================
THREE.JS
===================================================== */

#webgl-container{
position:fixed;
inset:0;
z-index:1;
}

/* =====================================================
VIGNETTE
===================================================== */

.vignette{
position:fixed;
inset:0;

z-index:3;  

pointer-events:none;  

background:  
    radial-gradient(  
        circle at center,  
        transparent 30%,  
        rgba(0,0,0,.2) 65%,  
        rgba(0,0,0,.8) 100%  
    );

}

/* =====================================================
TITOLO
===================================================== */

.jarvis-title{

position:fixed;  

top:2.4%;  
left:50%;  

transform:  
    translateX(-50%);  

z-index:30;  

color:  
    rgba(220,240,255,.9);  

font-size:  
    clamp(20px,2.8vw,31px);  

font-weight:300;  

letter-spacing:  
    clamp(5px,1vw,8px);  

white-space:nowrap;  

text-shadow:  
    0 0 10px  
    rgba(0,102,255,.45),  

    0 0 25px  
    rgba(0,168,255,.2);  

pointer-events:none;

}

/* =====================================================
DATA / ORA
===================================================== */

.datetime{

position:fixed;  

top:18px;  
right:24px;  

z-index:30;  

display:flex;  

flex-direction:column;  

align-items:flex-end;  

gap:3px;  

font-family:monospace;  

pointer-events:none;

}

.time{

color:  
    rgba(100,180,255,.8);  

font-size:11px;  

letter-spacing:2px;  

text-shadow:  
    0 0 8px  
    rgba(0,102,255,.55);

}

.date{

color:  
    rgba(100,170,255,.5);  

font-size:8px;  

letter-spacing:1px;

}

/* =====================================================
CHAT
===================================================== */

#chat{

position:fixed;  

left:50%;  
bottom:92px;  

transform:  
    translateX(-50%);  

z-index:40;  

width:  
    min(620px,88%);  

text-align:center;  

pointer-events:none;

}

.msg{

display:inline-block;  

max-width:100%;  

padding:10px 18px;  

border:  
    1px solid  
    rgba(0,102,255,.4);  

border-radius:24px;  

background:  
    rgba(2,12,28,.5);  

backdrop-filter:  
    blur(14px);  

-webkit-backdrop-filter:  
    blur(14px);  

color:  
    rgba(235,245,255,.94);  

font-size:12px;  

line-height:1.45;  

white-space:pre-wrap;  

box-shadow:  
    0 0 18px  
    rgba(0,102,255,.08);

}

/* =====================================================
COMMAND BAR
===================================================== */

.command-wrapper{

position:fixed;  

left:50%;  
bottom:23px;  

transform:  
    translateX(-50%);  

z-index:50;  

width:  
    min(650px,90%);  

display:flex;  

align-items:center;  

padding:  
    6px 7px 6px 20px;  

border:  
    1px solid  
    rgba(0,102,255,.5);  

border-radius:40px;  

background:  
    rgba(2,10,24,.58);  

backdrop-filter:  
    blur(20px);  

-webkit-backdrop-filter:  
    blur(20px);  

box-shadow:  
    0 0 30px  
    rgba(0,102,255,.12),  

    inset 0 0 20px  
    rgba(0,102,255,.025);

}

.command-wrapper:focus-within{

border-color:  
    var(--jarvis-bright);  

box-shadow:  

    0 0 25px  
    rgba(0,102,255,.28),  

    0 0 55px  
    rgba(0,168,255,.08);

}

/* =====================================================
INPUT
===================================================== */

#textInput{

flex:1;  

min-width:0;  

border:none;  

outline:none;  

background:transparent;  

color:white;  

font-family:Arial,sans-serif;  

font-size:14px;  

padding:12px 5px;

}

#textInput::placeholder{

color:  
    rgba(150,190,230,.38);

}

/* =====================================================
MICROFONO
===================================================== */

#micBtn{

width:34px;  
height:34px;  

margin-right:7px;  

border:none;  

background:transparent;  

color:  
    rgba(150,210,255,.8);  

cursor:pointer;  

display:flex;  

align-items:center;  
justify-content:center;

}

.mic-icon{

width:8px;  
height:14px;  

border:  
    1.3px solid  
    currentColor;  

border-radius:60px;  

position:relative;

}

.mic-icon::after{

content:"";  

position:absolute;  

left:50%;  
bottom:-6px;  

width:12px;  
height:7px;  

transform:  
    translateX(-50%);  

border:  
    1.3px solid  
    currentColor;  

border-top:none;  

border-radius:  
    0 0 8px 8px;

}

#micBtn:hover{

color:  
    var(--jarvis-bright);  

filter:  
    drop-shadow(  
        0 0 8px  
        rgba(0,168,255,.7)  
    );

}

#micBtn.active{

color:  
    #8CC8FF;  

filter:  
    drop-shadow(  
        0 0 8px  
        rgba(0,102,255,.9)  
    );

}

/* =====================================================
INVIA
===================================================== */

#sendBtn{

height:39px;  

padding:0 17px;  

border:  
    1px solid  
    rgba(0,102,255,.5);  

border-radius:22px;  

background:  
    rgba(0,102,255,.08);  

color:  
    rgba(190,225,255,.88);  

font-size:10px;  

letter-spacing:2px;  

cursor:pointer;  

transition:.2s;

}

#sendBtn:hover{

color:white;  

border-color:  
    var(--jarvis-bright);  

background:  
    rgba(0,102,255,.18);  

box-shadow:  
    0 0 15px  
    rgba(0,102,255,.25);

}

/* =====================================================
VOCE
===================================================== */

#voiceBtn{

position:fixed;  

right:22px;  
bottom:24px;  

z-index:60;  

height:39px;  

padding:0 15px;  

border:  
    1px solid  
    rgba(0,102,255,.5);  

border-radius:22px;  

background:  
    rgba(2,10,24,.82);  

color:  
    rgba(180,220,255,.82);  

font-size:10px;  

letter-spacing:1.5px;  

cursor:pointer;  

backdrop-filter:  
    blur(12px);  

transition:.2s;

}

#voiceBtn:hover{

color:white;  

border-color:  
    var(--jarvis-bright);  

box-shadow:  
    0 0 15px  
    rgba(0,102,255,.4);

}

/* =====================================================
VOICE PANEL
===================================================== */

#voicePanel{

position:fixed;  

right:22px;  
bottom:72px;  

z-index:100;  

width:  
    min(330px,calc(100% - 30px));  

padding:15px;  

display:none;  

border:  
    1px solid  
    rgba(0,102,255,.45);  

border-radius:18px;  

background:  
    rgba(1,8,20,.96);  

backdrop-filter:  
    blur(20px);  

box-shadow:  
    0 0 35px  
    rgba(0,102,255,.25);

}

#voicePanel.active{

display:block;

}

.voice-title{

color:  
    rgba(210,235,255,.95);  

font-size:11px;  

letter-spacing:2px;  

margin-bottom:10px;

}

#voiceSelector{

width:100%;  

padding:11px;  

border:  
    1px solid  
    rgba(0,102,255,.35);  

border-radius:10px;  

outline:none;  

background:  
    rgba(0,15,38,.95);  

color:  
    rgba(215,235,255,.9);  

font-size:11px;

}

#voiceTest{

width:100%;  

margin-top:10px;  

padding:9px;  

border:  
    1px solid  
    rgba(0,102,255,.35);  

border-radius:10px;  

background:  
    rgba(0,102,255,.07);  

color:  
    rgba(190,225,255,.8);  

cursor:pointer;  

font-size:10px;  

letter-spacing:1px;

}

#voiceTest:hover{

border-color:  
    var(--jarvis-bright);  

color:white;  

box-shadow:  
    0 0 12px  
    rgba(0,102,255,.2);

}

/* =====================================================
MAPPA TATTICA
===================================================== */

#tacticalMap{

position:fixed;  

inset:0;  

z-index:20;  

display:none;  

background:  

    radial-gradient(  
        circle at center,  
        #08162D 0%,  
        #020817 65%,  
        #000000 100%  
    );

}

#tacticalMap.active{

display:block;  

animation:  
    mapIn .45s ease;

}

@keyframes mapIn{

from{  

    opacity:0;  

    transform:  
        scale(1.015);  
}  

to{  

    opacity:1;  

    transform:  
        scale(1);  
}

}

/* =====================================================
HEADER MAPPA
===================================================== */

.map-header{

position:absolute;  

top:2.4%;  
left:50%;  

transform:  
    translateX(-50%);  

z-index:600;  

color:  
    rgba(210,235,255,.95);  

font-family:Arial,sans-serif;  

font-size:  
    clamp(24px,4vw,42px);  

font-weight:300;  

letter-spacing:  
    clamp(6px,1.3vw,12px);  

white-space:nowrap;  

text-shadow:  

    0 0 12px  
    rgba(0,102,255,.6),  

    0 0 30px  
    rgba(0,168,255,.25);  

pointer-events:none;

}

/* =====================================================
MAPPA
===================================================== */

#map{

position:absolute;  

top:3cm;  
right:3cm;  
bottom:3cm;  
left:3cm;  

overflow:hidden;  

border-radius:28px;  

background:#071012;  

box-shadow:  

    0 0 35px  
    rgba(0,0,0,.65),  

    0 0 70px  
    rgba(0,102,255,.12);  

border:  
    1px solid  
    rgba(0,102,255,.3);

}

.map-overlay{

position:absolute;  

inset:0;  

z-index:400;  

pointer-events:none;  

border-radius:28px;  

box-shadow:  

    inset 0 0 80px  
    rgba(0,0,0,.28),  

    inset 0 0 25px  
    rgba(0,102,255,.06);

}

/* =====================================================
CHIUSURA MAPPA
===================================================== */

#closeMap{

position:absolute;  

top:28px;  
left:34px;  

z-index:700;  

width:38px;  
height:38px;  

border:  
    1px solid  
    rgba(0,102,255,.6);  

border-radius:50%;  

background:  
    rgba(0,10,25,.9);  

color:  
    rgba(190,225,255,.9);  

cursor:pointer;  

font-size:19px;  

display:flex;  

align-items:center;  
justify-content:center;  

backdrop-filter:  
    blur(10px);  

transition:.2s;

}

#closeMap:hover{

color:white;  

border-color:  
    var(--jarvis-bright);  

box-shadow:  
    0 0 15px  
    rgba(0,102,255,.5);

}

/* =====================================================
CONTROLLI MAPLIBRE
===================================================== */

.maplibregl-ctrl-group{

background:  
    rgba(0,10,25,.9)!important;  

border:  
    1px solid  
    rgba(0,102,255,.4)!important;  

border-radius:12px!important;  

overflow:hidden;  

box-shadow:  
    0 0 15px  
    rgba(0,102,255,.15);

}

.maplibregl-ctrl-group button{

background:  
    transparent!important;  

color:  
    #9FD8FF!important;

}

.maplibregl-ctrl-group button:hover{

background:  
    rgba(0,102,255,.15)!important;

}

.maplibregl-ctrl-attrib{

background:  
    rgba(0,5,15,.75)!important;  

color:  
    rgba(150,200,255,.4)!important;  

font-size:8px!important;

}

.maplibregl-ctrl-attrib a{

color:  
    rgba(100,180,255,.55)!important;

}

/* =====================================================
MARKER JARVIS
===================================================== */

.jarvis-map-marker{

width:20px;  
height:20px;  

border-radius:50%;  

border:  
    2px solid  
    #008CFF;  

background:  
    rgba(0,102,255,.2);  

box-shadow:  

    0 0 15px  
    rgba(0,102,255,1),  

    0 0 35px  
    rgba(0,168,255,.5);  

position:relative;  

animation:  
    markerPulse 1.5s infinite;

}

.jarvis-map-marker::after{

content:"";  

position:absolute;  

left:50%;  
top:50%;  

width:5px;  
height:5px;  

transform:  
    translate(-50%,-50%);  

border-radius:50%;  

background:#E8F5FF;  

box-shadow:  
    0 0 8px  
    #00A8FF;

}

@keyframes markerPulse{

0%,100%{  

    transform:scale(1);  

    box-shadow:  

        0 0 15px  
        rgba(0,102,255,.9),  

        0 0 35px  
        rgba(0,168,255,.4);  
}  

50%{  

    transform:scale(1.18);  

    box-shadow:  

        0 0 22px  
        rgba(0,140,255,1),  

        0 0 50px  
        rgba(0,168,255,.6);  
}

}

/* =====================================================
POPUP
===================================================== */

.maplibregl-popup-content{

background:  
    rgba(2,10,25,.97)!important;  

color:  
    rgba(220,240,255,.95)!important;  

border:  
    1px solid  
    rgba(0,102,255,.45);  

border-radius:10px;  

padding:10px 14px;  

box-shadow:  
    0 0 20px  
    rgba(0,102,255,.25);

}

.maplibregl-popup-close-button{

color:  
    #00A8FF!important;  

font-size:18px;

}

WEB SEARCH
===================================================== */

#webSearchPanel{

position:fixed;  

inset:0;  

z-index:500;  

display:none;  

background:  
    rgba(0,5,15,.96);  

backdrop-filter:  
    blur(18px);  

-webkit-backdrop-filter:  
    blur(18px);

}

#webSearchPanel.active{

display:block;  

animation:  
    webPanelIn .3s ease;

}

@keyframes webPanelIn{

from{  

    opacity:0;  

    transform:  
        scale(.985);  
}  

to{  

    opacity:1;  

    transform:  
        scale(1);  
}

}

.web-search-header{

position:absolute;  

top:18px;  
left:50%;  

transform:  
    translateX(-50%);  

z-index:520;

    rgba(210,235,255,.95);  

font-size:13px;  

letter-spacing:4px;  

white-space:nowrap;  

text-shadow:  

    0 0 12px  
    rgba(0,102,255,.6),  

    0 0 25px  
    rgba(0,168,255,.2);

}

#webSearchFrame{

position:absolute;  

top:58px;  

left:3%;  
right:3%;  

bottom:3%;  

width:94%;  

height:  
    calc(97% - 58px);  

border:  
    1px solid  
    rgba(0,102,255,.35);  

border-radius:20px;  

background:#fff;  

box-shadow:  
    0 0 40px  
    rgba(0,102,255,.15);

}

#closeWebSearch{

position:absolute;  

top:14px;  
right:20px;  

z-index:530;  

width:36px;  
height:36px;  

border:  
    1px solid  
    rgba(0,102,255,.5);  

border-radius:50%;  

background:  
    rgba(0,10,25,.92);  

color:  
    rgba(190,225,255,.9);  

cursor:pointer;  

font-size:20px;  

display:flex;  

align-items:center;  
justify-content:center;  

transition:.2s;

}

#closeWebSearch:hover{

color:white;  

border-color:  
    #00A8FF;  

box-shadow:  
    0 0 15px  
    rgba(0,102,255,.5);

}

/* =====================================================
MOBILE

.jarvis-title{  

    top:2.2%;

#closeMap{  

    top:24px;

    right:12px;

    width:

}

}

@media(max-width:430px){

#map{  

    top:2.2cm;  
    right:2.2cm;  
    bottom:2.2cm;  
    left:2.2cm;  
}

}

function createGlow(){

const canvas =  
    document.createElement(  
        "canvas"  
    );  

canvas.width =  
    64;  

canvas.height =  
    64;  


const ctx =  
    canvas.getContext(  
        "2d"  
    );  


const gradient =  
    ctx.createRadialGradient(  
        32,  
        32,  
        0,  
        32,  
        32,  
        32  
    );  


gradient.addColorStop(  
    0,  
    "rgba(255,255,255,1)"  
);  

gradient.addColorStop(  
    .2,  
    "rgba(210,235,255,1)"  
);  

gradient.addColorStop(  
    .4,  
    "rgba(0,168,255,.95)"  
);  

gradient.addColorStop(  
    .7,  
    "rgba(0,102,255,.3)"  
);  

gradient.addColorStop(  
    1,  
    "rgba(0,0,0,0)"  
);  


ctx.fillStyle =  
    gradient;  


ctx.fillRect(  
    0,  
    0,  
    64,  
    64  
);  


return new THREE.CanvasTexture(  
    canvas  
);

}

let targetEnergy =
.15;

let energy =
.15;

const normalColor =
new THREE.Color(

const activeColor =

0x00A8FF
);

const currentColor =
normalColor.clone();

function setState(
state
){

){

}  

else if(

){

}

/* =====================================================
ANIMAZIONE
===================================================== */

function animate(){

requestAnimationFrame(  
    animate  
);  


const time =  
    performance.now()*.001;  


energy +=  
    (  
        targetEnergy -  
        energy  
    )*.045;  


currentColor.lerp(  
    activeColor,  
    energy*.04  
);  


if(  
    energy < .3  
){  

    currentColor.lerp(  
        normalColor,  
        .03  
    );  

}  


material.color =  
    currentColor;  


material.size =  
    .032 +  
    energy*.008;  


const pos =  
    geometry  
        .attributes  
        .position  
        .array;  


for(  
    let i=0;  
    i<COUNT;  
    i++  
){  

    const index =  
        i*3;  


    const r =  
        radii[i];  


    const theta =  
        angles[i*2];  


    const phi =  
        angles[i*2+1];  


    const seed =  
        seeds[i];  


    const pulse =  
        Math.sin(  
            time*2 +  
            seed  
        )*.035;  


    const strangeShape =  
        Math.sin(  
            theta*6 +  
            time*2 +  
            seed  
        )*.18*energy;  


    const wave =  
        Math.cos(  
            phi*7 -  
            time*1.8 +  
            seed  
        )*.12*energy;  


    const rr =  
        r +  
        pulse +  
        strangeShape +  
        wave;  


    let x =  
        rr *  
        Math.sin(phi) *  
        Math.cos(theta);  


    let y =  
        rr *  
        Math.sin(phi) *  
        Math.sin(theta);  


    let z =  
        rr *  
        Math.cos(phi);  


    x +=  
        Math.sin(  
            time*2.4 +  
            phi*8 +  
            seed  
        )*.08*energy;  


    y +=  
        Math.cos(  
            time*2.1 +  
            theta*9 +  
            seed  
        )*.08*energy;  


    z +=  
        Math.sin(  
            time*2.7 +  
            (theta+phi)*7  
        )*.10*energy;  


    pos[index] =  
        x;  

    pos[index+1] =  
        y;  

    pos[index+2] =  
        z;  

}  


geometry  
    .attributes  
    .position  
    .needsUpdate =  
        true;  


particles.rotation.y +=  
    .0005 +  
    energy*.0008;  


particles.rotation.x =  
    Math.sin(  
        time*.25  
    )*.04;  


particles.rotation.z =  
    Math.cos(  
        time*.18  
    )*.025;  


renderer.render(  
    scene,  
    camera  
);

}

animate();

async function searchLocation(
place
){

try{  

    openTacticalMap();  


    addMsg(  
        "Ricerca posizione: " +  
        place  
    );  


    const url =  
        "https://nominatim.openstreetmap.org/search" +  
        "?format=json" +  
        "&limit=1" +  
        "&q=" +  
        encodeURIComponent(  
            place  
        );  


    const response =  
        await fetch(  
            url,  
            {  
                headers:{  
                    "Accept":  
                        "application/json"  
                }  
            }  
        );  


    if(!response.ok){  

        throw new Error(  
            "Ricerca posizione fallita"  
        );  

    }  


    const results =  
        await response.json();  


    if(!results.length){  

        addMsg(  
            "Non riesco a trovare " +  
            place +  
            "."  
        );  

        return;  

    }  


    const result =  
        results[0];  


    const lat =  
        parseFloat(  
            result.lat  
        );  


    const lon =  
        parseFloat(  
            result.lon  
        );  


    if(!map){  

        throw new Error(  
            "Mappa non inizializzata"  
        );  

    }  


    map.flyTo({  

        center:  
            [lon,lat],  

        zoom:  
            12,  

        speed:  
            .8,  

        curve:  
            1.5,  

        essential:  
            true  

    });  


    createJarvisMarker(  
        lat,  
        lon,  
        place  
    );  


    addMsg(  
        "Posizione acquisita: " +  
        place  
    );  


}catch(error){  

    console.error(  
        "MAP ERROR:",  
        error  
    );  


    addMsg(  
        "Impossibile localizzare " +  
        place +  
        "."  
    );  

}

}

/* =====================================================
SPEECH SYNTHESIS
===================================================== */

function speakDevice(
text
){

return new Promise(  
    resolve => {  

        if(  
            !("speechSynthesis" in window)  
        ){  

            console.warn(  
                "SpeechSynthesis non disponibile."  
            );  

            resolve(false);  

            return;  

        }  


        try{  

            window.speechSynthesis.cancel();  


            const utterance =  
                new SpeechSynthesisUtterance(  
                    text  
                );  


            utterance.lang =  
                "it-IT";  


            utterance.rate =  
                0.95;  


            utterance.pitch =  
                0.9;  


            utterance.volume =  
                1;  


            if(  
                selectedDeviceVoice  
            ){  

                utterance.voice =  
                    selectedDeviceVoice;  

            }  

            else{  

                const italianVoice =  
                    deviceVoices.find(  
                        voice =>  
                            voice.lang  
                                .toLowerCase()  
                                .startsWith(  
                                    "it"  
                                )  
                    );  


                if(  
                    italianVoice  
                ){  

                    utterance.voice =  
                        italianVoice;  

                }  

            }  


            utterance.onstart =  
                () => {  

                    audioPlaying =  
                        true;  

                    setState(  
                        "speaking"  
                    );  

                };  


            utterance.onend =  
                () => {  

                    audioPlaying =  
                        false;  

                    setState(  
                        "idle"  
                    );  

                    resolve(true);  

                };  


            utterance.onerror =  
                error => {  

                    console.error(  
                        "DEVICE TTS ERROR:",  
                        error  
                    );  


                    audioPlaying =  
                        false;  

                    setState(  
                        "idle"  
                    );  

                    resolve(false);  

                };  


            window.speechSynthesis  
                .speak(  
                    utterance  
                );  


            setTimeout(  
                () => {  

                    try{  

                        window.speechSynthesis.resume();  

                    }catch(error){  

                        console.warn(  
                            error  
                        );  

                    }  

                },  
                100  
            );  

        }catch(error){  

            console.error(  
                "DEVICE TTS:",  
                error  
            );  

            resolve(false);  

        }  

    }  
);

}

        ) || "";  


    if(  
        !contentType.includes(  
            "audio"  
        )  
    ){  

        return false;  

    }  


    const audioBlob =  
        await response.blob();  


    if(  
        !audioBlob ||  
        audioBlob.size === 0  
    ){  

        return false;  

    }  


    const audioUrl =  
        URL.createObjectURL(  
            audioBlob  
        );  


    const audio =  
        new Audio(  
            audioUrl  
        );  


    currentAudio =  
        audio;  


    audio.volume =  
        1;  


    audio.onplay =  
        () => {  

            audioPlaying =  
                true;  

            setState(  
                "speaking"  
            );  

        };  


    audio.onended =  
        () => {  

            audioPlaying =  
                false;  

            setState(  
                "idle"  
            );  


            URL.revokeObjectURL(  
                audioUrl  
            );  


            if(  
                currentAudio ===  
                audio  
            ){  

                currentAudio =  
                    null;  

            }  

        };  


    audio.onerror =  
        error => {  

            console.warn(  
                "ElevenLabs audio:",  
                error  
            );  

            audioPlaying =  
                false;  

            setState(  
                "idle"  
            );  


            URL.revokeObjectURL(  
                audioUrl  
            );  

        };  


    await audio.play();  


    return true;  


}catch(error){  

    console.warn(  
        "ElevenLabs TTS:",  
        error  
    );  

    return false;  


}finally{  

    clearTimeout(  
        timeout  
    );  

}

}

/* =====================================================
PROCESS AI
===================================================== */

async function processAi(
text
){

if(  
    handleWebCommand(  
        text  
    )  
){  

    return;  

}  


if(  
    handleMapCommand(  
        text  
    )  
){  

    return;  

}  


setState(  
    "thinking"  
);  


try{  

    const temporal =  
        getTimeData();  


    addMemory(  
        "user",  
        text  
    );  


    const controller =  
        new AbortController();  


    const timeout =  
        setTimeout(  
            () => {  
                controller.abort();  
            },  
            30000  
        );  


    let response;  


    try{  

        response =  
            await fetch(  
                API,  
                {  

                    method:"POST",  

                    headers:{  
                        "Content-Type":  
                            "application/json"  
                    },  

                    body:  
                        JSON.stringify({  

                            message:  
                                text,  

                            memory:  
                                memory.slice(-4),  

                            currentTime:  
                                temporal.currentTime,  

                            currentDate:  
                                temporal.currentDate,  

                            dayOfWeek:  
                                temporal.dayOfWeek,  

                            timezone:  
                                temporal.timezone  

                        }),  

                    signal:  
                        controller.signal  

                }  
            );  

    }finally{  

        clearTimeout(  
            timeout  
        );  

    }  


    if(!response.ok){  

        const errorText =  
            await response.text();  


        let errorMessage =  
            "HTTP " +  
            response.status;  


        try{  

            const errorData =  
                JSON.parse(  
                    errorText  
                );  


            if(  
                errorData &&  
                errorData.error  
            ){  

                errorMessage =  
                    errorData.error;  

            }  

        }catch(parseError){  

            if(errorText){  

                errorMessage =  
                    errorText.substring(  
                        0,  
                        200  
                    );  

            }  

        }  


        throw new Error(  
            errorMessage  
        );  

    }  


    const data =  
        await response.json();  


    console.log(  
        "JARVIS RESPONSE:",  
        data  
    );  


    const reply =  
        typeof data.response ===  
            "string"  
            ? data.response.trim()  
            : "";  


    if(!reply){  

        throw new Error(  
            "Risposta AI vuota"  
        );  

    }  


    addMsg(  
        reply  
    );  


    addMemory(  
        "assistant",  
        reply  
    );  


    speak(  
        reply  
    ).catch(  
        error => {  

            console.error(  
                "TTS:",  
                error  
            );  

        }  
    );  


    setState(  
        "idle"  
    );  


}catch(error){  

    console.error(  
        "JARVIS ERROR:",  
        error  
    );  


    let message =  
        error.message ||  
        "Errore sconosciuto";  


    if(  
        error.name ===  
        "AbortError"  
    ){  

        message =  
            "Il server ha impiegato troppo tempo a rispondere.";  

    }  

    else if(  
        message ===  
        "Failed to fetch"  
    ){  

        message =  
            "Errore di connessione al server JARVIS.";  

    }  


    addMsg(  
        "ERRORE: " +  
        message  
    );  


    setState(  
        "idle"  
    );  

}

}

function sendMessage(){

const text =  
    textInput.value.trim();  


if(!text){  
    return;  
}  


textInput.value =  
    "";  


addMsg(  
    text  
);  


processAi(  
    text  
);

}

sendMessage
);

textInput.addEventListener(
"keydown",
event => {

        event.key ===  
        "Enter"  
    ){  

        event.preventDefault();  

        sendMessage();  

    }  

}

);

/* =====================================================
MICROFONO
===================================================== */

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition =
null;

let listening =
false;

if(Recognition){

recognition =  
    new Recognition();  


recognition.lang =  
    "it-IT";  


recognition.continuous =  
    false;  


recognition.interimResults =  
    false;  


recognition.onstart =  
    () => {  

        listening =  
            true;  


        micBtn.classList.add(  
            "active"  
        );  


        setState(  
            "listening"  
        );  

    };  


recognition.onresult =  
    event => {  

        const text =  
            event  
                .results[0][0]  
                .transcript  
                .trim();  


        if(text){  

            textInput.value =  
                text;  


            sendMessage();  

        }  

    };  


recognition.onerror =  
    error => {  

        console.error(  
            "Microfono:",  
            error  
        );  


        listening =  
            false;  


        micBtn.classList.remove(  
            "active"  
        );  


        setState(  
            "idle"  
        );  

    };  


recognition.onend =  
    () => {  

        listening =  
            false;  


        micBtn.classList.remove(  
            "active"  
        );  

    };  


micBtn.addEventListener(  
    "click",  
    () => {  

        if(listening){  

            recognition.stop();  

        }else{  

            try{  

                recognition.start();  

            }catch(error){  

                console.warn(  
                    error  
                );  

            }  

        }  

    }  
);

}else{

micBtn.style.opacity =  
    ".3";

}
