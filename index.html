<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Neural Core</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

body{
user-select:none;
}

/* ================= CANVAS ================= */

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:1;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:20px;
left:0;
width:100%;
text-align:center;
z-index:20;
pointer-events:none;
}

.header h1{
margin:0;
font-size:25px;
font-weight:300;
letter-spacing:13px;
color:#fff;
text-shadow:
0 0 10px #ffd000,
0 0 25px rgba(255,208,0,.35);
transition:.5s;
}

.status{
margin-top:8px;
font:10px monospace;
letter-spacing:3px;
color:rgba(255,255,255,.75);
}

#dot{
color:#ffd000;
text-shadow:
0 0 8px currentColor,
0 0 20px currentColor;
}

/* ================= INFO LEFT ================= */

.info{
position:fixed;
top:25px;
left:22px;
z-index:20;

font:10px monospace;
line-height:1.9;
letter-spacing:2px;

color:rgba(255,210,0,.6);

border-left:
2px solid rgba(255,210,0,.45);

padding-left:10px;

pointer-events:none;

transition:.5s;
}

/* ================= INFO RIGHT ================= */

.info.right{
left:auto;
right:22px;

text-align:right;

border-left:0;

border-right:
2px solid rgba(255,210,0,.45);

padding-left:0;
padding-right:10px;
}

#clock{
font-size:16px;
color:#fff;
letter-spacing:2px;
}

#date{
font-size:9px;
opacity:.65;
}

/* ================= CENTER STATUS ================= */

#centerStatus{
position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,calc(-50% + 145px));

z-index:15;

font:9px monospace;

letter-spacing:5px;

color:rgba(255,255,255,.35);

pointer-events:none;

transition:
color .4s,
text-shadow .4s;
}

#centerStatus.active{
color:#fff;

text-shadow:
0 0 8px currentColor,
0 0 20px currentColor;
}

/* ================= NEURAL ACTIVITY ================= */

#activity{
position:fixed;

left:50%;
bottom:150px;

transform:translateX(-50%);

z-index:15;

height:30px;

display:flex;
align-items:flex-end;
justify-content:center;

gap:3px;

opacity:.25;

pointer-events:none;

transition:.4s;
}

#activity.active{
opacity:1;
}

.activityBar{
width:3px;
height:4px;

background:#ffd000;

box-shadow:
0 0 8px currentColor;

border-radius:2px;

transition:
height .12s,
background .4s;
}

/* ================= CONTROLS ================= */

.controls{
position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

width:100%;
max-width:650px;

padding:0 15px;

z-index:30;
}

.controlBox{
display:flex;

gap:7px;

padding:5px;

background:
rgba(3,5,8,.94);

border:
1px solid rgba(255,190,0,.4);

border-radius:8px;

box-shadow:
0 0 25px rgba(255,200,0,.04);
}

input{
flex:1;

min-width:0;

height:44px;

padding:
0 14px;

background:transparent;

border:0;

outline:0;

color:#fff;

font-size:14px;
}

input::placeholder{
color:rgba(255,255,255,.3);
}

button{
height:44px;

border-radius:5px;

border:
1px solid rgba(255,190,0,.5);

background:
rgba(255,190,0,.08);

color:#ffd000;

font-family:monospace;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

button:hover{
background:#ffd000;

color:#000;

box-shadow:
0 0 20px rgba(255,208,0,.5);
}

button.active{
background:#168cff;

border-color:#168cff;

color:#fff;

box-shadow:
0 0 20px #168cff,
0 0 45px rgba(22,140,255,.25);
}

#conversation,
#mic,
#voiceButton{
width:48px;

font-size:17px;
}

#send{
width:70px;
}

/* ================= VOICE PANEL ================= */

#voicePanel{
position:fixed;

right:20px;
bottom:75px;

z-index:50;

display:none;

padding:12px;

background:
rgba(4,7,11,.98);

border:
1px solid rgba(22,140,255,.5);

border-radius:7px;

box-shadow:
0 0 30px rgba(22,140,255,.15);
}

#voiceSelect{
background:#05080c;

color:#fff;

border:
1px solid #168cff;

padding:7px;

max-width:230px;
}

/* ================= CORNERS ================= */

.corner{
position:fixed;

z-index:10;

width:30px;
height:30px;

opacity:.45;

pointer-events:none;
}

.corner1{
left:14px;
bottom:14px;

border-left:
1px solid #ffd000;

border-bottom:
1px solid #ffd000;
}

.corner2{
right:14px;
bottom:14px;

border-right:
1px solid #ffd000;

border-bottom:
1px solid #ffd000;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

.info{
display:none;
}

.header h1{
font-size:20px;
letter-spacing:8px;
}

#centerStatus{
transform:
translate(-50%,calc(-50% + 125px));
}

#activity{
bottom:135px;
}

#send{
width:62px;
}

}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="corner corner1"></div>
<div class="corner corner2"></div>


<!-- HEADER -->

<div class="header">

<h1>J.A.R.V.I.S.</h1>

<div class="status">

NEURAL INTERFACE ONLINE

</div>

</div>


<!-- INFO -->

<div class="info">

JARVIS CORE V11<br>
NEURAL ENGINE: ONLINE<br>
MEMORY: <span id="memoryCount">0</span><br>
SYSTEM: ACTIVE

</div>


<div class="info right">

<div id="clock">
--:--:--
</div>

<div id="date">
--
</div>

STATE:
<span id="state">

</span>

<!-- CENTRO -->

NEURAL CORE

</div>


<!-- ATTIVITÀ -->

<div id="activity">

<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>

<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>
<div class="activityBar"></div>

</div>


<!-- PANNELLO VOCE -->

<div id="voicePanel">

</div>


<!-- IMPOSTAZIONI VOCE -->

<button

position:fixed;
right:20px;
bottom:20px;
z-index:40;
">

⚙

</button>


<!-- CONTROLLI -->

<div class="controls">

<div class="controlBox">

<input
id="input"
type="text"
placeholder="Comunica con JARVIS..."
autocomplete="off"
>

<button
id="conversation"
title="Modalità conversazione">

🔊

id="mic"
title="Microfono">

</div>

<script>

/* =========================================================
   CONFIGURAZIONE
========================================================= */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =========================================================
   ELEMENTI
========================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const conversation =
document.getElementById("conversation");

const voiceButton =
document.getElementById("voiceButton");

const voicePanel =
document.getElementById("voicePanel");

const voiceSelect =
document.getElementById("voiceSelect");

const stateEl =
document.getElementById("state");

const dot =
document.getElementById("dot");

const memoryCount =
document.getElementById("memoryCount");

const clock =
document.getElementById("clock");

const date =
document.getElementById("date");

const centerStatus =
document.getElementById("centerStatus");

const activity =
document.getElementById("activity");

const activityBars =
document.querySelectorAll(".activityBar");


/* =========================================================
   STATO
========================================================= */

let state =
"idle";

let busy =
false;

let listening =
false;

let conversationMode =
false;

let wakeMode =
false;

let recognition =
null;

let wakeRecognition =
null;


/* =========================================================
   MEMORIA
========================================================= */

let memory = [];

try{

memory =
JSON.parse(
localStorage.getItem(
"jarvis_memory"
) || "[]"
);

}catch(e){

memory = [];

}

memory =
memory.slice(-30);


function saveMemory(){

memory =
memory.slice(-30);

localStorage.setItem(
"jarvis_memory",
JSON.stringify(memory)
);

memoryCount.textContent =
memory.length;

}


function remember(
role,
content
){

memory.push({

role:
role,

content:
content,

time:
Date.now()

});

saveMemory();

}

saveMemory();


/* =========================================================
   STATO
========================================================= */

function setState(
newState
){

state =
newState;

stateEl.textContent =
newState.toUpperCase();


if(
newState === "listening" ||
newState === "thinking" ||
newState === "speaking"
){

dot.style.color =
"#168cff";

centerStatus.classList.add(
"active"
);

activity.classList.add(
"active"
);

}else{

dot.style.color =
"#ffd000";

centerStatus.classList.remove(
"active"
);

activity.classList.remove(
"active"
);

}


if(
newState === "listening"
){

centerStatus.textContent =
"LISTENING";

}

else if(
newState === "thinking"
){

centerStatus.textContent =
"PROCESSING";

}

else if(
newState === "speaking"
){

centerStatus.textContent =
"SPEAKING";

}

else{

centerStatus.textContent =
"NEURAL CORE";

}

}


/* =========================================================
   OROLOGIO
========================================================= */

function updateClock(){

const now =
new Date();

clock.textContent =
now.toLocaleTimeString(
"it-IT"
);

date.textContent =
now.toLocaleDateString(
"it-IT",
{
weekday:"short",
day:"2-digit",
month:"short"
}
).toUpperCase();

}

updateClock();

setInterval(
updateClock,
1000
);


/* =========================================================
   COMANDI LOCALI
========================================================= */

function localCommand(
text
){

const t =
text.toLowerCase();


if(
t.includes("che ore sono") ||
t.includes("che ora è") ||
t.includes("che ora e")
){

return (
"Sono le " +
new Date().toLocaleTimeString(
"it-IT",
{
hour:"2-digit",
minute:"2-digit"
}
) +
"."
);

}


if(
t.includes("che giorno è") ||
t.includes("che giorno e")
){

return (
"Oggi è " +
new Date().toLocaleDateString(
"it-IT",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
) +
"."
);

}


return null;

}


/* =========================================================
   INVIO
========================================================= */

send.onclick =
sendMessage;


input.addEventListener(
"keydown",
event=>{

if(
event.key === "Enter"
){

event.preventDefault();

sendMessage();

}

});


async function sendMessage(){

const text =
input.value.trim();


if(
!text ||
busy
){

return;

}


busy =
true;


input.value =
"";


remember(
"user",
text
);


input.disabled =
true;

send.disabled =
true;

mic.disabled =
true;

conversation.disabled =
true;


setState(
"thinking"
);


/* COMANDI LOCALI */

const local =
localCommand(
text
);


if(local){

remember(
"assistant",
local
);


if(
conversationMode
){

speak(
local
);

}else{

setState(
"idle"
);

}

finish();

return;

}


/* API */

try{

const response =
await fetch(
API,
{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

message:
text,

memory:
memory.slice(-20)

})

});


if(
!response.ok
){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


if(
!data.reply
){

throw new Error(
"Risposta mancante"
);

}


remember(
"assistant",
data.reply
);


/* VOCE SOLO IN CONVERSAZIONE */

if(
conversationMode
){

speak(
data.reply
);

}else{

setState(
"idle"
);

}


}catch(error){

console.error(
error
);

setState(
"idle"
);

}


finish();

}


function finish(){

busy =
false;

input.disabled =
false;

send.disabled =
false;

mic.disabled =
false;

conversation.disabled =
false;

input.focus();

}


/* =========================================================
   SINTESI VOCALE
========================================================= */

let voices = [];


function loadVoices(){

if(
!("speechSynthesis" in window)
){

return;

}


voices =
speechSynthesis.getVoices();

voiceSelect.innerHTML =
"";


voices.forEach(
(voice,index)=>{

const option =
document.createElement(
"option"
);

option.value =
index;

option.textContent =
voice.name +
" — " +
voice.lang;

voiceSelect.appendChild(
option
);

});


const saved =
localStorage.getItem(
"jarvis_voice"
);


if(
saved !== null &&
voices[saved]
){

voiceSelect.value =
saved;

}

}


if(
"speechSynthesis" in window
){

speechSynthesis.onvoiceschanged =
loadVoices;

loadVoices();

}


voiceButton.onclick =
()=>{

voicePanel.style.display =
voicePanel.style.display ===
"block"
?
"none"
:
"block";

};


voiceSelect.onchange =
()=>{

localStorage.setItem(
"jarvis_voice",
voiceSelect.value
);

};


function speak(
text
){

if(
!("speechSynthesis" in window)
){

setState(
"idle"
);

return;

}


speechSynthesis.cancel();


const utterance =
new SpeechSynthesisUtterance(
text
);

utterance.lang =
"it-IT";

utterance.rate =
.88;

utterance.pitch =
.65;

utterance.volume =
1;


const selected =
parseInt(
voiceSelect.value
);


if(
voices[selected]
){

utterance.voice =
voices[selected];

}


utterance.onstart =
()=>{

setState(
"speaking"
);

};


utterance.onend =
()=>{

setState(
"idle"
);

if(
conversationMode &&
wakeMode
){

setTimeout(
startWakeWord,
700
);

}

};


utterance.onerror =
()=>{

setState(
"idle"
);

};


speechSynthesis.speak(
utterance
);

}


/* =========================================================
   MODALITÀ CONVERSAZIONE
========================================================= */

conversation.onclick =
()=>{

conversationMode =
!conversationMode;


if(
conversationMode
){

wakeMode =
true;

conversation.classList.add(
"active"
);

conversation.textContent =
"🔵";

startWakeWord();

}else{

wakeMode =
false;

conversation.classList.remove(
"active"
);

conversation.textContent =
"🔊";

stopWakeWord();

if(
"speechSynthesis" in window
){

speechSynthesis.cancel();

}

setState(
"idle"
);

}

};


/* =========================================================
   MICROFONO
========================================================= */

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(
Recognition
){

recognition =
new Recognition();

recognition.lang =
"it-IT";

recognition.continuous =
false;

recognition.interimResults =
true;


recognition.onstart =
()=>{

listening =
true;

mic.classList.add(
"active"
);

mic.textContent =
"■";

input.placeholder =
"JARVIS ti ascolta...";

setState(
"listening"
);

};


recognition.onresult =
event=>{

let text =
"";


for(
let i =
event.resultIndex;

i <
event.results.length;

i++
){

text +=
event.results[i][0]
.transcript;

}


input.value =
text;


const last =
event.results[
event.results.length-1
];


if(
last.isFinal
){

setTimeout(
()=>{

if(
input.value.trim()
){

sendMessage();

}

},
250
);

}

};


recognition.onerror =
event=>{

console.log(
"Speech recognition:",
event.error
);

};


recognition.onend =
()=>{

listening =
false;

mic.classList.remove(
"active"
);

mic.textContent =
"🎙";

input.placeholder =
"Comunica con JARVIS...";

if(
state === "listening"
){

setState(
"idle"
);

}

};


mic.onclick =
()=>{

if(
busy
){

return;

}


conversationMode =
true;

wakeMode =
false;

conversation.classList.add(
"active"
);

conversation.textContent =
"🔵";


if(
listening
){

recognition.stop();

return;

}


try{

recognition.start();

}catch(e){

console.log(e);

}

};


}else{

mic.disabled =
true;

}


/* =========================================================
   WAKE WORD
========================================================= */

function startWakeWord(){

if(
!Recognition ||
!conversationMode ||
!wakeMode ||
busy ||
listening ||
wakeRecognition
){

return;

}


wakeRecognition =
new Recognition();

wakeRecognition.lang =
"it-IT";

wakeRecognition.continuous =
true;

wakeRecognition.interimResults =
true;


wakeRecognition.onresult =
event=>{

for(
let i =
event.resultIndex;

i <
event.results.length;

i++
){

const text =
event.results[i][0]
.transcript
.toLowerCase();


if(
text.includes(
"jarvis"
)
){

try{

wakeRecognition.stop();

}catch(e){}


wakeRecognition =
null;

activateJarvis();

return;

}

}

};


wakeRecognition.onerror =
()=>{

wakeRecognition =
null;

if(
conversationMode &&
wakeMode &&
!busy &&
!listening
){

setTimeout(
startWakeWord,
1200
);

}

};


wakeRecognition.onend =
()=>{

wakeRecognition =
null;

if(
conversationMode &&
wakeMode &&
!busy &&
!listening
){

setTimeout(
startWakeWord,
600
);

}

};


try{

wakeRecognition.start();

}catch(e){

wakeRecognition =
null;

}

}


function stopWakeWord(){

if(
wakeRecognition
){

try{

wakeRecognition.stop();

}catch(e){}

wakeRecognition =
null;

}

}


function activateJarvis(){

if(
busy ||
listening
){

return;

}


setState(
"listening"
);


input.placeholder =
"JARVIS ti ascolta...";


setTimeout(
()=>{

try{

recognition.start();

}catch(e){

console.log(e);

}

},
250
);

}


/* =========================================================
   SFERA NEURALE
========================================================= */

let width =
innerWidth;

let height =
innerHeight;

let cx =
width/2;

let cy =
height/2;

let radius =
Math.min(
width,
height
)*.22;

let rotation =
0;

let nodes =
[];


function resize(){

width =
innerWidth;

height =
innerHeight;


const dpr =
Math.min(
devicePixelRatio || 1,
2
);


canvas.width =
width*dpr;

canvas.height =
height*dpr;


canvas.style.width =
width+"px";

canvas.style.height =
height+"px";


ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);


cx =
width/2;

cy =
height/2;


radius =
Math.min(
width,
height
)*.22;


createNodes();

}


function createNodes(){

nodes =
[];


for(
let i=0;
i<185;
i++
){

nodes.push({

theta:
Math.random()*
Math.PI*2,

phi:
Math.acos(
2*Math.random()-1
),

r:
radius*
(
.7+
Math.random()*.58
),

size:
.7+
Math.random()*1.8,

phase:
Math.random()*
Math.PI*2

});

}

}


function animate(){

requestAnimationFrame(
animate
);


const time =
performance.now()/1000;


let speed =
1;

let energy =
.2;


if(
state === "listening"
){

speed =
5;

energy =
1.4;

}


if(
state === "thinking"
){

speed =
8;

energy =
2.2;

}


if(
state === "speaking"
){

speed =
6;

energy =
1.7;

}


rotation +=
.004*
speed;


ctx.fillStyle =
"rgba(0,0,0,.30)";


ctx.fillRect(
0,
0,
width,
height
);


/* COLORE */

let target;


if(
state === "listening" ||
state === "thinking" ||
state === "speaking"
){

target = {

r:25,
g:140,
b:255

};

}else{

target = {

r:255,
g:195,
b:0

};

}


window.jarvisColor =
window.jarvisColor ||
{

r:255,
g:195,
b:0

};


jarvisColor.r +=
(
target.r -
jarvisColor.r
)*.055;


jarvisColor.g +=
(
target.g -
jarvisColor.g
)*.055;


jarvisColor.b +=
(
target.b -
jarvisColor.b
)*.055;


const r =
Math.round(
jarvisColor.r
);

const g =
Math.round(
jarvisColor.g
);

const b =
Math.round(
jarvisColor.b
);


/* PULSAZIONE */

const pulse =
(
Math.sin(
time*4
)+1
)/2;


const pulse2 =
(
Math.sin(
time*9
)+1
)/2;


const glow =
radius*
(
1.05+
energy*.72+
pulse*.18
);


/* GLOW */

const gradient =
ctx.createRadialGradient(
