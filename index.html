<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARK-TECH // KINETIC 3D MANIPULATOR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #010408;
      font-family: 'Share Tech Mono', monospace;
      color: #00f3ff;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 243, 255, 0.025) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #video-input { display: none; }

    /* HUD Header */
    .stark-header {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 50px;
      background: linear-gradient(180deg, rgba(0, 243, 255, 0.15) 0%, rgba(1, 4, 8, 0) 100%);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .stark-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .security-badge {
      font-size: 10px;
      background: rgba(255, 51, 102, 0.2);
      border: 1px solid #ff3366;
      color: #ff3366;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
    }

    .mode-tabs { display: flex; gap: 10px; }
    .tab-btn {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: rgba(0, 243, 255, 0.6);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      padding: 6px 16px;
      cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: all 0.2s ease;
    }
    .tab-btn:hover, .tab-btn.active {
      background: rgba(0, 243, 255, 0.2);
      border-color: #00f3ff;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    /* Left Control HUD */
    .ui-overlay {
      position: absolute;
      top: 70px; left: 24px;
      z-index: 10;
      width: 280px;
      padding: 20px;
      background: rgba(2, 12, 27, 0.82);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 243, 255, 0.35);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(0, 243, 255, 0.9);
      border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 10px; color: rgba(0, 243, 255, 0.6); letter-spacing: 1px; }
    
    select, input[type="color"], .stark-btn {
      width: 100%; height: 38px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #00f3ff;
      padding: 0 10px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    select:hover, .stark-btn:hover {
      background: rgba(0, 243, 255, 0.2);
      border-color: #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }
    select option { background: #020c1b; color: #00f3ff; }

    .stark-btn {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(0, 243, 255, 0.15);
    }

    .telemetry-box {
      font-size: 11px;
      background: rgba(0, 243, 255, 0.03);
      border: 1px solid rgba(0, 243, 255, 0.15);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .telemetry-row { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.7); }
    .telemetry-val { color: #00f3ff; font-weight: bold; }

    /* Camera Feed Panel */
    .camera-preview-container {
      position: absolute;
      bottom: 24px; right: 24px;
      z-index: 10;
      width: 220px; height: 165px;
      background: rgba(2, 12, 27, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 243, 255, 0.4);
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
      display: flex; flex-direction: column;
    }
    #hand-preview-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .preview-hud-tag {
      position: absolute; top: 6px; left: 8px;
      font-size: 9px; font-weight: bold; letter-spacing: 1px;
      color: #00f3ff; background: rgba(2, 12, 27, 0.8);
      padding: 2px 6px; border: 1px solid rgba(0, 243, 255, 0.3);
    }

    .hud-corner {
      position: absolute; width: 8px; height: 8px;
      border: 2px solid #00f3ff; pointer-events: none;
    }
    .top-left { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .top-right { top: -1px; right: -1px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: -1px; left: -1px; border-right: none; border-top: none; }
    .bottom-right { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="video-input"></video>
  <div id="canvas-container"></div>

  <div class="stark-header">
    <div class="stark-title">
      <span>STARK TACTICAL HUD v5.0</span>
      <span class="security-badge">TOP SECRET // LEVEL 5</span>
    </div>
    <div class="mode-tabs">
      <button id="tab-builder" class="tab-btn active" onclick="switchMode('BUILDER')">SYS 01: REALISTIC 3D GRAB</button>
      <button id="tab-particles" class="tab-btn" onclick="switchMode('PARTICLES')">SYS 02: PARTICLE MATRIX</button>
    </div>
  </div>

  <div class="ui-overlay">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="panel-header">
      <span id="panel-title-text">KINETIC BUILDER</span>
      <span style="color: #00f3ff; font-weight: bold;">[ACTIVE]</span>
    </div>
    
    <div id="controls-builder">
      <div class="control-group">
        <label>MANIPULATION CONTROLS</label>
        <button class="stark-btn" onclick="spawnBlock()">+ SPAWN MODULE</button>
        <button class="stark-btn" style="background: rgba(255, 51, 102, 0.2); border-color: #ff3366; color: #ff3366; margin-top: 6px;" onclick="clearBlocks()">RESET MATRIX</button>
      </div>
    </div>

    <div id="controls-particles" style="display: none;">
      <div class="control-group">
        <label>HOLOGRAM TEMPLATE</label>
        <select id="shape-select">
          <option value="heart">HEART MATRIX</option>
          <option value="flower">NEURAL FLOWER</option>
          <option value="saturn">SATURN RINGS</option>
          <option value="buddha">BUDDHA HOLOGRAM</option>
          <option value="fireworks">ENERGY EXPLOSION</option>
        </select>
      </div>
      <div class="control-group" style="margin-top: 10px;">
        <label>PLASMA COLOR</label>
        <input type="color" id="color-picker" value="#00f3ff">
      </div>
    </div>

    <div class="telemetry-box">
      <div class="telemetry-row">
        <span>HAND TRACKING:</span>
        <span id="telemetry-status" class="telemetry-val" style="color: #ff3366;">SEARCHING...</span>
      </div>
      <div class="telemetry-row">
        <span>PINCH GESTURE:</span>
        <span id="telemetry-gesture" class="telemetry-val">RELEASED</span>
      </div>
      <div class="telemetry-row">
        <span>PINCH 3D POS:</span>
        <span id="telemetry-pos" class="telemetry-val">X:0 Y:0 Z:0</span>
      </div>
      <div class="telemetry-row">
        <span>TARGET OBJECT:</span>
        <span id="telemetry-target" class="telemetry-val">NONE</span>
      </div>
    </div>
  </div>

  <div class="camera-preview-container">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>
    <span class="preview-hud-tag">OPTICAL FEED // TRACKING</span>
    <canvas id="hand-preview-canvas" width="320" height="240"></canvas>
  </div>

  <script>
    let currentMode = 'BUILDER';
    const PARTICLE_COUNT = 24000;
    let scene, camera, renderer;
    
    // Mode 1: Builder
    let builderGroup, gridHelper;
    let blocks = [];
    let pinchCursorMesh, pinchLaserMesh;
    let grabbedBlock = null;
    let grabOffset = new THREE.Vector3();
    let pinch3DPos = new THREE.Vector3();
    let isPinching = false;
    let hoveredBlock = null;

    // Mode 2: Particles
    let particleGroup, geometry, material;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let handExpansionScale = 1.0, targetScale = 1.0;
    let targetCamZ = 35, targetRotX = 0, targetRotY = 0, targetRotZ = 0;

    let previewCanvas, previewCtx;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x010408, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 32);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // --- BUILDER GROUP ---
      builderGroup = new THREE.Group();
      scene.add(builderGroup);

      gridHelper = new THREE.GridHelper(60, 30, 0x00f3ff, 0x002233);
      gridHelper.position.y = -8;
      builderGroup.add(gridHelper);

      // Indicatore di Pinch (Punto di contatto tra pollice e indice)
      const cursorGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const cursorMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      pinchCursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
      builderGroup.add(pinchCursorMesh);

      // Linea Olografica Raggio di Aggancio
      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const laserMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.8 });
      pinchLaserMesh = new THREE.Line(laserGeo, laserMat);
      pinchLaserMesh.visible = false;
      builderGroup.add(pinchLaserMesh);

      // Genera 3 blocchi tattici
      spawnBlock(-7, 0, 0);
      spawnBlock(0, 2, 0);
      spawnBlock(7, 0, 0);

      // --- PARTICLE GROUP ---
      particleGroup = new THREE.Group();
      particleGroup.visible = false;
      scene.add(particleGroup);

      geometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 50;
        targetPositions[i] = currentPositions[i];
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 128; pCanvas.height = 128;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#ffffff'; pCtx.beginPath(); pCtx.arc(64, 64, 60, 0, Math.PI * 2); pCtx.fill();

      material = new THREE.PointsMaterial({
        size: 0.18, color: new THREE.Color('#00f3ff'),
        map: new THREE.CanvasTexture(pCanvas), transparent: true,
        opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false
      });

      const particleSystem = new THREE.Points(geometry, material);
      particleGroup.add(particleSystem);
      generateShape('heart');

      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    function createBlockMesh() {
      const size = 3.2;
      const boxGeo = new THREE.BoxGeometry(size, size, size);
      
      const boxMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.25
      });

      const mesh = new THREE.Mesh(boxGeo, boxMat);

      // Bordo Neon Definito
      const edges = new THREE.EdgesGeometry(boxGeo);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 2 });
      const wireframe = new THREE.LineSegments(edges, lineMat);
      mesh.add(wireframe);

      // Nucleo luminoso interno
      const coreGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      mesh.add(new THREE.Mesh(coreGeo, coreMat));

      return mesh;
    }

    function spawnBlock(x, y, z) {
      const mesh = createBlockMesh();
      mesh.position.x = x !== undefined ? x : (Math.random() - 0.5) * 16;
      mesh.position.y = y !== undefined ? y : (Math.random() - 0.5) * 8 + 2;
      mesh.position.z = z !== undefined ? z : (Math.random() - 0.5) * 12;

      builderGroup.add(mesh);
      blocks.push(mesh);
    }

    function clearBlocks() {
      for (let b of blocks) builderGroup.remove(b);
      blocks = [];
      grabbedBlock = null;
      hoveredBlock = null;
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-builder').classList.toggle('active', mode === 'BUILDER');
      document.getElementById('tab-particles').classList.toggle('active', mode === 'PARTICLES');
      
      document.getElementById('controls-builder').style.display = mode === 'BUILDER' ? 'block' : 'none';
      document.getElementById('controls-particles').style.display = mode === 'PARTICLES' ? 'block' : 'none';
      document.getElementById('panel-title-text').innerText = mode === 'BUILDER' ? 'KINETIC BUILDER' : 'PARTICLE CONFIG';

      builderGroup.visible = (mode === 'BUILDER');
      particleGroup.visible = (mode === 'PARTICLES');
    }

    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'heart') {
          const t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 4;
          x = 16 * Math.pow(Math.sin(t), 3);
          y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          z = u; x *= 0.65; y *= 0.65; z *= 0.65;
        } else if (type === 'flower') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI;
          const r = 10 * Math.sin(6 * u) * Math.sin(v);
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.cos(v);
        } else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.35) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 5.5 * Math.cbrt(Math.random());
            x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.sin(phi) * Math.sin(theta); z = r * Math.cos(phi);
          } else {
            const angle = Math.random() * Math.PI * 2, dist = 8 + Math.random() * 9;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.4;
          }
        } else if (type === 'buddha') {
          const rand = Math.random();
          if (rand < 0.35) {
            const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 9;
            x = Math.cos(a) * r; z = Math.sin(a) * r; y = -8 + (Math.random() - 0.5) * 1.5;
          } else if (rand < 0.75) {
            const h = Math.random() * 10, width = (1 - h / 10) * 7.5, a = Math.random() * Math.PI * 2;
            x = Math.cos(a) * width * Math.random(); z = Math.sin(a) * width * Math.random(); y = -7 + h;
          } else {
            const a = Math.random() * Math.PI * 2, r = Math.random() * 2.8;
            x = Math.cos(a) * r; y = 5.5 + Math.sin(a) * r; z = (Math.random() - 0.5) * 2;
          }
        } else if (type === 'fireworks') {
          const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
          const speed = 2 + Math.random() * 14;
          x = speed * Math.sin(phi) * Math.cos(theta); y = speed * Math.sin(phi) * Math.sin(theta); z = speed * Math.cos(phi);
        }

        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    function setBlockHighlight(block, state) {
      // state: 'hover' | 'grab' | 'normal'
      const lineMat = block.children[0].material;
      const coreMat = block.children[1].material;

      if (state === 'grab') {
        block.material.color.setHex(0xff3366);
        lineMat.color.setHex(0xff3366);
        coreMat.color.setHex(0xff3366);
      } else if (state === 'hover') {
        block.material.color.setHex(0xffcc00);
        lineMat.color.setHex(0xffcc00);
        coreMat.color.setHex(0xffcc00);
      } else {
        block.material.color.setHex(0x00f3ff);
        lineMat.color.setHex(0x00f3ff);
        coreMat.color.setHex(0x00f3ff);
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');
      const telemetryStatus = document.getElementById('telemetry-status');
      const telemetryGesture = document.getElementById('telemetry-gesture');
      const telemetryPos = document.getElementById('telemetry-pos');
      const telemetryTarget = document.getElementById('telemetry-target');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const numHands = results.multiHandLandmarks.length;
          telemetryStatus.innerText = `LOCKED [${numHands} HANDS]`;
          telemetryStatus.style.color = '#00f3ff';

          for (const landmarks of results.multiHandLandmarks) {
            drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, { color: '#00f3ff', lineWidth: 1.5 });
            drawLandmarks(previewCtx, landmarks, { color: '#ff3366', lineWidth: 1, radius: 2 });
          }

          const h1 = results.multiHandLandmarks[0];
          const thumbTip = h1[4];
          const indexTip = h1[8];

          // Calcola il punto esatto di PINCH (Centro tra pollice e indice)
          const pinchMidX = (thumbTip.x + indexTip.x) / 2;
          const pinchMidY = (thumbTip.y + indexTip.y) / 2;
          const pinchMidZ = (thumbTip.z + indexTip.z) / 2;

          // Distanza Euclidea 3D per rilevare la chiusura delle dita
          const dx = thumbTip.x - indexTip.x;
          const dy = thumbTip.y - indexTip.y;
          const dz = (thumbTip.z || 0) - (indexTip.z || 0);
          const pinchDist = Math.sqrt(dx * dx + dy * dy + dz * dz);

          // CONVERSIONE COORDINATE CAMERA -> SPAZIO REALE THREE.JS 3D
          const ndcX = (1 - pinchMidX) * 2 - 1; // Mirror orizzontale naturale
          const ndcY = -(pinchMidY * 2 - 1);

          // Proiezione vettoriale dalla camera nello spazio 3D
          const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
          vector.unproject(camera);
          const dir = vector.sub(camera.position).normalize();
          
          // Profondità Z proporzionale alla scala rilevata da MediaPipe
          const targetZ = -pinchMidZ * 35;
          const distanceToPlane = (targetZ - camera.position.z) / dir.z;
          pinch3DPos.copy(camera.position).add(dir.multiplyScalar(distanceToPlane));

          // Aggiorna la posizione dell'indicatore di pinch
          pinchCursorMesh.position.copy(pinch3DPos);

          // Soglia attivazione Pinch: dita vicine
          isPinching = (pinchDist < 0.075);

          if (isPinching) {
            telemetryGesture.innerText = "PINCH ACTIVE [GRAB]";
            telemetryGesture.style.color = "#ff3366";
            pinchCursorMesh.material.color.setHex(0xff3366);
            pinchCursorMesh.scale.set(0.6, 0.6, 0.6);
          } else {
            telemetryGesture.innerText = "OPEN / SEARCHING";
            telemetryGesture.style.color = "#00f3ff";
            pinchCursorMesh.material.color.setHex(0x00f3ff);
            pinchCursorMesh.scale.set(1.0, 1.0, 1.0);
          }

          telemetryPos.innerText = `X:${pinch3DPos.x.toFixed(1)} Y:${pinch3DPos.y.toFixed(1)} Z:${pinch3DPos.z.toFixed(1)}`;

          // --- GESTIONE INTERAZIONE KINETIC BUILDER 3D ---
          if (currentMode === 'BUILDER') {
            if (isPinching) {
              // Se stiamo già afferrando un blocco -> Spostalo con offset naturale
              if (grabbedBlock) {
                const targetPos = pinch3DPos.clone().sub(grabOffset);
                grabbedBlock.position.lerp(targetPos, 0.35); // Traslazione fluida e reattiva

                // Disegna il raggio laser di connessione
                const linePositions = pinchLaserMesh.geometry.attributes.position.array;
                linePositions[0] = pinch3DPos.x; linePositions[1] = pinch3DPos.y; linePositions[2] = pinch3DPos.z;
                linePositions[3] = grabbedBlock.position.x; linePositions[4] = grabbedBlock.position.y; linePositions[5] = grabbedBlock.position.z;
                pinchLaserMesh.geometry.attributes.position.needsUpdate = true;
                pinchLaserMesh.visible = true;

                telemetryTarget.innerText = "BLOCK LOCKED";
                telemetryTarget.style.color = "#ff3366";
              } else {
                // Primo istante di pinch: cerca il blocco più vicino entro il raggio di aggancio
                let closestBlock = null;
                let minDist = 6.0; // Raggio massimo di cattura

                for (let block of blocks) {
                  const d = pinch3DPos.distanceTo(block.position);
                  if (d < minDist) {
                    minDist = d;
                    closestBlock = block;
                  }
                }

                if (closestBlock) {
                  grabbedBlock = closestBlock;
                  grabOffset.copy(pinch3DPos).sub(grabbedBlock.position); // Calcola l'offset relativo iniziale
                  setBlockHighlight(grabbedBlock, 'grab');
                }
              }
            } else {
              // Rilascio del blocco
              if (grabbedBlock) {
                setBlockHighlight(grabbedBlock, 'normal');
                grabbedBlock = null;
                pinchLaserMesh.visible = false;
              }

              // Effetto Hovering sui blocchi vicini
              let currentHover = null;
              let minDist = 5.0;
              for (let block of blocks) {
                const d = pinch3DPos.distanceTo(block.position);
                if (d < minDist) {
                  minDist = d;
                  currentHover = block;
                }
              }

              if (hoveredBlock && hoveredBlock !== currentHover) {
                setBlockHighlight(hoveredBlock, 'normal');
              }
              if (currentHover) {
                setBlockHighlight(currentHover, 'hover');
                telemetryTarget.innerText = "READY TO GRAB";
                telemetryTarget.style.color = "#ffcc00";
              } else {
                telemetryTarget.innerText = "NONE";
                telemetryTarget.style.color = "#00f3ff";
              }
              hoveredBlock = currentHover;
            }
          }

          // --- GESTIONE SYSTEM 02: PARTICLES ---
          if (currentMode === 'PARTICLES') {
            const h1Center = h1[9];
            if (numHands >= 2) {
              const h2Center = results.multiHandLandmarks[1][9];
              const dxH = h2Center.x - h1Center.x;
              const dyH = h2Center.y - h1Center.y;
              const distH = Math.sqrt(dxH * dxH + dyH * dyH);

              targetRotZ = Math.atan2(dyH, dxH);
              targetRotY = ((h1Center.x + h2Center.x) / 2 - 0.5) * Math.PI * 3.0;
              targetRotX = ((h1Center.y + h2Center.y) / 2 - 0.5) * Math.PI * 2.5;
              targetCamZ = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(distH, 0.18, 0.75, 70, 12), 12, 75);
            } else {
              const wrist = h1[0];
              targetRotZ = -Math.atan2(h1Center.y - wrist.y, h1Center.x - wrist.x) - Math.PI / 2;
              targetRotX = (h1Center.y - 0.5) * Math.PI * 2.0;
              targetRotY = (h1Center.x - 0.5) * Math.PI * 3.0;

              const span = Math.hypot(wrist.x - h1[12].x, wrist.y - h1[12].y);
              targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(span, 0.2, 0.55, 0.4, 2.2), 0.3, 2.5);
            }
          }

        } else {
          telemetryStatus.innerText = "SEARCHING...";
          telemetryStatus.style.color = "#ff3366";
          telemetryGesture.innerText = "RELEASED";
          telemetryTarget.innerText = "NONE";
          
          if (grabbedBlock) {
            setBlockHighlight(grabbedBlock, 'normal');
            grabbedBlock = null;
            pinchLaserMesh.visible = false;
          }
        }

        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640,
        height: 480
      });
      cameraUtils.start();
    }

    function animate() {
      requestAnimationFrame(animate);

      if (currentMode === 'BUILDER') {
        // Rotazione lenta olografica per i blocchi non afferrati
        for (let b of blocks) {
          if (b !== grabbedBlock) {
            b.rotation.x += 0.004;
            b.rotation.y += 0.006;
          }
        }
      } else if (currentMode === 'PARTICLES') {
        particleGroup.rotation.x += (targetRotX - particleGroup.rotation.x) * 0.08;
        particleGroup.rotation.y += (targetRotY + 0.003 - particleGroup.rotation.y) * 0.08;
        particleGroup.rotation.z += (targetRotZ - particleGroup.rotation.z) * 0.08;

        handExpansionScale += (targetScale - handExpansionScale) * 0.1;
        camera.position.z += (targetCamZ - camera.position.z) * 0.08;

        const positions = geometry.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
          const target = targetPositions[i] * handExpansionScale;
          positions[i] += (target - positions[i]) * 0.08;
        }
        geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
    document.getElementById('color-picker').addEventListener('input', (e) => material.color.set(e.target.value));

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
</html>
