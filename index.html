<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>JARVIS — HOLOGRAPHIC AI</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#168cff;

    text-shadow:
        0 0 10px #168cff,
        0 0 30px rgba(30,140,255,.6);

    transition:opacity 1.5s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

/* =====================================================
   CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    background:
        radial-gradient(
            circle at center,
            rgba(5,25,55,.35),
            rgba(0,0,0,1) 65%
        );
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;

    top:20px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;
    font-weight:300;

    letter-spacing:12px;

    color:#fff;

    text-shadow:
        0 0 10px rgba(70,180,255,.9),
        0 0 25px rgba(30,140,255,.7),
        0 0 60px rgba(0,100,255,.4);
}

.status{
    margin-top:7px;

    font:10px monospace;

    letter-spacing:3px;

    color:rgba(200,230,255,.75);
}

#dot{
    color:#168cff;

    text-shadow:
        0 0 8px #168cff,
        0 0 20px #168cff;
}

/* =====================================================
   CLOCK
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;

    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 10px rgba(50,160,255,.6);
}

#date{
    margin-top:3px;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(120,190,255,.75);
}

/* =====================================================
   CHAT VOCALE
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:50%;
    bottom:105px;

    transform:translateX(-50%);

    width:min(
        600px,
        calc(100% - 30px)
    );

    max-height:120px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:7px;

    pointer-events:none;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 15%,
            black 85%,
            transparent
        );
}

.message{
    padding:7px 13px;

    border-radius:14px;

    font-size:12px;

    line-height:1.4;

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    animation:
        messageIn .5s ease;

    text-align:center;

    max-width:90%;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.user{
    background:
        rgba(20,130,255,.08);

    border:
        1px solid
        rgba(30,150,255,.25);

    color:#dff2ff;
}

.jarvis{
    background:
        rgba(0,10,20,.55);

    border:
        1px solid
        rgba(40,150,255,.22);

    border-left:
        2px solid #168cff;

    color:#dcecff;

    box-shadow:
        0 0 25px
        rgba(20,130,255,.08);
}

/* =====================================================
   VOICE CORE
===================================================== */

#voiceCore{

    position:fixed;

    left:50%;
    bottom:28px;

    transform:
        translateX(-50%);

    width:58px;
    height:58px;

    z-index:40;

    border-radius:50%;

    border:
        1px solid
        rgba(30,150,255,.55);

    background:
        radial-gradient(
            circle,
            rgba(30,150,255,.18),
            rgba(0,10,20,.65)
        );

    color:#4da8ff;

    box-shadow:
        0 0 20px
        rgba(20,130,255,.2),

        inset 0 0 20px
        rgba(30,150,255,.1);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        .5s ease;
}

#voiceCore.active{

    background:
        radial-gradient(
            circle,
            rgba(40,160,255,.42),
            rgba(0,20,45,.72)
        );

    border-color:#168cff;

    box-shadow:
        0 0 30px
        rgba(20,140,255,.7),

        0 0 70px
        rgba(20,100,255,.35),

        inset 0 0 25px
        rgba(40,160,255,.25);
}

.icon{

    width:23px;
    height:23px;

    display:block;

    stroke:currentColor;

    fill:none;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;

    pointer-events:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{
        font-size:20px;
        letter-spacing:8px;
    }

    #clockPanel{
        top:15px;
        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #voiceCore{
        width:54px;
        height:54px;
        bottom:22px;
    }

    #chat{
        bottom:90px;
    }
}

</style>
</head>

<body>

<div id="loading">
    JARVIS HOLOGRAPHIC CORE
</div>

<canvas id="neuralCanvas"></canvas>

<div class="header">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status">

        <span id="dot">●</span>

        <span id="statusText">
            HOLOGRAPHIC INTERFACE ONLINE
        </span>

    </div>

</div>

<div id="clockPanel">

    <div id="clock">
        --:--:--
    </div>

    <div id="date">
        --
    </div>

</div>

<div id="chat"></div>

<button
    id="voiceCore"
    title="Attiva JARVIS"
    aria-label="Attiva JARVIS">

    <svg
        class="icon"
        viewBox="0 0 24 24">

        <rect
            x="9"
            y="3"
            width="6"
            height="11"
            rx="3"/>

        <path
            d="M5 11a7 7 0 0 0 14 0"/>

        <path
            d="M12 18v3"/>

        <path
            d="M8 21h8"/>

    </svg>

</button>


<script>

/* =====================================================
   CONFIGURAZIONE API
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
    document.getElementById(
        "neuralCanvas"
    );

const ctx =
    canvas.getContext("2d");

const voiceCore =
    document.getElementById(
        "voiceCore"
    );

const chat =
    document.getElementById(
        "chat"
    );

const dot =
    document.getElementById(
        "dot"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const clock =
    document.getElementById(
        "clock"
    );

const date =
    document.getElementById(
        "date"
    );


/* =====================================================
   STATO
===================================================== */

let state =
    "idle";

let busy =
    false;

let listening =
    false;

let wakeMode =
    true;

let recognition =
    null;

let wakeRecognition =
    null;


/* =====================================================
   MEMORIA
===================================================== */

let memory = [];

try{

    memory =
        JSON.parse(
            localStorage.getItem(
                "jarvis_memory"
            ) || "[]"
        );

}catch{

    memory = [];

}

memory =
    memory.slice(-40);


function saveMemory(){

    memory =
        memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );
}


function remember(
    role,
    content
){

    if(!content)
        return;

    memory.push({

        role,
        content,
        time:
            Date.now()

    });

    saveMemory();
}


/* =====================================================
   STATO JARVIS
===================================================== */

function setState(
    newState
){

    state =
        newState;

    if(
        newState === "listening" ||
        newState === "thinking" ||
        newState === "speaking"
    ){

        dot.style.color =
            "#168cff";

        voiceCore.classList.add(
            "active"
        );

    }else{

        voiceCore.classList.remove(
            "active"
        );

    }

    if(
        newState === "listening"
    ){

        statusText.textContent =
            "LISTENING...";

    }else if(
        newState === "thinking"
    ){

        statusText.textContent =
            "NEURAL PROCESSING...";

    }else if(
        newState === "speaking"
    ){

        statusText.textContent =
            "JARVIS SPEAKING...";

    }else{

        statusText.textContent =
            "HOLOGRAPHIC INTERFACE ONLINE";

    }
}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now =
        new Date();

    clock.textContent =
        now.toLocaleTimeString(
            "it-IT"
        );

    date.textContent =
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        text;

    chat.appendChild(
        element
    );

    while(
        chat.children.length > 4
    ){

        chat.removeChild(
            chat.firstChild
        );

    }

    return element;
}


/* =====================================================
   CANVAS
===================================================== */

let width =
    innerWidth;

let height =
    innerHeight;

let cx =
    width / 2;

let cy =
    height / 2;


/* =====================================================
   PARTICELLE DELLA TESTA
===================================================== */

let particles = [];


/*
    Questa funzione crea una testa
    tridimensionale vista frontalmente.

    Le particelle non sono un'immagine:
    vengono generate matematicamente.
*/

function createHead(){

    particles = [];

    const amount =
        innerWidth < 600
        ? 900
        : 1400;


    for(
        let i = 0;
        i < amount;
        i++
    ){

        /*
            Coordinate casuali
            sulla superficie di una testa.
        */

        const theta =
            Math.random()
            * Math.PI
            * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );


        /*
            Forma base cranio.
        */

        let x =
            Math.sin(phi)
            * Math.cos(theta);

        let y =
            Math.cos(phi);

        let z =
            Math.sin(phi)
            * Math.sin(theta);


        /*
            Allungamento verticale
            per sembrare una testa.
        */

        x *= .72;

        y *= 1.05;

        z *= .62;


        /*
            Mandibola leggermente più stretta.
        */

        if(
            y < -.15
        ){

            const factor =
                .78 +
                (y + 1)
                * .22;

            x *= factor;
        }


        /*
            MENTO.
        */

        if(
            y < -.55
        ){

            z -=
                .08 *
                Math.abs(y + .55);
        }


        /*
            NASO.
        */

        const noseZone =
            Math.abs(x) < .10 &&
            y > -.18 &&
            y < .32 &&
            z > .45;

        if(noseZone){

            z +=
                .20 *
                (1 -
                Math.abs(y-.05)/.25);
        }


        /*
            OCCHI.

            Creiamo due zone
            leggermente più sporgenti.
        */

        const eyeLeft =
            Math.pow(
                x + .27,
                2
            ) < .055 &&
            Math.pow(
                y - .18,
                2
            ) < .035 &&
            z > .40;

        const eyeRight =
            Math.pow(
                x - .27,
                2
            ) < .055 &&
            Math.pow(
                y - .18,
                2
            ) < .035 &&
            z > .40;

        if(
            eyeLeft ||
            eyeRight
        ){

            z += .07;
        }


        /*
            BOCCA.

            Una zona più sottile.
        */

        const mouth =
            Math.abs(y + .30) < .055 &&
            Math.abs(x) < .27 &&
            z > .42;

        if(mouth){

            z += .035;
        }


        /*
            Pixel / particella.
        */

        particles.push({

            x:x,
            y:y,
            z:z,

            baseX:x,
            baseY:y,
            baseZ:z,

            phase:
                Math.random()
                * Math.PI
                * 2,

            speed:
                .5 +
                Math.random()*1.5,

            size:
                .45 +
                Math.random()*.8,

            brightness:
                .45 +
                Math.random()*.55

        });

    }
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    width =
        innerWidth;

    height =
        innerHeight;

    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    cx =
        width / 2;

    cy =
        height / 2;

    createHead();
}

resize();


/* =====================================================
   MICROFONO / VOLUME
===================================================== */

let audioLevel =
    0;

let targetAudioLevel =
    0;


/*
    Simuliamo un movimento
    organico quando JARVIS parla
    o quando l'utente parla.

    Se il browser permette l'accesso
    al microfono, utilizziamo il volume reale.
*/

let audioContext =
    null;

let analyser =
    null;

let microphone =
    null;

let audioData =
    null;


async function setupAudio(){

    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize =
            256;

        microphone =
            audioContext.createMediaStreamSource(
                stream
            );

        microphone.connect(
            analyser
        );

        audioData =
            new Uint8Array(
                analyser.frequencyBinCount
            );

    }catch(error){

        console.log(
            "Microfono non disponibile."
        );

    }
}


function updateAudio(){

    if(
        analyser &&
        audioData
    ){

        analyser.getByteFrequencyData(
            audioData
        );

        let sum = 0;

        for(
            let i=0;
            i<audioData.length;
            i++
        ){

            sum +=
                audioData[i];

        }

        targetAudioLevel =
            sum /
            audioData.length /
            255;

    }else{

        /*
            Movimento automatico
            se il microfono non è disponibile.
        */

        if(
            state === "speaking" ||
            state === "listening"
        ){

            targetAudioLevel =
                .18 +
                Math.random()*.12;

        }else{

            targetAudioLevel =
                .025;

        }
    }

    audioLevel +=
        (
            targetAudioLevel -
            audioLevel
        ) * .15;
}


/* =====================================================
   DISEGNO
===================================================== */

let rotation =
    0;

let headScale =
    1;


function animate(){

    requestAnimationFrame(
        animate
    );

    updateAudio();


    const time =
        performance.now()
        / 1000;


    /*
        Movimento della testa.
    */

    rotation +=
        .0015;


    /*
        La testa respira
        in base alla voce.
    */

    const pulse =
        Math.sin(
            time * 1.8
        ) * .015;


    headScale =
        1 +
        pulse +
        audioLevel * .12;


    /*
        Sfondo nero con persistenza
        per lasciare una scia luminosa.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.20)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        Glow centrale.
    */

    const glow =
        Math.min(
            width,
            height
        ) * .42;

    const gradient =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            glow
        );

    gradient.addColorStop(
        0,
        "rgba(20,130,255,.15)"
    );

    gradient.addColorStop(
        .45,
        "rgba(10,100,255,.05)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        glow,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Scala della testa.
    */

    const radius =
        Math.min(
            width,
            height
        ) * .32;


    /*
        Proiezione 3D.
    */

    const projected = [];


    particles.forEach(
        p=>{

            /*
                Rotazione 3D.
            */

            let x =
                p.baseX;

            let y =
                p.baseY;

            let z =
                p.baseZ;


            const rot =
                rotation;

            const cos =
                Math.cos(rot);

            const sin =
                Math.sin(rot);


            const rx =
                x*cos -
                z*sin;

            const rz =
                x*sin +
                z*cos;


            x =
                rx;

            z =
                rz;


            /*
                Movimento legato
                alla voce.

                Le particelle si espandono
                e vibrano invece di sfocarsi.
            */

            const wave =
                Math.sin(
                    time *
                    p.speed +
                    p.phase
                );

            const movement =
                audioLevel *
                (
                    0.025 +
                    Math.abs(wave)
                    * .065
                );


            x +=
                x *
                movement;

            y +=
                y *
                movement;

            z +=
                z *
                movement;


            /*
                Prospettiva.
            */

            const perspective =
                1 /
                (
                    1.7 -
                    z*.45
                );


            const screenX =
                cx +
                x *
                radius *
                perspective *
                headScale;

            const screenY =
                cy -
                y *
                radius *
                perspective *
                headScale;


            const particleSize =
                (
                    p.size *
                    perspective
                ) *
                (
                    1 +
                    audioLevel*1.4
                );


            projected.push({

                x:screenX,
                y:screenY,

                z:z,

                size:
                    particleSize,

                brightness:
                    p.brightness,

                phase:
                    p.phase

            });

        }
    );


    /*
        Ordiniamo le particelle
        per profondità.
    */

    projected.sort(
        (a,b)=>
            a.z-b.z
    );


    /* =================================================
       CONNESSIONI
    ================================================= */

    /*
        Non colleghiamo tutto.

        Questo crea una rete neurale
        molto più elegante.
    */

    const connectionDistance =
        state === "thinking"
        ? 85
        : 62;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        /*
            Limitiamo il numero
            di confronti per evitare
            di appesantire il telefono.
        */

        if(
            i % 2 !== 0
        )
            continue;


        const a =
            projected[i];


        for(
            let j=i+1;
            j<projected.length;
            j+=2
        ){

            const b =
                projected[j];


            const dx =
                a.x-b.x;

            const dy =
                a.y-b.y;

            const dist =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                dist <
                connectionDistance
            ){

                const alpha =
                    (
                        1 -
                        dist /
                        connectionDistance
                    )
                    *
                    (
                        .09 +
                        audioLevel*.22
                    );


                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.strokeStyle =
                    `rgba(
                        35,
                        145,
                        255,
                        ${alpha}
                    )`;

                ctx.lineWidth =
                    .35 +
                    audioLevel*.5;

                ctx.stroke();

            }

        }

    }


    /* =================================================
       PARTICELLE
    ================================================= */

    projected.forEach(
        p=>{

            const flicker =
                (
                    Math.sin(
                        time*3+
                        p.phase
                    )+1
                )/2;


            const brightness =
                Math.min(
                    1,
                    p.brightness +
                    flicker*.15 +
                    audioLevel*.45
                );


            /*
                Glow.
            */

            const glowSize =
                p.size *
                (
                    2.5 +
                    audioLevel*3
                );


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                glowSize,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
                `rgba(
                    35,
                    150,
                    255,
                    ${brightness*.12}
                )`;

            ctx.fill();


            /*
                Particella principale.
            */

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
                `rgba(
                    ${100 + brightness*100},
                    ${190 + brightness*50},
                    255,
                    ${.65 + brightness*.35}
                )`;

            ctx.fill();


            /*
                Piccolo punto bianco
                al centro.
            */

            if(
                p.size > .65
            ){

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size*.25,
                    0,
                    Math.PI*2
                );

                ctx.fillStyle =
                    "rgba(255,255,255,.8)";

                ctx.fill();

            }

        }
    );


    /*
        LINEA ORIZZONTALE
        tipo scanner.
    */

    const scanY =
        cy +
        Math.sin(time*.5)
        * radius
        * .9;


    ctx.beginPath();

    ctx.moveTo(
        cx-radius*1.05,
        scanY
    );

    ctx.lineTo(
        cx+radius*1.05,
        scanY
    );

    ctx.strokeStyle =
        "rgba(40,160,255,.035)";

    ctx.lineWidth =
        1;

    ctx.stroke();


    /*
        Occhi più luminosi.

        Non sono immagini:
        sono semplicemente particelle
        enfatizzate matematicamente.
    */

    drawEye(
        -.27
    );

    drawEye(
        .27
    );
}


/* =====================================================
   OCCHI
===================================================== */

function drawEye(
    side
){

    const radius =
        Math.min(
            width,
            height
        ) * .32;


    const x =
        cx +
        side *
        radius *
        .70;


    const y =
        cy -
        radius *
        .19;


    const eyeGlow =
        7 +
        audioLevel*10;


    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            eyeGlow
        );


    gradient.addColorStop(
        0,
        "rgba(120,220,255,.9)"
    );

    gradient.addColorStop(
        .3,
        "rgba(40,160,255,.35)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        eyeGlow,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#dff8ff";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        1.5+
        audioLevel*1.5,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =====================================================
   AVVIO ANIMAZIONE
===================================================== */

animate();


/* =====================================================
   SPEECH SYNTHESIS
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        setState(
            "idle"
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    /*
        Voce più profonda.
    */

    utterance.rate =
        .82;

    utterance.pitch =
        .58;

    utterance.volume =
        1;


    utterance.onstart =
        ()=>{

            setState(
                "speaking"
            );

        };


    utterance.onend =
        ()=>{

            setState(
                "idle"
            );

            if(
                wakeMode &&
                !busy
            ){

                setTimeout(
                    startWakeWord,
                    900
                );

            }

        };


    utterance.onerror =
        ()=>{

            setState(
                "idle"
            );

        };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(Recognition){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        ()=>{

            listening =
                true;

            setState(
                "listening"
            );

        };


    recognition.onresult =
        event=>{

            let transcript =
                "";


            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                transcript +=
                    event.results[i][0]
                    .transcript;

            }


            const last =
                event.results[
                    event.results.length-1
                ];


            if(
                last.isFinal
            ){

                const text =
                    transcript.trim();


                if(text){

                    sendMessage(
                        text
                    );

                }

            }

        };


    recognition.onerror =
        event=>{

            console.log(
                "Speech recognition:",
                event.error
            );

        };


    recognition.onend =
        ()=>{

            listening =
                false;


            if(
                state === "listening"
            ){

                setState(
                    "idle"
                );

            }

        };

}else{

    console.log(
        "Speech Recognition non supportato."
    );

}


/* =====================================================
   WAKE WORD "JARVIS"
===================================================== */

function startWakeWord(){

    if(
        !Recognition ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition
    ){

        return;
    }


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeRecognition.onresult =
        event=>{

            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase()
                    .trim();


                if(
                    text.includes(
                        "jarvis"
                    )
                ){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition =
                        null;


                    activateJarvis();

                    return;

                }

            }

        };


    wakeRecognition.onerror =
        ()=>{

            wakeRecognition =
                null;


            if(
                wakeMode &&
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    1000
                );

            }

        };


    wakeRecognition.onend =
        ()=>{

            wakeRecognition =
                null;


            if(
                wakeMode &&
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    700
                );

            }

        };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition =
            null;

    }

}


/* =====================================================
   ATTIVAZIONE
===================================================== */

function activateJarvis(){

    if(
        busy ||
        listening
    ){

        return;
    }


    setState(
        "listening"
    );


    setTimeout(
        ()=>{

            try{

                recognition.start();

            }catch(error){

                console.log(
                    error
                );

            }

        },
        450
    );
}


/* =====================================================
   INVIO ALL'AI
===================================================== */

async function sendMessage(
    text
){

    if(
        !text ||
        busy
    ){

        return;
    }


    busy =
        true;


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    setState(
        "thinking"
    );


    const answer =
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory =
        memory.slice(-24);


    const intelligentContext = {

        assistantName:
            "JARVIS",

        language:
            "it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Comprendi il significato della domanda.",

            "Rispondi in modo naturale e diretto.",

            "Se hai abbastanza informazioni, rispondi direttamente.",

            "Se una domanda è ambigua, fai una domanda breve.",

            "Usa la memoria della conversazione quando è utile.",

            "Non inventare informazioni.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "Le risposte vocali devono essere naturali e non troppo lunghe.",

            "Non usare emoji nelle risposte."

        ]

    };


    try{

        const response =
            await fetch(
                API,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.reply
        ){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent =
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(
            error
        );


        answer.textContent =
            "Neural Core non raggiungibile.";


        speak(
            "Non riesco a raggiungere il Neural Core."
        );


        setState(
            "idle"
        );

    }


    busy =
        false;
}
