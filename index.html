<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — 3D NEURAL CORE</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#249cff;

    transition:opacity 1.2s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    top:20px;
    left:0;
    width:100%;

    text-align:center;

    z-index:20;
    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;
    font-weight:300;

    letter-spacing:12px;

    color:#fff;

    text-shadow:
        0 0 12px rgba(40,160,255,.9),
        0 0 30px rgba(20,120,255,.65),
        0 0 60px rgba(0,100,255,.35);
}

.status{
    margin-top:7px;

    font:10px monospace;
    letter-spacing:3px;

    color:rgba(210,235,255,.75);
}

#dot{
    color:#159cff;

    text-shadow:
        0 0 8px #159cff,
        0 0 18px #159cff;
}

/* =====================================================
   CLOCK
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;
    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 10px rgba(40,150,255,.6);
}

#date{
    margin-top:3px;

    font-size:9px;
    letter-spacing:2px;

    color:rgba(120,190,255,.75);
}

/* =====================================================
   CHAT VOCALE
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:50%;
    bottom:105px;

    transform:translateX(-50%);

    width:min(
        600px,
        calc(100% - 40px)
    );

    max-height:110px;

    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:7px;

    pointer-events:none;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 20%,
            black 80%,
            transparent
        );
}

.message{
    padding:7px 13px;

    border-radius:14px;

    font-size:12px;
    line-height:1.4;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    animation:
        messageIn .45s ease;

    text-align:center;

    max-width:90%;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.user{
    background:
        rgba(20,130,255,.08);

    border:
        1px solid
        rgba(30,150,255,.25);

    color:#dff2ff;
}

.jarvis{
    background:
        rgba(0,10,20,.55);

    border:
        1px solid
        rgba(40,150,255,.22);

    border-left:
        2px solid #168cff;

    color:#dcecff;

    box-shadow:
        0 0 25px
        rgba(20,130,255,.06);
}

/* =====================================================
   VOICE CORE
===================================================== */

#voiceCore{
    position:fixed;

    left:50%;
    bottom:28px;

    transform:
        translateX(-50%);

    width:58px;
    height:58px;

    z-index:40;

    border-radius:50%;

    border:
        1px solid
        rgba(30,150,255,.5);

    background:
        radial-gradient(
            circle,
            rgba(30,150,255,.18),
            rgba(0,10,20,.55)
        );

    color:#4da8ff;

    box-shadow:
        0 0 20px
        rgba(20,130,255,.18),

        inset 0 0 20px
        rgba(30,150,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .5s ease,
        background .5s ease,
        box-shadow .5s ease;
}

#voiceCore:hover{
    transform:
        translateX(-50%)
        scale(1.05);
}

#voiceCore.active{
    background:
        radial-gradient(
            circle,
            rgba(40,160,255,.42),
            rgba(0,20,45,.72)
        );

    border-color:#168cff;

    box-shadow:
        0 0 25px rgba(20,140,255,.55),
        0 0 55px rgba(20,100,255,.28),
        inset 0 0 25px rgba(40,160,255,.2);

    animation:
        voicePulse 2s ease-in-out infinite;
}

@keyframes voicePulse{

    0%,100%{
        box-shadow:
            0 0 22px rgba(20,140,255,.45),
            0 0 45px rgba(20,100,255,.18);
    }

    50%{
        box-shadow:
            0 0 35px rgba(30,160,255,.8),
            0 0 70px rgba(20,110,255,.32);
    }
}

.icon{
    width:23px;
    height:23px;

    display:block;

    stroke:currentColor;
    fill:none;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;

    pointer-events:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{
        font-size:20px;
        letter-spacing:8px;
    }

    #clockPanel{
        top:15px;
        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #chat{
        bottom:90px;
        width:
            calc(100% - 30px);
    }

    #voiceCore{
        bottom:20px;

        width:54px;
        height:54px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<div id="loading">
    JARVIS NEURAL CORE
</div>

<canvas id="neuralCanvas"></canvas>

<div class="header">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status">

        <span id="dot">●</span>

        <span id="statusText">
            NEURAL INTERFACE ONLINE
        </span>

    </div>

</div>

<div id="clockPanel">

    <div id="clock">
        --:--:--
    </div>

    <div id="date">
        --
    </div>

</div>

<div id="chat"></div>

<button
    id="voiceCore"
    title="Attiva JARVIS"
    aria-label="Attiva JARVIS">

    <svg
        class="icon"
        viewBox="0 0 24 24"
        aria-hidden="true">

        <rect
            x="9"
            y="3"
            width="6"
            height="11"
            rx="3"
        />

        <path
            d="M5 11a7 7 0 0 0 14 0"
        />

        <path
            d="M12 18v3"
        />

        <path
            d="M8 21h8"
        />

    </svg>

</button>

<script>

/* =====================================================
   API JARVIS
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
    document.getElementById("neuralCanvas");

const ctx =
    canvas.getContext("2d");

const voiceCore =
    document.getElementById("voiceCore");

const chat =
    document.getElementById("chat");

const dot =
    document.getElementById("dot");

const statusText =
    document.getElementById("statusText");

const clock =
    document.getElementById("clock");

const date =
    document.getElementById("date");


/* =====================================================
   STATO
===================================================== */

let state = "idle";

let busy = false;

let listening = false;

let wakeMode = true;

let recognition = null;

let wakeRecognition = null;


/* =====================================================
   AUDIO REATTIVO
===================================================== */

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let audioData = null;

let audioLevel = 0;


/*
   Questa funzione prova ad agganciare
   il microfono all'analizzatore audio.

   Il microfono viene utilizzato solamente
   per misurare il volume della voce.
*/

async function setupAudio(){

    try{

        if(audioContext){
            return;
        }

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 256;

        analyser.smoothingTimeConstant =
            .75;

        microphoneSource =
            audioContext.createMediaStreamSource(
                stream
            );

        microphoneSource.connect(
            analyser
        );

        audioData =
            new Uint8Array(
                analyser.frequencyBinCount
            );

    }catch(error){

        console.log(
            "Audio analyser:",
            error
        );
    }
}


function updateAudioLevel(){

    if(!analyser || !audioData){

        audioLevel *= .92;

        return;
    }

    analyser.getByteFrequencyData(
        audioData
    );

    let total = 0;

    for(let i=0;i<audioData.length;i++){

        total += audioData[i];
    }

    const average =
        total /
        audioData.length;

    const target =
        Math.min(
            1,
            average / 70
        );

    audioLevel +=
        (target - audioLevel)
        * .28;
}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();

    clock.textContent =
        now.toLocaleTimeString(
            "it-IT"
        );

    date.textContent =
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        text;

    chat.appendChild(
        element
    );

    while(
        chat.children.length > 4
    ){

        chat.removeChild(
            chat.firstChild
        );
    }

    return element;
}


/* =====================================================
   MEMORIA
===================================================== */

let memory = [];

try{

    memory =
        JSON.parse(
            localStorage.getItem(
                "jarvis_memory"
            ) || "[]"
        );

}catch{

    memory = [];
}

memory =
    memory.slice(-40);


function saveMemory(){

    memory =
        memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );
}


function remember(
    role,
    content
){

    if(!content){
        return;
    }

    memory.push({

        role,

        content,

        time:
            Date.now()
    });

    saveMemory();
}


/* =====================================================
   STATO JARVIS
===================================================== */

function setState(
    newState
){

    state =
        newState;

    const active =
        newState === "listening" ||
        newState === "thinking" ||
        newState === "speaking";

    if(active){

        dot.style.color =
            "#168cff";

        voiceCore.classList.add(
            "active"
        );

    }else{

        dot.style.color =
            "#168cff";

        voiceCore.classList.remove(
            "active"
        );
    }

    if(newState === "listening"){

        statusText.textContent =
            "LISTENING...";

    }else if(newState === "thinking"){

        statusText.textContent =
            "NEURAL PROCESSING...";

    }else if(newState === "speaking"){

        statusText.textContent =
            "JARVIS SPEAKING...";

    }else{

        statusText.textContent =
            "NEURAL INTERFACE ONLINE";
    }
}


/* =====================================================
   3D NEURAL SPHERE
===================================================== */

let width =
    innerWidth;

let height =
    innerHeight;

let cx =
    width / 2;

let cy =
    height / 2;


/*
   Raggio della sfera.

   La sfera è più grande su desktop
   e leggermente più piccola su mobile.
*/

let sphereRadius =
    Math.min(
        width,
        height
    ) * .29;


/*
   Numero di neuroni.

   Sono piccoli e numerosi.
*/

const NODE_COUNT =
    innerWidth < 600
    ? 520
    : 780;


let nodes = [];

let rotationX = 0;

let rotationY = 0;


/* =====================================================
   CREA SFERA 3D
===================================================== */

function createSphere(){

    nodes = [];

    for(
        let i = 0;
        i < NODE_COUNT;
        i++
    ){

        /*
           Distribuzione uniforme
           sulla superficie della sfera.
        */

        const y =
            1 -
            (
                2 * i
                /
                (NODE_COUNT - 1)
            );

        const radius =
            Math.sqrt(
                1 - y*y
            );

        const theta =
            Math.PI *
            (
                3 -
                Math.sqrt(5)
            ) *
            i;

        const x =
            Math.cos(theta)
            * radius;

        const z =
            Math.sin(theta)
            * radius;

        nodes.push({

            x,
            y,
            z,

            baseX:x,
            baseY:y,
            baseZ:z,

            phase:
                Math.random()
                * Math.PI * 2,

            speed:
                .5 +
                Math.random() * 1.4,

            size:
                .45 +
                Math.random() * .7,

            energy:
                Math.random(),

            special:
                Math.random() < .035
        });
    }
}


/* =====================================================
   ROTAZIONE 3D
===================================================== */

function rotatePoint(
    x,
    y,
    z
){

    const cosX =
        Math.cos(rotationX);

    const sinX =
        Math.sin(rotationX);

    const cosY =
        Math.cos(rotationY);

    const sinY =
        Math.sin(rotationY);


    /*
       Rotazione X
    */

    let y1 =
        y * cosX -
        z * sinX;

    let z1 =
        y * sinX +
        z * cosX;


    /*
       Rotazione Y
    */

    let x2 =
        x * cosY +
        z1 * sinY;

    let z2 =
        -x * sinY +
        z1 * cosY;


    return{

        x:x2,

        y:y1,

        z:z2
    };
}


/* =====================================================
   RENDER 3D
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
        performance.now()
        / 1000;


    updateAudioLevel();


    /*
       Energia generale.

       La sfera NON diventa sfocata.

       Si muovono solamente i neuroni.
    */

    let energy = .06;

    if(state === "listening"){

        energy =
            .25 +
            audioLevel * 1.5;

    }else if(state === "thinking"){

        energy = .75;

    }else if(state === "speaking"){

        energy =
            .35 +
            audioLevel * 1.1;
    }


    /*
       Sfondo.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.24)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Rotazione lenta.

       Quando si parla aumenta.
    */

    rotationY +=
        .0022 +
        energy * .0015;

    rotationX =
        Math.sin(
            time * .22
        ) * .12;


    /*
       Proiezione 3D.
    */

    const projected = [];


    nodes.forEach(
        node => {

            /*
               Impulso radiale.

               Il movimento segue il volume
               della voce.
            */

            const wave =
                Math.sin(
                    time *
                    (
                        2.2 +
                        energy * 3
                    )
                    +
                    node.phase
                );


            const pulse =
                wave *
                energy *
                .075;


            /*
               La sfera mantiene la forma.

               I punti fanno piccoli movimenti
               dentro/fuori.
            */

            const scale =
                1 +
                pulse;


            const p =
                rotatePoint(
                    node.baseX * scale,
                    node.baseY * scale,
                    node.baseZ * scale
                );


            /*
               Prospettiva 3D.
            */

            const depth =
                1.7 /
                (
                    2.4 -
                    p.z
                );


            const x =
                cx +
                p.x *
                sphereRadius *
                depth;


            const y =
                cy +
                p.y *
                sphereRadius *
                depth;


            const size =
                node.size *
                depth *
                (
                    1 +
                    energy * .7
                );


            /*
               Alpha basata sulla profondità.
            */

            const alpha =
                .28 +
                (
                    p.z + 1
                )
                * .36;


            projected.push({

                node,

                x,

                y,

                z:p.z,

                size,

                alpha
            });
        }
    );


    /*
       Ordina dal più lontano
       al più vicino.
    */

    projected.sort(
        (a,b) =>
            a.z - b.z
    );


    /* =================================================
       CONNESSIONI
    ================================================= */

    /*
       La sfera ha una rete neurale vera.

       Quando parli aumenta il numero
       di connessioni visibili.
    */

    const connectionDistance =
        sphereRadius *
        (
            .18 +
            energy * .08
        );


    for(
        let i = 0;
        i < projected.length;
        i++
    ){

        const a =
            projected[i];


        /*
           Limitiamo la ricerca
           per mantenere il rendering fluido.
        */

        const maxJ =
            Math.min(
                projected.length,
                i + 38
            );


        for(
            let j = i + 1;
            j < maxJ;
            j++
        ){

            const b =
                projected[j];


            /*
               Differenza di profondità.
            */

            if(
                Math.abs(
                    a.z - b.z
                ) > .55
            ){

                continue;
            }


            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(
                distance <
                connectionDistance
            ){

                let alpha =
                    (
                        1 -
                        distance /
                        connectionDistance
                    )
                    *
                    (
                        .10 +
                        energy * .22
                    );


                /*
                   Alcune linee diventano
                   impulsi luminose.
                */

                const signal =
                    (
                        Math.sin(
                            time * 4 +
                            a.node.phase * 3
                        ) + 1
                    )
                    / 2;


                alpha +=
                    signal *
                    energy *
                    .07;


                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );


                ctx.strokeStyle =
                    `rgba(
                        45,
                        160,
                        255,
                        ${alpha}
                    )`;


                ctx.lineWidth =
                    .35 +
                    energy * .35;


                ctx.stroke();
            }
        }
    }


    /* =================================================
       NEURONI
    ================================================= */

    projected.forEach(
        p => {

            const node =
                p.node;


            const flicker =
                (
                    Math.sin(
                        time *
                        node.speed *
                        4
                        +
                        node.phase
                    )
                    + 1
                )
                / 2;


            let r = 35;

            let g = 150;

            let b = 255;


            /*
               Alcuni punti sono
               quasi bianchi/blu.
            */

            if(node.special){

                r = 130;

                g = 220;

                b = 255;
            }


            /*
               Glow piccolo.

               Non viene usato blur sulla sfera:
               è il singolo neurone ad avere
               un piccolo alone.
            */

            const glowSize =
                p.size *
                (
                    3.0 +
                    energy * 1.5
                );


            ctx.fillStyle =
                `rgba(
                    ${r},
                    ${g},
                    ${b},
                    ${p.alpha * .12}
                )`;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                glowSize,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
               Punto principale.
            */

            const finalSize =
                p.size *
                (
                    1 +
                    flicker * .25 +
                    energy * .45
                );


            ctx.fillStyle =
                `rgba(
                    ${r},
                    ${g},
                    ${b},
                    ${Math.min(
                        1,
                        p.alpha + .25
                    )}
                )`;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                finalSize,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
               Piccolo centro bianco
               per dare l'effetto vetro/luminoso.
            */

            if(
                node.special ||
                energy > .55
            ){

                ctx.fillStyle =
                    `rgba(
                        235,
                        250,
                        255,
                        ${p.alpha * .75}
                    )`;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    finalSize * .32,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }
    );


    /* =================================================
       AURA DELLA SFERA
    ================================================= */

    const auraPulse =
        Math.sin(
            time * 2
        ) * .5 + .5;


    const auraRadius =
        sphereRadius *
        (
            1.04 +
            energy * .08
        );


    const aura =
        ctx.createRadialGradient(
            cx,
            cy,
            sphereRadius * .65,

            cx,
            cy,
            auraRadius
        );


    aura.addColorStop(
        0,
        "rgba(20,140,255,.025)"
    );

    aura.addColorStop(
        .7,
        `rgba(
            20,
            130,
            255,
            ${.025 + auraPulse*.012}
        )`
    );

    aura.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        aura;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        auraRadius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* =================================================
       CORE CENTRALE
    ================================================= */

    const coreSize =
        2.5 +
        energy * 3;


    ctx.fillStyle =
        `rgba(
            40,
            160,
            255,
            ${.15 + energy*.15}
        )`;


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        coreSize * 6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "rgba(65,180,255,.95)";


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        coreSize,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#fff";


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        coreSize * .38,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    width =
        innerWidth;

    height =
        innerHeight;

    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    cx =
        width / 2;

    cy =
        height / 2;


    sphereRadius =
        Math.min(
            width,
            height
        ) * (
            width < 600
            ? .31
            : .29
        );
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   SPEAK
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        setState("idle");

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    /*
       Voce profonda e lenta.
    */

    utterance.rate =
        .82;

    utterance.pitch =
        .58;

    utterance.volume =
        1;


    utterance.onstart =
        () => {

            setState(
                "speaking"
            );
        };


    utterance.onend =
        () => {

            setState(
                "idle"
            );

            if(
                wakeMode &&
                !busy
            ){

                setTimeout(
                    startWakeWord,
                    800
                );
            }
        };


    utterance.onerror =
        () => {

            setState(
                "idle"
            );
        };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localCommand(text){

    const t =
        text.toLowerCase();


    if(
        t.includes("che ore sono") ||
        t.includes("che ora è") ||
        t.includes("che ora e")
    ){

        return (
            "Sono le " +
            new Date()
                .toLocaleTimeString(
                    "it-IT",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                ) +
            "."
        );
    }


    if(
        t.includes("che giorno è") ||
        t.includes("che giorno e")
    ){

        return (
            "Oggi è " +
            new Date()
                .toLocaleDateString(
                    "it-IT",
                    {
                        weekday:"long",
                        day:"numeric",
                        month:"long",
                        year:"numeric"
                    }
                ) +
            "."
        );
    }


    return null;
}


/* =====================================================
   INVIO AI
===================================================== */

async function sendMessage(
    text
){

    if(
        !text ||
        busy
    ){

        return;
    }


    busy = true;


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    const local =
        localCommand(
            text
        );


    if(local){

        addMessage(
            "jarvis",
            local
        );

        remember(
            "assistant",
            local
        );

        speak(
            local
        );

        busy = false;

        return;
    }


    setState(
        "thinking"
    );


    const answer =
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory =
        memory.slice(-24);


    const intelligentContext = {

        assistantName:
            "JARVIS",

        language:
            "it-IT",

        currentTime:
            new Date()
                .toLocaleTimeString(
                    "it-IT"
                ),

        currentDate:
            new Date()
                .toLocaleDateString(
                    "it-IT"
                ),

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Rispondi in modo naturale e diretto.",

            "Comprendi il significato della domanda.",

            "Non inventare informazioni.",

            "Usa la memoria quando è utile.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "Le risposte vocali devono essere naturali e non troppo lunghe.",

            "Non usare emoji nelle risposte."
        ]
    };


    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext
                        })
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );
        }


        answer.textContent =
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(
            error
        );


        answer.textContent =
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        speak(
            "Non riesco a raggiungere il Neural Core."
        );
    }


    busy = false;
}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(Recognition){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        () => {

            listening = true;

            setState(
                "listening"
            );

            setupAudio();
        };


    recognition.onresult =
        event => {

            let transcript =
                "";


            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                transcript +=
                    event.results[i][0]
                    .transcript;
            }


            const last =
                event.results[
                    event.results.length - 1
                ];


            if(
                last.isFinal
            ){

                const text =
                    transcript.trim();


                if(text){

                    sendMessage(
                        text
                    );
                }
            }
        };


    recognition.onerror =
        event => {

            console.log(
                "Speech recognition:",
                event.error
            );
        };


    recognition.onend =
        () => {

            listening = false;


            if(
                state ===
                "listening"
            ){

                setState(
                    "idle"
                );
            }
        };
}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(
        !Recognition ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition
    ){

        return;
    }


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeRecognition.onresult =
        event => {

            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase()
                    .trim();


                if(
                    text.includes(
                        "jarvis"
                    )
                ){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition =
                        null;


                    activateJarvis();

                    return;
                }
            }
        };


    wakeRecognition.onerror =
        () => {

            wakeRecognition =
                null;


            if(
                wakeMode &&
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    1000
                );
            }
        };


    wakeRecognition.onend =
        () => {

            wakeRecognition =
                null;


            if(
                wakeMode &&
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    700
                );
            }
        };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition =
            null;
    }
}


/* =====================================================
   ATTIVA JARVIS
===================================================== */

function activateJarvis(){

    if(
        busy ||
        listening ||
        !recognition
    ){

        return;
    }


    setState(
        "listening"
    );


    /*
       Piccola pausa per evitare
       che "Jarvis" finisca nella domanda.
    */

    setTimeout(
        () => {

            try{

                recognition.start();

            }catch(error){

                console.log(
                    error
                );
            }

        },
        350
    );
}


/* =====================================================
   PULSANTE
===================================================== */

voiceCore.onclick =
    () => {

        if(
            busy ||
            !recognition
        ){

            return;
        }


        if(listening){

            recognition.stop();

            return;
        }


        try{

            recognition.start();

        }catch(error){

            console.log(
                error
            );
        }
    };


/* =====================================================
   START
===================================================== */

resize();

createSphere();

animate();


setTimeout(
    () => {

        document
            .getElementById(
                "loading"
            )
            .classList.add(
                "hidden"
            );


        setTimeout(
            startWakeWord,
            700
        );

    },
    900
);


/* =====================================================
   API PUBBLICA
===================================================== */

window.JARVIS =
{

    activate:
        activateJarvis,

    speak:
        speak,

    sendMessage:
        sendMessage
};

</script>
