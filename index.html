<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Neural Interface</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
    radial-gradient(circle at center,rgba(255,180,0,.035),transparent 40%),
    #000;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* ================= HUD ================= */

.hud{
    position:fixed;
    z-index:10;
    font-family:monospace;
    font-size:9px;
    letter-spacing:2px;
    line-height:1.8;
    color:rgba(255,205,50,.48);
    pointer-events:none;
}

.hud.left{
    top:24px;
    left:24px;
    border-left:2px solid rgba(255,190,0,.6);
    padding-left:10px;
}

.hud.right{
    top:24px;
    right:24px;
    text-align:right;
    border-right:2px solid rgba(255,190,0,.6);
    padding-right:10px;
}

/* ================= TITLE ================= */

.title{
    position:fixed;
    top:22px;
    left:0;
    right:0;
    z-index:11;
    text-align:center;
    pointer-events:none;
}

.title h1{
    margin:0;
    font-size:24px;
    font-weight:200;
    letter-spacing:12px;
    color:#fff;
    text-shadow:
        0 0 8px rgba(255,220,100,.9),
        0 0 25px rgba(255,160,0,.45);
}

.status{
    margin-top:7px;
    font-family:monospace;
    font-size:9px;
    letter-spacing:3px;
    color:rgba(255,205,50,.7);
}

.status span{
    color:#ffd000;
    text-shadow:0 0 10px #ffd000;
}

/* ================= CORE ================= */

.core-label{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:6;
    font-family:monospace;
    text-align:center;
    font-size:8px;
    letter-spacing:4px;
    color:rgba(255,220,100,.35);
    pointer-events:none;
    transition:.3s;
}

.core-label b{
    display:block;
    margin-top:8px;
    font-size:7px;
    letter-spacing:2px;
    font-weight:normal;
}

/* ================= CHAT ================= */

#chat{
    position:fixed;
    left:50%;
    bottom:112px;
    transform:translateX(-50%);
    width:100%;
    max-width:720px;
    max-height:24vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:0 20px;
    z-index:20;
    scrollbar-width:none;
}

#chat::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:82%;
    padding:10px 14px;
    border-radius:4px;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    backdrop-filter:blur(12px);
}

.user{
    align-self:flex-end;
    color:#fff;
    background:rgba(255,190,0,.07);
    border:1px solid rgba(255,200,0,.3);
    border-right:3px solid #ffd000;
}

.jarvis{
    align-self:flex-start;
    color:#ffeab0;
    background:rgba(15,10,0,.82);
    border:1px solid rgba(255,200,0,.18);
    border-left:3px solid #ffd000;
}

/* ================= INPUT ================= */

.input-container{
    position:fixed;
    left:50%;
    bottom:23px;
    transform:translateX(-50%);
    width:100%;
    max-width:720px;
    padding:0 20px;
    z-index:30;
}

.input-box{
    display:flex;
    gap:7px;
    padding:5px;
    background:rgba(7,5,0,.94);
    border:1px solid rgba(255,200,0,.35);
    border-radius:7px;
    box-shadow:0 0 30px rgba(255,160,0,.05);
    transition:.3s;
}

.input-box:focus-within{
    border-color:rgba(255,205,0,.8);
    box-shadow:0 0 25px rgba(255,180,0,.12);
}

#input{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 14px;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:14px;
}

#input::placeholder{
    color:rgba(255,220,150,.3);
}

button{
    height:44px;
    border-radius:4px;
    border:1px solid rgba(255,200,0,.5);
    background:rgba(255,180,0,.08);
    color:#ffd000;
    cursor:pointer;
    font-family:monospace;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    background:#ffd000;
    color:#000;
    box-shadow:0 0 18px rgba(255,190,0,.5);
}

button:disabled{
    opacity:.3;
    cursor:not-allowed;
}

#mic{
    width:48px;
    font-size:17px;
}

#send{
    width:72px;
}

.listening{
    background:#4f8cff!important;
    color:#fff!important;
    box-shadow:
        0 0 12px #4f8cff,
        0 0 35px rgba(50,100,255,.7)!important;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .hud{
        display:none;
    }

    .title h1{
        font-size:19px;
        letter-spacing:8px;
    }

    .message{
        max-width:90%;
    }

    #chat{
        bottom:110px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="hud left">
JARVIS_CORE // V5<br>
NEURAL ENGINE: ONLINE<br>
ADAPTIVE ENERGY: ACTIVE
</div>

<div class="hud right">
MEMORY: <span id="memoryNumber">0</span><br>
STATE: <span id="hudState">IDLE</span>
</div>

<div class="title">
<h1>J.A.R.V.I.S.</h1>

<div class="status">
<span>●</span> NEURAL INTERFACE ONLINE
</div>
</div>

<div class="core-label">
NEURAL CORE
<b id="coreState">SYSTEM READY</b>
</div>

<div id="chat">

<div class="message jarvis">
JARVIS online. Neural interface inizializzata.
</div>

</div>

<div class="input-container">

<div class="input-box">

<input
id="input"
type="text"
placeholder="Parla con JARVIS..."
autocomplete="off"
>

<button
id="mic"
type="button"
>
🎙
</button>

<button
id="send"
type="button"
>
EXEC
</button>

</div>

</div>

<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API_URL =
"https://iao-ai-v3.oceano-masoud.workers.dev/";

const MEMORY_KEY =
"JARVIS_NEURAL_MEMORY_V5";

const MAX_MEMORY = 30;


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const chat =
document.getElementById("chat");

const memoryNumber =
document.getElementById("memoryNumber");

const hudState =
document.getElementById("hudState");

const coreState =
document.getElementById("coreState");


/* =====================================================
   STATI
===================================================== */

let state =
"idle";

let listening =
false;

let speaking =
false;

let voiceLevel =
0;


function setState(newState){

    state =
    newState;

    hudState.textContent =
    newState.toUpperCase();

    if(newState === "idle"){

        coreState.textContent =
        "SYSTEM READY";

    }

    if(newState === "listening"){

        coreState.textContent =
        "LISTENING...";

    }

    if(newState === "thinking"){

        coreState.textContent =
        "PROCESSING...";

    }

    if(newState === "speaking"){

        coreState.textContent =
        "SPEAKING...";

    }

}


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    const saved =
    localStorage.getItem(
        MEMORY_KEY
    );

    if(saved){

        memory =
        JSON.parse(saved);

    }

}catch(e){

    memory=[];

}


function saveMemory(){

    memory =
    memory.slice(
        -MAX_MEMORY
    );

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

    }catch(e){}

    memoryNumber.textContent =
    memory.length;

}


function remember(
    role,
    content
){

    memory.push({

        role:role,

        content:content,

        time:Date.now()

    });

    saveMemory();

}


saveMemory();


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const div =
    document.createElement(
        "div"
    );

    div.className =
    "message " + type;

    div.textContent =
    text;

    chat.appendChild(
        div
    );

    chat.scrollTop =
    chat.scrollHeight;

    return div;

}


/* =====================================================
   ORA E DATA
===================================================== */

function getTime(){

    return new Date()
    .toLocaleTimeString(
        "it-IT",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function getDate(){

    return new Date()
    .toLocaleDateString(
        "it-IT",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localCommand(text){

    const t =
    text.toLowerCase()
    .trim();


    if(
        t.includes("che ore sono") ||
        t.includes("che ora è") ||
        t.includes("che ora e") ||
        t.includes("dimmi l'ora") ||
        t.includes("dimmi l ora")
    ){

        return (
            "Sono le " +
            getTime() +
            "."
        );

    }


    if(
        t.includes("che giorno è") ||
        t.includes("che giorno e") ||
        t.includes("data di oggi")
    ){

        return (
            "Oggi è " +
            getDate() +
            "."
        );

    }


    return null;

}


/* =====================================================
   INVIO
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    const text =
    input.value.trim();


    if(!text)
    return;


    if(input.disabled)
    return;


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    input.value =
    "";


    input.disabled =
    true;

    send.disabled =
    true;

    mic.disabled =
    true;


    setState(
        "thinking"
    );


    /* ===============================
       COMANDI LOCALI
    =============================== */

    const local =
    localCommand(
        text
    );


    if(local){

        const box =
        addMessage(
            "jarvis",
            local
        );


        remember(
            "assistant",
            local
        );


        speak(
            local
        );


        finish();

        return;

    }


    /* ===============================
       MEMORIA
    =============================== */

    const lower =
    text.toLowerCase();


    if(
        lower.startsWith(
            "ricorda che "
        ) ||
        lower.startsWith(
            "ricordati che "
        )
    ){

        const reply =
        "Informazione memorizzata.";

        remember(
            "memory",
            text
        );

        addMessage(
            "jarvis",
            reply
        );

        speak(
            reply
        );

        finish();

        return;

    }


    if(
        lower ===
        "cancella memoria" ||
        lower ===
        "dimentica tutto"
    ){

        memory=[];

        saveMemory();


        const reply =
        "Memoria cancellata.";

        addMessage(
            "jarvis",
            reply
        );

        speak(
            reply
        );

        finish();

        return;

    }


    /* ===============================
       API
    =============================== */

    const box =
    addMessage(
        "jarvis",
        "JARVIS // elaborazione..."
    );


    try{

        const response =
        await fetch(
            API_URL,
            {

                method:
                "POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    message:
                    text,

                    memory:
                    memory.slice(
                        -MAX_MEMORY
                    )

                })

            }
        );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
        await response.json();


        if(data.error){

            throw new Error(
                data.error
            );

        }


        const reply =
        data.reply ||
        "Non ho ricevuto una risposta.";


        typeResponse(
            box,
            reply
        );


        remember(
            "assistant",
            reply
        );


        speak(
            reply
        );


    }catch(error){

        console.error(
            error
        );


        box.textContent =
        "Neural Core offline. Controlla la connessione.";

    }


    finish();

}


/* =====================================================
   SCRITTURA
===================================================== */

function typeResponse(
    element,
    text
){

    element.textContent =
    "";

    let i=0;


    const interval =
    setInterval(
        ()=>{

            element.textContent +=
            text[i] || "";

            i++;

            chat.scrollTop =
            chat.scrollHeight;


            if(
                i >= text.length
            ){

                clearInterval(
                    interval
                );

            }

        },
        7
    );

}


/* =====================================================
   FINE
===================================================== */

function finish(){

    input.disabled =
    false;

    send.disabled =
    false;

    mic.disabled =
    false;

    setState(
        "idle"
    );

    input.focus();

}


/* =====================================================
   VOCE
===================================================== */

function speak(text){

    if(
        !window.speechSynthesis
    )
    return;


    speechSynthesis.cancel();


    const utterance =
    new SpeechSynthesisUtterance(
        text
    );


    utterance.lang =
    "it-IT";

    utterance.rate =
    .9;

    utterance.pitch =
    .72;

    utterance.volume =
    1;


    utterance.onstart =
    ()=>{

        speaking =
        true;

        setState(
            "speaking"
        );

    };


    utterance.onend =
    ()=>{

        speaking =
        false;

        voiceLevel =
        0;

        setState(
            "idle"
        );

    };


    utterance.onerror =
    ()=>{

        speaking =
        false;

        voiceLevel =
        0;

        setState(
            "idle"
        );

    };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition =
null;


if(
    SpeechRecognition
){

    recognition =
    new SpeechRecognition();


    recognition.lang =
    "it-IT";

    recognition.continuous =
    false;

    recognition.interimResults =
    true;


    recognition.onstart =
    ()=>{

        listening =
        true;

        mic.classList.add(
            "listening"
        );

        mic.textContent =
        "●";

        input.placeholder =
        "Ascolto...";

        setState(
            "listening"
        );

    };


    recognition.onresult =
    event=>{

        let finalText =
        "";

        let interim =
        "";


        for(
            let i =
            event.resultIndex;

            i <
            event.results.length;

            i++
        ){

            const transcript =
            event.results[i][0]
            .transcript;


            if(
                event.results[i]
                .isFinal
            ){

                finalText +=
                transcript;

            }else{

                interim +=
                transcript;

            }

        }


        input.value =
        finalText ||
        interim;


        voiceLevel =
        .5 +
        Math.random()*.5;


        if(
            finalText
        ){

            setTimeout(
                ()=>{
                    sendMessage();
                },
                120
            );

        }

    };


    recognition.onerror =
    event=>{

        console.log(
            "Voice:",
            event.error
        );

        listening =
        false;

        voiceLevel =
        0;

    };


    recognition.onend =
    ()=>{

        listening =
        false;

        mic.classList.remove(
            "listening"
        );

        mic.textContent =
        "🎙";

        input.placeholder =
        "Parla con JARVIS...";


        if(
            state ===
            "listening"
        ){

            setState(
                "idle"
            );

        }

    };


    mic.addEventListener(
        "click",
        ()=>{

            if(
                listening
            ){

                recognition.stop();

                return;

            }


            try{

                recognition.start();

            }catch(e){

                console.log(e);

            }

        }
    );

}else{

    mic.disabled =
    true;

}


/* =====================================================
   SFERA NEURALE
===================================================== */

let width=0;
let height=0;
let dpr=1;

let centerX=0;
let centerY=0;

let radius=0;

let rotation=0;

let nodes=[];


/* COLORE TARGET */

const COLORS={

    idle:{
        r:255,
        g:190,
        b:0
    },

    listening:{
        r:40,
        g:130,
        b:255
    },

    thinking:{
        r:180,
        g:50,
        b:255
    },

    speaking:{
        r:40,
        g:255,
        b:120
    }

};


let currentColor={
    r:255,
    g:190,
    b:0
};


function resize(){

    width =
    window.innerWidth;

    height =
    window.innerHeight;


    dpr =
    Math.min(
        window.devicePixelRatio||1,
        2
    );


    canvas.width =
    width*dpr;

    canvas.height =
    height*dpr;


    canvas.style.width =
    width+"px";

    canvas.style.height =
    height+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    centerX =
    width/2;

    centerY =
    height/2;


    radius =
    Math.min(
        width,
        height
    )*.22;


    createNodes();

}


function createNodes(){

    nodes=[];


    for(
        let i=0;
        i<190;
        i++
    ){

        nodes.push({

            theta:
            Math.random()*
            Math.PI*2,

            phi:
            Math.acos(
                2*Math.random()-1
            ),

            r:
            radius*
            (
                .62+
                Math.random()*.58
            ),

            speed:
            .001+
            Math.random()*.005,

            size:
            .7+
            Math.random()*1.6,

            phase:
            Math.random()*
            Math.PI*2,

            drift:
            Math.random()*
            Math.PI*2

        });

    }

}


/* ================================
   INTERPOLAZIONE COLORE
================================ */

function updateColor(){

    const target =
    COLORS[state] ||
    COLORS.idle;


    currentColor.r +=
    (target.r-currentColor.r)
    *.045;

    currentColor.g +=
    (target.g-curr
