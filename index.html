<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JARVIS</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b0d12;
    color:#fff;
    font-family: Arial, sans-serif;
}

body{
    touch-action:none;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =====================================================
   LOADING
===================================================== */
#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#0b0d12;
    display:flex;
    align-items:center;
    justify-content:center;
    font:11px monospace;
    letter-spacing:4px;
    color:#168cff;
    transition:opacity 1.4s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

/* =====================================================
   NEURAL CANVAS
===================================================== */
#neuralCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    filter:none !important;
}

/* =====================================================
   CENTER CONTAINER (JARVIS + CLOCK)
===================================================== */
#centerInterface {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.jarvis-label {
    position: absolute;
    top: calc(50% - 65px);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    z-index: 12;
}

/* =====================================================
   CLOCK BELOW CORE
===================================================== */
#clockPanel{
    margin-top: 260px;
    text-align: center;
    font-family: monospace;
}

#clock{
    font-size: 52px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
}

#date{
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.5);
}

/* =====================================================
   CHAT VOCALE
===================================================== */
#chat{
    position:fixed;
    z-index:25;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    width:min(600px, calc(100% - 40px));
    max-height:100px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    pointer-events:none;
}

.message{
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    line-height:1.4;
    text-align:center;
    max-width:90%;
}

.user{
    background:rgba(20,130,255,.15);
    border:1px solid rgba(30,150,255,.3);
    color:#dff2ff;
}

.jarvis{
    background:rgba(10, 15, 25, 0.75);
    border:1px solid rgba(40,150,255,.3);
    color:#dcecff;
}
</style>
</head>

<body>

<div id="loading">
    JARVIS INITIALIZING
</div>

<canvas id="neuralCanvas"></canvas>

<div id="centerInterface">
    <div class="jarvis-label">JARVIS</div>
    <div id="clockPanel">
        <div id="clock">--:--</div>
        <div id="date">--</div>
    </div>
</div>

<div id="chat"></div>

<script type="module">

const neuralCanvas = document.getElementById("neuralCanvas");
const neuralCtx = neuralCanvas.getContext("2d");
const chat = document.getElementById("chat");
const clock = document.getElementById("clock");
const date = document.getElementById("date");

/* =====================================================
   STATO & MEMORIA
===================================================== */
let state = "idle";
let voiceEnergy = 0;
let targetVoiceEnergy = 0;

/* =====================================================
   OROLOGIO
===================================================== */
function updateClock(){
    const now = new Date();
    clock.textContent = now.toLocaleTimeString("it-IT", { hour: '2-digit', minute: '2-digit' });
    date.textContent = now.toLocaleDateString("it-IT", { weekday: "long", day: "2-digit", month: "long" }).toUpperCase();
}
updateClock();
setInterval(updateClock, 1000);

/* =====================================================
   NEURAL CANVAS (SFERA BLU CENTRALE)
===================================================== */
let neuralWidth = innerWidth;
let neuralHeight = innerHeight;
let neuralCx = neuralWidth / 2;
let neuralCy = (neuralHeight / 2) - 65;
let neuralRadius = 75;
let neuralRotation = 0;
let nodes = [];

function createNeuralNodes(){
    nodes = [];
    const amount = 300;
    for(let i = 0; i < amount; i++){
        nodes.push({
            theta: Math.random() * Math.PI * 2,
            phi: Math.acos(2 * Math.random() - 1),
            r: neuralRadius * (0.85 + Math.random() * 0.3),
            size: 0.5 + Math.random() * 1.2,
            phase: Math.random() * Math.PI * 2,
            frequency: 0.8 + Math.random() * 1.5
        });
    }
}

function resizeNeural(){
    neuralWidth = innerWidth;
    neuralHeight = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    neuralCanvas.width = neuralWidth * dpr;
    neuralCanvas.height = neuralHeight * dpr;
    neuralCanvas.style.width = neuralWidth + "px";
    neuralCanvas.style.height = neuralHeight + "px";
    neuralCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    neuralCx = neuralWidth / 2;
    neuralCy = (neuralHeight / 2) - 65;
    createNeuralNodes();
}

function animateNeural(){
    requestAnimationFrame(animateNeural);
    const time = performance.now() / 1000;

    let baseEnergy = 0.05;
    if(state === "listening") baseEnergy = 0.35;
    if(state === "speaking") baseEnergy = 0.45;

    targetVoiceEnergy = baseEnergy;
    voiceEnergy += (targetVoiceEnergy - voiceEnergy) * 0.1;

    neuralRotation += 0.005 + voiceEnergy * 0.01;

    neuralCtx.clearRect(0, 0, neuralWidth, neuralHeight);

    const r = 20, g = 140, b = 255;

    // Glowing Ring Outer
    neuralCtx.beginPath();
    neuralCtx.arc(neuralCx, neuralCy, neuralRadius + 2 + (voiceEnergy * 10), 0, Math.PI * 2);
    neuralCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.8)`;
    neuralCtx.lineWidth = 3;
    neuralCtx.shadowColor = `rgba(${r}, ${g}, ${b}, 1)`;
    neuralCtx.shadowBlur = 15;
    neuralCtx.stroke();
    neuralCtx.shadowBlur = 0;

    // Inner Nodes & Connections
    nodes.forEach(n => {
        const wave = Math.sin(time * n.frequency + n.phase);
        const rr = n.r + (voiceEnergy * 12 * wave);
        const angle = n.theta + neuralRotation;

        let x = rr * Math.sin(n.phi) * Math.cos(angle);
        let y = rr * Math.cos(n.phi);
        let z = rr * Math.sin(n.phi) * Math.sin(angle);

        const perspective = 400 / (400 + z);
        const px = neuralCx + x * perspective;
        const py = neuralCy + y * perspective;
        const alpha = Math.max(0.1, (z + neuralRadius) / (neuralRadius * 2));

        neuralCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        neuralCtx.beginPath();
        neuralCtx.arc(px, py, n.size * perspective, 0, Math.PI * 2);
        neuralCtx.fill();
    });
}

window.addEventListener("resize", resizeNeural);

resizeNeural();
animateNeural();

setTimeout(() => {
    document.getElementById("loading").classList.add("hidden");
}, 800);

</script>
</body>
</html>
