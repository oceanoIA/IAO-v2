<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — NEURAL FACE</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#168cff;

    text-shadow:
        0 0 10px #168cff,
        0 0 30px rgba(20,130,255,.6);

    transition:opacity 1.2s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

/* =====================================================
   CANVAS
===================================================== */

#faceCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    top:20px;
    left:0;
    width:100%;

    text-align:center;

    z-index:20;
    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;
    font-weight:300;

    letter-spacing:12px;

    color:#fff;

    text-shadow:
        0 0 12px rgba(40,150,255,.9),
        0 0 30px rgba(20,120,255,.7),
        0 0 65px rgba(0,90,255,.45);
}

.status{
    margin-top:7px;

    font:10px monospace;
    letter-spacing:3px;

    color:rgba(210,235,255,.8);
}

#dot{
    color:#168cff;

    text-shadow:
        0 0 8px #168cff,
        0 0 18px #168cff;
}

/* =====================================================
   CLOCK
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;
    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;
    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 10px rgba(40,150,255,.6);
}

#date{
    margin-top:3px;

    font-size:9px;
    letter-spacing:2px;

    color:rgba(120,190,255,.75);
}

/* =====================================================
   CHAT
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:50%;
    bottom:105px;

    transform:translateX(-50%);

    width:min(600px,calc(100% - 30px));

    max-height:130px;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:7px;

    pointer-events:none;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 20%,
            black 80%,
            transparent
        );
}

.message{
    padding:7px 13px;

    border-radius:14px;

    font-size:12px;
    line-height:1.4;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    animation:messageIn .5s ease;

    text-align:center;

    max-width:90%;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.user{
    background:
        rgba(20,130,255,.08);

    border:
        1px solid
        rgba(30,150,255,.25);

    color:#dff2ff;
}

.jarvis{
    background:
        rgba(0,10,20,.55);

    border:
        1px solid
        rgba(40,150,255,.22);

    border-left:
        2px solid #168cff;

    color:#dcecff;

    box-shadow:
        0 0 25px rgba(20,130,255,.08);
}

/* =====================================================
   VOICE CORE
===================================================== */

#voiceCore{
    position:fixed;

    left:50%;
    bottom:28px;

    transform:translateX(-50%);

    width:58px;
    height:58px;

    z-index:40;

    border-radius:50%;

    border:
        1px solid
        rgba(30,150,255,.55);

    background:
        radial-gradient(
            circle,
            rgba(30,150,255,.18),
            rgba(0,10,20,.65)
        );

    color:#4da8ff;

    box-shadow:
        0 0 20px rgba(20,130,255,.2),
        inset 0 0 20px rgba(30,150,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .4s ease,
        background .5s ease,
        box-shadow .5s ease;
}

#voiceCore:hover{
    transform:
        translateX(-50%)
        scale(1.05);
}

#voiceCore.active{

    background:
        radial-gradient(
            circle,
            rgba(40,160,255,.42),
            rgba(0,20,45,.75)
        );

    border-color:#168cff;

    box-shadow:
        0 0 25px rgba(20,140,255,.6),
        0 0 55px rgba(20,100,255,.35),
        inset 0 0 25px rgba(40,160,255,.2);

    animation:
        voicePulse 2s ease-in-out infinite;
}

@keyframes voicePulse{

    0%,100%{
        box-shadow:
            0 0 22px rgba(20,140,255,.45),
            0 0 45px rgba(20,100,255,.18);
    }

    50%{
        box-shadow:
            0 0 35px rgba(30,160,255,.85),
            0 0 70px rgba(20,110,255,.35);
    }
}

/* =====================================================
   MICROFONO
===================================================== */

.icon{
    width:23px;
    height:23px;

    display:block;

    stroke:currentColor;
    fill:none;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;

    pointer-events:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{
        font-size:20px;
        letter-spacing:8px;
    }

    #clockPanel{
        top:15px;
        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #voiceCore{
        bottom:23px;

        width:54px;
        height:54px;
    }

    #chat{
        bottom:90px;
    }
}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }
}

</style>
</head>

<body>

<div id="loading">
    JARVIS NEURAL FACE
</div>

<canvas id="faceCanvas"></canvas>

<div class="header">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status">

        <span id="dot">●</span>

        <span id="statusText">
            NEURAL INTERFACE ONLINE
        </span>

    </div>

</div>

<div id="clockPanel">

    <div id="clock">
        --:--:--
    </div>

    <div id="date">
        --
    </div>

</div>

<div id="chat"></div>

<button
    id="voiceCore"
    title="Attiva JARVIS"
    aria-label="Attiva JARVIS">

    <svg
        class="icon"
        viewBox="0 0 24 24"
        aria-hidden="true">

        <rect
            x="9"
            y="3"
            width="6"
            height="11"
            rx="3">
        </rect>

        <path
            d="M5 11a7 7 0 0 0 14 0">
        </path>

        <path
            d="M12 18v3">
        </path>

        <path
            d="M8 21h8">
        </path>

    </svg>

</button>


<script>

/* =====================================================
   API
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
    document.getElementById("faceCanvas");

const ctx =
    canvas.getContext("2d");

const voiceCore =
    document.getElementById("voiceCore");

const chat =
    document.getElementById("chat");

const dot =
    document.getElementById("dot");

const statusText =
    document.getElementById("statusText");

const clock =
    document.getElementById("clock");

const date =
    document.getElementById("date");


/* =====================================================
   STATO
===================================================== */

let state =
    "idle";

let busy =
    false;

let listening =
    false;

let wakeMode =
    true;

let recognition =
    null;

let wakeRecognition =
    null;


/* =====================================================
   MEMORIA
===================================================== */

let memory = [];

try{

    memory =
        JSON.parse(
            localStorage.getItem(
                "jarvis_memory"
            ) || "[]"
        );

}catch{

    memory = [];

}

memory =
    memory.slice(-40);


function saveMemory(){

    memory =
        memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );
}


function remember(
    role,
    content
){

    if(!content)
        return;

    memory.push({

        role,
        content,

        time:
            Date.now()

    });

    saveMemory();
}


/* =====================================================
   STATO JARVIS
===================================================== */

function setState(
    newState
){

    state =
        newState;

    if(

        newState === "listening" ||

        newState === "thinking" ||

        newState === "speaking"

    ){

        dot.style.color =
            "#168cff";

        voiceCore.classList.add(
            "active"
        );

    }else{

        dot.style.color =
            "#168cff";

        voiceCore.classList.remove(
            "active"
        );

    }


    if(
        newState === "listening"
    ){

        statusText.textContent =
            "LISTENING...";

    }else if(
        newState === "thinking"
    ){

        statusText.textContent =
            "NEURAL PROCESSING...";

    }else if(
        newState === "speaking"
    ){

        statusText.textContent =
            "JARVIS SPEAKING...";

    }else{

        statusText.textContent =
            "NEURAL INTERFACE ONLINE";

    }

}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now =
        new Date();

    clock.textContent =
        now.toLocaleTimeString(
            "it-IT"
        );

    date.textContent =
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        text;

    chat.appendChild(
        element
    );

    while(
        chat.children.length > 4
    ){

        chat.removeChild(
            chat.firstChild
        );

    }

    return element;
}


/* =====================================================
   NEURAL FACE
===================================================== */

let width =
    innerWidth;

let height =
    innerHeight;

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

let centerX =
    width / 2;

let centerY =
    height / 2;

let faceScale =
    Math.min(
        width,
        height
    ) * .38;

let particles = [];

let faceRotation =
    0;

let faceTilt =
    0;

let energy =
    0;

let targetEnergy =
    0;


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    width =
        innerWidth;

    height =
        innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    centerX =
        width / 2;

    centerY =
        height / 2;

    faceScale =
        Math.min(
            width,
            height
        ) * .38;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   CREAZIONE DEL VOLTO
=====================================================

   Il volto viene costruito con coordinate
   geometriche.

   Ogni zona contiene moltissime particelle:

   - contorno
   - fronte
   - occhi
   - sopracciglia
   - naso
   - guance
   - bocca
   - mento
   - capelli
===================================================== */

function addParticle(
    x,
    y,
    z,
    size = 1,
    brightness = 1
){

    particles.push({

        x,
        y,
        z,

        baseX:x,
        baseY:y,
        baseZ:z,

        size,

        brightness,

        phase:
            Math.random() *
            Math.PI * 2,

        speed:
            .5 +
            Math.random() * 1.5

    });

}


/* =====================================================
   PUNTO SU ELLISSE
===================================================== */

function ellipsePoints(
    cx,
    cy,
    rx,
    ry,
    count,
    z = 0
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const a =
            Math.random() *
            Math.PI * 2;

        const radius =
            .82 +
            Math.random() * .18;

        const x =
            cx +
            Math.cos(a) *
            rx *
            radius;

        const y =
            cy +
            Math.sin(a) *
            ry *
            radius;

        addParticle(
            x,
            y,
            z +
            (Math.random()-.5)*.15,
            .45 +
            Math.random()*.7,
            .7 +
            Math.random()*.3
        );

    }

}


/* =====================================================
   LINEA PARTICELLARE
===================================================== */

function lineParticles(
    x1,
    y1,
    x2,
    y2,
    count,
    thickness = 2,
    z = 0
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const t =
            Math.random();

        const x =
            x1 +
            (x2-x1) * t;

        const y =
            y1 +
            (y2-y1) * t;

        addParticle(

            x +
            (Math.random()-.5) *
            thickness,

            y +
            (Math.random()-.5) *
            thickness,

            z +
            (Math.random()-.5)*.12,

            .45 +
            Math.random()*.75,

            .75 +
            Math.random()*.25

        );

    }

}


/* =====================================================
   COSTRUZIONE DEL VOLTO
===================================================== */

function createFace(){

    particles = [];


    /* =================================================
       SCALA
    ================================================= */

    const s =
        faceScale;


    /* =================================================
       CONTORNO DEL VISO
    ================================================= */

    ellipsePoints(
        0,
        5,
        s * .70,
        s * .91,
        260,
        .05
    );


    /* =================================================
       SECONDO STRATO DEL CONTORNO
    ================================================= */

    ellipsePoints(
        0,
        5,
        s * .66,
        s * .87,
        170,
        .02
    );


    /* =================================================
       FRONTE
    ================================================= */

    for(
        let i=0;
        i<150;
        i++
    ){

        const x =
            (Math.random()-.5)
            * s * 1.0;

        const y =
            -s * .58 +
            Math.random() * s * .32;

        addParticle(
            x,
            y,
            .1 +
            Math.random()*.3,
            .4 +
            Math.random()*.6,
            .55 +
            Math.random()*.45
        );

    }


    /* =================================================
       OCCHI
    ================================================= */

    const eyeY =
        -s * .18;

    const eyeDistance =
        s * .27;

    const eyeRX =
        s * .17;

    const eyeRY =
        s * .075;


    /* occhio sinistro */

    ellipsePoints(
        -eyeDistance,
        eyeY,
        eyeRX,
        eyeRY,
        115,
        .38
    );


    /* occhio destro */

    ellipsePoints(
        eyeDistance,
        eyeY,
        eyeRX,
        eyeRY,
        115,
        .38
    );


    /* =================================================
       IRIDI
    ================================================= */

    ellipsePoints(
        -eyeDistance,
        eyeY,
        s*.045,
        s*.045,
        45,
        .48
    );

    ellipsePoints(
        eyeDistance,
        eyeY,
        s*.045,
        s*.045,
        45,
        .48
    );


    /* =================================================
       SOPRACCIGLIA
    ================================================= */

    lineParticles(
        -s*.43,
        -s*.30,
        -s*.12,
        -s*.34,
        80,
        5,
        .18
    );

    lineParticles(
        s*.12,
        -s*.34,
        s*.43,
        -s*.30,
        80,
        5,
        .18
    );


    /* =================================================
       NASO
    ================================================= */

    lineParticles(
        -s*.025,
        -s*.13,
        -s*.055,
        s*.15,
        105,
        3,
        .32
    );

    lineParticles(
        -s*.055,
        s*.15,
        0,
        s*.21,
        60,
        3,
        .35
    );

    lineParticles(
        0,
        s*.21,
        s*.055,
        s*.15,
        60,
        3,
        .35
    );


    /* =================================================
       NARICI
    ================================================= */

    ellipsePoints(
        -s*.075,
        s*.17,
        s*.035,
        s*.018,
        30,
        .42
    );

    ellipsePoints(
        s*.075,
        s*.17,
        s*.035,
        s*.018,
        30,
        .42
    );


    /* =================================================
       GUANCE
    ================================================= */

    ellipsePoints(
        -s*.39,
        s*.12,
        s*.13,
        s*.18,
        80,
        -.02
    );

    ellipsePoints(
        s*.39,
        s*.12,
        s*.13,
        s*.18,
        80,
        -.02
    );


    /* =================================================
       BOCCA
    ================================================= */

    const mouthY =
        s*.36;

    lineParticles(
        -s*.20,
        mouthY,
        0,
        mouthY + s*.025,
        90,
        3,
        .42
    );

    lineParticles(
        0,
        mouthY + s*.025,
        s*.20,
        mouthY,
        90,
        3,
        .42
    );


    /* labbro inferiore */

    lineParticles(
        -s*.14,
        mouthY + s*.065,
        0,
        mouthY + s*.10,
        65,
        3,
        .38
    );

    lineParticles(
        0,
        mouthY + s*.10,
        s*.14,
        mouthY + s*.065,
        65,
        3,
        .38
    );


    /* =================================================
       MENTO
    ================================================= */

    ellipsePoints(
        0,
        s*.57,
        s*.18,
        s*.09,
        65,
        .02
    );


    /* =================================================
       CAPELLI / PARTE SUPERIORE
    ================================================= */

    for(
        let i=0;
        i<300;
        i++
    ){

        const a =
            Math.PI *
            (0.1 +
            Math.random()*.8);

        const radius =
            s *
            (.65 +
            Math.random()*.12);

        const x =
            Math.cos(a) *
            radius;

        const y =
            -Math.abs(
                Math.sin(a)
            ) *
            s*.86 -
            s*.02;

        addParticle(
            x,
            y,
            -.05 +
            Math.random()*.2,
            .4 +
            Math.random()*.7,
            .45 +
            Math.random()*.55
        );

    }


    /* =================================================
       PARTICELLE INTERNE
    ================================================= */

    for(
        let i=0;
        i<850;
        i++
    ){

        const x =
            (Math.random()-.5)
            * s*1.15;

        const y =
            (Math.random()-.5)
            * s*1.65;

        const normalized =
            Math.pow(
                x/(s*.62),
                2
            ) +
            Math.pow(
                (y-s*.02)/(s*.84),
                2
            );

        if(
            normalized < 1
        ){

            addParticle(
                x,
                y,
                (Math.random()-.5)*.7,
                .35 +
                Math.random()*.65,
                .25 +
                Math.random()*.6
            );

        }

    }

}

createFace();


/* =====================================================
   ANIMAZIONE VOLTO
===================================================== */

function animateFace(){

    requestAnimationFrame(
        animateFace
    );


    const time =
        performance.now()/1000;


    /* =================================================
       ENERGIA
    ================================================= */

    if(
        state === "listening"
    ){

        targetEnergy =
            .9;

    }else if(
        state === "thinking"
    ){

        targetEnergy =
            1.15;

    }else if(
        state === "speaking"
    ){

        targetEnergy =
            .95;

    }else{

        targetEnergy =
            .18;

    }


    energy +=
        (
            targetEnergy -
            energy
        ) * .08;


    /* =================================================
       PULIZIA
    ================================================= */

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* =================================================
       GLOW CENTRALE
    ================================================= */

    const glow =
        faceScale *
        (
            .85 +
            energy*.22
        );

    const gradient =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            glow

        );

    gradient.addColorStop(
        0,
        "rgba(25,145,255,.13)"
    );

    gradient.addColorStop(
        .45,
        "rgba(20,120,255,.055)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        glow,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =================================================
       ROTAZIONE LEGGERA
    ================================================= */

    faceRotation +=
        .0007 *
        (
            1 +
            energy*2
        );


    const breathing =
        Math.sin(
            time*1.4
        ) *
        energy *
        2.5;


    /* =================================================
       PROIEZIONE PARTICELLE
    ================================================= */

    const projected = [];


    particles.forEach(
        p => {

            let x =
                p.baseX;

            let y =
                p.baseY;

            let z =
                p.baseZ;


            /* movimento neurale */

            const wave =
                Math.sin(
                    time *
                    p.speed +
                    p.phase
                );


            const wave2 =
                Math.cos(
                    time *
                    .7 +
                    p.phase
                );


            x +=
                wave *
                energy *
                3.5;

            y +=
                wave2 *
                energy *
                2.2;


            /* respirazione */

            const distance =
                Math.sqrt(
                    x*x +
                    y*y
                );

            const scale =
                1 +
                breathing /
                Math.max(
                    faceScale,
                    1
                );


            x *=
                scale;

            y *=
                scale;


            /* rotazione 3D */

            const cos =
                Math.cos(
                    faceRotation
                );

            const sin =
                Math.sin(
                    faceRotation
                );


            const rotatedX =
                x*cos -
                z*sin;

            const rotatedZ =
                x*sin +
                z*cos;


            x =
                rotatedX;

            z =
                rotatedZ;


            /* prospettiva */

            const perspective =
                520 /
                (
                    520 +
                    z
                );


            const screenX =
                centerX +
                x *
                perspective;

            const screenY =
                centerY +
                y *
                perspective;


            projected.push({

                x:screenX,

                y:screenY,

                z,

                size:
                    p.size *
                    perspective,

                brightness:
                    p.brightness,

                phase:
                    p.phase

            });

        }
    );


    /* =================================================
       CONNESSIONI
    ================================================= */

    const maxDistance =
        state === "thinking"
        ? 46
        : 38;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        const a =
            projected[i];


        /* controlliamo solo un numero limitato
           di particelle successive */

        const limit =
            Math.min(
                projected.length,
                i+65
            );


        for(
            let j=i+1;
            j<limit;
            j++
        ){

            const b =
                projected[j];


            if(
                Math.abs(
                    a.z-b.z
                ) > 30
            ){

                continue;

            }


            const dx =
                a.x-b.x;

            const dy =
                a.y-b.y;

            const dist =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(
                dist <
                maxDistance
            ){

                const alpha =
                    (
                        1 -
                        dist /
                        maxDistance
                    )
                    *
                    .12 *
                    energy;


                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.strokeStyle =
                    `rgba(
                        35,
                        150,
                        255,
                        ${alpha}
                    )`;

                ctx.lineWidth =
                    .35;

                ctx.stroke();

            }

        }

    }


    /* =================================================
       PARTICELLE
    ================================================= */

    projected.forEach(
        p => {

            const flicker =
                (
                    Math.sin(
                        time*3 +
                        p.phase
                    ) + 1
                ) / 2;


            const size =
                p.size +
                flicker *
                energy *
                .8;


            const alpha =
                Math.min(
                    1,
                    .35 +
                    p.brightness *
                    .65
                );


            /* alone */

            ctx.fillStyle =
                `rgba(
                    30,
                    145,
                    255,
                    ${alpha*.12}
                )`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                size*4,
                0,
                Math.PI*2
            );

            ctx.fill();


            /* particella */

            ctx.fillStyle =
                `rgba(
                    55,
                    170,
                    255,
                    ${alpha}
                )`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI*2
            );

            ctx.fill();


            /* nucleo bianco/blu */

            if(
                p.brightness > .85
            ){

                ctx.fillStyle =
                    `rgba(
                        180,
                        235,
                        255,
                        ${alpha*.7}
                    )`;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    Math.max(
                        .45,
                        size*.35
                    ),
                    0,
                    Math.PI*2
                );

                ctx.fill();

            }

        }
    );


    /* =================================================
       OCCHI PIÙ LUMINOSI
    ================================================= */

    const eyeGlow =
        faceScale *
        .045 *
        (
            1 +
            energy*1.8
        );


    const eyeY =
        centerY -
        faceScale*.18;


    const eyeX =
        faceScale*.27;


    drawEyeCore(
        centerX-eyeX,
        eyeY,
        eyeGlow
    );

    drawEyeCore(
        centerX+eyeX,
        eyeY,
        eyeGlow
    );

}


/* =====================================================
   CORE OCCHI
===================================================== */

function drawEyeCore(
    x,
    y,
    radius
){

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius*5
        );

    gradient.addColorStop(
        0,
        "rgba(180,240,255,.8)"
    );

    gradient.addColorStop(
        .25,
        "rgba(60,180,255,.25)"
    );

    gradient.addColorStop(
        1,
        "rgba(20,130,255,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius*5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "rgba(210,245,255,.95)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   SPEAK
===================================================== */

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        setState(
            "idle"
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    /*
       Voce profonda e lenta.
       La voce effettiva dipende dalle
       voci installate sul dispositivo.
    */

    utterance.rate =
        .82;

    utterance.pitch =
        .58;

    utterance.volume =
        1;


    utterance.onstart =
        () => {

            setState(
                "speaking"
            );

        };


    utterance.onend =
        () => {

            setState(
                "idle"
            );


            if(
                wakeMode &&
                !busy
            ){

                setTimeout(
                    startWakeWord,
                    900
                );

            }

        };


    utterance.onerror =
        () => {

            setState(
                "idle"
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localCommand(
    text
){

    const t =
        text.toLowerCase();


    if(

        t.includes(
            "che ore sono"
        )

        ||

        t.includes(
            "che ora è"
        )

        ||

        t.includes(
            "che ora e"
        )

    ){

        return(
            "Sono le " +
            new Date()
            .toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ) +
            "."
        );

    }


    if(

        t.includes(
            "che giorno è"
        )

        ||

        t.includes(
            "che giorno e"
        )

    ){

        return(
            "Oggi è " +
            new Date()
            .toLocaleDateString(
                "it-IT",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            ) +
            "."
        );

    }


    return null;

}


/* =====================================================
   INVIO ALL'AI
===================================================== */

async function sendMessage(
    text
){

    if(
        !text ||
        busy
    ){

        return;

    }


    busy =
        true;


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    const local =
        localCommand(
            text
        );


    if(local){

        addMessage(
            "jarvis",
            local
        );


        remember(
            "assistant",
            local
        );


        speak(
            local
        );


        finish();

        return;

    }


    setState(
        "thinking"
    );


    const answer =
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory =
        memory.slice(-24);


    const intelligentContext = {

        assistantName:
            "JARVIS",

        language:
            "it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Comprendi il significato della domanda.",

            "Rispondi in modo naturale e diretto.",

            "Se hai abbastanza informazioni, rispondi direttamente.",

            "Se una domanda è ambigua, fai una domanda breve.",

            "Usa la memoria della conversazione quando è utile.",

            "Non inventare informazioni.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "Le risposte vocali devono essere naturali e non troppo lunghe.",

            "Non usare emoji nelle risposte."

        ]

    };


    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.reply
        ){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent =
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(
            error
        );


        answer.textContent =
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        speak(
            "Non riesco a raggiungere il Neural Core."
        );


        setState(
            "idle"
        );

    }


    finish();

}


/* =====================================================
   FINE
===================================================== */

function finish(){

    busy =
        false;

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(Recognition){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        () => {

            listening =
                true;

            setState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            let transcript =
                "";


            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                transcript +=
                    event.results[i][0]
                    .transcript;

            }


            const last =
                event.results[
                    event.results.length-1
                ];


            if(
                last.isFinal
            ){

                const text =
                    transcript.trim();


                if(text){

                    sendMessage(
                        text
                    );

                }

            }

        };


    recognition.onerror =
        event => {

            console.log(
                "Speech recognition:",
                event.error
            );

        };


    recognition.onend =
        () => {

            listening =
                false;


            if(
                state === "listening"
            ){

                setState(
                    "idle"
                );

            }

        };

}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(

        !Recognition ||

        !wakeMode ||

        busy ||

        listening ||

        wakeRecognition

    ){

        return;

    }


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeRecognition.onresult =
        event => {

            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase()
                    .trim();


                if(
                    text.includes(
                        "jarvis"
                    )
                ){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition =
                        null;


                    activateJarvis();


                    return;

                }

            }

        };


    wakeRecognition.onerror =
        () => {

            wakeRecognition =
                null;


            if(
                wakeMode &&
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    1000
                );

            }

        };


    wakeRecognition.onend =
        () => {

            wakeRecognition =
                null;


            if(
                wakeMode &&
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    700
                );

            }

        };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition =
            null;

    }

}


/* =====================================================
   ATTIVA JARVIS
===================================================== */

function activateJarvis(){

    if(
        busy ||
        listening ||
        !recognition
    ){

        return;

    }


    setState(
        "listening"
    );


    /*
       Piccola pausa dopo "Jarvis"
       per non registrare la wake word
       nella domanda.
    */

    setTimeout(
        () => {

            try{

                recognition.start();

            }catch(error){

                console.log(
                    error
                );

            }

        },
        450
    );

}


/* =====================================================
   PULSANTE
===================================================== */

voiceCore.onclick =
    () => {

        if(
            busy ||
            !recognition
        ){

            return;

        }


        if(listening){

            recognition.stop();

            return;

        }


        try{

            recognition.start();

        }catch(error){

            console.log(
                error
            );

        }

    };


/* =====================================================
   START
===================================================== */

animateFace();


setTimeout(
    () => {

        document
            .getElementById(
                "loading"
            )
            .classList.add(
                "hidden"
            );


        /*
           Avvio automatico del
           riconoscimento "Jarvis".
        */

        setTimeout(
            startWakeWord,
            800
        );

    },
    1200
);


/* =====================================================
   API PUBBLICA
===================================================== */

window.JARVIS_FACE = {

    speak,

    activateJarvis,

    startWakeWord,

    sendMessage

};
