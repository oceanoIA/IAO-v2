<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — NEURAL CORE</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;
    color:#ffd000;

    transition:opacity 1s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease,
        filter 1.2s ease;
}

body.mapMode #neuralCanvas{
    opacity:0;
    transform:scale(.45);
    filter:blur(15px);
    pointer-events:none;
}


/* =====================================================
   EARTH
===================================================== */

#earthContainer{
    position:fixed;
    inset:0;

    z-index:2;

    opacity:0;
    pointer-events:none;

    transform:scale(.55);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

body.mapMode #earthContainer{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}

#earthCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;

    top:20px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;
    font-weight:300;

    letter-spacing:12px;

    text-shadow:
        0 0 15px #ffd000,
        0 0 35px rgba(255,200,0,.35);
}

.status{
    margin-top:7px;

    font:10px monospace;

    letter-spacing:3px;
}

#dot{
    color:#ffd000;

    text-shadow:
        0 0 10px currentColor;
}

body.mapMode .header h1{
    text-shadow:
        0 0 15px #168cff,
        0 0 35px rgba(30,140,255,.4);
}


/* =====================================================
   CLOCK
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;
    letter-spacing:2px;
    color:#fff;
}

#date{
    margin-top:3px;

    font-size:9px;
    letter-spacing:2px;

    color:rgba(255,210,0,.65);
}

body.mapMode #date{
    color:rgba(80,170,255,.8);
}


/* =====================================================
   CHAT MESSAGGI
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:22px;
    top:125px;

    width:330px;

    max-height:calc(100vh - 245px);

    overflow-y:auto;

    display:flex;
    flex-direction:column;

    gap:9px;

    padding:8px 4px 8px 0;

    scrollbar-width:none;

    mask-image:linear-gradient(
        to bottom,
        transparent 0,
        black 12px,
        black 92%,
        transparent 100%
    );
}

#chat::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:100%;

    padding:10px 13px;

    border-radius:12px;

    font-size:13px;

    line-height:1.5;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    animation:messageIn .3s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateX(-12px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}

.user{
    align-self:flex-end;

    background:rgba(255,190,0,.08);

    border:1px solid rgba(255,190,0,.3);

    border-left:2px solid #ffd000;

    color:#fff;
}

.jarvis{
    align-self:flex-start;

    background:rgba(4,9,17,.72);

    border:1px solid rgba(30,140,255,.2);

    border-left:2px solid #168cff;

    color:#dcecff;
}


/* =====================================================
   MAP HUD
===================================================== */

#mapHud{
    position:fixed;

    z-index:15;

    left:50%;
    top:90px;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;

    pointer-events:none;

    font:11px monospace;

    letter-spacing:3px;

    text-align:center;

    color:#5eb8ff;

    transition:
        opacity .8s ease,
        transform .8s ease;
}

body.mapMode #mapHud{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

#mapTitle{
    font-size:16px;

    letter-spacing:5px;

    margin-bottom:6px;

    text-shadow:
        0 0 15px #168cff;
}

#coordinates{
    font-size:10px;

    color:rgba(180,220,255,.85);
}


/* =====================================================
   LOCATION INFO
===================================================== */

#locationInfo{
    position:fixed;

    z-index:18;

    left:50%;
    top:58%;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:10px 18px;

    background:rgba(0,10,20,.75);

    border:1px solid rgba(40,160,255,.5);

    border-radius:8px;

    font:11px monospace;

    letter-spacing:2px;

    text-align:center;

    box-shadow:
        0 0 25px rgba(0,130,255,.15);

    transition:
        opacity .7s ease,
        transform .7s ease;
}

#locationInfo.visible{
    opacity:1;

    transform:
        translate(-50%,0);
}

#locationName{
    font-size:14px;

    color:#fff;

    margin-bottom:4px;
}

#locationCoords{
    color:#4faaff;
}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea{
    position:fixed;

    z-index:40;

    bottom:18px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(
        700px,
        calc(100% - 40px)
    );
}


/* =====================================================
   NUOVA CASELLA FUTURISTICA
===================================================== */

.inputBox{

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        7px
        8px
        7px
        16px;

    /*
       NERO EFFETTO VETRO
    */

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    /*
       BORDO
    */

    border:
        1px solid
        rgba(255,208,0,.35);

    /*
       COMPLETAMENTE ROTONDA
    */

    border-radius:50px;

    /*
       BAGLIORE
    */

    box-shadow:

        0 0 25px
        rgba(255,208,0,.08),

        inset 0 0 20px
        rgba(255,255,255,.025);

    transition:
        border-color .3s ease,
        box-shadow .3s ease;
}


/*
   QUANDO SCRIVI
*/

.inputBox:focus-within{

    border-color:
        rgba(255,208,0,.7);

    box-shadow:

        0 0 30px
        rgba(255,208,0,.15),

        inset 0 0 25px

}


/* =====================================================
   INPUT
===================================================== */

input{

    flex:1;

    min-width:0;

    height:44px;

    padding:

    background:transparent;

    border:0;

    outline:0;

    color:#fff;

    font-size:14px;
}

input::placeholder{

    color:

}


/* =====================================================
   PULSANTI ROTONDI
===================================================== */

button{

    border:

    background:
        rgba(255,190,0,.07);

    color:#ffd000;

    font-weight:bold;

        color .25s ease,

}

button:hover{

    background:#ffd000;

    color:#000;

    box-shadow:
        0 0 15px #ffd000;

    transform:scale(1.05);
}

button:active{

    transform:
        scale(.94);
}


/* =====================================================
   MICROFONO / CONVERSAZIONE
===================================================== */

#mic,
#conversation{

    width:44px;

    min-width:44px;

    font-size:16px;
}


/* =====================================================
   INVIA
===================================================== */

#send{

    width:48px;

    min-width:48px;

    font-size:17px;
}


/* =====================================================
   ACTIVE
===================================================== */

.active{

    background:
        #168cff !important;

    border-color:
        #168cff !important;

    color:#fff !important;

    box-shadow:
        0 0 20px #168cff;
}


/* =====================================================
   CROSSHAIR
===================================================== */

#mapCrosshair{

    position:fixed;

    z-index:12;

    left:50%;
    top:50%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .7s;
}

body.mapMode #mapCrosshair{
    opacity:.35;
}

#mapCrosshair::before,
#mapCrosshair::after{

    content:"";

    position:absolute;

    background:#168cff;

    box-shadow:
        0 0 8px #168cff;
}

#mapCrosshair::before{

    width:25px;
    height:1px;

    top:12px;
    left:0;
}

#mapCrosshair::after{

    width:1px;
    height:25px;

    left:12px;
    top:0;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{

        font-size:20px;

        letter-spacing:8px;
    }

    }

    #clock{

    }

    #date{

/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:430px){

    #conversation,

        font-size:15px;
    }

        font-size:13px;
    }

</style>

<script type="module">

from "three";

from "three/addons/controls/OrbitControls.js";

   API
===================================================== */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";

const neuralCanvas =
document.getElementById(

neuralCanvas.getContext("2d");

const earthCanvas =
document.getElementById(
    "earthCanvas"

document.getElementById("input");

document.getElementById("send");

document.getElementById("mic");

/* =====================================================

===================================================== */

let state="idle";

let busy=false;

let listening=false;

let conversationMode=false;

let mapMode=false;

let recognition=null;

let wakeRecognition=null;


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    memory=JSON.parse(
        localStorage.getItem(
            "jarvis_memory"
        ) || "[]"
    );

}catch{

    memory=[];

}

memory=
memory.slice(-40);


function saveMemory(){

    memory=
        memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );

}


function remember(
    role,
    content
){

    if(!content)return;

    memory.push({

        role,

        content,

        time:Date.now()

    });

    saveMemory();

}


saveMemory();


/* =====================================================
   STATO
===================================================== */

function setState(
    newState
){

    state=
        newState;


    if(

        newState==="listening" ||

        newState==="thinking" ||

            "#168cff";

   CLOCK
===================================================== */

    const now=

    clock.textContent=

        );

    date.textContent=
        now.toLocaleDateString(

            {

                weekday:"short",

                day:"2-digit",

                month:"short"

            }
        ).toUpperCase();

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message "+type;

    element.textContent =
        text;

    chat.appendChild(
        element
    );

    while(
        chat.children.length>20
    ){

        chat.removeChild(
            chat.firstChild
        );

    }

    chat.scrollTop =

    return element;

}


/* =====================================================
   THREE.JS
===================================================== */

const earthScene =

const earthCamera =

const earth =

const atmosphere =

/* =====================================================
   COMANDO MAPPA
===================================================== */

function isMapCommand(
    text
){

    const t=
        text.toLowerCase();

    return(

        t.includes(
            "apri la mappa"
        ) ||

        t.includes(
            "apri mappa"
        ) ||

        t.includes(
            "mostrami la mappa"
        ) ||

        t.includes(
            "mostra la mappa"
        ) ||

        t.includes(
            "mappa del mondo"
        ) ||

        t==="mappa"

    );

}


/* =====================================================
   ESTRAZIONE LUOGO
===================================================== */

function extractLocation(
    text
){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower=
        text.toLowerCase();


    for(
        const prefix
        of patterns
    ){

        const index=
            lower.indexOf(
                prefix
            );


        if(index!==-1){

            let place =
                text.substring(

                    index+
                    prefix.length

                ).trim();


            place=
                place.replace(

                    /^(la|il|lo|un|una|a|ad)\s+/i,

                    ""

                );


            if(place.length>1){

                return place;

            }

        }

    }

    return null;

}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(
    place
){

    setState(
        "thinking"
    );

    coordinates.textContent=
        "SEARCHING LOCATION...";


    try{

        const url=

            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(
                place
            );


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }


        const result =
            results[0];


        const lat =
            parseFloat(
                result.lat
            );


        const lon =
            parseFloat(
                result.lon
            );


        const name =
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");


        showLocation(
            name,
            lat,
            lon
        );


        return{

            name,

            lat,

            lon

        };


    }catch(error){

        console.error(
            error
        );

        coordinates.textContent=
            "LOCATION NOT FOUND";

        setState(
            "idle"
        );

        addMessage(

            "jarvis",

            "Non riesco a trovare questo luogo."

        );

        return null;

    }

}


/* =====================================================
   COORDINATE
===================================================== */

function formatCoordinates(
    lat,
    lon
){

    const latDir =
        lat>=0
        ? "N"
        : "S";

    const lonDir =
        lon>=0
        ? "E"
        : "W";


    return(

        Math.abs(lat)
        .toFixed(4)

        +

        "° "

        +

        latDir

        +

        "   |   "

        +

        Math.abs(lon)
        .toFixed(4)

        +

        "° "

        +

        lonDir

    );

}


/* =====================================================
   POSIZIONE
===================================================== */

function showLocation(

    name,
    lat,
    lon

){

    locationName.textContent=
        name;

    locationCoords.textContent=
        formatCoordinates(
            lat,
            lon
        );

    coordinates.textContent=
        formatCoordinates(
            lat,
            lon
        );

    locationInfo.classList.add(
        "visible"
    );

    focusEarth(
        lat,
        lon
    );

}


/* =====================================================
   POSIZIONE UTENTE
===================================================== */

function showMyLocation(){

    if(
        !navigator.geolocation
    ){

        addMessage(

            "jarvis",

            "Il browser non supporta la geolocalizzazione."

        );

        return;

    }


    setState(
        "thinking"
    );

    coordinates.textContent=
        "ACQUISIZIONE POSIZIONE...";


    navigator.geolocation.getCurrentPosition(

        position=>{

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            showLocation(

                "La mia posizione",

                lat,

                lon

            );


            addMessage(

                "jarvis",

                "La tua posizione è stata individuata sulla Terra."

            );

        },


        error=>{

            console.log(
                error
            );

            coordinates.textContent=
                "POSITION UNAVAILABLE";

            setState(
                "idle"
            );

            addMessage(

                "jarvis",

                "Non ho ricevuto il permesso per accedere alla posizione."

            );

        },


        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:30000

        }

    );

}
