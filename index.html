<title>JARVIS — NEURAL CORE</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#7fcfff;

    text-shadow:
        0 0 10px #168cff,
        0 0 25px rgba(22,140,255,.55);

    transition:
        opacity 1.5s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    transition:
        opacity 1.8s ease,
        transform 1.8s ease,
        filter 1.8s ease;
}

body.mapMode #neuralCanvas{
    opacity:0;
    transform:scale(.45);
    filter:blur(15px);
    pointer-events:none;
}


/* =====================================================
   EARTH
===================================================== */

#earthContainer{
    position:fixed;
    inset:0;

    z-index:2;

    opacity:0;
    pointer-events:none;

    transform:scale(.55);

    transition:
        opacity 1.8s ease,
        transform 1.8s ease;
}

body.mapMode #earthContainer{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}

#earthCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;

    top:20px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;

    font-weight:300;

    letter-spacing:12px;

    color:#dff5ff;

    text-shadow:
        0 0 8px #168cff,
        0 0 18px #168cff,
        0 0 40px rgba(22,140,255,.75),
        0 0 75px rgba(22,140,255,.35);

    transition:
        text-shadow 1.4s ease,
        color 1.4s ease;
}

.status{
    margin-top:8px;

    font:10px monospace;

    letter-spacing:3px;

    color:rgba(220,245,255,.75);
}

#dot{
    color:#5fc4ff;

    text-shadow:
        0 0 8px #168cff,
        0 0 18px #168cff;
}

body.mapMode .header h1{
    text-shadow:
        0 0 10px #168cff,
        0 0 25px #168cff,
        0 0 55px rgba(22,140,255,.8);
}


/* =====================================================
   OROLOGIO
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;

    letter-spacing:2px;

    color:#e8f8ff;

    text-shadow:
        0 0 8px rgba(22,140,255,.5);
}

#date{
    margin-top:3px;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(100,190,255,.72);
}


/* =====================================================
   MAP HUD
===================================================== */

#mapHud{
    position:fixed;

    z-index:15;

    left:50%;
    top:90px;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;

    pointer-events:none;

    font:11px monospace;

    letter-spacing:3px;

    text-align:center;

    color:#5eb8ff;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

body.mapMode #mapHud{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

#mapTitle{
    font-size:16px;

    letter-spacing:5px;

    margin-bottom:6px;

    text-shadow:
        0 0 10px #168cff,
        0 0 25px #168cff;
}

#coordinates{
    font-size:10px;

    color:rgba(180,220,255,.85);
}


/* =====================================================
   LOCATION INFO
===================================================== */

#locationInfo{
    position:fixed;

    z-index:18;

    left:50%;
    top:58%;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:10px 18px;

    background:
        rgba(0,8,18,.72);

    border:
        1px solid
        rgba(40,160,255,.5);

    border-radius:12px;

    font:11px monospace;

    letter-spacing:2px;

    text-align:center;

    box-shadow:
        0 0 25px rgba(0,130,255,.15),
        inset 0 0 20px rgba(22,140,255,.04);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#locationInfo.visible{
    opacity:1;

    transform:
        translate(-50%,0);
}

#locationName{
    font-size:14px;

    color:#fff;

    margin-bottom:4px;

    text-shadow:
        0 0 10px rgba(22,140,255,.5);
}

#locationCoords{
    color:#4faaff;
}


/* =====================================================
   CROSSHAIR
===================================================== */

#mapCrosshair{

    position:fixed;

    z-index:12;

    left:50%;
    top:50%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1s ease;
}

body.mapMode #mapCrosshair{
    opacity:.35;
}

#mapCrosshair::before,
#mapCrosshair::after{

    content:"";

    position:absolute;

    background:#168cff;

    box-shadow:
        0 0 8px #168cff;
}

#mapCrosshair::before{

    width:25px;
    height:1px;

    top:12px;
    left:0;
}

#mapCrosshair::after{

    width:1px;
    height:25px;

    left:12px;
    top:0;
}


/* =====================================================
   INDICATORE VOCALE
===================================================== */

#voiceIndicator{

    position:fixed;

    left:50%;
    bottom:55px;

    transform:
        translateX(-50%)
        translateY(10px);

    z-index:30;

    opacity:.45;

    pointer-events:none;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:8px;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

#voiceCore{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#4dbbff;

    box-shadow:
        0 0 8px #168cff,
        0 0 20px #168cff,
        0 0 45px rgba(22,140,255,.7);

    transition:
        transform 1.2s ease,
        box-shadow 1.2s ease;
}

#voiceText{

    font:9px monospace;

    letter-spacing:3px;

    color:rgba(190,230,255,.6);

    text-shadow:
        0 0 10px rgba(22,140,255,.5);

    transition:
        color 1.2s ease;
}


/* =====================================================
   STATO VOCALE
===================================================== */

body.voiceListening #voiceIndicator{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

body.voiceListening #voiceCore{

    transform:scale(1.7);

    box-shadow:
        0 0 10px #168cff,
        0 0 30px #168cff,
        0 0 65px rgba(22,140,255,.9);
}

body.voiceListening #voiceText{

    color:#8ed8ff;
}


body.voiceThinking #voiceIndicator{

    opacity:.9;

    transform:
        translateX(-50%)
        translateY(0);
}

body.voiceThinking #voiceCore{

    transform:scale(2);

    box-shadow:
        0 0 12px #168cff,
        0 0 35px #168cff,
        0 0 80px rgba(22,140,255,1);
}

body.voiceThinking #voiceText{

    color:#b8e8ff;
}


body.voiceSpeaking #voiceIndicator{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

body.voiceSpeaking #voiceCore{

    transform:scale(2.2);

    box-shadow:
        0 0 15px #168cff,
        0 0 40px #168cff,
        0 0 90px rgba(22,140,255,1);
}

body.voiceSpeaking #voiceText{

    color:#d8f5ff;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:430px){

    }

    .status{

    }

    }

/* =====================================================
   RIDUZIONE MOVIMENTO
===================================================== */

@media(prefers-reduced-motion:reduce){

    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =====================================================
   API JARVIS
===================================================== */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const neuralCanvas =
document.getElementById("neuralCanvas");

const neuralCtx =
neuralCanvas.getContext("2d");

const earthCanvas =
document.getElementById("earthCanvas");

const dot =
document.getElementById("dot");

const statusText =
document.getElementById("statusText");

const clock =
document.getElementById("clock");

const date =
document.getElementById("date");

const coordinates =
document.getElementById("coordinates");

const locationInfo =
document.getElementById("locationInfo");

const locationName =
document.getElementById("locationName");

const locationCoords =
document.getElementById("locationCoords");

document.getElementById("voiceText");


/* =====================================================
   STATO
===================================================== */

let state="idle";

let busy=false;

let mapMode=false;

let recognition=null;

let wakeRecognition=null;

let recognitionRunning=false;

let wakeRunning=false;


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    memory=JSON.parse(
        localStorage.getItem("jarvis_memory") || "[]"
    );

}catch{

    memory=[];

}

memory=memory.slice(-40);


function saveMemory(){

    memory=memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );

}


function remember(role,content){

    if(!content)return;

    memory.push({

        role,

        content,

        time:Date.now()

    });

    saveMemory();

}


saveMemory();


/* =====================================================
   STATO JARVIS
===================================================== */

function setState(newState){

    state=newState;

    document.body.classList.remove(
        "voiceListening",
        "voiceThinking",
        "voiceSpeaking"
    );


    if(newState==="listening"){

        document.body.classList.add(
            "voiceListening"
        );

        dot.style.color="#168cff";

        statusText.textContent =
            "LISTENING FOR JARVIS";

        voiceText.textContent =
            "LISTENING...";

    }


    else if(newState==="thinking"){

        document.body.classList.add(
            "voiceThinking"
        );

        dot.style.color="#168cff";

        statusText.textContent =
            "NEURAL PROCESSING";

        voiceText.textContent =
            "PROCESSING...";

    }


    else if(newState==="speaking"){

        document.body.classList.add(
            "voiceSpeaking"
        );

        dot.style.color="#168cff";

        statusText.textContent =
            "JARVIS SPEAKING";

        voiceText.textContent =
            "JARVIS SPEAKING";

    }


    else{

        dot.style.color="#5fc4ff";

        statusText.textContent =
            "NEURAL INTERFACE ONLINE";

        voiceText.textContent =

    }

}

   OROLOGIO
===================================================== */

setInterval(

/* =====================================================
   THREE.JS
===================================================== */

const atmosphere =

/* =====================================================

/* =====================================================
   COMANDO MAPPA
===================================================== */

function isMapCommand(text){

    const t =
        text.toLowerCase();

    return(

        t.includes("apri la mappa") ||

        t.includes("apri mappa") ||

        t.includes("mostrami la mappa") ||

        t.includes("mostra la mappa") ||

        t.includes("mappa del mondo") ||

        t==="mappa"

    );

}


/* =====================================================
   ESTRAZIONE LUOGO
===================================================== */

function extractLocation(text){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];


    const lower =
        text.toLowerCase();


    for(
        const prefix of patterns
    ){

        const index =
            lower.indexOf(prefix);


        if(index!==-1){

            let place =
                text.substring(
                    index+prefix.length
                ).trim();


            place =
                place.replace(
                    /^(la|il|lo|un|una|a|ad)\s+/i,
                    ""
                );


            if(place.length>1){

                return place;

            }

        }

    }

    return null;

}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(place){

    setState("thinking");

    coordinates.textContent =
        "SEARCHING LOCATION...";


    try{

        const url =
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(place);


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }


        const result =
            results[0];


        const lat =
            parseFloat(result.lat);


        const lon =
            parseFloat(result.lon);


        const name =
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");


        showLocation(
            name,
            lat,
            lon
        );


        return{
            name,
            lat,
            lon
        };


    }catch(error){

        console.error(error);

        coordinates.textContent =
            "LOCATION NOT FOUND";

        setState("idle");

        speak(
            "Non riesco a trovare questo luogo."
        );

        return null;

    }

}


/* =====================================================
   COORDINATE
===================================================== */

function formatCoordinates(lat,lon){

    const latDir =
        lat>=0 ? "N" : "S";

    const lonDir =
        lon>=0 ? "E" : "W";


    return(

        Math.abs(lat).toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon).toFixed(4)
        +
        "° "
        +
        lonDir

    );

}


/* =====================================================
   POSIZIONE
===================================================== */

function showLocation(
    name,
    lat,
    lon
){

    locationName.textContent =
        name;


    locationCoords.textContent =
        formatCoordinates(
            lat,
            lon
        );


    coordinates.textContent =
        formatCoordinates(
            lat,
            lon
        );


    locationInfo.classList.add(
        "visible"
    );


    focusEarth(
        lat,
        lon
    );

}


/* =====================================================
   POSIZIONE UTENTE
===================================================== */

function showMyLocation(){

    if(!navigator.geolocation){

        speak(
            "Il browser non supporta la geolocalizzazione."
        );

        return;

    }


    setState("thinking");


    coordinates.textContent =
        "ACQUISIZIONE POSIZIONE...";


    navigator.geolocation.getCurrentPosition(

        position=>{

            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;


            showLocation(
                "La mia posizione",
                lat,
                lon
            );


            speak(
                "La tua posizione è stata individuata sulla Terra."
            );

        },


        error=>{

            console.log(error);


            coordinates.textContent =
                "POSITION UNAVAILABLE";


            speak(
                "Non ho ricevuto il permesso per accedere alla posizione."
            );

        },


        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }

    );

}


/* =====================================================
   FOCUS TERRA
===================================================== */

let zoomAnimating=false;

let zoomProgress=1;

let zoomStart=3.3;

let zoomEnd=1.55;

let targetQuaternion =
    new THREE.Quaternion();


function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi =
        (90-lat)
        *
        Math.PI/180;


    const theta =
        (lon+180)
        *
        Math.PI/180;


    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );

}


function focusEarth(
    lat,
    lon
){

    openMap();


    const target =
        latLonToVector3(
            lat,
            lon,
            1
        );


    marker.position.copy(
        target
        .clone()
        .multiplyScalar(1.025)
    );


    marker.visible=true;

    markerRing.visible=true;


    const direction =
        target
        .clone()
        .normalize();


    const front =
        new THREE.Vector3(
            0,
            0,
            1
        );


    targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion.setFromUnitVectors(
        direction,
        front
    );


    zoomStart =
        earthCamera.position.length();


    if(zoomStart<2){

        zoomStart=3.3;

        earthCamera.position.set(
            0,
            0,
            zoomStart
        );

    }


    zoomEnd=1.55;

    zoomProgress=0;

    zoomAnimating=true;

    controls.enabled=false;

    setState("thinking");

}


/* =====================================================
   RETE NEURALE
===================================================== */

let neuralWidth =
    innerWidth;

let neuralHeight =
    innerHeight;

let neuralCx =
    neuralWidth/2;

let neuralCy =
    neuralHeight/2;

let neuralRadius =
    Math.min(
        neuralWidth,
        neuralHeight
    )*.30;

let neuralRotation=0;

let nodes=[];


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth =
        innerWidth;

    neuralHeight =
        innerHeight;


    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );


    neuralCanvas.width =
        neuralWidth*dpr;

    neuralCanvas.height =
        neuralHeight*dpr;


    neuralCanvas.style.width =
        neuralWidth+"px";


    neuralCanvas.style.height =
        neuralHeight+"px";


    neuralCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    neuralCx =
        neuralWidth/2;


    neuralCy =
        neuralHeight/2;


    neuralRadius =
        Math.min(
            neuralWidth,
            neuralHeight
        )*.30;


    createNeuralNodes();

}


/* =====================================================
   NODI
===================================================== */

function createNeuralNodes(){

    nodes=[];


    for(
        let i=0;
        i<145;
        i++
    ){

        const special =
            Math.random() < .15;


        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .72+
                    Math.random()*.55
                ),

            size:
                .7+
                Math.random()*1.8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            special,

            colorPhase:
                Math.random()
                *
                Math.PI
                *
                2

        });

    }

}


/* =====================================================
   ANIMAZIONE RETE NEURALE
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );


    const time =
        performance.now()/1000;


    let speed=1;

    let energy=.2;


    if(state==="listening"){

        speed=2.1;

        energy=.65;

    }


    if(state==="thinking"){

        speed=3.4;

        energy=1.0;

    }


    if(state==="speaking"){

        speed=2.6;

        energy=.8;

    }


    neuralRotation +=
        .004*speed;


    neuralCtx.fillStyle =
        "rgba(0,0,0,.25)";


    neuralCtx.fillRect(
        0,
        0,
        neuralWidth,
        neuralHeight
    );


    /*
       BLU FUTURISTICO
    */

    const targetColor={

        r:20,
        g:145,
        b:255

    };


    window.jarvisColor =
        window.jarvisColor ||
        {
            r:20,
            g:145,
            b:255
        };


    jarvisColor.r +=
        (
            targetColor.r-
            jarvisColor.r
        )*.025;


    jarvisColor.g +=
        (
            targetColor.g-
            jarvisColor.g
        )*.025;


    jarvisColor.b +=
        (
            targetColor.b-
            jarvisColor.b
        )*.025;


    const r =
        Math.round(
            jarvisColor.r
        );


    const g =
        Math.round(
            jarvisColor.g
        );


    const b =
        Math.round(
            jarvisColor.b
        );


    const pulse =
        (
            Math.sin(time*2.7)+1
        )/2;


    const glowSize =
        neuralRadius*
        (
            1.02+
            energy*.65+
            pulse*.14
        );


    const gradient =
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glowSize

        );


    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},.42)`
    );


    gradient.addColorStop(
        .35,
        `rgba(${r},${g},${b},.13)`
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    neuralCtx.fillStyle =
        gradient;


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        glowSize,
        0,
        Math.PI*2
    );


    neuralCtx.fill();


    const projected=[];


    nodes.forEach(n=>{

        const rr =
            n.r+
            Math.sin(
                time*2+n.phase
            )
            *
            energy*
            5;


        let x =
            rr*
            Math.sin(n.phi)*
            Math.cos(
                n.theta+
                neuralRotation
            );


        let y =
            rr*
            Math.cos(n.phi);


        let z =
            rr*
            Math.sin(n.phi)*
            Math.sin(
                n.theta+
                neuralRotation
            );


        if(state!=="idle"){

            x +=
                Math.sin(
                    time*1.6+n.phase
                )
                *
                energy*
                5;


            y +=
                Math.cos(
                    time*1.8+n.phase
                )
                *
                energy*
                5;

        }


        const perspective =
            430/
            (
                430+z
            );


        projected.push({

            x:
                neuralCx+
                x*perspective,

            y:
                neuralCy+
                y*perspective,

            z,

            size:
                n.size*
                perspective,

            alpha:
                Math.max(
                    .1,
                    Math.min(
                        1,
                        (z+neuralRadius)/
                        (neuralRadius*2)
                    )
                ),

            phase:
                n.phase,

            special:
                n.special,

            colorPhase:
                n.colorPhase

        });

    });


    const maxDist =
        state==="thinking"
        ? 100
        : 78;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        for(
            let j=i+1;
            j<projected.length;
            j++
        ){

            const a =
                projected[i];

            const c =
                projected[j];


            const dx =
                a.x-c.x;


            const dy =
                a.y-c.y;


            const dist =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(dist<maxDist){

                const alpha =
                    (
                        1-
                        dist/maxDist
                    )
                    *
                    .26*
                    a.alpha;


                neuralCtx.beginPath();


                neuralCtx.moveTo(
                    a.x,
                    a.y
                );


                neuralCtx.lineTo(
                    c.x,
                    c.y
                );


                neuralCtx.strokeStyle =
                    `rgba(${r},${g},${b},${alpha})`;


                neuralCtx.lineWidth=.6;


                neuralCtx.stroke();

            }

        }

    }


    projected.forEach(n=>{

        const flicker =
            (
                Math.sin(
                    time*5+n.phase
                )+1
            )/2;


        const size =
            n.size+
            flicker*
            (
                state==="thinking"
                ? 1.3
                : .55
            );


        let particleR=r;

        let particleG=g;

        let particleB=b;


        /*
           Alcuni nodi leggermente più chiari,
           senza cambiare il tema blu.
        */

        if(n.special){

            particleR=105;
            particleG=205;
            particleB=255;

        }


        neuralCtx.fillStyle =
            `rgba(${particleR},${particleG},${particleB},${n.alpha*.25})`;


        neuralCtx.beginPath();


        neuralCtx.arc(
            n.x,
            n.y,
            size*4,
            0,
            Math.PI*2
        );


        neuralCtx.fill();


        neuralCtx.fillStyle =
            `rgba(${particleR},${particleG},${particleB},${n.alpha})`;


        neuralCtx.beginPath();


        neuralCtx.arc(
            n.x,
            n.y,
            size,
            0,
            Math.PI*2
        );


        neuralCtx.fill();

    });


    const core =
        5+
        pulse*1.5+
        energy*1.8;


    neuralCtx.fillStyle =
        `rgba(${r},${g},${b},.34)`;


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core*5,
        0,
        Math.PI*2
    );


    neuralCtx.fill();


    neuralCtx.fillStyle =
        "#e8f9ff";


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core,
        0,
        Math.PI*2
    );


    neuralCtx.fill();

}


/* =====================================================
   TERRA ANIMATA
===================================================== */

let markerPulse=0;


function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );


    if(
        mapMode &&
        zoomAnimating
    ){

        /*
           ZOOM PIÙ LENTO
        */

        zoomProgress += .006;


        if(zoomProgress>=1){

            zoomProgress=1;

            zoomAnimating=false;

            controls.enabled=true;

            setState("idle");

        }


        const eased =
            1-
            Math.pow(
                1-zoomProgress,
                3
            );


        const distance =
            zoomStart+
            (
                zoomEnd-
                zoomStart
            )
            *
            eased;


        const cameraDirection =
            earthCamera.position
            .clone()
            .normalize();


        earthCamera.position.copy(

            cameraDirection
            .multiplyScalar(
                distance
            )

        );


        earthGroup.quaternion.slerp(
            targetQuaternion,
            .025
        );

    }


    controls.update();


    if(marker.visible){

        markerPulse += .045;


        const scale =
            1+
            Math.sin(
                markerPulse
            )*.3;


        marker.scale.set(
            scale,
            scale,
            scale
        );


        markerRing.visible=true;


        markerRing.position.copy(
            marker.position
        );


        markerRing.lookAt(
            earthCamera.position
        );


        markerRing.scale.set(
            scale,
            scale,
            scale
        );

    }


    earthRenderer.render(
        earthScene,
        earthCamera
    );

}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localCommand(text){

    const t =
        text.toLowerCase();


    if(

        t.includes("che ore sono") ||

        t.includes("che ora è") ||

        t.includes("che ora e")

    ){

        return(

            "Sono le "
            +
            new Date()
            .toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
            +
            "."

        );

    }


    if(

        t.includes("che giorno è") ||

        t.includes("che giorno e")

    ){

        return(

            "Oggi è "
            +
            new Date()
            .toLocaleDateString(
                "it-IT",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )
            +
            "."

        );

    }


    if(

        t.includes("mia posizione") ||

        t.includes("dove sono")

    ){

        showMyLocation();

        return "__LOCATION__";

    }


    if(isMapCommand(t)){

        openMap();

        return "Mappa terrestre attivata.";

    }


    return null;

}


/* =====================================================
   INVIO VOCALE
===================================================== */

async function processVoiceCommand(text){

    if(!text || busy){

        return;

    }


    busy=true;


    remember(
        "user",
        text
    );


    const place =
        extractLocation(text);


    if(place){

        openMap();


        const result =
            await searchPlace(
                place
            );


        if(result){

            const responseText =
                "Ho individuato "
                +
                result.name
                +
                ".";


            remember(
                "assistant",
                responseText
            );


            speak(
                responseText
            );

        }


        busy=false;

        return;

    }


    const local =
        localCommand(text);


    if(local){

        if(local!=="__LOCATION__"){

            remember(
                "assistant",
                local
            );


            speak(local);

        }


        busy=false;

        return;

    }


    setState("thinking");


    const recentMemory =
        memory.slice(-24);


    const intelligentContext={

        assistantName:"JARVIS",

        language:"it-IT",

        currentTime:
            new Date()
            .toLocaleTimeString(
                "it-IT"
            ),

        currentDate:
            new Date()
            .toLocaleDateString(
                "it-IT"
            ),

        mapMode:mapMode,

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Comprendi il significato della domanda.",

            "Rispondi in modo naturale e intelligente.",

            "Non inventare informazioni.",

            "Se la domanda è ambigua, fai una domanda breve.",

            "Usa la memoria quando è utile.",

            "Non dire continuamente che sei un'intelligenza artificiale.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "La risposta verrà letta completamente a voce.",

            "Non usare elenchi troppo lunghi se non necessari.",

            "Mantieni le risposte naturali per una conversazione vocale."

        ]

    };


    try{

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );

        }


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(error);


        speak(
            "Neural Core non raggiungibile. Controlla la connessione o il server AI."
        );

    }

}


/* =====================================================
   SINTESI VOCALE
===================================================== */

function speak(text){

    if(!("speechSynthesis" in window)){

        busy=false;

        setState("idle");

        restartWakeWord();

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    /*
       VOCE PIÙ LENTA E NATURALE
    */

    utterance.rate=.84;

    utterance.pitch=.65;

    utterance.volume=1;


    utterance.onstart=()=>{

        setState(
            "speaking"
        );

    };


    utterance.onend=()=>{

        busy=false;


        setState(
            "idle"
        );


        /*
           Torna automaticamente
           in ascolto della parola JARVIS.
        */

        setTimeout(
            restartWakeWord,
            900
        );

    };


    utterance.onerror=()=>{

        busy=false;

        setState(
            "idle"
        );


        setTimeout(
            restartWakeWord,
            900
        );

    };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(Recognition){

    /*
       RICONOSCIMENTO DEL COMANDO
    */

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart=()=>{

        recognitionRunning=true;

        setState(
            "listening"
        );

    };


    recognition.onresult =
        event=>{

            let transcript="";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                    .transcript;

            }


            if(
                transcript.trim()
            ){

                /*
                   Mostriamo solo lo stato vocale.
                   Nessuna casella di testo.
                */

            }


            const last =
                event.results[
                    event.results.length-1
                ];


            if(last.isFinal){

                const command =
                    transcript.trim();


                if(command){

                    processVoiceCommand(
                        command
                    );

                }

            }

        };


    recognition.onerror =
        event=>{

            console.log(
                "Speech recognition:",
                event.error
            );

        };


    recognition.onend=()=>{

        recognitionRunning=false;

    };


    /* =================================================
       WAKE WORD
    ================================================= */

    function startWakeWord(){

        if(

            !Recognition ||

            busy ||

            recognitionRunning ||

            wakeRunning

        ){

            return;

        }


        wakeRecognition =
            new Recognition();


        wakeRecognition.lang =
            "it-IT";


        wakeRecognition.continuous =
            true;


        wakeRecognition.interimResults =
            true;


        wakeRunning=true;


        setState(
            "listening"
        );


        wakeRecognition.onresult =
            event=>{

                for(
                    let i=event.resultIndex;
                    i<event.results.length;
                    i++
                ){

                    const text =
                        event.results[i][0]
                        .transcript
                        .toLowerCase()
                        .trim();


                    if(
                        text.includes("jarvis")
                    ){

                        console.log(
                            "Wake word detected:",
                            text
                        );


                        try{

                            wakeRecognition.stop();

                        }catch{}


                        wakeRunning=false;

                        activateJarvis();

                        return;

                    }

                }

            };


        wakeRecognition.onerror=event=>{

            console.log(
                "Wake recognition:",
                event.error
            );


            wakeRunning=false;


            if(!busy){

                setTimeout(
                    startWakeWord,
                    1200
                );

            }

        };


        wakeRecognition.onend=()=>{

            wakeRunning=false;


            if(!busy){

                setTimeout(
                    startWakeWord,
                    500
                );

            }

        };


        try{

            wakeRecognition.start();

        }catch{

            wakeRunning=false;

        }

    }


    function stopWakeWord(){

        if(wakeRecognition){

            try{

                wakeRecognition.stop();

            }catch{}


            wakeRecognition=null;

        }

        wakeRunning=false;

    }


    function activateJarvis(){

        if(
            busy ||
            recognitionRunning
        ){

            return;

        }


        stopWakeWord();


        setState(
            "listening"
        );


        /*
           Piccola pausa per rendere
           l'attivazione più cinematografica.
        */

        setTimeout(()=>{

            try{

                recognition.start();

            }catch(error){

                console.log(error);

                recognitionRunning=false;

                restartWakeWord();

            }

        },450);

    }


    function restartWakeWord(){

        if(
            busy ||
            recognitionRunning
        ){

            return;

        }


        setTimeout(()=>{

            startWakeWord();

        },100);

    }


    /*
       AVVIO AUTOMATICO
    */

    setTimeout(()=>{

        startWakeWord();

    },2200);


}else{

    console.log(
        "Speech Recognition non supportato da questo browser."
    );


    statusText.textContent =
        "VOICE SYSTEM UNAVAILABLE";

}
