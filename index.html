<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

.header{
    position:fixed;
    top:24px;
    left:0;
    width:100%;
    text-align:center;
    z-index:10;
    pointer-events:none;
}

.header h1{
    margin:0;
    font-size:25px;
    font-weight:300;
    letter-spacing:12px;
    text-shadow:0 0 12px #ffd000,0 0 30px rgba(255,190,0,.5);
}

.status{
    margin-top:7px;
    font:10px monospace;
    letter-spacing:3px;
    color:rgba(255,255,255,.65);
}

#statusDot{
    color:#ffd000;
    text-shadow:0 0 10px currentColor;
}

.info{
    position:fixed;
    top:25px;
    left:25px;
    z-index:10;
    font:10px monospace;
    letter-spacing:2px;
    line-height:1.8;
    color:rgba(255,200,0,.5);
    border-left:2px solid rgba(255,200,0,.6);
    padding-left:10px;
}

.info.right{
    left:auto;
    right:25px;
    text-align:right;
    border-left:0;
    border-right:2px solid rgba(255,200,0,.6);
    padding-left:0;
    padding-right:10px;
}

#coreText{
    position:fixed;
    z-index:5;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font:9px monospace;
    letter-spacing:4px;
    color:rgba(255,255,255,.3);
    pointer-events:none;
}

#coreState{
    display:block;
    margin-top:7px;
    font-size:7px;
    letter-spacing:2px;
}

#chat{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:108px;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    max-height:26vh;
    overflow-y:auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scrollbar-width:none;
}

#chat::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:85%;
    padding:11px 15px;
    border-radius:5px;
    font-size:14px;
    line-height:1.5;
    word-wrap:break-word;
    backdrop-filter:blur(10px);
}

.user{
    align-self:flex-end;
    background:rgba(255,190,0,.08);
    border:1px solid rgba(255,190,0,.35);
    border-right:3px solid #ffd000;
}

.jarvis{
    align-self:flex-start;
    background:rgba(8,12,18,.82);
    border:1px solid rgba(80,160,255,.18);
    border-left:3px solid #168cff;
    color:#dcecff;
}

.inputArea{
    position:fixed;
    z-index:30;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    padding:0 20px;
}

.inputBox{
    display:flex;
    gap:7px;
    padding:5px;
    background:rgba(7,8,12,.95);
    border:1px solid rgba(255,190,0,.4);
    border-radius:7px;
    box-shadow:0 0 25px rgba(255,190,0,.08);
}

#input{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 14px;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    font-size:14px;
}

#input::placeholder{
    color:rgba(255,255,255,.3);
}

button{
    height:44px;
    border-radius:5px;
    border:1px solid rgba(255,190,0,.5);
    background:rgba(255,190,0,.1);
    color:#ffd000;
    font-family:monospace;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffd000;
    color:#000;
    box-shadow:0 0 18px rgba(255,210,0,.6);
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#mic{
    width:48px;
    font-size:17px;
}

#send{
    width:70px;
}

#mic.active{
    background:#168cff;
    border-color:#168cff;
    color:white;
    box-shadow:0 0 20px #168cff;
}

@media(max-width:600px){

    .info{
        display:none;
    }

    .header h1{
        font-size:20px;
        letter-spacing:8px;
    }

    .message{
        max-width:90%;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="info">
JARVIS CORE V7<br>
NEURAL ENGINE: ONLINE<br>
SYSTEM: ACTIVE
</div>

<div class="info right">
MEMORY: <span id="memoryCount">0</span><br>
STATE: <span id="stateText">IDLE</span>
</div>

<div class="header">
    <h1>J.A.R.V.I.S.</h1>

    <div class="status">
        <span id="statusDot">●</span>
        NEURAL INTERFACE ONLINE
    </div>
</div>

<div id="coreText">
    NEURAL CORE
    <span id="coreState">READY</span>
</div>

<div id="chat">

    <div class="message jarvis">
        JARVIS online. In attesa di istruzioni.
    </div>

</div>

<div class="inputArea">

    <div class="inputBox">

        <input
            id="input"
            type="text"
            placeholder="Comunica con JARVIS..."
            autocomplete="off"
        >

        <button id="mic" type="button">🎙</button>

        <button id="send" type="button">INVIA</button>

    </div>

</div>


<script>

/* =====================================================
   JARVIS API
===================================================== */

const API_URL =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const chat =
document.getElementById("chat");

const stateText =
document.getElementById("stateText");

const coreState =
document.getElementById("coreState");

const statusDot =
document.getElementById("statusDot");

const memoryCount =
document.getElementById("memoryCount");


/* =====================================================
   STATO
===================================================== */

let state = "idle";
let busy = false;
let listening = false;


/* =====================================================
   CAMBIO STATO
===================================================== */

function setState(newState){

    state = newState;

    stateText.textContent =
    newState.toUpperCase();

    if(newState === "idle"){
        coreState.textContent = "READY";
    }

    if(newState === "listening"){
        coreState.textContent = "LISTENING";
    }

    if(newState === "thinking"){
        coreState.textContent = "PROCESSING";
    }

    if(newState === "speaking"){
        coreState.textContent = "SPEAKING";
    }
}


/* =====================================================
   MEMORIA
===================================================== */

let memory = [];

try{

    const saved =
    localStorage.getItem("jarvis_memory");

    if(saved){
        memory = JSON.parse(saved);
    }

}catch(e){
    memory = [];
}


function saveMemory(){

    memory =
    memory.slice(-20);

    try{

        localStorage.setItem(
            "jarvis_memory",
            JSON.stringify(memory)
        );

    }catch(e){}

    memoryCount.textContent =
    memory.length;
}


function remember(role,text){

    memory.push({
        role:role,
        content:text
    });

    saveMemory();
}


saveMemory();


/* =====================================================
   CHAT
===================================================== */

function addMessage(type,text){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.textContent =
    text;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;

    return div;
}


/* =====================================================
   ORA
===================================================== */

function getTime(){

    return new Date()
    .toLocaleTimeString(
        "it-IT",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =====================================================
   RISPOSTE LOCALI
===================================================== */

function localCommand(text){

    const t =
    text.toLowerCase().trim();


    if(
        t.includes("che ore sono") ||
        t.includes("che ora è") ||
        t.includes("che ora e") ||
        t.includes("dimmi l'ora") ||
        t.includes("dimmi l ora")
    ){

        return "Sono le " +
        getTime() +
        ".";

    }


    if(
        t === "ciao" ||
        t === "ciao jarvis" ||
        t === "hey jarvis"
    ){

        return "Ciao. JARVIS è online e pronto.";

    }


    return null;
}


/* =====================================================
   INVIO
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    const text =
    input.value.trim();


    if(
        !text ||
        busy
    ){

        return;
    }


    busy = true;

    input.value = "";


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    input.disabled = true;
    send.disabled = true;
    mic.disabled = true;


    setState("thinking");


    /* COMANDI LOCALI */

    const local =
    localCommand(text);


    if(local){

        const answer =
        addMessage(
            "jarvis",
            local
        );


        remember(
            "assistant",
            local
        );


        speak(local);

        finish();

        return;
    }


    /* API */

    const answer =
    addMessage(
        "jarvis",
        "Elaborazione..."
    );


    try{

        const response =
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    message:text,

                    memory:
                    memory.slice(-20)

                })
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
        await response.json();


        if(!data.reply){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent =
        data.reply;


        remember(
            "assistant",
            data.reply
        );


        speak(
            data.reply
        );


    }catch(error){

        console.error(
            "JARVIS:",
            error
        );


        answer.textContent =
        "Connessione al Neural Core non disponibile.";

        setState("idle");

    }


    finish();
}


/* =====================================================
   FINE
===================================================== */

function finish(){

    input.disabled = false;
    send.disabled = false;
    mic.disabled = false;

    busy = false;

    input.focus();

}


/* =====================================================
   VOCE
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        setState("idle");

        return;
    }


    speechSynthesis.cancel();


    const utterance =
    new SpeechSynthesisUtterance(
        text
    );


    utterance.lang =
    "it-IT";

    utterance.rate =
    .92;

    utterance.pitch =
    .72;

    utterance.volume =
    1;


    utterance.onstart =
    function(){

        setState(
            "speaking"
        );

    };


    utterance.onend =
    function(){

        setState(
            "idle"
        );

    };


    utterance.onerror =
    function(){

        setState(
            "idle"
        );

    };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   MICROFONO
===================================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition = null;


if(SpeechRecognition){

    recognition =
    new SpeechRecognition();


    recognition.lang =
    "it-IT";

    recognition.continuous =
    false;

    recognition.interimResults =
    true;


    recognition.onstart =
    function(){

        listening = true;

        mic.classList.add(
            "active"
        );

        mic.textContent = "■";

        input.placeholder =
        "Ti ascolto...";

        setState(
            "listening"
        );
    };


    recognition.onresult =
    function(event){

        let transcript = "";


        for(
            let i =
            event.resultIndex;

            i <
            event.results.length;

            i++
        ){

            transcript +=
            event.results[i][0]
            .transcript;

        }


        input.value =
        transcript;


        const lastResult =
        event.results[
            event.results.length - 1
        ];


        if(
            lastResult.isFinal
        ){

            setTimeout(
                function(){

                    if(
                        input.value.trim()
                    ){

                        sendMessage();

                    }

                },
                200
            );

        }

    };


    recognition.onerror =
    function(event){

        console.log(
            "Microfono:",
            event.error
        );

        listening = false;

        mic.classList.remove(
            "active"
        );

        mic.textContent =
        "🎙";

        input.placeholder =
        "Comunica con JARVIS...";

        setState("idle");

    };


    recognition.onend =
    function(){

        listening = false;

        mic.classList.remove(
            "active"
        );

        mic.textContent =
        "🎙";

        input.placeholder =
        "Comunica con JARVIS...";

        if(
            state === "listening"
        ){

            setState("idle");

        }

    };


    mic.addEventListener(
        "click",
        function(){

            if(busy){

                return;
            }


            if(listening){

                recognition.stop();

                return;
            }


            try{

                recognition.start();

            }catch(error){

                console.log(error);

            }

        }
    );


}else{

    mic.disabled = true;

    mic.title =
    "Microfono non supportato dal browser.";

}


/* =====================================================
   SFERA
===================================================== */

let width =
window.innerWidth;

let height =
window.innerHeight;

let centerX =
width / 2;

let centerY =
height / 2;

let radius =
Math.min(width,height) * .22;

let rotation = 0;

let nodes = [];


function resize(){

    width =
    window.innerWidth;

    height =
    window.innerHeight;


    const dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );


    canvas.width =
    width*dpr;

    canvas.height =
    height*dpr;


    canvas.style.width =
    width+"px";

    canvas.style.height =
    height+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    centerX =
    width/2;

    centerY =
    height/2;


    radius =
    Math.min(
        width,
        height
    )*.22;


    createNodes();
}


function createNodes(){

    nodes = [];


    for(
        let i=0;
        i<150;
        i++
    ){

        nodes.push({

            theta:
            Math.random()*
            Math.PI*2,

            phi:
            Math.acos(
                2*Math.random()-1
            ),

            r:
            radius*
            (
                .7+
                Math.random()*.48
            ),

            size:
            .8+
            Math.random()*1.7,

            phase:
            Math.random()*
            Math.PI*2

        });

    }
}


/* =====================================================
   GIALLO / BLU
===================================================== */

const colors = {

    yellow:{
        r:255,
        g:195,
        b:0
    },

    blue:{
        r:25,
        g:135,
        b:255
    }

};


let currentColor = {
    r:255,
    g:195,
    b:0
};


function getTargetColor(){

    if(
        state === "listening" ||
        state === "thinking"
    ){

        return colors.blue;

    }


    return colors.yellow;
}


function updateColor(){

    const target =
    getTargetColor();


    currentColor.r +=
    (target.r-currentColor.r)
    *.045;

    currentColor.g +=
    (target.g-currentColor.g)
    *.045;

    currentColor.b +=
    (target.b-currentColor.b)
    *.045;
}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateColor();


    const time =
    performance.now()/1000;


    let speed = 1;
    let energy = .25;


    if(
        state === "listening"
    ){

        speed = 3;
        energy = .9;

    }


    if(
        state === "thinking"
    ){

        speed = 5;
        energy = 1.4;

    }


    if(
        state === "speaking"
    ){

        speed = 3;
        energy = .75;

    }


    rotation +=
    .004*speed;


    /* SFONDO */

    ctx.fillStyle =
    "rgba(0,0,0,.25)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const r =
    Math.round(
        currentColor.r
    );

    const g =
    Math.round(
        currentColor.g
    );

    const b =
    Math.round(
        currentColor.b
    );


    /* GLOW */

    const pulse =
    (
        Math.sin(time*4)+1
    )/2;


    const glowRadius =
    radius*
    (
        1.15+
        energy*.6+
        pulse*.15
    );


    const gradient =
    ctx.createRadialGradient(
        centerX,
        centerY,
        0,
        centerX,
        centerY,
        glowRadius
    );


    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},.48)`
    );


    gradient.addColorStop(
        .3,
        `rgba(${r},${g},${b},.15)`
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
    gradient;


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        glowRadius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* NODI */

    const projected = [];


    nodes.forEach(
        function(n){

            const movement =
            Math.sin(
                time*3+n.phase
            )*
            energy*
            5;


            const rr =
            n.r+movement;


            let x =
            rr*
            Math.sin(n.phi)*
            Math.cos(
                n.theta+rotation
            );


            let y =
            rr*
            Math.cos(n.phi);


            let z =
            rr*
            Math.sin(n.phi)*
            Math.sin(
                n.theta+rotation
            );


            if(
                state !== "idle"
            ){

                x +=
                Math.sin(
                    time*2+n.phase
                )*
                energy*5;


                y +=
                Math.cos(
                    time*2.5+n.phase
                )*
                energy*5;

            }


            const perspective =
            430/
            (430+z);


            projected.push({

                x:
                centerX+
                x*perspective,

                y:
                centerY+
                y*perspective,

                z:z,

                size:
                n.size*perspective,

                alpha:
                Math.max(
                    .12,
                    Math.min(
                        1,
