<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time 3D Hand-Controlled Particle System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #020205;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #video-input {
      display: none;
    }
    .ui-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 260px;
      padding: 20px;
      background: rgba(10, 10, 18, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .ui-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    select, input[type="color"] {
      width: 100%;
      height: 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    select:hover, input[type="color"]:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }
    select option {
      background: #0d0d15;
      color: #fff;
    }
    input[type="color"] {
      padding: 4px;
      height: 40px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 4px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4757;
      box-shadow: 0 0 8px #ff4757;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .status-dot.active {
      background: #2ed573;
      box-shadow: 0 0 8px #2ed573;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="video-input"></video>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="ui-title">Control Panel</div>
    
    <div class="control-group">
      <label for="shape-select">Template</label>
      <select id="shape-select">
        <option value="heart">Heart</option>
        <option value="flower">Flower</option>
        <option value="saturn">Saturn</option>
        <option value="buddha">Buddha Statue</option>
        <option value="fireworks">Fireworks</option>
      </select>
    </div>

    <div class="control-group">
      <label for="color-picker">Particle Color</label>
      <input type="color" id="color-picker" value="#00f0ff">
    </div>

    <div class="status-badge">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Tracking Camera...</span>
    </div>
  </div>

  <script>
    const PARTICLE_COUNT = 24000;
    let scene, camera, renderer, particleSystem, geometry, material;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    
    let handExpansionScale = 1.0;
    let targetScale = 1.0;
    
    let targetCamZ = 35;
    let targetRotX = 0;
    let targetRotY = 0;
    let targetRotZ = 0;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = targetCamZ;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      geometry = new THREE.BufferGeometry();
      
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 50;
        targetPositions[i] = currentPositions[i];
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      // Texture ad altissima nitidezza senza gradienti sfocati
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      // Cerchio solido a bordi netti e definiti
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(64, 64, 60, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;

      material = new THREE.PointsMaterial({
        size: 0.18,
        color: new THREE.Color('#00f0ff'),
        map: texture,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geometry, material);
      // Mantieni l'oggetto fisso al centro dello schermo
      particleSystem.position.set(0, 0, 0);
      scene.add(particleSystem);

      generateShape('heart');

      window.addEventListener('resize', onWindowResize);
    }

    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'heart') {
          const t = Math.random() * Math.PI * 2;
          const u = (Math.random() - 0.5) * 4;
          x = 16 * Math.pow(Math.sin(t), 3);
          y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          z = u;
          x *= 0.65; y *= 0.65; z *= 0.65;
        } else if (type === 'flower') {
          const u = Math.random() * Math.PI * 2;
          const v = Math.random() * Math.PI;
          const r = 10 * Math.sin(6 * u) * Math.sin(v);
          x = r * Math.sin(v) * Math.cos(u);
          y = r * Math.sin(v) * Math.sin(u);
          z = r * Math.cos(v);
        } else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.35) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 5.5 * Math.cbrt(Math.random());
            x = r * Math.sin(phi) * Math.cos(theta);
            y = r * Math.sin(phi) * Math.sin(theta);
            z = r * Math.cos(phi);
          } else {
            const angle = Math.random() * Math.PI * 2;
            const dist = 8 + Math.random() * 9;
            x = Math.cos(angle) * dist;
            z = Math.sin(angle) * dist;
            y = (Math.random() - 0.5) * 0.4;
          }
        } else if (type === 'buddha') {
          const rand = Math.random();
          if (rand < 0.35) {
            const a = Math.random() * Math.PI * 2;
            const r = 2 + Math.random() * 9;
            x = Math.cos(a) * r;
            z = Math.sin(a) * r;
            y = -8 + (Math.random() - 0.5) * 1.5;
          } else if (rand < 0.75) {
            const h = Math.random() * 10;
            const width = (1 - h / 10) * 7.5;
            const a = Math.random() * Math.PI * 2;
            x = Math.cos(a) * width * Math.random();
            z = Math.sin(a) * width * Math.random();
            y = -7 + h;
          } else {
            const a = Math.random() * Math.PI * 2;
            const r = Math.random() * 2.8;
            x = Math.cos(a) * r;
            y = 5.5 + Math.sin(a) * r;
            z = (Math.random() - 0.5) * 2;
          }
        } else if (type === 'fireworks') {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);
          const speed = 2 + Math.random() * 14;
          x = speed * Math.sin(phi) * Math.cos(theta);
          y = speed * Math.sin(phi) * Math.sin(theta);
          z = speed * Math.cos(phi);
        }

        p[idx] = x;
        p[idx + 1] = y;
        p[idx + 2] = z;
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const numHands = results.multiHandLandmarks.length;
          statusDot.classList.add('active');
          statusText.innerText = `Controllo 3D (${numHands} Man${numHands > 1 ? 'i' : 'o'})`;

          const h1 = results.multiHandLandmarks[0][9]; // Centro palmo 1

          if (numHands >= 2) {
            const h2 = results.multiHandLandmarks[1][9]; // Centro palmo 2

            const dx = h2.x - h1.x;
            const dy = h2.y - h1.y;
            const dz = (h2.z || 0) - (h1.z || 0);
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            // ROTAZIONE 3D CON DUE MANI (Come orientare un volante/sfera 3D nello spazio)
            // 1. Roll (Rotazione asse Z): Inclinazione relativa tra le due mani
            targetRotZ = Math.atan2(dy, dx);

            // 2. Yaw (Rotazione asse Y): Spostamento orizzontale relativo tra le mani
            const avgX = (h1.x + h2.x) / 2 - 0.5;
            targetRotY = avgX * Math.PI * 3.0;

            // 3. Pitch (Rotazione asse X): Altezza media delle mani
            const avgY = (h1.y + h2.y) / 2 - 0.5;
            targetRotX = avgY * Math.PI * 2.5;

            // ZOOM A DUE MANI: Distanza tra le due mani nello spazio
            targetCamZ = THREE.MathUtils.mapLinear(dist, 0.18, 0.75, 70, 12);
            targetCamZ = THREE.MathUtils.clamp(targetCamZ, 12, 75);
          } else {
            // ROTAZIONE 3D CON UNA MANO: Orientamento spaziale del singolo palmo
            const wrist = results.multiHandLandmarks[0][0];
            const middle = results.multiHandLandmarks[0][9];

            targetRotZ = -Math.atan2(middle.y - wrist.y, middle.x - wrist.x) - Math.PI / 2;
            targetRotX = (middle.y - 0.5) * Math.PI * 2.0;
            targetRotY = (middle.x - 0.5) * Math.PI * 3.0;

            // ESPANSIONE SINGOLA MANO (Pugno aperto/chiuso)
            const spanX = wrist.x - results.multiHandLandmarks[0][12].x;
            const spanY = wrist.y - results.multiHandLandmarks[0][12].y;
            const span = Math.sqrt(spanX * spanX + spanY * spanY);

            targetScale = THREE.MathUtils.mapLinear(span, 0.2, 0.55, 0.4, 2.2);
            targetScale = THREE.MathUtils.clamp(targetScale, 0.3, 2.5);
          }
        } else {
          statusDot.classList.remove('active');
          statusText.innerText = "Nessuna mano rilevata";
          targetScale = 1.0;
          targetCamZ = 35;
          targetRotX = 0;
          targetRotY = 0;
          targetRotZ = 0;
        }
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });
      cameraUtils.start();
    }

    function animate() {
      requestAnimationFrame(animate);

      // Rotazione 3D fluida sui tre assi (X, Y, Z)
      particleSystem.rotation.x += (targetRotX - particleSystem.rotation.x) * 0.08;
      particleSystem.rotation.y += (targetRotY + 0.003 - particleSystem.rotation.y) * 0.08;
      particleSystem.rotation.z += (targetRotZ - particleSystem.rotation.z) * 0.08;

      // Scaling e Zoom continui
      handExpansionScale += (targetScale - handExpansionScale) * 0.1;
      camera.position.z += (targetCamZ - camera.position.z) * 0.08;

      const positions = geometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        const target = targetPositions[i] * handExpansionScale;
        positions[i] += (target - positions[i]) * 0.08;
      }

      geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('shape-select').addEventListener('change', (e) => {
      generateShape(e.target.value);
    });

    document.getElementById('color-picker').addEventListener('input', (e) => {
      material.color.set(e.target.value);
    });

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
</html>
