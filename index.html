<!DOCTYPE html>  <html lang="it">  <head>  
<meta charset="UTF-8">

*{  
    box-sizing:border-box;  
    margin:0;  
    padding:0;  
}  
  
html,  
body{  
    width:100%;  
    height:100%;  
    overflow:hidden;  
    background:#010405;  
    font-family:Arial,sans-serif;  
}  
  
body{  
    background:  
        radial-gradient(  
            circle at center,  
            #071719 0%,  
            #020708 48%,  
            #000000 100%  
        );  
}  
  
#webgl-container{  
    position:fixed;  
    inset:0;  
    z-index:1;  
}  
  
.vignette{  
    position:fixed;  
    inset:0;  
    z-index:3;  
    pointer-events:none;  
  
    background:  
        radial-gradient(  
            circle at center,  
            transparent 30%,  
            rgba(0,0,0,.2) 65%,  
            rgba(0,0,0,.8) 100%  
        );  
}  
  
.jarvis-title{  
    position:fixed;  
  
    /* LEGGERMENTE PIÙ IN BASSO */  
    top:2.4%;  
  
    left:50%;  
    transform:translateX(-50%);  
  
    z-index:30;  
  
    color:rgba(255,255,255,.86);  
  
    font-size:  
        clamp(20px,2.8vw,31px);  
  
    font-weight:300;  
  
    letter-spacing:  
        clamp(5px,1vw,8px);  
  
    white-space:nowrap;  
  
    text-shadow:  
        0 0 10px  
        rgba(255,255,255,.12);  
  
    pointer-events:none;  
}  
  
.datetime{  
    position:fixed;  
    top:18px;  
    right:24px;  
    z-index:30;  
  
    display:flex;  
    flex-direction:column;  
    align-items:flex-end;  
    gap:3px;  
  
    font-family:monospace;  
    pointer-events:none;  
}  
  
.time{  
    color:rgba(150,255,255,.6);  
    font-size:11px;  
    letter-spacing:2px;  
  
    text-shadow:  
        0 0 8px  
        rgba(0,255,255,.2);  
}  
  
.date{  
    color:rgba(150,255,255,.38);  
    font-size:8px;  
    letter-spacing:1px;  
}  
  
#chat{  
    position:fixed;  
    left:50%;  
    bottom:92px;  
    transform:translateX(-50%);  
    z-index:40;  
  
    width:min(620px,88%);  
    text-align:center;  
    pointer-events:none;  
}  
  
.msg{  
    display:inline-block;  
    max-width:100%;  
  
    padding:10px 18px;  
  
    border:  
        1px solid  
        rgba(0,255,255,.22);  
  
    border-radius:24px;  
  
    background:  
        rgba(4,20,23,.4);  
  
    backdrop-filter:blur(14px);  
    -webkit-backdrop-filter:blur(14px);  
  
    color:  
        rgba(235,255,255,.9);  
  
    font-size:12px;  
    line-height:1.45;  
  
    white-space:pre-wrap;  
}  
  
.command-wrapper{  
    position:fixed;  
    left:50%;  
    bottom:23px;  
    transform:translateX(-50%);  
    z-index:50;  
  
    width:min(650px,90%);  
  
    display:flex;  
    align-items:center;  
  
    padding:6px 7px 6px 20px;  
  
    border:  
        1px solid  
        rgba(100,255,255,.28);  
  
    border-radius:40px;  
  
    background:  
        rgba(5,20,23,.38);  
  
    backdrop-filter:blur(20px);  
    -webkit-backdrop-filter:blur(20px);  
  
    box-shadow:  
        0 0 30px  
        rgba(0,255,255,.05);  
}  
  
.command-wrapper:focus-within{  
    border-color:  
        rgba(0,255,255,.6);  
  
    box-shadow:  
        0 0 25px  
        rgba(0,255,255,.12);  
}  
  
#textInput{  
    flex:1;  
    min-width:0;  
  
    border:none;  
    outline:none;  
  
    background:transparent;  
    color:white;  
  
    font-family:Arial,sans-serif;  
    font-size:14px;  
  
    padding:12px 5px;  
}  
  
#textInput::placeholder{  
    color:rgba(255,255,255,.3);  
}  
  
#micBtn{  
    width:34px;  
    height:34px;  
    margin-right:7px;  
  
    border:none;  
    background:transparent;  
  
    color:rgba(210,255,255,.65);  
  
    cursor:pointer;  
  
    display:flex;  
    align-items:center;  
    justify-content:center;  
}  
  
.mic-icon{  
    width:8px;  
    height:14px;  
  
    border:  
        1.3px solid  
        currentColor;  
  
    border-radius:6px;  
    position:relative;  
}  
  
.mic-icon::after{  
    content:"";  
  
    position:absolute;  
    left:50%;  
    bottom:-6px;  
  
    width:12px;  
    height:7px;  
  
    transform:translateX(-50%);  
  
    border:  
        1.3px solid  
        currentColor;  
  
    border-top:none;  
  
    border-radius:  
        0 0 8px 8px;  
}  
  
#micBtn:hover{  
    color:#00ffff;  
}  
  
#micBtn.active{  
    color:#8fffff;  
}  
  
#sendBtn{  
    height:39px;  
    padding:0 17px;  
  
    border:  
        1px solid  
        rgba(0,255,255,.28);  
  
    border-radius:22px;  
  
    background:  
        rgba(0,255,255,.05);  
  
    color:  
        rgba(220,255,255,.78);  
  
    font-size:10px;  
    letter-spacing:2px;  
  
    cursor:pointer;  
}  
  
#sendBtn:hover{  
    color:white;  
    border-color:#00ffff;  
  
    background:  
        rgba(0,255,255,.1);  
}  
  
  
/* =====================================================  
   MAPPA TATTICA  
===================================================== */  
  
#tacticalMap{  
    position:fixed;  
    inset:0;  
  
    z-index:20;  
  
    display:none;  
  
    background:  
        radial-gradient(  
            ellipse at center,  
            #071719 0%,  
            #020708 45%,  
            #000000 100%  
        );  
  
    overflow:hidden;  
}  
  
#tacticalMap.active{  
    display:block;  
  
    animation:  
        mapIn .5s ease;  
}  
  
@keyframes mapIn{  
  
    from{  
        opacity:0;  
        transform:scale(1.03);  
    }  
  
    to{  
        opacity:1;  
        transform:scale(1);  
    }  
}  
  
  
/* MAPPA 3D */  
  
#map{  
    position:absolute;  
    inset:0;  
  
    width:100%;  
    height:100%;  
  
    background:#020506;  
  
    /*  
       Effetto profondità:  
       la mappa viene leggermente inclinata  
       e resa più cinematografica.  
    */  
    transform:  
        perspective(1200px)  
        rotateX(2deg)  
        scale(1.015);  
  
    transform-origin:center center;  
  
    filter:  
        brightness(.42)  
        contrast(1.25)  
        saturate(.55);  
  
    box-shadow:  
        inset 0 0 100px rgba(0,0,0,.9),  
        inset 0 0 35px rgba(0,255,255,.08);  
}  
  
  
/* Oscuramento cinematico */  
  
#tacticalMap::after{  
    content:"";  
  
    position:absolute;  
    inset:0;  
  
    z-index:480;  
  
    pointer-events:none;  
  
    background:  
        radial-gradient(  
            ellipse at center,  
            transparent 25%,  
            rgba(0,0,0,.15) 55%,  
            rgba(0,0,0,.72) 100%  
        );  
  
    box-shadow:  
        inset 0 0 120px  
        rgba(0,0,0,.75);  
}  
  
  
/* Griglia HUD */  
  
.map-filter{  
    position:absolute;  
    inset:0;  
  
    z-index:500;  
    pointer-events:none;  
  
    background:  
  
        linear-gradient(  
            rgba(0,255,255,.035) 1px,  
            transparent 1px  
        ),  
  
        linear-gradient(  
            90deg,  
            rgba(0,255,255,.035) 1px,  
            transparent 1px  
        );  
  
    background-size:45px 45px;  
  
    mix-blend-mode:screen;  
  
    opacity:.75;  
}  
  
  
/* Linea di scansione */  
  
.scan-line{  
    position:absolute;  
  
    left:0;  
    right:0;  
    top:-10%;  
  
    height:2px;  
  
    z-index:510;  
    pointer-events:none;  
  
    background:  
        linear-gradient(  
            90deg,  
            transparent,  
            rgba(0,255,255,.5),  
            transparent  
        );  
  
    box-shadow:  
        0 0 15px  
        rgba(0,255,255,.4);  
  
    animation:  
        scan 5s linear infinite;  
  
    opacity:.35;  
}  
  
@keyframes scan{  
  
    0%{  
        top:-5%;  
    }  
  
    100%{  
        top:105%;  
    }  
}  
  
  
/* Angoli HUD */  
  
.map-corner{  
    position:absolute;  
  
    z-index:520;  
  
    width:45px;  
    height:45px;  
  
    pointer-events:none;  
}  
  
.map-corner::before,  
.map-corner::after{  
    content:"";  
  
    position:absolute;  
  
    background:  
        rgba(0,255,255,.55);  
}  
  
.map-corner::before{  
    width:45px;  
    height:1px;  
}  
  
.map-corner::after{  
    width:1px;  
    height:45px;  
}  
  
.corner-tl{  
    top:18px;  
    left:18px;  
}  
  
.corner-tr{  
    top:18px;  
    right:18px;  
  
    transform:rotate(90deg);  
}  
  
.corner-bl{  
    bottom:18px;  
    left:18px;  
  
    transform:rotate(-90deg);  
}  
  
.corner-br{  
    bottom:18px;  
    right:18px;  
  
    transform:rotate(180deg);  
}  
  
  
/* Header */  
  
.map-header{  
    position:absolute;  
  
    top:25px;  
    left:50%;  
  
    transform:  
        translateX(-50%);  
  
    z-index:530;  
  
    color:  
        rgba(170,255,255,.7);  
  
    font-family:monospace;  
  
    font-size:10px;  
  
    letter-spacing:4px;  
  
    pointer-events:none;  
  
    text-shadow:  
        0 0 10px  
        rgba(0,255,255,.4);  
}  
  
  
/* =====================================================  
   CORE TATTICO 3D  
===================================================== */  
  
.tactical-core{  
    position:absolute;  
  
    right:35px;  
    bottom:105px;  
  
    z-index:540;  
  
    width:105px;  
    height:105px;  
  
    border-radius:50%;  
  
    display:flex;  
    align-items:center;  
    justify-content:center;  
  
    pointer-events:none;  
  
    background:  
  
        radial-gradient(  
            circle,  
            rgba(0,255,255,.18),  
            rgba(0,30,35,.72) 55%,  
            rgba(0,0,0,.92) 100%  
        );  
  
    border:  
        1px solid  
        rgba(0,255,255,.65);  
  
    box-shadow:  
  
        0 0 15px  
        rgba(0,255,255,.25),  
  
        0 0 45px  
        rgba(0,255,255,.08),  
  
        inset 0 0 20px  
        rgba(0,255,255,.12);  
}  
  
.tactical-core::before{  
    content:"";  
  
    position:absolute;  
    inset:8px;  
  
    border-radius:50%;  
  
    border:  
        1px solid  
        rgba(0,255,255,.45);  
  
    animation:  
        coreRotate 7s linear infinite;  
}  
  
.tactical-core::after{  
    content:"";  
  
    position:absolute;  
    inset:18px;  
  
    border-radius:50%;  
  
    border:  
        1px dashed  
        rgba(0,255,255,.3);  
  
    animation:  
        coreRotateReverse 5s linear infinite;  
}  
  
@keyframes coreRotate{  
  
    from{  
        transform:rotate(0deg);  
    }  
  
    to{  
        transform:rotate(360deg);  
    }  
}  
  
@keyframes coreRotateReverse{  
  
    from{  
        transform:rotate(360deg);  
    }  
  
    to{  
        transform:rotate(0deg);  
    }  
}  
  
.core-text{  
    position:relative;  
  
    z-index:2;  
  
    color:  
        rgba(220,255,255,.85);  
  
    font-family:monospace;  
  
    font-size:11px;  
  
    letter-spacing:2px;  
  
    text-shadow:  
        0 0 8px  
        rgba(0,255,255,.5);  
}  
  
  
/* Chiudi */  
  
#closeMap{  
    position:absolute;  
  
    top:22px;  
    left:25px;  
  
    z-index:550;  
  
    width:34px;  
    height:34px;  
  
    border:  
        1px solid  
        rgba(0,255,255,.35);  
  
    border-radius:50%;  
  
    background:  
        rgba(0,20,23,.75);  
  
    color:  
        rgba(200,255,255,.8);  
  
    cursor:pointer;  
  
    font-size:17px;  
  
    display:flex;  
    align-items:center;  
    justify-content:center;  
  
    backdrop-filter:blur(10px);  
}  
  
#closeMap:hover{  
    color:white;  
  
    border-color:#00ffff;  
  
    box-shadow:  
        0 0 15px  
        rgba(0,255,255,.25);  
}  
  
  
/* Marker */  
  
.jarvis-marker{  
    width:18px;  
    height:18px;  
  
    border-radius:50%;  
  
    border:  
        2px solid  
        #00ffff;  
  
    background:  
        rgba(0,255,255,.15);  
  
    box-shadow:  
        0 0 15px  
        rgba(0,255,255,.8);  
}  
  
.jarvis-marker::after{  
    content:"";  
  
    position:absolute;  
  
    width:5px;  
    height:5px;  
  
    margin:4px;  
  
    border-radius:50%;  
  
    background:#bfffff;  
  
    box-shadow:  
        0 0 8px #00ffff;  
}  
  
  
/* Leaflet */  
  
.leaflet-control-zoom{  
    border:  
        1px solid  
        rgba(0,255,255,.3)!important;  
}  
  
.leaflet-control-zoom a{  
    background:  
        rgba(2,15,18,.85)!important;  
  
    color:  
        rgba(180,255,255,.75)!important;  
  
    border-bottom:  
        1px solid  
        rgba(0,255,255,.2)!important;  
}  
  
.leaflet-control-zoom a:hover{  
    background:  
        rgba(0,255,255,.12)!important;  
  
    color:white!important;  
}  
  
.leaflet-control-attribution{  
    background:  
        rgba(0,8,10,.75)!important;  
  
    color:  
        rgba(180,255,255,.35)!important;  
  
    font-size:8px!important;  
}  
  
.leaflet-control-attribution a{  
    color:  
        rgba(150,240,255,.45)!important;  
}  
  
  
/* =====================================================  
   MOBILE  
===================================================== */  
  
@media(max-width:600px){  
  
    .jarvis-title{  
  
        /* leggermente più in basso anche su telefono */  
        top:2.2%;  
  
        font-size:23px;  
        letter-spacing:5px;  
    }  
  
    .datetime{  
        top:12px;  
        right:13px;  
    }  
  
    .time{  
        font-size:10px;  
    }  
  
    .date{

    }  
  
    .command-wrapper{

    #textInput{

    }

        bottom:80px;  
    }

        right:18px;

    .map-header{  
        top:25px;  
  
        font-size:8px;  
  
        letter-spacing:3px;  
    }  
  
}

</script>  <script type="module">  
  
import * as THREE from "three";  
  
  
/* =====================================================  
   CONFIGURAZIONE  
===================================================== */  
  
const API =  
    "https://iao-ai-v3.oceano-masoud.workers.dev/";  
  
const MEMORY_KEY =  
    "jarvis_memory_v1";  
  
const MAX_MEMORY =  
    30;  
  
  
/* =====================================================  
   ELEMENTI  
===================================================== */  
  
const container =  
    document.getElementById(  
        "webgl-container"  
    );  
  
const chat =  
    document.getElementById(  
        "chat"  
    );  
  
const textInput =  
    document.getElementById(  
        "textInput"  
    );  
  
const sendBtn =  
    document.getElementById(  
        "sendBtn"  
    );  
  
const micBtn =  
    document.getElementById(  
        "micBtn"  
    );  
  
const clock =  
    document.getElementById(  
        "clock"  
    );  
  
const date =  
    document.getElementById(  
        "date"  
    );  
  
const tacticalMap =  
    document.getElementById(  
        "tacticalMap"  
    );  
  
const closeMap =  
    document.getElementById(  
        "closeMap"  
    );  
  
  
/* =====================================================  
   MEMORIA  
===================================================== */  
  
let memory = [];  
  
try{  
  
    const saved =  
        localStorage.getItem(  
            MEMORY_KEY  
        );  
  
    if(saved){  
  
        const parsed =  
            JSON.parse(saved);  
  
        if(  
            Array.isArray(parsed)  
        ){  
  
            memory =  
                parsed.slice(  
                    -MAX_MEMORY  
                );  
        }  
    }  
  
}catch(error){  
  
    console.warn(  
        "Memoria:",  
        error  
    );  
}  
  
  
function saveMemory(){  
  
    try{  
  
        localStorage.setItem(  
            MEMORY_KEY,  
            JSON.stringify(  
                memory.slice(  
                    -MAX_MEMORY  
                )  
            )  
        );  
  
    }catch(error){  
  
        console.warn(  
            "Salvataggio memoria:",  
            error  
        );  
    }  
}  
  
  
function addMemory(  
    role,  
    content  
){  
  
    memory.push({  
        role,  
        content  
    });  
  
    memory =  
        memory.slice(  
            -MAX_MEMORY  
        );  
  
    saveMemory();  
}  
  
  
/* =====================================================  
   ORA  
===================================================== */  
  
const months = [  
  
    "GEN",  
    "FEB",  
    "MAR",  
    "APR",  
    "MAG",  
    "GIU",  
    "LUG",  
    "AGO",  
    "SET",  
    "OTT",  
    "NOV",  
    "DIC"  
  
];  
  
  
function updateClock(){  
  
    const now =  
        new Date();  
  
    const h =  
        String(  
            now.getHours()  
        ).padStart(2,"0");  
  
    const m =  
        String(  
            now.getMinutes()  
        ).padStart(2,"0");  
  
    const s =  
        String(  
            now.getSeconds()  
        ).padStart(2,"0");  
  
    clock.textContent =  
        `${h}:${m}:${s}`;  
  
    const d =  
        String(  
            now.getDate()  
        ).padStart(2,"0");  
  
    const month =  
        months[  
            now.getMonth()  
        ];  
  
    const year =  
        now.getFullYear();  
  
    date.textContent =  
        `${d} ${month} ${year}`;  
}  
  
  
updateClock();  
  
setInterval(  
    updateClock,  
    1000  
);  
  
  
/* =====================================================  
   THREE.JS  
===================================================== */

/* =====================================================  
   GLOW  
===================================================== */  
  
function createGlow(){  
  
    const canvas =  
        document.createElement(  
            "canvas"  
        );  
  
    canvas.width =  
        64;  
  
    canvas.height =  
        64;  
  
    const ctx =  
        canvas.getContext(  
            "2d"  
        );  
  
    const gradient =  
        ctx.createRadialGradient(  
            32,  
            32,  
            0,  
            32,  
            32,  
            32  
        );  
  
    gradient.addColorStop(  
        0,  
        "rgba(255,255,255,1)"  
    );  
  
    gradient.addColorStop(  
        .2,  
        "rgba(220,255,255,1)"  
    );  
  
    gradient.addColorStop(  
        .4,  
        "rgba(0,255,255,.9)"  
    );  
  
    gradient.addColorStop(  
        .7,  
        "rgba(0,150,190,.25)"  
    );  
  
    gradient.addColorStop(  
        1,  
        "rgba(0,0,0,0)"  
    );  
  
    ctx.fillStyle =  
        gradient;  
  
    ctx.fillRect(  
        0,  
        0,  
        64,  
        64  
    );  
  
    return new THREE.CanvasTexture(  
        canvas  
    );  
}  
  
  
/* =====================================================  
   PARTICELLE  
===================================================== */  
  
const COUNT =  
    3000;  
  
const geometry =  
    new THREE.BufferGeometry();  
  
const positions =  
    new Float32Array(  
        COUNT * 3  
    );  
  
const radii =  
    new Float32Array(  
        COUNT  
    );  
  
const angles =  
    new Float32Array(  
        COUNT * 2  
    );  
  
const seeds =  
    new Float32Array(  
        COUNT  
    );  
  
  
for(  
    let i=0;  
    i<COUNT;  
    i++  
){  
  
    const r =  
        1.10 +  
        Math.random()*.70;  
  
    const theta =  
        Math.random() *  
        Math.PI *  
        2;  
  
    const phi =  
        Math.acos(  
            2*Math.random()-1  
        );  
  
    radii[i] =  
        r;  
  
    angles[i*2] =  
        theta;  
  
    angles[i*2+1] =  
        phi;  
  
    seeds[i] =  
        Math.random()*100;  
  
    positions[i*3] =  
        r *  
        Math.sin(phi) *  
        Math.cos(theta);  
  
    positions[i*3+1] =  
        r *  
        Math.sin(phi) *  
        Math.sin(theta);  
  
    positions[i*3+2] =  
        r *  
        Math.cos(phi);  
}  
  
  
geometry.setAttribute(  
    "position",  
    new THREE.BufferAttribute(  
        positions,  
        3  
    )  
);  
  
  
const material =  
    new THREE.PointsMaterial({  
  
        color:  
            new THREE.Color(  
                0x00cfe8  
            ),  
  
        size:  
            .034,  
  
        map:  
            createGlow(),  
  
        transparent:true,  
  
        opacity:.82,  
  
        depthWrite:false,  
  
        blending:  
            THREE.AdditiveBlending  
  
    });  
  
  
const particles =  
    new THREE.Points(  
        geometry,  
        material  
    );  
  
scene.add(  
    particles  
);  
  
  
/* =====================================================  
   ENERGIA  
===================================================== */  
  
let targetEnergy =  
    .15;  
  
let energy =  
    .15;  
  
const normalColor =  
    new THREE.Color(  
        0x00cfe8  
    );  
  
const activeColor =  
    new THREE.Color(  
        0x8fffff  
    );  
  
const currentColor =  
    normalColor.clone();  
  
  
function setState(  
    state  
){  
  
    if(  
        state === "thinking"  
    ){  
  
        targetEnergy =  
            1;  
  
    }  
  
    else if(  
        state === "speaking"  
    ){  
  
        targetEnergy =  
            .8;  
  
    }  
  
    else if(  
        state === "listening"  
    ){  
  
        targetEnergy =  
            .55;  
  
    }  
  
    else{  
  
        targetEnergy =  
            .15;  
  
    }  
}  
  
  
/* =====================================================  
   ANIMAZIONE  
===================================================== */  
  
function animate(){  
  
    requestAnimationFrame(  
        animate  
    );  
  
    const time =  
        performance.now()*.001;  
  
    energy +=  
        (  
            targetEnergy -  
            energy  
        )*.045;  
  
    currentColor.lerp(  
        activeColor,  
        energy*.04  
    );  
  
    if(  
        energy < .3  
    ){  
  
        currentColor.lerp(  
            normalColor,  
            .03  
        );  
    }  
  
    material.color =  
        currentColor;  
  
    material.size =  
        .032 +  
        energy*.008;  
  
    const pos =  
        geometry  
            .attributes  
            .position  
            .array;  
  
  
    for(  
        let i=0;  
        i<COUNT;  
        i++  
    ){  
  
        const index =  
            i*3;  
  
        const r =  
            radii[i];  
  
        const theta =  
            angles[i*2];  
  
        const phi =  
            angles[i*2+1];  
  
        const seed =  
            seeds[i];  
  
        const pulse =  
            Math.sin(  
                time*2 +  
                seed  
            )*.035;  
  
        const strangeShape =  
            Math.sin(  
                theta*6 +  
                time*2 +  
                seed  
            )*.18*energy;  
  
        const wave =  
            Math.cos(  
                phi*7 -  
                time*1.8 +  
                seed  
            )*.12*energy;  
  
        const rr =  
            r +  
            pulse +  
            strangeShape +  
            wave;  
  
        let x =  
            rr *  
            Math.sin(phi) *  
            Math.cos(theta);  
  
        let y =  
            rr *  
            Math.sin(phi) *  
            Math.sin(theta);  
  
        let z =  
            rr *  
            Math.cos(phi);  
  
        x +=  
            Math.sin(  
                time*2.4 +  
                phi*8 +  
                seed  
            )*.08*energy;  
  
        y +=  
            Math.cos(  
                time*2.1 +  
                theta*9 +  
                seed  
            )*.08*energy;  
  
        z +=  
            Math.sin(  
                time*2.7 +  
                (theta+phi)*7  
            )*.10*energy;  
  
        pos[index] =  
            x;  
  
        pos[index+1] =  
            y;  
  
        pos[index+2] =  
            z;  
    }  
  
  
    geometry  
        .attributes  
        .position  
        .needsUpdate =  
            true;  
  
  
    particles.rotation.y +=  
        .0005 +  
        energy*.0008;  
  
    particles.rotation.x =  
        Math.sin(  
            time*.25  
        )*.04;  
  
    particles.rotation.z =  
        Math.cos(  
            time*.18  
        )*.025;  
  
  
    renderer.render(  
        scene,  
        camera  
    );  
}  
  
  
animate();

async function searchLocation(  
    place  
){  
  
    try{  
  
        openTacticalMap();  
  
        addMsg(  
            "Ricerca posizione: " +  
            place  
        );  
  
        const url =  
            "https://nominatim.openstreetmap.org/search" +  
            "?format=json" +  
            "&limit=1" +  
            "&q=" +  
            encodeURIComponent(  
                place  
            );  
  
        const response =  
            await fetch(  
                url,  
                {  
                    headers:{  
                        "Accept":  
                            "application/json"  
                    }  
                }  
            );  
  
        if(  
            !response.ok  
        ){  
  
            throw new Error(  
                "Ricerca posizione fallita"  
            );  
        }  
  
        const results =  
            await response.json();  
  
        if(  
            !results.length  
        ){  
  
            addMsg(  
                "Non riesco a trovare " +  
                place +  
                "."  
            );  
  
            return;  
        }  
  
        const result =  
            results[0];  
  
        const lat =  
            parseFloat(  
                result.lat  
            );  
  
        const lon =  
            parseFloat(  
                result.lon  
            );  
  
        map.flyTo(  
            [lat,lon],  
            12,  
            {  
                duration:1.8  
            }  
        );  
  
        createJarvisMarker(  
            lat,  
            lon,  
            place  
        );  
  
        addMsg(  
            "Posizione acquisita: " +  
            place  
        );  
  
    }catch(error){  
  
        console.error(  
            "MAP ERROR:",  
            error  
        );  
  
        addMsg(  
            "Impossibile localizzare " +  
            place +  
            "."  
        );  
    }  
}  
  
  
function handleMapCommand(  
    text  
){  
  
    const normalized =  
        text  
            .toLowerCase()  
            .trim();  
  
  
    if(  
  
        normalized.includes(  
            "apri la mappa"  
        ) ||  
  
        normalized.includes(  
            "apri mappa"  
        ) ||  
  
        normalized.includes(  
            "mappa tattica"  
        ) ||  
  
        normalized.includes(  
            "modalità tattica"  
        ) ||  
  
        normalized.includes(  
            "modalita tattica"  
        ) ||  
  
        normalized.includes(  
            "attiva la mappa"  
        )  
  
    ){  
  
        openTacticalMap();  
  
        addMsg(  
            "Mappa tattica attivata."  
        );  
  
        return true;  
    }  
  
  
    if(  
  
        normalized.includes(  
            "chiudi la mappa"  
        ) ||  
  
        normalized.includes(  
            "chiudi mappa"  
        ) ||  
  
        normalized.includes(  
            "esci dalla mappa"  
        ) ||  
  
        normalized.includes(  
            "torna alla modalità normale"  
        ) ||  
  
        normalized.includes(  
            "torna alla modalita normale"  
        )  
  
    ){  
  
        closeTacticalMap();  
  
        addMsg(  
            "Modalità tattica disattivata."  
        );  
  
        return true;  
    }  
  
  
    const patterns = [  
  
        "mostrami ",  
        "mostra ",  
        "vai a ",  
        "portami a ",  
        "localizza ",  
        "cerca ",  
        "visualizza "  
  
    ];  
  
  
    for(  
        const pattern of patterns  
    ){  
  
        if(  
            normalized.startsWith(  
                pattern  
            )  
        ){  
  
            const place =  
                text  
                    .trim()  
                    .substring(  
                        pattern.length  
                    )  
                    .trim();  
  
            if(  
                place.length > 1  
            ){  
  
                searchLocation(  
                    place  
                );  
  
                return true;  
            }  
        }  
    }  
  
  
    return false;  
}

                "it-IT",  
                {  
                    hour:"2-digit",

                }  
            ),  
  
        currentDate:  
            now.toLocaleDateString(  
                "it-IT",  
                {

                .resolvedOptions()  
                .timeZone  
  
    };  
}  
  
  
/* =====================================================  
   PROCESS AI — STREAMING  
===================================================== */  
  
async function processAi(  
    text  
){  
  
    if(  
        handleMapCommand(  
            text  
        )  
    ){  
  
        return;  
    }  
  
    setState(  
        "thinking"  
    );  
  
    try{  
  
        const temporal =  
            getTimeData();  
  
        addMemory(  
            "user",  
            text  
        );  
  
  
        const response =  
            await fetch(  
                API,  
                {  
  
                    method:"POST",  
  
                    headers:{  
                        "Content-Type":  
                            "application/json"  
                    },  
  
                    body:  
                        JSON.stringify({  
  
                            message:  
                                text,  
  
                            memory:  
                                memory.slice(-4),  
  
                            currentTime:  
                                temporal.currentTime,  
  
                            currentDate:  
                                temporal.currentDate,  
  
                            dayOfWeek:  
                                temporal.dayOfWeek,  
  
                            timezone:  
                                temporal.timezone  
  
                        })  
  
                }  
            );  
  
  
        if(  
            !response.ok  
        ){  
  
            const errorText =  
                await response.text();  
  
            console.error(  
                "Worker:",  
                errorText  
            );  
  
            throw new Error(  
                "HTTP " +  
                response.status  
            );  
        }  
  
  
        if(  
            !response.body  
        ){  
  
            throw new Error(  
                "Streaming non disponibile"  
            );  
        }  
  
  
        chat.innerHTML =  
            "";  
  
        const element =  
            document.createElement(  
                "div"  
            );  
  
        element.className =  
            "msg";  
  
        chat.appendChild(  
            element  
        );  
  
  
        const reader =  
            response.body.getReader();  
  
        const decoder =  
            new TextDecoder();  
  
        let buffer =  
            "";  
  
        let reply =  
            "";  
  
  
        while(true){  
  
            const {  
                value,  
                done  
            } =  
                await reader.read();  
  
            if(done){  
                break;  
            }  
  
  
            buffer +=  
                decoder.decode(  
                    value,  
                    {  
                        stream:true  
                    }  
                );  
  
  
            const lines =  
                buffer.split(  
                    "\n"  
                );  
  
            buffer =  
                lines.pop() || "";  
  
  
            for(  
                const line of lines  
            ){  
  
                const trimmed =  
                    line.trim();  
  
                if(  
                    !trimmed  
                ){  
                    continue;  
                }  
  
                if(  
                    !trimmed.startsWith(  
                        "data:"  
                    )  
                ){  
                    continue;  
                }  
  
  
                const raw =  
                    trimmed  
                        .substring(  
                            5  
                        )  
                        .trim();  
  
  
                if(  
                    !raw ||  
                    raw === "[DONE]"  
                ){  
                    continue;  
                }  
  
  
                try{  
  
                    const json =  
                        JSON.parse(  
                            raw  
                        );  
  
                    let piece =  
                        "";  
  
  
                    if(  
                        typeof json.response ===  
                        "string"  
                    ){  
  
                        piece =  
                            json.response;  
  
                    }  
  
                    else if(  
                        json.choices &&  
                        json.choices[0]  
                    ){  
  
                        const choice =  
                            json.choices[0];  
  
  
                        if(  
                            choice.delta &&  
                            typeof choice.delta.content ===  
                            "string"  
                        ){  
  
                            piece =  
                                choice.delta.content;  
  
                        }  
  
                        else if(  
                            choice.message &&  
                            typeof choice.message.content ===  
                            "string"  
                        ){  
  
                            piece =  
                                choice.message.content;  
  
                        }  
  
                        else if(  
                            typeof choice.text ===  
                            "string"  
                        ){  
  
                            piece =  
                                choice.text;  
  
                        }  
  
                    }  
  
  
                    if(piece){  
  
                        reply +=  
                            piece;  
  
                        element.textContent =  
                            reply;  
  
                        setState(  
                            "speaking"  
                        );  
                    }  
  
  
                }catch(error){  
  
                    console.warn(  
                        "Stream JSON:",  
                        raw  
                    );  
  
                }  
  
            }  
  
        }  
  
  
        reply =  
            reply.trim();  
  
  
        if(  
            !reply  
        ){  
  
            throw new Error(  
                "Risposta AI vuota"  
            );  
        }  
  
  
        addMemory(  
            "assistant",  
            reply  
        );  
  
  
        speak(  
            reply  
        );  
  
  
    }catch(error){  
  
        console.error(  
            "JARVIS ERROR:",  
            error  
        );  
  
        addMsg(  
            "ERRORE: " +  
            error.message  
        );  
  
        setState(  
            "idle"  
        );  
    }  
}

/* =====================================================  
   VOCE  
===================================================== */  
  
function speak(  
    text  
){  
  
    if(  
        !window.speechSynthesis  
    ){  
  
        setState(  
            "idle"  
        );  
  
        return;  
    }  
  
  
    speechSynthesis.cancel();  
  
  
    const utterance =  
        new SpeechSynthesisUtterance(  
            text  
        );  
  
  
    utterance.lang =  
        "it-IT";  
  
    utterance.rate =  
        .95;  
  
    utterance.pitch =  
        .85;  
  
  
    utterance.onstart =  
        () => {  
  
            setState(  
                "speaking"  
            );  
  
        };  
  
  
    utterance.onend =  
        () => {  
  
            setState(  
                "idle"  
            );  
  
        };  
  
  
    utterance.onerror =  
        () => {  
  
            setState(  
                "idle"  
            );  
  
        };  
  
  
    speechSynthesis.speak(  
        utterance  
    );  
}  
  
  
/* =====================================================  
   MICROFONO  
===================================================== */  
  
const Recognition =  
    window.SpeechRecognition ||  
    window.webkitSpeechRecognition;  
  
  
let recognition =  
    null;  
  
let listening =  
    false;  
  
  
if(  
    Recognition  
){  
  
    recognition =  
        new Recognition();  
  
  
    recognition.lang =  
        "it-IT";  
  
  
    recognition.continuous =  
        false;  
  
  
    recognition.interimResults =  
        false;  
  
  
    recognition.onstart =  
        () => {  
  
            listening =  
                true;  
  
            micBtn.classList.add(  
                "active"  
            );  
  
            setState(  
                "listening"  
            );  
  
        };  
  
  
    recognition.onresult =  
        event => {  
  
            const text =  
                event  
                    .results[0][0]  
                    .transcript  
                    .trim();  
  
  
            if(text){  
  
                textInput.value =  
                    text;  
  
                sendMessage();  
  
            }  
  
        };  
  
  
    recognition.onerror =  
        error => {  
  
            console.error(  
                "Microfono:",  
                error  
            );  
  
            listening =  
                false;  
  
            micBtn.classList.remove(  
                "active"  
            );  
  
            setState(  
                "idle"  
            );  
  
        };  
  
  
    recognition.onend =  
        () => {  
  
            listening =  
                false;  
  
            micBtn.classList.remove(  
                "active"  
            );  
  
        };  
  
  
    micBtn.addEventListener(  
        "click",  
        () => {  
  
            if(listening){  
  
                recognition.stop();  
  
            }else{  
  
                try{  
  
                    recognition.start();  
  
                }catch(error){  
  
                    console.warn(  
                        error  
                    );  
  
                }  
  
            }  
  
        }  
    );  
  
}else{  
  
    micBtn.style.opacity =  
        ".3";  
  
}  
  
  
/* =====================================================  
   RESIZE  
===================================================== */  
  
window.addEventListener(  
    "resize",  
    () => {  
  
        camera.aspect =  
            window.innerWidth /  
            window.innerHeight;  
  
        camera.updateProjectionMatrix();  
  
        renderer.setSize(  
            window.innerWidth,  
            window.innerHeight  
        );  
  
  
        if(map){  
  
            map.invalidateSize();  
  
        }  
  
    }  
);  
  
  
/* =====================================================  
   CANCELLA MEMORIA  
===================================================== */  
  
window.clearJarvisMemory =  
    function(){  
  
        memory =  
            [];  
  
        localStorage.removeItem(  
            MEMORY_KEY  
        );  
  
        console.log(  
            "Memoria JARVIS cancellata."  
        );  
  
    };  
  
  
/* =====================================================  
   AVVIO  
===================================================== */  
  
setState(  
    "idle"  
);  
  
</script>  </body>  
</html>
