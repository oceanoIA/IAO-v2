<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#010405;

    font-family:Arial,sans-serif;
}

body{

    background:
        radial-gradient(
            circle at center,
            #071719 0%,
            #020708 45%,
            #000000 100%
        );
}


/* =====================================================
   THREE.JS
===================================================== */

#webgl-container{

    position:fixed;

    inset:0;

    z-index:1;
}


.vignette{

    position:fixed;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.18) 65%,
            rgba(0,0,0,.75) 100%
        );
}


/* =====================================================
   TITOLO
===================================================== */

.jarvis-title{

    position:fixed;

    left:50%;

    top:2.5%;

    transform:
        translateX(-50%);

    z-index:8;

    pointer-events:none;

    font-size:
        clamp(22px,3.5vw,38px);

    font-weight:300;

    letter-spacing:
        clamp(5px,1vw,10px);

    color:
        rgba(255,255,255,.86);

    text-shadow:

        0 0 8px
        rgba(255,255,255,.12),

        0 0 20px
        rgba(0,255,255,.10);

    white-space:nowrap;
}


/* =====================================================
   DATA E ORA
===================================================== */

.datetime{

    position:fixed;

    top:22px;

    right:25px;

    z-index:10;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:3px;

    font-family:monospace;

    color:
        rgba(150,255,255,.58);

    text-shadow:
        0 0 8px
        rgba(0,255,255,.18);

    pointer-events:none;

    user-select:none;
}


.time{

    font-size:12px;

    letter-spacing:2px;
}


.date{

    font-size:9px;

    letter-spacing:1.5px;

    color:
        rgba(150,255,255,.38);
}


/* =====================================================
   CHAT
===================================================== */

#chat{

    position:fixed;

    left:50%;

    bottom:92px;

    transform:
        translateX(-50%);

    z-index:15;

    width:min(620px,86%);

    text-align:center;

    pointer-events:none;
}


.msg{

    display:inline-block;

    max-width:100%;

    padding:10px 18px;

    border-radius:24px;

    border:
        1px solid
        rgba(0,255,255,.22);

    background:
        rgba(4,20,23,.38);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    color:
        rgba(235,255,255,.88);

    font-size:12px;

    line-height:1.45;

    animation:
        messageIn .3s ease;
}


@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(8px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   BARRA COMANDO
===================================================== */

.command-wrapper{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
        translateX(-50%);

    z-index:20;

    width:min(650px,90%);

    display:flex;

    align-items:center;

    padding:
        6px 7px 6px 21px;

    border-radius:40px;

    background:
        rgba(5,20,23,.35);

    border:
        1px solid
        rgba(100,255,255,.28);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 0 30px
        rgba(0,255,255,.055),

        inset 0 0 20px
        rgba(0,255,255,.025);

    transition:.3s ease;
}


.command-wrapper:focus-within{

    border-color:
        rgba(0,255,255,.65);

    box-shadow:

        0 0 25px
        rgba(0,255,255,.13),

        inset 0 0 25px
        rgba(0,255,255,.04);
}


/* =====================================================
   INPUT
===================================================== */

#textInput{

    flex:1;

    min-width:0;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:
        12px 5px;
}


#textInput::placeholder{

    color:
        rgba(255,255,255,.30);
}


/* =====================================================
   MICROFONO
===================================================== */

#micBtn{

    flex-shrink:0;

    width:34px;

    height:34px;

    margin-right:7px;

    border:none;

    background:transparent;

    color:
        rgba(210,255,255,.65);

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:

        color .25s ease,

        transform .25s ease;
}


.mic-icon{

    position:relative;

    width:8px;

    height:14px;

    border:
        1.3px solid
        currentColor;

    border-radius:6px;
}


.mic-icon::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-6px;

    width:12px;

    height:7px;

    transform:
        translateX(-50%);

    border:
        1.3px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 8px 8px;
}


#micBtn:hover{

    color:#00ffff;

    transform:
        scale(1.08);
}


#micBtn.active{

    color:#8fffff;

    transform:
        scale(1.12);

}


/* =====================================================
   INVIA
===================================================== */

#sendBtn{

    flex-shrink:0;

    height:39px;

    padding:
        0 17px;

    border-radius:22px;

    border:
        1px solid
        rgba(0,255,255,.28);

    background:
        rgba(0,255,255,.055);

    color:
        rgba(220,255,255,.78);

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.25s ease;
}


#sendBtn:hover{

    color:white;

    border-color:#00ffff;

    background:
        rgba(0,255,255,.11);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.15);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .jarvis-title{

        top:2%;

        font-size:25px;

        letter-spacing:5px;
    }


    .datetime{

        top:14px;

        right:14px;
    }


    .time{

        font-size:10px;

        letter-spacing:1.5px;
    }


    .date{

        font-size:8px;

        letter-spacing:1px;
    }


    .command-wrapper{

        width:
            calc(100% - 24px);

        bottom:17px;

        padding-left:15px;
    }


    #textInput{

        font-size:13px;
    }


    #sendBtn{

        padding:
            0 12px;
    }


    #chat{

        bottom:82px;

        width:88%;
    }


    .msg{

        font-size:11px;
    }

}

</style>
</head>


<body>


<div id="webgl-container"></div>

<div class="vignette"></div>


<!-- =====================================================
     JARVIS
===================================================== -->

<div class="jarvis-title">
    J.A.R.V.I.S
</div>


<!-- =====================================================
     ORA / DATA
===================================================== -->

<div class="datetime">

    <div
        class="time"
        id="clock"
    >
        00:00:00
    </div>

    <div
        class="date"
        id="date"
    >
        30 AGO 2026
    </div>

</div>


<!-- =====================================================
     CHAT
===================================================== -->

<div id="chat"></div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="command-wrapper">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        placeholder="Chiedi qualcosa a JARVIS..."
    >


    <button
        id="micBtn"
        aria-label="Microfono"
    >

        <span
            class="mic-icon"
        ></span>

    </button>


    <button
        id="sendBtn"
    >
        INVIA
    </button>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


const MEMORY_KEY =
    "jarvis_memory_v1";


const MAX_MEMORY =
    30;


/* =====================================================
   ELEMENTI
===================================================== */

const container =
    document.getElementById(
        "webgl-container"
    );


const chat =
    document.getElementById(
        "chat"
    );


const textInput =
    document.getElementById(
        "textInput"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const micBtn =
    document.getElementById(
        "micBtn"
    );


const clock =
    document.getElementById(
        "clock"
    );


const date =
    document.getElementById(
        "date"
    );


/* =====================================================
   MEMORIA LOCALE
===================================================== */

let memory = [];


try{

    const saved =
        localStorage.getItem(
            MEMORY_KEY
        );


    if(saved){

        const parsed =
            JSON.parse(saved);


        if(
            Array.isArray(parsed)
        ){

            memory =
                parsed
                    .filter(item =>
                        item &&
                        (
                            item.role === "user" ||
                            item.role === "assistant"
                        ) &&
                        typeof item.content === "string"
                    )
                    .slice(-MAX_MEMORY);
        }
    }

}catch(error){

    console.warn(
        "Memoria non disponibile:",
        error
    );

}


function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                memory.slice(-MAX_MEMORY)
            )
        );

    }catch(error){

        console.warn(
            "Impossibile salvare la memoria:",
            error
        );
    }
}


function addMemory(
    role,
    content
){

    if(
        !content ||
        typeof content !== "string"
    ){

        return;
    }


    memory.push({

        role,

        content:
            content.slice(0,5000)

    });


    memory =
        memory.slice(
            -MAX_MEMORY
        );


    saveMemory();
}


/* =====================================================
   ORA E DATA
===================================================== */

const months = [

    "GEN",
    "FEB",
    "MAR",
    "APR",
    "MAG",
    "GIU",
    "LUG",
    "AGO",
    "SET",
    "OTT",
    "NOV",
    "DIC"

];


function updateDateTime(){

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(2,"0");


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const seconds =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    clock.textContent =
        `${hours}:${minutes}:${seconds}`;


    const day =
        String(
            now.getDate()
        ).padStart(2,"0");


    const month =
        months[
            now.getMonth()
        ];


    const year =
        now.getFullYear();


    date.textContent =
        `${day} ${month} ${year}`;
}


updateDateTime();


setInterval(
    updateDateTime,
    1000
);


/* =====================================================
   SCENA
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        .1,

        1000

    );


camera.position.z =
    5.2;


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


container.appendChild(
    renderer.domElement
);


/* =====================================================
   TEXTURE
===================================================== */

function createGlowTexture(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        64;


    canvas.height =
        64;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const gradient =
        ctx.createRadialGradient(

            32,
            32,
            0,

            32,
            32,
            32

        );


    gradient.addColorStop(

        0,

        "rgba(255,255,255,1)"

    );


    gradient.addColorStop(

        .16,

        "rgba(220,255,255,1)"

    );


    gradient.addColorStop(

        .35,

        "rgba(0,255,255,.95)"

    );


    gradient.addColorStop(

        .68,

        "rgba(0,170,210,.30)"

    );


    gradient.addColorStop(

        1,

        "rgba(0,0,0,0)"

    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,
        0,
        64,
        64

    );


    return new THREE.CanvasTexture(
        canvas
    );
}


/* =====================================================
   PARTICELLE
===================================================== */

const COUNT =
    3000;


const geometry =
    new THREE.BufferGeometry();


const positions =
    new Float32Array(
        COUNT * 3
    );


const radii =
    new Float32Array(
        COUNT
    );


const theta =
    new Float32Array(
        COUNT
    );


const phi =
    new Float32Array(
        COUNT
    );


const seed =
    new Float32Array(
        COUNT
    );


for(
    let i=0;
    i<COUNT;
    i++
){

    const r =
        1.15 +
        Math.pow(
            Math.random(),
            .72
        )*.70;


    const t =
        Math.random() *
        Math.PI *
        2;


    const p =
        Math.acos(
            2*Math.random()-1
        );


    radii[i] =
        r;


    theta[i] =
        t;


    phi[i] =
        p;


    seed[i] =
        Math.random()*100;


    positions[i*3] =
        r *
        Math.sin(p) *
        Math.cos(t);


    positions[i*3+1] =
        r *
        Math.sin(p) *
        Math.sin(t);


    positions[i*3+2] =
        r *
        Math.cos(p);

}


geometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        positions,

        3

    )

);


/* =====================================================
   MATERIALE
===================================================== */

const particleMaterial =
    new THREE.PointsMaterial({

        color:
            new THREE.Color(
                0x00cfe8
            ),

        size:
            .034,

        map:
            createGlowTexture(),

        transparent:true,

        opacity:.80,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending

    });


const particles =
    new THREE.Points(

        geometry,

        particleMaterial

    );


scene.add(
    particles
);


/* =====================================================
   STATI
===================================================== */

let targetEnergy =
    .12;


let energy =
    .12;


const baseCyan =
    new THREE.Color(
        0x00cfe8
    );


const brightCyan =
    new THREE.Color(
        0x8fffff
    );


const currentColor =
    baseCyan.clone();


function setState(
    state
){

    if(
        state ===
        "listening"
    ){

        targetEnergy =
            .55;

    }

    else if(
        state ===
        "thinking"
    ){

        targetEnergy =
            1;

    }

    else if(
        state ===
        "speaking"
    ){

        targetEnergy =
            .82;

    }

    else{

        targetEnergy =
            .12;

    }

}


/* =====================================================
   FORMA ORGANICA
===================================================== */

function spikeField(
    t,
    p,
    time
){

    const a =
        Math.sin(
            t*5 +
            time*1.7
        );


    const b =
        Math.cos(
            p*7 -
            time*1.2
        );


    const c =
        Math.sin(
            t*9 +
            p*4 +
            time*2.1
        );


    const d =
        Math.cos(
            t*3 -
            p*8 -
            time*1.5
        );


    const value =
        a*.30 +
        b*.24 +
        c*.22 +
        d*.18;


    return Math.sign(value) *

        Math.pow(
            Math.abs(value),
            3
        );
}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now()*.001;


    energy +=
        (
            targetEnergy -
            energy
        )*.045;


    /*
       SOLO BLU / CIANO.
    */

    currentColor.lerp(
        brightCyan,
        energy*.055
    );


    if(
        energy < .3
    ){

        currentColor.lerp(
            baseCyan,
            .025
        );

    }


    particleMaterial.color =
        currentColor;


    particleMaterial.size =
        .032 +
        energy*.009;


    particleMaterial.opacity =
        .76 +
        energy*.20;


    const pos =
        geometry
            .attributes
            .position
            .array;


    for(
        let i=0;
        i<COUNT;
        i++
    ){

        const index =
            i*3;


        const r =
            radii[i];


        const t =
            theta[i];


        const p =
            phi[i];


        const s =
            seed[i];


        const breathing =
            Math.sin(
                time*2+s
            )*.035;


        const spikes =
            spikeField(
                t,
                p,
                time
            );


        const spikeStrength =
            energy*.58;


        const waveX =
            Math.sin(
                p*6 +
                time*2.2 +
                s
            )*.10*energy;


        const waveY =
            Math.cos(
                t*7 -
                time*1.7 +
                s
            )*.10*energy;


        const waveZ =
            Math.sin(
                (t+p)*5 +
                time*2.7
            )*.08*energy;


        const rr =
            r +
            breathing +
            spikes*spikeStrength +
            waveX +
            waveY;


        let x =
            rr *
            Math.sin(p) *
            Math.cos(t);


        let y =
            rr *
            Math.sin(p) *
            Math.sin(t);


        let z =
            rr *
            Math.cos(p);


        x +=
            waveY *
            Math.cos(
                time+s
            );


        y +=
            waveZ *
            Math.sin(
                time*1.3+s
            );


        z +=
            waveX *
            Math.cos(
                time*1.6+s
            );


        if(
            energy > .3
        ){

            x +=
                Math.sin(
                    time*2.4 +
                    p*8 +
                    s
                )*.09*energy;


            y +=
                Math.cos(
                    time*2.1 +
                    t*9 +
                    s
                )*.09*energy;


            z +=
                Math.sin(
                    time*2.8 +
                    (t+p)*7
                )*.11*energy;

        }


        pos[index] =
            x;


        pos[index+1] =
            y;


        pos[index+2] =
            z;

    }


    geometry
        .attributes
        .position
        .needsUpdate =
            true;


    particles.rotation.y +=
        .0005 +
        energy*.0008;


    particles.rotation.x =
        Math.sin(
            time*.25
        )*.045;


    particles.rotation.z =
        Math.cos(
            time*.18
        )*.025;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   MESSAGGI
===================================================== */

function addMsg(
    text
){

    chat.innerHTML = "";


    const msg =
        document.createElement(
            "div"
        );


    msg.className =
        "msg";


    msg.textContent =
        text;


    chat.appendChild(
        msg
    );

}


/* =====================================================
   COSTRUZIONE CONTESTO TEMPORALE
===================================================== */

function getTimeContext(){

    const now =
        new Date();


    return {

        currentTime:
            now.toLocaleTimeString(
                "it-IT",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            ),

        currentDate:
            now.toLocaleDateString(
                "it-IT",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric"
                }
            ),

        dayOfWeek:
            now.toLocaleDateString(
                "it-IT",
                {
                    weekday:"long"
                }
            ),

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone,

        timezoneOffset:
            -now.getTimezoneOffset()

    };

}


/* =====================================================
   AI
===================================================== */

async function processAi(
    text
){

    setState(
        "thinking"
    );


    try{

        const temporal =
            getTimeContext();


        /*
           Salviamo la domanda
           nella memoria prima
           di inviarla.
        */

        addMemory(
            "user",
            text
        );


        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            message:
                                text,

                            memory:
                                memory,

                            currentTime:
                                temporal.currentTime,

                            currentDate:
                                temporal.currentDate,

                            dayOfWeek:
                                temporal.dayOfWeek,

                            timezone:
                                temporal.timezone,

                            timezoneOffset:
                                temporal.timezoneOffset

                        })

                }

            );


        if(
            !response.ok
        ){

            throw new Error(
                "API error"
            );

        }


        const data =
            await response.json();


        const reply =
            typeof data.reply === "string"
                ? data.reply.trim()
                : "Non ho ricevuto una risposta.";


        /*
           Salviamo la risposta.
        */

        addMemory(
            "assistant",
            reply
        );


        addMsg(
            reply
        );


        speak(
            reply
        );


    }catch(error){

        console.error(
            "JARVIS:",
            error
        );


        /*
           Se l'API fallisce,
           eliminiamo l'ultimo
           messaggio utente dalla
           memoria per non lasciare
           una conversazione falsa.
        */

        if(
            memory.length &&
            memory[memory.length-1].role === "user" &&
            memory[memory.length-1].content === text
        ){

            memory.pop();

            saveMemory();
        }


        addMsg(
            "Errore di connessione."
        );


        setState(
            "idle"
        );

    }

}


/* =====================================================
   INVIO
===================================================== */

function sendMessage(){

    const text =
        textInput.value.trim();


    if(
        !text
    )
        return;


    textInput.value =
        "";


    addMsg(
        text
    );


    processAi(
        text
    );

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


textInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   VOCE
===================================================== */

function speak(
    text
){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){

        setState(
            "idle"
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    utterance.rate =
        .95;


    utterance.pitch =
        .85;


    utterance.volume =
        1;


    utterance.onstart =
        () => {

            setState(
                "speaking"
            );

        };


    utterance.onend =
        () => {

            setState(
                "idle"
            );

        };


    utterance.onerror =
        () => {

            setState(
                "idle"
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICROFONO
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


let listening =
    false;


if(
    Recognition
){

    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening =
                true;


            micBtn.classList.add(
                "active"
            );


            setState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if(
                text
            ){

                textInput.value =
                    text;


                sendMessage();

            }

        };


    recognition.onerror =
        error => {

            console.warn(
                "Speech recognition:",
                error
            );


            listening =
                false;


            micBtn.classList.remove(
                "active"
            );


            setState(
                "idle"
            );

        };


    recognition.onend =
        () => {

            listening =
                false;


            micBtn.classList.remove(
                "active"
            );


            if(
                !speechSynthesis.speaking
            ){

                setState(
                    "idle"
                );

            }

        };


    micBtn.addEventListener(
        "click",
        () => {

            if(
                listening
            ){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }

        }
    );

}else{

    micBtn.disabled =
        true;


    micBtn.style.opacity =
        ".3";

}


/* =====================================================
   RIDIMENSIONAMENTO
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   COMANDI MEMORIA
===================================================== */

/*
   Puoi usare dalla console:

   clearJarvisMemory()

   per cancellare completamente
   la memoria locale.
*/

window.clearJarvisMemory =
    function(){

        memory = [];

        localStorage.removeItem(
            MEMORY_KEY
        );

        console.log(
            "Memoria JARVIS cancellata."
        );

    };


/* =====================================================
   AVVIO
===================================================== */

setState(
    "idle"
);

</script>
