<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<link rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#010405;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(
circle at center,
#071719 0%,
#020708 48%,
#000 100%
);
}

#webgl-container{
position:fixed;
inset:0;
z-index:1;
}

.vignette{
position:fixed;
inset:0;
z-index:3;
pointer-events:none;
background:
radial-gradient(
circle at center,
transparent 30%,
rgba(0,0,0,.2) 65%,
rgba(0,0,0,.8) 100%
);
}

.jarvis-title{
position:fixed;
top:2.4%;
left:50%;
transform:translateX(-50%);
z-index:30;
color:rgba(255,255,255,.86);
font-size:clamp(20px,2.8vw,31px);
font-weight:300;
letter-spacing:clamp(5px,1vw,8px);
white-space:nowrap;
text-shadow:0 0 10px rgba(255,255,255,.12);
pointer-events:none;
}

.datetime{
position:fixed;
top:18px;
right:24px;
z-index:30;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:3px;
font-family:monospace;
pointer-events:none;
}

.time{
color:rgba(150,255,255,.6);
font-size:11px;
letter-spacing:2px;
}

.date{
color:rgba(150,255,255,.38);
font-size:8px;
letter-spacing:1px;
}

#chat{
position:fixed;
left:50%;
bottom:92px;
transform:translateX(-50%);
z-index:40;
width:min(620px,88%);
text-align:center;
pointer-events:none;
}

.msg{
display:inline-block;
max-width:100%;
padding:10px 18px;
border:1px solid rgba(0,255,255,.22);
border-radius:24px;
background:rgba(4,20,23,.4);
backdrop-filter:blur(14px);
color:rgba(235,255,255,.9);
font-size:12px;
line-height:1.45;
white-space:pre-wrap;
}

.command-wrapper{
position:fixed;
left:50%;
bottom:23px;
transform:translateX(-50%);
z-index:50;
width:min(650px,90%);
display:flex;
align-items:center;
padding:6px 7px 6px 20px;
border:1px solid rgba(100,255,255,.28);
border-radius:40px;
background:rgba(5,20,23,.38);
backdrop-filter:blur(20px);
box-shadow:0 0 30px rgba(0,255,255,.05);
}

.command-wrapper:focus-within{
border-color:rgba(0,255,255,.6);
box-shadow:0 0 25px rgba(0,255,255,.12);
}

#textInput{
flex:1;
min-width:0;
border:none;
outline:none;
background:transparent;
color:white;
font-size:14px;
padding:12px 5px;
}

#textInput::placeholder{
color:rgba(255,255,255,.3);
}

#micBtn{
width:34px;
height:34px;
margin-right:7px;
border:none;
background:transparent;
color:rgba(210,255,255,.65);
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.mic-icon{
width:8px;
height:14px;
border:1.3px solid currentColor;
border-radius:60px;
position:relative;
}

.mic-icon:after{
content:"";
position:absolute;
left:50%;
bottom:-6px;
width:12px;
height:7px;
transform:translateX(-50%);
border:1.3px solid currentColor;
border-top:none;
border-radius:0 0 8px 8px;
}

#micBtn.active{
color:#8fffff;
filter:drop-shadow(0 0 8px rgba(0,255,255,.7));
}

#sendBtn{
height:39px;
padding:0 17px;
border:1px solid rgba(0,255,255,.28);
border-radius:22px;
background:rgba(0,255,255,.05);
color:rgba(220,255,255,.78);
font-size:10px;
letter-spacing:2px;
cursor:pointer;
}

#sendBtn:hover{
color:white;
border-color:#00ffff;
background:rgba(0,255,255,.1);
}

/* ================= CONVERSAZIONE ================= */

#conversationBtn{
position:fixed;
left:22px;
bottom:24px;
z-index:60;
height:39px;
padding:0 15px;
border:1px solid rgba(0,255,255,.25);
border-radius:22px;
background:rgba(3,15,18,.72);
color:rgba(210,255,255,.7);
font-size:10px;
letter-spacing:1.5px;
cursor:pointer;
backdrop-filter:blur(12px);
}

#conversationBtn.active{
color:#8fffff;
border-color:rgba(0,255,255,.7);
background:rgba(0,255,255,.08);
box-shadow:0 0 18px rgba(0,255,255,.12);
}

/* ================= FULLSCREEN ================= */

#fullscreenBtn{
position:fixed;
right:22px;
bottom:24px;
z-index:60;
height:39px;
padding:0 15px;
border:1px solid rgba(0,255,255,.25);
border-radius:22px;
background:rgba(3,15,18,.72);
color:rgba(210,255,255,.7);
font-size:10px;
letter-spacing:1.5px;
cursor:pointer;
backdrop-filter:blur(12px);
transition:.2s;
}

#fullscreenBtn:hover{
color:white;
border-color:#00ffff;
background:rgba(0,255,255,.08);
}

#fullscreenBtn.active{
color:#8fffff;
border-color:rgba(0,255,255,.75);
background:rgba(0,255,255,.09);
box-shadow:0 0 18px rgba(0,255,255,.14);
}

/* ================= VOCE ================= */

#voiceBtn{
position:fixed;
right:22px;
bottom:74px;
z-index:60;
height:39px;
padding:0 15px;
border:1px solid rgba(0,255,255,.25);
border-radius:22px;
background:rgba(3,15,18,.72);
color:rgba(210,255,255,.7);
font-size:10px;
letter-spacing:1.5px;
cursor:pointer;
}

#voicePanel{
position:fixed;
right:22px;
bottom:122px;
z-index:100;
width:min(330px,calc(100% - 30px));
padding:15px;
display:none;
border:1px solid rgba(0,255,255,.25);
border-radius:18px;
background:rgba(2,13,16,.94);
backdrop-filter:blur(20px);
}

#voicePanel.active{
display:block;
}

.voice-title{
color:rgba(220,255,255,.9);
font-size:11px;
letter-spacing:2px;
margin-bottom:10px;
}

#voiceSelector,
#voiceTest{
width:100%;
padding:10px;
border:1px solid rgba(0,255,255,.2);
border-radius:10px;
outline:none;
background:rgba(0,20,23,.9);
color:rgba(220,255,255,.85);
font-size:11px;
}

#voiceTest{
margin-top:10px;
background:rgba(0,255,255,.04);
cursor:pointer;
}

/* ================= MAPPA ================= */

#tacticalMap{
position:fixed;
inset:0;
z-index:20;
display:none;
background:
radial-gradient(
circle at center,
#081719 0%,
#020708 65%,
#000 100%
);
}

#tacticalMap.active{
display:block;
animation:mapIn .45s ease;
}

@keyframes mapIn{

from{
opacity:0;
transform:scale(1.015);
}

to{
opacity:1;
transform:scale(1);
}

}

.map-header{
position:absolute;
top:2.4%;
left:50%;
transform:translateX(-50%);
z-index:600;
color:rgba(220,255,255,.9);
font-size:clamp(24px,4vw,42px);
font-weight:300;
letter-spacing:clamp(6px,1.3vw,12px);
white-space:nowrap;
text-shadow:0 0 12px rgba(0,255,255,.25);
pointer-events:none;
}

#map{
position:absolute;
top:3cm;
right:3cm;
bottom:3cm;
left:3cm;
overflow:hidden;
border-radius:28px;
background:#071012;
box-shadow:
0 0 35px rgba(0,0,0,.65),
0 0 70px rgba(0,255,255,.035);
border:1px solid rgba(0,255,255,.10);
}

.map-overlay{
position:absolute;
inset:0;
z-index:400;
pointer-events:none;
border-radius:28px;
box-shadow:inset 0 0 80px rgba(0,0,0,.28);
}

#closeMap{
position:absolute;
top:28px;
left:34px;
z-index:700;
width:38px;
height:38px;
border:1px solid rgba(0,255,255,.35);
border-radius:50%;
background:rgba(0,15,18,.85);
color:rgba(200,255,255,.85);
cursor:pointer;
font-size:19px;
display:flex;
align-items:center;
justify-content:center;
}

.maplibregl-ctrl-group{
background:rgba(0,15,18,.85)!important;
border:1px solid rgba(0,255,255,.18)!important;
border-radius:12px!important;
overflow:hidden;
}

.maplibregl-ctrl-group button{
background:transparent!important;
}

.maplibregl-ctrl-attrib{
background:rgba(0,8,10,.65)!important;
font-size:8px!important;
}

.jarvis-map-marker{
width:20px;
height:20px;
border-radius:50%;
border:2px solid #00ffff;
background:rgba(0,255,255,.16);
box-shadow:
0 0 15px rgba(0,255,255,.9),
0 0 35px rgba(0,255,255,.4);
animation:markerPulse 1.5s infinite;
}

@keyframes markerPulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.18);
}

}

/* ================= WEB WINDOWS ================= */

#webSearchWindows{
position:fixed;
inset:0;
z-index:200;
pointer-events:none;
}

.web-window{
position:absolute;
width:620px;
height:460px;
min-width:300px;
min-height:220px;
max-width:90vw;
max-height:80vh;

background:rgba(2,12,15,.97);
border:1px solid rgba(0,255,255,.35);
border-radius:16px;

box-shadow:
0 0 30px rgba(0,255,255,.12),
0 15px 60px rgba(0,0,0,.6);

overflow:hidden;
pointer-events:auto;

touch-action:none;
}

.web-window-header{
position:relative;
height:42px;
display:flex;
align-items:center;

padding:0 8px 0 13px;

background:rgba(0,25,29,.95);
border-bottom:1px solid rgba(0,255,255,.18);

cursor:grab;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

.web-window-header:active{
cursor:grabbing;
}

.web-window-title{
flex:1;
min-width:0;

color:rgba(210,255,255,.85);
font-size:9px;
letter-spacing:1.5px;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.web-window-number{
color:rgba(0,255,255,.5);
margin-right:8px;
font-size:8px;
}

.web-window-controls{
display:flex;
gap:5px;
}

.web-window-btn{
width:27px;
height:27px;

border:1px solid rgba(0,255,255,.18);
border-radius:7px;

background:rgba(0,255,255,.025);
color:rgba(190,255,255,.7);

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;

font-size:13px;
}

.web-window-btn:hover{
color:white;
border-color:#00ffff;
background:rgba(0,255,255,.08);
}

.web-window-content{
position:absolute;
left:0;
right:0;
top:42px;
bottom:0;

background:#071012;
overflow:auto;

-webkit-overflow-scrolling:touch;
}

.web-search-page{
padding:25px;
font-family:Arial,sans-serif;
color:white;
}

.web-search-title{
font-size:18px;
letter-spacing:2px;
color:#8fffff;
margin-bottom:18px;
}

.web-search-query{
font-size:12px;
color:rgba(220,255,255,.55);
margin-bottom:20px;
}

.web-result{
display:block;
padding:15px;
margin-bottom:12px;

border:1px solid rgba(0,255,255,.16);
border-radius:12px;

background:rgba(0,255,255,.025);

text-decoration:none;
color:white;

transition:.2s;
}

.web-result:hover{
border-color:rgba(0,255,255,.55);
background:rgba(0,255,255,.06);
}

.web-result-title{
font-size:13px;
color:#8fffff;
margin-bottom:7px;
}

.web-result-url{
font-size:9px;
color:rgba(170,255,255,.45);
margin-bottom:6px;
}

.web-result-description{
font-size:10px;
line-height:1.5;
color:rgba(235,255,255,.7);
}

.web-window.minimized{
height:42px!important;
min-height:42px!important;
}

.web-window.minimized .web-window-content{
display:none;
}

.web-resize-handle{
position:absolute;
right:0;
bottom:0;

width:32px;
height:32px;

z-index:20;

cursor:nwse-resize;
touch-action:none;

background:
linear-gradient(
135deg,
transparent 0%,
transparent 45%,
rgba(0,255,255,.35) 46%,
rgba(0,255,255,.35) 50%,
transparent 51%,
transparent 60%,
rgba(0,255,255,.25) 61%,
rgba(0,255,255,.25) 65%,
transparent 66%
);
}

#webSearchIndicator{
position:fixed;
left:20px;
bottom:20px;
z-index:210;

display:none;

padding:8px 12px;

border:1px solid rgba(0,255,255,.2);
border-radius:15px;

background:rgba(2,15,18,.75);
color:rgba(180,255,255,.6);

font-size:8px;
letter-spacing:1.5px;

pointer-events:none;
}

#webSearchIndicator.active{
display:block;
}

@media(max-width:700px){

.web-window{
width:calc(100vw - 30px);
height:70vh;
min-width:280px;
min-height:220px;
}

.web-window-content{
overflow:auto;
}

.web-search-page{
padding:18px;
}

}

/* ================= MOBILE ================= */

@media(max-width:600px){

.jarvis-title{
top:2.2%;
font-size:23px;
letter-spacing:5px;
}

.datetime{
top:12px;
right:13px;
}

.command-wrapper{
width:calc(100% - 24px);
bottom:17px;
}

#textInput{
font-size:13px;
}

#chat{
bottom:80px;
}

#map{
top:3cm;
right:3cm;
bottom:3cm;
left:3cm;
border-radius:22px;
}

.map-overlay{
border-radius:22px;
}

.map-header{
top:2.5%;
font-size:23px;
letter-spacing:5px;
}

#closeMap{
top:24px;
left:25px;
width:34px;
height:34px;
}

#voiceBtn{
right:12px;
bottom:112px;
height:34px;
font-size:9px;
padding:0 11px;
}

#fullscreenBtn{
right:12px;
bottom:70px;
height:34px;
font-size:9px;
padding:0 11px;
}

#conversationBtn{
left:12px;
bottom:70px;
height:34px;
font-size:9px;
padding:0 11px;
}

#voicePanel{
right:12px;
bottom:150px;
width:calc(100% - 24px);
}

.web-window{
width:calc(100vw - 30px);
height:420px;
min-width:250px;
min-height:200px;
}

}

@media(max-width:430px){

#map{
top:2.2cm;
right:2.2cm;
bottom:2.2cm;
left:2.2cm;
}

}

/* ================= SCROLLBAR WEB ================= */

.web-window iframe{
color-scheme:light;
}

</style>

</head>

<div class="vignette"></div>

</div>

</div>

autocomplete="off"
placeholder="Chiedi qualcosa a JARVIS...">

INVIA
</button>

</div>

Voce dispositivo automatica

TESTA VOCE
</button>

<script type="module">

import * as THREE from "three";

/* ================= CONFIG ================= */

const API=
"https://iao-ai-v3.oceano-masoud.workers.dev/";

const MEMORY_KEY=
"jarvis_memory_v1";

const MAX_MEMORY=30;

const ELEVEN_VOICE_ID=
"vkBFlAtUdZqNR4MqxSVr";

let currentAudio=null;
let audioPlaying=false;

let deviceVoices=[];
let selectedDeviceVoice=null;

/* ================= ELEMENTI ================= */

const container=
document.getElementById("webgl-container");

const chat=
document.getElementById("chat");

const textInput=
document.getElementById("textInput");

const sendBtn=
document.getElementById("sendBtn");

const micBtn=
document.getElementById("micBtn");

const clock=
document.getElementById("clock");

const date=
document.getElementById("date");

const tacticalMap=
document.getElementById("tacticalMap");

const closeMap=
document.getElementById("closeMap");

const jarvisTitle=
document.getElementById("jarvisTitle");

const mapHeader=
document.querySelector(".map-header");

const voiceBtn=
document.getElementById("voiceBtn");

const voicePanel=
document.getElementById("voicePanel");

const voiceSelector=
document.getElementById("voiceSelector");

const voiceTest=
document.getElementById("voiceTest");

const webSearchWindows=
document.getElementById("webSearchWindows");

const webSearchIndicator=
document.getElementById("webSearchIndicator");

const conversationBtn=
document.getElementById("conversationBtn");

const fullscreenBtn=
document.getElementById("fullscreenBtn");

/* ================= MEMORIA ================= */

let memory=[];

try{

const saved=
localStorage.getItem(MEMORY_KEY);

if(saved){

const parsed=
JSON.parse(saved);

if(Array.isArray(parsed))
memory=parsed.slice(-MAX_MEMORY);

}

}catch(e){

console.warn(
"Memoria:",
e
);

}

function saveMemory(){

try{

localStorage.setItem(
MEMORY_KEY,
JSON.stringify(
memory.slice(-MAX_MEMORY)
)
);

}catch(e){

console.warn(
"Salvataggio memoria:",
e
);

}

}

function addMemory(role,content){

memory.push({
role,
content
});

memory=
memory.slice(-MAX_MEMORY);

saveMemory();

}

/* ================= OROLOGIO ================= */

const months=[
"GEN","FEB","MAR","APR","MAG","GIU",
"LUG","AGO","SET","OTT","NOV","DIC"
];

function updateClock(){

const now=new Date();

clock.textContent=
`${String(now.getHours()).padStart(2,"0")}:`+
`${String(now.getMinutes()).padStart(2,"0")}:`+
`${String(now.getSeconds()).padStart(2,"0")}`;

date.textContent=
`${String(now.getDate()).padStart(2,"0")} `+
`${months[now.getMonth()]} `+
`${now.getFullYear()}`;

}

updateClock();

setInterval(
updateClock,
1000
);

/* ================= THREE ================= */

const scene=
new THREE.Scene();

const camera=
new THREE.PerspectiveCamera(
55,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z=5.2;

const renderer=
new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio,
2
)
);

container.appendChild(
renderer.domElement
);

/* ================= GLOW ================= */

function createGlow(){

const canvas=
document.createElement("canvas");

canvas.width=64;
canvas.height=64;

const ctx=
canvas.getContext("2d");

const gradient=
ctx.createRadialGradient(
32,32,0,
32,32,32
);

gradient.addColorStop(
0,
"rgba(255,255,255,1)"
);

gradient.addColorStop(
.2,
"rgba(220,255,255,1)"
);

gradient.addColorStop(
.4,
"rgba(0,255,255,.9)"
);

gradient.addColorStop(
.7,
"rgba(0,150,190,.25)"
);

gradient.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
64,
64
);

return new THREE.CanvasTexture(
canvas
);

}

/* ================= PARTICELLE ================= */

const COUNT=3000;

const geometry=
new THREE.BufferGeometry();

const positions=
new Float32Array(
COUNT*3
);

const radii=
new Float32Array(
COUNT
);

const angles=
new Float32Array(
COUNT*2
);

const seeds=
new Float32Array(
COUNT
);

for(let i=0;i<COUNT;i++){

const r=
1.10+
Math.random()*.70;

const theta=
Math.random()*
Math.PI*2;

const phi=
Math.acos(
2*Math.random()-1
);

radii[i]=r;

angles[i*2]=theta;

angles[i*2+1]=phi;

seeds[i]=
Math.random()*100;

const index=i*3;

positions[index]=
r*Math.sin(phi)*
Math.cos(theta);

positions[index+1]=
r*Math.sin(phi)*
Math.sin(theta);

positions[index+2]=
r*Math.cos(phi);

}

geometry.setAttribute(
"position",
new THREE.BufferAttribute(
positions,
3
)
);

const material=
new THREE.PointsMaterial({

color:

let targetEnergy=.15;

let energy=.15;

const normalColor=
new THREE.Color(
0x00cfe8
);

const activeColor=
new THREE.Color(
0x8fffff
);

const currentColor=
normalColor.clone();

function setState(state){

if(state==="thinking")
targetEnergy=2;

else if(state==="speaking")
targetEnergy=.8;

else if(state==="listening")
targetEnergy=.55;

else
targetEnergy=.15;

}

/* ================= ANIMAZIONE ================= */

function animate(){

requestAnimationFrame(
animate
);

const time=
performance.now()*.001;

energy+=
(targetEnergy-energy)*
.045;

currentColor.lerp(
activeColor,
Math.min(energy*.04,1)
);

if(energy<.3){

currentColor.lerp(
normalColor,
.03
);

}

material.color=
currentColor;

material.size=
.032+
energy*.008;

const pos=
geometry.attributes.position.array;

for(let i=0;i<COUNT;i++){

const index=i*3;

const r=
radii[i];

const theta=
angles[i*2];

const phi=
angles[i*2+1];

const seed=
seeds[i];

const pulse=
Math.sin(
time*2+
seed
)*.035;

const strangeShape=
Math.sin(
theta*6+
time*2+
seed
)*.18*
energy;

const wave=
Math.cos(
phi*7-
time*1.8+
seed
)*.12*
energy;

const rr=
r+
pulse+
strangeShape+
wave;

let x=
rr*
Math.sin(phi)*
Math.cos(theta);

let y=
rr*
Math.sin(phi)*
Math.sin(theta);

let z=
rr*
Math.cos(phi);

x+=
Math.sin(
time*2.4+
phi*8+
seed
)*.08*
energy;

y+=
Math.cos(
time*2.1+
theta*9+
seed
)*.08*
energy;

z+=
Math.sin(
time*2.7+
(theta+phi)*7
)*.10*
energy;

pos[index]=x;

pos[index+1]=y;

pos[index+2]=z;

}

geometry.attributes.position.needsUpdate=true;

particles.rotation.y+=
.0005+
energy*.0008;

particles.rotation.x=
Math.sin(time*.25)*.04;

particles.rotation.z=
Math.cos(time*.18)*.025;

renderer.render(
scene,
camera
);

}

let fullscreenChanging=false;

function isFullscreen(){

return !!(
document.fullscreenElement ||
document.webkitFullscreenElement
);

}

async function enterFullscreen(){

if(isFullscreen())
return true;

if(fullscreenChanging)
return false;

fullscreenChanging=true;

try{

if(
document.documentElement.requestFullscreen
){

await document.documentElement.requestFullscreen();

}else if(
document.documentElement.webkitRequestFullscreen
){

document.documentElement.webkitRequestFullscreen();

}else{

addMsg(
"Fullscreen non supportato da questo browser."
);

fullscreenChanging=false;

return false;

}

fullscreenChanging=false;

return true;

}catch(error){

console.warn(
"Fullscreen:",
error
);

fullscreenChanging=false;

addMsg(
"Il browser ha bloccato il fullscreen. Premi il pulsante FULLSCREEN."
);

return false;

}

}

async function exitFullscreen(){

try{

if(document.exitFullscreen){

await document.exitFullscreen();

}else if(
document.webkitExitFullscreen
){

document.webkitExitFullscreen();

}

return true;

}catch(error){

console.warn(
"Uscita fullscreen:",
error
);

return false;

}

}

async function toggleFullscreen(){

if(isFullscreen()){

await exitFullscreen();

}else{

await enterFullscreen();

}

}

/* =====================================================

===================================================== */

function normalizeCommand(text){

return String(text)
.toLowerCase()
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.replace(
/[.,!?;:]/g,
" "
)
.replace(
/\s+/g,
" "
)
.trim();

}

/* =====================================================
COMANDI FULLSCREEN
===================================================== */

function handleFullscreenCommand(text){

const normalized=
normalizeCommand(text);

const simplified=
normalized
.replace(
/\bper favore\b/g,
""
)
.replace(
/\bjarvis\b/g,
""
)
.replace(
/\bla modalita\b/g,
"modalita"
)
.replace(
/\bla modalita di\b/g,
"modalita"
)
.replace(
/\bmodalita a\b/g,
"modalita"
)
.replace(
/\bmodalita dello\b/g,
"modalita"
)
.replace(
/\bmodalita dello schermo\b/g,
"modalita schermo"
)
.replace(
/\s+/g,
" "
)
.trim();

const activatePatterns=[

"attiva fullscreen",
"attiva il fullscreen",
"attiva la fullscreen",
"attiva modalita fullscreen",
"attiva la modalita fullscreen",
"attiva modalita schermo intero",
"attiva la modalita schermo intero",
"attiva schermo intero",
"metti fullscreen",
"metti in fullscreen",
"metti a fullscreen",
"vai fullscreen",
"vai in fullscreen",
"fullscreen",
"modalita fullscreen",
"modalita schermo intero",
"schermo intero",
"a schermo intero",
"passa a schermo intero",
"passa in fullscreen"

];

const deactivatePatterns=[

"disattiva fullscreen",
"disattiva il fullscreen",
"disattiva la fullscreen",
"disattiva modalita fullscreen",
"disattiva la modalita fullscreen",
"disattiva schermo intero",
"disattiva la modalita schermo intero",
"esci dal fullscreen",
"esci da fullscreen",
"esci fullscreen",
"esci da schermo intero",
"esci dallo schermo intero",
"torna normale",
"torna alla modalita normale",
"modalita normale",
"schermo normale"

];

if(
activatePatterns.includes(
simplified
)
){

if(isFullscreen()){

addMsg(
"Modalità fullscreen già attiva."
);

return true;

}

enterFullscreen();

return true;

}

if(
deactivatePatterns.includes(
simplified
)
){

if(!isFullscreen()){

addMsg(
"Modalità fullscreen non attiva."
);

return true;

}

exitFullscreen();

return true;

}

const hasFullscreenWord=
simplified.includes("fullscreen") ||
simplified.includes("full screen") ||
simplified.includes("schermo intero");

const wantsActivate=
simplified.includes("attiva") ||
simplified.includes("avvia") ||
simplified.includes("inizia") ||
simplified.includes("metti") ||
simplified.includes("passa") ||
simplified.includes("vai");

const wantsDeactivate=
simplified.includes("disattiva") ||
simplified.includes("chiudi") ||
simplified.includes("esci") ||
simplified.includes("torna");

if(
hasFullscreenWord &&
wantsActivate
){

enterFullscreen();

return true;

}

if(
hasFullscreenWord &&
wantsDeactivate
){

exitFullscreen();

return true;

}

return false;

}

);

"https://nominatim.openstreetmap.org/search"+
"?format=json&limit=1&q="+

await fetch(
url,
{
headers:{
"Accept":
"application/json"
}
}
);

if(!response.ok)
throw new Error(
"Ricerca posizione fallita"
);

const results=
await response.json();

if(!results.length){

addMsg(
"Non riesco a trovare "+
place+
"."
);

}

results[0];

parseFloat(result.lat);

const lon=
parseFloat(result.lon);

throw new Error(
"Mappa non inizializzata"
);

map.flyTo({

center:[
lon,
lat
],

zoom:12,

speed:.8,

curve:1.5,

essential:true

});

createJarvisMarker(
lat,
lon,
place
);

addMsg(
"Posizione acquisita: "+
place
);

}catch(error){

console.error(
"MAP ERROR:",
error
);

addMsg(
"Impossibile localizzare "+
place+
"."
);

}

}

)
){

return;

}

dragging=true;

bringWebWindowToFront(
windowElement
);

const rect=
windowElement.getBoundingClientRect();

dragOffsetX=
event.clientX-
rect.left;

dragOffsetY=
event.clientY-
rect.top;

try{

header.setPointerCapture(
event.pointerId
);

}catch(e){}

event.preventDefault();

},
{
passive:false
}
);

header.addEventListener(
"pointermove",
event=>{

if(!dragging)
return;

event.preventDefault();

let newLeft=
event.clientX-
dragOffsetX;

let newTop=
event.clientY-
dragOffsetY;

const rect=
windowElement.getBoundingClientRect();

const minLeft=
-rect.width+100;

const maxLeft=
window.innerWidth-80;

const minTop=0;

const maxTop=
window.innerHeight-60;

newLeft=
Math.max(
minLeft,
Math.min(
newLeft,
maxLeft
)
);

newTop=
Math.max(
minTop,
Math.min(
newTop,
maxTop
)
);

windowElement.style.left=
newLeft+"px";

windowElement.style.top=
newTop+"px";

},
{
passive:false
}
);

if(!dragging)
return;

dragging=false;

try{

header.releasePointerCapture(
event.pointerId
);

}catch(e){}

}

"pointerup",

);

/* ================= DEVICE TTS ================= */

function speakDevice(text){

return new Promise(
resolve=>{

if(
!("speechSynthesis" in window)
){

resolve(false);

return;

}

try{

window.speechSynthesis.cancel();

const utterance=
new SpeechSynthesisUtterance(
text
);

utterance.lang=
"it-IT";

utterance.rate=
.95;

utterance.pitch=
.9;

utterance.volume=
1;

if(
selectedDeviceVoice
){

utterance.voice=
selectedDeviceVoice;

}else{

const italianVoice=
deviceVoices.find(
voice=>
voice.lang
.toLowerCase()
.startsWith("it")
);

if(italianVoice)
utterance.voice=
italianVoice;

}

utterance.onstart=
()=>{

audioPlaying=true;

setState(
"speaking"
);

};

utterance.onend=
()=>{

audioPlaying=false;

setState(
"idle"
);

resolve(true);

};

utterance.onerror=
()=>{

audioPlaying=false;

setState(
"idle"
);

resolve(false);

};

window.speechSynthesis.speak(
utterance
);

setTimeout(
()=>{

try{

window.speechSynthesis.resume();

}catch(e){}

},
100
);

}catch(error){

console.error(
error
);

resolve(false);

}

}
);

}

async function speakElevenLabs(text){

if(!text)
return false;

if(currentAudio){

try{

currentAudio.pause();

currentAudio.currentTime=0;

}catch(e){}

currentAudio=null;

}

const controller=
new AbortController();

const timeout=
setTimeout(
()=>controller.abort(),
30000
);

try{

const response=
await fetch(
API,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

action:"tts",

text:text,

voiceId:
ELEVEN_VOICE_ID

}),

signal:
controller.signal

}
);

if(!response.ok)
return false;

const contentType=
response.headers
.get("content-type")||
"";

if(
!contentType.includes(
"audio"
)
)
return false;

const audioBlob=
await response.blob();

if(
!audioBlob||
audioBlob.size===0
)
return false;

const audioUrl=
URL.createObjectURL(
audioBlob
);

const audio=
new Audio(
audioUrl
);

currentAudio=
audio;

audio.volume=1;

audio.onplay=
()=>{

audioPlaying=true;

setState(
"speaking"
);

};

audio.onended=
()=>{

audioPlaying=false;

setState(
"idle"
);

URL.revokeObjectURL(
audioUrl
);

if(
currentAudio===audio
)
currentAudio=null;

if(conversationMode){

setTimeout(
()=>{
startContinuousRecognition();
},
150
);

}

};

audio.onerror=
()=>{

audioPlaying=false;

setState(
"idle"
);

URL.revokeObjectURL(
audioUrl
);

if(
conversationMode
){

setTimeout(
()=>{
startContinuousRecognition();
},
150
);

}

};

await audio.play();

return true;

}catch(error){

console.warn(
"ElevenLabs:",
error
);

return false;

}finally{

clearTimeout(
timeout
);

}

}

/* ================= INTERRUZIONE VOCE ================= */

function stopJarvisSpeaking(){

if(currentAudio){

try{

currentAudio.pause();

currentAudio.currentTime=0;

}catch(e){}

currentAudio=null;

}

if(
"speechSynthesis" in window
){

try{

window.speechSynthesis.cancel();

}catch(e){}

}

audioPlaying=false;

setState(
"listening"
);

}

/* ================= SPEAK ================= */

async function speak(text){

if(!text)
return;

const elevenSuccess=
await speakElevenLabs(
text
);

if(elevenSuccess)
return;

await speakDevice(
text
);

if(conversationMode){

setTimeout(
()=>{
startContinuousRecognition();
},
150
);

}

}

/* =====================================================
MODALITÀ CONVERSAZIONE CONTINUA
===================================================== */

let conversationMode=false;

let conversationStarting=false;

/* ================= RICONOSCIMENTO ================= */

const Recognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

let recognition=null;

let listening=false;

let recognitionStopping=false;

if(Recognition){

recognition=
new Recognition();

recognition.lang=
"it-IT";

recognition.continuous=
false;

recognition.interimResults=
false;

recognition.onstart=
()=>{

listening=true;

conversationStarting=
false;

micBtn.classList.add(
"active"
);

setState(
"listening"
);

};

recognition.onresult=
event=>{

const result=
event.results[
event.results.length-1
];

if(!result)
return;

const text=
result[0]
.transcript
.trim();

if(!text)
return;

console.log(
"JARVIS VOICE:",
text
);

textInput.value=
text;

if(
conversationMode&&
audioPlaying
){

stopJarvisSpeaking();

}

sendMessage();

};

recognition.onerror=
error=>{

console.error(
"Microfono:",
error
);

listening=false;

micBtn.classList.remove(
"active"
);

if(

conversationMode&&
error.error!=="not-allowed"&&
error.error!=="service-not-allowed"

){

setTimeout(
()=>{
startContinuousRecognition();
},
500
);

}else{

setState(
"idle"
);

}

};

recognition.onend=
()=>{

listening=false;

micBtn.classList.remove(
"active"
);

if(

conversationMode&&
!recognitionStopping

){

setTimeout(
()=>{
startContinuousRecognition();
},
250
);

}else{

recognitionStopping=
false;

if(!conversationMode)
setState(
"idle"
);

}

};

function startRecognition(){

if(!recognition)
return;

if(listening)
return;

recognitionStopping=
false;

try{

recognition.start();

}catch(error){

console.warn(
"Avvio microfono:",
error
);

setTimeout(
()=>{

if(!listening)
startRecognition();

},
500
);

}

}

function stopRecognition(){

if(!recognition)
return;

recognitionStopping=
true;

try{

recognition.stop();

}catch(e){}

listening=false;

micBtn.classList.remove(
"active"
);

}

function startContinuousRecognition(){

if(!conversationMode)
return;

if(listening)
return;

startRecognition();

}

function stopContinuousRecognition(){

conversationMode=
false;

recognitionStopping=
true;

try{

if(recognition)
recognition.stop();

}catch(e){}

listening=false;

micBtn.classList.remove(
"active"
);

conversationBtn.classList.remove(
"active"
);

conversationBtn.textContent=
"◉ CONVERSAZIONE";

setState(
"idle"
);

}

function activateConversationMode(){

if(conversationMode)
return;

conversationMode=
true;

conversationBtn.classList.add(
"active"
);

conversationBtn.textContent=
"● CONVERSAZIONE ATTIVA";

addMsg(
"Modalità conversazione continua attivata."
);

if(audioPlaying){

stopJarvisSpeaking();

}

startContinuousRecognition();

}

function deactivateConversationMode(){

if(!conversationMode)
return;

stopContinuousRecognition();

addMsg(
"Modalità conversazione continua disattivata."
);

}

conversationBtn.addEventListener(
"click",
()=>{

if(conversationMode){

deactivateConversationMode();

}else{

activateConversationMode();

}

}
);

micBtn.addEventListener(
"click",
()=>{

if(conversationMode){

deactivateConversationMode();

return;

}

if(listening){

stopRecognition();

}else{

startRecognition();

}

}
);

}else{

micBtn.style.opacity=
".3";

conversationBtn.style.opacity=
".35";

}

/* =====================================================
COMANDI MODALITÀ CONVERSAZIONE
===================================================== */

function handleConversationCommand(text){

const normalized=
normalizeCommand(text);

const activateCommands=[

"attiva modalita conversazione",
"attiva la modalita conversazione",
"modalita conversazione",
"avvia modalita conversazione",
"inizia modalita conversazione",
"conversazione continua",
"attiva conversazione continua"

];

const deactivateCommands=[

"disattiva modalita conversazione",
"disattiva la modalita conversazione",
"chiudi modalita conversazione",
"stop modalita conversazione",
"disattiva conversazione continua"

];

if(
activateCommands.includes(
normalized
)
){

activateConversationMode();

return true;

}

if(
deactivateCommands.includes(
normalized
)
){

deactivateConversationMode();

return true;

}

const hasConversation=
normalized.includes(
"conversazione"
);

const wantsActivate=
normalized.includes(
"attiva"
) ||
normalized.includes(
"avvia"
) ||
normalized.includes(
"inizia"
);

const wantsDeactivate=
normalized.includes(
"disattiva"
) ||
normalized.includes(
"chiudi"
) ||
normalized.includes(
"stop"
);

if(
hasConversation&&
wantsActivate
){

activateConversationMode();

return true;

}

if(
hasConversation&&
wantsDeactivate
){

deactivateConversationMode();

return true;

}

return false;

}

/* ================= PROCESS AI ================= */

async function processAi(text){

if(
handleFullscreenCommand(text)
)
return;

if(
handleConversationCommand(text)
)
return;

if(
handleWebWindowCommand(text)
)
return;

if(
handleWebCommand(text)
)
return;

if(
handleMapCommand(text)
)
return;

setState(
"thinking"
);

try{

const temporal=
getTimeData();

addMemory(
"user",
text
);

const controller=
new AbortController();

const timeout=
setTimeout(
()=>{
controller.abort();
},
30000
);

let response;

try{

response=
await fetch(
API,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:text,

memory:
memory.slice(-4),

currentTime:
temporal.currentTime,

currentDate:
temporal.currentDate,

dayOfWeek:
temporal.dayOfWeek,

timezone:
temporal.timezone

}),

signal:
controller.signal

}
);

}finally{

clearTimeout(
timeout
);

}

if(!response.ok){

const errorText=
await response.text();

let errorMessage=
"HTTP "+
response.status;

try{

const errorData=
JSON.parse(
errorText
);

if(
errorData&&
errorData.error
){

errorMessage=
errorData.error;

}

}catch(e){

if(errorText){

errorMessage=
errorText.substring(
0,
200
);

}

}

throw new Error(
errorMessage
);

}

const data=
await response.json();

const reply=
typeof data.response==="string"
?data.response.trim()
:"";

if(!reply)
throw new Error(
"Risposta AI vuota"
);

addMsg(
reply
);

addMemory(
"assistant",
reply
);

speak(
reply
).catch(
console.error
);

setState(
"idle"
);

}catch(error){

console.error(
"JARVIS ERROR:",
error
);

let message=
error.message||
"Errore sconosciuto";

if(
error.name==="AbortError"
){

message=
"Il server ha impiegato troppo tempo a rispondere.";

}else if(
message==="Failed to fetch"
){

message=
"Errore di connessione al server JARVIS.";

}

addMsg(
"ERRORE: "+
message
);

setState(
"idle"
);

if(conversationMode){

setTimeout(
()=>{
startContinuousRecognition();
},
500
);

}

}

}

const text=
textInput.value.trim();

return;

textInput.value="";

addMsg(

);

processAi(

);
