<title>J.A.R.V.I.S.</title><!-- =====================================================
     MAPLIBRE GL JS

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#010405;

    font-family:Arial,sans-serif;
}

body{

    background:
        radial-gradient(
            circle at center,
            #071719 0%,
            #020708 48%,
            #000000 100%
        );
}


/* =====================================================
   WEBGL
===================================================== */

#webgl-container{

    position:fixed;
    inset:0;

    z-index:1;
}


/* =====================================================
   VIGNETTE
===================================================== */

.vignette{

    position:fixed;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.2) 65%,
            rgba(0,0,0,.8) 100%
        );
}


/* =====================================================
   FILTRO SORVEGLIANZA TATTICA
===================================================== */

.surveillance-filter{

    position:fixed;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 0%,
            rgba(0,60,80,.08) 50%,
            rgba(0,40,60,.15) 100%
        );

    mix-blend-mode:multiply;
}

body::before{

    content:"";

    position:fixed;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        linear-gradient(
            0deg,
            rgba(0,120,150,.04),
            rgba(0,80,120,.02)
        );

    mix-blend-mode:screen;
}


/* =====================================================
   TITOLO JARVIS
===================================================== */

.jarvis-title{

    position:fixed;

    top:2.4%;

    left:50%;

    transform:translateX(-50%);

    z-index:30;

    color:rgba(255,255,255,.86);

    font-size:
        clamp(20px,2.8vw,31px);

    font-weight:300;

    letter-spacing:
        clamp(5px,1vw,8px);

    white-space:nowrap;

    text-shadow:
        0 0 10px
        rgba(255,255,255,.12);

    pointer-events:none;
}


/* =====================================================
   ORA
===================================================== */

.datetime{

    position:fixed;

    top:18px;
    right:24px;

    z-index:30;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:3px;

    font-family:monospace;

    pointer-events:none;
}

.time{

    color:rgba(150,255,255,.6);

    font-size:11px;

    letter-spacing:2px;

    text-shadow:
        0 0 8px
        rgba(0,255,255,.2);
}

.date{

    color:rgba(150,255,255,.38);

    font-size:8px;

    letter-spacing:1px;
}


/* =====================================================
   CHAT
===================================================== */

#chat{

    position:fixed;

    left:50%;
    bottom:92px;

    transform:translateX(-50%);

    z-index:40;

    width:min(620px,88%);

    text-align:center;

    pointer-events:none;
}

.msg{

    display:inline-block;

    max-width:100%;

    padding:10px 18px;

    border:
        1px solid
        rgba(0,255,255,.22);

    border-radius:24px;

    background:
        rgba(4,20,23,.4);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    color:
        rgba(235,255,255,.9);

    font-size:12px;

    line-height:1.45;

    white-space:pre-wrap;
}


/* =====================================================
   INPUT
===================================================== */

.command-wrapper{

    position:fixed;

    left:50%;
    bottom:23px;

    transform:translateX(-50%);

    z-index:50;

    width:min(650px,90%);

    display:flex;

    align-items:center;

    padding:6px 7px 6px 20px;

    border:
        1px solid
        rgba(100,255,255,.28);

    border-radius:40px;

    background:
        rgba(5,20,23,.38);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 0 30px
        rgba(0,255,255,.05);
}

.command-wrapper:focus-within{

    border-color:
        rgba(0,255,255,.6);

    box-shadow:
        0 0 25px
        rgba(0,255,255,.12);
}

#textInput{

    flex:1;

    min-width:0;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:12px 5px;
}

#textInput::placeholder{

    color:rgba(255,255,255,.3);
}


/* =====================================================
   MICROFONO
===================================================== */

#micBtn{

    width:34px;
    height:34px;

    margin-right:7px;

    border:none;

    background:transparent;

    color:rgba(210,255,255,.65);

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;
}

.mic-icon{

    width:8px;
    height:14px;

    border:
        1.3px solid
        currentColor;

    border-radius:6px;

    position:relative;
}

.mic-icon::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:-6px;

    width:12px;
    height:7px;

    transform:translateX(-50%);

    border:
        1.3px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 8px 8px;
}

#micBtn:hover{

    color:#00ffff;
}

#micBtn.active{

    color:#8fffff;

    filter:
        drop-shadow(
            0 0 8px
            rgba(0,255,255,.7)
        );
}


/* =====================================================
   INVIA
===================================================== */

#sendBtn{

    height:39px;

    padding:0 17px;

    border:
        1px solid
        rgba(0,255,255,.28);

    border-radius:22px;

    background:
        rgba(0,255,255,.05);

    color:
        rgba(220,255,255,.78);

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;
}

#sendBtn:hover{

    color:white;

    border-color:#00ffff;

    background:
        rgba(0,255,255,.1);
}


/* =====================================================
   MAPPA TATTICA
===================================================== */

#tacticalMap{

    position:fixed;

    inset:0;

    z-index:20;

    display:none;

    background:
        radial-gradient(
            circle at center,
            #081719 0%,
            #020708 65%,
            #000000 100%
        );
}


/* =====================================================
   MAPPA ATTIVA
===================================================== */

#tacticalMap.active{

    display:block;

    animation:
        mapIn .45s ease;
}


@keyframes mapIn{

    from{

        opacity:0;

        transform:scale(1.015);
    }

    to{

        opacity:1;

        transform:scale(1);
    }
}


/* =====================================================
   TITOLO TACTICAL MAP
===================================================== */

.map-header{

    position:absolute;

    top:2.4%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:600;

    color:
        rgba(220,255,255,.9);

    font-family:Arial,sans-serif;

    font-size:
        clamp(24px,4vw,42px);

    font-weight:300;

    letter-spacing:
        clamp(6px,1.3vw,12px);

    white-space:nowrap;

    text-shadow:
        0 0 12px
        rgba(0,255,255,.25);

    pointer-events:none;
}


/* =====================================================
   CONTENITORE MAPPA
===================================================== */

#map{

    position:absolute;

    top:20px;
    right:20px;
    bottom:20px;
    left:20px;

    width:auto;
    height:auto;

    overflow:hidden;

    border-radius:28px;

    background:#071012;

    box-shadow:
        0 0 35px rgba(0,0,0,.65),
        0 0 70px rgba(0,255,255,.035);

    border:
        1px solid
        rgba(0,255,255,.10);
}


/* =====================================================
   OVERLAY MAPPA
===================================================== */

.map-overlay{

    position:absolute;

    inset:0;

    z-index:400;

    pointer-events:none;

    border-radius:28px;

    box-shadow:
        inset 0 0 80px
        rgba(0,0,0,.28);
}


/* =====================================================
   CHIUDI MAPPA
===================================================== */

#closeMap{

    position:absolute;

    top:28px;
    left:34px;

    z-index:700;

    width:38px;
    height:38px;

    border:
        1px solid
        rgba(0,255,255,.35);

    border-radius:50%;

    background:
        rgba(0,15,18,.85);

    color:
        rgba(200,255,255,.85);

    cursor:pointer;

    font-size:19px;

    display:flex;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(10px);

    transition:.5s;
}

#closeMap:hover{

    color:white;

    border-color:#00ffff;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.3);
}


/* =====================================================
   MAPLIBRE CONTROLLI
===================================================== */

.maplibregl-ctrl-group{

    background:
        rgba(0,15,18,.85)!important;

    border:
        1px solid
        rgba(0,255,255,.18)!important;

    border-radius:12px!important;

    overflow:hidden;
}

.maplibregl-ctrl-group button{

    background:
        transparent!important;

    color:#bfffff!important;
}

.maplibregl-ctrl-group button:hover{

    background:
        rgba(0,255,255,.08)!important;
}

.maplibregl-ctrl-attrib{

    background:
        rgba(0,8,10,.65)!important;

    color:
        rgba(180,255,255,.35)!important;

    font-size:8px!important;
}

.maplibregl-ctrl-attrib a{

    color:
        rgba(150,240,255,.45)!important;
}


/* =====================================================
   MARKER JARVIS
===================================================== */

.jarvis-map-marker{

    width:20px;
    height:20px;

    border-radius:50%;

    border:
        2px solid
        #00ffff;

    background:
        rgba(0,255,255,.16);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.9),
        0 0 35px
        rgba(0,255,255,.4);

    position:relative;

    animation:
        markerPulse 1.5s infinite;
}

.jarvis-map-marker::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#dfffff;

    box-shadow:
        0 0 8px #00ffff;
}

@keyframes markerPulse{

    0%,
    100%{

        transform:scale(1);

        box-shadow:
            0 0 15px
            rgba(0,255,255,.9),
            0 0 35px
            rgba(0,255,255,.4);
    }

    50%{

        transform:scale(1.18);

        box-shadow:
            0 0 22px
            rgba(0,255,255,1),
            0 0 50px
            rgba(0,255,255,.55);
    }
}


/* =====================================================
   POPUP MAPLIBRE
===================================================== */

.maplibregl-popup-content{

    background:
        rgba(3,15,18,.96)!important;

    color:
        rgba(220,255,255,.9)!important;

    border:
        1px solid
        rgba(0,255,255,.25);

    border-radius:10px;

    padding:10px 14px;

    box-shadow:
        0 0 20px
        rgba(0,255,255,.12);
}

.maplibregl-popup-tip{

    border-top-color:
        rgba(3,15,18,.96)!important;

    border-bottom-color:
        rgba(3,15,18,.96)!important;
}

.maplibregl-popup-close-button{

    color:#00ffff!important;

    font-size:18px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .jarvis-title{

        top:2.2%;

        font-size:23px;

        letter-spacing:5px;
    }


    .datetime{

        top:12px;

        right:13px;
    }


    .time{

        font-size:10px;
    }


    .date{

        font-size:7px;
    }


    .command-wrapper{

        width:
            calc(100% - 24px);

        bottom:17px;
    }


    #textInput{

        font-size:13px;
    }


    #chat{

        bottom:80px;
    }


    #map{

        top:15px;
        right:15px;
        bottom:15px;
        left:15px;

        border-radius:22px;
    }


    .map-overlay{

        border-radius:22px;
    }


    .map-header{

        top:2.5%;

        font-size:23px;

        letter-spacing:5px;
    }


    #closeMap{

        top:24px;
        left:25px;

        width:34px;
        height:34px;
    }

}

</div><!-- =====================================================

<div class="map-overlay"></div>

</div>


<button

</div><!-- =====================================================
