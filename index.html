<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Neural Core</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050608;
        font-family: monospace;
        color: #ffffff;
    }

    #webgl-container {
        position: absolute;
        inset: 0;
        z-index: 1;
    }

    /* HUD UI ELEMENTS */
    .hud-top-left {
        position: absolute;
        top: 25px;
        left: 25px;
        z-index: 10;
    }
    .btn-hud {
        background: rgba(15, 25, 40, 0.6);
        border: 1px solid rgba(0, 150, 255, 0.4);
        color: #88c8ff;
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 2px;
        border-radius: 4px;
        cursor: pointer;
    }

    .hud-top-right {
        position: absolute;
        top: 25px;
        right: 25px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 1px;
        color: #00ffaa;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: #00ffaa;
        border-radius: 50%;
        box-shadow: 0 0 8px #00ffaa;
    }

    .hud-bottom {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        text-align: center;
    }
    #statusText {
        font-size: 12px;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.5);
    }

    #chat {
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: min(500px, 90%);
        text-align: center;
        pointer-events: none;
    }
    .msg {
        background: rgba(10, 20, 35, 0.8);
        border: 1px solid rgba(0, 140, 255, 0.3);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        color: #d0e8ff;
        margin-top: 6px;
    }
</style>
</head>
<body>

<div class="hud-top-left">
    <button class="btn-hud" id="micBtn">MUTE</button>
</div>

<div class="hud-top-right">
    <div class="status-dot"></div>
    <span>connected</span>
</div>

<div id="webgl-container"></div>

<div id="chat"></div>

<div class="hud-bottom">
    <div id="statusText">listening...</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

const API = "https://iao-ai-v3.oceano-masoud.workers.dev/";

// SCENA THREE.JS
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// GEOMETRIA PARTICELLE "NEURONI"
const count = 1500;
const geometry = new THREE.BufferGeometry();
const spherePositions = new Float32Array(count * 3);
const ringPositions = new Float32Array(count * 3);
const currentPositions = new Float32Array(count * 3);

for(let i = 0; i < count; i++) {
    // 1. Posizioni Sfera (Listening)
    const r = 1.6 * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    
    spherePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    spherePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    spherePositions[i*3+2] = r * Math.cos(phi);

    // 2. Posizioni Anello/Toroide (Speaking/Thinking)
    const ringR = 1.8 + (Math.random() - 0.5) * 0.4;
    const ringAngle = Math.random() * Math.PI * 2;
    const tubeR = (Math.random() - 0.5) * 0.3;
    const tubeAngle = Math.random() * Math.PI * 2;

    ringPositions[i*3] = (ringR + tubeR * Math.cos(tubeAngle)) * Math.cos(ringAngle);
    ringPositions[i*3+1] = (ringR + tubeR * Math.cos(tubeAngle)) * Math.sin(ringAngle);
    ringPositions[i*3+2] = tubeR * Math.sin(tubeAngle);

    // Inizializza
    currentPositions[i*3] = spherePositions[i*3];
    currentPositions[i*3+1] = spherePositions[i*3+1];
    currentPositions[i*3+2] = spherePositions[i*3+2];
}

geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

// MATERIALE PARTICELLE
const pMaterial = new THREE.PointsMaterial({
    color: 0x22aaff,
    size: 0.025,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// NUCLEO CENTRALE LUMINOSO
const coreGeo = new THREE.SphereGeometry(0.25, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({
    color: 0x88ddff,
    transparent: true,
    opacity: 0.9
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

// STATO ANIMAZIONE (0 = Sfera, 1 = Anello)
let morphTarget = 0; 
let morphProgress = 0;

function animate() {
    requestAnimationFrame(animate);

    // Transizione Morphing tra Sfera e Anello
    morphProgress += (morphTarget - morphProgress) * 0.05;

    const pos = geometry.attributes.position.array;
    for(let i = 0; i < count * 3; i++) {
        pos[i] = spherePositions[i] + (ringPositions[i] - spherePositions[i]) * morphProgress;
    }
    geometry.attributes.position.needsUpdate = true;

    // Rotazione
    particleSystem.rotation.y += 0.003;
    if(morphTarget === 1) {
        particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, 0.8, 0.05);
    } else {
        particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, 0.0, 0.05);
    }

    // Effetto pulsazione nucleo
    const time = performance.now() * 0.003;
    coreMesh.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
    coreMesh.visible = morphProgress < 0.5; // Scompare quando diventa anello

    renderer.render(scene, camera);
}

animate();

// LOGICA E VOCALE
const statusText = document.getElementById("statusText");
const chat = document.getElementById("chat");
const micBtn = document.getElementById("micBtn");

function setJarvisState(state) {
    if(state === "listening") {
        morphTarget = 0; // Sfera
        statusText.textContent = "listening...";
    } else if(state === "speaking" || state === "thinking") {
        morphTarget = 1; // Anello 3D
        statusText.textContent = state === "thinking" ? "thinking..." : "speaking...";
    }
}

function addMsg(text, type) {
    chat.innerHTML = `<div class="msg">${text}</div>`;
}

// RICONOSCIMENTO VOCALE
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(Recognition) {
    const rec = new Recognition();
    rec.lang = 'it-IT';

    rec.onstart = () => setJarvisState("listening");
    rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        addMsg(text, "user");
        processAi(text);
    };
    rec.onend = () => {};

    micBtn.onclick = () => {
        try { rec.start(); } catch{}
    };
}

async function processAi(text) {
    setJarvisState("thinking");
    try {
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        const reply = data.reply || "Elaborazione completata.";
        addMsg(reply, "jarvis");
        speak(reply);
    } catch {
        speak("Errore di connessione.");
    }
}

function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.onstart = () => setJarvisState("speaking");
    u.onend = () => setJarvisState("listening");
    speechSynthesis.speak(u);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
