<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA - Interactive Star Particle System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam-video {
            display: none;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <video id="webcam-video" playsinline></video>
    <div id="ui">NEBULA STAR ACTIVE - Muovi la mano per interagire</div>

    <script>
        // Setup della scena Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Creazione del Sistema di Particelle a forma di Stella
        const particleCount = 20000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorPalette = [
            new THREE.Color('#ff3399'), // Rosa fucsia
            new THREE.Color('#33ccff'), // Azzurro neon
            new THREE.Color('#9933ff'), // Viola
            new THREE.Color('#ffffff'), // Bianco luminoso
            new THREE.Color('#33ff99')  // Verde chiaro sfumato
        ];

        for (let i = 0; i < particleCount * 3; i += 3) {
            // Algoritmo per distribuire le particelle lungo una forma a stella a 5 punte
            const u = Math.random() * Math.PI * 2;
            const t = Math.random();
            
            // Raggio variabile basato su un'onda a 5 punte (stella)
            const arms = 5;
            const rBase = 1.0 + 0.8 * Math.abs(Math.cos(arms * u / 2));
            const r = rBase * (0.2 + 0.8 * Math.random());

            const x = r * Math.cos(u) * (1.2 - t * 0.4);
            const y = r * Math.sin(u) * (1.2 - t * 0.4);
            // Spessore tridimensionale della stella
            const z = (Math.random() - 0.5) * 0.6 * (2.0 - r);

            positions[i] = x;
            positions[i + 1] = y;
            positions[i + 2] = z;

            // Assegnazione colori casuali dalla palette
            const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i] = randomColor.r;
            colors[i + 1] = randomColor.g;
            colors[i + 2] = randomColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Materiale delle particelle luminoso ed effetto dissolvenza additiva
        const material = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.85,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Variabili per l'interazione con la mano
        let handPosition = { x: 0, y: 0, active: false };

        // Gestione MediaPipe Hands
        const videoElement = document.getElementById('webcam-video');

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8]; // Dito indice
                
                handPosition.x = (indexFinger.x - 0.5) * -4;
                handPosition.y = (indexFinger.y - 0.5) * -4;
                handPosition.active = true;
            } else {
                handPosition.active = false;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // Loop di Animazione
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const positionAttribute = geometry.attributes.position;

            // Leggera rotazione continua della stella nello spazio
            particleSystem.rotation.z = elapsedTime * 0.05;

            // Interazione con la posizione della mano rilevata dalla webcam
            for (let i = 0; i < particleCount; i++) {
                let px = positionAttribute.getX(i);
                let py = positionAttribute.getY(i);
                let pz = positionAttribute.getZ(i);

                if (handPosition.active) {
                    const dx = handPosition.x - px;
                    const dy = handPosition.y - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Attrazione magnetica verso il dito
                    if (dist < 2.5) {
                        px += dx * 0.03;
                        py += dy * 0.03;
                    }
                }

                positionAttribute.setXYZ(i, px, py, pz);
            }
            positionAttribute.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Gestione ridimensionamento finestra
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
