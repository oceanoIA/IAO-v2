<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =====================================================
   RETE
===================================================== */

#network {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* =====================================================
   TITOLO
===================================================== */

.title {
    position: fixed;
    top: 25px;
    left: 0;
    right: 0;

    text-align: center;

    z-index: 5;

    font-size: 31px;
    font-weight: 300;

    letter-spacing: 12px;

    color: #f4ffff;

    text-shadow:
        0 0 8px rgba(0,234,255,.9),
        0 0 30px rgba(0,234,255,.3);
}

.status {
    margin-top: 8px;

    font-size: 8px;
    letter-spacing: 4px;

    color: rgba(255,255,255,.4);
}

.status b {
    color: #00eaff;

    text-shadow:
        0 0 12px #00eaff;
}

/* =====================================================
   CHAT
===================================================== */

#chat {
    position: fixed;

    left: 15px;
    right: 15px;

    bottom: 90px;

    max-height: 25vh;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 8px;

    z-index: 10;
}

.message {
    max-width: 82%;

    padding: 11px 14px;

    border-radius: 13px;

    font-size: 14px;
    line-height: 1.4;

    backdrop-filter: blur(15px);
}

.user {
    align-self: flex-end;

    background:
        rgba(0,220,255,.055);

    border:
        1px solid
        rgba(0,220,255,.25);
}

.jarvis {
    align-self: flex-start;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(0,220,255,.13);
}

/* =====================================================
   INPUT
===================================================== */

.input-area {
    position: fixed;

    left: 15px;
    right: 15px;

    bottom: 16px;

    display: flex;

    gap: 9px;

    z-index: 20;
}

input {
    flex: 1;

    height: 52px;

    padding: 0 18px;

    border-radius: 28px;

    outline: none;

    border:
        1px solid
        rgba(0,234,255,.25);

    background:
        rgba(0,0,0,.85);

    color: white;

    font-size: 15px;

    backdrop-filter: blur(20px);
}

input:focus {
    border-color:
        rgba(0,234,255,.7);

    box-shadow:
        0 0 25px
        rgba(0,234,255,.12);
}

button {
    width: 52px;
    height: 52px;

    border: none;
    border-radius: 50%;

    background: #00eaff;

    color: #001015;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 0 18px
        rgba(0,234,255,.6),

        0 0 45px
        rgba(0,234,255,.18);
}

button:active {
    transform: scale(.9);
}

@media (max-width: 500px) {

    .title {
        font-size: 28px;
        letter-spacing: 9px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     TITOLO
===================================================== -->

<div class="title">

    JARVIS

    <div class="status">

        <b>●</b>
        NEURAL NETWORK ONLINE

    </div>

</div>


<!-- =====================================================
     RETE NEURALE
===================================================== -->

<canvas id="network"></canvas>


<!-- =====================================================
     CHAT
===================================================== -->

<div id="chat">

    <div class="message jarvis">

        Sistema online.
        Sono JARVIS.

    </div>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
    >

    <button id="send">
        ➤
    </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("network");

const ctx =
    canvas.getContext("2d");

let width;
let height;
let dpr;

let centerX;
let centerY;


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    centerX =
        width / 2;

    centerY =
        height / 2 - 20;

    createNetwork();
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   NODI
===================================================== */

/*
   Prima erano 145.

   Ora sono molti meno,
   per dare un aspetto più pulito.
*/

const NODE_COUNT = 65;

const nodes = [];


function createNetwork() {

    nodes.length = 0;

    const radiusX =
        Math.min(
            width * .35,
            330
        );

    const radiusY =
        Math.min(
            height * .30,
            240
        );


    for (
        let i = 0;
        i < NODE_COUNT;
        i++
    ) {

        const angle =
            Math.random()
            *
            Math.PI
            *
            2;


        const distance =
            Math.pow(
                Math.random(),
                .60
            );


        const baseX =
            centerX
            +
            Math.cos(angle)
            *
            radiusX
            *
            distance;


        const baseY =
            centerY
            +
            Math.sin(angle)
            *
            radiusY
            *
            distance;


        nodes.push({

            x: baseX,
            y: baseY,

            baseX: baseX,
            baseY: baseY,

            angle:
                Math.random()
                *
                Math.PI
                *
                2,

            radius:
                Math.random()
                * 22
                + 6,

            speed:
                Math.random()
                * .0008
                + .0003,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            size:
                Math.random()
                * 2.1
                + 1.5,

            energy:
                Math.random()

        });
    }
}


/* =====================================================
   IMPULSI
===================================================== */

const pulses = [];

let thinking = false;


function createPulse() {

    if (
        nodes.length < 2
    ) {
        return;
    }


    const start =
        Math.floor(
            Math.random()
            *
            nodes.length
        );


    let end =
        Math.floor(
            Math.random()
            *
            nodes.length
        );


    while (
        start === end
    ) {

        end =
            Math.floor(
                Math.random()
                *
                nodes.length
            );
    }


    pulses.push({

        start:
            nodes[start],

        end:
            nodes[end],

        progress:
            0,

        speed:
            thinking
            ? .025
            : .011
    });
}


/* =====================================================
   GENERAZIONE IMPULSI
===================================================== */

setInterval(
    () => {

        const amount =
            thinking
            ? 4
            : 1;


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            createPulse();
        }

    },
    210
);


/* =====================================================
   ANELLI
===================================================== */

let ringRotation = 0;


function drawRing(
    radius,
    speed,
    opacity,
    vertical
) {

    ringRotation += speed;


    ctx.save();


    ctx.translate(
        centerX,
        centerY
    );


    ctx.rotate(
        ringRotation
    );


    ctx.scale(
        1,
        vertical
    );


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        `rgba(
            0,
            220,
            255,
            ${opacity}
        )`;


    ctx.lineWidth =
        .7;


    ctx.stroke();


    ctx.restore();
}


/* =====================================================
   ANIMAZIONE PRINCIPALE
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now();


    /*
       Sfondo.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.20)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* =================================================
       MOVIMENTO DEI NODI
    ================================================= */

    nodes.forEach(
        node => {

            /*
               Movimento orbitale.
            */

            node.angle +=
                node.speed *
                (
                    thinking
                    ? 2.5
                    : 1
                );


            /*
               Movimento principale.
            */

            node.x =
                node.baseX
                +
                Math.cos(
                    node.angle +
                    node.phase
                )
                *
                node.radius;


            node.y =
                node.baseY
                +
                Math.sin(
                    node.angle +
                    node.phase
                )
                *
                node.radius;


            /*
               Movimento secondario.

               Questo rende la rete
               più organica.
            */

            node.x +=
                Math.sin(
                    time * .001 +
                    node.phase
                )
                *
                (
                    thinking
                    ? 12
                    : 6
                );


            node.y +=
                Math.cos(
                    time * .0013 +
                    node.phase
                )
                *
                (
                    thinking
                    ? 12
                    : 6
                );


            /*
               Pulsazione.
            */

            node.energy =
                (
                    Math.sin(
                        time * .0025 +
                        node.phase
                    )
                    +
                    1
                )
                / 2;
        }
    );


    /* =================================================
       CONNESSIONI CIANO
    ================================================= */

    for (
        let i = 0;
        i < nodes.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < nodes.length;
            j++
        ) {

            const a =
                nodes[i];

            const b =
                nodes[j];


            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance < 125
            ) {

                const opacity =
                    (
                        1 -
                        distance / 125
                    )
                    *
                    (
                        thinking
                        ? .42
                        : .22
                    );


                ctx.beginPath();


                ctx.moveTo(
                    a.x,
                    a.y
                );


                ctx.lineTo(
                    b.x,
                    b.y
                );


                ctx.strokeStyle =
                    `rgba(
                        0,
                        225,
                        255,
                        ${opacity}
                    )`;


                ctx.lineWidth =
                    thinking
                    ? .9
                    : .5;


                ctx.stroke();
            }
        }
    }


    /* =================================================
       IMPULSI CIANO
    ================================================= */

    for (
        let i =
            pulses.length - 1;

        i >= 0;

        i--
    ) {

        const pulse =
            pulses[i];


        pulse.progress +=
            pulse.speed;


        if (
            pulse.progress >= 1
        ) {

            pulses.splice(
                i,
                1
            );

            continue;
        }


        const x =
            pulse.start.x
            +
            (
                pulse.end.x -
                pulse.start.x
            )
            *
            pulse.progress;


        const y =
            pulse.start.y
            +
            (
                pulse.end.y -
                pulse.start.y
            )
            *
            pulse.progress;


        /*
           Grande alone ciano.
        */

        const glow =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                thinking
                ? 22
                : 15
            );


        glow.addColorStop(
            0,
            "rgba(255,255,255,.95)"
        );


        glow.addColorStop(
            .18,
            "rgba(0,240,255,.95)"
        );


        glow.addColorStop(
            1,
            "rgba(0,200,255,0)"
        );


        ctx.fillStyle =
            glow;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            thinking
            ? 22
            : 15,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.fillStyle =
            "#ffffff";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            thinking
            ? 3
            : 2,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }


    /* =================================================
       NODI GIALLI
    ================================================= */

    nodes.forEach(
        node => {

            const energy =
                node.energy;


            const size =
                node.size
                +
                energy *
                (
                    thinking
                    ? 2.5
                    : 1
                );


            /*
               Glow giallo/oro.
            */

            const glow =
                ctx.createRadialGradient(
                    node.x,
                    node.y,
                    0,
                    node.x,
                    node.y,
                    size * 10
                );


            glow.addColorStop(
                0,
                "rgba(255,255,255,.98)"
            );


            glow.addColorStop(
                .15,
                "rgba(255,230,80,.95)"
            );


            glow.addColorStop(
                .40,
                "rgba(255,190,0,.55)"
            );


            glow.addColorStop(
                1,
                "rgba(255,150,0,0)"
            );


            ctx.fillStyle =
                glow;


            ctx.beginPath();


            ctx.arc(
                node.x,
                node.y,
                size * 10,
                0,
                Math.PI * 2
            );


            ctx.fill();


            /*
               Centro del nodo.
            */

            ctx.fillStyle =
                "#ffe66b";


            ctx.beginPath();


            ctx.arc(
                node.x,
                node.y,
                size,
                0,
                Math.PI * 2
            );


            ctx.fill();
        }
    );


    /* =================================================
       ANELLI LENTI
    ================================================= */

    const speed =
        thinking
        ? 1.25
        : 1;


    const smallest =
        Math.min(
            width,
            height
        );


    drawRing(
        smallest * .27,
        .00008 * speed,
        .18,
        .30
    );


    drawRing(
        smallest * .34,
        -.000055 * speed,
        .12,
        .25
    );


    drawRing(
        smallest * .41,
        .000035 * speed,
        .07,
        .20
    );
}


animate();


/* =====================================================
   CHAT
===================================================== */

const input =
    document.getElementById(
        "input"
    );


const send =
    document.getElementById(
        "send"
    );


const chat =
    document.getElementById(
        "chat"
    );


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();
        }
    }
);


/* =====================================================
   INVIO A JARVIS
===================================================== */

async function sendMessage() {

    const text =
        input.value.trim();


    if (
        !text
    ) {
        return;
    }


    /*
       Messaggio utente.
    */

    const userMessage =
        document.createElement(
            "div"
        );


    userMessage.className =
        "message user";


    userMessage.textContent =
        text;


    chat.appendChild(
        userMessage
    );


    input.value = "";


    /*
       Messaggio JARVIS.
    */

    const jarvisMessage =
        document.createElement(
            "div"
        );


    jarvisMessage.className =
        "message jarvis";


    jarvisMessage.textContent =
        "Elaborazione...";


    chat.appendChild(
        jarvisMessage
    );


    /*
       ACCENDIAMO LA RETE.
    */

    thinking = true;


    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch(

                "https://iao-ai-v3.oceano-masoud.workers.dev/",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text

                        })
                }
            );


        const data =
            await response.json();


        jarvisMessage.textContent =
            data.reply
            ||
            "Non ho ricevuto una risposta.";


    }

    catch (
        error
    ) {

        console.error(
            error
        );


        jarvisMessage.textContent =
            "Errore di collegamento.";
    }


    /*
       Lasciamo l'animazione
       intensa ancora un attimo.
    */

    setTimeout(
        () => {

            thinking = false;

        },
        900
    );


    chat.scrollTop =
        chat.scrollHeight;
}

</script>

</body>
</html>
