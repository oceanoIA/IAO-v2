<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — NEURAL CORE</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;

    font:11px monospace;
    letter-spacing:4px;

    color:#62bfff;

    transition:opacity 1.2s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        filter 1.5s ease;
}

body.mapMode #neuralCanvas{
    opacity:0;
    transform:scale(.45);
    filter:blur(15px);
    pointer-events:none;
}


/* =====================================================
   EARTH
===================================================== */

#earthContainer{
    position:fixed;
    inset:0;

    z-index:2;

    opacity:0;
    pointer-events:none;

    transform:scale(.55);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

body.mapMode #earthContainer{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}

#earthCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;

    top:20px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;
}

.header h1{
    margin:0;

    font-size:30px;
    font-weight:300;

    letter-spacing:12px;

    color:#dff5ff;

    text-shadow:
        0 0 8px #168cff,
        0 0 20px #168cff,
        0 0 45px rgba(30,150,255,.65),
        0 0 80px rgba(30,150,255,.25);

    transition:
        text-shadow 1.2s ease,
        color 1.2s ease;
}

.status{
    margin-top:8px;

    font:10px monospace;

    letter-spacing:3px;

    color:rgba(210,240,255,.75);
}

#dot{
    color:#39aaff;

    text-shadow:
        0 0 8px #168cff,
        0 0 18px #168cff;

    transition:
        color 1s ease;
}


/* =====================================================
   OROLOGIO
===================================================== */

#clockPanel{
    position:fixed;

    top:22px;
    right:22px;

    z-index:20;

    text-align:right;

    pointer-events:none;

    font-family:monospace;
}

#clock{
    font-size:15px;

    letter-spacing:2px;

    color:#e8f8ff;

    text-shadow:
        0 0 10px rgba(40,160,255,.5);
}

#date{
    margin-top:3px;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(100,190,255,.75);
}


/* =====================================================
   CHAT VOCALE
===================================================== */

#chat{
    position:fixed;

    z-index:25;

    left:50%;
    bottom:115px;

    transform:translateX(-50%);

    width:min(700px,calc(100% - 40px));

    max-height:34vh;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:10px;

    pointer-events:none;

    mask-image:linear-gradient(
        to bottom,
        transparent 0,
        black 12px,
        black 88%,
        transparent 100%
    );
}


/* =====================================================
   MESSAGGI
===================================================== */

.message{
    max-width:90%;

    padding:10px 15px;

    border-radius:15px;

    font-size:13px;

    line-height:1.5;

    text-align:center;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    animation:
        messageIn .5s ease;

    word-wrap:break-word;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   MESSAGGIO UTENTE
===================================================== */

.user{

    background:
        rgba(30,140,255,.08);

    border:
        1px solid
        rgba(50,170,255,.25);

    color:
        rgba(220,245,255,.9);

    box-shadow:
        0 0 20px
        rgba(20,130,255,.08);
}


/* =====================================================
   MESSAGGIO JARVIS
===================================================== */

.jarvis{

    background:
        linear-gradient(
            135deg,
            rgba(20,80,130,.20),
            rgba(0,5,12,.55)
        );

    border:
        1px solid
        rgba(60,180,255,.28);

    border-left:
        2px solid
        #168cff;

    color:#dff5ff;

    box-shadow:
        0 0 25px
        rgba(20,140,255,.10),
        inset 0 0 20px
        rgba(20,140,255,.03);
}


/* =====================================================
   PRIMO MESSAGGIO
===================================================== */

#chat .message.jarvis:first-child{

    font-size:16px;

    max-width:360px;

    padding:12px 17px;

    text-shadow:
        0 0 8px
        rgba(80,190,255,.35);
}


/* =====================================================
   CORE VOCALE
===================================================== */

#voiceCore{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:180px;
    height:180px;

    z-index:8;

    pointer-events:none;

    opacity:.9;
}


/* =====================================================
   ANELLI CORE
===================================================== */

.coreRing{

    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(35,155,255,.25);

    box-shadow:
        0 0 25px
        rgba(20,140,255,.10);

    transition:
        width 1.2s ease,
        height 1.2s ease,
        border-color 1.2s ease,
        box-shadow 1.2s ease;
}

.ring1{
    width:110px;
    height:110px;
}

.ring2{
    width:145px;
    height:145px;
}

.ring3{
    width:180px;
    height:180px;
}


/* =====================================================
   CORE CENTRALE
===================================================== */

#coreCenter{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:12px;
    height:12px;

    border-radius:50%;

    background:#dff8ff;

    box-shadow:
        0 0 8px #fff,
        0 0 20px #168cff,
        0 0 45px #168cff,
        0 0 75px rgba(20,140,255,.7);

    transition:
        transform 1s ease,
        box-shadow 1s ease;
}


/* =====================================================
   STATO ASCOLTO
===================================================== */

body.listening .coreRing{

    border-color:
        rgba(80,190,255,.75);

    box-shadow:
        0 0 30px
        rgba(30,150,255,.3);
}

body.listening #coreCenter{

    transform:
        translate(-50%,-50%)
        scale(1.8);

    box-shadow:
        0 0 10px #fff,
        0 0 25px #168cff,
        0 0 60px #168cff,
        0 0 100px rgba(20,140,255,.9);
}


/* =====================================================
   STATO PENSIERO
===================================================== */

body.thinking .coreRing{

    border-color:
        rgba(90,210,255,.9);

    box-shadow:
        0 0 45px
        rgba(20,150,255,.45);
}

body.thinking #coreCenter{

    transform:
        translate(-50%,-50%)
        scale(1.45);

}


/* =====================================================
   STATO VOCE
===================================================== */

body.speaking .coreRing{

    border-color:
        rgba(130,220,255,.85);

    box-shadow:
        0 0 40px
        rgba(30,160,255,.4);
}

body.speaking #coreCenter{

    transform:
        translate(-50%,-50%)
        scale(1.7);

}


/* =====================================================
   MAP HUD
===================================================== */

#mapHud{

    position:fixed;

    z-index:15;

    left:50%;
    top:90px;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;

    pointer-events:none;

    font:11px monospace;

    letter-spacing:3px;

    text-align:center;

    color:#5eb8ff;

    transition:
        opacity .8s ease,
        transform .8s ease;
}

body.mapMode #mapHud{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

#mapTitle{

    font-size:16px;

    letter-spacing:5px;

    margin-bottom:6px;

    text-shadow:
        0 0 15px #168cff;
}

#coordinates{

    font-size:10px;

    color:
        rgba(180,220,255,.85);
}


/* =====================================================
   LOCATION INFO
===================================================== */

#locationInfo{

    position:fixed;

    z-index:18;

    left:50%;
    top:58%;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:10px 18px;

    background:
        rgba(0,10,20,.75);

    border:
        1px solid
        rgba(40,160,255,.5);

    border-radius:12px;

    font:11px monospace;

    letter-spacing:2px;

    text-align:center;

    box-shadow:
        0 0 25px
        rgba(0,130,255,.15);

    transition:
        opacity .7s ease,
        transform .7s ease;
}

#locationInfo.visible{

    opacity:1;

    transform:
        translate(-50%,0);
}

#locationName{

    font-size:14px;

    color:#fff;

    margin-bottom:4px;
}

#locationCoords{

    color:#4faaff;
}


/* =====================================================
   NASCONDI COMPLETAMENTE INPUT
===================================================== */

.inputArea{
    display:none !important;
}


/* =====================================================
   MAP CROSSHAIR
===================================================== */

#mapCrosshair{

    position:fixed;

    z-index:12;

    left:50%;
    top:50%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .7s;
}

body.mapMode #mapCrosshair{
    opacity:.35;
}

#mapCrosshair::before,
#mapCrosshair::after{

    content:"";

    position:absolute;

    background:#168cff;

    box-shadow:
        0 0 8px #168cff;
}

#mapCrosshair::before{

    width:25px;
    height:1px;

    top:12px;
    left:0;
}

#mapCrosshair::after{

    width:1px;
    height:25px;

    left:12px;
    top:0;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{

        font-size:20px;

        letter-spacing:8px;
    }

    #clockPanel{

        top:15px;

        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #chat{

        bottom:80px;

        width:
            calc(100% - 24px);

        max-height:28vh;
    }

    .message{

        max-width:92%;

        font-size:12px;

        padding:8px 12px;
    }

    #chat .message.jarvis:first-child{

        font-size:15px;

        max-width:290px;
    }

    #voiceCore{

        width:150px;
        height:150px;
    }

    .ring1{
        width:90px;
        height:90px;
    }

    .ring2{
        width:120px;
        height:120px;
    }

    .ring3{
        width:150px;
        height:150px;
    }

}


/* =====================================================
   RIDUZIONE MOVIMENTO
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">
    JARVIS NEURAL CORE
</div>


<!-- =====================================================
     RETE NEURALE
===================================================== -->

<canvas id="neuralCanvas"></canvas>

<div id="earthContainer">

    <canvas id="earthCanvas"></canvas>

</div>


<!-- =====================================================

<div class="header">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status">

        <span id="dot">●</span>

        <span id="statusText">
            NEURAL INTERFACE ONLINE
        </span>

    </div>

</div>


<!-- =====================================================

===================================================== -->

<div id="clockPanel">

    </div>

</div>

</div>


<!-- =====================================================

<div id="chat">

    <div class="message jarvis">

        JARVIS online.<br>
        Neural Core inizializzato.<br><br>
        Pronuncia "JARVIS" per iniziare.

    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">

{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"

</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =====================================================
   API
===================================================== */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const neuralCanvas =
document.getElementById("neuralCanvas");

const neuralCtx =
neuralCanvas.getContext("2d");

const earthCanvas =
document.getElementById("earthCanvas");

const chat =
document.getElementById("chat");

const dot =
document.getElementById("dot");

const statusText =
document.getElementById("statusText");

const clock =
document.getElementById("clock");

const date =
document.getElementById("date");

const coordinates =
document.getElementById("coordinates");

const locationInfo =
document.getElementById("locationInfo");

const locationName =
document.getElementById("locationName");

const locationCoords =
document.getElementById("locationCoords");


/* =====================================================
   STATO
===================================================== */

let state =
    "idle";

let busy =
    false;

let listening =
    false;

let wakeListening =
    false;

let mapMode =
    false;

let recognition =
    null;

let wakeRecognition =
    null;

let recognitionGeneration =
    0;


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    memory =
        JSON.parse(
            localStorage.getItem(
                "jarvis_memory"
            ) || "[]"
        );

}catch{

    memory=[];

}

memory =
    memory.slice(-40);


function saveMemory(){

    memory =
        memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );

}


function remember(
    role,
    content
){

    if(!content)return;

    memory.push({

        role,
        content,
        time:Date.now()

    });

    saveMemory();

}


/* =====================================================
   STATO JARVIS
===================================================== */

function setState(newState){

    state =
        newState;

    document.body.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    if(newState!=="idle"){

        document.body.classList.add(
            newState
        );

    }


    if(

        newState==="listening" ||
        newState==="thinking" ||
        newState==="speaking"

    ){

        dot.style.color =
            "#38aaff";

    }else{

        dot.style.color =
            "#168cff";

    }


    if(newState==="listening"){

        statusText.textContent =
            "LISTENING...";

    }

    else if(newState==="thinking"){

        statusText.textContent =
            "NEURAL PROCESSING...";

    }

    else if(newState==="speaking"){

        statusText.textContent =
            "JARVIS SPEAKING...";

    }

    else{

        statusText.textContent =
            "NEURAL INTERFACE ONLINE";

    }

}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now =
        new Date();

    clock.textContent =
        now.toLocaleTimeString(
            "it-IT"
        );

    date.textContent =
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(
    type,
    text
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        text;

    chat.appendChild(
        element
    );


    while(
        chat.children.length > 8
    ){

        chat.removeChild(
            chat.firstChild
        );

    }

    return element;

}


/* =====================================================
   THREE.JS
===================================================== */

const earthScene =
    new THREE.Scene();


const earthCamera =
    new THREE.PerspectiveCamera(
        45,
        innerWidth/innerHeight,
        .1,
        100
    );


earthCamera.position.set(
    0,
    0,
    3.3
);


const earthRenderer =
    new THREE.WebGLRenderer({

        canvas:
            earthCanvas,

        antialias:true,

        alpha:true

    });


earthRenderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


earthRenderer.setSize(
    innerWidth,
    innerHeight
);


/* =====================================================
   LUCI
===================================================== */

const ambientLight =
    new THREE.AmbientLight(
        0x7890aa,
        1.1
    );

earthScene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    5,
    3,
    5
);

earthScene.add(
    sun
);


/* =====================================================
   TERRA
===================================================== */

const earthGroup =
    new THREE.Group();

earthScene.add(
    earthGroup
);


const earthGeometry =
    new THREE.SphereGeometry(
        1,
        128,
        128
    );


const textureLoader =
    new THREE.TextureLoader();


const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:
            earthTexture,

        shininess:
            18,

        specular:
            new THREE.Color(
                0x333333
            )

    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

earthGroup.add(
    earth
);


/* =====================================================
   ATMOSFERA
===================================================== */

const atmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.035,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x168cff,

            transparent:
                true,

            opacity:
                .12,

            side:
                THREE.BackSide

        })

    );

earthGroup.add(
    atmosphere
);


/* =====================================================
   GLOW
===================================================== */

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.08,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x168cff,

            transparent:
                true,

            opacity:
                .055,

            side:
                THREE.BackSide

        })

    );

earthGroup.add(
    glow
);


/* =====================================================
   MARKER
===================================================== */

const marker =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .022,
            24,
            24
        ),

        new THREE.MeshBasicMaterial({
            color:
                0x5ecbff
        })

    );

marker.visible =
    false;

earthGroup.add(
    marker
);


const markerRing =
    new THREE.Mesh(

        new THREE.RingGeometry(
            .035,
            .052,
            40
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x5ecbff,

            transparent:
                true,

            opacity:
                .95,

            side:
                THREE.DoubleSide

        })

    );

markerRing.visible =
    false;

earthGroup.add(
    markerRing
);


/* =====================================================
   CONTROLLI
===================================================== */

const controls =
    new OrbitControls(
        earthCamera,
        earthCanvas
    );

controls.enableDamping =
    true;

controls.dampingFactor =
    .06;

controls.enablePan =
    false;

controls.minDistance =
    1.25;

controls.maxDistance =
    6;


/* =====================================================
   MAPPA
===================================================== */

function openMap(){

    if(mapMode)return;

    mapMode =
        true;

    document.body.classList.add(
        "mapMode"
    );

    statusText.textContent =
        "EARTH NAVIGATION ONLINE";

}


function closeMap(){

    mapMode =
        false;

    document.body.classList.remove(
        "mapMode"
    );

    locationInfo.classList.remove(
        "visible"
    );

    marker.visible =
        false;

    markerRing.visible =
        false;

    zoomAnimating =
        false;

    setState(
        "idle"
    );

}


/* =====================================================
   COMANDO MAPPA
===================================================== */

function isMapCommand(text){

    const t =
        text.toLowerCase();

    return(

        t.includes(
            "apri la mappa"
        ) ||

        t.includes(
            "apri mappa"
        ) ||

        t.includes(
            "mostrami la mappa"
        ) ||

        t.includes(
            "mostra la mappa"
        ) ||

        t.includes(
            "mappa del mondo"
        ) ||

        t === "mappa"

    );

}


/* =====================================================
   ESTRAZIONE LUOGO
===================================================== */

function extractLocation(text){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower =
        text.toLowerCase();


    for(
        const prefix of patterns
    ){

        const index =
            lower.indexOf(
                prefix
            );


        if(index!==-1){

            let place =
                text.substring(
                    index +
                    prefix.length
                ).trim();


            place =
                place.replace(
                    /^(la|il|lo|un|una|a|ad)\s+/i,
                    ""
                );


            if(
                place.length > 1
            ){

                return place;

            }

        }

    }

    return null;

}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(
    place
){

    setState(
        "thinking"
    );

    coordinates.textContent =
        "SEARCHING LOCATION...";


    try{

        const url =
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(
                place
            );


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }


        const result =
            results[0];


        const lat =
            parseFloat(
                result.lat
            );


        const lon =
            parseFloat(
                result.lon
            );


        const name =
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");


        showLocation(
            name,
            lat,
            lon
        );


        return{

            name,
            lat,
            lon

        };


    }catch(error){

        console.error(
            error
        );

        coordinates.textContent =
            "LOCATION NOT FOUND";

        setState(
            "idle"
        );

        addMessage(
            "jarvis",
            "Non riesco a trovare questo luogo."
        );

        return null;

    }

}


/* =====================================================
   COORDINATE
===================================================== */

function formatCoordinates(
    lat,
    lon
){

    const latDir =
        lat >= 0
        ? "N"
        : "S";

    const lonDir =
        lon >= 0
        ? "E"
        : "W";


    return(

        Math.abs(lat)
            .toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon)
            .toFixed(4)
        +
        "° "
        +
        lonDir

    );

}

let zoomAnimating =
    false;

let zoomProgress =
    1;

let zoomStart =
    3.3;

let zoomEnd =
    1.55;

let targetQuaternion =
    new THREE.Quaternion();


function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi =
        (90-lat)
        *
        Math.PI/180;


    const theta =
        (lon+180)
        *
        Math.PI/180;


    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );

}


function focusEarth(
    lat,
    lon
){

    openMap();


    const target =
        latLonToVector3(
            lat,
            lon,
            1
        );


    marker.position.copy(
        target
            .clone()
            .multiplyScalar(
                1.025
            )
    );


    marker.visible =
        true;

    markerRing.visible =
        true;


    const direction =
        target
            .clone()
            .normalize();


    const front =
        new THREE.Vector3(
            0,
            0,
            1
        );


    targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion.setFromUnitVectors(
        direction,
        front
    );


    zoomStart =
        earthCamera.position.length();


    if(
        zoomStart < 2
    ){

        zoomStart =
            3.3;

        earthCamera.position.set(
            0,
            0,
            zoomStart
        );

    }


    zoomEnd =
        1.55;

    zoomProgress =
        0;

    zoomAnimating =
        true;

    controls.enabled =
        false;

    setState(
        "thinking"
    );

}


/* =====================================================
   RETE NEURALE
===================================================== */

let neuralWidth =
    innerWidth;

let neuralHeight =
    innerHeight;

let neuralCx =
    neuralWidth/2;

let neuralCy =
    neuralHeight/2;

let neuralRadius =
    Math.min(
        neuralWidth,
        neuralHeight
    ) * .30;

let neuralRotation =
    0;

let nodes=[];


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth =
        innerWidth;

    neuralHeight =
        innerHeight;


    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );


    neuralCanvas.width =
        neuralWidth*dpr;

    neuralCanvas.height =
        neuralHeight*dpr;


    neuralCanvas.style.width =
        neuralWidth+"px";

    neuralCanvas.style.height =
        neuralHeight+"px";


    neuralCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    neuralCx =
        neuralWidth/2;

    neuralCy =
        neuralHeight/2;


    neuralRadius =
        Math.min(
            neuralWidth,
            neuralHeight
        ) * .30;


    createNeuralNodes();

}


/* =====================================================
   NODI
===================================================== */

function createNeuralNodes(){

    nodes=[];


    for(
        let i=0;
        i<145;
        i++
    ){

        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .72 +
                    Math.random()*.55
                ),

            size:
                .7 +
                Math.random()*1.8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            special:
                Math.random() < .15,

            colorPhase:
                Math.random()
                *
                Math.PI
                *
                2

        });

    }

}


/* =====================================================
   ANIMAZIONE RETE
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );


    const time =
        performance.now()/1000;


    let speed =
        1;

    let energy =
        .2;


    if(
        state === "listening"
    ){

        speed =
            2.2;

        energy =
            .8;

    }


    if(
        state === "thinking"
    ){

        speed =
            3.2;

        energy =
            1.2;

    }


    if(
        state === "speaking"
    ){

        speed =
            2.6;

        energy =
            .95;

    }


    neuralRotation +=
        .004 * speed;


    neuralCtx.fillStyle =
        "rgba(0,0,0,.25)";


    neuralCtx.fillRect(
        0,
        0,
        neuralWidth,
        neuralHeight
    );


    let r =
        35;

    let g =
        155;

    let b =
        255;


    const pulse =
        (
            Math.sin(
                time*3
            )+1
        )/2;


    const glowSize =
        neuralRadius *
        (
            1.05 +
            energy*.55 +
            pulse*.18
        );


    const gradient =
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glowSize

        );


    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},.40)`
    );

    gradient.addColorStop(
        .35,
        `rgba(${r},${g},${b},.12)`
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    neuralCtx.fillStyle =
        gradient;


    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        glowSize,
        0,
        Math.PI*2
    );

    neuralCtx.fill();


    const projected=[];


    nodes.forEach(
        n=>{

            const rr =
                n.r +
                Math.sin(
                    time*2.2 +
                    n.phase
                )
                *
                energy *
                5;


            let x =
                rr *
                Math.sin(n.phi) *
                Math.cos(
                    n.theta +
                    neuralRotation
                );


            let y =
                rr *
                Math.cos(n.phi);


            let z =
                rr *
                Math.sin(n.phi) *
                Math.sin(
                    n.theta +
                    neuralRotation
                );


            if(
                state !== "idle"
            ){

                x +=
                    Math.sin(
                        time*1.8 +
                        n.phase
                    )
                    *
                    energy *
                    5;

                y +=
                    Math.cos(
                        time*2 +
                        n.phase
                    )
                    *
                    energy *
                    5;

            }


            const perspective =
                430 /
                (
                    430 +
                    z
                );


            projected.push({

                x:
                    neuralCx +
                    x *
                    perspective,

                y:
                    neuralCy +
                    y *
                    perspective,

                z,

                size:
                    n.size *
                    perspective,

                alpha:
                    Math.max(
                        .1,
                        Math.min(
                            1,
                            (
                                z+
                                neuralRadius
                            )
                            /
                            (
                                neuralRadius*2
                            )
                        )
                    ),

                phase:
                    n.phase

            });

        }
    );


    const maxDist =
        state === "thinking"
        ? 105
        : 78;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        for(
            let j=i+1;
            j<projected.length;
            j++
        ){

            const a =
                projected[i];

            const c =
                projected[j];


            const dx =
                a.x-c.x;

            const dy =
                a.y-c.y;


            const dist =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                dist < maxDist
            ){

                const alpha =
                    (
                        1 -
                        dist/maxDist
                    )
                    *
                    .27 *
                    a.alpha;


                neuralCtx.beginPath();

                neuralCtx.moveTo(
                    a.x,
                    a.y
                );

                neuralCtx.lineTo(
                    c.x,
                    c.y
                );


                neuralCtx.strokeStyle =
                    `rgba(${r},${g},${b},${alpha})`;

                neuralCtx.lineWidth =
                    .65;

                neuralCtx.stroke();

            }

        }

    }


    projected.forEach(
        n=>{

            const flicker =
                (
                    Math.sin(
                        time*5+
                        n.phase
                    )+1
                )/2;


            const size =
                n.size +
                flicker *
                (
                    state === "thinking"
                    ? 1.3
                    : .6
                );


            neuralCtx.fillStyle =
                `rgba(${r},${g},${b},${n.alpha*.25})`;

            neuralCtx.beginPath();

            neuralCtx.arc(
                n.x,
                n.y,
                size*4,
                0,
                Math.PI*2
            );

            neuralCtx.fill();


            neuralCtx.fillStyle =
                `rgba(${r},${g},${b},${n.alpha})`;

            neuralCtx.beginPath();

            neuralCtx.arc(
                n.x,
                n.y,
                size,
                0,
                Math.PI*2
            );

            neuralCtx.fill();

        }
    );


    const core =
        4.5 +
        pulse*1.5 +
        energy*1.5;


    neuralCtx.fillStyle =
        `rgba(${r},${g},${b},.35)`;


    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core*5,
        0,
        Math.PI*2
    );

    neuralCtx.fill();


    neuralCtx.fillStyle =
        "#e9fbff";


    neuralCtx.beginPath();

    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core,
        0,
        Math.PI*2
    );

    neuralCtx.fill();

}


/* =====================================================
   ANIMAZIONE TERRA
===================================================== */

let markerPulse =
    0;


function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );


    if(
        mapMode &&
        zoomAnimating
    ){

        zoomProgress +=
            .010;


        if(
            zoomProgress >= 1
        ){

            zoomProgress =
                1;

            zoomAnimating =
                false;

            controls.enabled =
                true;

            setState(
                "idle"
            );

        }


        const eased =
            1 -
            Math.pow(
                1-zoomProgress,
                3
            );


        const distance =
            zoomStart +
            (
                zoomEnd -
                zoomStart
            )
            *
            eased;


        const cameraDirection =
            earthCamera.position
                .clone()
                .normalize();


        earthCamera.position.copy(

            cameraDirection
                .multiplyScalar(
                    distance
                )

        );


        earthGroup.quaternion.slerp(
            targetQuaternion,
            .035
        );

    }


    controls.update();


    if(
        marker.visible
    ){

        markerPulse +=
            .06;


        const scale =
            1 +
            Math.sin(
                markerPulse
            )*.25;


        marker.scale.set(
            scale,
            scale,
            scale
        );


        markerRing.position.copy(
            marker.position
        );


        markerRing.lookAt(
            earthCamera.position
        );


        markerRing.scale.set(
            scale,
            scale,
            scale
        );

    }


    earthRenderer.render(
        earthScene,
        earthCamera
    );

}

        )

/* =====================================================
   VOCE
===================================================== */

function speak(
    text
){

    return new Promise(
        resolve=>{

            if(
                !("speechSynthesis" in window)
            ){

                setState(
                    "idle"
                );

                resolve();

                return;

            }


            speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                "it-IT";


            /*
             * Voce più profonda e lenta.
             * La voce esatta dipende dalle voci
             * disponibili sul dispositivo/browser.
             */

            utterance.rate =
                .82;

            utterance.pitch =
                .62;

            utterance.volume =
                1;


            const availableVoices =
                speechSynthesis.getVoices();


            const preferred =
                availableVoices.find(
                    voice =>
                        voice.lang
                            .toLowerCase()
                            .startsWith("it")
                );


            if(preferred){

                utterance.voice =
                    preferred;

            }


            utterance.onstart =
                ()=>{

                    setState(
                        "speaking"
                    );

                };


            utterance.onend =
                ()=>{

                    setState(
                        "idle"
                    );

                    resolve();

                };


            utterance.onerror =
                ()=>{

                    setState(
                        "idle"
                    );

                    resolve();

                };


            speechSynthesis.speak(
                utterance
            );

        }
    );

}

/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =====================================================
   WAKE WORD
===================================================== */

function stopWakeWord(){

    if(
        wakeRecognition
    ){

        try{

            wakeRecognition.abort();

        }catch{}

        wakeRecognition =
            null;

    }

    wakeListening =
        false;

}


function startWakeWord(){

    if(

        !Recognition ||

        busy ||

        listening ||

        wakeListening

    ){

        return;

    }


    stopWakeWord();


    const generation =
        ++recognitionGeneration;


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeListening =
        true;


    wakeRecognition.onresult =
        event=>{

            if(
                generation !==
                recognitionGeneration
            ){

                return;

            }


            for(
                let i=
                    event.resultIndex;

                i<
                    event.results.length;

                i++
            ){

                const transcript =
                    event.results[i][0]
                        .transcript
                        .toLowerCase()
                        .trim();


                if(
                    transcript.includes(
                        "jarvis"
                    )
                ){

                    stopWakeWord();

                    activateJarvis();

                    return;

                }

            }

        };


    wakeRecognition.onerror =
        event=>{

            console.log(
                "Wake word:",
                event.error
            );


            wakeListening =
                false;

            wakeRecognition =
                null;


            if(
                !busy
            ){

                setTimeout(
                    startWakeWord,
                    1000
                );

            }

        };


    wakeRecognition.onend =
        ()=>{

            wakeListening =
                false;

            wakeRecognition =
                null;


            if(
                !busy &&
                !listening
            ){

                setTimeout(
                    startWakeWord,
                    500
                );

            }

        };


    try{

        wakeRecognition.start();

    }catch(error){

        console.log(
            error
        );

        wakeListening =
            false;

        wakeRecognition =
            null;

        setTimeout(
            startWakeWord,
            1000
        );

    }

}


/* =====================================================
   ATTIVA JARVIS
===================================================== */

function activateJarvis(){

    if(
        busy ||
        listening
    ){

        return;

    }


    if(
        !Recognition
    ){

        addMessage(
            "jarvis",
            "Il riconoscimento vocale non è supportato da questo browser."
        );

        return;

    }


    stopWakeWord();


    setState(
        "listening"
    );


    startQuestionListening();

}


/* =====================================================
   ASCOLTO DELLA DOMANDA
===================================================== */

function startQuestionListening(){

    if(
        !Recognition ||
        listening
    ){

        return;

    }


    recognition =
        new Recognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    listening =
        false;


    recognition.onstart =
        ()=>{

            listening =
                true;

            setState(
                "listening"
            );

        };


    recognition.onresult =
        async event=>{

            let transcript =
                "";


            for(
                let i=
                    event.resultIndex;

                i<
                    event.results.length;

                i++
            ){

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            transcript =
                transcript.trim();


            if(
                !transcript
            ){

                return;

            }


            listening =
                false;


            await processVoiceCommand(
                transcript
            );

        };


    recognition.onerror =
        event=>{

            console.log(
                "Question recognition:",
                event.error
            );


            listening =
                false;


            setState(
                "idle"
            );


            if(
                event.error !==
                "aborted"
            ){

                setTimeout(
                    startWakeWord,
                    700
                );

            }

        };


    recognition.onend =
        ()=>{

            listening =
                false;

            recognition =
                null;


            /*
             * IMPORTANTE:
             * non riavviamo automaticamente
             * il microfono della domanda.
             *
             * Prima deve essere elaborata
             * la frase ricevuta.
             */

            if(
                state ===
                "listening"
            ){

                setState(
                    "idle"
                );

            }

        };


    try{

        recognition.start();

    }catch(error){

        console.log(
            error
        );

        listening =
            false;

        recognition =
            null;

        setState(
            "idle"
        );

        setTimeout(
            startWakeWord,
            700
        );

    }

}


/* =====================================================
   PROCESSA DOMANDA VOCALE
===================================================== */

async function processVoiceCommand(
    text
){

    if(
        busy
    ){

        return;

    }


    busy =
        true;


    stopWakeWord();


    addMessage(
        "user",
        text
    );


    remember(
        "user",
        text
    );


    const place =
        extractLocation(
            text
        );


    if(place){

        openMap();


        const answer =
            addMessage(
                "jarvis",
                "Localizzazione di "
                +
                place
                +
                "..."
            );


        const result =
            await searchPlace(
                place
            );


        if(result){

            answer.textContent =
                "Ho individuato "
                +
                result.name
                +
                ".";


            remember(
                "assistant",
                answer.textContent
            );


            await speak(
                answer.textContent
            );

        }


        busy =
            false;


        setState(
            "idle"
        );


        setTimeout(
            startWakeWord,
            700
        );


        return;

    }


    const local =
        localCommand(
            text
        );


    if(local){

        if(
            local !==
            "__LOCATION__"
        ){

            addMessage(
                "jarvis",
                local
            );


            remember(
                "assistant",
                local
            );


            await speak(
                local
            );

        }


        busy =
            false;


        setState(
            "idle"
        );


        setTimeout(
            startWakeWord,
            700
        );


        return;

    }


    setState(
        "thinking"
    );


    const answer =
        addMessage(
            "jarvis",
            "Analisi del Neural Core..."
        );


    const recentMemory =
        memory.slice(-24);


    const intelligentContext={

        assistantName:
            "JARVIS",

        language:
            "it-IT",

        currentTime:
            new Date()
                .toLocaleTimeString(
                    "it-IT"
                ),

        currentDate:
            new Date()
                .toLocaleDateString(
                    "it-IT"
                ),

        mapMode:
            mapMode,

        recentConversation:
            recentMemory,

        instructions:[

            "Rispondi sempre in italiano salvo richiesta diversa.",

            "Rispondi in modo naturale, diretto e intelligente.",

            "Non ripetere la domanda dell'utente.",

            "Non dire continuamente che sei un'intelligenza artificiale.",

            "Comportati come un assistente personale chiamato JARVIS.",

            "Se non sai qualcosa, non inventarla.",

            "Per risposte vocali usa frasi naturali e facili da ascoltare.",

            "Mantieni le risposte abbastanza concise durante la conversazione vocale."

        ]

    };


    try{

        const response =
            await fetch(
                API,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            memory:
                                recentMemory,

                            context:
                                intelligentContext

                        })

                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.reply
        ){

            throw new Error(
                "Risposta mancante"
            );

        }


        answer.textContent =
            data.reply;


        remember(
            "assistant",
            data.reply
        );


        await speak(
            data.reply
        );


    }catch(error){

        console.error(
            error
        );


        const errorText =
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        answer.textContent =
            errorText;


        await speak(
            errorText
        );

    }


    busy =
        false;


    setState(
        "idle"
    );


    /*
     * Dopo che JARVIS ha finito di parlare,
     * torna in attesa della parola JARVIS.
     */

    setTimeout(
        startWakeWord,
        800
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        resizeNeural();


        earthCamera.aspect =
            innerWidth/
            innerHeight;


        earthCamera.updateProjectionMatrix();


        earthRenderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   AVVIO
===================================================== */

resizeNeural();

animateNeural();

animateEarth();


setTimeout(
    ()=>{

        const loading =
            document.getElementById(
                "loading"
            );

        if(loading){

            loading.classList.add(
                "hidden"
            );

        }

        /*
         * Il browser normalmente richiede
         * una prima interazione dell'utente
         * prima di permettere l'uso del microfono.
         *
         * Dopo il primo avvio viene attivato
         * il sistema "JARVIS".
         */

        setTimeout(
            startWakeWord,
            1000
        );

    },
    1400
);


/* =====================================================
   API PUBBLICA
===================================================== */

window.JARVIS_EARTH={

    openMap,

    closeMap,

    searchPlace,

    showMyLocation,

    focusEarth

};


</script>
