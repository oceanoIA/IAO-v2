<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010405;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at center,
            #071719 0%,
            #020708 45%,
            #000 100%
        );
}

#webgl-container{
    position:fixed;
    inset:0;
    z-index:1;
}

.vignette{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 32%,
            rgba(0,0,0,.20) 68%,
            rgba(0,0,0,.72) 100%
        );
}


/* =====================================================
   TITOLO SOPRA IL CORE
===================================================== */

.jarvis-title{
    position:fixed;

    left:50%;
    top:14%;

    transform:translateX(-50%);

    z-index:8;
    pointer-events:none;

    font-size:clamp(30px,5vw,58px);
    font-weight:300;

    letter-spacing:
        clamp(7px,1.5vw,15px);

    color:rgba(255,255,255,.86);

    text-shadow:
        0 0 10px rgba(255,255,255,.15),
        0 0 28px rgba(0,255,255,.13);

    white-space:nowrap;

    transition:
        color .4s ease,
        text-shadow .4s ease;
}


/* =====================================================
   CHAT
===================================================== */

#chat{
    position:fixed;

    left:50%;
    bottom:92px;

    transform:translateX(-50%);

    z-index:15;

    width:min(620px,86%);

    text-align:center;

    pointer-events:none;
}

.msg{
    display:inline-block;

    max-width:100%;

    padding:10px 18px;

    border-radius:24px;

    border:
        1px solid
        rgba(0,255,255,.22);

    background:
        rgba(4,20,23,.38);

    backdrop-filter:blur(14px);

    color:
        rgba(235,255,255,.88);

    font-size:12px;

    line-height:1.45;

    animation:
        messageIn .3s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   COMANDO
===================================================== */

.command-wrapper{

    position:fixed;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    z-index:20;

    width:min(650px,90%);

    display:flex;
    align-items:center;

    padding:
        6px 7px 6px 21px;

    border-radius:40px;

    background:
        rgba(5,20,23,.35);

    border:
        1px solid
        rgba(100,255,255,.28);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 0 30px
        rgba(0,255,255,.055),

        inset 0 0 20px
        rgba(0,255,255,.025);

    transition:.3s ease;
}

.command-wrapper:focus-within{

    border-color:
        rgba(0,255,255,.65);

    box-shadow:
        0 0 25px
        rgba(0,255,255,.13),

        inset 0 0 25px
        rgba(0,255,255,.04);
}


/* =====================================================
   INPUT
===================================================== */

#textInput{

    flex:1;

    min-width:0;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:14px;

    padding:12px 5px;
}

#textInput::placeholder{
    color:
        rgba(255,255,255,.30);
}


/* =====================================================
   MICROFONO MINIMAL
===================================================== */

#micBtn{

    flex-shrink:0;

    width:39px;
    height:39px;

    margin-right:6px;

    border-radius:50%;

    border:
        1px solid
        rgba(150,255,255,.25);

    background:
        rgba(255,255,255,.035);

    color:
        rgba(220,255,255,.78);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.25s ease;
}


/* Microfono CSS */

.mic-icon{

    position:relative;

    width:9px;
    height:16px;

    border:
        1.5px solid
        currentColor;

    border-radius:8px;
}

.mic-icon::before{

    content:"";

    position:absolute;

    left:50%;
    bottom:-7px;

    width:14px;
    height:9px;

    transform:translateX(-50%);

    border:
        1.5px solid
        currentColor;

    border-top:none;

    border-radius:
        0 0 10px 10px;
}

.mic-icon::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:-11px;

    width:1.5px;
    height:5px;

    transform:translateX(-50%);

    background:currentColor;
}

#micBtn:hover{

    color:#00ffff;

    border-color:#00ffff;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.20);
}

#micBtn.active{

    color:#ffff00;

    border-color:#ffff00;

    box-shadow:
        0 0 20px
        rgba(255,255,0,.25);
}


/* =====================================================
   INVIA
===================================================== */

#sendBtn{

    flex-shrink:0;

    height:39px;

    padding:0 17px;

    border-radius:22px;

    border:
        1px solid
        rgba(0,255,255,.28);

    background:
        rgba(0,255,255,.055);

    color:
        rgba(220,255,255,.78);

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.25s ease;
}

#sendBtn:hover{

    color:white;

    border-color:#00ffff;

    background:
        rgba(0,255,255,.11);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.15);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .jarvis-title{

        top:12%;

        font-size:34px;

        letter-spacing:7px;
    }

    .command-wrapper{

        width:calc(100% - 24px);

        bottom:17px;

        padding-left:15px;
    }

    #textInput{
        font-size:13px;
    }

    #sendBtn{
        padding:0 12px;
    }

    #chat{
        bottom:82px;
        width:88%;
    }

    .msg{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div id="webgl-container"></div>

<div class="vignette"></div>


<!-- TITOLO -->

<div class="jarvis-title">
    J.A.R.V.I.S
</div>


<!-- CHAT -->

<div id="chat"></div>


<!-- COMANDO -->

<div class="command-wrapper">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        placeholder="Chiedi qualcosa a JARVIS..."
    >

    <button
        id="micBtn"
        aria-label="Microfono"
    >
        <span class="mic-icon"></span>
    </button>

    <button id="sendBtn">
        INVIA
    </button>

</div>


<!-- THREE -->

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/* =====================================================
   API
===================================================== */

const API =
    "https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   DOM
===================================================== */

const container =
    document.getElementById(
        "webgl-container"
    );

const chat =
    document.getElementById(
        "chat"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const title =
    document.querySelector(
        ".jarvis-title"
    );


/* =====================================================
   SCENA
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.z = 5.2;


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

container.appendChild(
    renderer.domElement
);


/* =====================================================
   GLOW PARTICELLA
===================================================== */

function createGlowTexture(){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width=64;
    canvas.height=64;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createRadialGradient(
            32,32,0,
            32,32,32
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        .16,
        "rgba(255,255,185,1)"
    );

    gradient.addColorStop(
        .34,
        "rgba(0,255,255,.95)"
    );

    gradient.addColorStop(
        .68,
        "rgba(0,180,210,.30)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,0,64,64
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


/* =====================================================
   NEURAL CLOUD
===================================================== */

const COUNT = 3000;

const geometry =
    new THREE.BufferGeometry();

const positions =
    new Float32Array(
        COUNT * 3
    );

const basePositions =
    new Float32Array(
        COUNT * 3
    );

const radii =
    new Float32Array(
        COUNT
    );

const theta =
    new Float32Array(
        COUNT
    );

const phi =
    new Float32Array(
        COUNT
    );

const seed =
    new Float32Array(
        COUNT
    );


/*
    Distribuzione più concentrata:
    permette alle punte di essere
    più visibili.
*/

for(
    let i=0;
    i<COUNT;
    i++
){

    const r =
        1.15 +
        Math.pow(
            Math.random(),
            .72
        ) * .70;


    const t =
        Math.random() *
        Math.PI * 2;


    const p =
        Math.acos(
            2 *
            Math.random() -
            1
        );


    radii[i]=r;
    theta[i]=t;
    phi[i]=p;

    seed[i]=
        Math.random()*100;


    const x =
        r *
        Math.sin(p) *
        Math.cos(t);

    const y =
        r *
        Math.sin(p) *
        Math.sin(t);

    const z =
        r *
        Math.cos(p);


    positions[i*3]=x;
    positions[i*3+1]=y;
    positions[i*3+2]=z;


    basePositions[i*3]=x;
    basePositions[i*3+1]=y;
    basePositions[i*3+2]=z;
}


geometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        positions,
        3
    )
);


/* =====================================================
   PARTICELLE PIÙ PICCOLE
===================================================== */

const particleMaterial =
    new THREE.PointsMaterial({

        color:
            new THREE.Color(
                0x00ffff
            ),

        size:
            .034,

        map:
            createGlowTexture(),

        transparent:
            true,

        opacity:
            .92,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const particles =
    new THREE.Points(
        geometry,
        particleMaterial
    );

scene.add(
    particles
);


/* =====================================================
   STATI
===================================================== */

let energyTarget=.12;

let energy=.12;

let state="idle";


const cyan =
    new THREE.Color(
        0x00ffff
    );

const yellow =
    new THREE.Color(
        0xffff00
    );

const currentColor =
    cyan.clone();


function setState(newState){

    state =
        newState;


    if(
        newState==="thinking"
    ){

        energyTarget=1;

        title.style.color=
            "#ffff00";

        title.style.textShadow=
            "0 0 10px rgba(255,255,0,.25),0 0 30px rgba(255,255,0,.18)";

    }else if(
        newState==="speaking"
    ){

        energyTarget=.85;

        title.style.color=
            "#ffff00";

        title.style.textShadow=
            "0 0 10px rgba(255,255,0,.25),0 0 30px rgba(255,255,0,.18)";

    }else if(
        newState==="listening"
    ){

        energyTarget=.65;

        title.style.color=
            "#00ffff";

        title.style.textShadow=
            "0 0 10px rgba(0,255,255,.25),0 0 30px rgba(0,255,255,.18)";

    }else{

        energyTarget=.12;

        title.style.color=
            "rgba(255,255,255,.86)";

        title.style.textShadow=
            "0 0 10px rgba(255,255,255,.15),0 0 28px rgba(0,255,255,.13)";
    }
}


/* =====================================================
   FUNZIONE VIRUS / PUNTE
===================================================== */

function spikeField(
    thetaValue,
    phiValue,
    time
){

    /*
       Diverse armoniche creano
       punte irregolari ma definite.
    */

    const a =
        Math.sin(
            thetaValue * 5 +
            time * 1.7
        );

    const b =
        Math.cos(
            phiValue * 7 -
            time * 1.2
        );

    const c =
        Math.sin(
            thetaValue * 9 +
            phiValue * 4 +
            time * 2.1
        );

    const d =
        Math.cos(
            thetaValue * 3 -
            phiValue * 8 -
            time * 1.5
        );


    let spikes =
        (
            a*.30 +
            b*.24 +
            c*.22 +
            d*.18
        );


    /*
       Rendiamo alcune zone
       molto più appuntite.
    */

    spikes =
        Math.sign(spikes) *
        Math.pow(
            Math.abs(spikes),
            3.0
        );


    return spikes;
}


/* =====================================================
   ANIMAZIONE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now()
        * .001;


    energy +=
        (
            energyTarget -
            energy
        ) * .045;


    currentColor.lerp(
        energy>.35
            ? yellow
            : cyan,
        .045
    );


    particleMaterial.color =
        currentColor;


    const pos =
        geometry.attributes
        .position.array;


    for(
        let i=0;
        i<COUNT;
        i++
    ){

        const index =
            i*3;


        const r =
            radii[i];

        const t =
            theta[i];

        const p =
            phi[i];

        const s =
            seed[i];


        /*
           Movimento base.
        */

        const breathing =
            Math.sin(
                time*2 +
                s
            ) * .035;


        /*
           Campo di punte.
        */

        const spikes =
            spikeField(
                t,
                p,
                time
            );


        /*
           Quando JARVIS è attivo
           le punte diventano molto
           più evidenti.
        */

        const spikeStrength =
            energy *
            .58;


        /*
           Distorsione tridimensionale.
        */

        const wave1 =
            Math.sin(
                p*6 +
                time*2.2 +
                s
            ) *
            .10 *
            energy;


        const wave2 =
            Math.cos(
                t*7 -
                time*1.7 +
                s
            ) *
            .10 *
            energy;


        const wave3 =
            Math.sin(
                (t+p)*5 +
                time*2.7
            ) *
            .08 *
            energy;


        /*
           Raggio finale.
        */

        let rr =
            r +
            breathing +
            spikes *
            spikeStrength +
            wave1 +
            wave2;


        /*
           Movimento X/Y/Z
           indipendente.
        */

        let x =
            rr *
            Math.sin(p) *
            Math.cos(t);

        let y =
            rr *
            Math.sin(p) *
            Math.sin(t);

        let z =
            rr *
            Math.cos(p);


        /*
           Onde tridimensionali.
        */

        x +=
            wave2 *
            Math.cos(
                time +
                s
            );

        y +=
            wave3 *
            Math.sin(
                time*1.3 +
                s
            );

        z +=
            wave1 *
            Math.cos(
                time*1.6 +
                s
            );


        /*
           Quando parla/pensa:
           il nucleo cambia continuamente
           forma.
        */

        if(
            energy>.3
        ){

            x +=
                Math.sin(
                    time*2.4 +
                    p*8 +
                    s
                ) *
                .09 *
                energy;

            y +=
                Math.cos(
                    time*2.1 +
                    t*9 +
                    s
                ) *
                .09 *
                energy;

            z +=
                Math.sin(
                    time*2.8 +
                    (t+p)*7
                ) *
                .11 *
                energy;
        }


        pos[index]=x;
        pos[index+1]=y;
        pos[index+2]=z;
    }


    geometry.attributes
        .position
        .needsUpdate=true;


    /*
       Rotazione molto lenta:
       il movimento principale
       NON è più la rotazione.
    */

    particles.rotation.y +=
        .0006 +
        energy*.001;

    particles.rotation.x =
        Math.sin(
            time*.25
        )*.045;

    particles.rotation.z =
        Math.cos(
            time*.18
        )*.025;


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   CHAT
===================================================== */

function addMsg(text){

    chat.innerHTML="";

    const msg =
        document.createElement(
            "div"
        );

    msg.className="msg";

    msg.textContent=text;

    chat.appendChild(
        msg
    );
}


/* =====================================================
   AI
===================================================== */

async function processAi(text){

    setState(
        "thinking"
    );


    try{

        const response =
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:text
                        })
                }
            );


        if(!response.ok)
            throw new Error(
                "API error"
            );


        const data =
            await response.json();


        const reply =
            data.reply ||
            "Elaborazione completata.";


        addMsg(
            reply
        );


        speak(
            reply
        );


    }catch(error){

        console.error(
            error
        );

        addMsg(
            "Errore di connessione."
        );

        speak(
            "Errore di connessione."
        );
    }
}


/* =====================================================
   INVIO
===================================================== */

function sendMessage(){

    const text =
        textInput.value.trim();


    if(!text)
        return;


    textInput.value="";


    addMsg(
        text
    );


    processAi(
        text
    );
}


sendBtn.addEventListener(
    "click",
    sendMessage
);


textInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter"
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =====================================================
   VOCE
===================================================== */

function speak(text){

    if(
        !("speechSynthesis"
        in window)
    )
        return;


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang=
        "it-IT";

    utterance.rate=
        .95;

    utterance.pitch=
        .85;

    utterance.volume=
        1;


    utterance.onstart=
        ()=>{

            setState(
                "speaking"
            );
        };


    utterance.onend=
        ()=>{

            setState(
                "idle"
            );
        };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition=null;

let listening=false;


if(Recognition){

    recognition =
        new Recognition();


    recognition.lang=
        "it-IT";

    recognition.continuous=
        false;

    recognition.interimResults=
        false;


    recognition.onstart=
        ()=>{

            listening=true;

            micBtn.classList.add(
                "active"
            );

            setState(
                "listening"
            );
        };


    recognition.onresult=
        event=>{

            const text =
                event
                .results[0][0]
                .transcript
                .trim();


            if(text){

                textInput.value=
                    text;

                sendMessage();
            }
        };


    recognition.onerror=
        ()=>{

            listening=false;

            micBtn.classList.remove(
                "active"
            );

            setState(
                "idle"
            );
        };


    recognition.onend=
        ()=>{

            listening=false;

            micBtn.classList.remove(
                "active"
            );

            if(
                state==="listening"
            ){

                setState(
                    "idle"
                );
            }
        };


    micBtn.addEventListener(
        "click",
        ()=>{

            if(listening){

                recognition.stop();

            }else{

                try{

                    recognition.start();

                }catch(e){

                    console.log(e);
                }
            }
        }
    );

}else{

    micBtn.disabled=true;

    micBtn.style.opacity=".3";
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   START
===================================================== */

setState(
    "idle"
);

</script>

</body>
</html>
