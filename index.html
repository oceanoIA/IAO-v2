<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARK-TECH // DUAL-HAND REALISTIC 3D MANIPULATOR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #0b0e14;
      font-family: 'Share Tech Mono', monospace;
      color: #00f3ff;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 243, 255, 0.02) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #video-input { display: none; }

    /* HUD Header */
    .stark-header {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 50px;
      background: linear-gradient(180deg, rgba(0, 243, 255, 0.12) 0%, rgba(1, 4, 8, 0) 100%);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .stark-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .security-badge {
      font-size: 10px;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
    }

    /* Left Control HUD */
    .ui-overlay {
      position: absolute;
      top: 70px; left: 24px;
      z-index: 10;
      width: 300px;
      padding: 20px;
      background: rgba(10, 16, 26, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 243, 255, 0.35);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(0, 243, 255, 0.9);
      border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 10px; color: rgba(0, 243, 255, 0.7); letter-spacing: 1px; }

    .stark-btn {
      width: 100%; height: 38px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #00f3ff;
      padding: 0 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stark-btn:hover {
      background: rgba(0, 243, 255, 0.3);
      border-color: #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    .telemetry-box {
      font-size: 11px;
      background: rgba(0, 243, 255, 0.03);
      border: 1px solid rgba(0, 243, 255, 0.15);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hand-card {
      border-left: 2px solid #00f3ff;
      padding-left: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hand-card.h2 {
      border-left-color: #ff007f;
    }
    .telemetry-row { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.7); }
    .telemetry-val { color: #00f3ff; font-weight: bold; }

    /* Camera Feed Panel */
    .camera-preview-container {
      position: absolute;
      bottom: 24px; right: 24px;
      z-index: 10;
      width: 220px; height: 165px;
      background: rgba(10, 16, 26, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 243, 255, 0.4);
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
      display: flex; flex-direction: column;
    }
    #hand-preview-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .preview-hud-tag {
      position: absolute; top: 6px; left: 8px;
      font-size: 9px; font-weight: bold; letter-spacing: 1px;
      color: #00f3ff; background: rgba(2, 12, 27, 0.8);
      padding: 2px 6px; border: 1px solid rgba(0, 243, 255, 0.3);
    }

    .hud-corner {
      position: absolute; width: 8px; height: 8px;
      border: 2px solid #00f3ff; pointer-events: none;
    }
    .top-left { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .top-right { top: -1px; right: -1px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: -1px; left: -1px; border-right: none; border-top: none; }
    .bottom-right { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="video-input"></video>
  <div id="canvas-container"></div>

  <div class="stark-header">
    <div class="stark-title">
      <span>DUAL-HAND REALISTIC 3D STUDIO</span>
      <span class="security-badge">VOLUME & PHYSICAL FLOOR ON</span>
    </div>
  </div>

  <div class="ui-overlay">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="panel-header">
      <span>3D CUBE CONTROLLER</span>
      <span style="color: #00f3ff; font-weight: bold;">[ACTIVE]</span>
    </div>
    
    <div class="control-group">
      <label>OPERA SUI BLOCCHI SOLIDI</label>
      <button class="stark-btn" onclick="spawnBlock()">+ AGGIUNGI CUBO 3D</button>
      <button class="stark-btn" style="background: rgba(255, 51, 102, 0.2); border-color: #ff3366; color: #ff3366;" onclick="clearBlocks()">RESET SCENA</button>
    </div>

    <div class="telemetry-box">
      <div class="hand-card">
        <div class="telemetry-row">
          <span style="color: #00f3ff; font-weight: bold;">MANO 1 (PALLINO CIANO):</span>
          <span id="h1-status" class="telemetry-val">CERCA...</span>
        </div>
        <div class="telemetry-row">
          <span>STATO:</span>
          <span id="h1-grab" class="telemetry-val">LIBERA</span>
        </div>
      </div>

      <div class="hand-card h2">
        <div class="telemetry-row">
          <span style="color: #ff007f; font-weight: bold;">MANO 2 (PALLINO ROSA):</span>
          <span id="h2-status" class="telemetry-val">CERCA...</span>
        </div>
        <div class="telemetry-row">
          <span>STATO:</span>
          <span id="h2-grab" class="telemetry-val">LIBERA</span>
        </div>
      </div>
    </div>
  </div>

  <div class="camera-preview-container">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>
    <span class="preview-hud-tag">OPTICAL FEED // DUAL HAND</span>
    <canvas id="hand-preview-canvas" width="320" height="240"></canvas>
  </div>

  <script>
    let scene, camera, renderer;
    let builderGroup;
    let blocks = [];
    let previewCanvas, previewCtx;

    // Colori dei blocchi 3D solidi
    const CUBE_COLORS = [0x00aaff, 0xff0055, 0x00ff88, 0xffaa00, 0x9900ff];

    // Controller per le due mani
    const controllers = [
      {
        id: 0,
        colorHex: 0x00f3ff,
        cursorMesh: null,
        laserMesh: null,
        grabbedBlock: null,
        grabOffset: new THREE.Vector3(),
        pos: new THREE.Vector3(),
        isPinching: false,
        statusEl: null,
        grabEl: null
      },
      {
        id: 1,
        colorHex: 0xff007f,
        cursorMesh: null,
        laserMesh: null,
        grabbedBlock: null,
        grabOffset: new THREE.Vector3(),
        pos: new THREE.Vector3(),
        isPinching: false,
        statusEl: null,
        grabEl: null
      }
    ];

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0e14);
      scene.fog = new THREE.FogExp2(0x0b0e14, 0.012);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 6, 28);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      builderGroup = new THREE.Group();
      scene.add(builderGroup);

      // --- ILLUMINAZIONE REALISTICA (VOLUME E OMBRE) ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(15, 30, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 100;
      dirLight.shadow.camera.left = -30;
      dirLight.shadow.camera.right = 30;
      dirLight.shadow.camera.top = 30;
      dirLight.shadow.camera.bottom = -30;
      scene.add(dirLight);

      const rimLight = new THREE.PointLight(0x00f3ff, 0.5, 50);
      rimLight.position.set(-10, 10, -10);
      scene.add(rimLight);

      // --- PIANO GRIGIO FISICO REALE ---
      const planeGeo = new THREE.PlaneGeometry(80, 80);
      const planeMat = new THREE.MeshStandardMaterial({
        color: 0x3a404a, // Grigio studio
        roughness: 0.6,
        metalness: 0.2
      });
      const floor = new THREE.Mesh(planeGeo, planeMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -6;
      floor.receiveShadow = true;
      builderGroup.add(floor);

      // Griglia tecnica discreta sopra il piano grigio
      const gridHelper = new THREE.GridHelper(80, 40, 0x00f3ff, 0x555c66);
      gridHelper.position.y = -5.95;
      builderGroup.add(gridHelper);

      // --- SETUP PALLINI E RAGGI DI AGGANCIO PER LE 2 MANI ---
      controllers.forEach((ctrl, idx) => {
        // Pallino indicatore (Cursor)
        const cursorGeo = new THREE.SphereGeometry(0.45, 32, 32);
        const cursorMat = new THREE.MeshStandardMaterial({
          color: ctrl.colorHex,
          emissive: ctrl.colorHex,
          emissiveIntensity: 0.8,
          roughness: 0.2
        });
        ctrl.cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
        ctrl.cursorMesh.visible = false;
        builderGroup.add(ctrl.cursorMesh);

        // Laser
        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        const laserMat = new THREE.LineBasicMaterial({ color: ctrl.colorHex, linewidth: 2, transparent: true, opacity: 0.9 });
        ctrl.laserMesh = new THREE.Line(laserGeo, laserMat);
        ctrl.laserMesh.visible = false;
        builderGroup.add(ctrl.laserMesh);

        ctrl.statusEl = document.getElementById(`h${idx + 1}-status`);
        ctrl.grabEl = document.getElementById(`h${idx + 1}-grab`);
      });

      // Genera 3 Cubi Solidi Iniziali
      spawnBlock(-6, -1.5, 0, CUBE_COLORS[0]);
      spawnBlock(0, 0, 0, CUBE_COLORS[1]);
      spawnBlock(6, -1.5, 0, CUBE_COLORS[2]);

      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    // --- CREAZIONE CUBO SOLIDO CON VOLUME REALISTICO ---
    function createBlockMesh(colorHex) {
      const size = 3.6;
      const boxGeo = new THREE.BoxGeometry(size, size, size);
      
      // Materiale Solido 3D Opaco con Riflessi
      const boxMat = new THREE.MeshStandardMaterial({
        color: colorHex || CUBE_COLORS[Math.floor(Math.random() * CUBE_COLORS.length)],
        roughness: 0.35,
        metalness: 0.3,
        flatShading: false
      });

      const mesh = new THREE.Mesh(boxGeo, boxMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Evidenziatore bordi definiti per un look pulito
      const edges = new THREE.EdgesGeometry(boxGeo);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
      const wireframe = new THREE.LineSegments(edges, lineMat);
      mesh.add(wireframe);

      // Salva colore originale per il ripristino
      mesh.userData = { originalColor: boxMat.color.getHex() };

      return mesh;
    }

    function spawnBlock(x, y, z, color) {
      const mesh = createBlockMesh(color);
      mesh.position.x = x !== undefined ? x : (Math.random() - 0.5) * 14;
      mesh.position.y = y !== undefined ? y : (Math.random() - 0.5) * 4 + 1;
      mesh.position.z = z !== undefined ? z : (Math.random() - 0.5) * 10;

      // NESSUNA ROTAZIONE CONTINUA
      builderGroup.add(mesh);
      blocks.push(mesh);
    }

    function clearBlocks() {
      for (let b of blocks) builderGroup.remove(b);
      blocks = [];
      controllers.forEach(c => {
        c.grabbedBlock = null;
        c.laserMesh.visible = false;
      });
    }

    function setBlockHighlight(block, mode, colorHex) {
      if (!block) return;
      if (mode === 'grab') {
        block.material.color.setHex(colorHex);
        block.material.emissive.setHex(colorHex);
        block.material.emissiveIntensity = 0.35;
      } else {
        block.material.color.setHex(block.userData.originalColor);
        block.material.emissive.setHex(0x000000);
        block.material.emissiveIntensity = 0;
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2, // ABILITATO TRACCIAMENTO SIMULTANEO 2 MANI
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
      });

      hands.onResults((results) => {
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        const detectedHandsCount = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

        controllers.forEach((ctrl, i) => {
          if (i < detectedHandsCount) {
            const landmarks = results.multiHandLandmarks[i];

            // Disegna feedback visivo della mano nella fotocamera
            drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, { color: i === 0 ? '#00f3ff' : '#ff007f', lineWidth: 2 });
            drawLandmarks(previewCtx, landmarks, { color: '#ffffff', lineWidth: 1, radius: 2 });

            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];

            // Punto esatto di contatto (Pinch) tra pollice e indice
            const pX = (thumbTip.x + indexTip.x) / 2;
            const pY = (thumbTip.y + indexTip.y) / 2;
            const pZ = (thumbTip.z + indexTip.z) / 2;

            // Distanza tra le due dita per attivare il gesto
            const dx = thumbTip.x - indexTip.x;
            const dy = thumbTip.y - indexTip.y;
            const dz = (thumbTip.z || 0) - (indexTip.z || 0);
            const pinchDist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            // Conversione Proiezione Coordinate 2D -> Spazio Realistico 3D Three.js
            const ndcX = (1 - pX) * 2 - 1; // Mirror orizzontale
            const ndcY = -(pY * 2 - 1);

            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();

            const targetZ = -pZ * 32;
            const distanceToPlane = (targetZ - camera.position.z) / dir.z;
            ctrl.pos.copy(camera.position).add(dir.multiplyScalar(distanceToPlane));

            // Aggiorna posizione Pallino
            ctrl.cursorMesh.position.copy(ctrl.pos);
            ctrl.cursorMesh.visible = true;

            // Soglia d'aggancio pinch
            ctrl.isPinching = (pinchDist < 0.08);

            ctrl.statusEl.innerText = "RILEVATA";
            ctrl.statusEl.style.color = ctrl.id === 0 ? "#00f3ff" : "#ff007f";

            // --- MANIPOLAZIONE CUBI SIMULTANEA ---
            if (ctrl.isPinching) {
              if (ctrl.grabbedBlock) {
                // SPOSTA IL CUBO NELLO SPAZIO SULL'ASSE X, Y, Z SENZA ROTAZIONE
                const targetPos = ctrl.pos.clone().sub(ctrl.grabOffset);
                ctrl.grabbedBlock.position.lerp(targetPos, 0.4);

                // Aggiorna Raggio Laser
                const positions = ctrl.laserMesh.geometry.attributes.position.array;
                positions[0] = ctrl.pos.x; positions[1] = ctrl.pos.y; positions[2] = ctrl.pos.z;
                positions[3] = ctrl.grabbedBlock.position.x; positions[4] = ctrl.grabbedBlock.position.y; positions[5] = ctrl.grabbedBlock.position.z;
                ctrl.laserMesh.geometry.attributes.position.needsUpdate = true;
                ctrl.laserMesh.visible = true;

                ctrl.grabEl.innerText = "PRESO CUBO!";
                ctrl.grabEl.style.color = "#ff3366";
              } else {
                // Trova il cubo più vicino NON ancora occupato dall'altra mano
                let closest = null;
                let minDist = 6.0;

                for (let block of blocks) {
                  // Controlla se l'altra mano sta già prendendo questo cubo
                  const isOtherHandGrabbing = controllers.some(other => other.id !== ctrl.id && other.grabbedBlock === block);
                  if (isOtherHandGrabbing) continue;

                  const d = ctrl.pos.distanceTo(block.position);
                  if (d < minDist) {
                    minDist = d;
                    closest = block;
                  }
                }

                if (closest) {
                  ctrl.grabbedBlock = closest;
                  ctrl.grabOffset.copy(ctrl.pos).sub(closest.position);
                  setBlockHighlight(closest, 'grab', ctrl.colorHex);
                }
              }
            } else {
              // Rilascio Presa
              if (ctrl.grabbedBlock) {
                setBlockHighlight(ctrl.grabbedBlock, 'normal');
                ctrl.grabbedBlock = null;
                ctrl.laserMesh.visible = false;
              }
              ctrl.grabEl.innerText = "LIBERA (PRONTA)";
              ctrl.grabEl.style.color = "#00f3ff";
            }

          } else {
            // Mano non rilevata
            ctrl.cursorMesh.visible = false;
            ctrl.laserMesh.visible = false;
            if (ctrl.grabbedBlock) {
              setBlockHighlight(ctrl.grabbedBlock, 'normal');
              ctrl.grabbedBlock = null;
            }
            ctrl.statusEl.innerText = "CERCA...";
            ctrl.statusEl.style.color = "#ff3366";
            ctrl.grabEl.innerText = "N/A";
          }
        });

        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640,
        height: 480
      });
      cameraUtils.start();
    }

    function animate() {
      requestAnimationFrame(animate);

      // NOTA: Nessuna rotazione dei blocchi qui! I cubi rimangono perfettamente stabili.
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
</html>
