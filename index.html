<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:1
}

.header{
position:fixed;
top:20px;
left:0;
width:100%;
text-align:center;
z-index:10;
pointer-events:none
}

.header h1{
margin:0;
font-size:25px;
font-weight:300;
letter-spacing:12px;
text-shadow:0 0 15px #ffd000
}

.status{
margin-top:7px;
font:10px monospace;
letter-spacing:3px
}

#dot{
color:#ffd000;
text-shadow:0 0 10px currentColor
}

.panel{
position:fixed;
top:25px;
z-index:10;
font:10px monospace;
line-height:1.8;
letter-spacing:2px;
color:rgba(255,210,0,.65)
}

.left{
left:22px;
border-left:2px solid rgba(255,210,0,.5);
padding-left:10px
}

.right{
right:22px;
text-align:right;
border-right:2px solid rgba(255,210,0,.5);
padding-right:10px
}

#clock{
font-size:15px;
color:#fff
}

#chat{
position:fixed;
z-index:20;
left:50%;
bottom:115px;
transform:translateX(-50%);
width:100%;
max-width:700px;
max-height:27vh;
overflow-y:auto;
padding:0 20px;
display:flex;
flex-direction:column;
gap:9px;
scrollbar-width:none
}

#chat::-webkit-scrollbar{
display:none
}

.message{
max-width:85%;
padding:10px 14px;
border-radius:6px;
font-size:14px;
line-height:1.5;
backdrop-filter:blur(10px)
}

.user{
align-self:flex-end;
background:rgba(255,190,0,.08);
border:1px solid rgba(255,190,0,.35);
border-right:3px solid #ffd000
}

.jarvis{
align-self:flex-start;
background:rgba(5,10,18,.82);
border:1px solid rgba(30,140,255,.25);
border-left:3px solid #168cff;
color:#dcecff
}

.inputArea{
position:fixed;
z-index:30;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:700px;
padding:0 15px
}

.inputBox{
display:flex;
gap:7px;
padding:5px;
background:rgba(5,7,10,.96);
border:1px solid rgba(255,190,0,.4);
border-radius:8px;
box-shadow:0 0 25px rgba(255,190,0,.06)
}

input{
flex:1;
min-width:0;
height:44px;
padding:0 14px;
background:transparent;
border:0;
outline:0;
color:#fff;
font-size:14px
}

input::placeholder{
color:rgba(255,255,255,.3)
}

button{
height:44px;
border-radius:5px;
border:1px solid rgba(255,190,0,.5);
background:rgba(255,190,0,.1);
color:#ffd000;
font-family:monospace;
font-weight:bold;
cursor:pointer
}

button:hover{
background:#ffd000;
color:#000
}

#mic,#conversation,#voiceButton{
width:48px;
font-size:17px
}

#send{
width:70px
}

.active{
background:#168cff!important;
border-color:#168cff!important;
color:#fff!important;
box-shadow:0 0 20px #168cff
}

#voicePanel{
position:fixed;
z-index:50;
right:20px;
bottom:75px;
display:none;
padding:12px;
background:rgba(5,8,12,.97);
border:1px solid rgba(30,140,255,.5);
border-radius:7px
}

#voiceSelect{
background:#05080c;
color:#fff;
border:1px solid #168cff;
padding:7px;
max-width:230px
}

#voiceButton{
position:fixed;
right:20px;
bottom:18px;
z-index:50
}

#conversation{
font-size:15px
}

@media(max-width:600px){

.panel{
display:none
}

.header h1{
font-size:20px;
letter-spacing:8px
}

.message{
max-width:90%
}

#chat{
position:fixed;
z-index:20;
left:50%;
bottom:105px;
transform:translateX(-50%);
width:100%;
max-width:650px;
max-height:80px;
overflow:hidden;
padding:0 20px;
display:flex;
flex-direction:column;
gap:6px;
scrollbar-width:none;
pointer-events:none;
}

#chat::-webkit-scrollbar{
display:none;
}

.message{
max-width:90%;
padding:7px 12px;
border-radius:4px;
font-size:12px;
line-height:1.4;
backdrop-filter:blur(8px);
opacity:.75;
animation:messageIn .25s ease;
}

.user{
align-self:flex-end;
background:rgba(255,190,0,.04);
border:1px solid rgba(255,190,0,.15);
border-right:2px solid rgba(255,210,0,.6);
}

.jarvis{
align-self:flex-start;
background:rgba(5,10,18,.45);
border:1px solid rgba(30,140,255,.12);
border-left:2px solid rgba(30,140,255,.6);
color:#dcecff;
}

@keyframes messageIn{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:.75;
transform:translateY(0);
}
}

#send{
width:62px
}

}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="panel left">
JARVIS CORE V9<br>
NEURAL ENGINE: ONLINE<br>
MEMORY: <span id="memoryCount">0</span>
</div>

<div class="panel right">
<div id="clock">--:--:--</div>
<div id="date">--</div>
STATE: <span id="state">IDLE</span>
</div>

<div class="header">
<h1>J.A.R.V.I.S.</h1>

<div class="status">
<span id="dot">●</span>
NEURAL INTERFACE ONLINE
</div>
</div>

<div id="chat">

<div class="message jarvis">
JARVIS online. Neural Core inizializzato.
</div>

</div>

<div id="voicePanel">
<select id="voiceSelect"></select>
</div>

<button id="voiceButton" title="Impostazioni voce">⚙</button>

<div class="inputArea">

<div class="inputBox">

<input
id="input"
type="text"
placeholder="Comunica con JARVIS..."
autocomplete="off">

<button
id="conversation"
title="Modalità conversazione">
🔊
</button>

<button
id="mic"
title="Microfono">
🎙
</button>

<button id="send">
INVIA
</button>

</div>

</div>


<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const conversation =
document.getElementById("conversation");

const chat =
document.getElementById("chat");

const stateEl =
document.getElementById("state");

const dot =
document.getElementById("dot");

const memoryCount =
document.getElementById("memoryCount");

const clock =
document.getElementById("clock");

const date =
document.getElementById("date");

const voiceButton =
document.getElementById("voiceButton");

const voicePanel =
document.getElementById("voicePanel");

const voiceSelect =
document.getElementById("voiceSelect");


/* =====================================================
   STATO
===================================================== */

let state = "idle";
let busy = false;
let listening = false;

let conversationMode = false;
let wakeMode = false;

let recognition = null;
let wakeRecognition = null;


/* =====================================================
   MEMORIA LOCALE
===================================================== */

let memory = [];

try{

memory =
JSON.parse(
localStorage.getItem("jarvis_memory") || "[]"
);

}catch(error){

memory = [];

}

memory =
memory.slice(-30);


function saveMemory(){

memory =
memory.slice(-30);

localStorage.setItem(
"jarvis_memory",
JSON.stringify(memory)
);

memoryCount.textContent =
memory.length;

}


function remember(role,content){

memory.push({
role:role,
content:content,
time:Date.now()
});

saveMemory();

}


saveMemory();


/* =====================================================
   STATO
===================================================== */

function setState(newState){

state =
newState;

stateEl.textContent =
newState.toUpperCase();

if(
newState === "listening" ||
newState === "thinking" ||
newState === "speaking"
){

dot.style.color =
"#168cff";

}else{

dot.style.color =
"#ffd000";

}

}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

const now =
new Date();

clock.textContent =
now.toLocaleTimeString(
"it-IT"
);

date.textContent =
now.toLocaleDateString(
"it-IT",
{
weekday:"short",
day:"2-digit",
month:"short"
}
).toUpperCase();

}

updateClock();

setInterval(
updateClock,
1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(type,text){

const element =
document.createElement("div");

element.className =
"message " + type;

element.textContent =
text;

chat.appendChild(
element
);

chat.scrollTop =
chat.scrollHeight;

return element;

}


/* =====================================================
   COMANDI LOCALI
===================================================== */

function localCommand(text){

const t =
text.toLowerCase();

if(
t.includes("che ore sono") ||
t.includes("che ora è") ||
t.includes("che ora e")
){

return (
"Sono le " +
new Date().toLocaleTimeString(
"it-IT",
{
hour:"2-digit",
minute:"2-digit"
}
) +
"."
);

}

if(
t.includes("che giorno è") ||
t.includes("che giorno e")
){

return (
"Oggi è " +
new Date().toLocaleDateString(
"it-IT",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
) +
"."
);

}

return null;

}


/* =====================================================
   INVIO
===================================================== */

send.onclick =
sendMessage;


input.addEventListener(
"keydown",
event => {

if(
event.key === "Enter"
){

event.preventDefault();

sendMessage();

}

});


async function sendMessage(){

const text =
input.value.trim();

if(
!text ||
busy
){

return;

}


busy = true;

input.value = "";

addMessage(
"user",
text
);

remember(
"user",
text
);


input.disabled = true;
send.disabled = true;
mic.disabled = true;
conversation.disabled = true;


setState(
"thinking"
);


/* COMANDO LOCALE */

const local =
localCommand(text);


if(local){

addMessage(
"jarvis",
local
);

remember(
"assistant",
local
);


/*
   La voce viene usata SOLO
   in modalità conversazione.
*/

if(conversationMode){

speak(local);

}else{

setState("idle");

}

finish();

return;

}


/* RISPOSTA */

const answer =
addMessage(
"jarvis",
"Elaborazione neurale..."
);


try{

const response =
await fetch(
API,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:text,

memory:
memory.slice(-20)

})

});


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


if(!data.reply){

throw new Error(
"Risposta mancante"
);

}


answer.textContent =
data.reply;


remember(
"assistant",
data.reply
);


/*
   IMPORTANTE:
   testo = nessuna voce
   conversazione = voce
*/

if(conversationMode){

speak(data.reply);

}else{

setState("idle");

}


}catch(error){

console.error(error);

answer.textContent =
"Non riesco a raggiungere il Neural Core.";

setState("idle");

}


finish();

}


/* =====================================================
   FINE RICHIESTA
===================================================== */

function finish(){

busy = false;

input.disabled = false;
send.disabled = false;
mic.disabled = false;
conversation.disabled = false;

input.focus();

}


/* =====================================================
   VOCI
===================================================== */

let voices = [];


function loadVoices(){

if(
!("speechSynthesis" in window)
){

return;

}


voices =
speechSynthesis.getVoices();

voiceSelect.innerHTML =
"";


voices.forEach(
(voice,index) => {

const option =
document.createElement(
"option"
);

option.value =
index;

option.textContent =
voice.name +
" — " +
voice.lang;

voiceSelect.appendChild(
option
);

});


const saved =
localStorage.getItem(
"jarvis_voice"
);


if(
saved !== null &&
voices[saved]
){

voiceSelect.value =
saved;

}

}


if(
"speechSynthesis" in window
){

speechSynthesis.onvoiceschanged =
loadVoices;

loadVoices();

}


voiceButton.onclick =
() => {

voicePanel.style.display =
voicePanel.style.display ===
"block"
? "none"
: "block";

};


voiceSelect.onchange =
() => {

localStorage.setItem(
"jarvis_voice",
voiceSelect.value
);

};


function speak(text){

if(
!("speechSynthesis" in window)
){

setState("idle");

return;

}


speechSynthesis.cancel();


const utterance =
new SpeechSynthesisUtterance(
text
);


utterance.lang =
"it-IT";

utterance.rate =
0.88;

utterance.pitch =
0.65;

utterance.volume =
1;


const selected =
parseInt(
voiceSelect.value
);


if(
voices[selected]
){

utterance.voice =
voices[selected];

}


utterance.onstart =
() => {

setState(
"speaking"
);

};


utterance.onend =
() => {

setState(
"idle"
);

if(
conversationMode &&
wakeMode
){

setTimeout(
startWakeWord,
600
);

}

};


utterance.onerror =
() => {

setState(
"idle"
);

};


speechSynthesis.speak(
utterance
);

}


/* =====================================================
   MODALITÀ CONVERSAZIONE
===================================================== */

conversation.onclick =
() => {

conversationMode =
!conversationMode;


if(
conversationMode
){

wakeMode =
true;

conversation.classList.add(
"active"
);

conversation.textContent =
"🔵";

setState(
"listening"
);

startWakeWord();

}else{

wakeMode =
false;

conversation.classList.remove(
"active"
);

conversation.textContent =
"🔊";

stopWakeWord();

if(
speechSynthesis
){

speechSynthesis.cancel();

}

setState(
"idle"
);

}

};


/* =====================================================
   MICROFONO
===================================================== */

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(Recognition){

recognition =
new Recognition();

recognition.lang =
"it-IT";

recognition.continuous =
false;

recognition.interimResults =
true;


recognition.onstart =
() => {

listening =
true;

mic.classList.add(
"active"
);

mic.textContent =
"■";

input.placeholder =
"JARVIS ti sta ascoltando...";

setState(
"listening"
);

};


recognition.onresult =
event => {

let transcript = "";


for(
let i=event.resultIndex;
i<event.results.length;
i++
){

transcript +=
event.results[i][0].transcript;

}


input.value =
transcript;


const last =
event.results[
event.results.length-1
];


if(
last.isFinal
){

setTimeout(
() => {

if(
input.value.trim()
){

sendMessage();

}

},
250
);

}

};


recognition.onerror =
event => {

console.log(
"Speech recognition:",
event.error
);

};


recognition.onend =
() => {

listening =
false;

mic.classList.remove(
"active"
);

mic.textContent =
"🎙";

input.placeholder =
"Comunica con JARVIS...";

if(
state === "listening"
){

setState(
"idle"
);

}

};


mic.onclick =
() => {

if(busy)
return;


conversationMode =
true;

wakeMode =
false;

conversation.classList.add(
"active"
);

conversation.textContent =
"🔵";


if(
listening
){

recognition.stop();

return;

}


try{

recognition.start();

}catch(error){

console.log(error);

}

};


}else{

mic.disabled =
true;

}


/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

if(
!Recognition ||
!conversationMode ||
!wakeMode ||
busy ||
listening ||
wakeRecognition
){

return;

}


wakeRecognition =
new Recognition();

wakeRecognition.lang =
"it-IT";

wakeRecognition.continuous =
true;

wakeRecognition.interimResults =
true;


wakeRecognition.onresult =
event => {

for(
let i=event.resultIndex;
i<event.results.length;
i++
){

const text =
event.results[i][0]
.transcript
.toLowerCase();


if(
text.includes("jarvis")
){

try{

wakeRecognition.stop();

}catch(e){}

wakeRecognition =
null;

activateJarvis();

return;

}

}

};


wakeRecognition.onerror =
() => {

wakeRecognition =
null;

if(
conversationMode &&
wakeMode &&
!busy &&
!listening
){

setTimeout(
startWakeWord,
1200
);

}

};


wakeRecognition.onend =
() => {

wakeRecognition =
null;

if(
conversationMode &&
wakeMode &&
!busy &&
!listening
){

setTimeout(
startWakeWord,
600
);

}

};


try{

wakeRecognition.start();

}catch(error){

wakeRecognition =
null;

}

}


function stopWakeWord(){

if(
wakeRecognition
){

try{

wakeRecognition.stop();

}catch(e){}

wakeRecognition =
null;

}

}


function activateJarvis(){

if(
busy ||
listening
){

return;

}


setState(
"listening"
);

input.placeholder =
"JARVIS ti ascolta...";


setTimeout(
() => {

try{

recognition.start();

}catch(error){

console.log(error);

}

},
250
);

}


/* =====================================================
   SFERA NEURALE
===================================================== */

let width =
innerWidth;

let height =
innerHeight;

let cx =
width/2;

let cy =
height/2;

let radius =
Math.min(
width,
height
)*.22;

let rotation =
0;

let nodes = [];


function resize(){

width =
innerWidth;

height =
innerHeight;


const dpr =
Math.min(
devicePixelRatio || 1,
2
);


canvas.width =
width*dpr;

canvas.height =
height*dpr;

canvas.style.width =
width+"px";

canvas.style.height =
height+"px";


ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);


cx =
width/2;

cy =
height/2;

radius =
Math.min(
width,
height
)*.22;


createNodes();

}


function createNodes(){

nodes = [];


for(
let i=0;
i<165;
i++
){

nodes.push({

theta:
Math.random() *
Math.PI*2,

phi:
Math.acos(
2*Math.random()-1
),

r:
radius *
(
.72+
Math.random()*.55
),

size:
.7+
Math.random()*1.8,

phase:
Math.random()*
Math.PI*2

});

}

}


function animate(){

requestAnimationFrame(
animate
);


const time =
performance.now()/1000;


let speed = 1;
let energy = .2;


if(
state === "listening"
){

speed = 4;
energy = 1.2;

}


if(
state === "thinking"
){

speed = 7;
energy = 2;

}


if(
state === "speaking"
){

speed = 5;
energy = 1.5;

}


rotation +=
.004*speed;


ctx.fillStyle =
"rgba(0,0,0,.28)";

ctx.fillRect(
0,
0,
width,
height
);


let target;


if(
state === "listening" ||
state === "thinking" ||
state === "speaking"
){

target = {
r:25,
g:140,
b:255
};

}else{

target = {
r:255,
g:195,
b:0
};

}


window.jarvisColor =
window.jarvisColor ||
{
r:255,
g:195,
b:0
};


jarvisColor.r +=
(
target.r -
jarvisColor.r
)*.055;

jarvisColor.g +=
(
target.g -
jarvisColor.g
)*.055;

jarvisColor.b +=
(
target.b -
jarvisColor.b
)*.055;


const r =
Math.round(
jarvisColor.r
);

const g =
Math.round(
jarvisColor.g
);

const b =
Math.round(
jarvisColor.b
);


const pulse =
(
Math.sin(
time*4
)+1
)/2;


const pulse2 =
(
Math.sin(
time*8
)+1
)/2;


const glow =
radius *
(
1.05+
energy*.7+
pulse*.18
);


/* GLOW */

const gradient =
ctx.createRadialGradient(
cx,
cy,
0,
cx,
cy,
glow
);


gradient.addColorStop(
0,
`rgba(${r},${g},${b},.48)`
);

gradient.addColorStop(
.35,
`rgba(${r},${g},${b},.15)`
);

gradient.addColorStop(
1,
"rgba(0,0,0,0)"
);


ctx.fillStyle =
gradient;


ctx.beginPath();

ctx.arc(
cx,
cy,
glow,
0,
Math.PI*2
);

ctx.fill();


/* NODI */

const projected = [];


nodes.forEach(
n => {

const rr =
n.r+
Math.sin(
time*3+n.phase
)*
energy*7;


let x =
rr*
Math.sin(n.phi)*
Math.cos(
n.theta+
rotation
);


let y =
rr*
Math.cos(n.phi);


let z =
rr*
Math.sin(n.phi)*
Math.sin(
n.theta+
rotation
);


if(
state !== "idle"
){

x +=
Math.sin(
time*2+n.phase
)*
energy*7;

y +=
Math.cos(
time*2.5+n.phase
)*
energy*7;

}


const perspective =
430/
(
430+z
);


projected.push({

x:
cx+x*perspective,

y:
cy+y*perspective,

z:z,

size:
n.size*perspective,

alpha:
Math.max(
.1,
Math.min(
1,
(z+radius)/
(radius*2)
)
),

phase:
n.phase

});

});


/* RETI */

const maxDist =
state === "thinking"
?110
:82;


for(
let i=0;
i<projected.length;
i++
){

for(
let j=i+1;
j<projected.length;
j++
){

const a =
projected[i];

const c =
projected[j];


const dx =
a.x-c.x;

const dy =
a.y-c.y;


const dist =
Math.sqrt(
dx*dx+
dy*dy
);


if(
dist < maxDist
){

const alpha =
(
1-
dist/maxDist
)*
.3*
a.alpha;


ctx.beginPath();

ctx.moveTo(
a.x,
a.y
);

ctx.lineTo(
c.x,
c.y
);


ctx.strokeStyle =
`rgba(${r},${g},${b},${alpha})`;

ctx.lineWidth =
state === "thinking"
? .9
: .65;

ctx.stroke();

}

}

}


/* PARTICELLE */

projected.forEach(
n => {

const flicker =
(
Math.sin(
time*7+n.phase
)+1
)/2;


const size =
n.size+
flicker*
(
state === "thinking"
?1.8
:.7
);


ctx.fillStyle =
`rgba(${r},${g},${b},${n.alpha*.28})`;


ctx.beginPath();

ctx.arc(
n.x,
n.y,
size*4,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle =
`rgba(255,255,255,${n.alpha})`;


ctx.beginPath();

ctx.arc(
n.x,
n.y,
size,
0,
Math.PI*2
);

ctx.fill();

});


/* CORE */

const core =
5+
pulse*2+
pulse2*1.5+
energy*2;


ctx.fillStyle =
`rgba(${r},${g},${b},.38)`;


ctx.beginPath();

ctx.arc(
cx,
cy,
core*5,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle =
"#fff";


ctx.beginPath();

ctx.arc(
cx,
cy,
core,
0,
Math.PI*2
);

ctx.fill();

}


window.addEventListener(
"resize",
resize
);


resize();

animate();

input.focus();

</script>

</body>
</html>
