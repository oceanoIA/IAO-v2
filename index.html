<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>JARVIS — NEURAL CORE</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font:11px monospace;
    letter-spacing:4px;
    color:#ffd000;
    transition:opacity 1s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   NEURAL CANVAS
===================================================== */

#neuralCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;

    transition:
        opacity 1.8s ease,
        transform 1.8s ease,
        filter 1.8s ease;
}

body.mapMode #neuralCanvas{
    opacity:0;
    transform:scale(.45);
    filter:blur(15px);
    pointer-events:none;
}


/* =====================================================
   EARTH
===================================================== */

#earthContainer{
    position:fixed;
    inset:0;
    z-index:2;

    opacity:0;
    pointer-events:none;
    transform:scale(.55);

    transition:
        opacity 1.8s ease,
        transform 1.8s ease;
}

body.mapMode #earthContainer{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}

#earthCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    top:20px;
    left:0;
    width:100%;
    text-align:center;
    z-index:20;
    pointer-events:none;
}

.header h1{
    margin:0;
    font-size:30px;
    font-weight:300;
    letter-spacing:12px;

    text-shadow:
        0 0 15px #ffd000,
        0 0 35px rgba(255,200,0,.35);
}

.status{
    margin-top:7px;
    font:10px monospace;
    letter-spacing:3px;
}

#dot{
    color:#ffd000;
    text-shadow:0 0 10px currentColor;
}

body.mapMode .header h1{
    text-shadow:
        0 0 15px #168cff,
        0 0 35px rgba(30,140,255,.4);
}


/* =====================================================
   OROLOGIO
===================================================== */

#clockPanel{
    position:fixed;
    top:22px;
    right:22px;
    z-index:20;
    text-align:right;
    pointer-events:none;
    font-family:monospace;
}

#clock{
    font-size:15px;
    letter-spacing:2px;
    color:#fff;
}

#date{
    margin-top:3px;
    font-size:9px;
    letter-spacing:2px;
    color:rgba(255,210,0,.65);
}

body.mapMode #clockPanel{
    color:#fff;
}

body.mapMode #date{
    color:rgba(80,170,255,.8);
}


/* =====================================================
   CHAT
===================================================== */

#chat{
    position:fixed;
    z-index:25;

    left:22px;
    top:125px;

    width:330px;

    max-height:calc(100vh - 245px);

    overflow-y:auto;

    display:flex;
    flex-direction:column;
    align-items:flex-start;

    gap:9px;

    padding:8px 4px 8px 0;

    scrollbar-width:none;

    mask-image:linear-gradient(
        to bottom,
        transparent 0,
        black 12px,
        black 92%,
        transparent 100%
    );
}

#chat::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   MESSAGGI
===================================================== */

.message{
    width:auto;
    max-width:92%;

    padding:9px 12px;

    border-radius:14px;

    font-size:12px;
    line-height:1.45;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    animation:messageIn .3s ease;

    word-wrap:break-word;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateX(-12px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}


/* =====================================================
   MESSAGGIO UTENTE
===================================================== */

.user{
    align-self:flex-end;

    background:rgba(255,190,0,.07);

    border:1px solid rgba(255,190,0,.28);

    border-right:2px solid #ffd000;

    color:#fff;

    border-radius:16px 16px 4px 16px;

    box-shadow:
        0 0 18px rgba(255,190,0,.04);
}


/* =====================================================
   MESSAGGIO JARVIS
===================================================== */

.jarvis{
    align-self:flex-start;

    width:auto;
    max-width:92%;

    background:rgba(3,7,13,.58);

    border:1px solid rgba(30,140,255,.16);

    border-left:2px solid #168cff;

    color:#dcecff;

    border-radius:4px 16px 16px 16px;

    box-shadow:
        0 0 18px rgba(20,130,255,.04);
}


/* =====================================================
   PRIMO MESSAGGIO JARVIS
   PIÙ GRANDE
===================================================== */

#chat .message.jarvis:first-child{

    font-size:16px;

    line-height:1.45;

    padding:10px 13px;

    max-width:290px;
}


/* =====================================================
   MAP HUD
===================================================== */

#mapHud{
    position:fixed;
    z-index:15;

    left:50%;
    top:90px;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;
    pointer-events:none;

    font:11px monospace;
    letter-spacing:3px;

    text-align:center;

    color:#5eb8ff;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

body.mapMode #mapHud{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

#mapTitle{
    font-size:16px;
    letter-spacing:5px;
    margin-bottom:6px;

    text-shadow:0 0 15px #168cff;
}

#coordinates{
    font-size:10px;
    color:rgba(180,220,255,.85);
}


/* =====================================================
   LOCATION INFO
===================================================== */

#locationInfo{
    position:fixed;
    z-index:18;

    left:50%;
    top:58%;

    transform:
        translate(-50%,20px);

    opacity:0;
    pointer-events:none;

    padding:10px 18px;

    background:rgba(0,10,20,.75);

    border:1px solid rgba(40,160,255,.5);

    border-radius:12px;

    font:11px monospace;
    letter-spacing:2px;

    text-align:center;

    box-shadow:
        0 0 25px rgba(0,130,255,.15);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#locationInfo.visible{
    opacity:1;

    transform:
        translate(-50%,0);
}

#locationName{
    font-size:14px;
    color:#fff;
    margin-bottom:4px;
}

#locationCoords{
    color:#4faaff;
}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea{
    position:fixed;

    z-index:40;

    bottom:18px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(
        700px,
        calc(100% - 40px)
    );
}


/* =====================================================
   CASELLA CHAT
===================================================== */

.inputBox{

    display:flex;

    align-items:center;

    gap:7px;

    padding:7px;

    background:
        linear-gradient(
            135deg,
            rgba(10,12,16,.58),
            rgba(0,0,0,.38)
        );

    backdrop-filter:
        blur(24px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(135%);

    border:
        1px solid
        rgba(255,200,0,.28);

    border-radius:32px;

    box-shadow:
        0 0 25px rgba(0,0,0,.55),
        0 0 35px rgba(255,190,0,.045),
        inset 0 1px 0 rgba(255,255,255,.045);

    transition:
        border-color .7s ease,
        box-shadow .7s ease,
        background .7s ease;
}

.inputBox:focus-within{

    border-color:
        rgba(255,205,0,.55);

    background:
        linear-gradient(
            135deg,
            rgba(10,12,16,.68),
            rgba(0,0,0,.45)
        );

    box-shadow:
        0 0 30px rgba(255,190,0,.08),
        inset 0 1px 0 rgba(255,255,255,.06);
}


/* =====================================================
   INPUT
===================================================== */

input{

    flex:1;

    min-width:0;

    height:44px;

    padding:
        0 16px;

    background:transparent;

    border:0;

    outline:0;

    color:#fff;

    font-size:14px;

    font-family:Arial,sans-serif;
}

input::placeholder{

    color:
        rgba(255,255,255,.32);

}


/* =====================================================
   PULSANTI
===================================================== */

button{

    height:44px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,190,0,.38);

    background:
        rgba(255,190,0,.055);

    color:#ffd000;

    font-family:Arial,sans-serif;

    font-weight:bold;

    cursor:pointer;

    transition:
        background .7s ease,
        color .7s ease,
        box-shadow .7s ease,
        border-color .7s ease,
        transform .35s ease;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    flex-shrink:0;
}

button:hover{

    background:#ffd000;

    color:#000;

    box-shadow:
        0 0 18px
        rgba(255,208,0,.35);

    transform:scale(1.04);
}

button:active{

    transform:scale(.94);

}


#mic,
#conversation{

    width:46px;

}


#send{

    width:64px;

    border-radius:23px;

    font-size:11px;

    letter-spacing:1px;
}


/* =====================================================
   ICONA SVG
===================================================== */

.icon{

    width:21px;

    height:21px;

    display:block;

    stroke:currentColor;

    fill:none;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;

    pointer-events:none;
}

#send .icon{

    width:19px;

    height:19px;
}


/* =====================================================
   PULSANTE ATTIVO
===================================================== */

.active{

    background:#168cff !important;

    border-color:#168cff !important;

    color:#fff !important;

    box-shadow:
        0 0 20px #168cff;

    transition:
        background 1.2s ease,
        border-color 1.2s ease,
        color 1.2s ease,
        box-shadow 1.2s ease;
}


/* =====================================================
   ANIMAZIONE MICROFONO ATTIVO
   PIÙ LENTA
===================================================== */

#mic.active{

    animation:
        micPulse 2.2s infinite ease-in-out;
}

@keyframes micPulse{

    0%,100%{
        box-shadow:
            0 0 10px rgba(22,140,255,.40);
    }

    50%{
        box-shadow:
            0 0 23px rgba(22,140,255,.72);
    }

}


/* =====================================================
   CROSSHAIR
===================================================== */

#mapCrosshair{

    position:fixed;

    z-index:12;

    left:50%;
    top:50%;

    width:25px;
    height:25px;

    transform:
        translate(-50%,-50%);

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1s ease;
}

body.mapMode #mapCrosshair{
    opacity:.35;
}

#mapCrosshair::before,
#mapCrosshair::after{

    content:"";

    position:absolute;

    background:#168cff;

    box-shadow:
        0 0 8px #168cff;
}

#mapCrosshair::before{

    width:25px;
    height:1px;

    top:12px;
    left:0;
}

#mapCrosshair::after{

    width:1px;
    height:25px;

    left:12px;
    top:0;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        top:15px;
    }

    .header h1{

        font-size:20px;

        letter-spacing:8px;
    }

    #clockPanel{

        top:15px;

        right:12px;
    }

    #clock{
        font-size:13px;
    }

    #date{
        font-size:8px;
    }

    #mapHud{
        top:65px;
    }

    #mapTitle{
        font-size:13px;
    }


    #chat{

        left:12px;
        right:12px;

        top:auto;

        bottom:105px;

        width:auto;

        max-height:23vh;

        padding:0;
    }


    .message{

        max-width:88%;

        font-size:12px;

        padding:8px 11px;
    }


    #chat .message.jarvis:first-child{

        font-size:16px;

        max-width:270px;

        padding:9px 11px;
    }


    .inputArea{

        width:
            calc(100% - 20px);
    }


    .inputBox{

        padding:6px;

        border-radius:28px;
    }


    input{

        font-size:13px;

        padding:
            0 12px;
    }


    #locationInfo{
        top:60%;
    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:430px){

    #conversation,
    #mic{

        width:42px;
    }

    #send{

        width:54px;

        font-size:10px;
    }

    .icon{

        width:19px;

        height:19px;
    }

    input{
        font-size:13px;
    }

}


/* =====================================================
   RIDUZIONE MOVIMENTO
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>


<script>

setTimeout(function(){

    const loading =
        document.getElementById("loading");

    if(loading){

        loading.classList.add("hidden");

    }

},1800);

</script>

    <h1>J.A.R.V.I.S.</h1>

    <div class="status">

        <span id="dot">●</span>

        <span id="statusText">

<div class="inputArea">

    <div class="inputBox">

        <input

            autocomplete="off"
        >


        <!-- CONVERSAZIONE -->

        <button
            id="conversation"
            title="Modalità conversazione"
            aria-label="Modalità conversazione"
        >

            <svg
                class="icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M3 10v4"/>
                <path d="M7 7v10"/>
                <path d="M11 5v14"/>
                <path d="M15 8v8"/>
                <path d="M19 10v4"/>

            </svg>

        </button>


        <!-- MICROFONO -->

        <button
            id="mic"
            title="Microfono"

        >

            <svg
                class="icon"

            >

                <rect
                    x="9"
                    y="3"
                    width="6"
                    height="11"
                    rx="3"
                />

                <path
                    d="M5 11a7 7 0 0 0 14 0"
                />

                <path
                    d="M12 18v3"
                />

                <path

                />

            </svg>

        <button

<script type="importmap">

{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =====================================================
   CONFIGURAZIONE
===================================================== */

const API =
"https://iao-ai-v3.oceano-masoud.workers.dev/";


/* =====================================================
   ELEMENTI
===================================================== */

const neuralCanvas =
document.getElementById("neuralCanvas");

const neuralCtx =
neuralCanvas.getContext("2d");

const earthCanvas =
document.getElementById("earthCanvas");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const conversation =
document.getElementById("conversation");

const chat =
document.getElementById("chat");

const dot =
document.getElementById("dot");

const statusText =
document.getElementById("statusText");

const clock =
document.getElementById("clock");

const date =
document.getElementById("date");

const coordinates =
document.getElementById("coordinates");

const locationInfo =
document.getElementById("locationInfo");

const locationName =
document.getElementById("locationName");

const locationCoords =
document.getElementById("locationCoords");


/* =====================================================
   STATO
===================================================== */

let state="idle";

let busy=false;

let listening=false;

let conversationMode=false;

let wakeMode=false;

let mapMode=false;

let recognition=null;

let wakeRecognition=null;


/* =====================================================
   MEMORIA
===================================================== */

let memory=[];

try{

    memory=JSON.parse(
        localStorage.getItem("jarvis_memory") || "[]"
    );

}catch{

    memory=[];

}

memory=memory.slice(-40);


function saveMemory(){

    memory=memory.slice(-40);

    localStorage.setItem(
        "jarvis_memory",
        JSON.stringify(memory)
    );

}


function remember(role,content){

    if(!content)return;

    memory.push({

        role,

        content,

        time:Date.now()

    });

    saveMemory();

}


saveMemory();


/* =====================================================
   STATO
===================================================== */

function setState(newState){

    state=newState;

    if(

        newState==="listening" ||
        newState==="thinking" ||
        newState==="speaking"

    ){

        dot.style.color="#168cff";

    }else{

        dot.style.color="#ffd000";

    }

}


/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now=new Date();

    clock.textContent=
        now.toLocaleTimeString("it-IT");

    date.textContent=
        now.toLocaleDateString(
            "it-IT",
            {
                weekday:"short",
                day:"2-digit",
                month:"short"
            }
        ).toUpperCase();

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHAT
===================================================== */

function addMessage(type,text){

    const element =
        document.createElement("div");

    element.className =
        "message "+type;

    element.textContent =
        text;

    chat.appendChild(element);

    while(chat.children.length>20){

        chat.removeChild(
            chat.firstChild
        );

    }

    chat.scrollTop =
        chat.scrollHeight;

    return element;

}


/* =====================================================
   THREE.JS
===================================================== */

const earthScene =
    new THREE.Scene();


const earthCamera =
    new THREE.PerspectiveCamera(
        45,
        innerWidth/innerHeight,
        .1,
        100
    );


earthCamera.position.set(
    0,
    0,
    3.3
);


const earthRenderer =
    new THREE.WebGLRenderer({

        canvas:earthCanvas,

        antialias:true,

        alpha:true

    });


earthRenderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


earthRenderer.setSize(
    innerWidth,
    innerHeight
);


/* =====================================================
   LUCI
===================================================== */

const ambientLight =
    new THREE.AmbientLight(
        0x7890aa,
        1.1
    );

earthScene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    5,
    3,
    5
);

earthScene.add(sun);


/* =====================================================
   TERRA
===================================================== */

const earthGroup =
    new THREE.Group();

earthScene.add(
    earthGroup
);


const earthGeometry =
    new THREE.SphereGeometry(
        1,
        128,
        128
    );


const textureLoader =
    new THREE.TextureLoader();


const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:earthTexture,

        shininess:18,

        specular:
            new THREE.Color(
                0x333333
            )

    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );


earthGroup.add(earth);


/* =====================================================
   ATMOSFERA
===================================================== */

const atmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.035,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:0x2d9cff,

            transparent:true,

            opacity:.10,

            side:THREE.BackSide

        })

    );


earthGroup.add(
    atmosphere
);


/* =====================================================
   GLOW
===================================================== */

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.08,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:0x168cff,

            transparent:true,

            opacity:.045,

            side:THREE.BackSide

        })

    );


earthGroup.add(glow);


/* =====================================================
   MARKER
===================================================== */

const marker =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .022,
            24,
            24
        ),

        new THREE.MeshBasicMaterial({
            color:0xffd000
        })

    );


marker.visible=false;

earthGroup.add(marker);


const markerRing =
    new THREE.Mesh(

        new THREE.RingGeometry(
            .035,
            .052,

        ),

/* =====================================================
   ESTRAZIONE LUOGO
===================================================== */

function extractLocation(text){

    const patterns=[

        "mostrami ",
        "mostra ",
        "portami a ",
        "portami ad ",
        "fammi vedere ",
        "cerca ",
        "trova ",
        "vai a ",
        "vai ad ",
        "localizza ",
        "localizzami "

    ];

    const lower =
        text.toLowerCase();


    for(
        const prefix of patterns
    ){

        const index =
            lower.indexOf(prefix);


        if(index!==-1){

            let place =
                text.substring(
                    index+prefix.length
                ).trim();


            place =
                place.replace(
                    /^(la|il|lo|un|una|a|ad)\s+/i,
                    ""
                );


            if(place.length>1){

                return place;

            }

        }

    }

    return null;

}


/* =====================================================
   GEOCODING
===================================================== */

async function searchPlace(place){

    setState("thinking");

    coordinates.textContent =
        "SEARCHING LOCATION...";


    try{

        const url =
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&q="
            +
            encodeURIComponent(place);


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Geocoding error"
            );

        }


        const results =
            await response.json();


        if(!results.length){

            throw new Error(
                "Luogo non trovato"
            );

        }


        const result =
            results[0];


        const lat =
            parseFloat(result.lat);


        const lon =
            parseFloat(result.lon);


        const name =
            result.display_name
            .split(",")
            .slice(0,3)
            .join(", ");


        showLocation(
            name,
            lat,
            lon
        );


        return{
            name,
            lat,
            lon
        };


    }catch(error){

        console.error(error);

        coordinates.textContent =
            "LOCATION NOT FOUND";

        setState("idle");

        addMessage(
            "jarvis",
            "Non riesco a trovare questo luogo."
        );

        return null;

    }

}

function formatCoordinates(lat,lon){

    const latDir =
        lat>=0 ? "N" : "S";

    const lonDir =
        lon>=0 ? "E" : "W";


    return(

        Math.abs(lat).toFixed(4)
        +
        "° "
        +
        latDir
        +
        "   |   "
        +
        Math.abs(lon).toFixed(4)
        +
        "° "
        +
        lonDir

    );

}

let zoomAnimating=false;

let zoomProgress=1;

let zoomStart=3.3;

let zoomEnd=1.55;

let targetQuaternion =
    new THREE.Quaternion();


function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi =
        (90-lat)
        *
        Math.PI/180;


    const theta =
        (lon+180)
        *
        Math.PI/180;


    return new THREE.Vector3(

        -radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );


}


function focusEarth(
    lat,
    lon
){

    openMap();


    const target =
        latLonToVector3(
            lat,
            lon,
            1
        );


    marker.position.copy(
        target
        .clone()
        .multiplyScalar(1.025)
    );


    marker.visible=true;

    markerRing.visible=true;


    const direction =
        target
        .clone()
        .normalize();


    const front =
        new THREE.Vector3(
            0,
            0,
            1
        );


    targetQuaternion =
        new THREE.Quaternion();


    targetQuaternion.setFromUnitVectors(
        direction,
        front
    );


    zoomStart =
        earthCamera.position.length();


    if(zoomStart<2){

        zoomStart=3.3;

        earthCamera.position.set(
            0,
            0,
            zoomStart
        );

    }


    zoomEnd=1.55;

    zoomProgress=0;

    zoomAnimating=true;

    controls.enabled=false;

    setState("thinking");

}


/* =====================================================
   RETE NEURALE
===================================================== */

let neuralWidth =
    innerWidth;

let neuralHeight =
    innerHeight;

let neuralCx =
    neuralWidth/2;

let neuralCy =
    neuralHeight/2;


let neuralRadius =
    Math.min(
        neuralWidth,
        neuralHeight
    )*.40;


let neuralRotation=0;

let nodes=[];


/* =====================================================
   RESIZE
===================================================== */

function resizeNeural(){

    neuralWidth =
        innerWidth;

    neuralHeight =
        innerHeight;


    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );


    neuralCanvas.width =
        neuralWidth*dpr;

    neuralCanvas.height =
        neuralHeight*dpr;


    neuralCanvas.style.width =
        neuralWidth+"px";

    neuralCanvas.style.height =
        neuralHeight+"px";


    neuralCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    neuralCx =
        neuralWidth/2;

    neuralCy =
        neuralHeight/2;


    neuralRadius =
        Math.min(
            neuralWidth,
            neuralHeight
        )*.30;


    createNeuralNodes();

}


/* =====================================================
   NODI
===================================================== */

function createNeuralNodes(){

    nodes=[];


    for(
        let i=0;
        i<145;
        i++
    ){

        const special =
            Math.random() < .15;


        nodes.push({

            theta:
                Math.random()
                *
                Math.PI
                *
                2,

            phi:
                Math.acos(
                    2*Math.random()-1
                ),

            r:
                neuralRadius *
                (
                    .72+
                    Math.random()*.55
                ),

            size:
                .7+
                Math.random()*1.8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            special:
                special,

            colorPhase:
                Math.random()
                *
                Math.PI
                *
                2

        });

    }

}


/* =====================================================
   ANIMAZIONE RETE NEURALE
   MOVIMENTO PIÙ LENTO
===================================================== */

function animateNeural(){

    requestAnimationFrame(
        animateNeural
    );


    const time =
        performance.now()/1000;


    let speed=.55;

    let energy=.2;


    /*
       MICROFONO / ASCOLTO
       Prima: speed = 4
       Ora: movimento molto più lento
    */

    if(state==="listening"){

        speed=1.7;

        energy=.75;

    }


    /*
       PENSIERO
       Prima: speed = 7
       Ora: più controllato
    */

    if(state==="thinking"){

        speed=3.2;

        energy=1.35;

    }


    /*
       VOCE
       Prima: speed = 5
       Ora: più lenta
    */

    if(state==="speaking"){

        speed=2.4;

        energy=1.05;

    }


    /*
       ROTAZIONE GENERALE
       Rallentata rispetto alla versione precedente
    */

    neuralRotation +=
        .0022*speed;


    neuralCtx.fillStyle =
        "rgba(0,0,0,.28)";


    neuralCtx.fillRect(
        0,
        0,
        neuralWidth,
        neuralHeight
    );


    let targetColor;


    if(

        state==="listening" ||

        state==="thinking" ||

        state==="speaking"

    ){

        targetColor={
            r:25,
            g:140,
            b:255
        };

    }else{

        targetColor={
            r:255,
            g:195,
            b:0
        };

    }


    window.jarvisColor =
        window.jarvisColor ||
        {
            r:255,
            g:195,
            b:0
        };


    /*
       CAMBIO COLORE PIÙ LENTO

       Prima: .055
       Ora: .022

       Questo rende il passaggio
       blu -> giallo molto più morbido.
    */

    jarvisColor.r +=
        (
            targetColor.r-
            jarvisColor.r
        )*.022;


    jarvisColor.g +=
        (
            targetColor.g-
            jarvisColor.g
        )*.022;


    jarvisColor.b +=
        (
            targetColor.b-
            jarvisColor.b
        )*.022;


    const r =
        Math.round(
            jarvisColor.r
        );

    const g =
        Math.round(
            jarvisColor.g
        );

    const b =
        Math.round(
            jarvisColor.b
        );


    const pulse =
        (
            Math.sin(time*2.7)+1
        )/2;


    const glow =
        neuralRadius*
        (
            1.05+
            energy*.7+
            pulse*.18
        );


    const gradient =
        neuralCtx.createRadialGradient(

            neuralCx,
            neuralCy,
            0,

            neuralCx,
            neuralCy,
            glow

        );


    gradient.addColorStop(
        0,
        `rgba(${r},${g},${b},.48)`
    );


    gradient.addColorStop(
        .35,
        `rgba(${r},${g},${b},.15)`
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    neuralCtx.fillStyle =
        gradient;


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        glow,
        0,
        Math.PI*2
    );


    neuralCtx.fill();


    const projected=[];


    nodes.forEach(n=>{

        const rr =
            n.r+
            Math.sin(
                time*2+n.phase
            )
            *
            energy*
            7;


        let x =
            rr*
            Math.sin(n.phi)*
            Math.cos(
                n.theta+
                neuralRotation
            );


        let y =
            rr*
            Math.cos(n.phi);


        let z =
            rr*
            Math.sin(n.phi)*
            Math.sin(
                n.theta+
                neuralRotation
            );


        if(state!=="idle"){

            x +=
                Math.sin(
                    time*1.5+n.phase
                )
                *
                energy*
                7;


            y +=
                Math.cos(
                    time*1.8+n.phase
                )
                *
                energy*
                7;

        }


        const perspective =
            430/
            (
                430+z
            );


        projected.push({

            x:
                neuralCx+
                x*perspective,

            y:
                neuralCy+
                y*perspective,

            z,

            size:
                n.size*
                perspective,

            alpha:
                Math.max(
                    .1,
                    Math.min(
                        1,
                        (z+neuralRadius)/
                        (neuralRadius*2)
                    )
                ),

            phase:
                n.phase,

            special:
                n.special,

            colorPhase:
                n.colorPhase

        });

    });


    const maxDist =
        state==="thinking"
        ? 105
        : 78;


    for(
        let i=0;
        i<projected.length;
        i++
    ){

        for(
            let j=i+1;
            j<projected.length;
            j++
        ){

            const a =
                projected[i];

            const c =
                projected[j];


            const dx =
                a.x-c.x;

            const dy =
                a.y-c.y;


            const dist =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(dist<maxDist){

                const alpha =
                    (
                        1-
                        dist/maxDist
                    )
                    *
                    .3*
                    a.alpha;


                neuralCtx.beginPath();


                neuralCtx.moveTo(
                    a.x,
                    a.y
                );


                neuralCtx.lineTo(
                    c.x,
                    c.y
                );


                neuralCtx.strokeStyle =
                    `rgba(${r},${g},${b},${alpha})`;


                neuralCtx.lineWidth=.65;


                neuralCtx.stroke();

            }

        }

    }


    projected.forEach(n=>{

        const flicker =
            (
                Math.sin(
                    time*5+n.phase
                )+1
            )/2;


        const size =
            n.size+
            flicker*
            (
                state==="thinking"
                ? 1.5
                : .6
            );


        let particleR=r;
        let particleG=g;
        let particleB=b;


        if(n.special){

            const colorWave =
                (
                    Math.sin(
                        time*.7+
                        n.colorPhase
                    )+1
                )/2;


            if(colorWave<.5){

                const mix =
                    colorWave*2;


                particleR =
                    Math.round(
                        255*(1-mix)+
                        180*mix
                    );

                particleG =
                    Math.round(
                        195*(1-mix)+
                        40*mix
                    );

                particleB =
                    Math.round(
                        0*(1-mix)+
                        255*mix
                    );

            }else{

                const mix =
                    (colorWave-.5)*2;


                particleR =
                    Math.round(
                        180*(1-mix)+
                        25*mix
                    );

                particleG =
                    Math.round(
                        40*(1-mix)+
                        140*mix
                    );

                particleB =
                    Math.round(
                        255*(1-mix)+
                        255*mix
                    );

            }

        }


        neuralCtx.fillStyle =
            `rgba(${particleR},${particleG},${particleB},${n.alpha*.28})`;


        neuralCtx.beginPath();


        neuralCtx.arc(
            n.x,
            n.y,
            size*4,
            0,
            Math.PI*2
        );


        neuralCtx.fill();


        neuralCtx.fillStyle =
            `rgba(${particleR},${particleG},${particleB},${n.alpha})`;


        neuralCtx.beginPath();


        neuralCtx.arc(
            n.x,
            n.y,
            size,
            0,
            Math.PI*2
        );


        neuralCtx.fill();

    });


    const core =
        5+
        pulse*2+
        energy*2;


    neuralCtx.fillStyle =
        `rgba(${r},${g},${b},.38)`;


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core*5,
        0,
        Math.PI*2
    );


    neuralCtx.fill();


    neuralCtx.fillStyle =
        "#fff";


    neuralCtx.beginPath();


    neuralCtx.arc(
        neuralCx,
        neuralCy,
        core,
        0,
        Math.PI*2
    );


    neuralCtx.fill();

}


/* =====================================================

===================================================== */

let markerPulse=0;


function animateEarth(){

    requestAnimationFrame(
        animateEarth
    );


    if(
        mapMode &&
        zoomAnimating
    ){

        zoomProgress += .008;


        if(zoomProgress>=1){

            zoomProgress=1;

            zoomAnimating=false;

            controls.enabled=true;

            setState("idle");

        }


        const eased =
            1-
            Math.pow(
                1-zoomProgress,
                3
            );


        const distance =
            zoomStart+
            (
                zoomEnd-
                zoomStart
            )
            *
            eased;


        const cameraDirection =
            earthCamera.position
            .clone()
            .normalize();


        earthCamera.position.copy(

            cameraDirection
            .multiplyScalar(
                distance
            )

        );


        earthGroup.quaternion.slerp(
            targetQuaternion,
            .032
        );

    }


    controls.update();


    if(marker.visible){

        markerPulse += .055;


        const scale =
            1+
            Math.sin(
                markerPulse
            )*.3;


        marker.scale.set(
            scale,
            scale,
            scale
        );


        markerRing.visible=true;


        markerRing.position.copy(
            marker.position
        );


        markerRing.lookAt(
            earthCamera.position
        );


        markerRing.scale.set(
            scale,
            scale,
            scale
        );

    }


    earthRenderer.render(
        earthScene,
        earthCamera
    );

}

    ){

                "it-IT",

                }
            )
            +
            "."

        );

    }


    if(

        t.includes("che giorno è") ||

        t.includes("che giorno e")

    ){

        return(

            "Oggi è "
            +
            new Date()
            .toLocaleDateString(
                "it-IT",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )

    return null;

        console.error(error);


        answer.textContent =
            "Neural Core non raggiungibile. Controlla la connessione o il server AI.";


        setState("idle");

    }


    finish();

}


/* =====================================================
   FINE
===================================================== */

function finish(){

    busy=false;

    input.disabled=false;

    send.disabled=false;

    mic.disabled=false;

    conversation.disabled=false;

}


/* =====================================================
   VOCI
===================================================== */

let voices=[];


function speak(text){

    if(!("speechSynthesis" in window)){

        setState("idle");

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang="it-IT";

    utterance.rate=.88;

    utterance.pitch=.65;

    utterance.volume=1;


    utterance.onstart=()=>{

        setState(
            "speaking"
        );

    };


    utterance.onend=()=>{

        setState(
            "idle"
        );


        if(
            conversationMode &&
            wakeMode
        ){

            setTimeout(
                startWakeWord,
                900
            );

        }

    };


    utterance.onerror=()=>{

        setState(
            "idle"
        );

    };


    speechSynthesis.speak(
        utterance
    );

}

        listening=false;

/* =====================================================
   WAKE WORD
===================================================== */

function startWakeWord(){

    if(

        !Recognition ||
        !conversationMode ||
        !wakeMode ||
        busy ||
        listening ||
        wakeRecognition

    ){

        return;

    }


    wakeRecognition =
        new Recognition();


    wakeRecognition.lang =
        "it-IT";


    wakeRecognition.continuous =
        true;


    wakeRecognition.interimResults =
        true;


    wakeRecognition.onresult =
        event=>{

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase();


                if(text.includes("jarvis")){

                    try{

                        wakeRecognition.stop();

                    }catch{}


                    wakeRecognition=null;

                    activateJarvis();

                    return;

                }

            }

        };


    wakeRecognition.onerror=()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(
                startWakeWord,
                1600
            );

        }

    };


    wakeRecognition.onend=()=>{

        wakeRecognition=null;


        if(

            conversationMode &&
            wakeMode &&
            !busy &&
            !listening

        ){

            setTimeout(
                startWakeWord,
                1000
            );

        }

    };


    try{

        wakeRecognition.start();

    }catch{

        wakeRecognition=null;

    }

}


function stopWakeWord(){

    if(wakeRecognition){

        try{

            wakeRecognition.stop();

        }catch{}


        wakeRecognition=null;

    }

}


function activateJarvis(){

    if(
        busy ||
        listening
    ){

        return;

    }


    setState(
        "listening"
    );


    input.placeholder =
        "JARVIS ti ascolta...";


    setTimeout(()=>{

        try{

            recognition.start();

        }catch{}

    },500);

}
