html,body{

}

#fullscreenBtn:hover{

 background:rgba(0,255,255,.08);
 box-shadow:0 0 20px rgba(0,255,255,.12);
}

#fullscreenBtn:active{
 transform:scale(.94);
}


/* ================= CHAT ================= */

#chat{

}

.msg{

 border-radius:24px;

 backdrop-filter:blur(14px);
 color:rgba(235,255,255,.9);
 font-size:12px;
 line-height:1.45;

}


/* ================= COMMAND ================= */

.command-wrapper{

.mic-icon{

}

</script><script type="module">

import * as THREE from "three";


/* ================= CONFIG ================= */

const API="https://iao-ai-v3.oceano-masoud.workers.dev/";
const MEMORY_KEY="jarvis_memory_v1";
const MAX_MEMORY=30;

const ELEVEN_VOICE_ID="vkBFlAtUdZqNR4MqxSVr";

let currentAudio=null;
let audioPlaying=false;

let deviceVoices=[];
let selectedDeviceVoice=null;


/* ================= ELEMENTI ================= */

const container=document.getElementById("webgl-container");
const chat=document.getElementById("chat");
const textInput=document.getElementById("textInput");
const sendBtn=document.getElementById("sendBtn");
const micBtn=document.getElementById("micBtn");
const clock=document.getElementById("clock");
const date=document.getElementById("date");
const tacticalMap=document.getElementById("tacticalMap");
const closeMap=document.getElementById("closeMap");
const jarvisTitle=document.getElementById("jarvisTitle");
const mapHeader=document.querySelector(".map-header");
const voiceBtn=document.getElementById("voiceBtn");
const voicePanel=document.getElementById("voicePanel");
const voiceSelector=document.getElementById("voiceSelector");
const voiceTest=document.getElementById("voiceTest");
const webSearchWindows=document.getElementById("webSearchWindows");
const webSearchIndicator=document.getElementById("webSearchIndicator");
const fullscreenBtn=document.getElementById("fullscreenBtn");


/* =====================================================
   FULL SCREEN
===================================================== */

async function toggleFullscreen(){

 try{

  if(!document.fullscreenElement){

   await document.documentElement.requestFullscreen();

  }else{

   await document.exitFullscreen();

  }

 }catch(error){

  console.warn(
   "Fullscreen non disponibile:",
   error
  );

 }

}


/* ================= AGGIORNA ICONA FULL SCREEN ================= */

function updateFullscreenButton(){

 if(document.fullscreenElement){

  fullscreenBtn.textContent="✕";
  fullscreenBtn.title="Esci da schermo intero";

 }else{

  fullscreenBtn.textContent="⛶";
  fullscreenBtn.title="Schermo intero";

 }

}

fullscreenBtn.addEventListener(
 "click",
 toggleFullscreen
);

document.addEventListener(
 "fullscreenchange",
 updateFullscreenButton
);


/* ================= MEMORIA ================= */

let memory=[];

try{

 const saved=
  localStorage.getItem(MEMORY_KEY);

 if(saved){

  const parsed=JSON.parse(saved);

  if(Array.isArray(parsed))
   memory=parsed.slice(-MAX_MEMORY);
 }

}catch(e){

 console.warn(
  "Memoria:",
  e
 );

}

function saveMemory(){

 try{

  localStorage.setItem(
   MEMORY_KEY,
   JSON.stringify(
    memory.slice(-MAX_MEMORY)
   )
  );

 }catch(e){

  console.warn(
   "Salvataggio memoria:",
   e
  );

 }

}

function addMemory(role,content){

 memory.push({
  role,
  content
 });

 memory=
  memory.slice(-MAX_MEMORY);

 saveMemory();
}


/* ================= OROLOGIO ================= */

const months=[
 "GEN","FEB","MAR","APR","MAG","GIU",
 "LUG","AGO","SET","OTT","NOV","DIC"
];

function updateClock(){

 const now=new Date();

 clock.textContent=
  `${String(now.getHours()).padStart(2,"0")}:`+
  `${String(now.getMinutes()).padStart(2,"0")}:`+
  `${String(now.getSeconds()).padStart(2,"0")}`;

 date.textContent=
  `${String(now.getDate()).padStart(2,"0")} `+
  `${months[now.getMonth()]} `+
  `${now.getFullYear()}`;
}

updateClock();

setInterval(
 updateClock,
 1000
);


/* ================= THREE ================= */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
 55,
 window.innerWidth/window.innerHeight,
 .1,
 1000
);

camera.position.z=5.2;

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:true
});

renderer.setSize(
 window.innerWidth,
 window.innerHeight
);

renderer.setPixelRatio(
 Math.min(
  window.devicePixelRatio,
  2
 )
);

container.appendChild(
 renderer.domElement
);


/* ================= GLOW ================= */

function createGlow(){

 const canvas=document.createElement("canvas");

 canvas.width=64;
 canvas.height=64;

 const ctx=canvas.getContext("2d");

 const gradient=
  ctx.createRadialGradient(
   32,32,0,
   32,32,32
  );

 gradient.addColorStop(
  0,
  "rgba(255,255,255,1)"
 );

 gradient.addColorStop(
  .2,
  "rgba(220,255,255,1)"
 );

 gradient.addColorStop(
  .4,
  "rgba(0,255,255,.9)"
 );

 gradient.addColorStop(
  .7,
  "rgba(0,150,190,.25)"
 );

 gradient.addColorStop(
  1,
  "rgba(0,0,0,0)"
 );

 ctx.fillStyle=gradient;

 ctx.fillRect(
  0,
  0,
  64,
  64
 );

 return new THREE.CanvasTexture(
  canvas
 );
}


/* ================= PARTICELLE ================= */

const COUNT=3000;

const geometry=
 new THREE.BufferGeometry();

const positions=
 new Float32Array(
  COUNT*3
 );

const radii=
 new Float32Array(
  COUNT
 );

const angles=
 new Float32Array(
  COUNT*2
 );

const seeds=
 new Float32Array(
  COUNT
 );

for(let i=0;i<COUNT;i++){

 const r=
  1.10+
  Math.random()*.70;

 const theta=
  Math.random()*Math.PI*2;

 const phi=
  Math.acos(
   2*Math.random()-1
  );

 radii[i]=r;

 angles[i*2]=theta;

 angles[i*2+1]=phi;

 seeds[i]=
  Math.random()*100;

 positions[i*3]=
  r*Math.sin(phi)*Math.cos(theta);

 positions[i*3+1]=
  r*Math.sin(phi)*Math.sin(theta);

 positions[i*3+2]=
  r*Math.cos(phi);
}

geometry.setAttribute(
 "position",
 new THREE.BufferAttribute(
  positions,
  3
 )
);

const material=
 new THREE.PointsMaterial({

  color:new THREE.Color(
   0x00cfe8
  ),

  size:.042,

  map:createGlow(),

  transparent:true,

  opacity:1,

  depthWrite:false,

  blending:THREE.AdditiveBlending
 });

const particles=
 new THREE.Points(
  geometry,
  material
 );

scene.add(
 particles
);


/* ================= STATO ================= */

let targetEnergy=.15;

let energy=.15;

const normalColor=
 new THREE.Color(
  0x00cfe8
 );

const activeColor=
 new THREE.Color(
  0x8fffff
 );

const currentColor=
 normalColor.clone();

function setState(state){

 if(state==="thinking")
  targetEnergy=2;

 else if(state==="speaking")
  targetEnergy=.8;

 else if(state==="listening")
  targetEnergy=.55;

 else
  targetEnergy=.15;
}


/* ================= ANIMAZIONE ================= */

function animate(){

 requestAnimationFrame(
  animate
 );

 const time=
  performance.now()*.001;

 energy+=
  (targetEnergy-energy)*.045;

 currentColor.lerp(
  activeColor,
  energy*.04
 );

 if(energy<.3)
  currentColor.lerp(
   normalColor,
   .03
  );

 material.color=
  currentColor;

 material.size=
  .032+
  energy*.008;

 const pos=
  geometry.attributes
  .position.array;

 for(let i=0;i<COUNT;i++){

  const index=i*3;

  const r=radii[i];

  const theta=
   angles[i*2];

  const phi=
   angles[i*2+1];

  const seed=
   seeds[i];

  const pulse=
   Math.sin(
    time*2+seed
   )*.035;

  const strangeShape=
   Math.sin(
    theta*6+
    time*2+
    seed
   )*.18*energy;

  const wave=
   Math.cos(
    phi*7-
    time*1.8+
    seed
   )*.12*energy;

  const rr=
   r+
   pulse+
   strangeShape+
   wave;

  let x=
   rr*
   Math.sin(phi)*
   Math.cos(theta);

  let y=
   rr*
   Math.sin(phi)*
   Math.sin(theta);

  let z=
   rr*
   Math.cos(phi);

  x+=
   Math.sin(
    time*2.4+
    phi*8+
    seed
   )*.08*energy;

  y+=
   Math.cos(
    time*2.1+
    theta*9+
    seed
   )*.08*energy;

  z+=
   Math.sin(
    time*2.7+
    (theta+phi)*7
   )*.10*energy;

  pos[index]=x;
  pos[index+1]=y;
  pos[index+2]=z;
 }

 geometry.attributes
  .position.needsUpdate=true;

 particles.rotation.y+=
  .0005+
  energy*.0008;

 particles.rotation.x=
  Math.sin(time*.25)*.04;

 particles.rotation.z=
  Math.cos(time*.18)*.025;

 renderer.render(
  scene,
  camera
 );
}

/* ================= RICERCA POSIZIONE ================= */

async function searchLocation(place){

 try{

  openTacticalMap();

  addMsg(
   "Ricerca posizione: "+
   place
  );

  const url=
   "https://nominatim.openstreetmap.org/search"+
   "?format=json&limit=1&q="+
   encodeURIComponent(place);

  const response=
   await fetch(
    url,
    {
     headers:{
      "Accept":
       "application/json"
     }
    }
   );

  if(!response.ok)
   throw new Error(
    "Ricerca posizione fallita"
   );

  const results=
   await response.json();

  if(!results.length){

   addMsg(
    "Non riesco a trovare "+
    place+"."
   );

   return;
  }

  const result=
   results[0];

  const lat=
   parseFloat(
    result.lat
   );

  const lon=
   parseFloat(
    result.lon
   );

  if(!map)
   throw new Error(
    "Mappa non inizializzata"
   );

  map.flyTo({

   center:[
    lon,
    lat
   ],

   zoom:12,

   speed:.8,

   curve:1.5,

   essential:true

  });

  createJarvisMarker(
   lat,
   lon,
   place
  );

  addMsg(
   "Posizione acquisita: "+
   place
  );

 }catch(error){

  console.error(
   "MAP ERROR:",
   error
  );

  addMsg(
   "Impossibile localizzare "+
   place+"."
  );
 }
}

 /* =====================================================
    DRAG AVANZATO
    MOUSE + TOUCH + TABLET
 ===================================================== */

 const header=
  windowElement.querySelector(
   ".web-window-header"
  );

 let dragging=false;

 let dragOffsetX=0;

 let dragOffsetY=0;

 let activePointerId=null;


 function startDrag(event){

  if(
   event.target.closest(
    ".web-window-btn"
   )
  ){
   return;
  }

  dragging=true;

  activePointerId=
   event.pointerId;

  bringWebWindowToFront(
   windowElement
  );

  const rect=
   windowElement.getBoundingClientRect();

  dragOffsetX=
   event.clientX-
   rect.left;

  dragOffsetY=
   event.clientY-
   rect.top;

  header.classList.add(
   "dragging"
  );

  try{

   header.setPointerCapture(
    event.pointerId
   );

  }catch(e){}

  event.preventDefault();
 }


 function moveDrag(event){

  if(!dragging)
   return;

  if(
   activePointerId!==null &&
   event.pointerId!==activePointerId
  ){
   return;
  }

  event.preventDefault();

  const rect=
   windowElement.getBoundingClientRect();

  let newLeft=
   event.clientX-
   dragOffsetX;

  let newTop=
   event.clientY-
   dragOffsetY;


  /* ================= LIMITI ================= */

  const minLeft=
   -rect.width+80;

  const maxLeft=
   window.innerWidth-80;

  const minTop=0;

  const maxTop=
   window.innerHeight-55;


  newLeft=
   Math.max(
    minLeft,
    Math.min(
     newLeft,
     maxLeft
    )
   );

  newTop=
   Math.max(
    minTop,
    Math.min(
     newTop,
     maxTop
    )
   );


  windowElement.style.left=
   newLeft+"px";

  windowElement.style.top=
   newTop+"px";
 }


 function stopDrag(event){

  if(!dragging)
   return;

  if(
   activePointerId!==null &&
   event.pointerId!==activePointerId
  ){
   return;
  }

  dragging=false;

  activePointerId=null;

  header.classList.remove(
   "dragging"
  );

  try{

   header.releasePointerCapture(
    event.pointerId
   );

  }catch(e){}

  event.preventDefault();
 }


 /* =====================================================
    POINTER DOWN
 ===================================================== */

 header.addEventListener(
  "pointerdown",
  startDrag,
  {
   passive:false
  }
 );


 /* =====================================================
    POINTER MOVE
 ===================================================== */

 header.addEventListener(
  "pointermove",
  moveDrag,
  {
   passive:false
  }
 );


 /* =====================================================
    POINTER UP
 ===================================================== */

 header.addEventListener(
  "pointerup",
  stopDrag,
  {
   passive:false
  }
 );


 /* =====================================================
    POINTER CANCEL
 ===================================================== */

 header.addEventListener(
  "pointercancel",
  stopDrag,
  {
   passive:false
  }
 );


 /* =====================================================
    LOST POINTER
 ===================================================== */

 header.addEventListener(
  "lostpointercapture",
  ()=>{
   dragging=false;
   activePointerId=null;
   header.classList.remove(
    "dragging"
   );
  }
 );


 /* =====================================================
    SUPPORTO EXTRA TOUCH
    Per alcuni browser/tablet
 ===================================================== */

 let touchDragging=false;

 let touchStartX=0;

 let touchStartY=0;

 let originalLeft=0;

 let originalTop=0;


 header.addEventListener(
  "touchstart",
  event=>{

   if(
    event.target.closest(
     ".web-window-btn"
    )
   ){
    return;
   }

   const touch=
    event.touches[0];

   const rect=
    windowElement.getBoundingClientRect();

   touchDragging=true;

   touchStartX=
    touch.clientX;

   touchStartY=
    touch.clientY;

   originalLeft=
    rect.left;

   originalTop=
    rect.top;

   bringWebWindowToFront(
    windowElement
   );

   event.preventDefault();

  },
  {
   passive:false
  }
 );


 header.addEventListener(
  "touchmove",
  event=>{

   if(!touchDragging)
    return;

   const touch=
    event.touches[0];

   let newLeft=
    originalLeft+
    (
     touch.clientX-
     touchStartX
    );

   let newTop=
    originalTop+
    (
     touch.clientY-
     touchStartY
    );

   const rect=
    windowElement.getBoundingClientRect();

   newLeft=
    Math.max(
     -rect.width+80,
     Math.min(
      newLeft,
      window.innerWidth-80
     )
    );

   newTop=
    Math.max(
     0,
     Math.min(
      newTop,
      window.innerHeight-55
     )
    );

   windowElement.style.left=
    newLeft+"px";

   windowElement.style.top=
    newTop+"px";

   event.preventDefault();

  },
  {
   passive:false
  }
 );


 header.addEventListener(
  "touchend",
  ()=>{
   touchDragging=false;
  },
  {
   passive:true
  }
 );


 updateWebIndicator();

 addMsg(
  "Ricerca web: "+
  query
 );
}

/* ================= DEVICE TTS ================= */

function speakDevice(text){

 return new Promise(
  resolve=>{

   if(
    !("speechSynthesis" in window)
   ){

    resolve(false);

    return;
   }

   try{

    window.speechSynthesis.cancel();

    const utterance=
     new SpeechSynthesisUtterance(
      text
     );

    utterance.lang="it-IT";

    utterance.rate=.95;

    utterance.pitch=.9;

    utterance.volume=1;

    if(selectedDeviceVoice){

     utterance.voice=
      selectedDeviceVoice;

    }else{

     const italianVoice=
      deviceVoices.find(
       voice=>
        voice.lang
        .toLowerCase()
        .startsWith("it")
      );

     if(italianVoice)
      utterance.voice=
       italianVoice;
    }

    utterance.onstart=()=>{

     audioPlaying=true;

     setState(
      "speaking"
     );
    };

    utterance.onend=()=>{

     audioPlaying=false;

     setState(
      "idle"
     );

     resolve(true);
    };

    utterance.onerror=()=>{

     audioPlaying=false;

     setState(
      "idle"
     );

     resolve(false);
    };

    window.speechSynthesis
     .speak(
      utterance
     );

    setTimeout(
     ()=>{
      try{
       window.speechSynthesis
        .resume();
      }catch(e){}
     },
     100
    );

   }catch(error){

    console.error(error);

    resolve(false);
   }

  }
 );
}


/* ================= ELEVENLABS ================= */

async function speakElevenLabs(text){

 if(!text)return false;

 if(currentAudio){

  try{

   currentAudio.pause();

   currentAudio.currentTime=0;

  }catch(e){}

  currentAudio=null;
 }

 const controller=
  new AbortController();

 const timeout=
  setTimeout(
   ()=>controller.abort(),
   30000
  );

 try{

  const response=
   await fetch(
    API,
    {

     method:"POST",

     headers:{
      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({

      action:"tts",

      text:text,

      voiceId:
       ELEVEN_VOICE_ID

     }),

     signal:
      controller.signal

    }
   );

  if(!response.ok)
   return false;

  const contentType=
   response.headers
   .get("content-type")||
   "";

  if(
   !contentType.includes(
    "audio"
   )
  )
   return false;

  const audioBlob=
   await response.blob();

  if(
   !audioBlob||
   audioBlob.size===0
  )
   return false;

  const audioUrl=
   URL.createObjectURL(
    audioBlob
   );

  const audio=
   new Audio(
    audioUrl
   );

  currentAudio=
   audio;

  audio.volume=1;

  audio.onplay=()=>{

   audioPlaying=true;

   setState(
    "speaking"
   );
  };

  audio.onended=()=>{

   audioPlaying=false;

   setState(
    "idle"
   );

   URL.revokeObjectURL(
    audioUrl
   );

   if(
    currentAudio===audio
   )
    currentAudio=null;
  };

  audio.onerror=()=>{

   audioPlaying=false;

   setState(
    "idle"
   );

   URL.revokeObjectURL(
    audioUrl
   );
  };

  await audio.play();

  return true;

 }catch(error){

  console.warn(
   "ElevenLabs:",
   error
  );

  return false;

 }finally{

  clearTimeout(
   timeout
  );
 }
}

    );

  }finally{

   clearTimeout(
    timeout
   );
  }

  if(!response.ok){

   const errorText=
    await response.text();

   let errorMessage=
    "HTTP "+
    response.status;

   try{

    const errorData=
     JSON.parse(
      errorText
     );

    if(
     errorData&&
     errorData.error
    )
     errorMessage=
      errorData.error;

   }catch(e){

    if(errorText)
     errorMessage=
      errorText.substring(
       0,
       200
      );
   }

   throw new Error(
    errorMessage
   );
  }

  const data=
   await response.json();

  const reply=
   typeof data.response==="string"
    ?data.response.trim()
    :"";

  if(!reply)
   throw new Error(
    "Risposta AI vuota"
   );

  addMsg(
   reply
  );

  addMemory(
   "assistant",
   reply
  );

  speak(
   reply
  ).catch(
   console.error
  );

  setState(
   "idle"
  );

 }catch(error){

  console.error(
   "JARVIS ERROR:",
   error
  );

  let message=
   error.message||
   "Errore sconosciuto";

  if(
   error.name==="AbortError"
  )
   message=
    "Il server ha impiegato troppo tempo a rispondere.";

  else if(
   message==="Failed to fetch"
  )
   message=
    "Errore di connessione al server JARVIS.";

  addMsg(
   "ERRORE: "+
   message
  );

  setState(
   "idle"
  );
 }
}


/* ================= INVIO ================= */

function sendMessage(){

 const text=
  textInput.value.trim();

 if(!text)return;

 textInput.value="";

 addMsg(
  text
 );

 processAi(
  text
 );
}

sendBtn.addEventListener(
 "click",
 sendMessage
);

textInput.addEventListener(
 "keydown",
 event=>{

  if(event.key==="Enter"){

   event.preventDefault();

   sendMessage();
  }
 }
);


/* ================= MICROFONO ================= */

const Recognition=
 window.SpeechRecognition||
 window.webkitSpeechRecognition;

let recognition=null;

let listening=false;

if(Recognition){

 recognition=
  new Recognition();

 recognition.lang=
  "it-IT";

 recognition.continuous=
  false;

 recognition.interimResults=
  false;

 recognition.onstart=()=>{

  listening=true;

  micBtn.classList.add(
   "active"
  );

  setState(
   "listening"
  );
 };

 recognition.onresult=
  event=>{

   const text=
    event.results[0][0]
    .transcript
    .trim();

   if(text){

    textInput.value=
     text;

    sendMessage();
   }
  };

 recognition.onerror=
  error=>{

   console.error(
    "Microfono:",
    error
   );

   listening=false;

   micBtn.classList.remove(
    "active"
   );

   setState(
    "idle"
   );
  };

 recognition.onend=()=>{

  listening=false;

  micBtn.classList.remove(
   "active"
  );
 };

 micBtn.addEventListener(
  "click",
  ()=>{

   if(listening){

    recognition.stop();

   }else{

    try{

     recognition.start();

    }catch(error){

     console.warn(
      error
     );

    }
   }
  }
 );

}else{

 micBtn.style.opacity=".3";
}

 }
