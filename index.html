<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #06151a 0%,
            #020708 35%,
            #000 75%
        );

    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}

/* =========================
   JARVIS
========================= */

.title {
    position: fixed;

    top: 25px;
    left: 0;
    right: 0;

    text-align: center;

    z-index: 5;

    font-size: 31px;
    font-weight: 300;

    letter-spacing: 12px;

    color: #e9fdff;

    text-shadow:
        0 0 8px rgba(0,234,255,.8),
        0 0 30px rgba(0,234,255,.35);
}

.status {

    margin-top: 8px;

    font-size: 8px;

    letter-spacing: 4px;

    color: rgba(255,255,255,.42);
}

.status b {

    color: #00eaff;

    text-shadow:
        0 0 12px #00eaff;
}

/* =========================
   CHAT
========================= */

#chat {

    position: fixed;

    left: 15px;
    right: 15px;

    bottom: 88px;

    max-height: 25vh;

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    gap: 8px;

    z-index: 10;
}

.message {

    max-width: 82%;

    padding: 11px 14px;

    border-radius: 13px;

    font-size: 14px;

    line-height: 1.4;

    backdrop-filter: blur(15px);
}

.user {

    align-self: flex-end;

    border:
        1px solid rgba(0,234,255,.25);

    background:
        rgba(0,234,255,.055);
}

.jarvis {

    align-self: flex-start;

    border:
        1px solid rgba(0,234,255,.13);

    background:
        rgba(255,255,255,.035);
}

/* =========================
   INPUT
========================= */

.input {

    position: fixed;

    left: 15px;
    right: 15px;

    bottom: 16px;

    display: flex;

    gap: 9px;

    z-index: 20;
}

input {

    flex: 1;

    height: 52px;

    border-radius: 28px;

    padding: 0 18px;

    outline: none;

    border:
        1px solid rgba(0,234,255,.25);

    background:
        rgba(0,0,0,.8);

    color: white;

    font-size: 15px;

    backdrop-filter: blur(20px);
}

input:focus {

    border-color:
        rgba(0,234,255,.7);

    box-shadow:
        0 0 25px rgba(0,234,255,.12);
}

button {

    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    background: #00eaff;

    color: #001014;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 0 18px rgba(0,234,255,.55),
        0 0 45px rgba(0,234,255,.15);
}

button:active {

    transform: scale(.9);
}

</style>
</head>

<body>

<div class="title">

    JARVIS

    <div class="status">
        <b>●</b> NEURAL NETWORK ONLINE
    </div>

</div>

<canvas id="network"></canvas>


<div id="chat">

    <div class="message jarvis">
        Sistema online. Sono JARVIS.
    </div>

</div>


<div class="input">

    <input
        id="input"
        type="text"
        placeholder="Parla con JARVIS..."
    >

    <button id="send">
        ➤
    </button>

</div>


<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */

const canvas =
    document.getElementById("network");

const ctx =
    canvas.getContext("2d");

let width;
let height;

let dpr;


/* =====================================================
   DIMENSIONI
===================================================== */

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   RETE NEURALE
===================================================== */

const nodes = [];

const NODE_COUNT = 135;

let centerX;
let centerY;


/*
    Creiamo una rete concentrata
    al centro dello schermo.
*/

function createNetwork() {

    nodes.length = 0;

    centerX =
        width / 2;

    centerY =
        height / 2 - 20;

    const radiusX =
        Math.min(
            width * .32,
            300
        );

    const radiusY =
        Math.min(
            height * .30,
            230
        );

    for (
        let i = 0;
        i < NODE_COUNT;
        i++
    ) {

        /*
            Distribuzione casuale,
            ma più densa verso il centro.
        */

        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            Math.pow(
                Math.random(),
                .55
            );

        const x =
            centerX +
            Math.cos(angle) *
            radiusX *
            distance;

        const y =
            centerY +
            Math.sin(angle) *
            radiusY *
            distance;

        nodes.push({

            x: x,
            y: y,

            baseX: x,
            baseY: y,

            vx:
                (Math.random() - .5)
                * .08,

            vy:
                (Math.random() - .5)
                * .08,

            pulse:
                Math.random() *
                Math.PI * 2,

            size:
                Math.random() *
                1.8 +
                1.2,

            energy:
                Math.random()
        });
    }
}

createNetwork();


/* =====================================================
   IMPULSI
===================================================== */

const pulses = [];

let thinking = false;


/*
    Un impulso passa da un nodo
    a un altro.
*/

function createPulse() {

    if (
        nodes.length < 2
    )
        return;

    const start =
        Math.floor(
            Math.random() *
            nodes.length
        );

    let end =
        Math.floor(
            Math.random() *
            nodes.length
        );

    let attempts = 0;

    while (
        start === end &&
        attempts < 10
    ) {

        end =
            Math.floor(
                Math.random() *
                nodes.length
            );

        attempts++;
    }

    pulses.push({

        start:
            nodes[start],

        end:
            nodes[end],

        progress: 0,

        speed:
            thinking
            ? .018
            : .009
    });
}


/*
    Impulsi continui.
*/

setInterval(
    () => {

        const amount =
            thinking
            ? 4
            : 1;

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            createPulse();
        }

    },
    220
);


/* =====================================================
   DISEGNO
===================================================== */

function draw() {

    requestAnimationFrame(
        draw
    );

    /*
        Sfondo leggermente trasparente.
        Questo crea una piccola scia
        cinematografica.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.18)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const time =
        performance.now();


    /* ================================================
       MOVIMENTO NODI
    ================================================ */

    nodes.forEach(
        node => {

            node.x =
                node.baseX +
                Math.sin(
                    time * .0004 +
                    node.pulse
                ) * 5;

            node.y =
                node.baseY +
                Math.cos(
                    time * .00035 +
                    node.pulse
                ) * 5;

            /*
                Energia che pulsa.
            */

            node.energy =
                (
                    Math.sin(
                        time * .002 +
                        node.pulse
                    ) + 1
                ) / 2;
        }
    );


    /* ================================================
       CONNESSIONI
    ================================================ */

    for (
        let i = 0;
        i < nodes.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < nodes.length;
            j++
        ) {

            const a =
                nodes[i];

            const b =
                nodes[j];

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            /*
                Solo i nodi vicini
                vengono collegati.
            */

            if (
                distance < 105
            ) {

                const opacity =
                    (
                        1 -
                        distance / 105
                    ) *
                    (
                        thinking
                        ? .32
                        : .20
                    );

                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.strokeStyle =
                    `rgba(
                        0,
                        225,
                        255,
                        ${opacity}
                    )`;

                ctx.lineWidth =
                    thinking
                    ? .75
                    : .45;

                ctx.stroke();
            }
        }
    }


    /* ================================================
       IMPULSI
    ================================================ */

    for (
        let i = pulses.length - 1;
        i >= 0;
        i--
    ) {

        const pulse =
            pulses[i];

        pulse.progress +=
            pulse.speed;

        if (
            pulse.progress >= 1
        ) {

            pulses.splice(
                i,
                1
            );

            continue;
        }

        const x =
            pulse.start.x +
            (
                pulse.end.x -
                pulse.start.x
            ) *
            pulse.progress;

        const y =
            pulse.start.y +
            (
                pulse.end.y -
                pulse.start.y
            ) *
            pulse.progress;


        /*
            Alone luminoso
        */

        const glow =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                thinking
                ? 18
                : 12
            );

        glow.addColorStop(
            0,
            "rgba(255,255,255,.95)"
        );

        glow.addColorStop(
            .2,
            "rgba(0,240,255,.9)"
        );

        glow.addColorStop(
            1,
            "rgba(0,200,255,0)"
        );

        ctx.fillStyle =
            glow;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            thinking
            ? 18
            : 12,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
            Punto centrale
        */

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            thinking
            ? 2.8
            : 2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* ================================================
       NODI
    ================================================ */

    nodes.forEach(
        node => {

            const size =
                node.size +
                node.energy *
                (
                    thinking
                    ? 2
                    : .8
                );

            const glow =
                ctx.createRadialGradient(
                    node.x,
                    node.y,
                    0,
                    node.x,
                    node.y,
                    size * 7
                );

            glow.addColorStop(
                0,
                "rgba(255,255,255,.9)"
            );

            glow.addColorStop(
                .15,
                "rgba(0,235,255,.8)"
            );

            glow.addColorStop(
                1,
                "rgba(0,200,255,0)"
            );

            ctx.fillStyle =
                glow;

            ctx.beginPath();

            ctx.arc(
                node.x,
                node.y,
                size * 7,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "#bfffff";

            ctx.beginPath();

            ctx.arc(
                node.x,
                node.y,
                size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    );


    /* ================================================
       ANELLI ESTERNI
    ================================================ */

    drawRing(
        1,
        0.00018
    );

    drawRing(
        2,
        -0.00012
    );

    drawRing(
        3,
        0.00008
    );
}


/* =====================================================
   ANELLI
===================================================== */

let ringRotation = 0;

function drawRing(
    index,
    speed
) {

    ringRotation +=
        speed;

    const radius =
        Math.min(
            width,
            height
        ) *
        (
            .28 +
            index * .055
        );

    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );

    ctx.rotate(
        ringRotation *
        (
            index % 2
            ? -1
            : 1
        )
    );

    ctx.scale(
        1,
        .32
    );

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        `rgba(
            0,
            220,
            255,
            ${.16 / index}
        )`;

    ctx.lineWidth =
        .6;

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   AVVIO
===================================================== */

draw();


/* =====================================================
   CHAT
===================================================== */

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const chat =
    document.getElementById(
        "chat"
    );


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();
        }
    }
);


async function sendMessage() {

    const text =
        input.value.trim();

    if (
        !text
    )
        return;


    /* messaggio utente */

    const user =
        document.createElement(
            "div"
        );

    user.className =
        "message user";

    user.textContent =
        text;

    chat.appendChild(
        user
    );

    input.value = "";


    /* risposta */

    const reply =
        document.createElement(
            "div"
        );

    reply.className =
        "message jarvis";

    reply.textContent =
        "Elaborazione...";

    chat.appendChild(
        reply
    );


    /*
        Attiviamo la rete.
    */

    thinking = true;


    try {

        const response =
            await fetch(
                "https://iao-ai-v3.oceano-masoud.workers.dev/",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        const data =
            await response.json();


        reply.textContent =
            data.reply ||
            "Non ho ricevuto una risposta.";


    } catch (
        error
    ) {

        console.error(
            error
        );

        reply.textContent =
            "Errore di collegamento.";
    }


    /*
        Torniamo lentamente
        allo stato normale.
    */

    setTimeout(
        () => {
            thinking = false;
        },
        700
    );


    chat.scrollTop =
        chat.scrollHeight;
}

</script>

</body>
</html>
