<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:1
}

.header{
position:fixed;
top:22px;
width:100%;
text-align:center;
z-index:10;
pointer-events:none
}

.header h1{
margin:0;
font-size:25px;
font-weight:300;
letter-spacing:12px;
text-shadow:0 0 15px #ffd000
}

.status{
margin-top:7px;
font:10px monospace;
letter-spacing:3px
}

#dot{
color:#ffd000;
text-shadow:0 0 10px currentColor
}

.info{
position:fixed;
top:24px;
left:24px;
z-index:10;
font:10px monospace;
line-height:1.8;
letter-spacing:2px;
color:rgba(255,210,0,.55);
border-left:2px solid rgba(255,210,0,.6);
padding-left:10px
}

.info.right{
left:auto;
right:24px;
text-align:right;
border-left:0;
border-right:2px solid rgba(255,210,0,.6);
padding-left:0;
padding-right:10px
}

#chat{
position:fixed;
z-index:20;
left:50%;
bottom:110px;
transform:translateX(-50%);
width:100%;
max-width:700px;
max-height:25vh;
overflow-y:auto;
padding:0 20px;
display:flex;
flex-direction:column;
gap:10px;
scrollbar-width:none
}

#chat::-webkit-scrollbar{
display:none
}

.message{
max-width:85%;
padding:11px 15px;
border-radius:5px;
font-size:14px;
line-height:1.5;
word-wrap:break-word;
backdrop-filter:blur(10px)
}

.user{
align-self:flex-end;
background:rgba(255,190,0,.08);
border:1px solid rgba(255,190,0,.35);
border-right:3px solid #ffd000
}

.jarvis{
align-self:flex-start;
background:rgba(5,10,18,.85);
border:1px solid rgba(30,140,255,.25);
border-left:3px solid #168cff;
color:#dcecff
}

.inputArea{
position:fixed;
z-index:30;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:700px;
padding:0 20px
}

.inputBox{
display:flex;
gap:7px;
padding:5px;
background:rgba(5,7,10,.96);
border:1px solid rgba(255,190,0,.4);
border-radius:7px
}

input{
flex:1;
min-width:0;
height:44px;
padding:0 14px;
background:transparent;
border:0;
outline:0;
color:#fff;
font-size:14px
}

input::placeholder{
color:rgba(255,255,255,.3)
}

button{
height:44px;
border-radius:5px;
border:1px solid rgba(255,190,0,.5);
background:rgba(255,190,0,.1);
color:#ffd000;
font-family:monospace;
font-weight:bold;
cursor:pointer
}

button:hover{
background:#ffd000;
color:#000
}

#mic{
width:48px;
font-size:17px
}

#send{
width:70px
}

#mic.active{
background:#168cff;
border-color:#168cff;
color:#fff;
box-shadow:0 0 20px #168cff
}

#voicePanel{
position:fixed;
z-index:40;
right:20px;
bottom:80px;
display:none;
padding:12px;
background:rgba(5,8,12,.96);
border:1px solid rgba(30,140,255,.4);
border-radius:6px
}

#voiceSelect{
background:#05080c;
color:#fff;
border:1px solid #168cff;
padding:7px;
max-width:220px
}

#voiceButton{
position:fixed;
right:20px;
bottom:20px;
z-index:40;
width:42px;
font-size:16px
}

@media(max-width:600px){
.info{display:none}
.header h1{
font-size:20px;
letter-spacing:8px
}
.message{max-width:90%}
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="info">
JARVIS CORE V8<br>
NEURAL ENGINE: ONLINE<br>
SYSTEM: ACTIVE
</div>

<div class="info right">
MEMORY: <span id="memoryCount">0</span><br>
STATE: <span id="state">IDLE</span>
</div>

<div class="header">
<h1>J.A.R.V.I.S.</h1>
<div class="status">
<span id="dot">●</span>
NEURAL INTERFACE ONLINE
</div>
</div>

<div id="chat">
<div class="message jarvis">
JARVIS online. Memoria neurale inizializzata.
</div>
</div>

<div id="voicePanel">
<select id="voiceSelect"></select>
</div>

<button id="voiceButton">⚙</button>

<div class="inputArea">
<div class="inputBox">

<input
id="input"
type="text"
placeholder="Comunica con JARVIS..."
autocomplete="off">

<button id="mic">🎙</button>

<button id="send">INVIA</button>

</div>
</div>

<script>

const API="https://iao-ai-v3.oceano-masoud.workers.dev/";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const input=document.getElementById("input");
const send=document.getElementById("send");
const mic=document.getElementById("mic");
const chat=document.getElementById("chat");

const stateEl=document.getElementById("state");
const dot=document.getElementById("dot");

const memoryCount=document.getElementById("memoryCount");

const voiceButton=document.getElementById("voiceButton");
const voicePanel=document.getElementById("voicePanel");
const voiceSelect=document.getElementById("voiceSelect");

let state="idle";
let busy=false;
let listening=false;

let memory=[];

try{
memory=JSON.parse(localStorage.getItem("jarvis_memory")||"[]");
}catch(e){
memory=[];
}

memory=memory.slice(-30);

function saveMemory(){

localStorage.setItem(
"jarvis_memory",
JSON.stringify(memory.slice(-30))
);

memoryCount.textContent=memory.length;
}

function remember(role,content){

memory.push({
role,
content
});

memory=memory.slice(-30);

saveMemory();
}

saveMemory();


function setState(s){

state=s;

stateEl.textContent=s.toUpperCase();

if(s==="listening"||s==="thinking"){

dot.style.color="#168cff";

}else{

dot.style.color="#ffd000";

}
}


function addMessage(type,text){

const el=document.createElement("div");

el.className="message "+type;

el.textContent=text;

chat.appendChild(el);

chat.scrollTop=chat.scrollHeight;

return el;
}


function localCommand(text){

const t=text.toLowerCase();

if(
t.includes("che ore sono")||
t.includes("che ora è")||
t.includes("che ora e")
){

return "Sono le "+
new Date().toLocaleTimeString(
"it-IT",
{hour:"2-digit",minute:"2-digit"}
)+".";

}

return null;
}


send.onclick=sendMessage;

input.addEventListener("keydown",e=>{

if(e.key==="Enter"){
e.preventDefault();
sendMessage();
}

});


async function sendMessage(){

const text=input.value.trim();

if(!text||busy)return;

busy=true;

input.value="";

addMessage("user",text);

remember("user",text);

input.disabled=true;
send.disabled=true;
mic.disabled=true;

setState("thinking");

const local=localCommand(text);

if(local){

addMessage("jarvis",local);

remember("assistant",local);

speak(local);

finish();

return;
}


const answer=addMessage(
"jarvis",
"Elaborazione neurale..."
);


try{

const response=await fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:text,

memory:memory.slice(-20)

})

});


if(!response.ok){
throw new Error("HTTP "+response.status);
}


const data=await response.json();


if(!data.reply){
throw new Error("Risposta mancante");
}


answer.textContent=data.reply;

remember(
"assistant",
data.reply
);

speak(data.reply);


}catch(error){

console.error(error);

answer.textContent=
"Errore di connessione al Neural Core.";

setState("idle");

}


finish();

}


function finish(){

busy=false;

input.disabled=false;
send.disabled=false;
mic.disabled=false;

input.focus();

}


/* VOCE */

let voices=[];

function loadVoices(){

voices=speechSynthesis.getVoices();

voiceSelect.innerHTML="";

voices.forEach((voice,index)=>{

const option=document.createElement("option");

option.value=index;

option.textContent=
voice.name+
" — "+
voice.lang;

voiceSelect.appendChild(option);

});

const saved=
localStorage.getItem("jarvis_voice");

if(saved!==null&&voices[saved]){
voiceSelect.value=saved;
}

}


speechSynthesis.onvoiceschanged=loadVoices;

loadVoices();


voiceButton.onclick=()=>{

voicePanel.style.display=
voicePanel.style.display==="block"
?"none"
:"block";

};


voiceSelect.onchange=()=>{

localStorage.setItem(
"jarvis_voice",
voiceSelect.value
);

};


function speak(text){

if(!("speechSynthesis" in window)){
setState("idle");
return;
}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="it-IT";
u.rate=.88;
u.pitch=.65;
u.volume=1;

const index=
parseInt(voiceSelect.value);

if(voices[index]){
u.voice=voices[index];
}

u.onstart=()=>{
setState("speaking");
};

u.onend=()=>{
setState("idle");
};

u.onerror=()=>{
setState("idle");
};

speechSynthesis.speak(u);

}


/* MICROFONO */

const Recognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

let recognition=null;

if(Recognition){

recognition=new Recognition();

recognition.lang="it-IT";
recognition.continuous=false;
recognition.interimResults=true;

recognition.onstart=()=>{

listening=true;

mic.classList.add("active");
mic.textContent="■";

input.placeholder="JARVIS sta ascoltando...";

setState("listening");

};


recognition.onresult=event=>{

let text="";

for(
let i=event.resultIndex;
i<event.results.length;
i++
){

text+=
event.results[i][0].transcript;

}

input.value=text;

if(
event.results[event.results.length-1]
.isFinal
){

setTimeout(()=>{

if(input.value.trim()){
sendMessage();
}

},250);

}

};


recognition.onerror=event=>{

console.log(
"Speech recognition:",
event.error
);

};


recognition.onend=()=>{

listening=false;

mic.classList.remove("active");
mic.textContent="🎙";

input.placeholder=
"Comunica con JARVIS...";

if(state==="listening"){
setState("idle");
}

};


mic.onclick=()=>{

if(busy)return;

if(listening){

recognition.stop();

}else{

try{
recognition.start();
}catch(e){
console.log(e);
}

}

};

}else{

mic.disabled=true;

mic.title=
"Il browser non supporta il riconoscimento vocale.";

}


/* SFERA */

let width=innerWidth;
let height=innerHeight;

let cx=width/2;
let cy=height/2;

let radius=Math.min(width,height)*.22;

let rotation=0;

let nodes=[];


function resize(){

width=innerWidth;
height=innerHeight;

const dpr=
Math.min(devicePixelRatio||1,2);

canvas.width=width*dpr;
canvas.height=height*dpr;

canvas.style.width=width+"px";
canvas.style.height=height+"px";

ctx.setTransform(
dpr,0,0,dpr,0,0
);

cx=width/2;
cy=height/2;

radius=Math.min(width,height)*.22;

createNodes();

}


function createNodes(){

nodes=[];

for(let i=0;i<145;i++){

nodes.push({

theta:Math.random()*Math.PI*2,

phi:Math.acos(
2*Math.random()-1
),

r:radius*(
.7+Math.random()*.5
),

size:.8+Math.random()*1.7,

phase:Math.random()*Math.PI*2

});

}

}


function animate(){

requestAnimationFrame(animate);

const time=performance.now()/1000;

let speed=1;
let energy=.2;

if(state==="listening"){
speed=3;
energy=.9;
}

if(state==="thinking"){
speed=5;
energy=1.5;
}

if(state==="speaking"){
speed=3;
energy=.7;
}

rotation+=.004*speed;

ctx.fillStyle="rgba(0,0,0,.25)";

ctx.fillRect(
0,0,width,height
);


let target;

if(
state==="listening"||
state==="thinking"
){

target={
r:25,
g:140,
b:255
};

}else{

target={
r:255,
g:195,
b:0
};

}


window.jarvisColor=
window.jarvisColor||{
r:255,
g:195,
b:0
};


jarvisColor.r+=
(target.r-jarvisColor.r)*.05;

jarvisColor.g+=
(target.g-jarvisColor.g)*.05;

jarvisColor.b+=
(target.b-jarvisColor.b)*.05;


const r=Math.round(jarvisColor.r);
const g=Math.round(jarvisColor.g);
const b=Math.round(jarvisColor.b);


const pulse=
(Math.sin(time*4)+1)/2;


const glow=
radius*
(
1.1+
energy*.6+
pulse*.15
);


const gradient=
ctx.createRadialGradient(
cx,cy,0,
cx,cy,glow
);


gradient.addColorStop(
0,
`rgba(${r},${g},${b},.45)`
);

gradient.addColorStop(
.35,
`rgba(${r},${g},${b},.14)`
);

gradient.addColorStop(
1,
"rgba(0,0,0,0)"
);


ctx.fillStyle=gradient;

ctx.beginPath();

ctx.arc(
cx,cy,glow,0,Math.PI*2
);

ctx.fill();


const projected=[];


nodes.forEach(n=>{

const rr=
n.r+
Math.sin(time*3+n.phase)*
energy*5;

let x=
rr*
Math.sin(n.phi)*
Math.cos(n.theta+rotation);

let y=
rr*
Math.cos(n.phi);

let z=
rr*
Math.sin(n.phi)*
Math.sin(n.theta+rotation);


if(state!=="idle"){

x+=Math.sin(
time*2+n.phase
)*energy*5;

y+=Math.cos(
time*2.5+n.phase
)*energy*5;

}


const perspective=
430/(430+z);


projected.push({

x:cx+x*perspective,

y:cy+y*perspective,

z:z,

size:n.size*perspective,

alpha:Math.max(
.12,
Math.min(
1,
(z+radius)/(radius*2)
)
),

phase:n.phase

});

});


const maxDist=
state==="thinking"
?105
:78;


for(
let i=0;
i<projected.length;
i++
){

for(
let j=i+1;
j<projected.length;
j++
){

const a=projected[i];
const c=projected[j];

const dx=a.x-c.x;
const dy=a.y-c.y;

const dist=
Math.sqrt(dx*dx+dy*dy);


if(dist<maxDist){

const alpha=
(1-dist/maxDist)*
.28*
a.alpha;

ctx.beginPath();

ctx.moveTo(a.x,a.y);
ctx.lineTo(c.x,c.y);

ctx.strokeStyle=
`rgba(${r},${g},${b},${alpha})`;

ctx.lineWidth=
state==="thinking"
?.9
:.65;

ctx.stroke();

}

}

}


projected.forEach(n=>{

const p=
(Math.sin(
time*6+n.phase
)+1)/2;

const size=
n.size+
p*
(
state==="thinking"
?1.5
:.6
);


ctx.fillStyle=
`rgba(${r},${g},${b},${n.alpha*.25})`;

ctx.beginPath();

ctx.arc(
n.x,
n.y,
size*4,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle=
`rgba(255,255,245,${n.alpha})`;

ctx.beginPath();

ctx.arc(
n.x,
n.y,
size,
0,
Math.PI*2
);

ctx.fill();

});


const core=
5+
pulse*2+
energy*2;


ctx.fillStyle=
`rgba(${r},${g},${b},.35)`;

ctx.beginPath();

ctx.arc(
cx,
cy,
core*5,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
cx,
cy,
core,
0,
Math.PI*2
);

ctx.fill();

}


window.addEventListener(
"resize",
resize
);

resize();

animate();

input.focus();

</script>

</body>
   </html>
